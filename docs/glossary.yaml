  - slug: no-exact-finite-ccr
    reviewed: 2026-09-14
    hook: >
      In a world with only finitely many distinguishable states, the founding equation of
      quantum mechanics can't hold exactly, and one line of arithmetic proves it while CSD
      says precisely where the equation gives way.
    layman: >
      Position and momentum obey the most famous relation in quantum mechanics, the
      canonical commutation relation, which says that applying the two operations in
      opposite orders gives results that differ by a fixed universal amount. Everything
      characteristic of the theory, the uncertainty principle above all, flows from that
      relation. CSD holds that the world has only finitely many distinguishable states, so
      the question is whether the relation can survive in such a world.

      It can't, and the proof fits in a few sentences. In quantum mechanics, position and
      momentum are represented by square tables of numbers called matrices, and a finite
      world means finite tables. Adding up the entries along the main diagonal of a matrix
      gives a number called its trace, and the trace has a useful property, which is that
      the trace of a product of two matrices doesn't depend on the order in which they're
      multiplied. The left side of the relation is the difference between two products in
      opposite orders, so its trace is always zero. The right side is a fixed nonzero
      constant placed on every diagonal entry, so its trace is that constant times the
      number of states, which isn't zero. Zero can't equal something nonzero, so no finite
      tables can satisfy the relation.

      So any finite theory owes an account of where the relation fails, and the question
      isn't whether it fails but where.
    in_csd: >
      The corpus pays this debt exactly rather than apologising for it. The model is the
      truncated oscillator, the harmonic oscillator, the standard quantum model of
      vibration, with its infinite ladder of energy levels cut off at a finite top rung.
      On that ladder the relation holds perfectly on every energy level except the very
      top one, where it fails by a single localised defect of precisely the size the trace
      argument demands. The defect isn't noise to be minimised, as it's the exact
      compensation the counting requires, pushed into the one place a finite ladder must
      end.

      For any state a laboratory can actually prepare, with negligible population at the
      top rung, the departure is invisible. The result is deliberately stated without
      reference to CSD's own assumptions, because the obligation binds every finite-
      dimensional reconstruction of quantum mechanics, so a rival programme claiming
      finiteness inherits the same debt whether or not it has noticed.
    mathematical: >
      No finite matrices satisfy [Q,P] = c times identity with c nonzero, as the trace of
      a commutator vanishes while the trace of c times identity is c times the dimension.
      As a corollary, the constant can't be i h-bar in finite dimension, and the corpus
      theorem is no_exact_finite_ccr.

      The companion construction gives the sharp positive statement, a conjugate pair on
      the N-level oscillator whose commutator is exactly i everywhere except the top Fock
      level, where a rank-one defect of magnitude N sits, which is exactly what makes the
      trace vanish.
    term: No exact finite-dimensional CCR
    status: proved-in-corpus
    lean:
      module: CsdLean4/CV/ApproxCCR.lean
      theorem: no_exact_finite_ccr
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-limits
      text: >
        The scope page is explicit that the reconstruction is finite-dimensional, which is what this
        obstruction is about
    related: [field-arena, wick-theorem, hermitian-operator, robertson-uncertainty, lie-trotter-formula]

  - slug: canonical-typicality
    reviewed: 2026-09-29
    image:
      file: img/canonical-typicality.jpg
      alt: "Portrait photograph of Ludwig Boltzmann"
      caption: "Ludwig Boltzmann."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Boltzmann2.jpg
      article: https://en.wikipedia.org/wiki/Ludwig_Boltzmann
    hook: >
      A small piece of a large quantum system looks thermal not because anything prepared
      it that way, but because almost every state of the whole makes it look that way.
    layman: >
      Statistical mechanics traditionally starts with an ensemble, an imagined collection
      of copies of a system weighted by probability, from which yours is somehow drawn.
      But your coffee isn't an ensemble, as it's one cup in one state, so you can ask why
      reasoning about imaginary collections should say anything true about one actual cup.

      Canonical typicality dissolves the embarrassment. Take one large system in a single
      definite quantum state, with no ensemble and no drawing, and look at a small piece
      of it, meaning everything you could observe by measuring that piece alone. For the
      overwhelming majority of possible states of the whole, the piece looks thermal, so
      its statistics are exactly those of a system in equilibrium with a heat bath.
      Calling a majority overwhelming requires a way of measuring how much of the space of
      states a set of states occupies, and the natural volume on that space provides it.

      You don't need to assume equilibrium statistics, as you need only fail to be in an
      astronomically unlikely global state. Equilibrium, on this view, isn't a physical
      process that happened to you. It's a statement about how much room there is in the
      space of states, and how little of that room the exceptions occupy.
    in_csd: >
      This is where the programme touches mainstream statistical mechanics, and the
      traffic goes both ways. Inbound, thermal behaviour is volume in the space of states,
      exactly as the Born weights are volume, so thermodynamics is native to the
      construction and one measure does both jobs.

      Outbound, the literature's standing complaint about canonical typicality is that its
      measure is an unmotivated prior, as nobody says what most looks like or who chose
      the ruler. CSD has an answer nobody else has, which is that the ruler is the natural
      volume of the substrate, CSD's own underlying state space, with a uniqueness theorem
      behind it. That turns the programme's central manoeuvre into a contribution to
      someone else's open problem.

      The corpus is precise about what it establishes. It has the average statement, that
      the piece is thermal on average over global states, and it has concentration at a
      polynomial rate for diagonal statistics, meaning that a single sample does see the
      thermal value, up to the guarantee Chebyshev's inequality gives, which is a general
      bound on how far a quantity can stray from its average given its spread. The
      exponential rate the literature headlines is the one piece still owed, and none of
      this is dynamical thermalisation, which would need mixing assumptions and lies
      outside the scope.
    mathematical: >
      For a global pure state drawn from the Fubini-Study measure, the average reduced
      state of a tensor subsystem is exactly maximally mixed, which is the first theorem,
      the expectation statement (canonical_typicality_expectation).

      The second is concentration at polynomial rate. The Fubini-Study second moments turn
      out to be pure symmetry algebra, as a two-coordinate Hadamard rotation, a sign flip
      and a quarter-phase force E[x_i^2] = 2/(N(N+1)) and E[x_i x_j] = 1/(N(N+1)) with no
      integral ever computed, so every diagonal statistic has variance O(1/N) and
      Chebyshev makes a single sample typical (fs_chebyshev_concentration).

      The literature's headline rate, exponentially close to one, needs Levy's lemma,
      concentration of measure on high-dimensional spheres, which the proof assistant's
      library doesn't carry, so that deviation-rate upgrade is recorded as a named
      residual rather than papered over. None of this is dynamical thermalisation, which
      would need mixing assumptions and is out of scope.
    person: >
      The modern result has two independent birth certificates, both from 2006. Goldstein,
      Lebowitz, Tumulka and Zanghi came from the Rutgers-Bochum-Genoa axis of the Bohmian
      school, which had kept typicality arguments alive through decades of unfashion, and
      Popescu, Short and Winter came from quantum information at Bristol and Cambridge. It
      was the same theorem in two vocabularies, from two communities that barely cited
      each other.

      The idea itself is older. Schrodinger sketched it in the 1920s, and von Neumann
      proved a version in 1929 that was misunderstood, mistranslated and dismissed for
      eighty years before being rehabilitated. Few results have been discovered this many
      times.
    term: Canonical typicality
    status: proved-in-corpus
    lean:
      module: CsdLean4/Thermo/CanonicalTypicality.lean
      theorem: canonical_typicality_expectation
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-2
      text: >
        The second primer page is the plain-language version of typicality doing probability's work
    related: [gibbs-state, typicality, von-neumann-entropy, fubini-study-measure, kms-condition]

  - slug: bargmann
    reviewed: 2026-09-14
    hook: >
      One phase survives every change of convention, the phase of the product of three
      overlaps taken around a cycle, and it's also the fingerprint that tells a unitary
      symmetry from an anti-unitary one.
    layman: >
      A quantum state is described by a list of complex numbers, its amplitudes. A complex
      number has a size and a direction, and the direction is called its phase. If you
      multiply every amplitude of a state by the same complex number of size one, which
      rotates all the phases by the same angle, no measurement on that state changes, so
      the overall phase of a state is pure convention and phases look like bookkeeping to
      be discarded. Yet geometric phases, the phases a state picks up when it's carried
      around a loop, are measurable physics, so you can ask which phases are real.

      Bargmann's invariant is the minimal answer. Any two states have an overlap, a
      complex number that records how much they resemble each other, and its size fixes
      how easily the two states can be confused while its phase depends on the conventions
      chosen for both. Take three states and multiply their overlaps around the cycle,
      first to second, second to third, third back to first. Each state's arbitrary phase
      enters that product twice, once as itself and once with its sign reversed, so the
      two appearances cancel and what remains is independent of every convention. It's the
      smallest phase that's genuinely there.

      This is the ancestor of every geometric phase. Carry a state slowly around a loop
      and the extra phase it acquires is this invariant, applied step by step along the
      edges of the loop.
    in_csd: >
      The corpus uses the invariant as a fingerprint in its Wigner analysis. A symmetry of
      quantum mechanics is a transformation of states that preserves every measurement
      probability, and Wigner's theorem says such symmetries come in exactly two families,
      the unitary ones, which preserve phases, and the anti-unitary ones, which reverse
      them, as time reversal does. The invariant tells the families apart, because
      unitaries leave it unchanged while anti-unitaries reverse it, and that's what lets
      the choice between the two branches in the rigidity theorem be decided at each point
      rather than assumed.

      Bargmann's theorem is a separate result, and the corpus gets what it needs from it
      without proving the general case. Wigner's theorem hands you each symmetry with an
      undetermined phase, and when two symmetries are applied in succession the phases
      needn't match up, so the mismatch is a leftover factor that can spoil any attempt to
      assign one consistent phase to every symmetry. Bargmann's theorem says continuity
      removes the leftover, so a family of symmetries defined only up to phase lifts to a
      genuine family with consistent phases. In general that's hard to prove. The corpus
      only ever needs it for a one-parameter group, a family of symmetries labelled by a
      single continuous number such as time, and there the obstruction isn't merely
      surmountable but absent.

      The reason is that the real line has no loops. Any continuous phase along it can be
      unwound without obstruction, and the only freedom left over is a quantity that can
      take finitely many values yet must vary continuously, so it can't vary at all and is
      absorbed by a rescaling. The consequence for the programme is that a phase
      consistency condition which would otherwise have to be assumed is proved instead.
      Together with the finite-dimensional Stone theorem, which turns a continuous one-
      parameter family of unitary symmetries into a Hamiltonian generator, this means
      continuity of the flow alone delivers Schrodinger evolution.
    mathematical: >
      For rays u, v, w the invariant is the phase of the product of pairwise overlaps
      around the cycle. It's invariant under independent rescaling of each representative,
      since each scale factor appears once plainly and once conjugated, and it's preserved
      by unitaries and conjugated by anti-unitaries, which is exactly the discriminator
      the rigidity proof needs.

      The one-parameter lift is a separate statement, proved in the corpus as
      `exists_continuous_phase_trivialisation`. Given a continuous U with U(s+t) = c(s,t)
      U(s) U(t), it produces a continuous unit-modulus b with c(s,t) b(s+t) = b(s) b(t).
      Determinants give d(s+t) = c(s,t)^N d(s) d(t) on the circle, the covering lift
      through `Circle.exp` gives a continuous theta with d = exp(i theta), and b0 = exp(-i
      theta / N) then leaves a residual with Nth power one, which is constant by
      connectedness and absorbed by rescaling. The coboundary datum is thereby discharged
      rather than carried as a hypothesis of the phase lift, and the proof depends only on
      the foundational axiom triple.
    person: >
      Valentine Bargmann (1908-1989) was born in Berlin, left in 1933 when the dismissals
      began, and finished his doctorate in Zurich under Wentzel and Pauli. He emigrated in
      1937 and joined the Institute for Advanced Study as Einstein's assistant, working
      with him daily, before moving to the Princeton faculty for the rest of his career.

      His 1954 paper on projective representations answered the question Wigner's theorem
      leaves open, as the theorem hands you a symmetry with an undetermined phase and
      Bargmann settled when the phases can all be chosen consistently. He also worked out
      representations of the Lorentz group with Wigner, and he was by all accounts a
      concert-grade pianist who had considered the other career.
    term: Bargmann invariant
    eponyms: [Bargmann]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/Analysis/Matrix/ProjectiveLift.lean
      theorem: exists_continuous_phase_trivialisation
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Wigner%27s_theorem
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper C reconstructs the projective structure this invariant is defined on
    related: [wigner-rigidity, schrodinger-from-records, stone-theorem, projective-sector, hilbert-space]

  - slug: bloch-sphere
    image:
      file: img/bloch-sphere.png
      wide: true
      alt: "Diagram of the Bloch sphere with a state vector and its angles"
      caption: "The Bloch sphere: a pure qubit state as a point, with |0⟩ at the north pole and |1⟩ at the south."
      credit: "Notezik, CC0, via Wikimedia Commons"
      licence: "CC0"
      source: https://commons.wikimedia.org/wiki/File:Bloch_Sphere_representation.svg
      article: https://en.wikipedia.org/wiki/Bloch_sphere
    hook: >
      The states of the simplest quantum system form an ordinary ball, which is a lovely
      accident of low dimension and the single most misleading picture in quantum
      mechanics.
    layman: >
      A qubit is the simplest quantum system, one with just two perfectly distinguishable
      states, and its possible states map exactly onto an ordinary sphere. The map is
      useful. Measurement settings are directions in space, two perfectly distinguishable
      states sit at opposite poles, and the angle between two points sets the statistics
      of measuring one when the other was prepared. States of incomplete knowledge, called
      mixed states, fill the interior, with the state of complete ignorance, the coin
      flip, at dead centre, so every quantum intuition you can have in three dimensions
      you can have here.

      Then comes the trap, as all of that is an accident of having two levels. Go to a
      system with three distinguishable states and its state space isn't a sphere, isn't
      any familiar shape, and supports none of the same tricks, so the picture that
      teaches everyone the subject also quietly teaches them falsehoods about the general
      case.

      Both halves matter. Use the sphere, and know when to put it down.
    in_csd: >
      The corpus computes on the sphere wherever qubits appear, in the Bell settings, the
      singlet correlations and the qubit Born rule, and it flags the accident explicitly
      rather than trading on it. For two levels the projective space, the space of
      physically distinct pure states, is itself a sphere, so structure that in general
      has to be placed in a fibre above the state space, extra data attached over each
      state, can sit on the space itself, and nothing warns you that this is happening.

      The programme's fibre analysis makes the warning concrete. Contextual content, the
      part of the theory that makes an outcome depend on which other measurements
      accompany it, can live on the base for two levels purely because of this accident,
      and from three levels up the natural ways of keeping it there stop working. That
      finding narrowed the programme's own claims. The sphere is where everyone's
      intuition is formed, and the corpus treats it with corresponding care.
    mathematical: >
      CP^1 is diffeomorphic to the two-sphere, antipodal points are orthogonal states, the
      Fubini-Study measure is the normalised round area, and trace distance is half the
      Euclidean chord. Mixed states fill the closed ball.

      For N above two, CP^(N-1) isn't a sphere, has nontrivial topology, and admits no
      comparable elementary picture, which is precisely why qubit-calibrated intuition
      transfers badly and why the corpus's results for N at least three needed different
      methods.
    person: >
      Felix Bloch (1905-1983) was born in Zurich, studied at the ETH, and took his
      doctorate under Heisenberg at Leipzig with a thesis that founded the band theory of
      solids. Being Jewish, he left Germany in 1933 and settled at Stanford for the rest
      of his career, with war work at Los Alamos and on radar at Harvard.

      The sphere comes from his work on spins precessing in magnetic fields, the basis of
      nuclear magnetic resonance, for which he shared the 1952 Nobel Prize with Purcell
      and which became MRI. He also served as CERN's first Director-General in 1954,
      lasting about a year before deciding that administration wasn't physics. Quantum
      information adopted his sphere decades later.
    term: Bloch sphere
    eponyms: [Bloch]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Bloch_sphere
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-3
      text: The third primer page explains why the space of states has the structure it does
    related: [pauli-matrices, fubini-study-measure, hilbert-space, stern-gerlach, ramsey-interferometry]

  - slug: borel-set
    image:
      file: img/borel-set.jpg
      alt: "Portrait photograph of Émile Borel"
      caption: "Émile Borel in 1932."
      credit: "Agence de presse Mondial Photo-Presse, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Emile_Borel-1932.jpg
      article: https://en.wikipedia.org/wiki/%C3%89mile_Borel
    hook: >
      Before any region can have a probability, someone has to say which regions are
      allowed to have a size at all, and the Borel sets are the answer everyone uses.
    layman: >
      Not every collection of points can be assigned a size, and this genuinely shocked
      mathematics when it surfaced. If you insist that every set has a volume you get
      contradictions, most famously a solid ball that can be cut into five pieces and
      reassembled into two balls each the same size as the original.

      The repair is to be selective. Fix a family of well-behaved sets, starting from
      simple ones like intervals, and allow yourself to combine them in countably many
      steps, so you take the union of a sequence of sets, take the complement of a set,
      and repeat, and you only ever measure sets built this way. That family is the Borel
      sets.

      The restriction sounds drastic and costs nothing, as every region you could
      describe, draw or physically distinguish is a Borel set. The pathological sets need
      the axiom of choice, a principle allowing selections no rule could specify, so they
      can be proved to exist but never exhibited, and probability theory lives happily
      inside the fence.
    in_csd: >
      Every measure in the corpus is a Borel measure, whether on the state space or on the
      group of unitary transformations, and every outcome region whose volume becomes a
      Born weight is a Borel set. This isn't decoration, as the programme's central claim
      is a statement about the measures of regions, and it would be meaningless for
      regions that have no measure.

      One detail the constructions lean on is that the boundaries between outcome regions
      are null sets, meaning sets of volume zero. A state sitting exactly on a boundary is
      ambiguous about which outcome it belongs to, but the ambiguity has probability zero,
      so no prediction ever depends on resolving it.
    mathematical: >
      The Borel sigma-algebra of a topological space is the sigma-algebra generated by its
      open sets, the smallest family that contains the open sets and is closed under
      complements and countable unions.

      The corpus's measures are Borel probability measures on the projective space
      CP^(N-1) and on the unitary group U(N), and the outcome regions are Borel sets with
      Fubini-Study-null boundaries. The null-boundary fact is used in the proofs and not
      just noted.
    person: >
      Emile Borel (1871-1956) was born at Saint-Affrique in the Aveyron, a pastor's son,
      and topped the entrance examinations for both the Ecole Normale Superieure and the
      Ecole Polytechnique, choosing the Normale to the Polytechnique's lasting chagrin. He
      taught at Lille and then in Paris, at the Normale and the Sorbonne, and founded
      measure theory around 1898.

      His second life was public, as a Radical-Socialist deputy in the Chamber, Minister
      of the Navy in 1925, and, at seventy, a Resistance activist, which earned him a
      spell in Vichy detention and, after the war, the Resistance Medal. The infinite
      monkey theorem is his image, from a 1913 paper. Few mathematicians have run a
      ministry, and fewer still after founding a field.
    term: Borel set
    eponyms: [Borel]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Borel_set
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: TN0 fixes the measure-theoretic conventions the corpus uses
    related: [outcome-region, epistemic-measure, liouville-measure, euclidean-space, typicality-volume]

  - slug: cglmp-inequality
    image:
      file: img/cglmp-inequality.jpg
      alt: "Portrait photograph of Nicolas Gisin"
      caption: "Nicolas Gisin, the G of CGLMP."
      credit: "Bigi111, CC BY-SA 4.0, via Wikimedia Commons"
      licence: "CC BY-SA 4.0"
      source: https://commons.wikimedia.org/wiki/File:Nicolas_Gisin_201508.jpg
      article: https://en.wikipedia.org/wiki/Nicolas_Gisin
    hook: >
      Bell's inequality is built for measurements with two outcomes, so once you go beyond
      two you need a new inequality, and the conflict with local realism grows stronger
      rather than weaker.
    layman: >
      A Bell inequality is a bound on how strongly the results of measurements on two
      separated systems can be correlated if every result is fixed in advance and no
      influence travels between the systems, a picture called local realism. Quantum
      mechanics breaks the bound, and experiments agree with quantum mechanics. Bell's
      argument, as usually stated, assumes each measurement has exactly two possible
      results, while real systems often have three, or five, or any number, so you can ask
      whether the conflict with local realism survives when outcomes multiply or whether
      it's an artefact of the two-outcome case.

      It survives, and it takes a new inequality to say so, the CGLMP inequality, one for
      each number of outcomes. The surprise is the direction of travel, as the violation
      grows with the number of outcomes, so higher-dimensional systems disagree with local
      realism more strongly and not less.

      There was a second surprise in the same paper. The state that violates the
      inequality most isn't the maximally entangled one, so the state that's most
      entangled by the standard bookkeeping isn't the state most at odds with common
      sense, which is a warning that entanglement isn't a single number.
    in_csd: >
      The corpus carries the inequality so that its contextuality results don't lean on
      two-level systems, which are special in ways that keep surprising people. There's
      also a structural echo worth noticing. Three outcomes is precisely where the
      corpus's own fibre analysis finds the natural base-only constructions stop working,
      which is why it places contextual content in the fibre above the base, and that
      placement is a judgement against a tight chain of constraints and not a proved
      dichotomy.

      So the dimension where this inequality becomes necessary is the dimension where the
      programme's geometry changes character. That's either a coincidence or a hint, and
      the honest label for now is coincidence.
    mathematical: >
      A Bell-type inequality for bipartite systems with d outcomes per side, violated by
      quantum mechanics for every d at least two, with the maximal violation increasing in
      d.

      The maximising state isn't maximally entangled, which remains one of the sharpest
      reminders that entanglement measures and non-locality measures order states
      differently.
    person: >
      Daniel Collins, Nicolas Gisin, Noah Linden, Serge Massar and Sandu Popescu published
      the inequality in Physical Review Letters in 2002, with Gisin at Geneva, Popescu and
      Linden at Bristol, Massar in Brussels, and Collins a Bristol student. Five authors
      across four institutions for four pages of paper is a snapshot of how the European
      quantum information community actually worked in those years, by email and short
      visits, with the inequality named for the initials of whoever was on the manuscript
      when it converged.
    term: CGLMP inequality
    eponyms: [CGLMP]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://doi.org/10.1103/PhysRevLett.88.040404
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-claims
      text: >
        The current-claims page lists the Bell-violating correlations this inequality generalises
    related: [bell-chsh, tsirelson-bound, mermin-inequality, gisin-theorem, contextuality]

  - slug: deutsch-jozsa
    image:
      file: img/deutsch-jozsa.jpg
      alt: "Portrait photograph of David Deutsch"
      caption: "David Deutsch."
      credit: "Simon Benjamin, CC BY 3.0, via Wikimedia Commons"
      licence: "CC BY 3.0"
      source: https://commons.wikimedia.org/wiki/File:David_Deutsch_(cropped).jpg
      article: https://en.wikipedia.org/wiki/David_Deutsch
    hook: >
      The Deutsch-Jozsa algorithm settles a question with a single query where any exact
      classical method needs exponentially many, and the problem it solves is useless by
      design and historic for exactly that reason.
    layman: >
      The problem is deliberately artificial. A black box computes a function that's
      promised to be one of two kinds, constant, giving the same answer on every input, or
      balanced, giving one answer on exactly half the inputs and the other answer on the
      rest, and your job is to decide which kind it is while asking the box as few
      questions as possible.

      Classically, certainty is expensive, as in the worst case you must check just over
      half of all inputs, and the number of inputs grows exponentially with the size of
      the problem. A quantum procedure asks once. It queries the box on a superposition of
      all inputs at the same time, a single state in which every input is present with
      some amplitude, and it arranges the interference between those amplitudes so that a
      constant function and a balanced function produce perfectly distinguishable
      outcomes.

      Nobody has ever needed to solve this problem, and that was never the point. The
      point was existence, as here is a task where quantum computation provably beats
      classical computation, and others walked through the door it opened.
    in_csd: >
      This is one of the corpus's algorithm witnesses, and the corpus is precise about
      what such witnesses are for. They're scope evidence and not foundations, as the
      algorithms presuppose the unitary-evolution pillar rather than support it, and their
      theorems concern circuit semantics and query counts and not where quantum mechanics
      comes from.

      What they demonstrate is that the formalised machinery is the real thing, strong
      enough to express and verify genuine algorithms with their amplitude bookkeeping
      intact, and not a fragment tuned to make the foundational theorems pass. A
      reconstruction of quantum mechanics that couldn't run a quantum algorithm would
      invite a fair question.
    mathematical: >
      One oracle query decides constant-versus-balanced with certainty, whereas exact
      classical algorithms need 2^(n-1)+1 queries in the worst case for an n-bit input.

      The honest footnote is that if the classical side is allowed a tiny error
      probability, a handful of random queries suffice, so the exponential separation is
      against exact classical computation. The problem was built to exhibit a separation,
      and it does exactly that much.
    person: >
      David Deutsch, born in Haifa in 1953, studied at Cambridge and Oxford and has
      remained at Oxford's Clarendon Laboratory in a famously unusual arrangement, largely
      unsalaried, without teaching duties, working from home. The universal quantum
      computer is his 1985 construction, and this algorithm came in 1992 with Richard
      Jozsa, later of Bristol and Cambridge.

      Deutsch is also the most committed Everettian alive, and he has argued in print that
      quantum computation is evidence for many worlds, asking where else the computation
      would happen. Most of the field declines the inference, and this programme, being
      single-trajectory, rejects it outright. The algorithm works either way, which is
      rather the point against the argument.
    term: Deutsch-Jozsa algorithm
    eponyms: [Deutsch, Jozsa]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Deutsch%E2%80%93Jozsa_algorithm
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-limits
      text: The scope page explains why the algorithm layer supports nothing in the foundations
    related: [bernstein-vazirani, simon-algorithm, grover-algorithm, hadamard-test, quantum-fourier-transform]

  - slug: dirichlet-distribution
    image:
      file: img/dirichlet-distribution.jpg
      alt: "Portrait of Peter Gustav Lejeune Dirichlet"
      caption: "Peter Gustav Lejeune Dirichlet."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Peter_Gustav_Lejeune_Dirichlet.jpg
      article: https://en.wikipedia.org/wiki/Peter_Gustav_Lejeune_Dirichlet
    hook: >
      Being fairly ignorant about proportions that must add up to one has a precise
      mathematical form, and by a small miracle it's exactly the form that quantum state
      space flattens into.
    layman: >
      Suppose you want to pick a random set of proportions, say the way a unit of
      probability splits across several possible outcomes. You can't pick each share
      independently, because the shares are chained together and must total one, so if you
      pick the first freely the others feel it.

      The Dirichlet family is the standard machinery for randomness under exactly that
      constraint, and its flat member is the fair one, as every legal way of dividing the
      whole is weighted equally. It's what a statistician writes down to express complete
      ignorance about a set of proportions, a starting assumption declared openly before
      any data arrive.

      Usually, then, it enters an analysis as a modelling choice. What earns it a page
      here is that it enters CSD's story in a completely different way, as a computed
      consequence and not a choice.
    in_csd: >
      Take a quantum state and compress it down to its outcome probabilities for a given
      measurement, forgetting the phases, and then ask what the natural volume on the
      space of states looks like after the compression. The answer, by the Duistermaat-
      Heckman theorem, a result about how symmetric curved spaces project onto flat ones,
      is the flat Dirichlet distribution exactly, so the curved geometry of state space
      projects to perfect fairness on the set of all possible proportions.

      This is the workhorse behind the Born result for systems with any number of levels,
      as it converts curved volume ratios into elementary volumes of flat regions. It also
      carries a small philosophical sting. The distribution statisticians must assume, the
      geometry here derives, and nobody chose fairness as it fell out of symmetry.
    mathematical: >
      The Dirichlet family lives on the probability simplex, indexed by positive
      concentration parameters, and setting all parameters equal to one gives flat
      Lebesgue measure on the simplex.

      The theorem is that the pushforward of the Fubini-Study measure on CP^(N-1) along
      the (normalised) moment map is this flat member, at general N. It's a computed
      identity, with the M-factorial normalisation explicit.
    person: >
      Peter Gustav Lejeune Dirichlet (1805-1859) was born at Duren, between Aachen and
      Cologne, to a family of Belgian descent, and studied in Paris, where he reportedly
      kept Gauss's Disquisitiones under his pillow, having found the one book too
      expensive to buy and too essential to return. He worked at Breslau, then for nearly
      thirty years in Berlin, and then took Gauss's own chair at Gottingen in 1855, which
      he held for only four years before his death.

      The modern concept of a function, any rule and not necessarily a formula, is
      substantially his, as are the pigeonhole principle and the first rigorous
      convergence proof for Fourier series. The distribution bearing his name arose from
      an integral he evaluated, and the statistics came much later and kept the name.
    term: Dirichlet distribution
    eponyms: [Dirichlet]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Dirichlet_distribution
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper B's pushforward of the projective measure is this distribution
    related: [fubini-study-measure, born-volume-ratio, duistermaat-heckman, typicality-volume, haar-measure]

  - slug: elitzur-vaidman
    image:
      file: img/elitzur-vaidman.png
      wide: true
      alt: "Diagram of the Elitzur-Vaidman bomb-testing interferometer"
      caption: "The bomb tester: a Mach-Zehnder interferometer with the bomb B in one arm and detectors C and D at the exits."
      credit: "Gizm0steve, CC BY-SA 4.0, via Wikimedia Commons"
      licence: "CC BY-SA 4.0"
      source: https://commons.wikimedia.org/wiki/File:E-V_bomb-testing_2.svg
      article: https://en.wikipedia.org/wiki/Elitzur%E2%80%93Vaidman_bomb_tester
    hook: >
      You can certify that a bomb is live without a single photon touching it, so the
      absence of an interaction becomes the measurement.
    layman: >
      The problem, as its inventors stated it, is this. You have a batch of bombs, each
      with a trigger so sensitive that a single photon sets it off, and some are duds
      where the trigger is missing and light passes through harmlessly. Your job is to
      find a live bomb. Testing means shining light on it, and shining light on a live one
      destroys it, so classically the task is hopeless, because any bomb you've verified
      you've also detonated.

      Quantum mechanics finds a way through, using an interferometer, a device that splits
      a single photon so it travels along two paths at once and then recombines the paths
      so they interfere. A dud changes nothing, so the paths interfere as usual and a
      particular dark output port stays dark. A live bomb spoils the interference merely
      by being capable of absorbing the photon, and it does so even on runs where nothing
      was absorbed, so when the dark port clicks you hold a certified live bomb that no
      photon ever touched.

      The basic scheme certifies a quarter of the live bombs and sacrifices half, and
      cleverer versions push the efficiency as close to perfect as you like.
    in_csd: >
      This is one of the corpus's empirical twins, and it's among the sharpest tests an
      account of quantum mechanics can face, because it forces a definite statement about
      the path not taken. A story in which the photon simply went one way must explain how
      an object sitting in the other, untravelled arm changed the outcome, and a story in
      which nothing was definite must explain what the final record is a record of.

      CSD routes its answer through the epistemic regions rather than through a story
      about paths. In CSD each measurement outcome corresponds to a region of the space of
      states, and the record is read against those regions, so the presence of the
      absorber reshapes the region structure the record is read against and the volume
      bookkeeping does the rest. The point of carrying the case explicitly is that
      reproducing this experiment is a genuine constraint and not a formality.
    mathematical: >
      An interferometer in which an absorbing object in one arm destroys the interference,
      so a detection at the normally dark port certifies the object's presence without
      absorption. The base efficiency is one quarter certified and one half destroyed.

      Kwiat-style iterated variants exploit the quantum Zeno effect to drive the certified
      fraction arbitrarily close to one.
    person: >
      Avshalom Elitzur and Lev Vaidman published the bomb tester in Foundations of Physics
      in 1993. Vaidman, of Tel Aviv University, is a career foundations physicist, the co-
      inventor of weak measurements with Aharonov and Albert, and a cheerful, combative
      Everettian. Elitzur is the wilder card, as he had no doctorate at the time, worked
      outside the standard track, and was later associated with Bar-Ilan and a private
      institute, with interests running to time and thermodynamics.

      The idea was realised in the laboratory within two years, by Kwiat, Weinfurter,
      Herzog, Zeilinger and Kasevich at Innsbruck in 1995, using down-converted photons
      rather than bombs, to general relief.
    term: Elitzur-Vaidman bomb tester
    eponyms: [Elitzur, Vaidman]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Elitzur%E2%80%93Vaidman_bomb-tester
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-4
      text: The fourth primer page explains the visibility and isolation this experiment plays with
    related: [mach-zehnder, hong-ou-mandel, collapse, what-happens-during-measurement, de-isolation]

  - slug: euclidean-space
    image:
      file: img/euclidean-space.jpg
      alt: "Painting of Euclid holding a scroll of geometric figures"
      caption: "Euclid, as imagined by Jusepe de Ribera around 1630."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Italian_-_Euclid_-_Google_Art_Project.jpg
      article: https://en.wikipedia.org/wiki/Euclid
    hook: >
      Ordinary geometry, extended to complex numbers, is the stage on which every finite
      quantum system in the corpus stands.
    layman: >
      Quantum mechanics needs geometry, meaning lengths, angles and the whole toolkit. But
      its amplitudes, the numbers that describe a state, are complex numbers, and naive
      geometry over complex numbers gives complex lengths, which mean nothing, so the
      problem is small but real.

      The fix is the complex inner product, a rule for pairing two vectors to produce a
      single number. It's arranged so that any vector paired with itself yields a real,
      positive quantity, its squared length, while two different vectors can pair to
      something complex. That leftover complex phase isn't a defect, as it's where
      interference lives, the single structural feature that separates quantum
      superposition from classical mixing.

      Finite-dimensional complex Euclidean space is just this, in any finite number of
      dimensions. Nothing about it is exotic, and the exotic things are built on top of
      it.
    in_csd: >
      This is the base camp and not a claim. State vectors live in finite-dimensional
      complex Euclidean space, and operators are matrices on it. The objects that carry
      content are built overhead, the projective space of rays, in which two vectors
      differing only by an overall phase count as one state because they're physically
      identical, and the forced measure on that space.

      The finiteness is a decision and not a convenience, as the corpus is finite-
      dimensional everywhere on purpose. Completeness comes free, the pathologies of
      infinite dimension never arise, and the price is paid honestly in one place, as the
      exact canonical commutation relation is impossible, with the failure located and
      quantified rather than hidden.
    mathematical: >
      A finite-dimensional complex inner product space, realised as the L2 structure on
      functions from a finite index type, with matrices carrying the induced operator
      norm.

      Completeness is automatic, so Hilbert-space subtleties vanish, and the corpus's
      continuous-variable work approximates infinite dimension at an explicit finite
      cutoff instead of importing it.
    person: >
      Euclid of Alexandria worked around 300 BC under Ptolemy I. Almost nothing personal
      is known, and the anecdotes, such as the reply that there's no royal road to
      geometry, are late inventions. The work is another matter, as the Elements organised
      Greek geometry and number theory into definitions, postulates and deductions, and it
      stayed a live textbook for over two thousand years, the longest run any book has had
      in science.

      Every formal proof, this corpus's included, is downstream of that template. Its most
      productive failure was the fifth postulate, which resisted derivation for two
      millennia because it's independent of the others, and that discovery gave us non-
      Euclidean geometry and eventually the curved spaces on which both relativity and
      this glossary's state space stand.
