  - slug: measurement-problem
    reviewed: 2026-09-14
    image:
      file: img/measurement-problem.png
      wide: true
      alt: "Cartoon of the Schrödinger's cat thought experiment"
      caption: "Schrödinger's cat: the box, the vial, the trigger, and a cat that the formalism describes as both."
      credit: "Dhatfield, CC BY-SA 3.0, via Wikimedia Commons"
      licence: "CC BY-SA 3.0"
      source: https://commons.wikimedia.org/wiki/File:Schrodingers_cat.svg
      article: https://en.wikipedia.org/wiki/Schr%C3%B6dinger's_cat
    hook: >
      Quantum mechanics contains two incompatible rules of change and no instruction for
      when to switch between them, and CSD replaces the switch with theorems about what no
      dynamics can do.
    layman: >
      Left alone, a quantum system evolves smoothly and reversibly, keeping every
      superposition intact, where a superposition is a state that combines several
      possible outcomes at once with none of them selected. Measured, the system delivers
      one definite outcome and the alternatives vanish. The theory contains both
      behaviours and refuses to say where one ends and the other begins, so you're left
      asking what counts as a measurement, whether a detector, an eyeball or a graduate
      student.

      This isn't a philosophical itch, as the two rules are mathematically incompatible.
      The first is linear, so combinations of states evolve into the same combinations of
      their evolved parts, and reversible, so the motion can be run backwards, and the
      second is neither. A theory that holds both without a boundary between them isn't a
      closed description of anything.

      Every serious interpretation is, at bottom, a proposal for which rule to sacrifice.
      Many-Worlds keeps the smooth evolution and drops definite outcomes, and collapse
      theories keep the outcomes and modify the evolution. The question is old, unresolved
      and entirely legitimate.
    in_csd: >
      CSD's move is that nothing abrupt ever happens on the substrate. The underlying
      motion is deterministic and volume-preserving throughout, meaning that it carries
      any region of the underlying state space to a region of the same size, and what
      changes at a measurement is which region of the epistemic space, the space of
      quantum states, the trajectory gets recorded against. Both textbook rules become
      views of one process.

      What keeps this from being just another story is a trilemma, three theorems that
      stake out what any account must give up. No volume-preserving map implements exact
      collapse. No continuous dynamics correlates a pointer, the apparatus's readout,
      perfectly everywhere on a connected arena, a state space in one piece. And
      approximate collapse has a stated price, as accuracy costs improbability of the
      apparatus's ready state, and the exchange rate is quantitative.

      So the corpus doesn't dissolve the measurement problem by narrative. It proves which
      combination of desiderata is impossible, then says openly which one CSD abandons,
      and that's what separates a result from an interpretation.
    mathematical: >
      Three impossibility results on the pointer arena, so there's no exact collapse by a
      measure-preserving map, no everywhere-correlating continuous propagator on a
      connected arena, and a quantitative accuracy-versus-improbability bound.

      All three are CSD-free in statement, being measure theory, topology and an estimate
      respectively, so any rival account with the corresponding structure inherits them,
      and they can't be cited against this programme without being cited against the
      citer.
    term: Measurement problem
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/RecordLayer/MeasurementConstraints.lean
      theorem: no_exact_collapse
    external:
      - text: "Stanford Encyclopedia: measurement in quantum theory"
        url: https://plato.stanford.edu/entries/qt-issues/
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-4
      text: The fourth primer page is the measurement story in plain terms
    related: [collapse, de-isolation, record-layer, what-happens-during-measurement, copenhagen]

  - slug: collapse
    reviewed: 2026-09-14
    image:
      file: img/collapse.jpg
      alt: "Portrait photograph of Werner Heisenberg"
      caption: "Werner Heisenberg."
      credit: "CC BY-SA 3.0 de, via Wikimedia Commons"
      licence: "CC BY-SA 3.0 de"
      source: https://commons.wikimedia.org/wiki/File:Werner_Heisenberg_Portrait_(3x4_cropped).jpg
      article: https://en.wikipedia.org/wiki/Werner_Heisenberg
    hook: >
      In CSD the quantum state never jumps, and that's a theorem about volume-preserving
      maps rather than a preference among interpretations.
    layman: >
      The textbook says that when a measurement happens the quantum state jumps
      discontinuously to match the outcome, and you can ask whether that jump is a
      physical event or an update to a description. The dispute is as old as the theory,
      and the stakes are real, as a physical jump would be abrupt, irreversible,
      unexplained by any equation in the theory, and apparently instantaneous across any
      distance.

      An update, on the other hand, needs no physics at all. When you learn which box the
      ball is in your probabilities collapse and nobody is alarmed, so the whole question
      is whether quantum collapse is more like the ball.

      CSD's answer is the ball, with a twist that makes the answer checkable rather than
      rhetorical. On a volume-preserving substrate, one whose motion carries every region
      of the underlying state space to a region of the same size, a physical collapse
      isn't merely unnecessary, as it's impossible.
    in_csd: >
      The corpus proves that no measure-preserving map implements exact collapse, where a
      measure-preserving map is one that keeps the size of every region unchanged, which
      is exactly what the motion of a deterministic, volume-conserving substrate does. So
      such a substrate couldn't contain a collapse process even if its designer wanted
      one, and the stance becomes a constraint, with CSD on record as unable to cheat.

      What replaces the jump is a record. System and apparatus evolve together under the
      one dynamics, the record fixes which region of the space of quantum states the
      trajectory realises, and the update rule the textbook postulates separately falls
      out of the record construction. The thing that changes discontinuously is the
      summary, and the world underneath does what it was always doing.
    mathematical: >
      No measure-preserving map on the arena implements exact collapse. Approximate
      collapse exists but is priced, as accuracy is bounded against ready-state
      improbability, with the exchange rate explicit.

      The post-measurement update is then derived rather than postulated, and it appears
      as the block projection realised on the pointer arena, an output of the record
      construction.
    term: Collapse
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/RecordLayer/MeasurementConstraints.lean
      theorem: no_exact_collapse
    external:
      - text: "Stanford Encyclopedia: collapse theories"
        url: https://plato.stanford.edu/entries/qm-collapse/
    site_link:
