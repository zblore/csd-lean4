  - slug: does-csd-conflict-with-pbr
    kind: question
    hook: >
      No. For exactly prepared pure states, CSD satisfies the very conclusion
      the PBR theorem argues for: two distinct states correspond to sets of
      underlying world-states that do not overlap at all, and that is a proved
      theorem rather than something arranged by hand.
    layman: >
      The Pusey-Barrett-Rudolph theorem is often summarised as "the quantum
      state is real", which makes any programme calling the state epistemic, a
      summary of knowledge rather than a complete description of the world, sound
      refuted from the start. The summary is too coarse, and the coarseness is
      exactly where the quick answer goes wrong.

      What PBR actually rules out is a specific class of models. In these
      models, two distinct pure quantum states can both be knowledge about the
      same underlying world-state, so that the sets of world-states compatible
      with each overlap. Add an independence assumption about preparing systems
      side by side, and the theorem shows that such overlap contradicts quantum
      predictions. It says nothing against models in which distinct states
      describe disjoint sets of world-states.

      CSD is in the second camp, and the corpus proves it rather than arranging
      it. Two distinct exactly prepared pure states correspond to distributions
      over the underlying states with no overlap at all. So CSD does not evade
      PBR, and PBR is not inapplicable to it: CSD lands on the side of the
      disjointness conclusion that PBR argues for. The state still functions
      epistemically. It summarises what a preparation fixes, and it does not
      determine the underlying microstate. But that is a different sense of the
      word, and the distinction between the two senses is what the whole
      question turns on.
    in_csd: >
      Three claims have to be kept apart, and running them together is what
      produces the wrong answer to this question.

      The first is CSD's epistemicity: the quantum state is a many-to-one,
      incomplete coordinate on the arena, the underlying state space. The second
      is the classification, due to Harrigan and Spekkens, in which PBR is
      stated. An account is called psi-ontic when distinct exact pure-state
      preparations have mutually singular ontic measures, meaning that the
      distributions over underlying states they induce live on disjoint sets.
      On that classification CSD's exact sharp interface, its account of
      preparations that fix a pure state exactly, is psi-ontic, and that is a
      machine-checked theorem. The third is finite-resolution overlap:
      preparations that fix the state only to within a region of positive
      volume around it, rather than exactly, provably do overlap for distinct
      states whose regions overlap. All three are true, and they are about
      different objects.

      Two tempting framings are wrong, and earlier versions of this answer used
      both; both are withdrawn. Disjointness is a theorem, not something that
      holds by construction, and "the PBR premises are simply not met" is not
      the right description. And region-preparation overlap is not a second way
      in which CSD sits outside PBR: it concerns a different class of
      preparations, so it neither establishes nor softens the classification of
      exact states.

      There is an honest boundary. PBR also assumes preparation independence, a
      compositional premise about systems prepared side by side. The corpus
      neither proves nor refutes it, and the fact that the composite ontology
      does not factorise globally does not settle it either way. Reading the
      geometry of composite systems, the Segre layer, as a contradiction with
      PBR was a superseded interpretation and is recorded as such.
    mathematical: >
      The exact half is proved, not definitional. epistemicMeasure_projectiveLaw:
      the exact sharp preparation delta_p (x) Haar has projective pushforward
      exactly delta_p, so the corpus's own witness demonstrably meets the
      classification's hypothesis. sharp_preparations_mutuallySingular: any two
      ontic measures whose projective laws are Diracs at distinct points are
      mutually singular, with no Preparation structure, no region and no
      finiteness assumed. epistemicMeasure_mutuallySingular is the concrete
      corollary, routed through the general theorem.
      pbr_sharp_preparation_capstone bundles both for citation. The theorem
      landed on 2026-08-25; before that the entry described the disjointness as
      holding by construction.

      The finite-resolution half is also proved, about different objects. The
      theorem kMuL_fibre_null shows that a single exact projective fibre is
      Liouville-null, so an exact sharp preparation is not obtainable by
      conditioning on a positive-volume region. The class separation is stated at the level of
      probability laws by exact_sharp_ne_region_conditional (no positive-volume
      region-conditioned law equals an exact sharp law, however the region is
      chosen), with no_region_preparation_exact_fibre the weaker set-level
      companion; conditional_not_mutuallySingular and
      kahler_preparations_overlap (region preparations on overlapping
      neighbourhoods have non-separable conditional laws); and the rho_ep
      density theorems.

      The superseded reading of the Segre-layer geometry as a PBR contradiction
      is recorded in specs/c2-support-plan.md. PBR preparation independence is
      not proved either way.
    term: Does the PBR theorem rule out CSD?
    status: definition
    source: curated
