      laws; the composite algebras are generated by the mode-local subalgebras
      with the reconstruction theorem consumed arena-natively; and the reduced
      density of the Bell ray is the equal mixture with local weights exactly
      one-half.
    term: Bell state is not a join
    status: proved-in-corpus
