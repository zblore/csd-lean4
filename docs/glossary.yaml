  - slug: typicality
    reviewed: 2026-09-14
    image:
      file: img/typicality.jpg
      alt: "Portrait photograph of Ludwig Boltzmann"
      caption: "Ludwig Boltzmann, who first argued from typicality."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Boltzmann2.jpg
      article: https://en.wikipedia.org/wiki/Ludwig_Boltzmann
    hook: >
      Typicality is probability without randomness, as the world is deterministic, you
      don't know which state you have, and the odds are the sizes of the possibilities.
    layman: >
      If the universe is deterministic, probabilities can't come from genuine chance,
      because there is none, yet quantum experiments deliver rock-solid statistics, so you
      can ask where the numbers come from.

      They come from counting. Fix everything your preparation procedure controls, and a
      vast set of microstates, of complete underlying states, remains compatible with it,
      so you don't know which one you got. Ask what fraction of that set leads to each
      outcome, and those fractions are the probabilities. Nothing is random, as you're
      ignorant and the ignorance is quantified by the sizes of sets, which is exactly how
      Boltzmann explained why gases settle into equilibrium, imported into quantum
      foundations.

      The classic objection is as old as the move. Fractions depend on how you measure the
      sets, and a measure is simply a rule that assigns a size to each set of microstates,
      so if you choose the measure to taste the argument justifies anything. Any
      typicality account lives or dies by its answer to that objection.
    in_csd: >
      Typicality is the engine of the whole programme, and both of its classic failure
      modes are addressed by theorems rather than by assurances.

      The measure objection comes first. CSD's measure is forced by symmetry, uniquely,
      with a proof, as among all measures that are invariant, meaning unchanged by the
      symmetries of the state space, there's only one, so there was no other option to
      have chosen. That's the direct answer to the circularity charge associated with
      Valentini, that a typicality argument simply picks the measure that yields the
      result it wants, and it's the single most load-bearing fact in the corpus.

      The route matters too. Frequencies come from the law of large numbers over repeated
      preparations, the theorem that the averages of many independent trials settle to the
      underlying fractions. They don't come from ergodicity, the idea that a single
      trajectory wandering through the space for long enough visits every part of it in
      proportion to its size, and they don't come from a single trajectory exploring the
      space in any other way. The corpus records the single-flow route as a proved dead
      end, as one projective flow demonstrably can't pin down the measure, and that
      negative result is kept visible so nobody wanders back down the road.
    mathematical: >
      For independent trials, observed relative frequencies converge almost surely to
      volume fractions, and combined with Born-weight-equals-volume-ratio this yields Born
      frequencies at general dimension.

      Two notes on scope. The independence hypothesis is pairwise, weaker than the usual
      statement. And the corpus flags an open debt, as a deterministic substrate owes an
      account of why repeated preparations are independent at all, and a substrate with
      memory would show departures from i.i.d. shot noise, which is one of the few places
      CSD could differ observably from quantum mechanics at laboratory energies.
    term: Typicality
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF1/GeneralFrequency.lean
      theorem: freq_tendsto_of_iid
    external:
      - text: "Goldstein, typicality in statistical mechanics and quantum theory"
        url: https://arxiv.org/abs/1110.1349
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-2
      text: The second primer page explains how typical behaviour replaces randomness
    related: [typicality-volume, born-weight, canonical-typicality, where-do-probabilities-come-from, fubini-study-measure]

  - slug: psi-epistemic
    reviewed: 2026-09-14
    hook: >
      The quantum state is what you know and not what exists, and the hard part was always
      saying what it's knowledge of, so CSD's whole architecture is an answer to that.
    layman: >
      Two readings of the quantum state have fought for a century. On the realist reading
      the state is a physical thing, so its jump on measurement is a physical process that
      needs an explanation the theory doesn't give. On the epistemic reading the state is
      a description of what someone knows, so the jump is just an update, as you learn
      something and revise, and it's no more mysterious than a poker player recalculating
      after seeing a card.

      The epistemic reading dissolves the measurement problem, which is its great charm,
      and its great embarrassment is the follow-up question of what it's knowledge of. If
      there's nothing underneath, the reading says the theory is about nothing in
      particular, and a family of more recent theorems makes naive versions of the
      underneath very hard to hold. The PBR theorem, the most famous of them, shows that
      if separately prepared systems have independent underlying states, then two
      different quantum states can never be descriptions of the same underlying state.

      So the position is attractive, constrained, and incomplete without a floor.
    in_csd: >
      CSD is psi-epistemic with a floor. The state is knowledge of which region of the
      constraint surface the microstate occupies, so there's a fact underneath, one point
      following one trajectory, and the state summarises what a preparation pins down
      about it.

      Everything in the programme sorts into two levels, and keeping them apart is the
      discipline the whole account depends on. The epistemic level holds the space of
      quantum states, the outcome regions and the probabilities, and the ontic level holds
      the substrate and the measure that weights it. The corpus's fibre analysis sharpens
      the split. It treats the space of quantum states as a lossy projection of the
      substrate, with many microstates mapping to each state, and it places the record-
      forming content in the fibre above a state, the set of microstates that project to
      it, rather than on the space of states itself. That placement is a judgement against
      a tight constraint chain and not a proved dichotomy, as whether the content could
      stay on the base in three or more dimensions is open in both directions.

      Three claims need to be kept apart, because the corpus once ran them together. The
      first is CSD epistemicity, that the quantum state doesn't completely specify the
      microstate, because the projection is many-to-one, and that's this entry's subject.
      The second is the technical Harrigan-Spekkens classification, which calls a model
      psi-ontic when distinct quantum states never share an underlying microstate and psi-
      epistemic when they can. On the canonical exact sharp interface, where a preparation
      is an exact pure state, CSD is psi-ontic, because distinct exact pure states have
      mutually singular ontic measures, so the space can be split into two parts with each
      state's measure living entirely on its own part. The third is finite-resolution
      overlap, as preparations that fix a region of positive volume, rather than an exact
      state, and whose regions overlap have conditional laws that provably can't be
      separated onto disjoint supports.

      The third claim is the theorem this entry is anchored to. It doesn't establish the
      second in the epistemic direction, because region preparations are a different
      preparation class from exact pure states, and describing the overlap theorem as
      technical psi-epistemicity of exact states was an error that has since been
      corrected. The first and third claims hold, and on the second the exact interface is
      psi-ontic.
    mathematical: >
      The overlap statement is proved as conditional_not_mutuallySingular, so overlapping
      preparation regions give conditional laws that aren't mutually singular. The proof
      is a density argument rather than a shared-support one, because two measures can
      both charge a common set and still be mutually singular, so overlap alone wouldn't
      settle it. The concrete witness kahler_preparations_overlap instantiates it on open
      neighbourhoods of any two rays of the working arena.

      The complementary facts are proved too. Conditioning on an exact pure state is an
      unreachable idealisation, as single fibres are Liouville-null, what a physical
      preparation projects to is a density against the Fubini-Study measure and not a
      point, and distinct exact pure states have mutually singular ontic measures
      (RecordLayer.sharp_preparations_mutuallySingular), which is the psi-ontic verdict on
      the exact sharp interface under the Harrigan-Spekkens classification. An earlier
      version of this entry described the overlap theorem as technical psi-epistemicity of
      exact states, and that error was corrected on 2026-08-25.

      Which literature constraints bite, PBR and its relatives, still depends delicately
      on what the state is taken to be knowledge of, and on independence assumptions. The
      full mapping of that boundary isn't formalised, so treat it as live terrain.
    term: Psi-epistemic
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/SigmaLayer/IsolationPreparation.lean
      theorem: conditional_not_mutuallySingular
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-3
      text: The third primer page is the plain-terms version of the wavefunction as a summary
    related: [ontic-vs-epistemic, epistemic-measure, does-csd-conflict-with-pbr, is-the-wavefunction-real, hidden-variables]
    external:
      - text: "Epistemic views of the quantum state"
        url: https://en.wikipedia.org/wiki/Epistemic_view_of_quantum_states

  - slug: determinism
    image:
      file: img/determinism.jpg
      alt: "Portrait of Pierre-Simon Laplace"
      caption: "Pierre-Simon Laplace, whose demon is the classical picture of determinism."
      credit: "James Posselwhite, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Laplace,_Pierre-Simon,_marquis_de.jpg
      article: https://en.wikipedia.org/wiki/Pierre-Simon_Laplace
    hook: >
      The substrate has no dice, so the spread in the data is variation in what your
      preparation couldn't pin down.
    layman: >
      Prepare two systems as identically as any procedure allows, measure them
      identically, and quantum mechanics happily reports different outcomes, offering no
      reason why this one rather than that. Either the world contains genuine chance, or
      the preparations weren't actually identical.

      Determinism takes the second answer. The two systems agreed on everything the
      procedure fixed and differed in what it couldn't fix, so the observed spread is that
      hidden variation showing through, and probability is bookkeeping for ignorance. This
      is the same move classical statistical mechanics has always made about gases, as the
      temperature and pressure of a gas fix its state only coarsely, the exact positions
      and speeds of its molecules vary from one sample to the next, and the statistics
      come from that variation.

      Whether the answer is still available after the no-go theorems isn't a matter of
      taste. It survives, at a stated price, as the theory must be contextual, meaning
      that the outcome of a measurement can depend on which other measurements are made
      alongside it, and non-local, meaning that what happens here can depend on a choice
      made far away. The entries on contextuality and hidden variables carry the receipts.
    in_csd: >
      The substrate's motion is deterministic and volume-preserving, carrying every region
      of the underlying state space to a region of the same size, and chance appears
      nowhere in the dynamics. Probability enters exactly once, as ignorance of the
      microstate within the region a preparation fixes, and the forced measure, the one
      rule for sizing regions the symmetries of the state space allow, turns that
      ignorance into unique numbers.

      The debt is recorded rather than buried, and it's the interesting part. The
      frequency argument assumes independent trials. A deterministic substrate with memory
      would violate that assumption, and the violation would show up as deviations from
      ordinary shot noise, the statistical scatter expected in counts of independent
      events, in high-statistics data. This is one of the very few places CSD could differ
      measurably from quantum mechanics, and testing it needs no Planck-scale machine,
      just patience and statistics.
    mathematical: >
      This entry is positional. The formal content is the measure-preserving flow and the
      volume-ratio weights, and determinism is the reading of that structure.

      The nearest formal object is the preservation field itself, carried as an ontic
      postulate and listed as such in the axiom ledger, so it's assumed for physical
      admissibility and not derived.
    term: Determinism
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: causal determinism"
        url: https://plato.stanford.edu/entries/determinism-causal/
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-1
      text: The first primer page introduces the determinism the rest of the programme builds on
    related: [single-trajectory, where-do-probabilities-come-from, is-csd-superdeterministic, typicality, constraint-surface]

  - slug: kochen-specker
    image:
      file: img/kochen-specker.jpg
      alt: "Photograph of Ernst Specker at a lectern"
      caption: "Ernst Specker lecturing."
      credit: "Konrad Jacobs, Erlangen, CC BY-SA 2.0 de, via Wikimedia Commons"
      licence: "CC BY-SA 2.0 de"
      source: https://commons.wikimedia.org/wiki/File:Ernst_Specker.jpeg
      article: https://en.wikipedia.org/wiki/Ernst_Specker
    hook: >
      There's a finite list of directions in space that admits no consistent yes-or-no
      labelling, so contextuality follows by pure counting, with no experiment, no
      statistics and no separated particles.
    layman: >
      Bell's argument needs two separated particles and statistics gathered over many
      runs, so a determined sceptic could hope the trouble was really about distance, or
      about probability, and ask whether there's a conflict that needs neither.

      Kochen and Specker built one. For a quantum system with three or more
      distinguishable outcomes, there's a finite set of measurement directions that can't
      be consistently labelled with answers at all. Each direction is a yes-or-no
      question, and the labels must respect the relations the corresponding quantities
      themselves satisfy, so for instance among any complete set of mutually perpendicular
      directions exactly one must be labelled yes. No labelling of the whole set obeys the
      rule. Their original construction used 117 directions, the modern record is 18, and
      you can check it with a pencil.

      There's no experiment, no ensemble of runs, and no separation in space. There's just
      a finite combinatorial fact, which is that the answer sheet doesn't exist, even for
      one particle, even in principle.
    in_csd: >
      CSD is contextual, so this theorem is a constraint it satisfies by construction,
      with no accommodation needed. What the corpus is genuinely careful about is a
      tempting misattribution nearby.

      The programme's fibre analysis found that in three or more dimensions the natural
      constructions confined to the base, the space of quantum states onto which the
      substrate projects, stop working, which is why it places contextual content in the
      fibre above the base, the set of substrate points lying over a given state. The
      placement is a judgement against a constraint chain, and the base-only question
      remains open in both directions. It would be natural, and wrong, to cite Kochen-
      Specker for that placement, as the theorem constrains non-contextual value
      assignments and CSD never makes one, so the theorem simply doesn't engage. The fibre
      argument comes instead from covariance, the requirement that the construction
      respect the symmetries of the state space, together with non-negativity, the
      requirement that a density never go below zero. That's a different argument with a
      different shape, and a constraint chain rather than a no-go, and the corpus flags
      the distinction precisely because borrowing this theorem's authority would be such
      an easy overclaim.
    mathematical: >
      In dimension three and above, no non-contextual assignment of definite values to all
      observables respects the functional relations among commuting sets, witnessed by
      explicit finite vector sets, 117 originally and 18 in the smallest known.

      Dimension two escapes, the same exception that afflicts the original Gleason
      theorem, and one more instance of the qubit being a misleading guide to the general
      case.
    person: >
      Simon Kochen, a native of Belgium, has spent his career at Princeton, mostly in
      model theory and number theory, and he later proved the free will theorem with John
      Conway. Ernst Specker (1920-2011) was Swiss and spent his whole career at the ETH
      Zurich, working in logic and combinatorics.

      The publication story is unmatched. Specker published the core idea in 1960 in a
      theology journal, Dialectica, framing it through a scholastic debate about whether
      God could know the answers to unasked questions, and the joint theorem followed in
      1967 in the Journal of Mathematics and Mechanics. It went from medieval
      counterfactuals to a pillar of quantum foundations, by way of the strangest venue in
      the subject's bibliography.
    term: Kochen-Specker theorem
    status: standard-mathematics
    source: curated
    external:
      - text: "Stanford Encyclopedia: the Kochen-Specker theorem"
        url: https://plato.stanford.edu/entries/kochen-specker/
    site_link:
      url: https://www.constraintsurfacedynamics.com/position
      text: The position page's no-go section is where this theorem's bearing is set out
    related: [contextuality, does-kochen-specker-rule-out-csd, hidden-variables, bell-chsh, measurement-context]

  - slug: copenhagen
    image:
      file: img/copenhagen.jpg
      alt: "Portrait photograph of Niels Bohr"
      caption: "Niels Bohr."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Niels_Bohr.jpg
      article: https://en.wikipedia.org/wiki/Niels_Bohr
    hook: >
      Copenhagen is the oldest position on quantum measurement and the one that declines
      the question, as measurement is where the theory stops and not something it
      explains.
    layman: >
      Quantum mechanics needs a boundary between the quantum system and the classical
      apparatus that reads it, and you can ask where the boundary is and what happens at
      it. The Copenhagen interpretation answers by refusing the question.

      The traditional teaching account, associated with Bohr, treats the apparatus as
      classical by fiat and treats the state's jump on measurement as a primitive fact.
      More radically, Bohr held that the whole experimental arrangement determines what
      can meaningfully be said, so asking what the electron was doing between measurements
      isn't left unanswered but rejected as meaningless.

      As a strategy this isn't foolish. It delivered a century of flawless physics, and
      its refusal to over-describe has aged better than several of its rivals'
      enthusiasms. But it's a decision not to explain, and everyone who wants an
      explanation eventually leaves it.
    in_csd: >
      The disagreement is narrower than the usual caricature. CSD agrees with Copenhagen
      that the state isn't a physical object, and it agrees that the boundary between
      classical and quantum is where the real content lives. The parting of ways comes one
      step further on, as CSD declines to leave the boundary unanalysed.

      Here measurement is an ordinary physical interaction on the substrate that produces
      a record, and the two rules Copenhagen keeps apart, smooth evolution and abrupt
      update, are one process seen at two levels of description. The contrast is
      interpretive and not empirical, as no experiment distinguishes the two positions and
      none is proposed. This entry states a position, there's no theorem behind it, and
      the absence of a formal reference is deliberate.
    mathematical: >
      There's no formal content, and the absence is the information, as the corpus
      contains nothing bearing directly on this position.

      That's itself telling, as the disagreement is about whether the measurement boundary
      requires analysis, and no theorem settles a question of that kind.
    term: Copenhagen interpretation
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: the Copenhagen interpretation"
        url: https://plato.stanford.edu/entries/qm-copenhagen/
    site_link:
      url: https://www.constraintsurfacedynamics.com/position
      text: The position page contrasts the programme with the Copenhagen reading
    related: [many-worlds, bohmian-mechanics, qbism, measurement-problem, collapse]

  - slug: many-worlds
    image:
      file: img/many-worlds.png
      wide: true
      alt: "Cartoon of a film strip splitting into a live-cat branch and a dead-cat branch"
      caption: "Schrödinger's cat in the many-worlds picture: the film splits and both outcomes run on."
      credit: "Christian Schirm, CC0, via Wikimedia Commons"
      licence: "CC0"
      source: https://commons.wikimedia.org/wiki/File:Schroedingers_cat_film.svg
      article: https://en.wikipedia.org/wiki/Many-worlds_interpretation
    hook: >
      Many-Worlds keeps the smooth quantum evolution and gives up the single outcome, and
      CSD makes the opposite choice, one trajectory and one world, as a settled
      commitment.
    layman: >
      Quantum mechanics describes a system by a state that changes smoothly and
      predictably in time, and the same rules allow a state to be a superposition, a
      combination of several possibilities held at once, such as a particle that's partly
      here and partly there. Yet a measurement only ever shows one result. The textbook
      handles this by adding a second rule, collapse, under which the state jumps to a
      single possibility at the moment of measurement, and Many-Worlds asks what follows
      if you refuse to add that rule.

      Everett's answer was to take the smooth evolution as the whole story. After a
      measurement the apparatus and the observer are then themselves in superposition,
      with one component, called a branch, for each outcome, and Everett's move was to say
      that nothing is wrong with this. Every outcome happens, each in its own branch. The
      branches decohere, meaning that their interaction with the surroundings stops them
      from ever influencing one another again, so each branch contains an observer certain
      that their result was the only one. Nothing is added to the formalism, no collapse
      and no hidden variables, and that austerity is the position's appeal.

      The cost surfaces at probability. If everything happens, you can ask what it can
      mean that one outcome was more probable than another. Counting branches gives the
      wrong answer, as a measurement with a seventy percent outcome and a thirty percent
      outcome produces two branches and not seven and three. The decision-theoretic
      repairs, which argue that a rational agent should bet as though the branch weights
      were probabilities, are ingenious and contested, and that's the famous open wound of
      the interpretation.
    in_csd: >
      CSD is single-trajectory, and this is a settled commitment recorded in the
      programme's non-goals rather than an open question to be revisited. There's one
      microstate, one complete state of the world, one history and one outcome. The
      outcomes that didn't occur are regions of the space of descriptions the trajectory
      didn't enter, and nowhere is there a branch in which they happened.

      The contrast over probability is the instructive one. Everett's weight problem, the
      question of why observed frequencies match the branch amplitudes, the numbers the
      formalism attaches to each branch, doesn't arise here in that form, because there's
      always a definite state and probability expresses ignorance about it. The question
      becomes which measure weights the regions, where a measure is a rule that assigns a
      size to each set of states, and that question has a proved answer, the unique
      measure left unchanged by the symmetry of the state space. Where the Everettian
      literature argues decision theory, this programme points at a uniqueness theorem.
      This is a positional entry, and no theorem asserts it.
    mathematical: >
      There's no formal content, as the corpus contains no theorem about the rival itself.

      The formal contrast is that outcome weights in CSD are volume ratios on one
      constraint surface, so the measure problem is that of identifying a measure on a
      single space, discharged by uniqueness under symmetry, rather than that of
      justifying a weighting across many worlds, which is where Everettian effort
      concentrates.
    term: Many-Worlds interpretation
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: Everett's relative-state formulation"
        url: https://plato.stanford.edu/entries/qm-everett/
    site_link:
      url: https://www.constraintsurfacedynamics.com/position
      text: The position page contrasts the programme with the many-worlds reading
    related: [copenhagen, bohmian-mechanics, spontaneous-collapse, single-trajectory, measurement-problem]

  - slug: bohmian-mechanics
    image:
      file: img/bohmian-mechanics.jpg
      alt: "Portrait photograph of David Bohm"
      caption: "David Bohm."
      credit: "Unknown photographer, Attribution, via Wikimedia Commons"
      licence: "Attribution"
      source: https://commons.wikimedia.org/wiki/File:David_Bohm.jpg
      article: https://en.wikipedia.org/wiki/David_Bohm
    hook: >
      Bohmian mechanics is CSD's nearest neighbour, deterministic, with definite states,
      and openly non-local, and the dispute between them is over where the probabilities
      come from.
    layman: >
      The question Bohm settled in 1952 was whether a deterministic account of quantum
      mechanics is possible at all, one in which the present state of the world fixes the
      future by law, with no randomness. The folklore of the time, leaning on von
      Neumann's flawed impossibility proof, said it couldn't be done, and Bohm answered by
      construction, as he wrote one down.

      In his theory particles have definite positions at all times, and a wave, evolving
      by the ordinary Schrodinger equation, guides them, so every quantum prediction comes
      out exactly. The price is explicit non-locality, as each particle's guidance depends
      instantaneously on where all the others are, across any distance. Bell, who admired
      the theory, showed that this price isn't Bohm's clumsiness but everyone's
      obligation, since any account that reproduces the quantum predictions must pay it in
      some form.

      Bohmian mechanics remains the standing counterexample to every claim that quantum
      mechanics rules out determinism, so whatever else is true, that claim is dead.
    in_csd: >
      This is CSD's closest relative, and the family resemblance is real, with
      determinism, a definite underlying state, non-locality accepted with open eyes, and
      probabilities that express ignorance of the exact state rather than randomness in
      the world. A reader placing CSD on the map of interpretations should put it nearest
      here.

      The differences concern what exists, and on one point they're sharp. Bohm has a dual
      ontology, a physical guiding wave together with particle positions, while CSD has
      one object, the constraint surface, and demotes the quantum state to epistemic
      bookkeeping, a summary of what's known rather than a thing in the world, so nothing
      guides anything. The probability postulates also differ in kind. Bohmian statistics
      require the quantum equilibrium hypothesis, an assumed initial distribution of
      particle positions, possibly one the dynamics relaxes into, whereas CSD's measure is
      forced by a symmetry theorem, so where Bohmians must defend an initial condition CSD
      points at uniqueness. That's the standing objection to Bohm this programme claims to
      escape.
    mathematical: >
      There's no formal content in the corpus about the rival itself.

      The shared formal shape is that both derive probabilities from a measure on an
      underlying state space rather than postulating the Born rule, so both owe an account
      of the measure, and the accounts differ (assumed equilibrium there, forced
      uniqueness here).
    term: Bohmian mechanics
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: Bohmian mechanics"
        url: https://plato.stanford.edu/entries/qm-bohm/
    site_link:
