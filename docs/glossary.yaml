  - slug: helstrom-bound
    reviewed: 2026-09-29
    hook: >
      The Helstrom bound says how well any measurement can tell two quantum states apart,
      and the answer is exactly the trace distance between them, attained by one specific
      test.
    layman: >
      Someone prepares one of two known states and hands it to you, and you have to guess
      which. If the states were classical probability distributions the best strategy would
      be obvious, and the success rate would be a simple distance between the distributions.
      Quantum states can overlap in a way distributions can't, so the question is whether
      quantum mechanics allows a cleverer test than the classical analogy suggests, or a
      worse one.

      Helstrom answered it exactly. Among all possible measurements, including ones that
      entangle the state with an apparatus and process the result, the best chance of
      guessing right is one half plus half the trace distance between the two states, where
      the trace distance is the natural quantum generalisation of the distance between two
      probability distributions. No test beats that, and one particular test achieves it,
      namely the measurement that asks which state is more likely at each point of the
      spectrum of their difference.

      The two extremes are the ones worth remembering. Identical states force you to guess at
      random, and perfectly distinguishable states allow a test that never errs. Everything in
      between is measured by one number, which is why trace distance is the right notion of
      how different two quantum states are.
    in_csd: >
      The corpus proves the bound and its attainment together, so the trace distance gets its
      operational meaning rather than remaining a definition. The optimality half says no test
      does better than the projector onto the positive part of the weighted difference of the
      two states, and the attainment half computes that projector's success probability
      exactly. Both rest on the Jordan decomposition machinery already in the trace-distance
      module, since the variational bound and the identity that makes it tight are statements
      about positive and negative parts.

      The result is stated at equal priors and in general, in success form and in error form,
      with the two extremes proved separately: indistinguishable states force a coin flip,
      perfectly distinguishable ones permit an error-free test. It's the converse companion to
      the data-processing inequality, as channels can't increase distinguishability and this
      says distinguishability is exactly what a measurement can extract. The complementary
      problem, zero error at the cost of an inconclusive outcome, is unambiguous
      discrimination, proved elsewhere in the corpus.
    mathematical: >
      A test is an effect E with 0 <= E <= 1 (IsTest), guessing the first state on outcome E.
      With A = p0 rho0 - p1 rho1 the Helstrom operator and helstromTest the projector onto its
      positive eigenspace, re_trace_posPart_eq gives Re Tr(A+) = (||A||_1 + Re Tr A)/2, the
      Jordan-decomposition identity; re_trace_mul_le_helstrom is optimality, from the
      variational bound Re Tr(A P) <= Re Tr(A+) for 0 <= P <= 1; re_trace_mul_helstrom is
      attainment, from A times the positive projector being A+.

      successProb_le and successProb_helstromTest give P_success <= (1 + D(rho0, rho1))/2 with
      equality at helstromTest, errorProb_ge and errorProb_helstromTest the error form,
      helstrom_indistinguishable and helstrom_perfect the two extremes, and
      successProbPrior_le with successProbPrior_helstromTest the general-prior statement
      P_success <= (1 + ||p0 rho0 - p1 rho1||_1)/2. Finite-dimensional matrices over the
      complex numbers throughout.
    person: >
      Carl Helstrom worked out the bound in the late 1960s at the University of California, San
      Diego, as part of a programme applying statistical decision theory to optical
      communication, and his 1976 book Quantum Detection and Estimation Theory founded the
      subject now called quantum estimation. Alexander Holevo proved closely related results
      independently in Moscow at the same time.

      The bound's practical face is in quantum key distribution and in optical receivers, where
      the question of how well an eavesdropper or a detector can distinguish two signals is
      precisely Helstrom's.
    term: Helstrom bound
    eponyms: [Helstrom]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Helstrom.lean
      theorem: errorProb_helstromTest
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper C reconstructs the operational quantum mechanics in which this bound is stated
    related: [holevo-bound, quantum-channel, luders-rule, naimark-dilation, von-neumann-entropy]
    external:
      - text: "Helstrom, Quantum Detection and Estimation Theory (Academic Press, 1976)"
        url: https://en.wikipedia.org/wiki/Quantum_state_discrimination

  - slug: geometric-phase
    reviewed: 2026-09-29
    image:
      file: img/geometric-phase.jpg
      alt: "Photograph of Michael Berry holding the Lorentz Medal in its case"
      caption: "Michael Berry with the Lorentz Medal, 2014."
      credit: "KNAW, Barbara Kieboom, CC BY 2.0, via Wikimedia Commons"
      licence: "CC BY 2.0"
      source: https://commons.wikimedia.org/wiki/File:LorentzMedaille2014-cropped.jpg
      article: https://en.wikipedia.org/wiki/Michael_Berry_(physicist)
    hook: >
      A quantum state taken around a closed loop and brought back to where it started keeps a
      leftover phase that depends only on the shape of the loop, so the phase is a record of
      the journey rather than of the time it took.
    layman: >
      A quantum state has an overall phase that no measurement can see, which is why states
      differing only by a phase are counted as the same state. That makes it surprising that
      any phase should matter, and the resolution is that a difference of phase between two
      paths does matter, as interference can see it.

      Take a state slowly around a loop and return it to the ray it started from. Part of the
      phase it picks up is the familiar one, accumulated at a rate set by the energy, and
      subtracting that part leaves a remainder. The remainder doesn't depend on how fast you
      went or on how you chose to keep track of the overall phase along the way, and it
      doesn't vanish. It depends only on the loop traced out in the space of states, which is
      why it's called geometric.

      Curvature is the right picture. The space of states is curved, and carrying a direction
      around a loop on a curved surface brings it back rotated by an amount equal to the
      curvature enclosed, exactly as a vector carried around a triangle on a sphere comes back
      turned. The geometric phase is that rotation, and the enclosed curvature is the area
      the loop bounds measured by the state space's own geometry.
    in_csd: >
      The geometric phase is an observable consequence of the sector geometry the programme
      builds on, so proving it belongs with the Fubini-Study and Kahler layers rather than
      beside them. The corpus defines the connection form along a curve of unit vectors,
      proves that the geometric phase is unchanged by any differentiable change of the overall
      phase, and then proves that it's the holonomy of the connection: the horizontal lift,
      the one whose connection form vanishes, returns rotated by exactly the geometric phase.

      The curvature formula comes next, with the phase written as the integral of the
      state space's own two-form over a surface the loop bounds, proved through the
      two-dimensional divergence theorem. The identification of that two-form is what closes
      the circle: the pullback of the Fubini-Study form along a family of states is computed
      chart-free and bundled as a genuine differential form, so the curvature is the Kahler
      form of the state space and the geometric phase is half the integral of the pullback.
      Two independent derivations agree on the cone example. The adiabatic setting, where
      Berry's original argument lives, is handled for a rigidly rotated Hamiltonian exactly,
      and the general adiabatic theorem is an open row.
    mathematical: >
      connectionForm psi t = Im <psi t, psi-dot t> along a curve of unit vectors,
      dynamicalPhase its integral, geometricPhase psi T phi = phi - dynamicalPhase for a
      cyclic curve with psi T = e^(i phi) psi 0. connectionForm_rephase shows the form shifts
      by theta-prime under psi to e^(i theta) psi, and geometricPhase_rephase is gauge
      invariance, so the phase is a function of the closed curve of rays.
      connectionForm_horizontalLift and horizontalLift_cyclic are the holonomy statement, and
      geometricPhase_of_schrodinger evaluates it for a self-adjoint generator as phi + T times
      the conserved energy.

      geometricPhase_eq_neg_integral_curvature (GeometricPhaseCurvature.lean) is the curvature
      form, minus the double integral of 2 Im <d_s psi, d_t psi> over the polar-form disc.
      fsPullbackForm_apply (ProjectiveSpaceGeometricPhase.lean) computes the pullback of the
      Fubini-Study form along a smooth family without charts,
      fsPullbackDifferentialForm bundles it, and
      geometricPhase_eq_half_integral_fsPullbackForm is the identification. The general
      Kato-Born-Fock adiabatic theorem is BACKLOG row 88 and is not claimed.
    person: >
      Michael Berry published the phase in 1984 at Bristol, in the adiabatic setting, and the
      result was immediately recognised as something that ought to have been noticed decades
      earlier. It had been, in fact, as Shivaramakrishnan Pancharatnam had described the
      optical version in 1956 and Christopher Longuet-Higgins and colleagues had met a sign of
      it in molecular physics across the following decade.

      Barry Simon reinterpreted the phase as holonomy straight away, in a paper that appeared
      before Berry's own, and Yakir Aharonov and Jeeva Anandan removed the adiabatic
      assumption in 1987, leaving the general statement about closed curves of rays that the
      corpus proves.
    term: geometric phase
    eponyms: [Berry]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/Analysis/InnerProductSpace/GeometricPhase.lean
      theorem: geometricPhase_of_schrodinger
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper D is the geometric quantum mechanics whose curvature this phase measures
    related: [aharonov-bohm, kahler-form, fubini-study-measure, fisher-rao-metric, bloch-sphere]
    external:
      - text: "Berry, Quantal phase factors accompanying adiabatic changes (Proc. R. Soc. A 392, 45)"
        url: https://royalsocietypublishing.org/doi/10.1098/rspa.1984.0023

  - slug: aharonov-bohm
    reviewed: 2026-09-30
    image:
      file: img/aharonov-bohm.jpg
      alt: "Photograph of Yakir Aharonov seated at a chessboard in a study"
      caption: "Yakir Aharonov, the first name on the effect."
      credit: "Kobi Kalmanovitz, CC BY-SA 3.0, via Wikimedia Commons"
      licence: "CC BY-SA 3.0"
      source: https://commons.wikimedia.org/wiki/File:Yakir_aharonov.jpg
      article: https://en.wikipedia.org/wiki/Yakir_Aharonov
    hook: >
      An electron that never enters a magnetic field can still be shifted by it, as the
      enclosed flux changes the interference between paths, which shows that the field's
      potential carries physics the field strength alone doesn't.
    layman: >
      Classical electromagnetism describes forces by field strengths, and the potential is
      treated as a convenience, a bookkeeping function whose absolute value has no meaning
      since you can add a constant to it without changing anything. Quantum mechanics
      disagrees, in a way that can be measured.

      Send an electron around both sides of a region containing magnetic flux, with the field
      itself confined so that the electron never touches it. The two paths acquire different
      phases, the difference being set by the flux they enclose between them, and the
      interference pattern shifts accordingly. Nothing local explains the shift, as the
      electron went nowhere the field was.

      Both halves of the story matter. The potential is still not observable on its own, as
      moving the phase around between different parts of the path, which is what changing the
      potential does, leaves every measurable prediction alone. What's observable is the total
      enclosed flux, and only up to a fixed unit, since adding one whole quantum of flux is
      undetectable. So the effect is neither that the potential is real nor that only the
      field is, but that the right object is the phase accumulated around a closed loop.
    in_csd: >
      The effect is one of the empirical twins the programme keeps, so the corpus reproduces
      it rather than interpreting it, and it does both halves on a lattice ring of sites with
      the flux entering through the standard phase substitution on the bonds. The levels move
      strictly and continuously with the flux, so a spectroscopic measurement reads the flux
      off the ring although the field vanishes at every site the electron visits. Putting the
      whole phase on a single bond leaves the levels untouched, because the two rings are the
      same operator in two gauges, and the levels see the flux only up to one quantum.

      The sharpest statement is that the two are compatible: half a quantum of flux is
      genuinely different from none, since no change of basis carries one three-site ring to
      the other, and yet the potential remains unobservable. The effect also sits next to the
      geometric phase, being the same holonomy idea with the loop in space rather than in the
      space of states.

      Both halves also hold in the textbook continuum picture, a particle on a circle whose
      derivative carries the flux as a twist, where the levels are squared distances from each
      whole number to the flux. There the lowest level reads the flux off, rather than the
      highest as on the ring, and the gauge factor that removes the twist is a function on the
      circle only when the flux is a whole quantum, which is why the levels move at all. The
      honest boundary is that the two pictures are analogues rather than one derived from the
      other, as nothing takes a limit of large rings, and that this is a ring of sites and a bare
      circle rather than a solenoid, with no double slit and no interference pattern, and that
      nothing here is CSD-specific.
    mathematical: >
      The linear algebra is AharonovBohmRing.lean: N sites with Peierls phases, levels 2
      cos((2 pi m + Phi)/N), diagonalised by the discrete Fourier transform, with gauge
      covariance. energy_lt_energy_of_flux_lt is strict monotonicity of the lowest level in
      the flux on the relevant range; oneBond_mulVec_gauge_mode and same_levels_of_gauge are
      gauge covariance, as concentrating the phase on one bond is a unitary relabelling;
      flux_quantum is periodicity in the flux quantum; flux_not_gauge_artefact says the
      three-site rings at zero and at half a quantum are not related by any change of basis,
      with the explicit levels levels_three_zero giving {2, -1, -1} and levels_three_pi giving
      {1, -2, 1}.

      exists_eq_of_range_ringEigval_eq closes the observability claim in general: two fluxes with
      the same level set differ by a whole quantum or are reflections of one another, at every ring
      size. The top of the spectrum is 2 cos(d/N) with d the distance from the flux to the nearest
      whole quantum (isGreatest_range_ringEigval), which is strictly decreasing in d, and
      range_ringEigval_neg shows the sign really is invisible, so that ambiguity is the truth rather
      than slack in the proof.

      The continuum twin is AharonovBohmCircle.lean, on the circle of circumference 2 pi with the
      twisted derivative: twisted_eigen is the eigenvalue equation for the Fourier modes with
      levels (n - Phi)^2, isLeast_range_circleEigval identifies the ground level as the squared
      distance from the flux to the nearest whole number, exists_eq_of_range_circleEigval_eq
      determines the flux from the levels modulo a quantum and up to sign, and gauge_periodic_iff
      says the gauge factor is single-valued on the circle exactly when the flux is whole.
      circleMode_eq_fourier identifies the modes with Mathlib's own Fourier family.

      On the circle side the operator is now genuine: CircleSobolev.lean has the twisted Laplacian
      as a self-adjoint operator on the square-integrable functions, whose spectrum is the closure of
      those levels, and exists_eq_of_spectrum_twistedOp_eq determines the flux from that spectrum
      rather than from a chosen list of levels. The identification with the differential operator
      holds on every twice-differentiable periodic function, which needed the classical fact that
      differentiating multiplies the nth Fourier coefficient by i n.

      The Peierls substitution is the model's definition rather than a derived statement, so
      the sentence that the field vanishes on the ring is an input. The continuum solenoid and
      the interference form are not formalised, and the operator statement is not extended from
      twice-differentiable functions to every element of its domain, which would need a Sobolev
      embedding the library does not have.
    person: >
      Yakir Aharonov and David Bohm published the effect in 1959 at Bristol, and Werner
      Ehrenberg and Raymond Siday had found it a decade earlier in 1949 in a paper on electron
      optics that went unread. Robert Chambers saw it in the laboratory in 1960, and Akira
      Tonomura's group settled the remaining doubts in 1986 with a toroidal magnet covered in
      superconductor, so that no stray field could reach the electrons at all.

      The effect became the standard argument that gauge potentials are not mere bookkeeping,
      and the loop phase it identifies is the same object that appears throughout gauge theory
      as a Wilson loop.
    term: Aharonov-Bohm effect
    eponyms: []
    status: proved-in-corpus
    lean:
      module: CsdLean4/Empirical/QM/AharonovBohm.lean
      theorem: flux_not_gauge_artefact
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-claims
      text: The current-claims page lists the established results this empirical reproduction joins
    related: [geometric-phase, mach-zehnder, ramsey-interferometry, schrodinger-equation, bloch-sphere]
    external:
      - text: "Aharonov-Bohm, Significance of electromagnetic potentials in the quantum theory (Phys. Rev. 115, 485)"
        url: https://journals.aps.org/pr/abstract/10.1103/PhysRev.115.485

  - slug: wigner-function
    reviewed: 2026-10-01
    image:
      file: img/wigner-function.png
      alt: "Three-dimensional plot of the Wigner function of an even cat state, with peaks above the plane and interference fringes dipping below it"
      caption: "The Wigner function of an even cat state. The fringes between the two peaks go negative, which no probability density can do."
      credit: "Geek3, CC BY-SA 4.0, via Wikimedia Commons"
      licence: "CC BY-SA 4.0"
      source: https://commons.wikimedia.org/wiki/File:Wignerfunction_catstate_even_2.0.png
      article: https://en.wikipedia.org/wiki/Wigner_quasiprobability_distribution
      wide: true
    hook: >
      The Wigner function writes a quantum state as a distribution over position and momentum
      together, which reproduces every prediction of quantum mechanics and goes negative, so
      it's a phase-space picture that can't be a probability.
    layman: >
      Classical mechanics describes a system by a point in phase space, position and momentum
      at once, and statistical mechanics by a probability distribution over such points.
      Quantum mechanics is usually said to forbid this, as position and momentum have no joint
      distribution, and the Wigner function is the precise sense in which that's both true
      and false.

      Wigner's construction takes a quantum state and produces a function of position and
      momentum. Integrate it over momentum and you get the position probability density;
      integrate over position and you get the momentum density. Average any position or
      momentum quantity against it and you get the quantum expectation. In every respect that
      a probability distribution is used for, it works.

      There is a sharper way to say the same thing. The overlap of two Wigner functions over the
      whole of phase space equals the squared overlap of the two states, so nothing is lost in
      passing from a state to its Wigner function, and every quantity a measurement can produce is
      an average of some function against it.

      Except that it can be negative. For any state that isn't a Gaussian bump, the function
      dips below zero somewhere, and a negative probability is no probability at all.
      Negativity is therefore a sharp, quantitative signature of non-classicality, and it's
      used that way in the laboratory, where measured Wigner functions with negative regions
      are the standard evidence that an optical or mechanical state has no classical
      description.
    in_csd: >
      The phase-space formulation is one of the pictures the programme keeps agreeing with,
      and the corpus proves the parts that are Fourier analysis, for states in the Schwartz
      class in one dimension. The function is real, its two marginals are the position and
      momentum densities, the total mass is the norm, the position and momentum expectations
      are the phase-space moments, and the momentum representation is the same function with
      its arguments exchanged, which follows from Parseval's theorem for Schwartz functions.

      Two results are the interpretive ones. A Gaussian state has a positive Wigner function,
      explicitly computed, while any odd state has a strictly negative value at the origin, so
      negativity is exhibited rather than described. And the free evolution moves the Wigner
      function exactly as classical free motion moves a phase-space density, which shows the
      classical flow isn't an approximation in that case but the exact answer. For CSD the
      lesson is a negative one worth stating: the Wigner function is a representation of a
      state and not a candidate for the programme's ontic measure, since the measure that
      weights regions is nonnegative by construction and this function isn't. The Moyal
      bracket is now proved where it can be: the potential term of the Wigner equation is the
      Wigner transform of the quantum commutator, it differs from the classical Poisson bracket by
      a bounded correction of the order of the third derivative of the potential, and the two agree
      exactly when that derivative vanishes, which is the classical limit as a theorem rather than a
      slogan. What is still open there is the time-dependent equation for the evolved state, which
      needs a propagator differentiable on Schwartz functions, and for general Weyl-quantised
      observables the symbol class itself, since a quantisation of an arbitrary symbol need not even
      be continuous.
    mathematical: >
      For a Schwartz psi the Wigner function is the Fourier transform in y of y to psi(x +
      y/2) times conj psi(x - y/2), in Mathlib's convention, with momentum p = 2 pi xi.
      wignerKernel shows the kernel is Schwartz in y; conj_wigner and im_wigner give reality;
      integral_wigner_right gives the position marginal by Fourier inversion at the origin;
      wigner_fourier is the momentum representation W of the transform at (xi, -x) equal to W
      at (x, xi), by SchwartzMap.integral_inner_fourier_fourier applied to modulated affine
      reparametrisations; integral_wigner_left is the momentum marginal, and
      integral_integral_mul_wigner_left and its partner are the moments.

      wigner_gaussianS computes the Gaussian case and wigner_gaussianS_pos its positivity;
      wigner_zero_zero_of_odd gives the value minus twice the norm squared at the origin for
      odd states. wigner_freeSchrodingerS is the free transport W_t(x, p) = W_0(x - p t, p),
      exact because the phase of the free propagator is the character of the shift.

      Two further results make W the state rather than a pair of marginals (WignerWeyl.lean).
      integral_integral_wigner_mul_conj is the overlap identity: the phase-space overlap of two
      Wigner functions is the squared modulus of the states' inner product, by slicewise Plancherel
      and the convolution integral, with integral_integral_wigner_sq its purity form. And
      integral_conj_mul_weylOp is the Weyl expectation formula, for a symbol presented as a family
      of Schwartz Fourier slices. One dimension, Schwartz data.

      Row 92 (b) and (c) landed 2026-09-30 in WignerCalculus.lean: integral_prod_wigner_mul_conj is
      the overlap identity against the product measure on the plane, through
      integrable_normSq_wigner_prod, and integral_integral_wigner_pos, _mom and _posMom are the
      phase-space moments in operator form, the xi-weighted one giving the symmetrised product of
      position and momentum. The Schwartz property of W on the plane is not proved and is not needed:
      slicewise Plancherel makes the xi-integral of the squared modulus a convolution of two L^1
      functions, which is what Fubini wants. What remains of row 92 is (a), Op(a) as a continuous
      operator for symbols of temperate growth, which needs differentiation under the integral sign
      to all orders with bounds. Row 64 landed its generator half 2026-09-30 in MoyalBracket.lean:
      moyalPot_eq_comm, norm_moyalPot_sub_poisson_le with its hbar-squared remainder, and
      moyalPot_eq_poisson_of_third_deriv_zero; the time-dependent equation is what stays open.
    person: >
      Eugene Wigner introduced the function in 1932, in a paper on quantum corrections to
      thermodynamic equilibrium, and treated it as a calculational device rather than a
      foundational statement. Jose Enrique Moyal worked out in 1949 that the whole of quantum
      mechanics can be rewritten in these terms, with a deformed product in place of the
      operator product, which is the phase-space formulation as a formulation.

      Hilbrand Groenewold had reached much of the same ground in 1946, and the construction
      now carries all three names in different communities, with the deformed product called
      the Moyal or star product.
    term: Wigner function
