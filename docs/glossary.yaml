  - slug: no-signalling
    reviewed: 2026-09-14
    image:
      file: img/no-signalling.jpg
      alt: "Portrait photograph of Albert Einstein"
      caption: "Albert Einstein, whose 1935 paper with Podolsky and Rosen made the question sharp."
      credit: "Oren Jack Turner, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Albert_Einstein_Head_cleaned.jpg
      article: https://en.wikipedia.org/wiki/Albert_Einstein
    hook: >
      Nothing done to the far wing of an entangled pair changes the statistics seen at the
      near wing, and CSD proves this exactly, for every state, entangled ones included.
    layman: >
      Entangled particles are pairs prepared together so that measurements on them show
      correlations no local account explains. The first thing every newcomer asks is
      whether those correlations let someone send a message faster than light, that is,
      whether a choice made at one particle can be read off at the other. Quantum
      mechanics says no, the principle has a name, no-signalling, and a programme that
      reconstructs quantum mechanics should say no as a theorem rather than as an apology.

      In CSD it's a theorem, twice over. The first version is about composite arenas, the
      state spaces CSD assigns to two systems considered together. Disturb one part
      however you like, by any operation confined to that part, and every measurable
      quantity of the other part keeps exactly the same value, so the change cancels
      identically and not approximately. The second version is about the Bell model, as
      the explicit contextual model that reproduces the singlet statistics has remote
      marginals, the outcome frequencies seen on one side alone, that provably don't
      depend on what's done to the other side.

      Correlation without signalling is therefore not a tension to be managed. It follows
      from what an operation confined to one part can and can't touch.
    in_csd: >
      In CSD, no-signalling is a fact about where operations act and not a constraint
      placed on probabilities by hand. An operation on the right-hand part of a composite
      arena is built from the right-hand modes only (a mode is one of the elementary
      degrees of freedom from which the arena is assembled), and every observable of the
      left-hand part is built from the left-hand modes only. The two act independently of
      each other, so applying the operation and then reading the left-hand observable
      gives the same answer as reading it alone, and because the argument never mentions
      which state the composite is in, it holds for every state, entangled states
      included.

      The version for the Bell model matters separately. Contextual models, in which
      outcomes depend on the measurement context, are exactly the kind of model critics
      suspect of hidden signalling, so the corpus proves the operational no-signalling
      conditions for its exhibited model rather than gesturing at them.
    mathematical: >
      The theorem composite_no_signalling states that on the composite field arena,
      conjugating by any unitary supported on one sector leaves every observable of the
      other sector's subalgebra exactly invariant, for every composite state, as the kick
      commutes past every observable supported on the other sector.

      The contextual-model version proves remote marginal invariance for both wings, with
      one shared measure across contexts, which is measurement independence stated in-
      module. Both results are foundational-triple-only.
    term: No-signalling
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/CompositeArena.lean
      theorem: composite_no_signalling
    site_link:
      url: https://www.constraintsurfacedynamics.com/position
      text: The position page states the operational no-signalling the programme keeps
    related: [singlet-contextual-model, bell-not-join, isolation, field-arena, tsirelson-bound]

  - slug: bell-not-join
    reviewed: 2026-09-14
    hook: >
      The arena CSD assigns to two systems together is strictly larger than the two arenas
      simply paired, and the Bell state is a point of the excess, so entanglement is
      located exactly.
    layman: >
      The saying that entanglement means the whole is more than its parts is repeated so
      often that it has stopped meaning anything, and it deserves to be made into a
      theorem with real content, a precise inventory of what the whole contains that the
      parts don't.

      In the arena picture, where CSD describes each system by a geometric space of
      possible configurations called its arena, combining two systems offers two candidate
      constructions. The first is mere pairing, in which every joint configuration is a
      configuration of the left system together with a configuration of the right one and
      nothing more, and the second is the genuine composite arena the theory demands. The
      theorem says the Bell state, the most famous entangled state in quantum mechanics,
      lives in the composite arena and is provably not any pairing, as no choice of a left
      configuration and a right configuration jointly produces it.

      That's entanglement as an address, a strict gap between the paired construction and
      the composite one, with the Bell state exhibited inside the gap.
    in_csd: >
      The composite arena is built by concatenating the modes, the elementary degrees of
      freedom, of the two components, and the pairing of two component points is given by
      a standard construction, the Segre construction, which is the arena-level
      counterpart of the tensor product by which quantum mechanics combines systems. The
      theorem is the arena-side signature of the difference between combining by tensor
      product and combining by simple pairing, as the composite strictly exceeds the image
      of the pairing map, and the Bell state witnesses it.

      What the excess does has its own answer. An observer with access to one side of the
      Bell state alone sees its reduced state, and that reduced state is the maximally
      mixed ensemble on the correlated patterns, equal weight on each possibility with no
      information about which one holds. Entanglement is therefore exactly what turns the
      weights a local context assigns to a definite state into the weights of a
      statistical mixture, while the labels of the remote pattern drop out entirely.
    mathematical: >
      The theorem bell_not_join states that the Bell ray over distinct correlated
      configuration pairs isn't in the image of the arena join.

      Companion results show that the join factorises densities as Kronecker products,
      with exact marginals and with joint expectations of product observables factoring on
      joins. That's a property of product states, held by every local composite, and it
      isn't local tomography, which is RecordLocallyTomographic in
      SigmaLayer/TensorTomography.lean. The composite algebras are generated by the mode-
      local subalgebras, with the reconstruction theorem consumed arena-natively.

      The reduced density of the Bell ray is the equal mixture with local weights exactly
      one-half.
    term: Bell state is not a join
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/CompositeArena.lean
      theorem: bell_not_join
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper C1 is where the Bell state's irreducibly joint character is machine-checked
    related: [no-signalling, field-arena, peres-criterion, kronecker-product, hong-ou-mandel]

  - slug: lieb-robinson-bound
    reviewed: 2026-09-14
    image:
      file: img/lieb-robinson-bound.jpg
      alt: "Portrait photograph of Elliott Lieb"
      caption: "Elliott Lieb."
      credit: "Originally uploaded by Elieb (Transferred by Baroc), CC BY-SA 3.0, via Wikimedia Commons"
      licence: "CC BY-SA 3.0"
      source: https://commons.wikimedia.org/wiki/File:Elliott-Lieb-07.jpeg
      article: https://en.wikipedia.org/wiki/Elliott_H._Lieb
    hook: >
      Even without relativity, influence in a quantum system with local interactions has a
      speed limit, and on CSD's finite field arena that limit is a theorem with the
      velocity written out.
    layman: >
      Nothing in ordinary, non-relativistic quantum mechanics obviously forbids an effect
      here from showing up arbitrarily fast over there, yet matter behaves locally. In
      1972 Lieb and Robinson proved that systems built from many pieces on a lattice, each
      interacting only with its neighbours, enforce their own speed limit. There's an
      effective velocity, and outside the cone it defines, the region a signal travelling
      at that velocity could reach, influence isn't merely weak but exponentially small in
      the distance.

      CSD's field arena is a finite version of such a system, a finite collection of
      modes, the elementary degrees of freedom, linked by a coupling graph in which an
      edge joins two modes that interact directly. The corpus proves the finite-arena
      version of the bound from scratch, in stages that mirror the physics. An operation
      and a distant observable have no effect on each other at all until enough steps of
      interaction have passed to bridge the graph distance between them, the smallest
      number of edges connecting them. Beyond that point the leading term of the
      influence, measured by what mathematicians call the commutator, the difference made
      by the order in which two operations are applied, decays like a power, and a
      factorial strengthening then makes the bound decay at every time. Finally the
      closing form extracts an explicit velocity, so outside the cone it sets the
      commutator is suppressed by an exponential in the distance.

      The result is a light cone earned from the structure of the couplings alone.
    in_csd: >
      The bound is load-bearing rather than decorative, as it's the mechanism behind the
      programme's account of locality on the field arena. The record layer, CSD's account
      of how measurement outcomes are written into the arena, runs the bound through a
      bridge to the arena with its fibre attached, so a record cell in the fibre can be
      steered from outside the cone by no more than a bound that collapses factorially
      with distance, which is what makes records stable against distant meddling by
      theorem rather than by hope.

      The scope is stated plainly. The velocity obtained is a bound and not the best
      possible one, the setting is a finite graph of modes and not a continuum, and the
      corpus explicitly doesn't identify this dynamical cone with the kinematic light rays
      of its dispersion analysis.
    mathematical: >
      The proof runs as a chain. Nested commutators of edge-supported generators stay in
      the coupling graph's k-ball and vanish exactly below the graph distance, and the
      flow remainder obeys a factorial estimate via an integral bound.

      Hence the commutator of a time-evolved observable A and a static observable B at
      graph distance d is bounded by 2 norm(A) norm(B) (2 norm(S) t)^d / d!, and the
      closing theorem norm_commutator_velocity_le gives, for v t <= d with v = 2 e^2
      norm(S), the bound 2 norm(A) norm(B) e^(-d).
    person: >
      Elliott Lieb was born in 1932. An American mathematical physicist at Princeton, he
      has attached his name to an improbable number of sharp inequalities across analysis
      and quantum theory. Derek Robinson (1935-2021) was a British-Australian mathematical
      physicist, long at the Australian National University, and co-author of the standard
      operator-algebra treatment of quantum statistical mechanics. Their 1972 paper in
      Communications in Mathematical Physics proved the group velocity bound for lattice
      spin systems, and it waited three decades for its renaissance and then became the
      workhorse of the locality estimates of quantum information theory.
    term: Lieb-Robinson bound
    eponyms: [Lieb, Robinson]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/LiebRobinson.lean
      theorem: norm_commutator_velocity_le
    site_link:
