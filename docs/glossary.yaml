  - slug: partial-trace
    reviewed: 2026-09-14
    hook: >
      Mathlib has no partial trace for matrices, so the corpus built one, the staple
      operation of quantum information, with its working properties proved and staged for
      contribution upstream.
    layman: >
      This is the formal-methods reader's problem more than the physicist's. Ignoring part
      of a quantum system, tracing out the environment and keeping a description of the
      subsystem, is the single most common operation in quantum information, and the
      operation that does it is called the partial trace. Ask what a library of formalised
      mathematics offers for it and, in the case of Mathlib, the community library for the
      Lean proof assistant, the answer at the level of matrices is nothing.

      The corpus's staging tree, its collection of general-purpose results written for
      eventual contribution to Mathlib, fills the gap. It provides the partial trace over
      either factor of a composite system, together with the lemmas you actually need,
      which are linearity, preservation of the total trace, so probability is conserved,
      preservation of positivity, the fact that the reduced state of a density matrix is
      again a density matrix, and the defining identities that pair a joint operator
      against observables of one side only.

      Nothing in it is specific to CSD. It's general infrastructure, built to be given
      away.
    in_csd: >
      The partial trace is load-bearing across the corpus. Reduced states in the
      decoherence and einselection tiers, the parts of the programme that describe how
      interaction with an environment singles out certain states as stable, marginals of
      the composite field arena, where local observations on entangled points are exactly
      expectations in the reduced state, and the subadditivity arguments of the entropy
      tier all consume it.

      A small story of library hygiene attaches. The defining reduced-trace identities
      were originally proved in the entropy module, and when the work on entangled weights
      needed them without the rest of the entropy machinery they were moved to sit beside
      the definition, so the rule is that the defining property of an operation lives with
      the operation.

      On the constraint surface the partial trace is the operation that turns the joint
      description into the system's own. A preparation of system and environment together
      is flowed, its density operator on the joint space is formed, and tracing out the
      environment gives the system's density operator after the interaction. That reduced
      operator is what a channel acts on, so the partial trace is the exact point at which
      the programme's ontic flows become the operational channels of quantum information.
    mathematical: >
      partialTraceRight and partialTraceLeft on Matrix (n x m) (n x m), with bundled
      linearity, trace preservation, Kronecker reduction, the trace of the traced-out
      factor scaling the survivor, Hermiticity and positivity preservation via tensor
      witness vectors, and density-to-density.

      The reduced-trace identities Tr(M (X (x) I)) = Tr(Tr_B M X) and its mirror are
      proved alongside, and all of it is foundational-triple-only.

      Two spellings coexist, Matrix.traceRight and Matrix.traceLeft in
      Mathlib/LinearAlgebra/Matrix/PartialTrace.lean and the QuantumInfo pair above, and
      the Stinespring module uses the former. The reduced flowed barycentre is computed by
      barycenterMatrix_kronecker_of_ae (a product preparation has a Kronecker barycentre,
      almost everywhere in the representative) and traceRight_barycenter_flow
      (LF2/FlowChannel.lean).
