  - slug: simon-algorithm
    hook: >
      Simon's algorithm was the exponential separation that convinced Shor: a hidden
      bitwise mask, unfindable classically without exponential work, falls to a handful of
      quantum queries and some linear algebra.
    layman: >
      Imagine a black box that computes a function of bit strings: you may feed it inputs
      and read the outputs, but not look inside. The function repeats itself under a hidden
      mask: two inputs give the same output exactly when they differ by a secret string,
      meaning that one is obtained from the other by flipping the bits where the secret has
      ones. The task is to find the secret. Classically all you can do is hunt for a
      collision, two inputs with the same output, and the same counting that governs shared
      birthdays in a crowd says that this costs a number of queries growing exponentially
      with the length of the strings.

      Simon's procedure queries the box once with the register in superposition, holding
      every input at once, then measures in a way that asks about interference patterns
      across inputs rather than about any single input. Each run hands you one random
      linear equation that the secret must satisfy. About as many runs as the secret has
      bits, followed by solving those simultaneous equations, and the secret is yours.

      It was the first exponential separation between quantum and classical computation
      for a promise problem, one whose input is guaranteed in advance to have the required
      structure. Its direct descendant is famous: Shor read Simon's paper and asked what
      the same trick does to periods that are arithmetic rather than bitwise.
    in_csd: >
      Simon's algorithm is one of the corpus's algorithm witnesses, in the family that
      works by querying an oracle between two layers of Hadamard gates, beside
      Deutsch-Jozsa and Bernstein-Vazirani. The standing disclaimer applies: witnesses mark
      the scope of what the library can express; they do not support the foundations.

      What is proved is the per-outcome content of one round, starting from the state left
      after the query and a measurement of the output register: an equal superposition of
      the two inputs that share the observed output. Outcomes that are not orthogonal to
      the secret, meaning those whose bitwise parity against the secret is odd, have
      probability zero, and every orthogonal outcome carries the same probability. The
      classical post-processing, collecting equations and solving them, is stated as the
      reading of the result, not re-verified.
    mathematical: >
      After the oracle query and a second-register measurement, the first register is a
      coset state |x0> + |x0 + s>; the Hadamard transform gives outcome y the amplitude
      (1/sqrt 2)^{n+1} (-1)^{<x0,y>} (1 + (-1)^{<s,y>}), which vanishes unless <s,y> = 0
      mod 2 and is otherwise uniform of squared norm 2/2^n. The corpus proves both halves:
      outcomes with <s,y> = 1 have probability zero (simon_orthogonal), and every outcome
      with <s,y> = 0 carries the same probability (simon_uniform).

      So each round samples uniformly from the subspace orthogonal to s; n - 1 independent
      samples determine s by linear algebra over F_2.
    person: >
      Daniel Simon proved the separation in 1993 while at the Universite de Montreal. The
      paper was initially rejected before appearing at FOCS 1994, in the same conference
      and the same session as Shor's factoring paper, which cites it as the trigger. Simon
      spent most of his subsequent career at Microsoft Research working on cryptography.
    term: Simon's algorithm
    eponyms: [Simon]
    status: standard-mathematics
    related: [deutsch-jozsa, bernstein-vazirani, shor-algorithm, quantum-fourier-transform, grover-algorithm]
    external:
      - text: "Overview"
        url: https://en.wikipedia.org/wiki/Simon%27s_problem

  - slug: bernstein-vazirani
    hook: >
      A hidden string of bits costs one classical question per bit, or exactly one quantum
      question in total: the Bernstein-Vazirani algorithm is the cleanest single-query win
      the field has.
    layman: >
      An oracle holds a secret string of bits and, for any input string you send, returns
      a single bit: the parity, meaning whether the number of positions where both your
      input and the secret have a one is odd or even. Classically each query buys you one
      bit of the secret, so a secret of a given length costs that many queries, and no
      cleverness helps.

      Bernstein and Vazirani ask once. Prepare the uniform superposition, the register
      holding every possible input at once with equal weight. Let the oracle act, so that
      it writes each parity into the sign of the corresponding amplitude rather than into a
      separate output. Then undo the superposition. The interference is total: the register
      reads the secret string itself, with certainty, every time.

      No probability, no repetition, no post-processing. One query, one answer.
    in_csd: >
      Bernstein-Vazirani is an algorithm witness in the same family as Deutsch-Jozsa and
      Simon, an oracle between two layers of Hadamard gates, and the corpus proves the
      strong version: the full circuit's output is concentrated entirely on the secret
      string, that outcome having probability one and every other outcome probability
      zero. Unlike the reduced analysis of Simon's algorithm, this is the complete circuit,
      superposition, oracle and undoing, with no measurement reduction along the way.

      The standing disclaimer applies as ever: the algorithms consume the programme's
      unitary-evolution pillar; they do not support the foundations.
    mathematical: >
      The circuit is H^n then the phase oracle |x> to (-1)^{<a,x>} |x> then H^n, on |0^n>.
      The output amplitude at y is (1/2^n) sum over x of (-1)^{<y+a, x>}, and the character
      sum reduces to 2^n [y = a], the Kronecker delta. The corpus proves outcome a with
      probability one (bv_certain) and every other outcome zero (bv_zero).

      The content is one orthogonality of characters over F_2^n; the algorithm is the
      observation that a single physical query evaluates all the parities in superposition.
    person: >
      Ethan Bernstein and Umesh Vazirani published the algorithm inside their 1993 STOC
      paper on quantum complexity theory, the paper that defined BQP and made quantum
      computation a complexity class rather than a curiosity. Vazirani, at Berkeley, went
      on to shape much of the field's theory; Bernstein was his doctoral student.
    term: Bernstein-Vazirani algorithm
    eponyms: [Bernstein, Vazirani]
    status: standard-mathematics
    related: [deutsch-jozsa, simon-algorithm, hadamard-test, grover-algorithm, quantum-fourier-transform]
    external:
      - text: "Overview"
        url: https://en.wikipedia.org/wiki/Bernstein%E2%80%93Vazirani_algorithm

  - slug: swap-test
    hook: >
      The swap test measures how alike two quantum states are without learning anything
      about what either one is: a comparison that keeps both secrets.
    layman: >
      Two devices each hand you a quantum state, and you want to know whether they agree.
      Measuring either state disturbs it and reveals only a little about it, and comparing
      the two lists of amplitudes directly is not an operation nature offers.

      The swap test threads one extra qubit, called an ancilla, through both states. Put
      the ancilla into a superposition of its two readings. In the branch where it reads
      one, swap the two states; in the other branch, leave them alone. Then close the
      superposition so that the two branches interfere, and read the ancilla. If the two
      states are identical, the swap changed nothing, and the ancilla reads zero every
      time. If the states are orthogonal, meaning perfectly distinguishable, the ancilla is
      a fair coin. In between, the bias of the coin measures the overlap of the two states,
      the standard gauge of their resemblance, which runs from zero for perfectly
      distinguishable states to one for identical ones.

      Repeat as often as you like: the overlap is estimated to any accuracy, and neither
      state is ever identified. It is the standard likeness-meter of quantum information.
    in_csd: >
      The swap test is the witness that opens the corpus's ancilla-interferometry family,
      the algorithms that read a quantity off the interference of a single helper qubit,
      beside the oracle family of Deutsch-Jozsa, Bernstein-Vazirani and Simon. The
      probability that the ancilla reads zero is proved to be exactly one half plus half
      the squared overlap of the two states, with the identical-state and orthogonal-state
      readings as corollaries.

      The standing disclaimer applies: the algorithms consume the programme's
      unitary-evolution pillar; they do not support the foundations.
    mathematical: >
      H on the ancilla, controlled swap, H again, on |0> tensor psi tensor phi; the
      ancilla-zero marginal is (1/4) times the squared norm of psi tensor phi + phi tensor
      psi, and the cross term <psi tensor phi, phi tensor psi> = |<psi, phi>|^2 closes it:
      P(0) = (1 + |<psi, phi>|^2)/2 exactly (swap_test_prob).

      P(0) = 1 iff the states coincide up to phase; P(0) = 1/2 iff they are orthogonal; the
      estimator is quadratic in the overlap, which is why it reveals magnitude and not
      phase.
    term: swap test
    status: standard-mathematics
    related: [hadamard-test, amplitude-estimation, hong-ou-mandel, fisher-information, grover-algorithm]
    external:
      - text: "Overview"
        url: https://en.wikipedia.org/wiki/Swap_test

  - slug: hadamard-test
    hook: >
      The Hadamard test turns a matrix element, a complex number buried inside an operator,
      into the bias of a single coin.
    layman: >
      Quantum algorithms constantly need expectation values. An operator is a
      transformation of a quantum state, a rotation of it, say, and its expectation value
      in a given state is the number you get by comparing the state with its transformed
      version: how much of the original survives, and with what phase. That number lives
      in the amplitudes, and amplitudes are not things a measurement returns.

      The Hadamard test converts the number into a coin. One helper qubit, an ancilla, is
      put into a superposition of its two readings and controls whether the operator acts:
      in one branch it does, in the other it does not. Closing the superposition makes the
      two histories interfere, and the ancilla's bias towards reading zero is exactly the
      real part of the expectation value. A complex number has a real part and an
      imaginary part, and a small phase adjustment on the ancilla before the final step
      reads the imaginary part instead.

      Flip the coin enough times and the number emerges. It is the parent trick behind the
      swap test and behind half of the variational quantum algorithms.
    in_csd: >
      The Hadamard test is the parent witness of the corpus's ancilla-interferometry
      family, the algorithms that read a quantity off the interference of a single helper
      qubit. Three facts are proved: the probability that the ancilla reads zero is exactly
      one half plus half the real part of the expectation value; the probability of reading
      one is the complement; and the difference between the two is exactly the real part
      itself. A fourth theorem recovers the swap test as the instance in which the operator
      is the swap of two registers, tying parent to child.

      The standing disclaimer applies: the algorithms consume the programme's
      unitary-evolution pillar; they do not support the foundations.
    mathematical: >
      H on the ancilla, controlled-U, H again, on |0> tensor psi: the ancilla marginals are
      (1 plus-or-minus Re<psi, U psi>)/2. The corpus proves P(0) = (1 + Re<psi, U psi>)/2
      (hadamard_test_prob), the complementary outcome, and the sign reading
      P(0) - P(1) = Re<psi, U psi> (hadamard_test_prob_diff). The estimator is linear in
      the operator, which is what makes it the general-purpose expectation-value primitive.

      The corpus also closes the family loop: at U the swap on a doubled system the test's
      bias reproduces the swap test's (hadamard_test_swap_closed), tying parent to child in
      one theorem.
    term: Hadamard test
    status: standard-mathematics
    related: [swap-test, phase-estimation, deutsch-jozsa, bernstein-vazirani, amplitude-estimation]
    external:
      - text: "Overview"
        url: https://en.wikipedia.org/wiki/Hadamard_test

  - slug: amplitude-amplification
    reviewed: 2026-09-11
    hook: >
      Amplitude amplification is the theorem of which Grover's algorithm is a shadow: any
      quantum procedure with any success probability can have that probability raised by
      pure interference, quadratically faster than retrying.
    layman: >
      Suppose your quantum procedure succeeds only sometimes, with some fixed probability.
      Classically the only remedy for a small probability is repetition, about one over the
      probability runs, and it is natural to assume that this is simply what boosting
      success must cost.

      Brassard, Hoyer, Mosca and Tapp found the general trick hiding inside Grover's
      search. Reflect the state about the failures, then reflect it about where you
      started. A reflection here is the quantum analogue of a mirror: it flips the sign of
      one part of the state and leaves the rest alone. Two reflections make a rotation, and
      each round rotates the state by a fixed angle towards success. After about one over
      the square root of the probability rounds, not one over the probability, you measure
      and win, and the exact success curve at every round is known in closed form.

      Run past the sweet spot and you rotate beyond the target: the procedure has a timer,
      just as Grover's does. Grover's search is exactly this machine pointed at a uniform
      starting state with one marked item.
    in_csd: >
      Amplitude amplification is a library theorem in the corpus, deliberately free of CSD
      content and fully general: any finite register, any set of outcomes counted as good,
      any starting state whose success probability lies strictly between zero and one. The
      two-reflection rotation and the closed-form success curve are exact statements, not
      approximations for large registers. The recommended round count succeeds with
      probability at least one minus the starting probability, and that round count is at
      most a fixed constant times one over the square root of the starting probability:
      the quadratic speedup as a named inequality.

      The corpus's module on Grover's algorithm is rebuilt on this theorem. The search step
      is proved to be the amplification step, the headline result is re-derived as an
      instance, and the distribution for several marked items arrives free. For an unknown
      success probability the module also carries the randomised search engine from the
      same paper: a round count chosen uniformly at random below a cap succeeds with
      average probability at least one quarter once the cap is large enough relative to
      the success probability, and the sum over rounds telescopes to an exact closed form.
      The exact threshold is stated in the mathematical section. The standing disclaimer
      applies: the algorithm layer consumes the programme's unitary-evolution pillar and
      does not support the foundations.
    mathematical: >
      A Cat-1 theorem. On EuclideanSpace C over a finite basis with good set G: the step is
      reflection about the initial state composed with the sign flip on the good
      coordinates. On the plane spanned by the normalised good and bad components the step
      is a rotation by 2 theta with sin theta = sqrt(goodProb); j rounds send the plane
      angle to (2j+1) theta, so the success probability is exactly sin^2((2j+1) theta),
      that is sin^2((2j+1) arcsin sqrt(a)) (amplitude_amplification).

      The optimal count m = floor(pi/(4 theta)) lands the angle within theta of pi/2,
      giving success at least cos^2(theta) = 1 - a; and m <= pi/(4 sqrt a) since
      sqrt a = sin theta <= theta. For unknown a the QSearch engine (BHMT Lemma 2) is also
      proved: a uniformly random round count below M succeeds with average probability at
      least 1/4 once M * 2 sqrt(a(1-a)) >= 1, the odd-angle sum telescoping to an exact
      closed form. Degenerate boundaries a = 0 (no plane) and a = 1 (nothing to amplify)
      are excluded by hypothesis. Round counting is abstract; no oracle model or gate
      decomposition is claimed.
    person: >
      Gilles Brassard (Montreal) is one half of the BB84 quantum-cryptography protocol.
      Peter Hoyer (Calgary), Michele Mosca (Waterloo, later a founder of the Institute for
      Quantum Computing) and Alain Tapp (Montreal) were his collaborators in the
      Quebec-Ontario quantum information school of the late 1990s.

      Their paper, "Quantum Amplitude Amplification and Estimation" (2000, published 2002),
      unified a string of post-Grover boosting tricks into one two-reflection geometry and
      paired it with amplitude estimation, the phase-estimation reading of the same
      rotation, which is where the two workhorse subroutines of the field meet.
    term: amplitude amplification
    eponyms: [Brassard, Hoyer, Mosca, Tapp]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/AmplitudeAmplification.lean
      theorem: amplitude_amplification
    related: [grover-algorithm, amplitude-estimation, phase-estimation, swap-test, quantum-fourier-transform]
    external:
      - text: "BHMT, Quantum Amplitude Amplification and Estimation (quant-ph/0005055)"
        url: https://arxiv.org/abs/quant-ph/0005055

  - slug: amplitude-estimation
    reviewed: 2026-09-11
    hook: >
      Point phase estimation at the rotation inside amplitude amplification and the
      success probability itself becomes measurable, quadratically faster than sampling
      could ever learn it.
    layman: >
      Amplitude amplification boosts a success probability; amplitude estimation measures
      it. Classically, learning a probability to a given precision costs about one over
      the square of that precision in samples: ten times the precision needs a hundred
      times the runs. The quantum route starts from a fact about the amplification step. It
      rotates a two-dimensional stage by an angle whose squared sine is the success
      probability, so the probability is encoded in an angle. A rotation has two special
      states that it leaves unchanged apart from a phase factor, and those phase factors,
      its eigenvalues, carry exactly the angle in question. Eigenvalue angles are precisely
      what phase estimation reads out.

      So run the rotation a controlled number of times, read the control register through
      the quantum Fourier transform, and the measured index lands near the angle with fixed
      odds. Squaring the sine of that angle gives the estimate of the probability, accurate
      to about one over the number of rounds after only that many rounds. That quadratic
      saving is what makes quantum counting and quantum Monte Carlo speedups work.

      The state splits into exactly two clean branches, one rotating clockwise and one
      anticlockwise. Because the companion states of the two branches are perpendicular,
      the readout is an honest half-and-half mixture of two well-understood distributions,
      with no interference between them.
    in_csd: >
      Amplitude estimation is where three prepared layers of the corpus meet in one
      theorem: the eigenstructure of the amplification step, whose rotation plane carries
      two special states with opposite rotation angles; the joint-register mixture law,
      which says that perpendicular second factors kill every cross-term in the readout
      probabilities; and the phase-estimation success bound. The state of the control
      register after the controlled rotations is proved equal to a two-branch phase form,
      so the counting readout is an exact half-and-half mixture: an equality, not an
      estimate.

      The stated bounds are these. Any index in the window closest to the true angle
      carries probability at least two divided by pi squared; its mirror index carries the
      other branch's two divided by pi squared and decodes to the same estimate, so the
      pair jointly carries four divided by pi squared; and the estimate lands within an
      explicit distance of the truth that shrinks in proportion to one over the number of
      rounds, with the exact expression in the mathematical section. Honest scope: the
      paper's literal bound of eight divided by pi squared additionally counts both
      rounding directions, which needs a two-index Dirichlet-kernel inequality that is
      recorded in the plan and not attempted. The standing disclaimer applies: the
      algorithm layer consumes the programme's unitary-evolution pillar and does not
      support the foundations.
    mathematical: >
      The AA-5b assembly. With Q the amplification step at angle theta (sin theta = sqrt a)
      on the rotation plane, the kickback state (1/sqrt T) sum_x |x> tensor Q^x psi
      decomposes exactly as c_+ phaseState(theta/pi) tensor v_+ + c_- phaseState(-theta/pi)
      tensor v_-, where v_+- = g +- i b are the orthogonal eigenvectors,
      Q^x v_+- = e^(+-2 i x theta) v_+-, and |c_+-| = 1/2.

      Applying the inverse QFT to the counting register and taking the Born marginal gives
      exactly (P_+(c) + P_-(c))/2, the half-half mixture of the two single-phase counting
      distributions. At any c with |theta/pi - c/T| <= 1/(2T), the plus branch contributes
      at least 4/pi^2, so the marginal carries at least 2/pi^2; the mirror index -c carries
      the minus branch's 2/pi^2 and decodes to the same estimate, so the pair carries
      4/pi^2. And sin^2(pi c / T) estimates a = sin^2 theta within
      2 sqrt(a(1-a)) eps + eps^2 at eps = pi/(2T), that is within
      pi sqrt(a(1-a))/T + pi^2/(4 T^2), by the product-form sin^2 difference identity plus
      the Lipschitz bound on sin (amplitude_estimation). The paper's literal 8/pi^2
      additionally counts both rounding directions, which needs a two-index
      Dirichlet-kernel inequality recorded in the plan and not attempted.
    person: >
      The same four authors as amplitude amplification, Brassard, Hoyer, Mosca and Tapp,
      in the same 2000 paper, "Quantum Amplitude Amplification and Estimation". The
      estimation half is the paper's Theorem 12, feeding their quantum counting results:
      estimating how many marked items a database holds without ever listing them.

      The technique is the meeting point of the field's two workhorse subroutines,
      Grover's rotation geometry (1996) and Kitaev-style phase estimation (1995), and
      later became the engine of quantum Monte Carlo speedups through Montanaro's 2015
      work.
    term: amplitude estimation
    eponyms: []
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/AmplitudeEstimation.lean
      theorem: amplitude_estimation
    related: [amplitude-amplification, phase-estimation, grover-algorithm, fisher-information, swap-test]
    external:
