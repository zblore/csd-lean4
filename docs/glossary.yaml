  - slug: way-theorem
    reviewed: 2026-09-29
    image:
      file: img/way-theorem.jpg
      alt: "Photograph of Huzihiro Araki at a conference"
      caption: "Huzihiro Araki at the Bogoliubov conference, 2009."
      credit: "Valentin A. Zagrebnov, CC BY-SA 4.0, via Wikimedia Commons"
      licence: "CC BY-SA 4.0"
      source: https://commons.wikimedia.org/wiki/File:Araki_Volovich_Bogoliubov_Conference_2009_(cropped).jpg
      article: https://en.wikipedia.org/wiki/Huzihiro_Araki
    hook: >
      A conservation law restricts what can be measured, as an observable that fails to
      commute with the conserved quantity admits no exact measurement by an interaction that
      conserves it, provided the apparatus pointer is blind to its own share of the charge.
    layman: >
      Measurement is a physical interaction, so it has to obey the conservation laws that
      every other interaction obeys. Wigner asked what that costs, and the answer is that some
      measurements become impossible.

      Suppose the system and the apparatus together conserve a quantity, with each contributing
      its own share, as they do for energy, momentum or spin along an axis. Now try to measure
      an observable of the system that doesn't commute with the system's share of that
      conserved quantity. Recording the outcome means leaving the apparatus in one of several
      distinguishable states, and doing so exactly, with no error, turns out to be
      incompatible with conservation, so no such measurement exists. Read the other way round,
      exact measurements are available only for observables that commute with the conserved
      quantity.

      The result comes with a side condition, and the condition is doing real work rather than
      tidying up. The argument needs either that the pointer states carry no information about
      the apparatus's own share of the charge, which is Yanase's condition, or that the
      measurement can be repeated with the same answer. Drop both and there are counterexamples,
      so the theorem isn't a blanket prohibition but a precise one.
    in_csd: >
      The corpus proves the theorem on the quantum-mechanical side, as an inner-product
      argument with no ontology in it, and then states honestly where it bears on the
      programme, which is nowhere, for different reasons at the two places a measurement is
      modelled. In the von Neumann tier the hypotheses can be met, since the measurement
      interaction there is an isometry on a product of two spaces and an additive conserved
      quantity for it is exhibited, and the conclusion then holds without effort because the
      recorded basis is already diagonal for the conserved quantity. In the record layer the
      hypotheses are not met at all, as the stroke that forms a record is a skew product on
      the programme's arena rather than a linear isometry on a joint Hilbert space, and its
      twin theorem proves that no encoding of the Hilbert data into any space, with any map and
      any readout, reproduces the pointer image the stroke produces, because the outcome is
      selected by the ontic fibre coordinate.

      That's a scope statement and not an escape. Nothing here says the programme evades a
      conservation law, only that no apparatus charge is modelled at either tier, which is a
      recorded modelling boundary: which interaction an apparatus realises, and hence which
      quantity it conserves, is an input rather than a derived fact. Two witnesses keep the
      module honest. A controlled-not interaction meets every hypothesis, through the
      repeatability branch, so the theorem isn't vacuous. A swap interaction conserves a charge,
      records exactly, and still fails the conclusion, because it fails both branches of the
      side condition at once, so a reader cannot believe that condition removable.
    mathematical: >
      Everything follows from arakiYanase_identity: for exact records U(a tensor xi) = phi
      tensor xi1 and U(a' tensor xi) = phi' tensor xi2 of orthogonal system vectors, with U
      inner-product preserving and commuting with L = L_S tensor 1 + 1 tensor L_A, one has <a,
      L_S a'> = <phi, L_S phi'><xi1, xi2> + <phi, phi'><xi1, L_A xi2>. Orthogonal pointers kill
      the first term and the Yanase condition or repeatability kills the second
      (arakiYanase_offDiag_eq_zero), so summing over an eigenbasis of A makes L_S block diagonal
      in the eigenspaces of A: Commute A L_S (wigner_araki_yanase), with
      no_exact_record_of_not_commute the contrapositive.

      The tensor structure enters only through a map with the inner-product factorisation and
      additivity of L on product vectors, so no linearity of U, no matrix exponential and no
      unitary group is needed. Witnesses: way_hypotheses_satisfiable (controlled-not conserves
      one charge and records another exactly and repeatably),
      swap_exact_record_not_commute (swap conserves, records, and fails both side conditions),
      sigmaX_no_exact_conserving_record (the no-go in use). The record-layer twin is
      no_joint_hilbert_map in Empirical/CSD/WignerArakiYanase.lean, stated at the level of any
      joint lift so that base back-reaction cannot invalidate it. Ozawa's quantitative form,
      bounding the measurement error below by the inverse apparatus variance, is not formalised.
    person: >
      Eugene Wigner raised the problem in 1952 in a paper on the measurement of quantum
      observables, and Huzihiro Araki and Mutsuo Yanase gave the general theorem in 1960, with
      Yanase adding the condition on the pointer states in 1961. All three were thinking about
      whether the measurement postulate is consistent with the rest of physics rather than
      about any practical limitation.

      Masanao Ozawa turned the structural theorem into a quantitative one in 2002, showing that
      a gate failing to commute with a conserved charge has a fidelity floor set by the
      control system's charge variance, which is the form the result takes in quantum
      computing.
    term: Wigner-Araki-Yanase theorem
    eponyms: [Araki, Yanase]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Empirical/QM/WignerArakiYanase.lean
      theorem: wigner_araki_yanase
    site_link:
      url: https://www.constraintsurfacedynamics.com/position
      text: The position page's no-go section is where this theorem's bearing on the programme is set out
    related: [ozawa-error-disturbance, pointer-basis, record-layer, robertson-uncertainty, luders-rule]
    external:
