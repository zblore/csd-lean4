  - slug: kahler-form
    reviewed: 2026-09-29
    image:
      file: img/kahler-form.jpg
      alt: "Portrait photograph of Erich Kähler"
      caption: "Erich Kähler."
      credit: "Konrad Jacobs, Erlangen, CC BY-SA 2.0 de, via Wikimedia Commons"
      licence: "CC BY-SA 2.0 de"
      source: https://commons.wikimedia.org/wiki/File:Erich_Kähler.jpeg
      article: https://en.wikipedia.org/wiki/Erich_K%C3%A4hler
    hook: >
      On the space of quantum states, distance, area and a quarter-turn coming from the
      complex numbers lock together, and that lock is what makes the volume of the space
      nobody's choice.
    layman: >
      The space of quantum states carries three structures that could, in principle, have
      nothing to do with one another. There's a way of measuring distances between states,
      called a metric. There's a way of measuring areas, called a form. And there's a
      quarter-turn operation, which comes from multiplying by the imaginary unit, the
      number whose square is minus one, so applying it twice reverses a direction, just as
      two quarter-turns make a half-turn.

      On this space the three aren't independent, as each one can be recovered from the
      other two. Turn the metric through a quarter-turn and you get the area form, and so
      on around the triangle. A space in which the three lock together in this way is
      called Kahler, and the lock has a payoff, as such a space owns a volume of its own.
      Take the area form, raise it to the highest power the dimension allows, and the
      result measures volume, so no external ruler is required.

      That's why the measure used throughout this programme isn't an extra ingredient
      someone had to supply. The geometry already contains it.
    in_csd: >
      This underwrites the claim that CSD's typicality measure, the measure used to say
      how large a region of states is, is geometric rather than chosen, which is the
      difference between deriving the Born rule and restating it with more steps.

      The corpus proves the locking of the three structures at two levels. At each point,
      in the space of directions through that point, it establishes the compatibility
      relations, so the quarter-turn squares to minus one, the area form is the metric
      composed with the turn and vice versa, the form survives turning both of its inputs,
      and pairing a direction with its own quarter-turn returns its squared length. For
      the whole space of states, it establishes that the area form has the two properties
      that make a space symplectic, the setting in which classical mechanics is done, that
      the quarter-turn is the complex structure the space naturally carries, so the space
      is Kahler in both of the standard senses, and that the top power of the form is the
      Fubini-Study measure up to a fixed constant.

      What this doesn't change is what carries the Born derivation, which still runs
      through the invariance characterisation of the measure, the fact that it's the
      unique measure left unchanged by the unitary symmetries. The geometry is proved to
      agree with that measure and not to replace it, and the mathematical section gives
      the exact claims.
    mathematical: >
      With g the real part of the inner product, omega the imaginary part, and J
      multiplication by i, J squared is minus one, omega equals g after J, g equals omega
      after J, omega is of type (1,1), and omega(u, Ju) equals the squared norm of u. All
      of this is proved axiom-free, pointwise, on the tangent model.

      The manifold statements are all proved in the corpus's own manifold layer, as
      Mathlib has no differential forms on manifolds at the pin. They are
      fsForm_isSymplectic (the Fubini-Study form is closed and non-degenerate on CP^n),
      fsForm_isKahler (with J the multiplication by i, read through the holomorphic
      atlas), IsKahler.nijenhuis_eq_zero (the Nijenhuis tensor vanishes),
      fsVolume_eq_smul_fsMeasure (the top power of the form is (4 pi)^n times the
      Fubini-Study measure), and riemannianVolume_fsMetric (the Riemannian volume of the
      compatible metric is that top power over n factorial). The sector's posited
      Liouville measure is proved to be this volume (LF4/SectorManifold.lean).

      One restriction remains as stated. The corpus's permitted-claims list forbids
      calling Kahler geometry load-bearing for the Born rule, because the uniqueness
      argument that carries the programme runs through Haar measure, so the geometry is
      proved to agree with it and not to replace it.
    person: >
      Erich Kahler (1906-2000) was born in Leipzig and took his doctorate there at twenty-
      two. After the war, which included a spell as a French prisoner of war, he held
      chairs at Berlin and Hamburg.

      The manifolds come from one short 1933 paper. He had noticed that when metric,
      complex structure and form are compatible, a single potential function generates
      everything, a simplification whose consequences he didn't live to see fully spent in
      Hodge theory, the classification of complex surfaces, Calabi-Yau spaces and string
      theory. Andre Weil attached the name in the 1950s, two decades late. Kahler's own
      later work drifted into a private philosophical system that attracted essentially no
      following, which is a reminder that mathematicians get one name on the map and
      rarely two.
    term: Kahler form
    eponyms: [Kahler]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/Geometry/Manifold/Instances/ProjectiveSpaceFubiniStudySymplectic.lean
      theorem: fsForm_isKahler
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper D develops the geometric quantum mechanics this form carries
