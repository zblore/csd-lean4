entries:
  - slug: fubini-study-measure
    reviewed: 2026-09-11
    hook: >
      The space of quantum states allows exactly one way of measuring size that respects its
      symmetry. That unique measure is what turns regions of the space into Born-rule
      probabilities.
    layman: >
      In quantum mechanics the complete description of a system at one moment is called its
      state, and the collection of all possible states forms a curved space, rather as every
      place on Earth is a point on a globe. CSD says that the probability of an outcome is
      the fraction of that space occupied by the states that lead to it. To make sense of a
      fraction you need a way of saying how big a region is: a measure, meaning a rule that
      assigns a size to every region. Choose the rule carelessly and you could make any
      region as large or as small as you liked, which would amount to writing the answer
      into the question.

      What rescues the idea is symmetry. The space of states has a family of rearrangements,
      the unitary transformations, which are the quantum counterpart of rigid motions. They
      carry any state to any other state while preserving the overlap between every pair of
      states, where the overlap is the number that fixes how likely one state is to be found
      when the other was prepared. A measure is called invariant when these rearrangements
      leave the size of every region unchanged, so that no direction in the space is
      secretly favoured. That is the natural sense in which a measure can be fair.

      The Fubini-Study measure is the fair one, and it is the only one. Once the whole space
      is given size one, exactly one invariant measure exists on the space of states, and
      that uniqueness is a theorem rather than a convention. Whatever sizes it reports,
      nobody chose them; the geometry of the space fixes them on its own.
    in_csd: >
      CSD does not assume the Born rule. It calculates the probability of each outcome as a
      ratio of volumes: the size of the region of states that leads to the outcome, divided
      by the size of the whole space. A ratio of volumes means nothing until the measure is
      fixed, and this is the measure. The whole point of the derivation is that the measure
      is forced by the geometry rather than picked by the theorist.

      It is forced because any state can be carried to any other by a unitary
      transformation, so the space of states is as symmetric as a space can be. A space with
      that much symmetry admits exactly one invariant probability measure, by the same
      argument that gives a unique fair measure on the surface of a sphere. The measure
      therefore falls out of the geometry instead of going in as an assumption.

      This answers the oldest objection to arguments from typicality, which is that they
      presuppose the very measure they claim to justify. Here the measure is derived from
      symmetry, with a uniqueness proof behind it. Helland reaches the same conclusion from
      the theory of group representations; CSD reaches it from geometry. Two independent
      routes to the same answer are worth more than either alone.
    mathematical: >
      CP^(N-1) is the compact homogeneous space U(N)/(U(1) x U(N-1)). The Fubini-Study
      measure is the unique U(N)-invariant Borel probability measure on it. Equivalently, as
      standard mathematics, it is the normalised Riemannian volume of the Fubini-Study
      metric, or the top power of the Kahler form over n factorial. All three readings are
      corpus theorems identifying the same measure: the top power of the Fubini-Study form
      is (4 pi)^n times the measure (fsVolume_eq_smul_fubiniStudyMeasure), and the
      Riemannian volume of the Fubini-Study metric is that top power over n factorial
      (riemannianVolume_fsMetric), so the measure is the normalised Riemannian volume
      (riemannianVolume_fsMetric_eq_smul_fubiniStudyMeasure). The invariance
      characterisation is the one that carries the weight in the Born derivation; the other
      two are corpus results rather than background. See the Kahler form entry.

      The proof is Haar uniqueness carried downstairs. The unitary group is compact, so it
      has a unique invariant probability measure; the state space is a quotient of the
      group; pushing the measure forward along the orbit map carries the uniqueness with it.
      Proved at general N with no imported axioms.

      The construction takes a reference point, but that is bookkeeping rather than
      freedom: fubiniStudyMeasure_basepoint_independent shows that every choice gives the
      same measure, so defaultFubiniStudyMeasure is the measure, not one member of a family.
    person: >
      Guido Fubini (1879-1943) was born in Venice and trained at the Scuola Normale
      Superiore in Pisa. He held chairs at Catania, Genoa and, from 1908, the Politecnico di
      Torino. Most people meet him through his theorem on exchanging the order of
      integration; the metric that bears his name came out of his work on projective
      differential geometry. Italy's racial laws stripped him of his post in 1938. He
      emigrated the following year and taught at Princeton and NYU until his death.

      Eduard Study (1862-1930) was German. He trained at Jena, Strasbourg, Leipzig and
      Munich, and held the chair at Bonn from 1904. He worked on invariant theory and
      complex geometry, and had a reputation for abrasive independence that kept him at
      arm's length from the Gottingen establishment. The two men found the metric
      independently, within about a year of each other, around 1904 to 1905, and neither
      knew of the other's work. That is why it carries both names.
    term: Fubini-Study measure
    eponyms: [Fubini, Study]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/LinearAlgebra/Projectivization/FubiniStudyUnique.lean
      theorem: fubiniStudyMeasure_unique
    papers:
      - doi: 10.5281/zenodo.19557174
        note: TN1, the Fubini-Study measure as a U(N)-equivariant pushforward
      - doi: 10.5281/zenodo.16746829
        note: Paper B, the symmetry argument that fixes the measure
    external:
      - text: "Bengtsson and Zyczkowski, Geometry of Quantum States, 2nd ed., CUP 2020"
        url: https://www.cambridge.org/core/books/geometry-of-quantum-states/
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper B derives the Born rule from this measure
    related: [born-weight, liouville-measure, kahler-form, haar-measure, typicality-volume]

  - slug: born-weight
    reviewed: 2026-08-25
    hook: >
      Quantum probabilities are not a law of nature in CSD. They are the sizes of regions in
      the space of states, measured with a ruler that nobody was free to choose.
    layman: >
      Quantum mechanics predicts probabilities rather than certainties: run the same
      experiment a thousand times and you get stable statistics. The recipe for those
      statistics is the Born rule. Each possible outcome is assigned a quantity called an
      amplitude, and the probability of the outcome is the square of the amplitude's size.
      The recipe works perfectly, but the textbook never says where it comes from. It is
      simply laid down as an axiom. Why the square, rather than the fourth power or the
      plain size? The textbook is silent.

      That silence should be troubling. Everywhere else in physics, probabilities come from
      somewhere: from counting cases, from ignorance of fine detail, from the relative sizes
      of possibilities. Only in quantum mechanics is probability written in by hand at the
      ground floor.

      CSD's answer is that the recipe is geometry. The space of all quantum states divides
      into regions, one for each possible outcome of a measurement, and the probability of
      an outcome is the fraction of the space that its region occupies. The square in the
      textbook rule is simply what those fractions turn out to be when the regions are
      measured with the one measure that the symmetry of the space allows.
    in_csd: >
      This is the programme's central result, the one that everything else supports. The
      outcome regions divide the space of states, the Fubini-Study measure says how large
      each piece is, and the ratio of a region's size to the whole equals the textbook
      weight exactly: not approximately, and not only in special cases.

      Three features carry the weight of the claim. The result is proved at every
      dimension, so it is not an accident of the simplest system. It never uses Gleason's
      theorem, the standard route to the Born rule, so the corpus holds two genuinely
      independent derivations rather than one argument in two costumes. And the measure
      doing the work is forced by symmetry, which is what keeps the reasoning from being
      circular.

      Much turns on this. If the result failed, CSD would be a reinterpretation of quantum
      mechanics. Because it holds, CSD can claim a reconstruction, and that distinction is
      the whole stake.
    mathematical: >
      For a preparation vector psi on CP^(N-1), the Fubini-Study measure of the barycentric
      outcome region attached to basis vector e_k equals the squared modulus of the inner
      product of e_k with psi. This is proved coordinate by coordinate at general N, using
      neither Gleason nor Busch. It is unconditional in the sense that decides circularity,
      since nothing about the measure or the weights is assumed, while the headline form
      carries a genericity hypothesis of no vanishing amplitude. That hypothesis is retired
      in the companion unconditional forms, where a vanishing amplitude simply gives a cell
      of measure zero and the identity still holds.

      The route runs through the moment map. Outcome regions pull back to regions of the
      probability simplex, where the Fubini-Study measure becomes flat by
      Duistermaat-Heckman, so the curved-space volume ratio collapses to an ordinary
      Lebesgue computation. A companion apex statement covers the dropped vertex, so all N
      coordinates of a generic preparation are covered, not just a chart that misses one.
    person: >
      Max Born (1882-1970) was born in Breslau, now Wroclaw. He studied at Breslau,
      Heidelberg, Zurich and Gottingen, and returned to the Gottingen chair in 1921. During
      the 1920s his institute trained or hosted Heisenberg, Pauli, Jordan, Fermi,
      Oppenheimer and Teller, and for a decade it was the centre of the quantum world.

      The probability rule has one of the best publication stories in physics. Born's 1926
      paper on collisions stated, in the body of the text, that the probability was the
      amplitude itself. The correction, that it is the square of the amplitude, went in as a
      footnote added at proof stage. Few footnotes have carried so much.

      Born was dismissed in 1933 under the Nazi civil-service laws. He went to Cambridge and
      then to the Tait Chair in Edinburgh. The Nobel Prize came in 1954, twenty-eight years
      after the footnote, and he felt the delay keenly. Olivia Newton-John was his
      granddaughter.
    term: Born rule
    eponyms: [Born]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF4/MomentBornN.lean
      theorem: fs_born_volume_ratio_N
    related: [fubini-study-measure, born-volume-ratio, typicality-volume, outcome-region, is-the-born-rule-derived]

  - slug: duistermaat-heckman
    reviewed: 2026-08-25
    hook: >
      Project the curved space of quantum states down to its outcome probabilities and the
      curvature disappears exactly. That fact is what makes the Born rule computable in
      every dimension.
    layman: >
      The space of quantum states is curved, and computing the volume of a region in a
      curved space is usually hard work, the kind that gets harder quickly as the number of
      dimensions grows. CSD says that probabilities are volumes of regions in this space, so
      you might expect every probability calculation to be a small project in differential
      geometry.

      It is not, and the reason is the Duistermaat-Heckman formula. Fix a measurement. Each
      state then has two kinds of content: a list of probabilities, one for each outcome of
      the measurement, and a further angle-like piece of information called phase, which
      affects how states interfere with one another but not the probability of any single
      outcome. There is a natural way to compress a state down to its list of
      probabilities, discarding the phases. Under that compression the curved space
      flattens completely. The volume of a region of states becomes an ordinary flat volume
      inside a simplex, the shape formed by all lists of probabilities that add up to one.
      For three outcomes the simplex is a triangle, and the calculation is the kind you
      could do with school geometry.

      Mathematicians know the general phenomenon as exact stationary phase. The method of
      stationary phase is normally an approximation, a first guess at an integral; in the
      presence of enough symmetry it turns out to be exactly right.
    in_csd: >
      This is the engine that makes the Born result computable rather than merely true. The
      compression that sends each state to its list of outcome probabilities is called the
      moment map. Pushing the Fubini-Study measure through the moment map gives a measure
      on the simplex of probability lists, and that measure is flat: every part of the
      simplex counts equally. A curved volume ratio in a high-dimensional space becomes a
      flat volume inside a simplex.

      Without this, the Born theorem at general dimension would have been assembled case by
      painful case, or not at all. With it, the central claim of the programme is a finite
      computation at every dimension. It is also a pleasing historical accident: a piece of
      symplectic geometry, the geometry that underlies classical mechanics, developed for
      entirely unrelated reasons, turned out to be exactly the tool that a question in the
      foundations of quantum mechanics needed.
    mathematical: >
      For a measurable region R of the open free moment simplex, the Fubini-Study measure of
      its preimage under the normalised moment map equals M factorial times the Lebesgue
      volume of R. Equivalently, the pushforward of the Fubini-Study measure along the
      moment map is the flat Dirichlet distribution on the simplex.

      This is the Duistermaat-Heckman theorem in measure-theoretic clothing. For a
      Hamiltonian torus action the pushforward of Liouville measure is piecewise
      polynomial; here the polynomial is constant. Proved unconditionally, at general N.
    person: >
      Hans Duistermaat (1942-2010) was born in Den Helder and took his doctorate at Utrecht
      in 1968. After a chair at Nijmegen he returned to Utrecht in 1975 and became the
      leading Dutch geometer of his generation. Gerrit Heckman was his student at Leiden
      and Utrecht, and later a professor at Nijmegen.

      The formula appeared in Inventiones in 1982, with an addendum the following year that
      fixed the degenerate cases, a small lesson in how even exact results can be published
      slightly wrong. Atiyah and Bott recast it almost immediately in the language of
      equivariant cohomology, which is how most geometers now know it. Duistermaat died
      suddenly of lymphoma at sixty-seven, still supervising students.
    term: Duistermaat-Heckman formula
    eponyms: [Duistermaat, Heckman]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF4/MomentBornN.lean
      theorem: fs_volume_eq_dirichlet
    related: [moment-map, kahler-form, fubini-study-measure, liouville-measure, dirichlet-distribution]

  - slug: gleason-theorem
    reviewed: 2026-09-04
    hook: >
      The standard route to the Born rule is proved inside the corpus rather than borrowed,
      and CSD's own derivation never uses it, so the two routes to quantum probability are
      genuinely independent.
    layman: >
      Gleason's theorem answers a question about where quantum probabilities can come from.
      Suppose you want to assign probabilities to quantum yes-or-no questions, and you
      impose one condition only: when several questions are mutually exclusive, so that at
      most one of them can be answered yes, their probabilities must add up properly. That
      seems like almost no constraint at all, and you would expect enormous freedom in the
      assignment.

      Gleason proved that there is none. Any assignment satisfying that single condition
      must be the standard quantum recipe. The hypothesis is thin, the conclusion is total,
      and the proof is famously hard. Busch later strengthened the result to cover unsharp
      questions, those that can be answered with some fuzziness, and his version holds even
      for the simplest quantum system, where Gleason's original does not.

      Because the proof is hard, formalisation projects usually assume the theorem and move
      on. Assuming it is not free, though. A project that claims to explain where quantum
      probabilities come from, while quietly assuming the theorem that forces them, has a
      hole in the middle of its explanation. This corpus proves the effect-valued version
      outright, so nothing is borrowed.
    in_csd: >
      Two things turn on this theorem, and they pull in different directions, which is why
      both matter.

      The first is honesty. With the theorem proved, the corpus depends on no imported
      mathematical result beyond the foundations of the proof assistant itself. When the
      documentation says axiom-free, it means exactly that, not axiom-free apart from one
      large borrowed theorem. That is a claim about imported axioms, not about assumptions.
      CSD's physical postulates, among them the ontic substrate, the sector, the
      preservation of volume by the flow, and the cell law, are a separate category. They
      are carried as explicit hypotheses and stated structure rather than as axiom
      declarations, and they are registered in the programme's list of posits. Axiom-free
      has never meant assumption-free.

      The second is independence. CSD's own Born derivation runs through ratios of volumes
      and never touches this theorem, so the corpus contains two separate roads to the same
      rule, and they share no machinery. There is a cautionary tale attached. A published
      abstract once described this theorem as an external input; that was true when it was
      written and false by the time it was read, because the corpus had proved the theorem
      in the meantime. That episode is why the glossary's claims are checked automatically
      against the corpus rather than by good intentions.
    mathematical: >
      Every operational package on a finite-dimensional space admits an effect-Gleason
      representation: the probability assignment on effects is given by a density operator
      through the trace pairing.

      This is Busch's effect-valued form of the theorem, and the choice matters. The
      original projection-valued Gleason theorem fails in dimension two, where the qubit's
      projections are too sparse to pin down a frame function, while the effect-valued
      version holds there too. It was proved in-corpus on 2026-07-21, depending only on the
      foundational triple, and discharged what had been the single imported axiom.

      The axiom-free claim concerns imported axioms only. CSD's physical postulates are
      category 3 in AXIOMS.md section 0; they are carried as hypotheses and structure
      fields rather than axiom declarations, so they never appear in the output of #print
      axioms, and they are registered in specs/POSITS.md: the ontic substrate, the sector,
      Liouville preservation and the cell law.
    person: >
      Andrew Gleason (1921-2008) was born in Fresno and read mathematics at Yale, then went
      straight into the Navy as a cryptanalyst working on Japanese ciphers. He never took a
      PhD. Harvard elected him to its Society of Fellows regardless, and he stayed there for
      his whole career, a chaired professor without a doctorate, which remained a local
      curiosity.

      The 1957 theorem answered a question posed by George Mackey. Gleason himself rated it
      a minor piece of work and was prouder of his part in solving Hilbert's fifth problem.
      Posterity disagrees.

      Paul Busch (1955-2018) was German, took his doctorate at Cologne, and held a chair at
      York from 2005. His 2003 strengthening of the theorem to effects is the version that
      survives in dimension two, and the version proved here.
    term: Gleason and Busch theorems
