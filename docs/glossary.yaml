  - slug: wigner-rigidity
    reviewed: 2026-08-25
    hook: >
      Preserve the overlaps between quantum states and you have no freedom left: the
      rearrangement must be a unitary or an anti-unitary transformation, whether or not you
      intended it to be.
    layman: >
      Any two quantum states have an overlap: a number between zero and one that
      experiments can measure directly, as the probability of finding one state when the
      other was prepared. An overlap of one means the two states are the same; an overlap
      of zero means they can be told apart with certainty. Wigner rigidity is about what
      happens when you rearrange the space of states while keeping every overlap fixed.

      Imagine rearranging the entire space of states however you like. No rules about
      smoothness, no rules about linearity, and no promise that the rearrangement can be
      undone. One condition only: every overlap stays the same. You might expect that to
      leave enormous freedom. It leaves almost none.

      Wigner proved that the only rearrangements passing this test are the rigid motions
      physics already knew about: the unitary transformations, which are the quantum
      counterpart of rotations, and their mirror images, the anti-unitary transformations,
      which are the mathematics of time reversal. Nothing else exists. The structure of
      quantum state space is so tight that preserving one experimentally meaningful number
      forces everything.
    in_csd: >
      This is the strongest result in the corpus by logical type, rather than by
      difficulty. Almost everything else described as forced here rests on first assuming a
      symmetry group and then deriving consequences. This theorem assumes only that
      overlaps are preserved, and derives the group. That is a different and better kind of
      claim, and the corpus's own necessity audit singles it out as one of exactly two
      unconditional necessities in the whole development.

      What it buys is the licence to treat unitary evolution as compelled rather than
      chosen. A flow that preserves transition probabilities, which is to say the overlaps,
      has no option but to act unitarily at each moment. That is half of the Schrodinger
      pillar, the part of the programme that derives the equation of motion. The other
      half, that a continuous unitary flow has a generator, is Stone's theorem, and
      together they make the dynamics an output rather than an input.

      It also anchors the record layer, the part of CSD that describes how measurement
      outcomes are recorded. There the preserved quantity is a statistic of records rather
      than an abstract overlap, and the same rigidity turns that operational requirement
      into the same group of transformations.
    mathematical: >
      Every transition-probability-preserving self-map of CP^(N-1) is induced by a unitary
      or by an antiunitary map. There are no other hypotheses.

      What makes the formalisation honest: linearity is an output of the construction,
      never an assumption, and bijectivity is likewise derived. The antiunitary branch is
      genuinely present rather than waved away, which matters because time reversal is
      antiunitary and a version of the theorem without that branch would exclude a real
      physical symmetry. Foundational-triple only.
    person: >
      Eugene Wigner (1902-1995) was born in Budapest and trained, of all things, as a
      chemical engineer at the Technische Hochschule in Berlin, a background he credited
      for his nose for problems that mattered. He worked at Gottingen and Berlin, left as
      the Nazis rose, and settled at Princeton in 1930 for the rest of his career, apart
      from the war years on the Manhattan Project at Chicago and Oak Ridge.

      The theorem appeared in his 1931 book on group theory and atomic spectra, with a
      proof so compressed that filling the gaps became a minor industry for decades;
      genuinely complete proofs are surprisingly recent. The antiunitary branch, which
      looked like a technical annoyance, turned out to be the mathematics of time reversal,
      and Wigner himself supplied that application. He shared the 1963 Nobel Prize for his
      work on symmetry principles in physics.
    term: Wigner rigidity
    eponyms: [Wigner]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/LinearAlgebra/Projectivization/WignerRigidity.lean
      theorem: wigner_rigidity
    related: [stone-theorem, bargmann, schrodinger-from-records, projective-sector, hilbert-space]

  - slug: stone-theorem
    reviewed: 2026-09-11
    hook: >
      Ask only that time evolution never jumps, and differentiability, a generator and the
      Hamiltonian all follow for free.
    layman: >
      A system evolving in time is described by a family of transformations, one for each
      duration, which compose the way durations add: evolving for two seconds and then for
      three is the same as evolving for five. Physics wants to differentiate that family,
      to speak of the rate at which the state changes, and to call the quantity that
      generates the change the energy, or Hamiltonian. But differentiating presupposes
      smoothness, and nobody said the evolution had to be smooth. Assuming it feels
      harmless. In fact it is most of the conclusion.

      Stone's theorem says you do not need to assume it. Require only that the evolution be
      continuous, meaning that states at nearby times are nearby and nothing jumps, and
      smoothness follows on its own. So does the generator: a single fixed quantity from
      which the whole family of transformations can be rebuilt by compounding, much as a
      fixed interest rate generates the growth of a balance over any period. The analogy
      has one limit: in quantum mechanics the generator turns the state rather than growing
      it, which is why total probability stays fixed.

      In other words, the Hamiltonian is not an ingredient added to quantum mechanics by
      hand. It is extracted from the bare requirement that time evolution does not
      teleport.
    in_csd: >
      The programme needs the generator to be earned, not posited. Posit a Hamiltonian and
      you have smuggled in the dynamics you claimed to derive, and the reconstruction would
      be decorative. This theorem is how the smuggling is avoided: from continuity alone
      comes the generator, and the Schrodinger equation, the equation of motion of quantum
      mechanics, is a conclusion rather than a starting point.

      The full chain has two links. Wigner rigidity says that a flow preserving transition
      probabilities must act by unitary transformations at each instant. Stone's theorem
      says that a continuous one-parameter family of unitary transformations is generated
      by a single fixed operator. Those are the corpus's two unconditional necessities, and
      the second pillar of the programme, the derivation of the dynamics, stands on exactly
      them.
    mathematical: >
      A strongly continuous one-parameter group of unitary matrices is t maps to exp(tA)
      for a skew-Hermitian A. The hypothesis is continuity only. The C-one version proved
      first carried a differentiability assumption; the strengthening that removes it is
      the part with content, since assuming differentiability is uncomfortably close to
      assuming the answer.

      One library note worth knowing: Mathlib carries no Stone theorem at this pin. The
      names beginning with Stone there are Stone-Weierstrass and Stone duality. The
      finite-dimensional case is supplied here.
    person: >
      Marshall Stone (1903-1989) was born in New York, the son of a future Chief Justice of
      the United States, and took his doctorate at Harvard under George Birkhoff. The
      theorem on one-parameter unitary groups dates from 1932, the same era as his duality
      and approximation theorems.

      His second act was administrative and just as consequential. He moved to the
      University of Chicago in 1946 and rebuilt a fading department into arguably the
      world's best in about five years, hiring Weil, Chern, Zygmund and Mac Lane in a spree
      still called the Stone Age. It is one of the few cases in which a first-rank
      mathematician was also a first-rank chairman.
    term: Stone's theorem
    eponyms: [Stone]
    status: proved-in-corpus
