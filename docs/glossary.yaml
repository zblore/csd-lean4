  - slug: is-the-born-rule-derived
    kind: question
    hook: >
      It's derived, as the volume of a region of the underlying state space measured with
      the one ruler its symmetry allows, and the assumptions that remain are named posits,
      listed openly rather than hidden in the machinery.
    layman: >
      The Born rule is the textbook's recipe for quantum probabilities. A quantum state
      assigns each possible outcome a number called an amplitude, and the rule says the
      probability of that outcome is the square of the amplitude's size. In the textbook
      this is an axiom, postulated and not explained, and in CSD it's a computed quantity.
      The probability of an outcome is the size of a region of the arena, the underlying
      state space, measured with the unique measure the space's symmetry allows, and a
      convergence theorem turns those sizes into the frequencies observed over many runs.

      Two things make this more than a restatement. The measure is forced, as its
      uniqueness is a theorem, so nobody tuned the ruler to get the right sizes. And the
      regions, in the mature form of the results, aren't carved to fit either, as their
      sizes fall out of the geometry through the moment map, the function that reads off
      from each point of the state space the quantities its symmetry conserves.

      What isn't claimed is derivation from nothing. The projection from the arena to the
      space of quantum states is a postulate, and reading probability as typicality, the
      fraction of the compatible microstates that lead to an outcome across repeated
      preparations, is a stance the theorems make precise rather than prove. The
      programme's habit is to say exactly this out loud.
    in_csd: >
      The chain runs in three steps. The Fubini-Study measure, the natural volume on the
      space of quantum states, is the unique measure invariant under the symmetries of
      that space, meaning unchanged by every symmetry transformation, and this is the
      argument of Paper B, proved at general dimension. The Born weight equals a ratio of
      volumes in that measure, unconditionally and for every coordinate. And empirical
      frequencies converge to those volumes almost surely under repeated preparation. The
      historically carved constructions, in which regions were cut to reproduce the right
      sizes, are retained and labelled as such, using the corpus's own word carving, and
      the derived route stands independent of them.

      The remaining posits are structural and named. Projectability, the sector postulate,
      says the arena projects onto the space of quantum states. The typicality reading
      interprets the conditioned measure as probability. The cell law says a measurement
      context's outcome rates generate its pointer torus, the family of rotations of the
      state space associated with the apparatus, and this is what ties the outcome regions
      to the moment map. A separate route to the Born rule of the Gleason type exists on
      the operational stratum, the layer that describes measurements in the language of
      laboratory operations, and it's kept distinct so nobody can mistake which layer a
      citation leans on.
    mathematical: >
      The route is fsMeasure_unique, fs_born_volume_ratio_N with the apex
      variant, born_frequency_convergence_N for the joint almost-sure statement, and the
      moment-map identity momentMap_mk_eq_inner_sq with the Duistermaat-Heckman
      pushforward behind it.

      The volume route is Gleason-free end to end, and the effect-Gleason representation
      is proved separately on the operational stratum. The remaining posits
      (projectability, the typicality reading, the cell law) are registered in
      specs/POSITS.md.
    term: Is the Born rule derived or assumed in CSD?
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-3
      text: The third primer page explains why the familiar probability rule follows
    related: [born-weight, typicality, fubini-study-measure, where-do-probabilities-come-from, lf1-main-theorem]

  - slug: where-do-probabilities-come-from
    kind: question
    hook: >
      They come from ignorance of the exact starting point, as the dynamics never rolls
      dice, and the probabilities are the sizes of the sets of microstates a preparation
      can't tell apart, measured with a ruler nobody was free to choose.
    layman: >
      A deterministic world seems to leave no room for quantum probability. The resolution
      is old and respectable, probability as ignorance of the initial conditions, but that
      resolution always carried a debt, as somebody has to choose the measure of
      ignorance, the rule that says how much weight each possible starting point gets, and
      if you choose it freely you can get any answer you like.

      CSD's account starts from the fact that every run of an experiment begins from a
      slightly different microstate, a slightly different point of the underlying state
      space, because no procedure controls the arena completely. The set of microstates
      compatible with what the procedure does control is the preparation region, and the
      fraction of that region that leads to a given outcome, computed in the one measure
      the symmetry of the space allows rather than one chosen for convenience, is the
      outcome's probability. The strong law of large numbers, the theorem that averages
      over many independent repetitions settle down to the underlying fractions, converts
      those fractions into the frequencies laboratories actually record.

      So there's one path through the world, dice nowhere, and the randomness lies
      entirely in which microstate each preparation happened to land on.
    in_csd: >
      This is typicality under repeated preparation, and it's worth stating what it isn't.
      Probabilities don't come from watching one trajectory for ever and hoping it
      explores the space fairly, visiting each region in proportion to its size. That
      property, called ergodicity, is one the corpus proves the projected flow doesn't
      have, so the time-average route is closed at that level, and the programme never
      needs it, as each trial is a fresh draw from the conditioned measure and the
      frequency theorems run on that alone.

      The measure-choice debt is paid by a uniqueness theorem. The Fubini-Study measure,
      the natural volume on the space of quantum states, is the only one invariant under
      the symmetries of that space, so the ignorance is priced by a ruler nobody selected.
    mathematical: >
      LF1_main_theorem_ae converts region volumes into almost-sure limiting frequencies
      under i.i.d. preparation sampling, fsMeasure_unique removes the measure
      freedom, and the general-N volume identities make the limiting values the Born
      weights.

      The non-ergodicity of the epistemic unitary flow is proved and kept as a boundary
      marker between the claimed route and the unclaimed one.
    term: If CSD is deterministic, where do probabilities come from?
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-2
      text: The second primer page is where probability enters a deterministic theory
    related: [typicality, determinism, single-trajectory, is-the-born-rule-derived, typicality-volume]

  - slug: is-csd-a-hidden-variable-theory
    kind: question
    hook: >
      Yes, in the technical sense, as something definite underlies the quantum state in
      CSD, and the programme openly pays the two prices the no-go theorems demand,
      dependence on measurement context and correlations beyond what locality permits.
    layman: >
      "Hidden-variable theory" is a technical classification and not an insult. It means a
      theory in which something definite underlies the quantum state, so the state is a
      summary of a more detailed reality, and CSD has exactly that, the arena, its
      underlying state space, and the one real trajectory through it. So the honest answer
      is yes, with the classification's fine print read aloud.

      The fine print is the no-go theorems, and they don't say what the one-line summaries
      claim. Bell's theorem rules out local hidden variables, those in which a choice made
      far away can never affect an outcome here, and the Kochen-Specker theorem rules out
      non-contextual ones, those in which every measurement has a fixed answer regardless
      of which other measurements are made alongside it. Surviving both means being
      contextual and letting correlations exceed what locality permits, which is precisely
      the shape CSD has, on purpose.

      One error is worth avoiding, as the quantum state isn't the hidden variable. The
      state is the visible summary, and the hidden variable is the point of the arena
      beneath it, including the fibre coordinate, the part of the underlying state no
      quantum state determines.
    in_csd: >
      The corpus proves the constraining theorems itself rather than citing them. No way
      of splitting a shared space of hidden states into a part for each particle can
      reproduce the singlet correlations, the strongest correlations of a paired two-
      particle state. No single context-independent assignment of outcomes survives
      contextuality. And the GHZ and CGLMP obstructions, named after Greenberger, Horne
      and Zeilinger and after Collins, Gisin, Linden, Massar and Popescu, which are
      further Bell-type results for more than two particles and for measurements with more
      than two outcomes, hold at general dimension. The corpus also proves that the
      survival is genuine rather than verbal, as the contextual model that reproduces the
      singlet table exists as a constructed object.

      Where the correlations exceed locality, signalling still provably doesn't occur.
      Locality of operations holds exactly, as an intervention far away moves no local
      statistic, and that's the physically load-bearing half of locality, and the one
      experiments enforce.
    mathematical: >
      no_product_partition_realises_singlet and its GHZ companion over arbitrary
      measurable state spaces, the global-assignment obstruction and the contextual
      witness in the C1 capstone, and composite_no_signalling, exact for all states.

      The Kochen-Specker-adjacent contextuality machinery of the Mermin-Peres square is
      also in-corpus.
    term: Is CSD a hidden-variable theory?
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/position
      text: The position page places the programme against the hidden-variable no-go results
    related: [hidden-variables, contextuality, does-csd-violate-bell, csd-vs-bohmian-mechanics, does-kochen-specker-rule-out-csd]

  - slug: does-kochen-specker-rule-out-csd
    kind: question
    hook: >
      No. The Kochen-Specker theorem forbids giving every possible measurement a fixed
      answer independent of which experiment is actually performed, and CSD assigns
      outcomes through the measurement context by construction.
    layman: >
      The Kochen-Specker theorem is the quieter sibling of Bell's. It shows you can't
      assign definite answers to all possible quantum measurements at once, independent of
      which experiment is actually performed, as any such table of answers contradicts
      itself, and any theory claiming a definite underlying reality has to reckon with it.

      The reckoning is the same as with Bell, and it isn't evasion. The theorem's target
      is non-contextual assignment, meaning answers that don't depend on the measurement
      context, the actual physical arrangement doing the asking, so a theory whose
      outcomes depend on that context is outside the theorem's scope, at the declared cost
      of accepting the dependence.

      CSD accepts the dependence and then does something the usual discussion doesn't. It
      makes the context a formal object with its own data, so "the outcome depends on the
      context" is a definition you can compute with and not a slogan.
    in_csd: >
      In CSD a measurement context is a field of rates on the base of the arena, the space
      of quantum states, and it's the apparatus's own data. The outcome basins, the
      regions of the arena whose points lead to each outcome, are built from it, and
      distinct contexts genuinely induce distinct partitions of the arena, which is
      exactly the dependence Kochen-Specker demands of a surviving theory. The corpus
      proves the obstruction side too, in its own frame, as no global context-independent
      assignment is compatible with the exhibited contextual statistics, and the Mermin-
      Peres construction supplies the finite-dimensional contradiction.

      One clarification comes from the analysis of where contextual structure lives. For
      systems of dimension three and above, the base-only construction fails, and that
      base-only failure isn't a corollary of Kochen-Specker, as CSD's partitions are
      contextual, so the classical no-go theorems don't apply to them. It's a separate
      constraint, coming from covariance and positivity, argued on its own.
    mathematical: >
      The contextuality tier is the global-assignment obstruction in the C1 chain, the
      Mermin-Peres square's contextuality witness, and the context-indexed outcome map
      machinery with its definitional separation, with no Fine-theorem shortcut assumed.

      The N >= 3 fibre-placement analysis is explicitly distinguished from Gleason and
      Kochen-Specker in the source, and it's short of a no-go in its own right.
    term: Does the Kochen-Specker theorem rule out CSD?
    status: definition
    source: curated
    site_link:
