  - slug: wigner-rigidity
    reviewed: 2026-09-14
    image:
      file: img/wigner-rigidity.jpg
      alt: "Portrait photograph of Eugene Wigner"
      caption: "Eugene Wigner."
      credit: "Nobel foundation, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Wigner.jpg
      article: https://en.wikipedia.org/wiki/Eugene_Wigner
    hook: >
      Preserve the overlaps between quantum states and you have no freedom left, as the
      rearrangement must be a unitary or an anti-unitary transformation whether or not you
      intended it to be.
    layman: >
      Any two quantum states have an overlap, a number between zero and one that
      experiments can measure directly as the probability of finding one state when the
      other was prepared. An overlap of one means the two states are the same, and an
      overlap of zero means they can be told apart with certainty. Wigner rigidity is
      about what happens when you rearrange the space of states while keeping every
      overlap fixed.

      Imagine rearranging the entire space of states however you like, with no rules about
      smoothness, no rules about linearity, and no promise that the rearrangement can be
      undone, and one condition only, that every overlap stays the same. You might expect
      that to leave enormous freedom, and it leaves almost none.

      Wigner proved that the only rearrangements passing this test are the rigid motions
      physics already knew about, the unitary transformations, which are the quantum
      counterpart of rotations, and their mirror images, the anti-unitary transformations,
      which are the mathematics of time reversal. Nothing else exists. The structure of
      quantum state space is so tight that preserving one experimentally meaningful number
      forces everything.
    in_csd: >
      This is the strongest result in the corpus by logical type, rather than by
      difficulty. Almost everything else described as forced here rests on first assuming
      a symmetry group and then deriving consequences, while this theorem assumes only
      that overlaps are preserved and derives the group. That's a different and better
      kind of claim, and the corpus's own necessity audit singles it out as one of exactly
      two unconditional necessities in the whole development.

      What it buys is the licence to treat unitary evolution as compelled rather than
      chosen. A flow that preserves transition probabilities, which is to say the
      overlaps, has no option but to act unitarily at each moment, and that's half of the
      Schrodinger pillar, the part of the programme that derives the equation of motion.
      The other half, that a continuous unitary flow has a generator, is Stone's theorem,
      and together they make the dynamics an output rather than an input.

      It also anchors the record layer, the part of CSD that describes how measurement
      outcomes are recorded. There the preserved quantity is a statistic of records rather
      than an abstract overlap, and the same rigidity turns that operational requirement
      into the same group of transformations.
    mathematical: >
      Every transition-probability-preserving self-map of CP^(N-1) is induced by a unitary
      or by an antiunitary map, and there are no other hypotheses.

      What makes the formalisation honest is that linearity is an output of the
      construction and never an assumption, and bijectivity is likewise derived. The
      antiunitary branch is genuinely present rather than waved away, which matters
      because time reversal is antiunitary and a version of the theorem without that
      branch would exclude a real physical symmetry. Foundational-triple only.
    person: >
      Eugene Wigner (1902-1995) was born in Budapest and trained, of all things, as a
      chemical engineer at the Technische Hochschule in Berlin, a background he credited
      for his nose for problems that mattered. He worked at Gottingen and Berlin, left as
      the Nazis rose, and settled at Princeton in 1930 for the rest of his career, apart
      from the war years on the Manhattan Project at Chicago and Oak Ridge.

      The theorem appeared in his 1931 book on group theory and atomic spectra, with a
      proof so compressed that filling the gaps became a minor industry for decades, and
      genuinely complete proofs are surprisingly recent. The antiunitary branch, which
      looked like a technical annoyance, turned out to be the mathematics of time
      reversal, and Wigner himself supplied that application. He shared the 1963 Nobel
      Prize for his work on symmetry principles in physics.
    term: Wigner rigidity
    eponyms: [Wigner]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/LinearAlgebra/Projectivization/WignerRigidity.lean
      theorem: wigner_rigidity
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper C's reconstruction is what this rigidity result pins down
    related: [stone-theorem, bargmann, schrodinger-from-records, projective-sector, hilbert-space, wigner-function]

  - slug: stone-theorem
    reviewed: 2026-09-14
    hook: >
      Ask only that time evolution never jumps, and differentiability, a generator and the
      Hamiltonian all follow for free.
    layman: >
      A system evolving in time is described by a family of transformations, one for each
      duration, which compose the way durations add, so evolving for two seconds and then
      for three is the same as evolving for five. Physics wants to differentiate that
      family, to speak of the rate at which the state changes, and to call the quantity
      that generates the change the energy, or Hamiltonian. But differentiating
      presupposes smoothness, and nobody said the evolution had to be smooth. Assuming it
      feels harmless, and in fact it's most of the conclusion.

      Stone's theorem says you don't need to assume it. Require only that the evolution be
      continuous, meaning that states at nearby times are nearby and nothing jumps, and
      smoothness follows on its own. So does the generator, a single fixed quantity from
      which you can rebuild the whole family of transformations by compounding, much as a
      fixed interest rate generates the growth of a balance over any period. The analogy
      has one limit, as in quantum mechanics the generator turns the state rather than
      growing it, which is why total probability stays fixed.

      So the Hamiltonian isn't an ingredient added to quantum mechanics by hand. It's
      extracted from the bare requirement that time evolution doesn't teleport.
    in_csd: >
      The programme needs the generator to be earned and not posited. If you posit a
      Hamiltonian you've smuggled in the dynamics you claimed to derive, and the
      reconstruction would be decorative. This theorem is how the smuggling is avoided, as
      continuity alone gives the generator, and the Schrodinger equation, the equation of
      motion of quantum mechanics, is then a conclusion rather than a starting point.

      The full chain has two links. Wigner rigidity says a flow preserving transition
      probabilities must act by unitary transformations at each instant, and Stone's
      theorem says a continuous one-parameter family of unitary transformations is
      generated by a single fixed operator. Those are the corpus's two unconditional
      necessities, and the second pillar of the programme, the derivation of the dynamics,
      stands on exactly them.
    mathematical: >
      A strongly continuous one-parameter group of unitary matrices is t maps to exp(tA)
      for a skew-Hermitian A, and the hypothesis is continuity only. The C-one version
      proved first carried a differentiability assumption, so the strengthening that
      removes it is the part with content, since assuming differentiability is
      uncomfortably close to assuming the answer.

      One library note is worth knowing. Mathlib carries no Stone theorem at this pin, as
      the names beginning with Stone there are Stone-Weierstrass and Stone duality, so the
      finite-dimensional case is supplied here.
    person: >
      Marshall Stone (1903-1989) was born in New York, the son of a future Chief Justice
      of the United States, and took his doctorate at Harvard under George Birkhoff. The
      theorem on one-parameter unitary groups dates from 1932, the same era as his duality
      and approximation theorems.

      His second act was administrative and just as consequential. He moved to the
      University of Chicago in 1946 and rebuilt a fading department into arguably the
      world's best in about five years, hiring Weil, Chern, Zygmund and Mac Lane in a
      spree still called the Stone Age. He's one of the few first-rank mathematicians who
      was also a first-rank chairman.
    term: Stone's theorem
    eponyms: [Stone]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/Analysis/Matrix/StoneC1.lean
      theorem: Matrix.StoneC1.stone_continuous
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper C reconstructs the operational quantum mechanics this generator theorem supports
    related: [wigner-rigidity, schrodinger-equation, schrodinger-from-records, hermitian-operator, bargmann]

  - slug: bell-chsh
    reviewed: 2026-09-14
    image:
      file: img/bell-chsh.png
      alt: "John Stewart Bell standing in front of a blackboard"
      caption: "John Bell at CERN, with 2√2 on the blackboard behind him."
      credit: "CERN, CC BY 4.0, via Wikimedia Commons"
      licence: "CC BY 4.0"
      source: https://commons.wikimedia.org/wiki/File:John_bell_2_(cropped).png
      article: https://en.wikipedia.org/wiki/John_Stewart_Bell
    hook: >
      No pre-written answer sheet for all four measurement settings can match what a
      singlet pair of particles does, and the corpus proves this as a theorem about every
      possible answer sheet.
    layman: >
      Prepare two particles together in a particular joint state called a singlet,
      separate them, and measure each one with a choice of two settings. Common sense says
      every measurement you might make already has an answer waiting, fixed when the pair
      was created and merely revealed by the apparatus. Bell's insight was that this
      innocent-sounding assumption has teeth, as it forces a numerical limit on how
      strongly the results on the two sides can be correlated.

      Quantum mechanics predicts correlations above that limit, so common sense and
      quantum mechanics disagree about an experiment, and the experiment can be run. It
      has been run for five decades with every loophole closed in turn, and the
      correlations are there while the answer sheet isn't.

      What the corpus proves is the sharp version of this. Take one shared space of hidden
      states, the imagined complete description of the pair, and no assignment of answers
      to all four settings at once, however contrived, reproduces the singlet's
      statistics.
    in_csd: >
      CSD is contextual and non-local at the level of its substrate, by design. Contextual
      means what a measurement reveals can depend on which other measurements are made
      alongside it, and non-local means the hidden description of the pair doesn't split
      into a separate part for each particle. That commitment creates a debt, as the
      programme must show that its own model can't be secretly rewritten as the common-
      sense picture, or it would be claiming a virtue it hadn't earned. This theorem pays
      the debt.

      The result comes paired. The corpus also exhibits an explicit contextual model that
      does reproduce the singlet's correlations, so the claim is two-sided, with the
      impossibility on one hand and the thing that evades it on the other, and the
      obstruction and the existence are cited together as one unit.

      There's a lesson in how the theorem came to be stated. For a long time the formal
      model gave each measurement setting its own separate space of hidden states, so the
      Bell question couldn't even be asked, as there was nothing against which to compare
      a single global assignment of answers. A distinction in the bookkeeping stood where
      a theorem should have been. Rebuilding the model on one shared space made the
      question expressible, and the answer turned out to be the theorem above.
    mathematical: >
      Over a single shared measurable state space, no jointly defined assignment of
      outcomes to the four CHSH settings reproduces the singlet correlations. Companion
      results rule out a different class rather than restating this one, as no setting-
      local (product) pair of response functions reproduces the singlet at every setting
      pair over any shared probability space. Neither result subsumes the other, and the
      corpus says so. The GHZ analogue for three parties is proved separately.

      The shared-space form is the load-bearing one, since it's the shape the
      contextuality claim actually posits. The corpus pairs the obstruction with an
      explicit contextual model reproducing the same correlations, so the negative and
      positive halves are proved together rather than the no-go standing alone.
    person: >
      John Stewart Bell (1928-1990) was born in Belfast to a working-class family and left
      school at sixteen. He got into physics by working as a laboratory technician at
      Queen's University, where the staff noticed him and pushed him into a degree. He
      took his doctorate at Birmingham and spent his career at CERN designing
      accelerators, and he insisted foundations was a hobby for sabbaticals.

      It was some hobby. He wrote the 1964 paper while visiting Stanford, and it appeared
      in Physics 1, a journal so obscure that it paid authors instead of charging them and
      which died after a few issues. The paper showed that the hidden-variables question,
      which physicists had filed under philosophy for thirty years, was experimentally
      decidable, and Clauser, Horne, Shimony and Holt made it testable in 1969.

      Bell died of a stroke in 1990, the year he was nominated for the Nobel Prize, and
      the 2022 prize went to the experimenters who confirmed him.
    term: Bell and CHSH
    eponyms: [Bell]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: no_compatible_global_chsh_assignment_realises_singlet
    papers:
      - doi: 10.5281/zenodo.20354293
        note: LF3, the machine-verified singlet kernel and empirical chain
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-claims
