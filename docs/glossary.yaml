  - slug: typicality
    reviewed: 2026-08-25
    hook: >
      Probability without randomness: the world is deterministic, you do not know which
      state you have, and the odds are the sizes of the possibilities.
    layman: >
      If the universe is deterministic, probabilities cannot come from genuine chance,
      because there is none. Yet quantum experiments deliver rock-solid statistics. Where
      do the numbers come from?

      From counting. Fix everything your preparation procedure controls, and a vast set of
      microstates, of complete underlying states, remains compatible with it; you do not
      know which one you got. Ask what fraction of that set leads to each outcome, and
      those fractions are the probabilities. Nothing is random. You are ignorant, and the
      ignorance is quantified by the sizes of sets. This is exactly how Boltzmann explained
      why gases settle into equilibrium, imported into quantum foundations.

      The classic objection is as old as the move. Fractions depend on how you measure the
      sets, and a measure is simply a rule that assigns a size to each set of microstates.
      Choose the measure to taste and the argument justifies anything. Any typicality
      account lives or dies by its answer to that objection.
    in_csd: >
      Typicality is the engine of the whole programme, and both of its classic failure
      modes are addressed by theorems rather than by assurances.

      The measure objection first. CSD's measure is forced by symmetry, uniquely, with a
      proof: among all measures that are invariant, meaning unchanged by the symmetries of
      the state space, there is only one, so there was no other option to have chosen.
      That is the direct answer to the circularity charge associated with Valentini, that
      a typicality argument simply picks the measure that yields the result it wants, and
      it is the single most load-bearing fact in the corpus.

      The route matters too. Frequencies come from the law of large numbers over repeated
      preparations, the theorem that the averages of many independent trials settle to the
      underlying fractions. They do not come from ergodicity, the idea that a single
      trajectory wandering through the space for long enough visits every part of it in
      proportion to its size, nor from a single trajectory exploring the space in any other
      way. The corpus records the single-flow route as a proved dead end: one projective
      flow demonstrably cannot pin down the measure. That negative result is kept visible
      so that nobody wanders back down the road.
    mathematical: >
      For independent trials, observed relative frequencies converge almost surely to
      volume fractions; combined with Born-weight-equals-volume-ratio, this yields Born
      frequencies at general dimension.

      Two notes on scope. The independence hypothesis is pairwise, weaker than the usual
      statement. And the corpus flags an open debt: a deterministic substrate owes an
      account of why repeated preparations are independent at all, and a substrate with
      memory would show departures from i.i.d. shot noise. That is one of the few places
      CSD could differ observably from quantum mechanics, at laboratory energies.
    term: Typicality
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF1/GeneralFrequency.lean
      theorem: freq_tendsto_of_iid
    external:
      - text: "Goldstein, typicality in statistical mechanics and quantum theory"
        url: https://arxiv.org/abs/1110.1349
    related: [typicality-volume, born-weight, canonical-typicality, where-do-probabilities-come-from, fubini-study-measure]

  - slug: psi-epistemic
    reviewed: 2026-08-25
    hook: >
      The quantum state is what you know, not what exists. The hard part was always saying
      what it is knowledge of, and CSD's whole architecture is an answer to that.
    layman: >
      Two readings of the quantum state have fought for a century. On the realist reading
      the state is a physical thing, so its jump on measurement is a physical process that
      needs an explanation the theory does not give. On the epistemic reading the state is
      a description of what someone knows, so the jump is just an update: learn something,
      revise. It is no more mysterious than a poker player recalculating after seeing a
      card.

      The epistemic reading dissolves the measurement problem, which is its great charm.
      Its great embarrassment is the follow-up question: knowledge of what? If there is
      nothing underneath, the reading says the theory is about nothing in particular. And a
      family of more recent theorems makes naive versions of the underneath very hard to
      hold. The PBR theorem, the most famous of them, shows that if separately prepared
      systems have independent underlying states, then two different quantum states can
      never be descriptions of the same underlying state.

      So the position is attractive, constrained, and incomplete without a floor.
    in_csd: >
      CSD is psi-epistemic with a floor. The state is knowledge of which region of the
      constraint surface the microstate occupies. There is a fact underneath, one point
      following one trajectory, and the state summarises what a preparation pins down
      about it.

      Everything in the programme sorts into two levels, and keeping them apart is the
      discipline the whole account depends on. The epistemic level holds the space of
      quantum states, the outcome regions and the probabilities. The ontic level holds the
      substrate and the measure that weights it. The corpus's fibre analysis sharpens the
      split. It treats the space of quantum states as a lossy projection of the substrate,
      with many microstates mapping to each state, and it places the record-forming content
      in the fibre above a state, the set of microstates that project to it, rather than
      on the space of states itself. That placement is a judgement against a tight
      constraint chain, not a proved dichotomy: whether the content could stay on the base
      in three or more dimensions is open in both directions.

      Three claims need to be kept apart, because the corpus once ran them together. The
      first is CSD epistemicity: the quantum state does not completely specify the
      microstate, because the projection is many-to-one. That is this entry's subject. The
      second is the technical Harrigan-Spekkens classification, which calls a model
      psi-ontic when distinct quantum states never share an underlying microstate and
      psi-epistemic when they can. On the canonical exact sharp interface, where a
      preparation is an exact pure state, CSD is psi-ontic, because distinct exact pure
      states have mutually singular ontic measures: the space can be split into two parts
      with each state's measure living entirely on its own part. The third is
      finite-resolution overlap: preparations that fix a region of positive volume, rather
      than an exact state, and whose regions overlap have conditional laws that provably
      cannot be separated onto disjoint supports.

      The third claim is the theorem this entry is anchored to. It does not establish the
      second in the epistemic direction, because region preparations are a different
      preparation class from exact pure states, and describing the overlap theorem as
      technical psi-epistemicity of exact states was an error that has since been
      corrected. The first and third claims hold; on the second, the exact interface is
      psi-ontic.
    mathematical: >
      The overlap statement is proved as conditional_not_mutuallySingular: overlapping
      preparation regions give conditional laws that are not mutually singular. The proof
      is a density argument rather than a shared-support one, because two measures can both
      charge a common set and still be mutually singular, so overlap alone would not settle
      it. The concrete witness kahler_preparations_overlap instantiates it on open
      neighbourhoods of any two rays of the working arena.

      The complementary facts are proved too: conditioning on an exact pure state is an
      unreachable idealisation (single fibres are Liouville-null); what a physical
      preparation projects to is a density against the Fubini-Study measure, not a point;
      and distinct exact pure states have mutually singular ontic measures
      (RecordLayer.sharp_preparations_mutuallySingular), which is the psi-ontic verdict on
      the exact sharp interface under the Harrigan-Spekkens classification. An earlier
      version of this entry described the overlap theorem as technical psi-epistemicity of
      exact states; that error was corrected on 2026-08-25.

      Which literature constraints bite, PBR and its relatives, still depends delicately on
      what the state is taken to be knowledge of, and on independence assumptions. The full
      mapping of that boundary is not formalised; treat it as live terrain.
    term: Psi-epistemic
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/SigmaLayer/IsolationPreparation.lean
      theorem: conditional_not_mutuallySingular
    related: [ontic-vs-epistemic, epistemic-measure, does-csd-conflict-with-pbr, is-the-wavefunction-real, hidden-variables]
    external:
      - text: "Epistemic views of the quantum state"
        url: https://en.wikipedia.org/wiki/Epistemic_view_of_quantum_states

  - slug: determinism
    hook: >
      The substrate has no dice. The spread in the data is variation in what your
      preparation could not pin down.
    layman: >
      Prepare two systems as identically as any procedure allows, measure them identically,
      and quantum mechanics happily reports different outcomes, offering no reason why this
      one rather than that. Either the world contains genuine chance, or the preparations
      were not actually identical.

      Determinism takes the second answer. The two systems agreed on everything the
      procedure fixed and differed in what it could not fix. The observed spread is that
      hidden variation showing through, and probability is bookkeeping for ignorance. This
      is the same move classical statistical mechanics has always made about gases: the
      temperature and pressure of a gas fix its state only coarsely, the exact positions
      and speeds of its molecules vary from one sample to the next, and the statistics come
      from that variation.

      Whether the answer is still available after the no-go theorems is not a matter of
      taste. It survives, at a stated price. The theory must be contextual, meaning that
      the outcome of a measurement can depend on which other measurements are made
      alongside it, and non-local, meaning that what happens here can depend on a choice
      made far away. The entries on contextuality and hidden variables carry the receipts.
    in_csd: >
      The substrate's motion is deterministic and volume-preserving, carrying every region
      of the underlying state space to a region of the same size, and chance appears
      nowhere in the dynamics. Probability enters exactly once, as ignorance of the
      microstate within the region a preparation fixes, and the forced measure, the one
      rule for sizing regions that the symmetries of the state space allow, turns that
      ignorance into unique numbers.

      The debt is recorded rather than buried, and it is the interesting part. The
      frequency argument assumes independent trials. A deterministic substrate with memory
      would violate that assumption, and the violation would show up as deviations from
      ordinary shot noise, the statistical scatter expected in counts of independent
      events, in high-statistics data. This is one of the very few places CSD could differ
      measurably from quantum mechanics, and testing it needs no Planck-scale machine, just
      patience and statistics.
    mathematical: >
      Positional. The formal content is the measure-preserving flow and the volume-ratio
      weights; determinism is the reading of that structure.

      The nearest formal object is the preservation field itself, carried as an ontic
      postulate and listed as such in the axiom ledger: assumed for physical
      admissibility, not derived.
    term: Determinism
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: causal determinism"
        url: https://plato.stanford.edu/entries/determinism-causal/
    related: [single-trajectory, where-do-probabilities-come-from, is-csd-superdeterministic, typicality, constraint-surface]

  - slug: kochen-specker
    hook: >
      There is a finite list of directions in space that admits no consistent yes-or-no
      labelling. Contextuality follows by pure counting, with no experiment, no statistics
      and no separated particles.
    layman: >
      Bell's argument needs two separated particles and statistics gathered over many runs,
      so a determined sceptic could hope that the trouble was really about distance, or
      about probability. Is there a conflict that needs neither?

      Kochen and Specker built one. For a quantum system with three or more distinguishable
      outcomes, there is a finite set of measurement directions that cannot be consistently
      labelled with answers at all. Each direction is a yes-or-no question, and the labels
      must respect the relations that the corresponding quantities themselves satisfy: for
      instance, among any complete set of mutually perpendicular directions, exactly one
      must be labelled yes. No labelling of the whole set obeys the rule. Their original
      construction used 117 directions; the modern record is 18, and you can check it with
      a pencil.

      There is no experiment, no ensemble of runs, and no separation in space. There is
      just a finite combinatorial fact: the answer sheet does not exist, even for one
      particle, even in principle.
    in_csd: >
      CSD is contextual, so this theorem is a constraint it satisfies by construction, with
      no accommodation needed. What the corpus is genuinely careful about is a tempting
      misattribution nearby.

      The programme's fibre analysis found that in three or more dimensions the natural
      constructions confined to the base, the space of quantum states onto which the
      substrate projects, stop working. That is why it places contextual content in the
      fibre above the base, the set of substrate points lying over a given state. The
      placement is a judgement against a constraint chain, and the base-only question
      remains open in both directions. It would be natural, and wrong, to cite
      Kochen-Specker for that placement. The theorem constrains non-contextual value
      assignments, and CSD never makes one, so the theorem simply does not engage. The
      fibre argument comes instead from covariance, the requirement that the construction
      respect the symmetries of the state space, together with non-negativity, the
      requirement that a density never go below zero. That is a different argument with a
      different shape, and a constraint chain rather than a no-go. The corpus flags the
      distinction precisely because borrowing this theorem's authority would be such an
      easy overclaim.
    mathematical: >
      In dimension three and above, no non-contextual assignment of definite values to all
      observables respects the functional relations among commuting sets. Witnessed by
      explicit finite vector sets: 117 originally, 18 in the smallest known.

      Dimension two escapes, the same exception that afflicts the original Gleason theorem,
      and one more instance of the qubit being a misleading guide to the general case.
    person: >
      Simon Kochen, a native of Belgium, has spent his career at Princeton, mostly in model
      theory and number theory; he later proved the free will theorem with John Conway.
      Ernst Specker (1920-2011) was Swiss and spent his whole career at the ETH Zurich,
      working in logic and combinatorics.

      The publication story is unmatched. Specker published the core idea in 1960 in a
      theology journal, Dialectica, framing it through a scholastic debate about whether
      God could know the answers to unasked questions. The joint theorem followed in 1967
      in the Journal of Mathematics and Mechanics. From medieval counterfactuals to a
      pillar of quantum foundations, by way of the strangest venue in the subject's
      bibliography.
    term: Kochen-Specker theorem
    status: standard-mathematics
    source: curated
    external:
      - text: "Stanford Encyclopedia: the Kochen-Specker theorem"
        url: https://plato.stanford.edu/entries/kochen-specker/
    related: [contextuality, does-kochen-specker-rule-out-csd, hidden-variables, bell-chsh, measurement-context]

  - slug: copenhagen
    hook: >
      Copenhagen is the oldest position on quantum measurement and the one that declines
      the question: measurement is where the theory stops, not something it explains.
    layman: >
      Quantum mechanics needs a boundary between the quantum system and the classical
      apparatus that reads it. Where is the boundary, and what happens at it? The
      Copenhagen interpretation answers by refusing the question.

      The traditional teaching account, associated with Bohr, treats the apparatus as
      classical by fiat and treats the state's jump on measurement as a primitive fact.
      More radically, Bohr held that the whole experimental arrangement determines what
      can meaningfully be said. Asking what the electron was doing between measurements is
      not left unanswered; it is rejected as meaningless.

      As a strategy this is not foolish. It delivered a century of flawless physics, and
      its refusal to over-describe has aged better than several of its rivals'
      enthusiasms. But it is a decision not to explain, and everyone who wants an
      explanation eventually leaves it.
    in_csd: >
      The disagreement is narrower than the usual caricature. CSD agrees with Copenhagen
      that the state is not a physical object, and agrees that the boundary between
      classical and quantum is where the real content lives. The parting of ways comes one
      step further on: CSD declines to leave the boundary unanalysed.

      Here measurement is an ordinary physical interaction on the substrate that produces a
      record, and the two rules Copenhagen keeps apart, smooth evolution and abrupt update,
      are one process seen at two levels of description. The contrast is interpretive, not
      empirical. No experiment distinguishes the two positions, and none is proposed. This
      entry states a position; there is no theorem behind it, and the absence of a formal
      reference is deliberate.
    mathematical: >
      No formal content, and the absence is the information. The corpus contains nothing
      bearing directly on this position.

      That is itself telling: the disagreement is about whether the measurement boundary
      requires analysis, and no theorem settles a question of that kind.
    term: Copenhagen interpretation
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: the Copenhagen interpretation"
        url: https://plato.stanford.edu/entries/qm-copenhagen/
    related: [many-worlds, bohmian-mechanics, qbism, measurement-problem, collapse]

  - slug: many-worlds
    hook: >
      Many-Worlds keeps the smooth quantum evolution and gives up the single outcome. CSD
      makes the opposite choice, one trajectory and one world, as a settled commitment.
    layman: >
      Quantum mechanics describes a system by a state that changes smoothly and predictably
      in time. The same rules allow a state to be a superposition: a combination of several
      possibilities held at once, such as a particle that is partly here and partly there.
      Yet a measurement only ever shows one result. The textbook handles this by adding a
      second rule, collapse, under which the state jumps to a single possibility at the
      moment of measurement. Many-Worlds asks what follows if you refuse to add that rule.

      Everett's answer was to take the smooth evolution as the whole story. After a
      measurement the apparatus and the observer are then themselves in superposition, with
      one component, called a branch, for each outcome. Everett's move was to say that
      nothing is wrong with this. Every outcome happens, each in its own branch. The
      branches decohere, meaning that their interaction with the surroundings stops them
      from ever influencing one another again, so each branch contains an observer certain
      that their result was the only one. Nothing is added to the formalism, no collapse and
      no hidden variables, and that austerity is the position's appeal.

      The cost surfaces at probability. If everything happens, what can it mean that one
      outcome was more probable than another? Counting branches gives the wrong answer: a
      measurement with a seventy percent outcome and a thirty percent outcome produces two
      branches, not seven and three. The decision-theoretic repairs, which argue that a
      rational agent should bet as though the branch weights were probabilities, are
      ingenious and contested. That is the famous open wound of the interpretation.
    in_csd: >
      CSD is single-trajectory, and this is a settled commitment recorded in the programme's
      non-goals rather than an open question to be revisited. There is one microstate, one
      complete state of the world, one history and one outcome. The outcomes that did not
      occur are regions of the space of descriptions that the trajectory did not enter;
      nowhere is there a branch in which they happened.

      The contrast over probability is the instructive one. Everett's weight problem, the
      question of why observed frequencies match the branch amplitudes, the numbers the
      formalism attaches to each branch, does not arise here in that form, because there is
      always a definite state and probability expresses ignorance about it. The question
      becomes which measure weights the regions, where a measure is a rule that assigns a
      size to each set of states. That question has a proved answer: the unique measure left
      unchanged by the symmetry of the state space. Where the Everettian literature argues
      decision theory, this programme points at a uniqueness theorem. This is a positional
      entry; no theorem asserts it.
    mathematical: >
      No formal content: the corpus contains no theorem about the rival itself.

      The formal contrast: outcome weights in CSD are volume ratios on one constraint
      surface, so the measure problem is that of identifying a measure on a single space,
      discharged by uniqueness under symmetry, rather than that of justifying a weighting
      across many worlds, which is where Everettian effort concentrates.
    term: Many-Worlds interpretation
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: Everett's relative-state formulation"
        url: https://plato.stanford.edu/entries/qm-everett/
    related: [copenhagen, bohmian-mechanics, spontaneous-collapse, single-trajectory, measurement-problem]

  - slug: bohmian-mechanics
    hook: >
      Bohmian mechanics is CSD's nearest neighbour: deterministic, with definite states, and
      openly non-local. The dispute between them is over where the probabilities come from.
    layman: >
      The question Bohm settled in 1952 was whether a deterministic account of quantum
      mechanics is possible at all, one in which the present state of the world fixes the
      future by law, with no randomness. The folklore of the time, leaning on von Neumann's
      flawed impossibility proof, said it could not be done. Bohm answered by construction:
      he wrote one down.

      In his theory particles have definite positions at all times, and a wave, evolving by
      the ordinary Schrodinger equation, guides them. Every quantum prediction comes out
      exactly. The price is explicit non-locality: each particle's guidance depends
      instantaneously on where all the others are, across any distance. Bell, who admired
      the theory, showed that this price is not Bohm's clumsiness but everyone's obligation,
      since any account that reproduces the quantum predictions must pay it in some form.

      Bohmian mechanics remains the standing counterexample to every claim that quantum
      mechanics rules out determinism. Whatever else is true, that claim is dead.
    in_csd: >
      This is CSD's closest relative, and the family resemblance is real: determinism, a
      definite underlying state, non-locality accepted with open eyes, and probabilities
      that express ignorance of the exact state rather than randomness in the world. A
      reader placing CSD on the map of interpretations should put it nearest here.

      The differences concern what exists, and on one point they are sharp. Bohm has a dual
      ontology, a physical guiding wave together with particle positions. CSD has one
      object, the constraint surface, and demotes the quantum state to epistemic
      bookkeeping, a summary of what is known rather than a thing in the world; nothing
      guides anything. The probability postulates also differ in kind. Bohmian statistics
      require the quantum equilibrium hypothesis, an assumed initial distribution of
      particle positions, possibly one that the dynamics relaxes into, whereas CSD's measure
      is forced by a symmetry theorem. Where Bohmians must defend an initial condition, CSD
      points at uniqueness. That is the standing objection to Bohm that this programme
      claims to escape.
    mathematical: >
      No formal content in the corpus about the rival itself.

      The shared formal shape: both derive probabilities from a measure on an underlying
      state space rather than postulating the Born rule, so both owe an account of the
      measure, and the accounts differ (assumed equilibrium there, forced uniqueness here).
    term: Bohmian mechanics
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: Bohmian mechanics"
        url: https://plato.stanford.edu/entries/qm-bohm/
    related: [csd-vs-bohmian-mechanics, hidden-variables, many-worlds, single-trajectory, determinism]

  - slug: spontaneous-collapse
    hook: >
      Spontaneous collapse theories change the equations of quantum mechanics and can be
      killed by experiment. CSD, so far, cannot be, and its own documentation says so.
    layman: >
      Quantum mechanics lets a system be in a superposition, a combination of several
      possibilities at once, and yet a measurement always shows one result. The textbook
      handles the transition with an abrupt jump, collapse, that is not part of the smooth
      equations. Ghirardi, Rimini and Weber took a direct line: if collapse is real, put it
      in the equations. Their theory, GRW, modifies quantum mechanics so that each
      particle's state spontaneously localises at random, snapping to a definite small
      region, extraordinarily rarely, about once per hundred million years per particle.

      The trick is amplification. A cat contains a trillion trillion particles, and in a
      superposition their states are correlated, so one localisation anywhere drags the
      whole superposition down with it. Microscopic physics is untouched, macroscopic
      superpositions die in microseconds, and no observer is ever mentioned.

      Because the modification has parameters, a rate and a length, it makes predictions
      that differ from standard quantum mechanics. Interferometry with large molecules,
      which tests how big an object can be while still showing wave behaviour, and
      ultra-quiet mechanical sensors have been squeezing the allowed range of those
      parameters for decades. GRW might be refuted next year. That is a compliment: it is a
      theory, not an interpretation.
    in_csd: >
      The comparison is uncomfortable in a direction the corpus states plainly: GRW is
      falsifiable today and CSD is not. CSD reproduces standard quantum mechanics exactly at
      leading order. Its candidate departures, finite-sample statistics and corrections that
      the papers have not yet pinned down, are recorded as owed rather than claimed. One
      theory risks its neck; the other, so far, matches the textbook everywhere.

      Structurally the two could hardly differ more. GRW adds random jumps to the dynamics.
      CSD's substrate is deterministic and volume-preserving, meaning that its evolution
      never compresses or expands the size of any set of states, and the corpus proves that
      no volume-preserving process can implement collapse. The very mechanism GRW adds is
      therefore one that CSD is formally barred from borrowing. Definite outcomes here come
      from records instead.
    mathematical: >
      No formal content about the rival.

      The formal boundary on CSD's side: no measure-preserving map implements exact
      collapse, so a GRW-style mechanism is unavailable to this substrate as a matter of
      theorem, not taste.
    term: Spontaneous collapse (GRW)
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: collapse theories"
        url: https://plato.stanford.edu/entries/qm-collapse/
    related: [collapse, copenhagen, many-worlds, qbism, does-csd-make-new-predictions]

  - slug: qbism
    hook: >
      QBism is epistemic all the way down: the quantum state is one agent's betting book,
      and there is nothing underneath. CSD agrees about the state and insists on the
      underneath.
    layman: >
      Many physicists hold that the quantum state is not a physical thing but a summary of
      somebody's information. Say that, and you owe an answer to an obvious question:
      information about what? QBism pushes the idea to its logical end and gives a
      bracing answer: about nothing beyond the agent's own future experiences. Quantum
      states are personal degrees of belief, probabilities are subjective bets, and a
      measurement outcome is an experience of the agent who makes the measurement.

      The measurement problem, the puzzle of how a smoothly evolving state can jump to one
      result, evaporates, because there was never a physical state out there to collapse.
      Wigner's friend, the puzzle of one observer describing another observer's
      measurement, the non-locality puzzles, most of the paradox literature: all dissolved,
      because nothing observer-independent was ever claimed.

      The cost is the point of contention. Physics stops describing a world and starts
      describing each agent's gambling position. Proponents call that honesty. Critics call
      it surrender.
    in_csd: >
      The agreement runs deep and the split is clean, which makes this the most clarifying
      comparison on the list. Both positions hold that the quantum state is epistemic, a
      matter of knowledge rather than a thing in the world. Both therefore treat its update
      after a measurement as learning, not physics. Both walk away from the measurement
      problem in its standard form.

      Then comes the floor. CSD's constraint surface exists whether or not anyone is
      looking. Probabilities are ratios of volumes on it, not credences, which are degrees
      of belief, and the measure that defines those volumes is fixed by a uniqueness
      theorem, so two rational agents cannot disagree about it. In QBism they legitimately
      can, because probability is personal. The slogan version, fair to both sides, is
      epistemic states over an ontic substrate versus epistemic states over nothing. This
      is a positional entry; no theorem states it.
    mathematical: >
      No formal content about the rival.

      The formal contrast: CSD's outcome weights are ratios of an invariant measure,
      agent-independent and uniqueness-backed, where QBist probabilities are Bayesian
      credences constrained by coherence but owned by an agent.
    term: QBism
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: QBism and quantum Bayesianism"
        url: https://plato.stanford.edu/entries/quantum-bayesian/
    related: [copenhagen, psi-epistemic, ontic-vs-epistemic, is-the-wavefunction-real, spontaneous-collapse]

  - slug: constraint-surface
    reviewed: 2026-08-25
    hook: >
      There is one arena, it is deterministic, and it does not grow. Everything else in the
      programme is bookkeeping about how much of it a measurement context lets you see.
    layman: >
      Quantum mechanics is spectacularly good at predicting what detectors do and
      spectacularly silent about what the world is. The textbook hands you a recipe for
      outcomes and no picture of what exists between them.

      CSD starts by paying the cost that most approaches defer: it posits the world. There
      is one total space of everything that exists, called the constraint surface (the
      programme names it Sigma), and a single deterministic trajectory runs on it, a path in
      which each state fixes the next by law. No branching, no dice, no observer in the
      basement. What you cannot do is ask what the surface is made of. It is the floor.
      Every theory has a floor; this programme says out loud where its floor is.

      The surprise is how little freedom the floor turns out to have. Ask what the surface
      must look like for quantum statistics to come out, and symmetry pins down its measure
      uniquely, where the measure is the rule that assigns a size to each region of the
      surface and so, eventually, a probability to each outcome. Symmetry also constrains
      its geometry tightly. The surface is posited, then constrained until almost nothing
      about it is a choice.
    in_csd: >
      The constraint surface is the floor and it is everything: the total, fixed, local
      ontic space, where ontic means existing independently of anyone's knowledge. Deriving
      it is a non-question, since there is nothing beneath a floor to derive it from. What
      is legitimate, and actively pursued, is constraining it from above. The measure on the
      projected state space, the space of quantum states seen as a shadow of the surface, is
      forced by unitary symmetry, the group of transformations that preserve every quantum
      probability. The concrete working arena is a compact Kahler space: a space of finite
      extent whose curved geometry is of the kind that complex projective space carries.

      Everything quantum then happens at two levels. A measurement context, the choice of
      what to measure, partitions the projected view of the surface into outcome regions,
      and that partition is epistemic, a matter of description. The weight of each region
      is an honest volume on the surface, and that measure is ontic. The Born rule, the
      quantum rule for assigning probabilities to outcomes, is the meeting point of the two.
    mathematical: >
      The corpus carries Sigma as the OnticSetup structure: a measurable space with a finite
      measure (the Liouville measure, finite but not normalised; weights are ratios, and the
      preparation region is required to have nonzero measure so that the normalisation is
      well-defined), a deterministic flow with a measure-preservation field, and a
      preparation region. Outcome frequencies converge almost surely to volume ratios by the
      strong law, which is the LF1 main theorem, with no probabilistic input beyond
      repeated-preparation sampling.

      One disclosure the module makes and this page repeats: through LF1 to LF3 only
      measurability of the flow is consumed. The measure-preservation content is carried as
      structural payload for physical admissibility and becomes load-bearing only when LF4
      derives the measure from a concrete volume form.

      The concrete instance is Sigma = CP^(N-1) x T^2 with the Fubini-Study measure on the
      base times normalised Haar on the torus fibre. Compactness does real work: it is what
      forces the invariant measure to be unique.
    term: Constraint surface
    status: physical-postulate
    source: curated
    lean:
      module: CsdLean4/LF1/Setup.lean
    related: [projective-sector, liouville-measure, projectability, fibre, single-trajectory]
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper A builds outcome frequencies on exactly this arena

  - slug: ontic-vs-epistemic
    hook: >
      What exists is one question; what a measurement context lets you say is another. Most
      quantum paradoxes are category errors between the two.
    layman: >
      Quantum mechanics keeps two kinds of statement in one notation. The sentence "the atom
      is here" sounds like a fact about the world. The sentence "the atom has a thirty
      percent chance of being here" sounds like a fact about what you know. The
      wavefunction, the mathematical object that encodes everything quantum mechanics says
      about a system, carries both voices at once, and a century of argument has been about
      which voice is fundamental.

      The distinction between map and territory is old, and it only starts to bite when you
      enforce it. A fact is ontic when it belongs to the territory: true whether or not
      anyone looks. A fact is epistemic when it belongs to the map that some agent or
      apparatus draws. The trouble starts when a map-fact is mistaken for a territory-fact,
      that is, when a change in the description is read as a change in the world.

      Collapse, the abrupt jump of the quantum state at measurement, is the canonical
      casualty. If the state is a map, its sudden update on measurement is no stranger than
      a weather forecast changing when you open the curtains.
    in_csd: >
      CSD makes the split load-bearing and never lets it blur. The outcome regions that a
      measurement context defines live on the projected state space, the space of quantum
      states, and they are epistemic: the apparatus fixes the partition, and the partition
      is a description. The measure that weights those regions is ontic: an invariant
      volume on the constraint surface itself, one that the symmetry leaves unchanged,
      fixed by that symmetry and indifferent to anyone's knowledge.

      The Born rule, the quantum rule for outcome probabilities, is precisely the handshake:
      an epistemic region, weighed by an ontic volume. Measurement is the ontic selection,
      the record written on the surface, of which epistemic region the one real trajectory
      realises. Keeping the two levels distinct is not philosophical hygiene; it is the
      structure of the reconstruction.
    mathematical: >
      The two-strata reading is written into the axiom ledger. The operational stratum
      speaks the effect-and-density language and carries the Gleason-type representation;
      the ontic stratum computes weights as ratios of the Liouville measure over the
      preparation region.

      The corpus proves that the two strata meet: the same Born vector is reached by the
      operational route and by the volume route, through structurally distinct machinery.
    term: Ontic vs epistemic
    status: definition
    source: curated
    related: [psi-epistemic, epistemic-measure, is-the-wavefunction-real, constraint-surface, many-to-one-projection]

  - slug: projectability
    reviewed: 2026-08-25
    hook: >
      Projectability is the one genuine postulate at the interface: the ontic arena projects
      onto the space quantum mechanics is written on. Downstream of that, symmetry does the
      choosing.
    layman: >
      If the world is a large deterministic space and quantum mechanics is written on a much
      smaller curved one, something must connect them. You cannot get the small picture out
      of the big one for free. The connection is structure, and structure has to be paid
      for.

      Projectability is the payment, made openly. It says that the arena admits a
      many-to-one projection onto the quantum state space: a map that sends every point of
      the large space to a point of the small one, with many points sharing each target,
      much as a solid object casts a flat shadow. The projection must be compatible with
      the dynamics, so that motion on the arena maps to the expected motion of quantum
      states, and with the symmetry. It is one postulate, stated once, and carried as an
      explicit hypothesis everywhere it is used.

      The discipline lies in what is not postulated. Not the measure, which is forced by
      symmetry. Not the Born rule, the quantum rule for outcome probabilities, which is
      computed as a volume. Not the dynamics on the projected space, which are derived from
      record statistics. The programme keeps its postulate count where you can audit it.
    in_csd: >
      This is Paper C's sector postulate: the assumption that the constraint surface
      projects onto a projective sector, the curved space of quantum states regarded as a
      view of the arena, on which the reconstruction runs. It is projectability, and never
      "the origin of the constraint surface". The projection points the wrong way for
      that reading: the surface is the floor, and the sector is a view of it, not its
      source.

      In the formal corpus the postulate is never assumed globally. Every theorem that needs
      it takes it as an explicit hypothesis, so the corpus's record of assumptions stays
      clean and the cost is visible at every point of use.
    mathematical: >
      In Lean the postulate is a structure field, not an axiom, so the kernel's axiom report
      is unaffected by it. SectorData packages the postulate: a measurable projection from
      the ontic space to an abstract projective target, a group acting on both sides,
      invariance of the Liouville measure, and equivariance of the projection.

      A guard script enforces that the descent equation is genuinely consumed downstream;
      the corpus was once burned by a substrate that was carried but unused, and the
      linkage is checked mechanically.
    term: Projectability
    status: physical-postulate
    source: curated
    lean:
      module: CsdLean4/LF2/Setup.lean
    related: [constraint-surface, projective-sector, many-to-one-projection, wigner-rigidity, schrodinger-from-records]

  - slug: projective-sector
    reviewed: 2026-08-25
    hook: >
      Quantum mechanics is written on a curved projective space. In CSD that space is
      not fundamental: it is the sector the arena projects onto, with its geometry forced
      by symmetry.
    layman: >
      The space of quantum states is not a vector space, whatever the opening chapters of
      the textbooks suggest. A quantum state is written as a vector, but two vectors that
      differ only by an overall phase, a rotation of the vector's mathematical description
      that changes no prediction at all, are the same physical state. Once you treat all
      such vectors as a single point, quotienting the redundancy away, you are standing on
      complex projective space: a compact arena, meaning one of finite extent, that is
      curved and highly symmetric.

      Most formulations treat that space as the fundamental stage. CSD demotes it. The
      projective space is a sector, the image of the real arena under a many-to-one
      projection, a map under which many points of the arena share one quantum state.
      States are shadows, and the surface casting them is bigger.

      The demotion has a payoff. Questions that are awkward even to pose on the state
      space, such as which outcome actually happened and what carries the record of it,
      have room to be answered one level down.
    in_csd: >
      The sector is where the epistemic half of the reconstruction lives, the half that
      concerns descriptions rather than what exists. Measurement contexts partition the
      sector into outcome regions, and the Fubini-Study measure prices them; this is the
      natural volume on complex projective space, and it is the unique one left unchanged
      by unitary symmetry, the transformations that preserve every quantum probability. The
      ontic half stays below: the weight of a sector region is the Liouville volume, the
      arena's own volume, of its preimage, the set of arena points that project into it.

      The sector is posited, through projectability, and then heavily constrained: it is
      compact, it is Kahler, carrying the curved geometry that complex projective space is
      known for, and it has a unique invariant measure. The corpus's working instance takes
      the sector to be complex projective space exactly, with the projection's fibre, the
      set of arena points lying above a single state, carrying what the sector cannot.
    mathematical: >
      ProjectiveSector bundles the measurable projection to CP^(N-1) with the pushforward
      law connecting the ontic measure to the sector measure.

      The Kahler instance instantiates it on CP^(N-1) x T^2 with projection onto the first
      factor; the pushforward of the Liouville measure is the Fubini-Study measure, and
      that identification is a theorem, not a stipulation.
    term: Projective sector
    status: physical-postulate
    source: curated
    lean:
      module: CsdLean4/SigmaLayer/ProjectiveSector.lean
    related: [constraint-surface, projectability, fubini-study-measure, hilbert-space, kahler-form]

  - slug: record-layer
    hook: >
      A measurement is over when the world itself carries which outcome happened. The record
      layer is where that fact lives: on the arena, not in anyone's notebook.
    layman: >
      Suppose outcome probabilities really are the volumes of regions in some space of
      states. You still owe an account of the outcome itself. After the experiment,
      something in the world, a pointer, a grain of silver, a memory, holds which result
      occurred. A theory that prices outcomes but cannot say where the outcome is written
      has stopped one step short.

      The record layer is that last step. It asks for two things. First, the outcome
      regions must be fixed by the apparatus alone, in the way that a referee's rulebook
      does not depend on which team is playing. Second, the record must be a physical
      configuration of the arena, the space of everything that exists in CSD: an ontic
      fact, one that holds independently of anyone's knowledge, selected by the one real
      trajectory.

      Nothing mystical is on offer. A record is structure the arena already has, singled
      out by where the trajectory went.
    in_csd: >
      This is the programme's near frontier, and it is partly built. The partition fixed by
      the context exists: outcome regions, called basins, are defined from the apparatus's
      rate field, the outcome weights the apparatus assigns at each point of the state
      space, with no preparation anywhere in the definition, and their weights come out as
      the Born weights, the probabilities quantum mechanics assigns. For the qubit, the
      simplest quantum system, with two outcomes, the whole story is proved end to end. At
      higher dimension the analysis indicates that the contextual structure, the dependence
      of the outcome regions on the whole measurement context, does not sit on the base
      alone, the base being the projected state space, and the corpus places it in the
      fibre, the part of the arena lying above each state. That placement narrows where the
      mechanism can be, though it rests on refuting one natural class of base candidate
      rather than on a no-go.

      What remains open, and is stated as open, is deriving the fibre mechanism from
      de-isolation dynamics, the physics of a system losing its isolation during
      measurement, rather than exhibiting it. The record layer is where the reconstruction
      is completed or not.
    mathematical: >
      The proved tier: a measurable simplex-valued rate field on the base defines
      pairwise-disjoint basins whose epistemic probability at preparation psi is the Born
      weight, from a partition that never mentions psi. Sequential and mixed-state versions
      run through the Luders tier.

      The open tier is dynamical, not kinematic: no interaction Hamiltonian generating the
      basins is constructed, and the corpus says so in the module that would need it.
    term: Record layer
    status: definition
    source: curated
    related: [de-isolation, measurement-flow, pointer-basis, collapse, record-light-cone]

  - slug: de-isolation
    hook: >
      Nothing collapses. A measured system stops being isolated, and measurement is what
      de-isolation dynamics looks like from inside.
    layman: >
      Textbook quantum mechanics has two rules for change: smooth, deterministic evolution
      while nobody looks, and an abrupt jump when somebody does. Two rules, one world, and
      no principled statement of when each applies. That is not a paradox; it is an
      unfinished theory.

      CSD's diagnosis is that the second rule describes a change of circumstance, not a
      change of law. An isolated system follows the smooth rule. Measurement is the
      deliberate destruction of that isolation, by coupling the system to an apparatus, and
      the jump is what the resulting joint dynamics looks like when you only keep track of
      the system.

      One law, applied twice. The dial that turns is isolation, and it is a physical dial,
      not an interpretive one.
    in_csd: >
      De-isolation is the programme's word for the measurement interaction seen on the
      arena. The corpus realises it concretely. A deterministic, measure-preserving
      de-isolation flow, one that never changes the volume of any set of states and is
      genuinely not the identity, couples the system to a pointer, the part of the
      apparatus that displays the result. It realises the measurement dilation dynamically,
      where a dilation is the standard description of a measurement as smooth evolution of
      system and apparatus together, and the volumes of its pointer blocks, the regions in
      which the pointer shows a given result, reproduce the Born weights for every
      preparation. The entangled tier has its own witness: the singlet, the simplest
      entangled pair of systems, has a state that cannot be split into separate states of
      the two parts, and that non-factorisation is realised by an explicit de-isolation
      flow on the enlarged arena.

      What de-isolation does not do, and what remains open, is generate the record layer's
      fibre mechanism from first principles, and the honest boundary between "exhibited"
      and "derived" is maintained wherever the flows appear.

      One specific attempt to derive it was retired as mis-specified rather than merely
      hard. The idea was to use a mixing de-isolation flow, one that stirs the arena so
      thoroughly that every region eventually spreads evenly through every other, and to
      obtain an exponential law for first passage, the time at which the trajectory first
      enters an outcome region, as a limit theorem. Three things defeat it. The limit
      theorems for hitting times need the target sets to be vanishingly rare, while the
      cells of a Born partition have sizes that sum to one. An asymptotic law would deliver
      the Born weights only in a limit, which is weaker than what the corpus proves exactly.
      And the race between outcomes needs independent clocks, which one deterministic
      trajectory cannot supply. What survived is the clock law, which is forced rather than
      chosen, and the rates, which Kac's formula reads off any ergodic flow: for a flow that
      visits every region in proportion to its volume, the average time between visits to a
      region is fixed by that volume.

      De-isolation also has an operational face, and the corpus proves the two agree. The flow
      that couples system and pointer, watched from the system alone, is a channel that keeps
      the pointer-basis diagonal of the density operator and discards the rest. Entropy never
      decreases under it, the second law of the thermodynamics track is its coarse-graining,
      and the classical information it lets through is exactly one bit per qubit. So the same
      de-isolation dynamics that realises the Born weights as volumes also realises
      decoherence as a channel, with no second mechanism.
    mathematical: >
      The measurement-dynamics tier: a von Neumann de-isolation flow on the dilated space,
      measure-preserving and distinct from the identity, whose pointer-block volumes and
      almost-sure frequencies are the Born weights. The Naimark dilation is realised
      dynamically rather than cited abstractly, and the outcome map per microstate is
      delivered by the pointer-partition theorems.

      The mixing-flow route to the fibre mechanism, with an exponential first-passage law
      arriving as a limit theorem, was retired in August 2026 as mis-specified rather than
      merely hard: hitting-time limit theorems require shrinking target sets, an asymptotic
      law is weaker than the exact Born identity already proved, and one deterministic
      trajectory supplies no independent clocks. The clock law and the Kac-formula rates
      survive.

      deisolationChannel N (LF6/DecoherenceChannel.lean) is stinespringChannel of the von
      Neumann coupling unitary with the pointer ready; deisolationChannel_apply_outerProduct
      recovers decohereReduced on rank-one inputs, deisolationChannel_apply_eq_pinch
      identifies it with the pinching of the second-law module,
      vonNeumannEntropy_le_deisolation is the entropy non-decrease and
      deisolationChannel_holevoCapacity the one-bit capacity.
    term: De-isolation
    status: definition
    source: curated
    related: [measurement-flow, stinespring-dilation, holevo-bound, record-layer, isolation]

  - slug: typicality-volume
    reviewed: 2026-08-25
    hook: >
      Almost every way the experiment could have started gives the quantum statistics. That
      is not an assumption about probability; it is a measured volume.
    layman: >
      A deterministic world has no dice, so where do quantum probabilities come from? The
      classical answer, ignorance of initial conditions, always carried a hidden debt. Which
      initial conditions count as typical depends on how you measure sets of them, that is,
      on the rule you use to say how large a set of starting points is, and choosing that
      rule to get the answer you wanted is circular.

      Typicality volume is the debt paid. Fix the one measure that the symmetry of the state
      space allows. Then ask: of all the microstates, the complete states of the world,
      compatible with how the experiment was prepared, what fraction sits in the region
      belonging to a given outcome? That fraction is the outcome's weight. Run the
      experiment many times, drawing a fresh microstate each run, and the observed frequency
      converges to it.

      No randomness enters the dynamics. The probability lies entirely in the ignorance, and
      the ignorance is priced by a ruler nobody chose.
    in_csd: >
      This is the ontic half of the Born rule, the quantum rule for outcome probabilities.
      The outcome regions are epistemic, partitions of the sector fixed by the measurement
      context, but the weight of each region is the Liouville volume of its preimage on the
      constraint surface: the arena's own volume, applied to the set of arena points that
      project into the region, and conditioned on the preparation region, meaning measured
      as a fraction of the states compatible with the preparation. Typicality here is
      repeated-preparation typicality: each trial draws a fresh microstate from the
      conditional measure, and the strong law of large numbers, the theorem that averages
      of independent draws settle to their expected value, does the rest.

      The volume reading is proved at full generality: frequencies converge jointly to the
      complete Born vector, the full list of outcome probabilities, for every unit
      preparation and without genericity hypotheses. What remains open is concentration,
      which would upgrade "the mean is the Born weight" to "a single long run concentrates
      around it" at an explicit polynomial rate.
    mathematical: >
      The chain runs LF1 to LF4: i.i.d. preparation sampling, indicator variables per
      outcome region, the strong law of large numbers, and the identification of the
      limiting weight with a Fubini-Study volume ratio via the moment map and the
      Duistermaat-Heckman law.

      The general-N statement is unconditional and foundational-triple-only: no
      Gleason-type input anywhere on the volume route.
    term: Typicality volume
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF4/BornRegionUncond.lean
      theorem: born_frequency_convergence_N_uncond
    related: [born-weight, typicality, born-volume-ratio, outcome-region, fubini-study-measure]
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper A is the volume-based account of outcome frequencies

  - slug: outcome-region
    reviewed: 2026-09-04
    hook: >
      An outcome is a region, and the apparatus alone draws its boundary. The preparation
      decides where the trajectory lands; it does not get to draw the map.
    layman: >
      If outcome probabilities are the sizes of regions, who draws the regions? There is a
      wrong answer available, and early versions of any volume picture flirt with it: let
      the prepared state draw its own regions, sized to the probabilities you already knew.
      That is bookkeeping wearing the costume of an explanation.

      The honest requirement is that the measuring device fixes the partition before the
      state shows up, the way a roulette wheel's pockets exist before the ball drops. It is
      the same wheel for every ball. Then the fact that the frequencies match the pocket
      sizes is a discovery about the dynamics, not a definition.

      CSD's outcome regions meet that requirement. They are built from the apparatus's own
      data, and no preparation appears anywhere in their definition.
    in_csd: >
      The outcome regions are the epistemic half of the two-level structure, the half that
      concerns descriptions rather than what exists. A measurement context fixes a
      partition of the sector, the space of quantum states, and Paper C demands that the
      partition depend on the context alone. The corpus discharges this with basins built
      from a context's rate field, the outcome weights the apparatus assigns, read at the
      ontic point; the preparation plays no part. It then proves that their epistemic
      weights are exactly the Born weights, the probabilities quantum mechanics assigns.

      The dimension story is a genuine discovery. For the qubit, the simplest quantum
      system, the regions can live on the base of the sector, the projected state space
      itself. At higher dimension the natural way of doing so is squeezed very hard.
      Covariance, the requirement that the construction respect the symmetry, together
      with positivity, forces a chain of machine-checked conditions on any base density
      that depends on the preparation alone and only through distance from it, namely
      disjoint supports and vanishing below a threshold that rises with dimension, with the
      qubit exempted for the same structural reason in three independent ways. The scope
      matters, because it is easy to overstate and an earlier version of this page did
      overstate it: that is a tight constraint, not a no-go. The closing step needs
      machinery that does not exist yet, so base-only at higher dimension is open in both
      directions, neither proved impossible nor exhibited, and is parked as such. The
      fibre, the part of the arena above each state, is where the corpus builds, by a
      judgement that either answer would leave unchanged. The regions stay epistemic
      throughout; what the trajectory selects among them, the record, is ontic.
    mathematical: >
      Paper C's A7 is the requirement that the partition depend on the context M alone. A
      ContextField assigns each base point a measurable probability vector over outcomes;
      the basin for outcome i is the set of arena points whose fibre coordinate falls in
      the i-th arc of the field's cumulative weights.

      Basins are measurable, pairwise disjoint, almost-everywhere exhaustive, and their
      epistemic probability at preparation psi is the Born weight, the headline
      globalBasin_born, from a partition that never mentions psi. The higher-dimensional
      constraint is on radial, preparation-only base densities: covariance plus positivity
      force disjoint supports and vanishing below a dimension-dependent threshold.
    term: Outcome region
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/RecordLayer/GlobalBasin.lean
      theorem: globalBasin_born
    related: [born-weight, typicality-volume, preparation-region, carving, borel-set]

  - slug: epistemic-measure
    reviewed: 2026-08-25
    hook: >
      Condition on what a preparation actually fixes, and the ignorance left over is a
      measure. That measure is a theorem rather than a stipulation: the arena's own volume
      disintegrates into exactly it.
    layman: >
      You prepared the system carefully, so you know its quantum state exactly. On the
      arena picture, that knowledge is radically incomplete. One quantum state corresponds
      to a whole crowd of points on the arena, all projecting to the same state, and that
      crowd is called the fibre over the state. What should you believe about the part you
      cannot see?

      The natural answer is to condition on what you know. You know the visible coordinate
      exactly, so put all your credence, your degree of belief, there. You know nothing
      about the hidden coordinate, so spread your credence evenly over the fibre, using the
      fibre's own symmetry to say what "evenly" means. That combined object is the
      epistemic measure.

      The satisfying part is that "evenly" is not a choice. Take the arena's own volume and
      disintegrate it along the projection, which means slicing it into the volumes it
      induces on each fibre. Those slices are exactly this measure, for almost every state.
      What the programme first adopted as a stated definition turned out to be the unique
      answer the geometry had waiting.
    in_csd: >
      The epistemic measure is what "isolation is conditioning" means in practice. The
      isolation-conditioned state of knowledge at a given preparation places all its weight
      on that one state in the base, the projected state space, and spreads uniformly over
      the fibre above it, uniformly in the sense fixed by the fibre's symmetry. Every
      record-layer probability, including the Born weights of the context-fixed basins, is
      computed against it.

      Conditioning on a single state means conditioning on a set the base measure calls
      null, one of size zero, which is why the corpus first took this form as a stated
      definition. The derivation then followed. The Liouville measure, the arena's own
      volume, disintegrates along the base projection; its disintegration kernel, the
      family of fibre volumes it induces, is almost everywhere the uniform one; and the
      epistemic measure is the fibre of that disintegration planted at its base point. The
      modelling choice turned out to be the theorem.
    mathematical: >
      epistemicMeasure p is the product of the Dirac measure at p with normalised Haar on
      the torus fibre, a probability measure on the arena for every p.

      The derivation: kMuL_condKernel_ae identifies the disintegration kernel of the
      Liouville measure with the constant Haar kernel, almost everywhere in the
      Fubini-Study base measure, via the standard-Borel conditional-kernel machinery and
      almost-everywhere uniqueness of disintegrations; epistemicMeasure_eq_disintegration
      then equates the epistemic measure with the Dirac-paired disintegration fibre. The
      almost-everywhere qualifier is intrinsic: disintegration kernels are only determined
      up to a null set of base points.
    term: Epistemic measure
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/RecordLayer/EpistemicDisintegration.lean
      theorem: epistemicMeasure_eq_disintegration
    related: [ontic-vs-epistemic, psi-epistemic, born-weight, typicality, preparation-region]

  - slug: carving
    hook: >
      Carving is the programme's own word for the move it refuses to count as a derivation:
      cutting a region to have exactly the size you wanted to explain.
    layman: >
      Stated as bluntly as a critic would, the problem with volume explanations of
      probability is this. If you are allowed to draw the regions yourself, you can make any
      probability come out of any measure. Draw a region covering thirty percent of the
      space, announce that the outcome has a thirty percent probability, and you have
      explained nothing. The explanation was smuggled in with the scissors.

      CSD calls this move carving, by name, in its own documentation, because early layers
      of the formalisation genuinely did it, and the honest label is what kept the debt
      visible. A carved region realises the Born value, the probability quantum mechanics
      assigns. It does not derive it.

      The interesting history is the repayment. For the corpus's central results the
      carving was eliminated. The sizes come out of the geometry, forced by symmetry and by
      the moment map, a function that reads the outcome weights directly off the quantum
      state, with no hand on the scissors.
    in_csd: >
      Carving is the boundary marker between two kinds of result that the programme keeps
      separate. A realisation is a fibre partition cut by construction so that its volumes
      match a target: proved, useful, and honestly labelled as putting the value in. A
      derivation is the Born weight shown equal to a volume the geometry fixes
      independently, through the moment-map identity and the Duistermaat-Heckman law, which
      fixes how the state space's volume is distributed over the possible outcome weights,
      so that nobody chose the sizes.

      The corpus's documentation flags every result with the side of the line it sits on,
      and the volume route to the Born rule runs entirely on the derived side. The word
      survives as an audit tool. When a new result lands on a specific number, the first
      question asked is whether anything was carved.
    mathematical: >
      The carved tier: fibre arcs of prescribed length realising prescribed weights, with
      genuine disjointness and correct totals but the target built in.

      The derived tier: the Born weight as a moment-map coordinate, forced by torus
      generation (CellLawForced.lean, torusGenerated_eq_momentMap) rather than by
      invariance; the joint pushforward of the Fubini-Study measure under the moment map
      equal to the uniform simplex law; and the resulting volume-ratio theorems at every N,
      unconditional.
    term: Carving
    status: definition
    source: curated
    related: [outcome-region, measurement-context, pointer-basis, fibre, record-layer]

  - slug: first-passage-race
    hook: >
      When a measurement has several possible outcomes, the one that happens is the one
      whose clock fires first, and the law those clocks obey is not a modelling choice: it
      is the only law that makes the race come out right, and that is proved in both
      directions.
    layman: >
      Suppose a measurement outcome is decided by something physical rather than declared
      by a rule. That something then has to be specified in detail, and every detail a
      theory specifies is a detail a critic can call arbitrary. The first-passage race is
      CSD's way of settling an outcome physically while leaving as little as possible to
      choice.

      The picture is a race. Each possible outcome carries its own clock. The clocks run
      at speeds set by the quantum state, so an outcome the state favours has a fast clock
      and an outcome it disfavours a slow one, and the outcome that happens is the one
      whose clock fires first. Set up this way, the race reproduces the quantum
      probabilities exactly. But it seems to buy that result by choosing how the clocks
      behave. The clocks have exponential waiting times, which means that the chance of a
      clock firing in the next instant never depends on how long it has already been
      running, much as a radioactive atom is no more likely to decay for having survived a
      long time. Why that law and not some other?

      The answer is that no other law works. If the rule that the first clock to fire wins
      is to reproduce the right proportions for every possible number of outcomes, the
      waiting times have to be exponential. That is not a natural choice or a convenient
      one; it is the only one. The argument runs both ways: the exponential law makes the
      race work, and any law that makes the race work is exponential.
    in_csd: >
      The race is the record layer's order-free way of deciding an outcome. An earlier
      construction cut an interval into consecutive pieces stacked in a fixed order, which
      quietly privileged whichever outcome came first in the list. In the race no outcome
      is privileged; each simply has a clock. The clock rates are read off the moment map,
      the map that extracts the Born weights directly from the geometry of the state
      space, so the squared amplitudes that set the speeds are geometry rather than an
      extra input. The clock law itself is a theorem in the corpus rather than a citation
      to the probability literature.

      Two qualifications travel with the result and should never be dropped. First, the
      characterisation quantifies over every number of outcomes. At any one fixed number
      of outcomes the race constrains only finitely many summary statistics of the
      waiting-time law and determines nothing on its own. What is forced is the
      exponential law given that a single clock law serves every case, and that is a
      commitment the programme already makes: the behaviour of the clocks does not depend
      on which measurement is being performed.

      Second, the result removes a posit; it does not supply a mechanism. No dynamics is
      shown to carve the cells of the race, and the earlier attempt to derive them from a
      mixing flow was retired as mis-specified rather than merely unfinished.
    mathematical: >
      Take independent, identically distributed clock readings xi_j drawn from a common
      probability law on the reals, and let clock j fire at time xi_j / b_j for a rate
      vector b with positive entries. The law has the race property when, for every number
      of clocks and every such rate vector, the probability that clock i fires first is
      b_i / sum_j b_j. The theorem hasRaceProperty_iff_exists_expMeasure
      (CsdLean4/Mathlib/Probability/IidClockRace.lean) states that a probability law has
      the race property if and only if it is an exponential law with some positive
      parameter.

      The forward direction instantiates the race at k clocks for every k, which turns the
      race condition into a family of moment identities for the unknown law; atomlessness
      and support in the positive reals are derived from the race property along the way
      rather than assumed. The quantification over the number of clocks is load-bearing:
      at a fixed number of clocks only finitely many moments are constrained, so what is
      characterised is the law that serves every number of clocks.
    reviewed: 2026-09-11
    term: First-passage race
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Mathlib/Probability/IidClockRace.lean
      theorem: hasRaceProperty_iff_exists_expMeasure
    related: [de-isolation, fibre, record-layer, measurement-flow, single-trajectory]

  - slug: fibre
    hook: >
      The arena of CSD is larger than the space of quantum states by exactly one compact
      factor, and from three dimensions upward the natural ways of doing without that
      factor stop working.
    layman: >
      If quantum states are shadows cast by a richer arena, something has to be said
      about the part of the arena that does not show up in the shadow. It had better not
      be idle decoration: hidden structure that never does anything is the first thing a
      critic should cut away. The fibre is that hidden part, and the point of this entry
      is why it is there.

      A fibre, in the geometer's sense, is a small space attached over every point of a
      larger one, like the bristles of a brush standing over each point of its backing. In
      CSD's working arena the space of quantum states is the base, and over each of its
      points stands a copy of a torus, the surface of a doughnut, which is compact: finite
      in extent and closed up on itself, with no edge. A point of the arena is therefore a
      quantum state together with a position on the torus above it. The fibre is where the
      arena keeps what the quantum state cannot: which outcome basin, meaning which of the
      regions of the fibre belonging to the different outcomes, the trajectory of the
      world actually occupies. That is the raw material from which records are made.

      The fibre earned its place by argument, not by taste. At the level of a qubit, the
      simplest quantum system with two possible outcomes, one can just about manage
      without it: the two-level case has a coincidence that lets the outcome structure sit
      on the state space itself. One dimension higher that coincidence is gone, and the
      natural candidates for doing without a fibre fail, so the fibre is where the corpus
      puts the structure. That the failure extends to every conceivable candidate is
      expected but not established.
    in_csd: >
      The fibre is where the record layer lives. The outcome basins fixed by a measurement
      context are arcs of the fibre coordinate, read off above each point of the base, and
      the epistemic measure, which describes what an observer who knows only the quantum
      state can say, spreads evenly over the fibre. The basin the trajectory occupies is
      the ontic record, the fact about the world that a measurement reveals. How the fibre
      is weighted is not a modelling choice either: the arena's measure is the only
      probability measure invariant under the arena's own symmetry, the unitary
      transformations turning the state space together with the translations turning the
      fibre. The base half of that uniqueness was already known; the fibre half completes
      it, so nothing about how the arena is weighted is left to taste.

      The load-bearing discovery is dimensional. With two-dimensional states, a partition
      fixed by the context alone can be built on the base, a special accident of the
      two-dimensional state space. With three or more dimensions the natural base-only
      construction is constrained to very little. Two requirements do the constraining:
      covariance, meaning that the construction must respect the symmetry of the state
      space, and positivity, meaning that a density cannot take negative values. Together
      they force a density on the base that depends on the prepared state alone, and on it
      only through the distance from it, to have disjoint supports for different outcomes
      and to vanish below a threshold that rises with the dimension, and the split between
      two dimensions and three or more shows up in three independent ways. The scope
      matters, because this page has overstated it twice: the chain of arguments stops
      short of a no-go theorem. Two of its inputs are undischarged and the closing step
      needs machinery that does not exist, so the base-only route is open in both
      directions, neither refuted nor exhibited, and is parked. The fibred reading is
      canonical by the author's decision, taken because either answer leads to the same
      next move. This narrows where the mechanism can live; it does not refute it, since
      existence is proved.

      A second argument for the fibre was offered and later withdrawn. It said that the
      outcome race needs several independent clocks that one deterministic trajectory
      cannot supply, so the fibre must supply them. That does not hold. Time in the arena
      is a single shared parameter, so the clocks are aligned deterministic readings of
      one microstate, not independent processes, and the corpus's Born construction on the
      fibre never races anything: it cuts the fibre circle into consecutive arcs and reads
      each weight off the arc length, one uniformly distributed coordinate with no
      independence anywhere. The dimensional argument above is unaffected and stands
      alone.

      An older frontier question, deriving the fibre mechanism from a mixing de-isolation
      flow, one that stirs the arena thoroughly enough to spread any region evenly, was
      retired as mis-specified rather than merely hard, and its successor was mis-stated
      too, because the obvious phrasing is also wrong. There are two partitions to keep
      apart. The outcome regions on the projective base are epistemic: they belong to a
      calculation space, nothing sculpts them, and they match the volumes because the
      measure is forced by symmetry and the weights are the moment map, not because any
      dynamics carved them. The fibre cells are a different object, placed on the ontic
      fibre, and the outcome is the ontic selection of which cell the point occupies; the
      corpus adds that the particular cell family is one concrete realisation of an
      interface, so the shapes of the cells are bookkeeping while the fibre, the rates and
      the selection are not. The successor question is therefore about the readout, not
      the regions: does a physical de-isolation interaction generate a pointer whose level
      sets, the sets of arena points on which the pointer shows one reading, carry the
      Born measures? The Born weights themselves do not wait on the answer, because the
      corpus proves that any measurable pointer with those basin measures gives Born,
      independently of the flow.
    mathematical: >
      The arena is CP^(N-1) x T^2 with the flat torus fibre carrying normalised Haar
      measure. The base factor of that product measure is proved to be the normalised
      symplectic volume of the Fubini-Study form
      (manyToOneSetup_liouvilleMeasure_eq_fsVolumeNormalized_prod,
      LF4/SectorManifold.lean), so the arena measure is derived from the volume form on
      the base and Haar measure on the fibre, not posited as a product; it is the unique
      probability measure invariant under U(N) acting on the base and translations acting
      on the fibre. Basins are preimages of arcs under the first fibre coordinate, with
      the arc endpoints set by the context's rate field.

      The N >= 3 argument is not a Gleason-type theorem, since CSD's partitions are
      contextual and Gleason and Kochen-Specker do not apply. It is a chain of
      machine-checked necessary conditions on a base-only radial density: disjoint
      supports, and vanishing below a threshold rising with dimension. It leaves very
      little room and stops short of closing it. Two inputs are undischarged and the
      terminal step needs machinery Mathlib does not have, so the base-only route is open
      in both directions and parked as such.

      For the record, the independent-clocks argument for the fibre was offered in August
      2026 and withdrawn on 2026-08-26, and the mixing-flow frontier was retired in the
      same month.
    reviewed: 2026-09-11
    term: Fibre
    status: definition
    source: curated
    lean:
      module: CsdLean4/LF4/KahlerInstance.lean
    related: [many-to-one-projection, constraint-surface, first-passage-race, carving, record-layer]

  - slug: many-to-one-projection
    hook: >
      Behind every quantum state stands a crowd of world-states, and the projection that
      maps the crowd to one state loses information on purpose: that loss is where quantum
      probability comes from.
    layman: >
      If the world is deterministic and you know the quantum state exactly, why can you
      not predict the outcome of a measurement? Something must separate what the state
      tells you from what the world knows. In CSD that something is a projection, a map
      from the full arena of world-states down to the space of quantum states, and the
      important feature of the map is that it forgets.

      Many distinct points of the arena map to the same quantum state. The map is
      many-to-one by design. Knowing the quantum state therefore fixes only the visible
      coordinate of the world's position and says nothing about the rest. Outcomes depend
      on the rest, so exact knowledge of the state is compatible with genuine ignorance of
      the outcome, even though nothing in the world is random.

      This is the oldest move in statistical physics, relocated. The temperature of a gas
      is a single number that many different arrangements of molecules share, and knowing
      the temperature does not tell you where the molecules are. The novelty in CSD is not
      the move itself but what is proved about the projection.
    in_csd: >
      The projection from the arena to the projective sector, CSD's name for the space of
      quantum states, is postulated to be measurable and many-to-one. Measurable means
      that any region of the state space to which a size can be assigned pulls back to a
      region of the arena to which a size can be assigned, so that volumes upstairs and
      downstairs can be compared. The many-to-one character is intended and is stated as
      such in the source.

      Everything epistemic, everything about what an observer can know, happens downstream
      of the projection; everything ontic, everything about what is actually the case,
      happens upstream. The Born weight of a region of the state space is the ontic volume
      of the set of arena points that project into it, so the information the projection
      forgets is exactly the information that typicality averages over.

      What keeps this from being a shell game is an anti-circularity discipline. The
      projection carries no Born equality, no identity between measures and no unitarity.
      Those are theorems proved about it downstream, not properties packed into the
      definition.
    mathematical: >
      ProjectiveSector carries the measurable map pi from Sigma to the projective space
      with no further structure; the projective law is the pushforward of an ontic measure
      along pi. On the Kahler instance pi is the product projection CP^(N-1) x T^2 ->
      CP^(N-1), with every fibre a full torus.

      The pushforward identity, Liouville measure to Fubini-Study measure, is proved, and
      the guard scripts enforce that the projection's descent equation is genuinely
      consumed downstream rather than decoratively carried.
    term: Many-to-one projection
    status: definition
    source: curated
    related: [fibre, constraint-surface, projectability, ontic-vs-epistemic, projective-sector]

  - slug: pointer-basis
    reviewed: 2026-09-11
    hook: >
      A measuring apparatus does not record what you ask it to; it records what it can
      keep, and what it can keep is decided by its interaction with the surroundings, not
      by the experimenter.
    layman: >
      A measuring device is supposed to end up in one of several stable readings: the
      needle points left or it points right. Yet the equations of quantum mechanics
      happily describe superpositions of pointer readings, states in which the needle is
      in no definite position at all, and nobody has ever seen one. Why do pointers settle
      into some states and not others? The pointer basis is the name for the privileged
      set of readings a device can settle into, and the question is what picks it out.

      The standard answer, which CSD adopts, is called einselection, short for
      environment-induced selection. The environment interacts with the apparatus
      continuously, and only certain states of the apparatus survive that interaction
      unscrambled. Those survivors form the pointer basis. A pointer position is robust
      because bumping into air molecules does not change it; a superposition of two
      positions is fragile because the first bump registers which position the molecule
      met, and the superposition is gone.

      What decides which states survive is a property called commutation. Two operations
      commute when the order in which they are carried out makes no difference. An
      observable, a measurable property of the apparatus, survives the interaction exactly
      when the interaction commutes with it, so that the interaction cannot alter it. In
      the corpus this is a theorem rather than a slogan: an observable is left unchanged
      by the interaction at every moment if and only if it commutes with it. What remains
      owed sits one level up. Which interaction a given apparatus realises is an input to
      the theorem, and deriving that interaction from the arena's own dynamics is an open
      problem, which the corpus says wherever the result is stated.
    in_csd: >
      In the record layer the pointer basis is what makes a record a record: a stable,
      re-readable configuration that the de-isolation dynamics writes and the environment
      does not erase. It is important to be precise about what is proved. The state of a
      system is written as a table of numbers called a density matrix, whose diagonal
      entries are the populations, the probabilities of the individual readings, and whose
      off-diagonal entries are the coherences, the terms that encode a superposition. For
      a general number of outcomes the dephasing channel is defined as the map that keeps
      the diagonal of the density matrix and discards everything else. The statement that
      it kills the coherences and preserves the populations is therefore a definitional
      unfolding, and the pointer basis is, by construction, the basis in which the matrix
      was written down. The corpus flags this in the theorem's own documentation rather
      than leaving it to be discovered.

      The content near that statement is real but narrower. The channel genuinely acts on
      a superposed state rather than leaving it alone; the degenerate case, where all
      readings are equally likely and no basis is preferred, is handled rather than waved
      at; and for a two-level system the continuous-time law of decay is exact. The
      commutation criterion is a full characterisation: the pointer observables of a
      supplied interaction are exactly the commuting ones. They are constants of the
      interaction's motion, their populations are conserved in every state, and any
      non-commuting projection is provably disturbed. The ontic origin of the pointer
      basis, einselection from the arena's own dynamics rather than from a supplied
      interaction, is explicitly deferred to a later tier of the programme.

      The two-level reading applies here as everywhere in CSD: the pointer basis is a fact
      about the dynamics, on the ontic side, while which pointer reading obtains in a
      given run is the record, selected by the trajectory.
    mathematical: >
      The theorem einselectionN states that the general-N dephasing channel zeroes the
      off-diagonal terms in the pointer basis and preserves the diagonal populations.
      Stated alone this is definitional, since the channel is diagonal(rho i i) and the
      off-diagonal part of a diagonal matrix is zero, and the docstring says so. The
      content sits in the companions: the channel acts non-trivially on a coherent state,
      it restricts to the derived qubit reduction, and at equal populations it degenerates
      to a multiple of the identity, invariant under any unitary conjugation, so no basis
      is preferred.

      The genuinely dynamical statement is the qubit dephasing semigroup, where the
      off-diagonal coherence decays exactly as exp(-gamma t) with populations conserved
      and the limit at large t proved; amplitude damping is its companion. Both are
      two-level. At general N the criterion is characterised in PointerCommutation.lean:
      pointer_invariant_iff_commute proves that an observable is a constant of the
      interaction flow at every time iff it commutes with the Hermitian generator, with
      the disturbance of any non-commuting observable proved alongside. The interaction is
      the input; einselection from Sigma-dynamics is gated to the entangled tier.
    term: Pointer basis
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Empirical/CSD/Einselection.lean
      theorem: einselectionN
    related: [measurement-flow, de-isolation, luders-rule, record-layer, stern-gerlach]

  - slug: preparation-region
    reviewed: 2026-08-25
    hook: >
      Repeating the same experiment is a physical claim, and this is what it refers to: a
      region of the arena, not a single point, that the preparation procedure lands the
      world in.
    layman: >
      No laboratory procedure controls a system completely. Cool an atom, align a
      polariser, fire the same laser pulse: what you fix is everything your instruments
      can see, and the world keeps the rest. So preparing the same state a thousand times
      cannot mean putting the world in the same complete condition a thousand times. The
      preparation region is the honest version of that phrase, and it is where quantum
      statistics begin.

      The preparation region is the set of all points of the arena, the space of complete
      world-states, that are compatible with what the procedure fixed. Each run of the
      experiment is one point drawn from that region. The statistics of many runs are the
      statistics of the region: how often an outcome occurs is how much of the region
      leads to it.

      Once the matter is put this way, quantum probability stops being mysterious in kind.
      It is the same ignorance over a region of possibilities that classical statistical
      mechanics runs on when it describes a gas by its temperature rather than by the
      position of every molecule. The work is in proving that the numbers come out right,
      and that is where the theorems about measures and volumes earn their keep.
    in_csd: >
      The preparation region is a primitive of the corpus's first formal layer: a
      measurable subset of the arena with positive volume under the arena's natural
      measure, the Liouville measure. Repeated trials draw from it independently, each
      draw governed by the arena's measure restricted to the region and rescaled so that
      the region as a whole has total weight one. Every frequency theorem in the corpus is
      stated relative to it: the weight of an outcome is the volume of the part of the
      region that leads to that outcome, divided by the volume of the whole region.

      The refinement to pure states carries its own honesty note. When the measure is
      passed to the continuous setting, the set of arena points lying over a single
      quantum state has zero volume, so restricting the ambient measure to it is not
      defined. Pure preparations therefore carry a posited law for trials on that set
      rather than one derived from the ambient measure, and the corpus states this
      wherever the posit is used.
    mathematical: >
      prepMeasure conditions the Liouville measure on the preparation region; repeated
      trials are i.i.d. draws from it; the LF1 main theorem sends empirical frequencies to
      volume weights almost surely.

      The conditional-measure formula and the weight-as-volume-ratio identity, the weight
      of an outcome region O being the Liouville volume of O intersected with the
      preparation region divided by the volume of the preparation region, are the exported
      infrastructure the higher layers consume.
    term: Preparation region
    status: definition
    source: curated
    lean:
      module: CsdLean4/LF1/Preparation.lean
    related: [outcome-region, epistemic-measure, born-weight, von-neumann-entropy, typicality-volume]

  - slug: measurement-context
    hook: >
      A measurement is not a question put to the quantum state. It is a piece of
      apparatus, and the apparatus brings its own way of dividing the world into outcomes.
    layman: >
      Quantum mechanics is contextual. You cannot assign answers to every possible
      measurement at once; you can only assign them to the measurements that one actual
      arrangement of equipment can perform together. So the measurement is never just a
      quantity written on paper. It is a physical context, and which context is in place
      makes a difference to what can happen. The measurement context is the concept that
      records this.

      CSD takes the context seriously enough to make it a definite piece of data. A
      context is the information the apparatus contributes: for every possible state of
      the world, a set of rates, one per outcome, saying how strongly each outcome is
      favoured. Fix the context and the regions of the arena that lead to each outcome are
      fixed; change the context, and a genuinely different division of the arena applies.

      A useful comparison is a referee's rulebook. The rulebook belongs to the referee,
      exists before the match starts, and does not consult the players. In the same way
      the context belongs to the apparatus, is fixed before the run, and does not depend
      on which state was prepared. The comparison stops there: a rulebook is written by
      people, whereas in CSD the natural context is read off the geometry of the state
      space.
    in_csd: >
      Formally a context is a rate field on the base of the arena, the space of
      quantum states: to every point of the base it assigns a list of outcome weights,
      each non-negative and all summing to one, in a way that lets the resulting
      regions be measured. The preparation plays no part in this assignment. That
      independence is one of the programme's stated requirements, and the corpus
      builds its outcome basins from the context's field alone. The canonical context
      reads its rates off the moment map, the map that extracts the Born weights from
      the geometry of the state space, so even the rates are geometry rather than
      bookkeeping.

      Contextuality then has a precise home. Distinct contexts induce distinct partitions
      of the arena. The no-go theorems against assigning context-independent answers to
      every measurement at once are proved in the corpus, and alongside them stands a
      positive witness: a contextual model that reproduces the statistics of the singlet
      state, the standard two-particle entangled state, in full.
    mathematical: >
      A ContextField consists of rate functions p -> Fin N -> R, measurable per outcome,
      nonnegative, summing to one at every point. The preparation-independence of the
      field is the A7 requirement.

      The induced basins are measurable and pairwise disjoint with Born-weight epistemic
      probabilities; the canonical instance takes rate := momentMap with measurability
      supplied by the moment-map infrastructure.
    term: Measurement context
    status: definition
    source: curated
    related: [contextuality, carving, luders-rule, kochen-specker, pointer-basis]

  - slug: single-trajectory
    hook: >
      There is one world and it follows one path. Probability lives in how experiments are
      repeated, not in how the world evolves, and theorems rather than wording keep the
      two apart.
    layman: >
      A deterministic account of quantum mechanics faces a fork. Either the world splits,
      or there is a vast space of possible world-states and one actual path through it.
      CSD takes the second branch without hedging: a single trajectory, on a single arena,
      evolving deterministically. This is what the programme means by a single-trajectory
      theory.

      Then where do statistics come from? From repetition. Each run of an experiment
      re-prepares the system, which lands the world at a fresh point of the preparation
      region, the set of world-states compatible with the preparation procedure. A
      thousand runs sample the region a thousand times. The frequencies those samples
      produce are what the volume theorems compute: an outcome's share of the runs matches
      its share of the region's volume.

      What statistics do not come from is one run watched forever. Whether a single
      evolving path eventually visits every part of its space in fair proportion is a
      property called ergodicity, and it is a different and much stronger property than
      repeated preparation. The programme does not rely on it.
    in_csd: >
      CSD is a single-trajectory theory: physical reality is one deterministic path on the
      arena. Its typicality is the typicality of repeated preparation, ignorance spread
      across runs and priced by the arena's natural measure restricted to the preparation
      region, not the averaging of one path over time.

      The corpus even proves the cautionary half. The unitary flow projected onto the
      space of quantum states is not ergodic, so a time-average route to the Born weights
      is closed at that level. That is a narrow fact about one flow on the projective
      space, not an objection to the mechanism, because the frequency theorems never
      invoke ergodicity. That they do not need it is exactly the point.
    mathematical: >
      The LF1 chain formalises the repetition: i.i.d. draws from the conditioned Liouville
      measure, indicator processes per outcome, and the strong law of large numbers
      delivering almost-sure convergence of empirical frequencies to volume weights.

      The non-ergodicity of the epistemic unitary flow on the projective sector is a
      proved theorem kept as a boundary marker: the volume route and the time-average
      route are not the same route, and only the first is claimed.
    term: Single trajectory
    status: definition
    source: curated
    related: [determinism, constraint-surface, where-do-probabilities-come-from, first-passage-race, typicality]

  - slug: witness-and-engine
    hook: >
      A working model proves that the machinery runs; it does not prove that the machinery
      is the world. CSD names that distinction and audits itself against it.
    layman: >
      Every foundational programme faces the same temptation. Build a concrete model in
      which your mechanism visibly works, and it becomes fatally easy to announce that the
      mechanism explains everything the model contains. But the model had quantum
      mechanics built into its bones, so of course quantum mechanics came out. The
      distinction between witness and engine is CSD's vocabulary for resisting that
      temptation.

      The engine is the general machinery: typicality over a preparation region, outcome
      weights given by volumes, and a measure forced by symmetry. A witness is a concrete
      arena on which the engine demonstrably runs, with familiar structures such as the
      space of quantum states and their unitary evolution built in from the start.

      The claim "the engine runs, and here is a witness" is provable, and it is proved.
      The claim "therefore quantum mechanics is derived" would be an overclaim, and the
      corpus's own guard documents exist to keep it from being made.
    in_csd: >
      The finite-dimensional quantum-mechanical closure is the flagship example: a
      concrete projective witness carrying the symmetric measure and unitary evolution, on
      which the full reconstruction pipeline executes. It demonstrates the engine. It is
      not quantum mechanics derived from CSD, because the witness supplies structures that
      a derivation would have to earn.

      The distinction is enforced, not just stated. A manifest names exactly which
      end-to-end claims are backed by theorems, an automated check rejects phrasings that
      have been retracted as overclaims, and results are labelled by which side of the
      line between realisation and derivation they sit on.
    mathematical: >
      The witness tier: SectorData instances on CP^(N-1) and on the Kahler arena, with the
      measure bridge proved instance-by-instance rather than assumed abstractly. The
      engine tier: the frequency and volume theorems quantified over the structures,
      consuming the postulates as hypotheses.

      The audit tier is mechanical: the connectivity manifest and the claims guard are
      scripts that fail the build when prose claims outrun the proved connectivity.
    term: Witness and engine
    status: definition
    source: curated
    related: [lf1-main-theorem, what-is-machine-checked, measurement-flow, born-volume-ratio, de-isolation]

  - slug: field-arena
    reviewed: 2026-09-12
    hook: >
      Take finitely many field modes, cap the number of quanta each can hold, and the
      whole toolbox of quantum field theory, propagators, light cones, Wick's theorem and
      thermal states, reappears as exact theorems on one finite arena.
    layman: >
      Everything else in this glossary concerns systems with finitely many outcomes, while
      the working theory of the physical world is quantum field theory, which has
      infinitely many modes and no limit on the number of quanta. A reconstruction that
      cannot even gesture at fields would be a reconstruction of a toy. The field arena is
      that gesture made precise, deliberately at finite resolution.

      A mode is one independent way a field can vibrate, like a single note on a string,
      and a quantum is one unit of excitation of a mode, the field-theoretic version of a
      particle. The field arena keeps finitely many modes and lets each hold at most some
      fixed number of quanta. On the space of quantum states built from those
      configurations, the canon of field theory is re-proved as exact finite theorems.
      Free propagators, which describe how a disturbance travels when nothing interacts,
      oscillate at the right frequency. The effects of an interaction are priced linearly
      in the strength of the coupling. There is a genuine light cone, a limit on how fast
      an influence can spread, with an explicit bound on the velocity. Thermal states
      satisfy the KMS condition, the exact condition that characterises equilibrium at a
      given temperature.

      This is breadth, and it is labelled as such: the image of standard physics inside
      the programme's arena, not the frontier of the reconstruction.
    in_csd: >
      The field arena is the stage for the programme's continuous-variable track. It is
      the space of quantum states over configurations of finitely many modes with a fixed
      cap on the quanta per mode. Its role in the programme is honestly bounded. It is the
      isolated-piece image: it shows that the structure of effective field theory survives
      at finite cutoff on exactly the kind of arena the reconstruction runs on. No
      continuum limit and no renormalisation-group flow is claimed.

      The bridge theorems tie it back to the record layer. Observations on the arena are
      pairings with a density, dynamics act by kicks, observables supported on disjoint
      sets of modes commute exactly, and the Lieb-Robinson light cone bounds how fast a
      record cell in the fibre can be steered from afar.
    mathematical: >
      FieldArena K N is the projective space over configurations of K modes at cutoff N.
      Mode-local subalgebras are unital star-subalgebras supported on their blocks; free
      and interacting drives are exact matrix exponentials; the two-point and four-point
      functions close into Wick's pairing sum at explicit thresholds.

      The commutator bound decays factorially in graph distance with velocity constant
      2e^2 times the coupling norm, and composite arenas compose by mode concatenation,
      with no-signalling exact for all states, entangled included.
    term: Field arena
    status: definition
    source: curated
    lean:
      module: CsdLean4/CV/ArenaBridge.lean
    related: [lieb-robinson-bound, wick-theorem, no-exact-finite-ccr, record-light-cone, interaction-price]

  - slug: isolation
    hook: >
      Being isolated is not scene-setting; it is the variable the whole theory turns on.
      Quantum mechanics is what isolated pieces of the arena look like from outside.
    layman: >
      Quantum mechanics works flawlessly for systems carefully shielded from everything
      else, and its rules seem to bend exactly when the shielding fails: at measurement,
      in decoherence, wherever the outside gets in. Most formulations treat this as a
      nuisance. CSD treats it as the signal, and isolation is the concept that carries it.

      In CSD isolation is the operative condition. An isolated subsystem follows the
      smooth unitary rule, the reversible evolution that textbook quantum mechanics
      prescribes. Measurement is de-isolation, the engineered ending of that condition.
      And the familiar quantum state describes exactly what an isolated piece of the arena
      presents to the outside world: not the full condition of the piece, but the part of
      it that the rest of the world can see while the piece is sealed off.

      In slogan form, quantum mechanics is the physics of isolation, and the measurement
      rule is the physics of ending it.
    in_csd: >
      Isolation enters the formal layer as conditioning. The state of knowledge available
      at a preparation, given that the system is isolated, is the epistemic measure: it is
      exact on the visible coordinate, the quantum state, and spread evenly over the
      hidden fibre above it. This reading, that isolation is conditioning, is written into
      the definitions of the record layer.

      The complementary dynamical statement is the de-isolation tier. Coupling an isolated
      system to a pointer is what produces records, and the flows that do it are exhibited
      in the corpus. The same isolated-piece image frames the field track: the
      continuous-variable arena shows standard physics reappearing on an isolated finite
      piece, and the corpus labels that as breadth rather than as the frontier.
    mathematical: >
      The epistemic measure implements conditioning on isolation (the P6 reading:
      isolation is conditioning), exact on the base coordinate with Haar measure on the
      fibre; the de-isolation flows implement its termination.

      The open-system tier prices partial isolation quantitatively: dephasing and damping
      semigroups with exact decay laws, and the Lindblad flow proved completely positive,
      so the effective dynamics of an imperfectly isolated system is a legitimate quantum
      channel at every time.
    term: Isolation
    status: definition
    source: curated
    related: [de-isolation, no-signalling, field-arena, lieb-robinson-bound, constraint-surface]

  - slug: moment-map
    reviewed: 2026-09-11
    hook: >
      The Born probabilities are coordinates. The moment map reads them straight off the
      geometry of the space of quantum states, with no measurement postulate consulted.
    layman: >
      You can accept that probabilities are volumes and still find the link between a
      quantum state and its outcome weights opaque: why these particular numbers?
      Classical mechanics has an answer waiting. The state space of a classical system,
      its phase space, has a geometry in which every continuous symmetry comes paired with
      a conserved quantity: turning the system about an axis pairs with angular momentum,
      shifting it in time pairs with energy. When a system has several such symmetries at
      once, their conserved quantities can be collected into a single map, the moment map,
      which sends each state to the list of values those quantities take there.

      The space of quantum states has exactly the right kind of symmetry. Each possible
      outcome contributes to the state with a size and an angle; the angle is called the
      phase, and turning the phase of one outcome's contribution changes nothing that can
      be measured. Turning each outcome's phase independently gives a family of
      symmetries, one circle of rotations per outcome, and together those circles form a
      torus. The moment map of that torus symmetry sends a state to a list of numbers, one
      per outcome, that add up to one. Compute the list, and it is the Born weights, the
      probabilities the textbook obtains by squaring the size of each contribution.

      So the probabilities were sitting in the geometry all along, as the conserved
      quantities of phase rotation.
    in_csd: >
      The moment map is the corpus's route to the Born numbers that draws no regions by
      hand. The weight of an outcome is the corresponding coordinate of the moment map, a
      quantity fixed by the geometry of the state space and forced by the requirement that
      it generate the torus symmetry, with no partition drawn and no operational input
      consulted. It also supplies the canonical measurement context, whose rate field is
      the moment map itself, so that even the rates of the record layer are geometric.

      Downstream, pushing the symmetric measure on the state space forward through the
      moment map gives the uniform law on the space of probability lists. This is the
      Duistermaat-Heckman fact that converts statements about volumes into integrals over
      that space, and it closes the programme of obtaining the Born weights from volume in
      every finite dimension.
    mathematical: >
      For the torus action on CP^(N-1) the moment map sends a ray to its vector of squared
      amplitudes; the identity is proved as momentMap_mk_eq_inner_sq, and the moment map
      is forced by torus generation (torusGenerated_eq_momentMap). The joint pushforward
      of the Fubini-Study measure is (N-1)-factorial times Lebesgue measure on the open
      simplex, the flat Dirichlet law, proved via the Gaussian representation and a
      product-index bridge, and consumed by the unconditional volume-ratio and frequency
      theorems at every N.

      The defining equation is proved at manifold level: the velocity field of the torus
      action is the Hamiltonian vector field of 2 sum theta_k mu_k for the Fubini-Study
      symplectic form (torusField_isHamiltonianVectorField), a moment map is unique up to
      a constant and the normalisation pins it, its image is exactly the standard simplex
      (range_momentMap), and the torus orbits are its integral curves. For any Hermitian H
      the Schrodinger flow is the Hamiltonian flow of minus twice the expectation of H
      (schrodingerField_isHamiltonianVectorField); the torus is the diagonal case.
    term: Moment map
    status: standard-mathematics
    source: curated
    external:
      - text: "Wikipedia: moment map"
        url: https://en.wikipedia.org/wiki/Moment_map
      - text: "Atiyah, Convexity and commuting Hamiltonians, Bull. LMS 1982"
        url: https://doi.org/10.1112/blms/14.1.1
    related: [kahler-form, duistermaat-heckman, poisson-bracket, fubini-study-measure, liouville-measure]

  - slug: lf1-main-theorem
    reviewed: 2026-08-25
    hook: >
      In a deterministic world with repeated preparations, the frequencies you observe
      converge to volume ratios with probability one, and the theorem is machine-checked
      with no randomness anywhere in the dynamics.
    layman: >
      Any account that says probability is volume owes one non-negotiable theorem. Run
      the experiment over and over, and the fraction of runs that give a particular
      outcome must actually approach the volume assigned to that outcome. Without that
      bridge, "probability is volume" is a metaphor. This theorem is that bridge,
      formalised, and it is the foundation stone of the corpus.

      The setting is simple. The world evolves deterministically. Each run of the
      experiment draws a fresh complete world-state from the preparation region, the set
      of world-states compatible with the preparation procedure. A given outcome happens
      when the drawn world-state sits in the region of the arena belonging to that
      outcome. The theorem says that, with probability one over the sequence of draws, the
      running frequency of the outcome converges to the region's share of the preparation
      region's volume. Probability one means that the exceptional sequences of draws
      together have weight zero.

      The proof engine is the strong law of large numbers, the same theorem that keeps
      casinos solvent, applied to indicator variables: quantities that equal one when a
      run gives the outcome and zero otherwise, and which the deterministic evolution
      defines. Chance lives entirely in the sampling; the physics never rolls dice.
    in_csd: >
      Every empirical claim in the corpus stands on this layer. The higher layers change
      what the regions are, from regions of the space of quantum states to regions sized
      by the Born weights to basins fixed by a measurement context, but the conversion
      from frequency to volume is always this theorem, applied through the layer's
      interface.

      The design is deliberately spare. The theorem handles one outcome region at a time,
      and statements about several outcomes at once are assembled by intersecting the
      corresponding probability-one events. The only hypothesis left to the caller is
      pairwise independence of the trial indicators. Integrability of the indicators,
      meaning that their averages are well defined, and identical distribution across
      trials are proved internally.
    mathematical: >
      LF1_main_theorem_ae (CsdLean4/LF1/MainTheorem.lean): for a trial model over an ontic
      setup and an outcome region O, the empirical frequencies of O converge almost surely
      to O's volume weight under the conditioned Liouville measure.

      The chain behind it, the conditional preparation measure, pullback events, indicator
      integrability and identical distribution, is exported as reusable infrastructure,
      and the whole layer carries no axioms beyond Lean's foundational three.
    term: LF1 main theorem
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF1/MainTheorem.lean
      theorem: LF1_main_theorem_ae
    related: [born-weight, typicality, witness-and-engine, born-volume-ratio, what-is-machine-checked]

  - slug: born-volume-ratio
    reviewed: 2026-08-25
    hook: >
      In every finite dimension the Born weight of an outcome equals a ratio of volumes in
      the space of quantum states, for every outcome and every state, with no genericity
      condition attached.
    layman: >
      Showing that probability equals volume for one contrived example proves little. The
      claim earns its keep only at full strength: every dimension, every state, every
      outcome, no fine print. The Born volume ratio is the full-strength version, and it
      is the theorem that turns the volume story from an illustration into a derivation.

      Take a quantum state in any finite dimension, that is, a system with any finite
      number of possible outcomes. Its Born weight for a given outcome, the number the
      textbook computes by squaring the size of that outcome's contribution to the state,
      equals the volume of an explicitly described region of the space of quantum states
      divided by the volume of the whole space. The volume is measured with the
      Fubini-Study measure, the natural notion of size on that space, the one that
      respects its symmetry. The equality is exact rather than approximate, and it holds
      for every state, including states in which some outcomes have zero weight.

      The regions are barycentric cells over the probability simplex. The simplex is the
      set of all possible lists of outcome probabilities, a triangle when there are three
      outcomes, a tetrahedron when there are four, and so on; a state's own list of
      probabilities is a point of it, and that point cuts the simplex into one cell per
      outcome. Nobody carved the cells to fit. Their sizes come out of the geometry.
    in_csd: >
      This is the derived side of the carving line in every finite dimension: the theorem
      that turned the volume story from realisation into derivation. The route runs
      through the moment map, which reads the Born weights off the geometry, and the
      Duistermaat-Heckman law, which says that pushing the symmetric measure on the state
      space forward through the moment map gives the flat law on the simplex. The volume
      of a cell is therefore an honest integral over the simplex, computed once and equal
      to the Born weight.

      Downstream, the frequency companion turns the identity into an empirical statement:
      independent draws from the Fubini-Study measure give observed frequencies that
      converge jointly to the full vector of Born weights.
    mathematical: >
      fs_born_volume_ratio_N and its apex variant, in the unconditional form
      fs_born_volume_ratio_N_uncond (CsdLean4/LF4/BornRegionUncond.lean): the Born weight
      of each of the N coordinates equals the Fubini-Study volume ratio of the
      corresponding barycentric region, unconditional in the preparation.

      The proof composes the Gaussian representation of the Fubini-Study measure, the
      product-index bridge to exponential laws, and the joint Dirichlet pushforward; the
      earlier positivity hypothesis was retired by a per-cell dichotomy on closed simplex
      faces.
    term: Born volume ratio
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF4/BornRegionUncond.lean
      theorem: fs_born_volume_ratio_N_uncond
    related: [born-weight, typicality-volume, fubini-study-measure, lf1-main-theorem, naimark-dilation]

  - slug: measurement-flow
    reviewed: 2026-08-25
    hook: >
      A deterministic, volume-preserving flow carries out a measurement, and the volumes
      of its pointer blocks are the Born weights, for every preparation.
    layman: >
      Saying that measurement is de-isolation dynamics is a picture, and the picture
      carries a debt: exhibit actual dynamics, one deterministic map that respects the
      arena's volume, couples a system to a pointer, and sorts trajectories into outcome
      blocks of the right sizes. The measurement flow is the theorem that pays that debt.

      The flow exists, it preserves volume, and it is provably not the identity, so it
      genuinely does something. After it runs, the arena decomposes into pointer blocks,
      one per outcome: regions of starting points that end with the pointer showing that
      outcome. The volume of each block is exactly the Born weight of its outcome. Repeat
      the preparation many times and the fraction of runs landing in each block converges
      to that weight, with probability one.

      There is no collapse anywhere. There is one deterministic map, run once per trial,
      plus ignorance of the starting point.
    in_csd: >
      This is the tier of the corpus that realises von Neumann's measurement scheme
      dynamically. In that scheme a measurement is an ordinary evolution of a larger
      system, obtained by adjoining a pointer to the system measured, an enlargement
      called a dilation. The dilation that abstract measurement theory cites is here an
      actual flow on the enlarged arena, and that closes the gap between the volume
      results, which are purely kinematic, and the de-isolation picture. The outcome map
      for each individual starting point, saying which block a given microstate lands in,
      is delivered by the theorems that partition the arena into pointer blocks. That
      discharges a debt the corpus had carried explicitly: the need for an outcome
      function assigning a result to each microstate.

      Its boundary is equally explicit. The flow realises measurement dynamics at the
      level of the space of quantum states. Whether a physical de-isolation interaction
      generates a pointer whose readings carry the Born measures on the ontic fibre is the
      open question that remains; the earlier form of that question, deriving the fibre
      mechanism from a mixing flow, was retired as mis-specified, as the fibre entry
      explains.

      Seen from the system alone, the measurement flow is a channel. Trace out the pointer
      after the flow has acted on a preparation that starts with the pointer ready, and the
      system's density operator is the de-isolation channel applied to its density operator
      before the measurement: the operator is kept on the pointer basis and its coherences
      between different pointer readings are removed. No representative of the rays has to be
      chosen for this to hold, because the corpus supplies a canonical measurable one. The
      channel keeps entropy from decreasing, and the amount of classical information it
      transmits is exactly one bit per qubit, the pointer bit and nothing else.
    mathematical: >
      measurement_flow_born_frequency (LF5 capstone, CsdLean4/LF5/Capstone.lean): the
      de-isolation flow is Fubini-Study measure-preserving with pointer-block volumes
      equal to the Born weights, and empirical block frequencies converge almost surely,
      for every unit preparation. The earlier genericity hypothesis was retired by the
      unconditional volume engine.

      The disjointness of the pointer blocks and the outcome map per microstate are
      separate, reusable theorems.

      measurementFlow_traceRight_barycenter_unitSection (LF6/MeasurementFlowChannel.lean): the
      environment marginal of the flowed barycentre is deisolationChannel applied to the
      system's barycentre, with Projectivization.unitSection as the representative, so no
      section hypothesis remains. deisolationChannel_apply_eq_pinch identifies the channel's
      action with the pinching of Thermo/SecondLaw.lean, deisolationChannel_holevoCapacity
      (LF6/DeisolationCapacity.lean) gives log 2 as the greatest element of its single-letter
      Holevo range, and measurementFlow_vonNeumannEntropy_le is the entropy statement.
    term: Measurement flow
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF5/Capstone.lean
      theorem: measurement_flow_born_frequency
    related: [de-isolation, stinespring-dilation, pointer-basis, holevo-bound, naimark-dilation]
  - slug: singlet-contextual-model
    reviewed: 2026-09-12
    hook: >
      One machine-checked theorem settles both halves of the Bell question: an
      explicit model in which outcomes depend on the measurement context
      reproduces the singlet pair's statistics in full, and no assignment that
      ignores the context can.
    layman: >
      When two particles are prepared together in the state physicists call the
      singlet and then separated, measurements on them show correlations that
      no theory can reproduce if it assumes that each particle carries, in
      advance, a fixed answer to every possible measurement, and that the answer
      at one particle does not depend on what is measured at the other. That
      impossibility result is Bell's theorem, and it is the central obstacle for
      any programme, CSD included, that wants a deterministic account underneath
      quantum mechanics.

      Such a programme has two questions to answer, not one. The first is
      whether it can escape Bell's theorem at all. The usual escape is
      contextuality: the outcome a particle gives depends on the measurement
      context, the full set of measurements being performed, and not only on the
      particle's own hidden state. The second question is harder: can a
      contextual model deliver the exact numbers that quantum mechanics
      predicts? It is easy to be contextual and hard to be contextual and
      correct, and most discussions stop at the first question.

      This entry records a single theorem, checked by a proof assistant, that
      answers both. The existence half exhibits an explicit model, with a shared
      dependence on context, that reproduces the singlet's complete outcome
      table at every measurement setting: the marginals, meaning the frequency
      of each outcome on one side considered alone, and the correlations,
      meaning how often the two sides agree. The obstruction half shows that no
      global, context-independent assignment of outcomes is compatible with
      that same table. Claiming to evade Bell is cheap talk until the model is
      on the table; here it is on the table, with both directions checked.
    in_csd: >
      The model is built from CSD's own arena, the concrete Kahler instance of
      the framework together with the weighting it carries on the fibre, the
      hidden coordinates attached to each visible state. Each measurement
      context has its own rule for reading an outcome off the arena, obtained
      by dividing the fibre into arcs, and the outcomes are weighted by the
      singlet's own kernel, the weighting function that the singlet state
      supplies. Contextuality here is not a defect being excused; it is the
      mechanism doing the work.

      Companion results locate the contextuality precisely and answer the
      natural suspicion. The model's two wings provably cannot be made local to
      their own settings, so the dependence on context is genuine rather than
      an artefact of presentation, and the operational no-signalling conditions,
      which require that nothing done on one wing changes the statistics seen
      on the other, are proved for the model rather than assumed.

      The pair of results, existence together with obstruction, is the
      citation anchor for the programme's Bell analysis.
    mathematical: >
      The capstone theorem c1_singlet_contextual_capstone states that a
      measurable shared-context family reproduces the full singlet table
      (marginals one-half, correlations minus the dot product) at every
      context, and that no global assignment is compatible with it.

      Scope, carried over from the obstruction and stated in the theorem's own
      docstring: the table half holds at every context, but the incompatibility
      half constrains only the four CHSH settings, and this capstone does not
      subsume the separate product-partition result.

      Supporting theorems prove the model's remote marginal invariance, with
      measurement independence named as a premise rather than smuggled in, and
      the model's non-product character. The general obstruction is retained
      as a separate ledger row; the two are designed to be read together.
    term: Singlet contextual model
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: c1_singlet_contextual_capstone
    related: [bell-chsh, contextuality, no-signalling, hidden-variables, does-csd-violate-bell]

  - slug: no-signalling
    reviewed: 2026-09-12
    hook: >
      Nothing done to the far wing of an entangled pair changes the statistics
      seen at the near wing, and CSD proves this exactly, for every state,
      entangled ones included.
    layman: >
      Entangled particles are pairs prepared together so that measurements on
      them show correlations that no local account explains. The first thing
      every newcomer asks is whether those correlations let someone send a
      message faster than light: whether a choice made at one particle can be
      read off at the other. Quantum mechanics says no, and the principle has a
      name, no-signalling. A programme that reconstructs quantum mechanics
      should say no as a theorem rather than as an apology.

      In CSD it is a theorem, twice over. The first version is about composite
      arenas, the state spaces CSD assigns to two systems considered together.
      Disturb one part however you like, by any operation confined to that
      part, and every measurable quantity of the other part keeps exactly the
      same value. Not approximately: the change cancels identically. The second
      version is about the Bell model. The explicit contextual model that
      reproduces the singlet statistics has remote marginals, the outcome
      frequencies seen on one side alone, that provably do not depend on what is
      done to the other side.

      Correlation without signalling is therefore not a tension to be managed.
      It follows from what an operation confined to one part can and cannot
      touch.
    in_csd: >
      In CSD, no-signalling is a fact about where operations act, not a
      constraint placed on probabilities by hand. An operation on the
      right-hand part of a composite arena is built from the right-hand modes
      only (a mode is one of the elementary degrees of freedom from which the
      arena is assembled), and every observable of the left-hand part is built
      from the left-hand modes only. The two act independently of each other,
      so applying the operation and then reading the left-hand observable gives
      the same answer as reading it alone. Because the argument never mentions
      which state the composite is in, it holds for every state, entangled
      states included.

      The version for the Bell model matters separately. Contextual models, in
      which outcomes depend on the measurement context, are exactly the kind of
      model that critics suspect of hidden signalling, so the corpus proves the
      operational no-signalling conditions for its exhibited model rather than
      gesturing at them.
    mathematical: >
      The theorem composite_no_signalling states that on the composite field
      arena, conjugating by any unitary supported on one sector leaves every
      observable of the other sector's subalgebra exactly invariant, for every
      composite state: the kick commutes past every observable supported on
      the other sector.

      The contextual-model version proves remote marginal invariance for both
      wings, with one shared measure across contexts, which is measurement
      independence stated in-module. Both results are foundational-triple-only.
    term: No-signalling
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/CompositeArena.lean
      theorem: composite_no_signalling
    related: [singlet-contextual-model, bell-not-join, isolation, field-arena, tsirelson-bound]

  - slug: bell-not-join
    reviewed: 2026-09-12
    hook: >
      The arena CSD assigns to two systems together is strictly larger than the
      two arenas simply paired, and the Bell state is a point of the excess:
      entanglement located exactly.
    layman: >
      The saying that entanglement means the whole is more than its parts is
      repeated so often that it has stopped meaning anything. It deserves to be
      made into a theorem with real content, a precise inventory of what the
      whole contains that the parts do not.

      In the arena picture, where CSD describes each system by a geometric
      space of possible configurations called its arena, combining two systems
      offers two candidate constructions. The first is mere pairing: every
      joint configuration is a configuration of the left system together with a
      configuration of the right one, and nothing more. The second is the
      genuine composite arena that the theory demands. The theorem says that
      the Bell state, the most famous entangled state in quantum mechanics,
      lives in the composite arena and is provably not any pairing. No choice
      of a left configuration and a right configuration jointly produces it.

      That is entanglement as an address: a strict gap between the paired
      construction and the composite one, with the Bell state exhibited inside
      the gap.
    in_csd: >
      The composite arena is built by concatenating the modes, the elementary
      degrees of freedom, of the two components, and the pairing of two
      component points is given by a standard construction, the Segre
      construction, which is the arena-level counterpart of the tensor product
      by which quantum mechanics combines systems. The theorem is the
      arena-side signature of the difference between combining by tensor
      product and combining by simple pairing: the composite strictly exceeds
      the image of the pairing map, and the Bell state witnesses it.

      What the excess does has its own answer. An observer with access to one
      side of the Bell state alone sees its reduced state, and that reduced
      state is the maximally mixed ensemble on the correlated patterns: equal
      weight on each possibility, with no information about which one holds.
      Entanglement is therefore exactly what turns the weights a local context
      assigns to a definite state into the weights of a statistical mixture,
      while the labels of the remote pattern drop out entirely.
    mathematical: >
      The theorem bell_not_join states that the Bell ray over distinct
      correlated configuration pairs is not in the image of the arena join.

      Companion results show that the join factorises densities as Kronecker
      products, with exact marginals and with joint expectations of product
      observables factoring on joins. That is a property of product states,
      held by every local composite, and is not local tomography, which is
      RecordLocallyTomographic in SigmaLayer/TensorTomography.lean. The
      composite algebras are generated by the mode-local subalgebras, with the
      reconstruction theorem consumed arena-natively.

      The reduced density of the Bell ray is the equal mixture with local
      weights exactly one-half.
    term: Bell state is not a join
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/CompositeArena.lean
      theorem: bell_not_join
    related: [no-signalling, field-arena, peres-criterion, kronecker-product, hong-ou-mandel]

  - slug: lieb-robinson-bound
    reviewed: 2026-09-12
    hook: >
      Even without relativity, influence in a quantum system with local
      interactions has a speed limit, and on CSD's finite field arena that limit
      is a theorem with the velocity written out.
    layman: >
      Nothing in ordinary, non-relativistic quantum mechanics obviously forbids
      an effect here from showing up arbitrarily fast over there. Yet matter
      behaves locally. In 1972 Lieb and Robinson proved that systems built from
      many pieces on a lattice, each interacting only with its neighbours,
      enforce their own speed limit. There is an effective velocity, and
      outside the cone it defines, the region that a signal travelling at that
      velocity could reach, influence is not merely weak but exponentially
      small in the distance.

      CSD's field arena is a finite version of such a system: a finite
      collection of modes, the elementary degrees of freedom, linked by a
      coupling graph in which an edge joins two modes that interact directly.
      The corpus proves the finite-arena version of the bound from scratch, in
      stages that mirror the physics. An operation and a distant observable
      have no effect on each other at all until enough steps of interaction
      have passed to bridge the graph distance between them, the smallest
      number of edges connecting them. Beyond that point the leading term of
      the influence, measured by what mathematicians call the commutator, the
      difference made by the order in which two operations are applied, decays
      like a power. A factorial strengthening then makes the bound decay at
      every time. Finally the closing form extracts an explicit velocity:
      outside the cone it sets, the commutator is suppressed by an exponential
      in the distance.

      The result is a light cone earned from the structure of the couplings
      alone.
    in_csd: >
      The bound is load-bearing rather than decorative: it is the mechanism
      behind the programme's account of locality on the field arena. The
      record layer, CSD's account of how measurement outcomes are written into
      the arena, runs the bound through a bridge to the arena with its fibre
      attached. A record cell in the fibre can be steered from outside the cone
      by no more than a bound that collapses factorially with distance, which
      is what makes records stable against distant meddling by theorem rather
      than by hope.

      The scope is stated plainly. The velocity obtained is a bound, not the
      best possible one; the setting is a finite graph of modes, not a
      continuum; and the corpus explicitly does not identify this dynamical
      cone with the kinematic light rays of its dispersion analysis.
    mathematical: >
      The proof runs as a chain. Nested commutators of edge-supported
      generators stay in the coupling graph's k-ball and vanish exactly below
      the graph distance; the flow remainder obeys a factorial estimate via an
      integral bound.

      Hence the commutator of a time-evolved observable A and a static
      observable B at graph distance d is bounded by
      2 norm(A) norm(B) (2 norm(S) t)^d / d!, and the closing theorem
      norm_commutator_velocity_le gives, for v t <= d with v = 2 e^2 norm(S),
      the bound 2 norm(A) norm(B) e^(-d).
    person: >
      Elliott Lieb was born in 1932. An American mathematical physicist at
      Princeton, he has attached his name to an improbable number of sharp
      inequalities across analysis and quantum theory. Derek Robinson
      (1935-2021) was a British-Australian mathematical physicist, long at the
      Australian National University, and co-author of the standard
      operator-algebra treatment of quantum statistical mechanics. Their 1972
      paper in Communications in Mathematical Physics proved the group velocity
      bound for lattice spin systems; it waited three decades for its
      renaissance and then became the workhorse of the locality estimates of
      quantum information theory.
    term: Lieb-Robinson bound
    eponyms: [Lieb, Robinson]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/LiebRobinson.lean
      theorem: norm_commutator_velocity_le
    related: [field-arena, record-light-cone, interaction-price, isolation, wick-theorem]

  - slug: wick-theorem
    reviewed: 2026-09-12
    hook: >
      The bookkeeping rule at the heart of quantum field theory, which reduces
      any correlation of field operators to a sum over pairings, survives a
      finite cutoff exactly, and the threshold at which it fails is part of the
      theorem.
    layman: >
      Quantum field theory computes almost everything from one bookkeeping
      rule. A correlation function is the average of a product of several
      field operators, quantities such as the value of the field at chosen
      places and times. Wick's theorem says that any such average reduces to a
      sum over the ways of pairing the operators up, with each pair
      contributing one basic building block, the propagator, which is the
      correlation between just two of them. The rule is usually proved with an
      infinite ladder of energy levels available for every mode of the field.

      A finite arena must cut that ladder off at some number of quanta, the
      units of excitation, per mode. The question then becomes quantitative:
      does the pairing formula survive, and where exactly does it break? The
      corpus's answer is that it survives word for word below an explicit
      threshold, and that at the threshold it fails by a computed amount. The
      reason is combinatorial. A correlation of a given order is a sum over
      walks up and down the ladder that return to where they started, and a
      walk with a fixed number of steps can climb only so far, so it never
      reaches the missing rungs until the order is large enough to get there.

      An approximation with an error bar is replaced by exactness with a
      boundary.
    in_csd: >
      This is the field track, the part of the programme that treats CSD's
      arena as a finite quantum field, at its most textbook. Four-point
      functions at equal and at distinct times close into the pairing sum; the
      two-time kernel carries the time dependence; and the full moment ladder,
      the double-factorial law for arbitrary even powers of a field mode (a
      double factorial is the product of every second whole number), is proved
      by a recursion in which the defect caused by the cutoff is eliminated by
      the walk argument rather than ignored.

      The boundary is stated plainly. The one-shot sum-over-matchings formula
      for arbitrary interleaved products of operators is not claimed; the
      double-factorial law carries that content on the mode diagonal, the case
      of repeated powers of a single mode.
    mathematical: >
      The theorem timeFourPoint_wick states that the distinct-times four-point
      function equals the pairing sum of two-time kernels over every mode
      pattern, for cutoffs above two.

      The moment ladder states that the vacuum expectation of Q to the 2n is
      (2n-1) double factorial times one-half to the n, exactly, for n below
      the cutoff, via the recursion against the truncated commutation relation;
      odd moments vanish by walk parity, and grouped mode patterns factorise
      by clustering.
    person: >
      Gian Carlo Wick (1909-1992) was born in Turin, worked alongside Fermi in
      Rome in the 1930s, and after the war held positions at Berkeley, which he
      left rather than sign the loyalty oath, then at Carnegie Tech, Brookhaven
      and Columbia. The 1950 theorem on evaluating products of field operators,
      published in the Physical Review, systematised the calculations of the
      newly renormalised quantum electrodynamics and has been the daily tool
      of the subject ever since.
    term: Wick's theorem
    eponyms: [Wick]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/Wick.lean
      theorem: timeFourPoint_wick
    related: [field-arena, kms-condition, no-exact-finite-ccr, lieb-robinson-bound, gibbs-state]

  - slug: kms-condition
    reviewed: 2026-09-12
    hook: >
      The algebraic signature of thermal equilibrium holds exactly on CSD's
      finite field arena, and cooling the thermal state all the way down
      recovers the vacuum.
    layman: >
      What makes a state thermal? Everyday talk of temperature leans on
      infinite systems, heat baths and limits. The Kubo-Martin-Schwinger, or
      KMS, condition is the sharp answer that mathematical physicists settled
      on. It concerns correlation functions, the averages obtained by measuring
      one observable now and another one later. The formula for evolving an
      observable in time continues to make sense when the elapsed time is
      replaced by an imaginary number, and the KMS condition uses exactly that:
      a state is in equilibrium at a given temperature precisely when shifting
      one of the two observables forward by an imaginary time fixed by the
      inverse temperature gives the same correlation as swapping the order of
      the pair.

      On the finite field arena this is neither an axiom nor a limit. The
      Boltzmann state, the standard thermal state in which each energy level
      is weighted by a factor that falls off exponentially with its energy
      divided by the temperature, satisfies the KMS symmetry exactly at the
      cutoff, by computation. Cool it all the way down and the thermal
      two-point function, the correlation between two field operators,
      converges to the vacuum one, with the zero-point contributions cancelling
      on the way.

      This is thermal physics at finite resolution, with no hand-waving about
      baths.
    in_csd: >
      The thermal tier joins the programme's thermodynamics track to its field
      track. The thermal state is the Gibbs state of the field Hamiltonian, the
      energy function of the arena; the partition function, the normalising sum
      over energy levels, factorises across modes; and the edge at which the
      propagator is truncated is explicit rather than hidden, the same candour
      about the cutoff that the Wick tier maintains.

      The scope is labelled as breadth: equilibrium structure on the isolated
      finite piece, not a claim about continuum thermodynamics.
    mathematical: >
      The theorem thermal_kms states that for the diagonal field Hamiltonian at
      cutoff, the thermal two-point function satisfies the exact KMS identity,
      with complex-time evolution entrywise and the identity reducing to
      Boltzmann-weight transport and an index shuffle.

      Companion results give closed-form diagonal Boltzmann weights via the
      continuous functional calculus, mode marginals, the off-diagonal
      vanishing, and the beta-to-infinity vacuum limit recovering the free
      propagator with no residue.
    person: >
      Ryogo Kubo (1920-1995), at Tokyo, built the linear-response formalism of
      statistical mechanics; Paul Martin (1931-2016), at Harvard, and Julian
      Schwinger (1918-1994) wrote the 1959 paper whose boundary condition
      carried the same content. It was Haag, Hugenholtz and Winnink who in 1967
      recognised the shared condition as the definition of equilibrium for
      infinite systems and attached the three initials to it.
    term: KMS condition
    eponyms: [Kubo, Martin, Schwinger]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/ThermalPropagator.lean
      theorem: thermal_kms
    related: [gibbs-state, wick-theorem, canonical-typicality, field-arena, landauer-principle]

  - slug: lindblad-equation
    reviewed: 2026-09-12
    hook: >
      The master equation of open quantum systems is formalised end to end: the
      evolution generated by every Lindblad generator is proved to be completely
      positive, with the bystander-system argument carried out rather than
      gestured at.
    layman: >
      Real systems leak. They lose the delicate coordination between the
      components of their state, they decay, and they decohere, because none
      of them is perfectly isolated. The equation that governs the density
      matrix of an open quantum system, the description of a system whose
      state is known only statistically, is the Lindblad equation. Its
      defining virtue is that it should generate legitimate physics at every
      time: probabilities stay probabilities, even when the system is
      entangled with a bystander that the equation never mentions.

      That virtue is called complete positivity, and it is precisely what is
      delicate to prove, because the evolution is the exponential of a
      generator with competing parts. The corpus proves it from first
      principles. Split the generator into a drift part, whose evolution is a
      change of frame, and a jump part, whose exponential is a series with
      only positive terms. Reassemble the two with the Lie-Trotter product
      formula, proved for the purpose. Then show that the evolution of the
      generator enlarged by a bystander is literally the original evolution
      acting alongside the bystander left untouched, so that positivity of the
      enlarged evolution is complete positivity in so many words.

      A staple of every open-systems textbook, with a proof checked by a proof
      assistant.
    in_csd: >
      The open-system tier is where the programme prices imperfect isolation.
      The dephasing and amplitude-damping semigroups it exhibits, families of
      evolutions indexed by elapsed time that describe loss of coherence and
      loss of energy, are Lindblad flows, and the general theorem certifies
      that every such flow, for any Hamiltonian and any set of jump operators,
      the terms describing the leaks, is a legitimate quantum channel at every
      nonnegative time.

      The supporting product formula was deliberately proved in a generality
      suitable for contribution to Mathlib. An earlier label in the corpus
      classed exponentiated positivity as out of reach; that label was retired
      when the assessment was re-checked and the route was found to lie
      entirely within the corpus.
    mathematical: >
      The theorem lindbladSemigroup_completelyPositive states that for
      Hermitian H, jump family L, t >= 0 and every finite ancilla, the
      identity-tensor amplification of the flow maps positive semidefinite
      matrices to positive semidefinite matrices.

      The route is as follows. The drift flow is conjugation by a matrix
      exponential; the jump exponential is a positive Kraus series with
      positivity closed under limits; the general Lie-Trotter formula
      assembles the flow; and the blockwise identification of the amplified
      generator's flow with id-tensor-Phi makes the amplified statement
      literally complete positivity.
    person: >
      Goran Lindblad (1940-2022) was a Swedish mathematical physicist at the
      Royal Institute of Technology in Stockholm. His 1976 paper on generators
      of quantum dynamical semigroups gave the general form of the equation;
      Gorini, Kossakowski and Sudarshan published the finite-dimensional
      classification in the same year, which is why careful writers say GKSL.
      By the standards of a result used daily across quantum optics and
      quantum information, its authors are remarkably rarely read.
    term: Lindblad equation
    eponyms: [Lindblad]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF6/LindbladPositivity.lean
      theorem: lindbladSemigroup_completelyPositive
    related: [quantum-channel, lie-trotter-formula, de-isolation, choi-theorem, schrodinger-equation]

  - slug: lie-trotter-formula
    reviewed: 2026-08-25
    hook: >
      Alternate many tiny steps of two operations that do not commute and the
      result converges to the exponential of their sum, with an error that
      shrinks like one over the number of steps. CSD proves this in textbook
      generality, in a form ready for the Mathlib library, because its
      open-systems tier needed it and nothing on the shelf existed.
    layman: >
      For ordinary numbers, the exponential of a sum is the product of the
      exponentials. For operations that do not commute, meaning that the
      result depends on the order in which they are applied, this fails, and
      in quantum mechanics, where evolution over a stretch of time is the
      exponential of an energy generator, the interesting pieces of the
      generator never commute.

      The Lie-Trotter formula is the repair. Alternate many tiny steps of each
      piece, and in the limit of ever smaller steps you recover the
      exponential of the sum exactly. Physicists use this daily; it is the
      licence behind every quantum simulation, in which a complicated
      evolution is approximated by a sequence of simple ones.

      The corpus needed the formula in a form its libraries did not have: for
      operators acting on the space of matrices, as the generator of an
      open-system evolution does, with a quantitative error, and without
      special structural assumptions on the pieces. So it was proved from
      scratch at textbook generality: for any complete normed algebra, a
      setting in which elements can be added, multiplied and measured for size
      and in which limits exist, with an explicit rate of convergence. The
      defect of a single step is controlled by an estimate on the tail of a
      series, and the defects are added up without growth.
    in_csd: >
      The formula is the assembly step in the proof that the Lindblad flow is
      completely positive. The drift part and the jump part of the generator
      separately generate evolutions that preserve positivity, and the product
      formula is what lets their alternation converge to the full evolution, so
      that positivity passes to the limit.

      It is staged as a candidate for contribution to Mathlib, free of
      anything CSD-specific by construction: the kind of infrastructure that
      the formalisation deliberately leaves better than it found it.
    mathematical: >
      The theorem NormedSpace.trotter_product states that in a complete normed
      real algebra with unit norm one, the n-fold alternating product of
      exp(A/n) and exp(B/n) converges to exp(A+B), with a one-step defect of
      order one over n squared, telescoped to an overall rate with the explicit
      constant s^2 (3 + s) e^(2s) over n for s the sum of the norms.

      The earlier staged version required skew-adjointness; the de-skewed form
      replaces the two places skewness entered by norm bounds that the final
      constant absorbs.
    person: >
      Hale Trotter (1931-2022) was a Canadian-American mathematician at
      Princeton; the 1959 product formula came out of his thesis work on
      semigroups of operators. The finite-dimensional antecedent is Sophus
      Lie's, from the nineteenth-century theory of continuous groups, which is
      why the formula carries both names, and Masuo Suzuki's later
      higher-order refinements are why simulation people say Trotter-Suzuki.
    term: Lie-Trotter product formula
    eponyms: [Trotter]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Mathlib/Analysis/NormedSpace/TrotterGeneral.lean
      theorem: trotter_product
    related: [lindblad-equation, stone-theorem, schrodinger-equation, what-is-machine-checked, quantum-channel]

  - slug: choi-theorem
    reviewed: 2026-09-12
    hook: >
      A transformation of quantum states is physically allowed exactly when one
      matrix built from it passes a single positivity test. CSD proves both
      directions, so whether a map is physical becomes a decidable question of
      linear algebra.
    layman: >
      Which transformations of a quantum state are physically allowed? The
      abstract answer is the completely positive, trace-preserving maps.
      Trace-preserving means that total probability is conserved. Completely
      positive means that probabilities stay nonnegative not only for the
      system itself but for the system together with any bystander system it
      might be entangled with. That last clause quantifies over every possible
      bystander, which is not something you can check by computation.

      Choi's insight of 1975 collapses the quantifier. Encode the whole map into
      a single matrix by feeding it one half of a maximally entangled pair, a
      pair of systems whose joint state is as correlated as quantum mechanics
      allows. The map is legitimate precisely when that one matrix is positive
      semidefinite, meaning that it has no negative eigenvalues, which is the
      matrix analogue of a number being nonnegative. An infinite family of
      conditions becomes one eigenvalue check.

      The corpus proves both directions. Every channel written in Kraus form,
      as a family of simpler operators applied and summed, has a positive Choi
      matrix, and every positive semidefinite matrix on the combined system
      arises from some Kraus family. The equivalence is the theorem.
    in_csd: >
      Choi's theorem is the workhorse of the corpus's channel layer. The
      positivity witnesses at the generator level in the open-system results,
      the channel constructions of the coarse-graining tier, and the arguments
      about the jump part in the proof that the Lindblad flow is completely
      positive all route through Kraus decompositions certified by it.

      It sits on the operational stratum, standard quantum information
      formalised because the programme's claims lean on it, and the
      construction is fully explicit: the converse direction actually builds
      the Kraus family from the spectral decomposition of the Choi matrix.
    mathematical: >
      The theorem choi_iff_posSemidef states that a matrix on the composite
      index is the Choi matrix of some Kraus family if and only if it is
      positive semidefinite.

      The forward direction is the rank-one decomposition of the Choi matrix
      into outer products of vectorised Kraus operators; the converse
      reconstructs Kraus operators from a PSD matrix's spectral square roots,
      de-vectorised along the index pairing.
    person: >
      Man-Duen Choi, born in 1945 in Hong Kong, spent his career at the
      University of Toronto working in operator algebras. The 1975 paper,
      Completely positive linear maps on complex matrices, in Linear Algebra
      and its Applications, is a model of brevity, and its central object was
      independently studied by Andrzej Jamiolkowski, which is why the encoding
      is often called the Choi-Jamiolkowski isomorphism.
    term: Choi's theorem
    eponyms: [Choi]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF2/ChoiConverse.lean
      theorem: choi_iff_posSemidef
    related: [quantum-channel, stinespring-dilation, lindblad-equation, loewner-order, kronecker-product]

  - slug: quantum-channel
    reviewed: 2026-09-12
    hook: >
      The most general thing that can happen to a quantum state is captured in
      CSD as a concrete structure, a family of operators with one completeness
      law, and every certificate of its physicality is proved rather than
      assumed.
    layman: >
      Unitary evolution, the reversible evolution of the Schrodinger equation,
      is what happens to a perfectly isolated system, and nothing is perfectly
      isolated. Send a photon down a real optical cable and it attenuates,
      loses the coordination between the components of its state, and mixes
      with noise. The general description of any such process, any physically
      realisable transformation of quantum states, is called a channel.

      The structure theorem for channels says that every one of them can be
      written as a family of simpler operators, each applied to the state in
      turn with the results summed. This is the Kraus form, and it comes with
      one completeness condition on the family that guarantees that
      probabilities still add up to one afterwards.

      The corpus formalises channels in exactly that form and then proves the
      certificates: the total probability is preserved, positivity is
      preserved, so that no probability turns negative, and Choi's matrix
      criterion for complete positivity holds in both directions.
    in_csd: >
      Channels are the vocabulary of the programme's open-system and
      coarse-graining tiers. The dephasing and damping semigroups are families
      of channels indexed by time; the coarse-graining of the field arena that
      traces out modes is a channel built from an explicit isometry, a map
      that preserves lengths; and the error budget for a renormalisation step
      is stated as a distance between the outputs of two channels.

      The layer is breadth on the operational stratum, formalised to the
      corpus's usual standard: no property of a channel is used anywhere
      without a named theorem carrying it.

      Since the constraint surface carries both the system and its environment, the channels
      the programme reasons about are not introduced by hand. A volume-preserving flow on the
      surface that lifts a unitary on the joint state space acts on a preparation, and the
      density operator of the flowed preparation, seen from the system alone, is a channel
      applied to the density operator of the original preparation. The channel is the
      environment's marginal of the flow. The measurement flow produces the de-isolation
      channel in this way, and the bit-flip errors of the three-qubit code are produced by a
      flow on the register together with a four-level environment. The corpus keeps two
      spellings of the notion, an indexed Kraus family in the operational layer and the staged
      Mathlib structure, and proves them equivalent, with actions, dilations and compositions
      agreeing.
    mathematical: >
      QuantumChannel is an indexed Kraus family with the completeness law
      summing adjoint-products to the identity; apply is the Kraus sum.

      The proved properties are trace preservation, PSD preservation,
      unitality criteria, and choiMatrix_posSemidef, the easy direction of
      Choi, with the converse in the companion module closing the
      equivalence. Composition and the dilation-side constructions live where
      their consumers need them.

      The bridge channelEquiv (LF2/ChannelBridge.lean) is an equivalence between
      QuantumChannel and the staged Channel, with the action, the unitary channels, the
      Stinespring dilations and the composition Channel.comp
      (Mathlib/QuantumInfo/ChannelComp.lean) transported. Channels from flows:
      traceRight_barycenter_flow (LF2/FlowChannel.lean) states that for a flow lifting a
      unitary on system times environment, and a preparation that is a product with the
      environment ready, the reduced barycentre of the flowed preparation equals
      stinespringChannel applied to the system's barycentre; stinespringChannelMixed covers a
      mixed environment through its spectral Kraus family. Instances:
      measurementFlow_traceRight_barycenter_unitSection (LF6/MeasurementFlowChannel.lean),
      bitFlipFlow_traceRight_barycenter and registerFlow_traceRight_barycenter
      (Empirical/CSD/QEC/).
    term: Quantum channel
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF2/QuantumChannel.lean
      theorem: choiMatrix_posSemidef
    related: [stinespring-dilation, choi-theorem, partial-trace, de-isolation, holevo-bound]

  - slug: record-light-cone
    reviewed: 2026-09-12
    hook: >
      Records are safe from distant meddling by theorem: anything that happens
      outside the light cone can shift the outcome written into the arena's
      fibre by no more than a bound that collapses factorially with distance.
    layman: >
      CSD holds that measurement outcomes are written into a hidden part of
      the arena called the fibre, an extra set of coordinates attached to
      every point of the visible state space. A sceptic should ask how robust
      the writing is. Could a distant disturbance, some operation performed far
      from the apparatus, reach in and rewrite the record? If it could, records
      would be too fragile to ground anything.

      The answer is a locality theorem aimed exactly at that worry. Take a
      record written into the fibre by a local interaction. Take any
      disturbance confined to a region far away, with distance measured by the
      number of interaction links separating it from the apparatus, and let
      everything evolve. The theorem bounds how far the record cell can move by
      a quantity that decays factorially in that distance, the same light-cone
      suppression that the Lieb-Robinson bound provides for ordinary
      observables.

      Distant meddling does not slightly corrupt records. It fails to reach
      them, by a margin that shrinks factorially with the distance.
    in_csd: >
      This is where the record layer and the field track meet. The arena with
      its fibre attached carries record strokes, shifts of the fibre controlled
      by observables of the base, the visible part of the arena, and the
      Lieb-Robinson machinery transports its light cone through a bridge into
      that setting. Disturbances that do not overlap the recording interaction
      commute with record writing exactly, meaning that the order in which they
      happen makes no difference; distant disturbances steer the written cell
      by at most the cone bound.

      The scope is stated where it is proved. The theorem covers the stroke
      shape of fibre activity, base-dependent shifts of the fibre, which is
      the corpus's own record mechanism; it does not cover arbitrary
      base-coupled fibre velocities, which nothing in the record layer needs.
    mathematical: >
      The theorem record_lightcone states that for a record stroke driven by
      an observable A and a disturbance outside distance d, the displacement
      of the recorded fibre cell after time t is bounded by the Lipschitz data
      of the stroke times 2 (2 norm(S) t)^d / d! times norm(A), the rigid part
      of the fibre rotation cancelling between the disturbed and undisturbed
      histories.

      Companion results give exact commutation of disjoint kicks with record
      writing, and the arena-level cone that the bridge transports.
    term: Record light cone
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/FibredArenaBridge.lean
      theorem: record_lightcone
    related: [lieb-robinson-bound, record-layer, field-arena, no-signalling, interaction-price]

  - slug: partial-trace
    reviewed: 2026-08-25
    hook: >
      Mathlib has no partial trace for matrices, so the corpus built one: the
      staple operation of quantum information, with its working properties
      proved and staged for contribution upstream.
    layman: >
      This is the formal-methods reader's problem more than the physicist's.
      Ignoring part of a quantum system, tracing out the environment and
      keeping a description of the subsystem, is the single most common
      operation in quantum information, and the operation that does it is
      called the partial trace. Ask what a library of formalised mathematics
      offers for it and, in the case of Mathlib, the community library for the
      Lean proof assistant, the answer at the level of matrices is nothing.

      The corpus's staging tree, its collection of general-purpose results
      written for eventual contribution to Mathlib, fills the gap. It provides
      the partial trace over either factor of a composite system, together
      with the lemmas one actually needs: linearity; preservation of the total
      trace, so that probability is conserved; preservation of positivity; the
      fact that the reduced state of a density matrix is again a density
      matrix; and the defining identities that pair a joint operator against
      observables of one side only.

      Nothing in it is specific to CSD. It is general infrastructure, built to
      be given away.
    in_csd: >
      The partial trace is load-bearing across the corpus. Reduced states in
      the decoherence and einselection tiers, the parts of the programme that
      describe how interaction with an environment singles out certain states
      as stable, marginals of the composite field arena, where local
      observations on entangled points are exactly expectations in the reduced
      state, and the subadditivity arguments of the entropy tier all consume
      it.

      A small story of library hygiene attaches. The defining reduced-trace
      identities were originally proved in the entropy module, and when the
      work on entangled weights needed them without the rest of the entropy
      machinery they were moved to sit beside the definition. The rule is that
      the defining property of an operation lives with the operation.

      On the constraint surface the partial trace is the operation that turns the joint
      description into the system's own. A preparation of system and environment together is
      flowed, its density operator on the joint space is formed, and tracing out the
      environment gives the system's density operator after the interaction. That reduced
      operator is what a channel acts on, so the partial trace is the exact point at which the
      programme's ontic flows become the operational channels of quantum information.
    mathematical: >
      partialTraceRight and partialTraceLeft on Matrix (n x m) (n x m), with
      bundled linearity; trace preservation; Kronecker reduction, the trace of
      the traced-out factor scaling the survivor; Hermiticity and positivity
      preservation via tensor witness vectors; and density-to-density.

      The reduced-trace identities Tr(M (X (x) I)) = Tr(Tr_B M X) and its
      mirror are proved alongside. All foundational-triple-only.

      Two spellings coexist: Matrix.traceRight and Matrix.traceLeft in
      Mathlib/LinearAlgebra/Matrix/PartialTrace.lean, and the QuantumInfo pair above; the
      Stinespring module uses the former. The reduced flowed barycentre is computed by
      barycenterMatrix_kronecker_of_ae (a product preparation has a Kronecker barycentre,
      almost everywhere in the representative) and traceRight_barycenter_flow
      (LF2/FlowChannel.lean).
    term: Partial trace
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/PartialTrace.lean
      theorem: partialTraceRight
    related: [stinespring-dilation, quantum-channel, entropy-subadditivity, kronecker-product, de-isolation]

  - slug: entropy-subadditivity
    reviewed: 2026-09-13
    hook: >
      The information missing from a whole never exceeds the sum of what is
      missing from its parts. That is von Neumann's subadditivity inequality,
      proved at the matrix level with the operator-logarithm step that informal
      proofs usually wave through.
    layman: >
      Entropy measures missing information: how much you do not know about the
      state of a system. For quantum systems the relevant quantity is the von
      Neumann entropy, and the basic sanity check on it is subadditivity: the
      entropy of a joint system is at most the sum of the entropies of its two
      parts. Correlations between the parts can only make the whole more
      predictable than its parts suggest, never less.

      Every textbook states the inequality, and the proof leans on two steps
      that are easy to say and laborious to formalise. The first is Klein's
      inequality, which says that relative entropy, a measure of how
      distinguishable one state is from another, is never negative; it needs a
      careful argument in terms of the eigenvalues of the two states and a
      matrix of overlaps between their eigenvectors, recording how much each
      eigenvector of one state has in common with each eigenvector of the
      other, whose rows and columns each add up to one. The second is the
      splitting of the logarithm of a tensor product, the joint operator
      formed from independent operators on the two parts, into a sum of the
      logarithms of its factors, which requires the way functions are applied
      to operators to respect the product structure, and this is exactly the
      step informal proofs wave through.

      Both steps are done, so the inequality stands on checked ground,
      including for pure entangled states: the case in which the whole has
      zero entropy while its parts do not, which is the quantum signature that
      classical entropy forbids.
    in_csd: >
      The entropy tier serves the programme's thermodynamics track and its
      accounting of decoherence. Entropy production in measurement, the
      entropy ledger of the chaos diagnostics, and the touchpoint with
      Landauer's principle all cite the von Neumann entropy machinery that
      this inequality anchors.

      Deferred pieces are named rather than hidden. The strong version,
      subadditivity with three parties, is proved conditionally on the data
      processing inequality, which is stated as an explicit hypothesis; and the
      purification construction needed for the triangle inequality is recorded
      as the missing step.
    mathematical: >
      The theorem vonNeumannEntropy_subadditive states that
      S(rho_AB) <= S(rho_A) + S(rho_B) for a bipartite density with
      positive-definite marginals, the joint state merely PSD.

      The route runs through Klein's inequality via the doubly-stochastic
      overlap expansion; the Kronecker-log split
      log(A (x) B) = log A (x) I + I (x) log B via a diagonalisation-respecting
      functional calculus; and the reduced-trace identities collapsing the
      cross terms. Araki-Lieb's one side is proved under its stated
      hypotheses.
    term: Entropy subadditivity
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Subadditivity.lean
      theorem: vonNeumannEntropy_subadditive
    related: [von-neumann-entropy, klein-inequality, landauer-principle, partial-trace, holevo-bound]

  - slug: schrodinger-from-records
    reviewed: 2026-09-12
    hook: >
      CSD does not postulate the Schrodinger equation. Preserving the statistics
      of records forces the dynamics to be unitary, unitarity together with
      continuity forces a Hamiltonian, and the exponential form of the equation
      is a theorem at the end of that chain.
    layman: >
      Reconstructions of quantum mechanics usually spend their effort on
      probability and quietly assume the dynamics: states evolve by the
      Schrodinger equation because that is the theory being reconstructed. If
      the arena picture is doing real work, the dynamics should be earned too.

      The corpus's route earns it from records. Suppose that the arena's
      dynamics preserves record statistics, the pairwise outcome frequencies
      that experiments actually accumulate. A rigidity theorem going back to
      Wigner says that a map preserving those statistics must be either
      unitary, one of the reversible transformations quantum mechanics
      ordinarily uses, or antiunitary, a mirror-image variant that also
      reverses the sign of the imaginary unit. A selection argument rules out
      the antiunitary branch along a continuous flow. A phase-lifting step then
      passes from the transformation of states to a transformation of the
      vectors that represent them, choosing consistently the phase of each,
      the undetectable angle by which such a vector may be rotated without
      changing the state; and a continuity theorem of Stone's type delivers a
      self-adjoint generator, which is the Hamiltonian.

      The endpoint is the exponential form of the Schrodinger equation,
      derived, with a premise about the statistics of records rather than
      about the structure of Hilbert space, the abstract vector space in which
      quantum states live. The chain is assembled from separate theorems rather
      than proved in one stroke, and the final link carries real hypotheses: a
      smoothness condition, and a consistency condition on the phase, called a
      coboundary condition, which the corpus shows is unavoidable rather than
      convenient.
    in_csd: >
      This series of results is the dynamics spine of the programme. The flow
      on the projected sector, the visible quantum state space obtained by
      projecting the arena, is conjugation by a one-parameter group of unitary
      maps, proved from the descent structure, the way the arena's flow
      descends to the projected sector, rather than assumed. A record-level
      premise conversion makes the hypothesis operational: transition
      probabilities are themselves record observables, so preserving record
      statistics and preserving transition probabilities are the same
      condition, by theorem.

      The scope is tracked mechanically rather than by prose. An automated
      guard enforces that the descent equation is genuinely consumed by the
      proof, and a connectivity manifest, not this page, is the single source
      of truth for which end-to-end connective claims are backed.
    mathematical: >
      The capstone sigmaFlow_schrodinger_form states that for sector data with
      a projectable flow, the projected dynamics is exp(-itH)-conjugation on
      rays. Read the hypotheses, because they are where the content sits. The
      theorem takes the projected flow as already given by a unitary family,
      so Wigner rigidity and the Bargmann branch discriminator stand upstream
      supplying that premise rather than inside this statement; it then takes
      a cocycle for the family, a unit-modulus phase satisfying a coboundary
      condition, an anti-Hermitian generator, and a C^1 derivative hypothesis.
      The coboundary condition is not a convenience: the corpus proves it
      necessary, so the phase lift exists exactly when it holds.

      The same module carries the form that needs neither datum:
      projectedFlow_schrodinger_form_of_continuous_flow reaches the same
      conclusion from continuity of the lifted family alone, with the
      coboundary supplied by the one-parameter Bargmann lift and the generator
      by the finite-dimensional continuity-only Stone theorem.

      What the capstone adds over the ray-level form is that it genuinely
      consumes the sector fields, the flow, the projection and projectability,
      rather than restating a result about an already-projected map. The
      record-level conversion equates the operational premise with the
      geometric one and re-derives the flow theorem from record statistics,
      with the invariance of the Fubini-Study measure obtained with U(N) in
      the proof and never in the statement.
    term: Schrodinger from records
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF4/PhaseLift.lean
      theorem: sigmaFlow_schrodinger_form
    related: [schrodinger-equation, wigner-rigidity, stone-theorem, bargmann, projectability]

  - slug: shor-code
    reviewed: 2026-09-12
    hook: >
      Shor's nine-qubit code was the first proof that quantum information can be
      protected against any error on any single qubit without ever being read,
      and the corpus verifies that protection as explicit constructed operations,
      including the subtle case where two different errors share one repair.
    layman: >
      Classical error correction works by redundancy and inspection: store three
      copies of a bit, look at them, and take the majority. Quantum information
      resists both halves of that recipe. A qubit, the quantum unit of
      information, cannot be copied, and measuring it disturbs the very state you
      are trying to protect. For a while it looked as if error correction was
      simply impossible for quantum computers.

      Shor's nine-qubit code, published in 1995, showed that it is not. One qubit
      is spread across nine physical qubits in such a way that any error on any
      single one of the nine can be detected and undone without ever learning the
      protected information. The errors it handles are of two kinds, and their
      combinations. A flip swaps the two basic values of a qubit, much as a
      classical bit error turns a zero into a one. A phase error has no
      classical counterpart: a qubit can be in a blend of its two values, and a
      phase error changes the sign with which the two are combined, which alters
      the results of later measurements without touching either value on its
      own.

      Detection works through checks that ask joint questions about groups of
      qubits, such as whether two of them agree, without asking what either
      value is. The pattern of check results, called the syndrome, points to the
      error without revealing the stored information, and a correction operation
      reverses it. The corpus builds all of this explicitly: the checks, the
      syndrome extraction, the corrections, and the theorems that the encoded
      state comes back intact for each kind of error.

      One subtle feature survives the formalisation intact. Two different phase
      errors, on different qubits within the same group of three, can produce
      the same syndrome, and the same correction still works for both. This
      property, called degeneracy, has no classical analogue and is part of what
      makes quantum codes stranger than classical ones.
    in_csd: >
      CSD reconstructs quantum mechanics from an underlying deterministic
      description, and its formal corpus also carries a suite of standard
      quantum results reproduced inside the same formal frame. The
      error-correction results belong to that suite. They are labelled as
      empirical breadth: quantum mechanics' own machinery, checked in the corpus
      so that the programme's operational layer, the part that describes what
      laboratories actually do, is held to the same standard as the foundational
      claims. They work as a regression suite, a fixed set of results that must
      keep holding as the corpus grows.

      The code is built by concatenation. A three-qubit code that fixes flips is
      layered inside a three-qubit code that fixes phase errors, and the
      nine-qubit code is the result. The formal development follows the same
      layering, so its structure mirrors the way the code is taught.

      For a reader interested in formal methods, the point is the level at which
      the code exists. Encoders, syndromes and corrections are explicit maps with
      theorems about them, rather than an abstract framework for such codes cited
      from outside and assumed to apply.

      The bit-flip half of the code is also read on the constraint surface, and every step of
      that reading is proved. The error is not posited as a channel: a volume-preserving flow
      on the three-qubit register together with a four-level environment, lifting a concrete
      joint unitary, produces the single-error channel as its environment marginal. The code
      space is a region of the surface, and the four error images of that region are pairwise
      disjoint, so the syndrome measurement is a partition of the surface into four regions,
      and the projective measurement that reads the syndrome is exactly the indicator of those
      regions. Recovery is one channel: measure the syndrome, apply the correction it names.
      That single channel returns every code state, mixed or pure, from the mixed post-error
      state, and applied to the environment marginal of the flowed preparation it returns the
      register's density operator whenever the preparation lies in the code region. What the
      code does not do is also stated: two flips at once are miscorrected, so the
      independent-noise channel is corrected only to first order.
    mathematical: >
      The recovery theorems shor_corrects_X, shor_corrects_Z_degenerate and
      shor_corrects_XZ state that for every block position and every logical
      state, applying the error followed by syndrome-directed correction returns
      the encoded state. The Z case is proved through the degeneracy (correction
      at any position within the affected block restores the state), and the
      combined XZ case composes both recoveries.

      The Pauli errors X, Z and XZ span every single-qubit error, so recovery
      from these three cases covers the single-qubit error set. Stabiliser
      fixing lemmas certify the code space: the encoded states are fixed by the
      stabiliser checks.

      Three-qubit half on the surface: bitFlipFlow_traceRight_barycenter and
      registerFlow_traceRight_barycenter (Empirical/CSD/QEC/) produce the one-qubit bit-flip
      channel and the register's single-error channel as environment marginals of flows on the
      complex projective spaces of dimension three and thirty-one; errorRegion_disjoint and
      syndromeProj_fixes_errorRegion read the syndrome as a partition of the surface;
      recoveryChannel_apply_singleFlipChannel_apply (Empirical/QM/QEC/SyndromeRecovery.lean)
      is the Knill-Laflamme collapse for the recovery channel with Kraus operators E_k P_k;
      and registerFlow_recovery (Empirical/CSD/QEC/RegisterFlow.lean) composes them into error
      correction on the surface end to end.
    term: Shor code
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Empirical/QM/QEC/ShorNine.lean
      theorem: shor_corrects_XZ
    related: [steane-code, pauli-matrices, stinespring-dilation, quantum-channel, gottesman-knill]

  - slug: ozawa-error-disturbance
    hook: >
      The famous error-times-disturbance formula attributed to Heisenberg fails
      in the laboratory; the relation that actually holds is Ozawa's, with three
      terms instead of one, and the corpus proves it.
    layman: >
      Heisenberg's microscope is the story everyone is told. Look at an electron
      closely enough to pin down its position and the light you use to see it
      gives it a kick, spoiling its momentum. Measure precisely, disturb
      proportionally. The trade-off is usually written as a formula, the error
      of the measurement times the disturbance it causes is at least a fixed
      amount, and that formula is quoted constantly.

      It is not true as stated. In 2012 two groups measured it failing: Erhart
      and colleagues with neutron spins in Vienna (Nature Physics 8, 185), and
      Rozema and colleagues with photon polarisation in Toronto. This was not a
      subtle correction. The product of error and disturbance came out below the
      supposed floor.

      What is true is Ozawa's version, and the difference is instructive. It has
      three terms rather than one. Besides the error and the disturbance, it
      involves the spreads of the two quantities in the state you prepared,
      meaning how widely each would scatter if measured on its own before any
      disturbance. The extra terms pair something about the measurement with
      something about the prepared state. You still cannot have an exact
      measurement that disturbs nothing, but the honest bookkeeping needs the
      preparation spreads in it, and the naive formula left them out.

      Two things are worth keeping apart. The trade-off between error and
      disturbance is real. The famous formula for it was wrong.
    in_csd: >
      This is a coverage result rather than a CSD one: the corpus proves it
      because a reader expects it, and it records in a theorem, not a footnote,
      that the relation does not belong to CSD's own measurement account.

      The relation is about a measurement model in the textbook sense: a system,
      a probe, an interaction between them, and a meter read at the end. CSD's
      record layer, its account of how a measurement leaves a lasting mark in
      the underlying state space, has no such model. Its measurement step is a
      deterministic map on the arena, the underlying state space, rather than a
      linear transformation of a joint quantum state of system and probe. So
      the error and the disturbance the relation talks about are not defined
      there at all. This is proved rather than asserted: it follows from the
      same theorem that shows the record layer has no instance of the
      Wigner-Araki-Yanase measurement setting.

      CSD therefore neither explains nor predicts the error-disturbance
      trade-off. What the corpus gains is completeness: it proves Robertson's
      inequality, the statistical uncertainty relation, and alongside it the
      measurement-theoretic relation that a reader aware of the 2012 experiments
      expects to find next to it.
    mathematical: >
      For a measurement model with A_in and B_in the observables entering, A_out
      the meter read-back and B_out the disturbed observable, the relation reads
      eps(A) eta(B) + eps(A) sigma(B) + sigma(A) eta(B) >= 1/2 |<psi, [A,B] psi>|
      with sigma the standard deviations. The corpus proves this at the level the
      proof actually uses: four symmetric operators on one inner-product space
      with A_out and B_out commuting, and no tensor product appears. That
      commutation is the whole content. Expanding the commutator of the two
      "out" operators gives four terms whose left side vanishes, and the three
      survivors are bounded by one Cauchy-Schwarz inequality each.

      The naive form eps eta >= 1/2 |<[A,B]>| is not universally valid rather
      than false: it holds for unbiased measurements. The corpus makes no Lean
      claim about it. It does refute the two-term variant, which shows that the
      third term is load-bearing.

      The record layer's exclusion is no_ozawa_model_of_jointLift, a corollary
      of the theorem that gives Wigner-Araki-Yanase no record-layer instance:
      the record stroke is a skew product on the arena, not a linear map on a
      joint Hilbert space, so the model's error and disturbance are undefined
      there.
    person: >
      Masanao Ozawa, born in 1950, worked at Nagoya and Chubu on the
      mathematical foundations of quantum measurement: the theory of
      instruments, measuring processes, and what a measurement can and cannot
      achieve. The 2003 relation came out of taking the measurement process
      itself as the object of study rather than assuming the textbook trade-off,
      and it took nine years for the experiments to catch up with it.
