entries:
  - slug: fubini-study-measure
    reviewed: 2026-09-29
    image:
      file: img/fubini-study-measure.jpg
      alt: "Portrait photograph of Guido Fubini"
      caption: "Guido Fubini, one of the two names on the measure."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Guido_Fubini.jpg
      article: https://en.wikipedia.org/wiki/Guido_Fubini
    hook: >
      The space of quantum states allows exactly one way of measuring size that respects
      its symmetry, and that one measure is what turns regions of the space into Born-rule
      probabilities.
    layman: >
      In quantum mechanics the complete description of a system at one moment is called
      its state, and the collection of all possible states forms a curved space, rather as
      every place on Earth is a point on a globe. CSD says the probability of an outcome
      is the fraction of that space occupied by the states that lead to it, so you need a
      way of saying how big a region is before a fraction means anything. That way is
      called a measure, a rule that assigns a size to every region. If you chose the rule
      carelessly you could make any region as large or as small as you liked, which would
      amount to writing the answer into the question.

      Symmetry is what rescues the idea. The space of states has a family of
      rearrangements, the unitary transformations, which are the quantum counterpart of
      rigid motions, and they carry any state to any other state while preserving the
      overlap between every pair of states. The overlap is the number that fixes how
      likely one state is to be found when the other was prepared. A measure is called
      invariant when these rearrangements leave the size of every region unchanged, so no
      direction in the space is secretly favoured, and that's the natural sense in which a
      measure can be fair.

      The Fubini-Study measure is the fair one, and it's the only one. Once you give the
      whole space size one, exactly one invariant measure exists on the space of states,
      and that uniqueness is a theorem rather than a convention. Nobody chose the sizes it
      reports, as the geometry of the space fixes them on its own.
    in_csd: >
      CSD doesn't assume the Born rule. It calculates the probability of each outcome as a
      ratio of volumes, the size of the region of states that leads to the outcome divided
      by the size of the whole space, and a ratio of volumes means nothing until the
      measure is fixed. This is the measure, and the whole point of the derivation is that
      the geometry forces it rather than the theorist picking it.

      The geometry forces it because any state can be carried to any other by a unitary
      transformation, so the space of states is as symmetric as a space can be. A space
      with that much symmetry admits exactly one invariant probability measure, by the
      same argument that gives a unique fair measure on the surface of a sphere, so the
      measure falls out of the geometry instead of going in as an assumption.

      This answers the oldest objection to arguments from typicality, which is that they
      presuppose the very measure they claim to justify. Here the measure comes from
      symmetry with a uniqueness proof behind it. Helland reaches the same conclusion from
      the theory of group representations and CSD reaches it from geometry, and two
      independent routes to the same answer are worth more than either alone.
    mathematical: >
      CP^(N-1) is the compact homogeneous space U(N)/(U(1) x U(N-1)), and the Fubini-Study
      measure is the unique U(N)-invariant Borel probability measure on it. As standard
      mathematics it's equivalently the normalised Riemannian volume of the Fubini-Study
      metric, or the top power of the Kahler form over n factorial, and all three readings
      are corpus theorems identifying the same measure. The top power of the Fubini-Study
      form is (4 pi)^n times the measure (fsVolume_eq_smul_fsMeasure), the
      Riemannian volume of the Fubini-Study metric is that top power over n factorial
      (riemannianVolume_fsMetric), so the measure is the normalised Riemannian volume
      (riemannianVolume_fsMetric_eq_smul_fsMeasure). The invariance
      characterisation is the one that carries the weight in the Born derivation, and the
      other two are corpus results rather than background. See the Kahler form entry.

      The proof is Haar uniqueness carried downstairs. The unitary group is compact, so it
      has a unique invariant probability measure, and the state space is a quotient of the
      group, so pushing the measure forward along the orbit map carries the uniqueness
      with it. It's proved at general N with no imported axioms.

      The construction takes a reference point, but that's bookkeeping rather than
      freedom, as fsMeasure_basepoint_independent shows that every choice gives
      the same measure. So defaultFsMeasure is the measure and not one member of
      a family.
    person: >
      Guido Fubini (1879-1943) was born in Venice and trained at the Scuola Normale
      Superiore in Pisa. He held chairs at Catania, Genoa and, from 1908, the Politecnico
      di Torino. Most people meet him through his theorem on exchanging the order of
      integration, and the metric that bears his name came out of his work on projective
      differential geometry. Italy's racial laws stripped him of his post in 1938, so he
      emigrated the following year and taught at Princeton and NYU until his death.

      Eduard Study (1862-1930) was German. He trained at Jena, Strasbourg, Leipzig and
      Munich, and held the chair at Bonn from 1904. He worked on invariant theory and
      complex geometry, and he had a reputation for abrasive independence that kept him at
      arm's length from the Gottingen establishment. The two men found the metric
      independently, within about a year of each other around 1904 to 1905, and neither
      knew of the other's work, which is why it carries both names.
    term: Fubini-Study measure
    eponyms: [Fubini, Study]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/LinearAlgebra/Projectivization/FubiniStudyUnique.lean
      theorem: fsMeasure_unique
    papers:
      - doi: 10.5281/zenodo.19557174
        note: TN1, the Fubini-Study measure as a U(N)-equivariant pushforward
      - doi: 10.5281/zenodo.16746829
        note: Paper B, the symmetry argument that fixes the measure
    external:
      - text: "Bengtsson and Zyczkowski, Geometry of Quantum States, 2nd ed., CUP 2020"
        url: https://www.cambridge.org/core/books/geometry-of-quantum-states/
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper B derives the Born rule from this measure
    related: [born-weight, liouville-measure, kahler-form, haar-measure, typicality-volume, fisher-rao-metric]

  - slug: born-weight
    reviewed: 2026-09-29
    image:
      file: img/born-weight.jpg
      alt: "Portrait photograph of Max Born"
      caption: "Max Born, whose 1926 footnote became the rule."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Max_Born.jpg
      article: https://en.wikipedia.org/wiki/Max_Born
    hook: >
      Quantum probabilities aren't a law of nature in CSD, as they're the sizes of regions
      in the space of states, measured with a ruler nobody was free to choose.
    layman: >
      Quantum mechanics predicts probabilities rather than certainties, so if you run the
      same experiment a thousand times you get stable statistics, and the recipe for those
      statistics is the Born rule. Each possible outcome is assigned a quantity called an
      amplitude, and the probability of the outcome is the square of the amplitude's size.
      The recipe works perfectly, but the textbook never says where it comes from and
      simply lays it down as an axiom, so you're left wondering why the square rather than
      the fourth power or the plain size.

      That silence should be troubling, because everywhere else in physics probabilities
      come from somewhere, whether from counting cases, from ignorance of fine detail, or
      from the relative sizes of possibilities. Quantum mechanics is the only place where
      probability is written in by hand at the ground floor.

      CSD's answer is that the recipe is geometry. The space of all quantum states divides
      into regions, one for each possible outcome of a measurement, and the probability of
      an outcome is the fraction of the space that its region occupies. The square in the
      textbook rule is simply what those fractions turn out to be when you measure the
      regions with the one measure the symmetry of the space allows.
    in_csd: >
      This is the programme's central result, the one everything else supports. The
      outcome regions divide the space of states, the Fubini-Study measure says how large
      each piece is, and the ratio of a region's size to the whole equals the textbook
      weight exactly, so there's no approximation and no restriction to special cases.

      Three features carry the weight of the claim. The result is proved at every
      dimension, so it isn't an accident of the simplest system. It never uses Gleason's
      theorem, the standard route to the Born rule, so the corpus holds two genuinely
      independent derivations rather than one argument in two costumes. And symmetry
      forces the measure doing the work, which is what keeps the reasoning from being
      circular.

      Much turns on this. If the result failed, CSD would be a reinterpretation of quantum
      mechanics, and because it holds CSD can claim a reconstruction, which is the whole
      stake.
    mathematical: >
      For a preparation vector psi on CP^(N-1), the Fubini-Study measure of the
      barycentric outcome region attached to basis vector e_k equals the squared modulus
      of the inner product of e_k with psi. The corpus proves this coordinate by
      coordinate at general N, using neither Gleason nor Busch. It's unconditional in the
      sense that decides circularity, since nothing about the measure or the weights is
      assumed, while the headline form carries a genericity hypothesis of no vanishing
      amplitude. The companion unconditional forms retire that hypothesis, as a vanishing
      amplitude simply gives a cell of measure zero and the identity still holds.

      The route runs through the moment map. Outcome regions pull back to regions of the
      probability simplex, where the Fubini-Study measure becomes flat by Duistermaat-
      Heckman, so the curved-space volume ratio collapses to an ordinary Lebesgue
      computation. A companion apex statement covers the dropped vertex, so all N
      coordinates of a generic preparation are covered and not just a chart that misses
      one.
    person: >
      Max Born (1882-1970) was born in Breslau, now Wroclaw. He studied at Breslau,
      Heidelberg, Zurich and Gottingen, and returned to the Gottingen chair in 1921.
      During the 1920s his institute trained or hosted Heisenberg, Pauli, Jordan, Fermi,
      Oppenheimer and Teller, and for a decade it was the centre of the quantum world.

      The probability rule has one of the best publication stories in physics. Born's 1926
      paper on collisions stated, in the body of the text, that the probability was the
      amplitude itself, and the correction, that it's the square of the amplitude, went in
      as a footnote added at proof stage. Few footnotes have carried so much.

      Born was dismissed in 1933 under the Nazi civil-service laws, so he went to
      Cambridge and then to the Tait Chair in Edinburgh. The Nobel Prize came in 1954,
      twenty-eight years after the footnote, and he felt the delay keenly. Olivia Newton-
      John was his granddaughter.
    term: Born rule
    eponyms: [Born]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF4/MomentBornN.lean
      theorem: fs_born_volume_ratio_N
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper B fixes the measure these weights are read off
    related: [fubini-study-measure, born-volume-ratio, typicality-volume, outcome-region, is-the-born-rule-derived, fisher-rao-metric]

  - slug: duistermaat-heckman
    reviewed: 2026-09-29
    hook: >
      Project the curved space of quantum states down to its outcome probabilities and the
      curvature disappears exactly, which is what makes the Born rule computable in every
      dimension.
    layman: >
      The space of quantum states is curved, and computing the volume of a region in a
      curved space is usually hard work of the kind that gets harder quickly as the number
      of dimensions grows. CSD says probabilities are volumes of regions in this space, so
      you might expect every probability calculation to be a small project in differential
      geometry.

      It isn't, and the reason is the Duistermaat-Heckman formula. Fix a measurement, and
      each state then has two kinds of content, a list of probabilities with one for each
      outcome of the measurement, and a further angle-like piece of information called
      phase, which affects how states interfere with one another but not the probability
      of any single outcome. There's a natural way to compress a state down to its list of
      probabilities and discard the phases, and under that compression the curved space
      flattens completely. The volume of a region of states becomes an ordinary flat
      volume inside a simplex, the shape formed by all lists of probabilities that add up
      to one, so for three outcomes the simplex is a triangle and the calculation is the
      kind you could do with school geometry.

      Mathematicians know the general phenomenon as exact stationary phase. The method of
      stationary phase is normally an approximation, a first guess at an integral, and in
      the presence of enough symmetry it turns out to be exactly right.
    in_csd: >
      This is the engine that makes the Born result computable rather than merely true.
      The compression that sends each state to its list of outcome probabilities is called
      the moment map, and pushing the Fubini-Study measure through the moment map gives a
      measure on the simplex of probability lists that is flat, so every part of the
      simplex counts equally. A curved volume ratio in a high-dimensional space becomes a
      flat volume inside a simplex.

      Without this, the Born theorem at general dimension would have been assembled case
      by painful case, or not at all, and with it the central claim of the programme is a
      finite computation at every dimension. It's also a pleasing historical accident, as
      a piece of symplectic geometry, the geometry that underlies classical mechanics,
      developed for entirely unrelated reasons, turned out to be exactly the tool a
      question in the foundations of quantum mechanics needed.
    mathematical: >
      For a measurable region R of the open free moment simplex, the Fubini-Study measure
      of its preimage under the normalised moment map equals M factorial times the
      Lebesgue volume of R, so the pushforward of the Fubini-Study measure along the
      moment map is the flat Dirichlet distribution on the simplex.

      This is the Duistermaat-Heckman theorem in measure-theoretic clothing. For a
      Hamiltonian torus action the pushforward of Liouville measure is piecewise
      polynomial, and here the polynomial is constant. It's proved unconditionally at
      general N.
    person: >
      Hans Duistermaat (1942-2010) was born in Den Helder and took his doctorate at
      Utrecht in 1968. After a chair at Nijmegen he returned to Utrecht in 1975 and became
      the leading Dutch geometer of his generation. Gerrit Heckman was his student at
      Leiden and Utrecht, and later a professor at Nijmegen.

      The formula appeared in Inventiones in 1982, with an addendum the following year
      that fixed the degenerate cases, which is a small lesson in how even exact results
      can be published slightly wrong. Atiyah and Bott recast it almost immediately in the
      language of equivariant cohomology, which is how most geometers now know it.
      Duistermaat died suddenly of lymphoma at sixty-seven, still supervising students.
