  - slug: interaction-price
    reviewed: 2026-09-12
    hook: >
      Switching on an interaction between field modes makes local quantities
      spread at a rate proportional to the coupling, and the corpus proves the
      rate is exact: at most twice the coupling times the elapsed time, and at
      least a fixed fraction of it.
    layman: >
      A field can be thought of as a collection of modes, independent patterns
      of vibration, like the separate notes a string can sound. A quantity is
      local if it concerns only a particular set of modes. When the modes do not
      interact, the dynamics keeps every local quantity confined to its own
      modes for ever. Interactions spread them: a quantity that started out
      concerning one mode comes to depend on others as time passes.

      That qualitative statement is folklore. The quantitative question is the
      interesting one. At what rate does an interaction buy this spreading, and
      is the rate you can prove as an upper limit also the rate that actually
      occurs?

      The corpus answers with a sandwich. On one side, an upper bound: after one
      period of the interacting drive, every local quantity stays within twice
      coupling-times-time of some exactly local quantity, where the distance
      between two quantities means the largest difference they could show on any
      state. Spreading is priced linearly in the coupling strength and the
      elapsed time. On the other side, a lower bound on an explicit
      two-mode example: a computable commutator, a quantity measuring how far
      two operations are from being interchangeable, forces every exactly
      local quantity to sit at least a comparable linear distance away.

      Between the two bounds, "costs at most" becomes "costs exactly", up to a
      constant factor lying between one over pi and two.
    in_csd: >
      CSD's field track, the part of the programme that treats fields, uses the
      interaction price as its quantitative locality backbone. It feeds the
      interacting corrections to the propagator, the description of how
      disturbances travel through the field. It feeds the renormalised
      couplings, effective interaction strengths that do not depend on the
      cutoff, the artificial limit on resolution used to keep calculations
      finite. And it feeds the coarse-graining budget at the level of channels,
      where the whole error of a renormalisation step, a step that deliberately
      discards fine detail, is the interaction's price, because the free part
      of the dynamics is carried across exactly.

      The lower bound matters because an upper bound on its own leaves open
      whether the price is ever actually paid. The explicit witness shows that
      it is, so the sharpness of the bound is a theorem rather than a hope.
    mathematical: >
      The theorem price_linear_attained states: on the two-mode witness pair,
      and for tau lambda in the window from zero to pi (both bounds are
      hypotheses of the theorem, not decoration, since the sine is only monotone
      there), the distance from the interacting Heisenberg observable to the
      subalgebra supported on the free modes satisfies
      tau lambda / pi <= dist <= 2 tau lambda.

      The lower bound runs through the commutator functional: any operator
      supported on the free modes commutes with a disjoint probe, so one
      computed commutator bounds the distance to the whole subalgebra. The
      commutator entry has modulus 2 sin(tau lambda / 2) exactly, and the Jordan
      inequality converts the sine to the linear form. Historically the upper
      bound stood alone with its sharpness explicitly unclaimed; the witness
      construction retired that caveat.
    term: Interaction price
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/PriceAttainment.lean
      theorem: price_linear_attained
    related: [field-arena, lieb-robinson-bound, record-light-cone, isolation, wick-theorem]

  - slug: does-csd-violate-bell
    kind: question
    hook: >
      No. Bell's theorem stands, CSD proves its own versions of it, and CSD
      escapes its conclusion by the one route the theorem itself leaves open:
      measurement outcomes that depend on the measurement context, paid for
      openly.
    layman: >
      Bell's theorem is not violated by any theory that matches experiment, and
      CSD is no exception. What the theorem forbids is a specific package: hidden
      variables, meaning definite underlying states beneath the quantum
      description, that are both local and context-independent. Local means
      that a choice made at one place cannot affect an outcome at a distant
      place. Context-independent means that a system's answer to a measurement
      does not depend on which other measurements are performed alongside it.
      Bell showed that any such package must obey certain numerical limits, his
      inequalities, and quantum experiments break those limits. The theorem
      survives that breaking; it is precisely the proof that no local,
      context-independent package can produce what the experiments show.

      CSD reproduces the quantum violations, and it respects the theorem by not
      being in the forbidden class. Its outcome assignments depend on the
      measurement context. That is not a loophole; it is the price the theorem
      itself names, and the programme pays it in the open.

      The distinctive part is that CSD does not ask you to take any of this on
      trust. The obstruction theorems, the results that rule out the forbidden
      package, are proved inside the corpus. So is the half that most
      discussions skip: an explicit contextual model that actually reproduces
      the statistics of the singlet, the maximally correlated two-particle state
      that is the standard test case for Bell's theorem, in full.
    in_csd: >
      The corpus carries both directions as a single machine-checked capstone
      result. The negative direction has two parts. No way of splitting a shared
      space of hidden states into one part for each particle, with each part
      deciding its own outcomes, can reproduce the singlet correlations. And no
      single assignment of outcomes to all measurements at once, independent of
      context, is compatible with the correlation table the model reproduces.
      These are Bell-type obstructions proved in-house, for the whole class of
      such models rather than for a convenient strawman.

      The positive direction exhibits an explicit family of shared-context
      outcome maps on the corpus's own arena, measurable in the sense needed for
      probabilities to make sense, that reproduces the complete singlet table:
      the statistics of each side alone and the correlations between the sides,
      at every choice of settings. The model is proved to be no-signalling,
      meaning that neither side can learn anything about the other's choice of
      setting from its own statistics. Measurement independence, the assumption
      that the distribution of hidden states does not depend on which settings
      are chosen, is named as a premise and verified for the model rather than
      quietly assumed.

      Evading Bell is cheap until the model is on the table. The point of the
      capstone is that the model is on the table.
    mathematical: >
      The capstone c1_singlet_contextual_capstone states existence and
      obstruction in one statement. Supporting results:
      no_product_partition_realises_singlet over arbitrary measurable spaces;
      the GHZ and CGLMP obstructions at general dimension; remote marginal
      invariance for both wings of the exhibited model; and the CHSH and
      Tsirelson analysis in which the inequalities sit.

      All of these are proved from the foundational axiom triple alone.
    term: Does CSD violate Bell's theorem?
    status: definition
    source: curated
    related: [bell-chsh, singlet-contextual-model, no-signalling, is-csd-superdeterministic, is-csd-a-hidden-variable-theory]

  - slug: excess-baggage
    kind: question
    hook: >
      No. The excess-baggage theorems say that any model with real underlying
      states beneath quantum mechanics needs a continuum of them, and CSD's
      constraint surface is a continuum from the outset, so the requirement is
      met before it is raised.
    layman: >
      There is a family of results, Hardy's and Montina's sharpening of it, with
      a deliberately deflating name. They say that any model which puts real
      underlying states beneath quantum mechanics must carry more than looks
      necessary. For a system with a fixed finite number of distinguishable
      outcomes, no finite number of underlying states will do. You need
      a continuum: a smoothly varying range of states, like the points of a
      line, rather than a set you could count off. The name suggests the extra
      states are luggage the model would rather not be carrying.

      For most hidden-variable programmes this is a real cost, because they set
      out to recover quantum statistics from something smaller or simpler than
      the quantum state. For CSD it is not a cost at all, because the continuum
      is not a concession. The constraint surface, the space of underlying
      states, is a continuous space from the first line of the construction;
      that is what it is. The measures that give rise to probabilities are
      volumes on it. The theorem asks for exactly what the programme already
      assumes.

      This entry exists so that the question is answered rather than left
      hanging. A referee meeting a theory shaped like a hidden-variable theory
      is entitled to raise excess baggage, and the answer is short.
    in_csd: >
      The constraint surface is a measurable space, one on which regions can be
      assigned sizes, carrying a finite Liouville measure, the natural volume
      preserved by the dynamics. The sector map, which sends each underlying
      state to the quantum state it presents, is many-to-one onto the space of
      quantum states. Nothing in the construction attempts a finite or countable
      space of underlying states, so the excess-baggage lower bound is satisfied
      trivially rather than evaded.

      Two things this answer does not claim. It does not claim the theorem
      supports CSD: satisfying a lower bound is not evidence for a model. And it
      does not claim that sheer size is what makes the programme work. The
      load-bearing structure is the fibre, the set of underlying states that
      share one quantum state, together with its measure and the cells cut out
      by the moment map, not the mere fact that the constraint surface has
      uncountably many points. The excess-baggage theorems are silent about all
      of that.
    mathematical: >
      Hardy (2004) and Montina (2008) show that an ontic model reproducing the
      statistics of an N-level quantum system requires an ontic state space of
      continuum cardinality; a finite set of ontic states cannot reproduce the
      continuum of pure-state predictions.

      CSD's Sigma is a continuum by construction (P1 measurable constraint
      surface, P2 finite Liouville measure), so no bound is approached from
      below.
    term: Does the excess-baggage theorem count against CSD?
    status: definition
    source: curated
    reviewed: 2026-09-04
    external:
      - text: "Hardy, Quantum ontological excess baggage, Stud. Hist. Phil. Mod. Phys. 2004"
        url: https://doi.org/10.1016/j.shpsb.2003.12.001
      - text: "Montina, Exponential complexity and ontological theories of quantum mechanics, Phys. Rev. A 2008"
        url: https://doi.org/10.1103/PhysRevA.77.022104
