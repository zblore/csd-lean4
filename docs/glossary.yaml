  - slug: qbism
    hook: >
      QBism is epistemic all the way down, as the quantum state is one agent's betting
      book and there's nothing underneath, and CSD agrees about the state and insists on
      the underneath.
    layman: >
      Many physicists hold that the quantum state isn't a physical thing but a summary of
      somebody's information, and if you say that you owe an answer to the obvious
      question of what it's information about. QBism pushes the idea to its logical end
      and gives a bracing answer, which is that it's about nothing beyond the agent's own
      future experiences. Quantum states are personal degrees of belief, probabilities are
      subjective bets, and a measurement outcome is an experience of the agent who makes
      the measurement.

      The measurement problem, the puzzle of how a smoothly evolving state can jump to one
      result, evaporates, because there was never a physical state out there to collapse.
      Wigner's friend, the puzzle of one observer describing another observer's
      measurement, the non-locality puzzles, and most of the paradox literature all
      dissolve, because nothing observer-independent was ever claimed.

      The cost is the point of contention. Physics stops describing a world and starts
      describing each agent's gambling position, and proponents call that honesty while
      critics call it surrender.
    in_csd: >
      The agreement runs deep and the split is clean, which makes this the most clarifying
      comparison on the list. Both positions hold that the quantum state is epistemic, a
      matter of knowledge rather than a thing in the world, so both treat its update after
      a measurement as learning and not physics, and both walk away from the measurement
      problem in its standard form.

      Then comes the floor. CSD's constraint surface exists whether or not anyone is
      looking. Probabilities are ratios of volumes on it and not credences, which are
      degrees of belief, and the measure that defines those volumes is fixed by a
      uniqueness theorem, so two rational agents can't disagree about it, while in QBism
      they legitimately can, because probability is personal. The slogan version, fair to
      both sides, is epistemic states over an ontic substrate versus epistemic states over
      nothing. This is a positional entry, and no theorem states it.
    mathematical: >
      There's no formal content about the rival.

      The formal contrast is that CSD's outcome weights are ratios of an invariant
      measure, agent-independent and uniqueness-backed, where QBist probabilities are
      Bayesian credences constrained by coherence but owned by an agent.
    term: QBism
    status: definition
    source: curated
    external:
