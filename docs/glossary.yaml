  - slug: bell-chsh
    hook: >
      No pre-written answer sheet for all four measurement settings can match what a singlet
      does. Proved here as a theorem about every possible answer sheet.
    layman: >
      Here is the problem. Prepare two particles together, separate them, and measure each
      with a choice of two settings. Common sense says every measurement you might have made
      already has an answer waiting -- fixed when the pair was created, merely revealed by
      the apparatus. Bell's insight was that this innocent-sounding assumption has teeth: it
      forces a numerical limit on how correlated the two sides can be.

      Quantum mechanics predicts correlations over that limit. So common sense and quantum
      mechanics disagree about an experiment, and you can run the experiment. It has been
      run for five decades now, with every loophole closed in turn. The correlations are
      there. The answer sheet is not.

      What is proved in this corpus is the sharp version: on one shared space of hidden
      states, no assignment of answers to all four settings at once -- none, however
      contrived -- reproduces the singlet's statistics.
    in_csd: >
      CSD is contextual and non-local at the substrate level, on purpose. So it owes a
      demonstration that its own model cannot be secretly rewritten as the common-sense
      picture -- otherwise it would be claiming a virtue it had not earned. This theorem is
      that demonstration.

      And it comes paired. The corpus also exhibits an explicit contextual model that does
      reproduce the singlet, so the claim is two-sided: here is the impossibility, and here
      is the thing that evades it. Obstruction and existence, cited together as one unit.

      There is a lesson in how the theorem got stated, too. For a long time each measurement
      setting had its own state space in the formalisation, and the Bell question was
      literally unaskable -- there was nothing to compare a global assignment against. A
      type distinction was standing where a theorem should have been. Rebuilding on one
      shared space is what made the question expressible, and the answer turned out to be
      the theorem above.
    mathematical: >
      Over a single shared measurable state space, no jointly-defined assignment of outcomes
      to the four CHSH settings reproduces the singlet correlations. Companion results: the
      same over any shared probability space at every setting pair, and the GHZ analogue for
      three parties.

      The shared-space form is the load-bearing one -- it is the shape the contextuality
      claim actually posits. The corpus pairs the obstruction with an explicit contextual
      model reproducing the same correlations, so the negative and positive halves are
      proved together rather than the no-go standing alone.
    person: >
      John Stewart Bell (1928-1990) was born in Belfast to a working-class family and left
      school at sixteen. He got into physics by working as a lab technician at Queen's
      University, where the staff noticed and pushed him into a degree. Doctorate at
      Birmingham; career at CERN, designing accelerators. Foundations, he insisted, was a
      hobby for sabbaticals.

      Some hobby. The 1964 paper was written while visiting Stanford and appeared in Physics
      1, a journal so obscure it paid authors instead of charging them -- and died after a
      few issues. It showed that the hidden-variables question, which physicists had filed
      under philosophy for thirty years, was experimentally decidable. Clauser, Horne,
      Shimony and Holt made it testable in 1969.

      Bell died of a stroke in 1990, the year he was nominated for the Nobel Prize. The 2022
      prize went to the experimenters who confirmed him.
    term: Bell and CHSH
    eponyms: [Bell]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: no_compatible_global_chsh_assignment_realises_singlet
    papers:
      - doi: 10.5281/zenodo.20354293
        note: LF3, the machine-verified singlet kernel and empirical chain
    related: [ghz-state, tsirelson-bound]

  - slug: ghz-state
    hook: >
      Three particles can contradict local realism with certainty, in a single run. No
      statistics, no inequality, no margin of error.
    layman: >
      Here is the problem with Bell's argument, if you want to call it a problem: it is
      statistical. No single run of a Bell experiment is impossible on the common-sense
      picture, just collectively improbable. You need thousands of runs and error bars, and
      a determined skeptic can always mutter about statistics.

      Greenberger, Horne and Zeilinger found a way to remove the error bars. With three
      particles instead of two, there is a set of measurements where the common-sense
      picture predicts one definite answer and quantum mechanics predicts the opposite
      definite answer. Not different averages. Opposite certainties.

      One run settles it, in principle. The conflict stops being about probability and
      becomes arithmetic: multiply out the answers the common-sense picture demands, and the
      product must be plus one; quantum mechanics says minus one. Something has to give, and
      experiment says it is the answer sheet.
    in_csd: >
      The corpus carries the three-party obstruction alongside the two-party one for a
      specific defensive reason: they have different logical shapes, and a substrate account
      has to survive both. You could imagine a mechanism that reproduces statistical Bell
      violations through some averaging trick but chokes on a deterministic contradiction.
      Carrying GHZ closes that escape.

      The proof quantifies over arbitrary state spaces rather than poking at one model. That
      is what makes it a constraint on the whole class of product-form hidden-variable
      accounts, this programme's naive rewrites included -- which is the point.
    mathematical: >
      No product partition of a shared hidden-state space reproduces the GHZ correlations.
      Proved over an arbitrary measurable state space.

      The contradiction is algebraic. The four predicted outcome-sign products cannot be
      consistently assigned: multiplying the local predictions forces plus one where the
      quantum state forces minus one. No inequality is involved and no bound is approached
      -- the two predictions simply differ, which is why a single ideal run distinguishes
      them.
    person: >
      Daniel Greenberger of City College New York, Michael Horne (1943-2019) of Stonehill
      College -- who as Shimony's graduate student at Boston University had already co-
      authored the CHSH inequality -- and Anton Zeilinger of Vienna and Innsbruck introduced
      the argument in 1989.

      The publication story is odd: the result appeared in the proceedings of a conference
      at Erice, not a journal, and spread mostly by word of mouth until Mermin wrote it up
      and made it famous. Zeilinger shared the 2022 Nobel Prize for entanglement
      experiments; Horne had died three years before.
    term: GHZ state
    eponyms: [GHZ]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF6/GHZContextuality.lean
      theorem: no_product_partition_realises_ghz
    related: [bell-chsh, tsirelson-bound]

  - slug: tsirelson-bound
    hook: >
      Quantum mechanics breaks the classical correlation limit -- and then stops, well short
      of what logic allows. Why it stops there is a genuinely open question.
    layman: >
      Here is the problem, and it is a strange one: quantum mechanics is not weird enough.
      The standard score for correlations between two separated measurements tops out at 2
      for any common-sense theory. Quantum mechanics reaches about 2.83 -- the famous
      violation. But sheer logic permits 4, and theories hitting 4 exist on paper, cause no
      paradoxes, and allow no faster-than-light messages.

      So relativity is not what stops quantum mechanics at 2.83. Something else does, and
      nobody fully knows what. The ceiling is called the Tsirelson bound, and explaining why
      nature's ceiling sits exactly there -- rather than at the logical maximum -- has
      become a research programme in its own right.

      The honest position: we can prove where the quantum ceiling is. We cannot yet say,
      from first principles anyone agrees on, why that is the ceiling the world chose.
    in_csd: >
      A reconstruction has to get the ceiling right, not just the violation. Reproducing
      Bell violation with the wrong maximum would mean you had built a different theory that
      agrees qualitatively -- interesting, but not quantum mechanics. So the corpus proves
      the bound universally: every bipartite state, every choice of settings, not just the
      singlet at the textbook angles.

      Saturation is proved separately -- there really are settings where the singlet hits
      2.83 exactly. Ceiling and attainment are two theorems, not one observation, and
      keeping them apart is what lets each be checked on its own.
    mathematical: >
      For every unit bipartite state and all detector settings, the CHSH combination
      satisfies absolute value at most 2 root 2. Delivered in the Khalfin-Tsirelson
      algebraic form: an operator inequality about products of anticommuting involutions, no
      state mentioned. The state-dependent bound follows by taking expectations.

      That ordering carries the content -- an algebraic bound constrains the entire theory
      at once, where a state-by-state estimate would constrain examples. Saturation by the
      singlet is exhibited explicitly and separately.
    person: >
      Boris Tsirelson (1950-2020) was born in Leningrad and trained there under Ibragimov,
      mostly in probability -- Brownian motion, exotic noises, what he called black noise.
      The quantum bound was almost a side project.

      It appeared in 1980 in Letters in Mathematical Physics, written from inside the Soviet
      Union, and sat largely unread in the West for years -- the field that would need it
      did not exist yet. He emigrated to Israel in 1991 and spent the rest of his career at
      Tel Aviv University. In later life he became one of the most careful mathematics
      editors on Wikipedia, which he treated as seriously as journal work.
    term: Tsirelson bound
    eponyms: [Tsirelson]
    status: proved-in-corpus
    lean:
      module: CsdLean4/SigmaLayer/BellGenerality.lean
      theorem: qm_chsh_le_tsirelson
    related: [bell-chsh, ghz-state]

  - slug: landauer-principle
    hook: >
      Forgetting costs heat, at a rate set by temperature alone. This is where information
      stops being an abstraction.
    layman: >
      Here is the problem, and it starts with a demon. Maxwell imagined a tiny being that
      sorts fast molecules from slow ones, apparently creating a temperature difference for
      free and breaking the second law of thermodynamics. For a century the demon dodged
      every exorcism -- each proposed fix turned out to have a loophole.

      Landauer found the real answer, and it is about memory. The demon must record what it
      learns, and its memory is finite, so eventually it must erase. Erasing is the step
      that cannot be free: resetting a memory to a blank state compresses many possible
      configurations into one, and that compression must be paid for in heat dumped to the
      surroundings.

      The price is universal. It depends on the temperature and on nothing else -- not the
      technology, not the cleverness of the engineering. Forgetting one bit costs, at
      minimum, a fixed tempest-in-a-teacup amount of heat, and the demon's books balance
      exactly.
    in_csd: >
      Thermodynamics is not bolted onto this programme; it grows out of the same soil as the
      Born rule. The substrate is measure-preserving, so at the finest grain nothing is ever
      lost and entropy is conserved. Irreversibility appears only when a record is coarse-
      grained -- which is Boltzmann's picture, reversible microdynamics with irreversibility
      living in the description, not the dynamics.

      Given that setup, an erasure bound is not an import from another field. It is what the
      record layer owes and pays: the corpus derives temperature and free energy first, from
      a variational principle, and then proves the Landauer bound in those earned terms. It
      is the tightest link the development has between information and physical cost.
    mathematical: >
      The entropy removed from a system is bounded by beta times the heat delivered to the
      bath. Proof route: unitary evolution on an initially product state conserves total
      entropy; subadditivity bounds the system's entropy drop by the bath's entropy rise;
      the bath's Clausius inequality converts entropy rise into heat.

      Stated in the Reeb-Wolf form, which forces the assumptions into the open -- the bath
      starts in a Gibbs state, everything is finite-dimensional. That explicitness matters,
      because several informal derivations of the principle are known to smuggle assumptions
      at exactly the step this version makes visible.
    person: >
      Rolf Landauer (1927-1999) was born in Stuttgart; his family fled to New York in 1938
      after his father's death. Harvard degrees, then IBM from 1952, where he spent his
      whole career at the Watson Research Center in Yorktown Heights -- corporate research
      at its mid-century best, where a physicist could spend decades on why computing costs
      energy.

      The principle appeared in 1961 in the IBM Journal of Research and Development, a house
      journal, under the resolutely unglamorous title of a paper about heat generation. His
      slogan -- information is physical -- was a deliberate provocation. His colleague
      Charles Bennett drew the astonishing corollary a decade later: computation itself can
      be free; only forgetting costs. Experimental confirmation came in 2012, thirteen years
      after Landauer died.
    term: Landauer's principle
    eponyms: [Landauer]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Thermo/Landauer.lean
      theorem: landauer_bound
    related: [von-neumann-entropy]

  - slug: von-neumann-entropy
    hook: >
      A quantum whole can be perfectly known while its parts are maximally unknown. Entropy
      is where that stops being a metaphor and becomes arithmetic.
    layman: >
      Here is the problem. Entropy measures missing information, and for ordinary things it
      behaves sensibly: know everything about a machine and you know everything about its
      parts. Quantum mechanics breaks the sensible behaviour in a specific, quantifiable
      way.

      Two entangled particles can be in a jointly definite state -- entropy zero, nothing
      left to learn about the pair -- while each particle alone is in the most uncertain
      state possible, maximum entropy. The information is not hiding in one particle or the
      other. It lives in the relationship, and no inspection of the parts separately can
      find it.

      Von Neumann's entropy is the quantity that makes this precise, and the inequalities it
      obeys -- how the entropy of a whole constrains the entropies of its parts -- are the
      working arithmetic of quantum information. They are also, it turns out, most of
      thermodynamics.
    in_csd: >
      The corpus uses entropy for two jobs, and they are different jobs. First: it measures
      the irreversibility created when a pure state is coarse-grained into a record. The
      substrate conserves entropy exactly; the record does not; the gap between those two
      statements is where the second law -- and arguably the arrow of time -- enters this
      programme.

      Second: the inequalities are load-bearing machinery. Subadditivity is the specific
      step that turns an entropy statement into the Landauer heat bound; remove it and that
      derivation does not close. The corpus proves subadditivity at positive-definite
      marginal scope, and carries the much harder strong subadditivity separately, derived
      from an explicit data-processing premise -- a scope decision recorded in the ledger,
      not discovered by a reader.
    mathematical: >
      For a bipartite density operator, the entropy of the whole is at most the sum of the
      entropies of the marginals, with equality exactly on product states. Proved here at
      positive-definite marginal scope -- for pure global states, that means full Schmidt
      rank.

      Strong subadditivity, the three-party inequality of Lieb and Ruskai from which most
      structural results of quantum information follow, is not re-proved from scratch: it is
      derived from an explicit data-processing hypothesis, and the ledger says so.
    person: >
      John von Neumann (1903-1957), born Neumann Janos in Budapest to an ennobled banking
      family, did a chemistry degree in Zurich and a mathematics doctorate in Budapest more
      or less simultaneously. Berlin, Hamburg, then Princeton in 1930 and the Institute for
      Advanced Study at its founding. The entropy is in his 1932 book that gave quantum
      mechanics its Hilbert-space form -- fifteen years before Shannon.

      The naming story is the good part. When Shannon later needed a name for his own
      uncertainty quantity, von Neumann reportedly told him: call it entropy. Two reasons --
      your formula already exists in statistical mechanics under that name, and nobody knows
      what entropy really is, so in a debate you will always have the advantage. Shannon
      took the advice. The joke has been paying dividends ever since.
    term: von Neumann entropy
    eponyms: [Neumann]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Subadditivity.lean
      theorem: vonNeumannEntropy_subadditive
    related: [landauer-principle]

  - slug: liouville-measure
    hook: >
      A deterministic substrate needs a notion of volume its own motion cannot distort. On
      CSD's sector, that volume is forced -- and it is the Born measure.
    layman: >
      Here is the problem. Any theory with a deterministic underworld needs to say how much
      of that world is one way rather than another -- how big a set of possible states is.
      And the notion of size had better be one the motion respects: if flowing forward in
      time inflated some regions and shrank others, sizes would depend on when you measured,
      and probabilities built from them would be meaningless.

      Classical mechanics solved this long ago. Liouville proved that Hamiltonian motion
      preserves phase-space volume exactly: a region can be stretched and folded into
      filigree, but its total volume never changes.

      The residual worry is choice. If several motion-respecting volumes existed, a theorist
      could pick whichever delivered the desired answer, and any probability derivation
      would be quietly rigged. The theorem here closes that: on the sector CSD works with,
      there is exactly one option.
    in_csd: >
      This is the hinge joining the ontic story to the probability story. The substrate
      carries a volume its flow preserves; the epistemic side needs the Fubini-Study measure
      to turn regions into Born weights. On the unitary-flow sector these are proved to be
      the same object. The ruler used for probability IS the substrate's own volume -- not a
      second, conveniently chosen assumption.

      That identification is the programme's reply to the oldest objection against
      typicality reasoning, pressed from Boltzmann's day to Valentini's: that the measure is
      smuggled in. Here it is forced, and the forcing is a theorem with a uniqueness proof.
    mathematical: >
      For the unitary-flow sector, the Liouville measure equals the Fubini-Study measure,
      and it is the forced Kahler volume -- determined by the state space and its unitary
      symmetry, not posited.

      Scope, stated plainly because it is load-bearing: measure-preservation of the flow is
      carried as a structure field, an ontic postulate listed in the axiom ledger, not
      derived. What is proved is the conditional -- IF the sector is this one, THEN its
      volume is forced. The theorem is about the sector, not a derivation of it.
    person: >
      Joseph Liouville (1809-1882) was born at Saint-Omer and trained at the Ecole
      Polytechnique, teaching there, at the College de France and at the Sorbonne. The
      volume-preservation theorem is from 1838, arrived at through celestial mechanics
      rather than any inkling of statistical physics.

      Two other legacies. He founded the Journal de Mathematiques Pures et Appliquees --
      still publishing -- and used it in 1846 for an act of scientific rescue: printing the
      papers of Evariste Galois, fourteen years after Galois died in a duel at twenty, and
      thereby saving group theory's founding documents from oblivion. He was also first to
      exhibit a provably transcendental number, decades before e and pi were settled.
    term: Liouville measure
    eponyms: [Liouville]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF4/KahlerVolumeForced.lean
      theorem: unitaryFlowSetup_liouville_isForcedKahlerVolume
    related: [fubini-study-measure, kahler-form, born-weight]

  - slug: kahler-form
    hook: >
      Distance, area, and a quarter-turn from the complex numbers all lock together on the
      space of states. That lock is what makes its volume nobody's choice.
    layman: >
      Here is the problem. The space of quantum states carries three structures that could,
      in principle, have nothing to do with each other: a way of measuring distances, a way
      of measuring areas, and a quarter-turn operation that comes from multiplying by the
      imaginary unit.

      On this space they are not independent. Each one is recoverable from the other two --
      turn the metric a quarter-turn and you get the area form, and so on around. A space
      where the three lock together like this is called Kahler, and the lock has a payoff:
      such a space owns a volume. Take the area form, raise it to the top power, done. No
      external ruler required.

      That is why the measure used throughout this programme is not an extra ingredient
      someone had to supply. The geometry already contains it.
    in_csd: >
      This underwrites the claim that CSD's typicality measure is geometric rather than
      chosen -- which is the difference between deriving the Born rule and restating it with
      more steps.

      What the corpus actually proves is the pointwise compatibility, on the tangent model:
      the quarter-turn squares to minus one, area is metric-composed-with-turn and vice
      versa, the form survives turning both slots, and pairing a vector with its own turn
      returns its squared length. Flat closedness is proved there too.

      But read the next register before repeating any of this, because the limitation is not
      a technicality, and the corpus's own rules forbid overselling it.
    mathematical: >
      With g the real part of the inner product, omega the imaginary part, and J
      multiplication by i: J squared is minus one, omega equals g after J, g equals omega
      after J, omega is type (1,1), and omega(u, Ju) equals the squared norm of u. All
      proved axiom-free, pointwise, on the tangent model.

      Now the disclosure. The MANIFOLD residual is not formalised: closedness of the form on
      the projective space itself, and the top-power identity equating omega^(N-1)/(N-1)!
      with the Fubini-Study measure there, await manifold differential-form machinery the
      proof assistant does not have. The corpus's permitted-claims list explicitly forbids
      calling Kahler differential geometry load-bearing. The uniqueness argument that
      actually carries the programme runs through Haar measure, not through this geometry.
    person: >
      Erich Kahler (1906-2000) was born in Leipzig, took his doctorate there at twenty-two,
      and after the war -- including a spell as a French prisoner of war -- held chairs at
      Berlin and Hamburg.

      The manifolds come from one short 1933 paper. He had noticed that when metric, complex
      structure and form are compatible, a single potential function generates everything --
      a simplification whose consequences he did not live to see fully spent: Hodge theory,
      the classification of complex surfaces, Calabi-Yau spaces, string theory. The name was
      attached by Andre Weil in the 1950s, two decades late. Kahler's own later work drifted
      into a private philosophical system that attracted essentially no following -- a
      reminder that mathematicians get one name on the map, rarely two.
    term: Kahler form
    eponyms: [Kahler]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF4/KahlerOnticSetup.lean
      theorem: isFubiniStudyKahler
    related: [liouville-measure, fubini-study-measure]

  - slug: luders-rule
    hook: >
      The textbook's second rule -- how a state changes when measured -- is not a second
      rule here. It is what the record layer does.
    layman: >
      Here is the problem. Measure a quantum system and two things happen: an outcome shows
      up, and the state afterwards is different. Textbooks handle this with a separate
      postulate -- the update rule -- bolted on beside the equation of motion. Two rules, no
      explanation of why the second exists or when it applies.

      There is also a subtlety inside the update rule itself, and it is Luders who caught
      it. When several distinct states share the same measured value -- a degenerate
      measurement -- the naive update (jump to the eigenstate) is wrong. The right update
      projects onto the whole block of states sharing the value, disturbing nothing within
      the block. Get this wrong and repeated measurements give inconsistent answers.

      Von Neumann's original 1932 rule got the degenerate case wrong. Luders fixed it in
      1951, and the fix went largely unremarked for years -- a correction to the foundations
      of measurement theory, published quietly and absorbed silently.
    in_csd: >
      In CSD the update is not a postulate at all. Records and the state update live on the
      same pointer arena, produced by the same construction: the record selects which region
      the trajectory realises, the Born weights come out of the volumes, and the post-
      measurement state is the block projection. One mechanism, two textbook rules recovered
      as its two faces.

      The corpus treats the degenerate case as the general one, not a footnote. That
      ordering is forced by physics: real detectors are almost always degenerate --
      reporting which region a particle landed in without resolving states within the
      region. A companion result sharpens the point: no fixed ray-level calibration
      reproduces the update for all preparations, so the block form is not optional.
    mathematical: >
      On the pointer arena, the record-conditioned marginal reproduces the Born weights of
      the preparation, and the post-measurement state is the Luders block projection.
      Degenerate block measurements are the case treated; rank-one projective measurements
      are the specialisation where every block is a single ray.

      Companions: a swap-based apparatus reproduces the Luders marginal exactly when
      calibrated, and -- the sharper negative -- no fixed ray-level calibration works for
      every preparation, so calibration must be context-dependent. That negative is what
      forces the block treatment.
    person: >
      Gerhart Luders (1920-1995) was born in Hamburg, trained in the Gottingen orbit, and
      held a chair at Gottingen from 1960. The update rule is from a 1951 paper correcting
      von Neumann -- a graduate student's observation, in effect, that the great man's
      measurement postulate mishandled repeated eigenvalues.

      He is at least equally remembered for the CPT theorem, proved independently around
      1954: the statement that charge conjugation, parity and time reversal, composed, is a
      symmetry of every local relativistic field theory. Two results, both structural, both
      about what quantum theories must do rather than what any particular one does.
    term: Luders rule
    eponyms: [Luders]
    status: proved-in-corpus
    lean:
      module: CsdLean4/RecordLayer/PointerLudersMarginal.lean
      theorem: pointer_luders_born_prep
    related: [born-weight, naimark-dilation]

  - slug: naimark-dilation
    hook: >
      Every messy real-world measurement is a clean textbook measurement in a bigger room.
      That one fact is why the Born derivation covers actual experiments.
    layman: >
      Here is the problem. Textbook measurements are clean: mutually exclusive outcomes,
      sharp boundaries, one projector each. Real detectors are not like that. They are
      noisy, they blur neighbouring outcomes, they sometimes have more outcomes than the
      system has states. The general gadget describing them -- the POVM -- looks like a
      genuinely different, worse-behaved kind of object.

      Naimark's theorem says the mess is an illusion of perspective. Any generalised
      measurement, however noisy, is an ordinary sharp measurement performed on the system
      plus an extra piece of apparatus. Enlarge the room and the complicated thing becomes
      the simple thing.

      So there is no separate theory of realistic measurements. There is one theory, viewed
      sometimes through a keyhole.
    in_csd: >
      Without this, CSD's Born derivation would cover only idealised measurements -- a
      serious hole for a programme claiming to be about physics rather than textbooks, since
      essentially every real experiment is a POVM. With it, the volume argument transfers:
      dilate to the big room, run the same volume-ratio derivation there, pull the answer
      back. The generalised case closes by transfer, not by a second derivation.

      The corpus does this constructively and then spends it: SIC measurements, mutually
      unbiased bases, trine measurements, unambiguous state discrimination, weak
      measurements -- each built through the canonical dilation, each inheriting the volume
      statement for free. The POVM chapter of the reconstruction is recorded as closed on
      exactly this mechanism.
    mathematical: >
      For a POVM with a Naimark dilation, the Born weight of an effect equals the Fubini-
      Study volume of the corresponding outcome region in the dilated space, and the
      frequency statement transfers. Unconditional -- no genericity hypothesis.

      The dilation is constructed, not assumed: from the effect square roots, canonically,
      so existence comes with an explicit witness. Instances in the corpus then inherit the
      theorem rather than re-proving it.
    person: >
      Mark Naimark (1909-1978) was born in Odessa, the son of an artist, and worked in
      Moscow at the Steklov Institute, teaching at the Moscow Institute of Physics and
      Technology. The dilation theorem is from 1940 -- with close cousins by Stinespring and
      Sz.-Nagy forming a little family of extension theorems discovered across a war-divided
      decade.

      His best-known work is the 1943 Gelfand-Naimark theorem characterising C-star
      algebras, written with Israel Gelfand, whose Moscow seminar was one of the most
      productive mathematical institutions of the century -- a weekly event that ran for
      fifty years and treated functional analysis as a contact sport.
    term: Naimark dilation
    eponyms: [Naimark]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF4/BornRegionUncond.lean
      theorem: povm_born_eq_dilated_volume_uncond
    related: [born-weight, luders-rule]

  - slug: no-exact-finite-ccr
    hook: >
      In any finite world, the founding equation of quantum mechanics cannot hold exactly.
      One line of arithmetic says so -- and CSD says precisely where it gives.
    layman: >
      Here is the problem. Position and momentum obey the most famous relation in quantum
      mechanics: measuring them in opposite orders differs by a fixed universal amount.
      Everything characteristic of the theory -- uncertainty above all -- flows from it. Now
      suppose the world has only finitely many distinguishable states, as CSD says. Can the
      relation survive?

      No, and the proof fits in a sentence. Add up the diagonal of both sides. The left side
      is a difference of two products in opposite orders, and such a difference always sums
      to zero. The right side is a nonzero constant spread along the diagonal, which sums to
      something nonzero. Zero cannot equal nonzero.

      So any finite theory owes an account of where the relation fails. Not whether --
      where.
    in_csd: >
      The corpus pays this debt exactly rather than apologising for it. On the truncated
      oscillator the relation holds perfectly on every energy level except the very top one,
      where it fails by a single rank-one defect -- of precisely the magnitude the trace
      argument demands. The defect is not noise to be minimised; it is the exact
      compensation the counting requires, pushed into the one place a finite ladder must
      end.

      For any state a laboratory can prepare -- negligible population at the ceiling -- the
      departure is invisible. And the result is stated CSD-free on purpose: the obligation
      binds every finite-dimensional reconstruction, so a rival programme claiming
      finiteness inherits the same debt whether it has noticed or not.
    mathematical: >
      No finite matrices satisfy [Q,P] = c times identity with c nonzero: the trace of a
      commutator vanishes, the trace of c times identity is c times the dimension.
      Corollary: the constant cannot be i h-bar in finite dimension.

      The companion construction gives the sharp positive: a conjugate pair on the N-level
      oscillator whose commutator is exactly i everywhere except the top Fock level, where a
      rank-one defect of magnitude N sits -- exactly what makes the trace vanish.
    term: No exact finite-dimensional CCR
    status: proved-in-corpus
    lean:
      module: CsdLean4/CV/ApproxCCR.lean
      theorem: no_exact_finite_ccr
    related: [canonical-typicality]

  - slug: canonical-typicality
    hook: >
      A small piece of a big quantum system looks thermal not because anything prepared it
      that way, but because almost every state of the whole makes it so.
    layman: >
      Here is the problem. Statistical mechanics traditionally starts with an ensemble -- an
      imagined collection of systems, weighted by probability, from which yours is somehow
      drawn. But your coffee is not an ensemble. It is one cup, in one state. Why should
      reasoning about imaginary collections say anything true about one actual cup?

      Canonical typicality dissolves the embarrassment. Take one large system in a single
      definite quantum state -- no ensemble, no drawing. Look at a small piece of it. For
      the overwhelming majority of possible global states, the piece looks exactly thermal.
      You do not need to assume equilibrium statistics; you need only fail to be in an
      astronomically unlikely global state.

      Equilibrium, on this view, is not a physical process that happened to you. It is a
      statement about how much room there is in the space of states, and how little of that
      room is occupied by exceptions.
    in_csd: >
      This is where the programme touches mainstream statistical mechanics, and the traffic
      goes both ways. Inbound: thermal behaviour is volume, exactly as Born weights are
      volume, so thermodynamics is native to the construction -- one measure does both jobs.
      Outbound: the literature's standing complaint about canonical typicality is that its
      measure is an unmotivated prior. What does most look like, and who chose the ruler?
      CSD has an answer nobody else has: the ruler is the substrate's own volume, with a
      uniqueness theorem behind it. That converts the programme's central manoeuvre into a
      contribution to someone else's open problem.

      The corpus is precise about what it has: the expectation, not yet the concentration.
      Read the next register before citing this one.
    mathematical: >
      For a global pure state drawn from the Fubini-Study measure, the average reduced state
      of a tensor subsystem is exactly maximally mixed. That is the theorem: the
      EXPECTATION.

      The literature's headline -- a single typical state has a near-thermal reduced state
      with probability exponentially close to one -- needs Levy's lemma, concentration of
      measure on high-dimensional spheres, which the proof assistant's library does not
      carry. The mean proved here is exactly the value concentration would concentrate
      around; the deviation bound is the missing piece, recorded as a named residual rather
      than papered over. And none of this is dynamical thermalisation, which would need
      mixing assumptions and is out of scope.
    person: >
      The modern result has two independent birth certificates, both from 2006: Goldstein,
      Lebowitz, Tumulka and Zanghi -- the Rutgers-Bochum-Genoa axis of the Bohmian school,
      which had kept typicality arguments alive through decades of unfashion -- and Popescu,
      Short and Winter, coming from quantum information at Bristol and Cambridge. Same
      theorem, two vocabularies, two communities that barely cited each other.

      The idea itself is older: Schrodinger sketched it in the 1920s and von Neumann proved
      a version in 1929 that was misunderstood, mistranslated and dismissed for eighty years
      before being rehabilitated. Few results have been discovered this many times.
    term: Canonical typicality
    status: proved-in-corpus
    lean:
      module: CsdLean4/Thermo/CanonicalTypicality.lean
      theorem: canonical_typicality_expectation
    related: [fubini-study-measure, von-neumann-entropy, born-weight]

  - slug: bargmann
    hook: >
      One phase survives every convention: multiply three overlaps around a cycle. It is
      also the fingerprint that tells unitary from anti-unitary.
    layman: >
      Here is the problem. A quantum state's overall phase is pure convention -- multiply by
      any unit complex number and no measurement changes. So phases seem like bookkeeping
      trash. Yet somehow geometric phases are measurable physics. Which phases are real?

      Bargmann's invariant is the minimal answer. Take three states. Multiply their overlaps
      around the cycle: one to two, two to three, three back to one. Each state's arbitrary
      phase enters that product once plainly and once conjugated -- and cancels. What
      remains survives every convention. It is the smallest phase that is genuinely there.

      It is the ancestor of every geometric phase: carry a state slowly around a loop and
      the extra phase it picks up is this invariant, iterated around the loop's edges.
    in_csd: >
      The corpus uses it as a fingerprint in the Wigner analysis. Symmetries come in two
      families -- unitary and anti-unitary -- and the invariant tells them apart: unitaries
      preserve it, anti-unitaries conjugate it. That is what lets the branch alternative in
      the rigidity theorem be decided pointwise instead of assumed.

      Honest scope, recorded rather than glossed: Bargmann's THEOREM -- continuity kills the
      projective cocycle, letting projective representations lift to genuine ones -- is
      beyond the proof assistant's current reach and sits in the corpus's gap register. The
      phase lift therefore carries its coboundary datum as an explicit hypothesis, where the
      theorem would have supplied it for free.
    mathematical: >
      For rays u, v, w: the invariant is the phase of the product of pairwise overlaps
      around the cycle. Invariant under independent rescaling of each representative -- each
      scale factor appears once and once conjugated. Preserved by unitaries, conjugated by
      anti-unitaries, which is exactly the discriminator the rigidity proof needs.
    person: >
      Valentine Bargmann (1908-1989) was born in Berlin, left in 1933 when the dismissals
      began, and finished his doctorate in Zurich under Wentzel and Pauli. Emigrating in
      1937, he landed at the Institute for Advanced Study as Einstein's assistant --
      calculating with the great man daily -- then joined the Princeton faculty for good.

      The 1954 paper on projective representations answered the question Wigner's theorem
      leaves open: the theorem hands you a symmetry with an undetermined phase; Bargmann
      settled when the phases can all be chosen consistently. He also worked out Lorentz-
      group representations with Wigner, and was by all accounts a concert-grade pianist who
      had considered the other career.
    term: Bargmann invariant
    eponyms: [Bargmann]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Wigner%27s_theorem

  - slug: bloch-sphere
    hook: >
      The two-level system is a ball -- a lovely accident of low dimension, and the single
      most misleading picture in quantum mechanics.
    layman: >
      Here is the useful part. The states of the simplest quantum system -- a qubit -- map
      perfectly onto an ordinary sphere. Measurement settings are directions; perfectly
      distinguishable states are antipodal points; angles set the statistics; mixed states
      fill the interior with the coin-flip state at dead centre. Every quantum intuition you
      can have in three dimensions, you can have here.

      Here is the trap. All of that is an accident of two levels. Go to three-level systems
      and the state space is not a sphere, is not any familiar shape, and supports none of
      the same tricks. The picture that teaches everyone the subject also quietly teaches
      them falsehoods about its general case.

      Both halves matter: use the sphere, and know when to put it down.
    in_csd: >
      The corpus computes on the sphere wherever qubits appear -- Bell settings, the singlet
      correlations, the qubit Born rule -- and flags the accident explicitly rather than
      trading on it. At two levels the projective space IS a sphere, so structure that in
      general must live in a fibre above the state space can sit on the space itself, and
      nothing warns you this is happening.

      The programme's fibre analysis makes the warning quantitative: contextual content can
      live on the base at N equals two purely because of this accident, and provably cannot
      from three levels up. That finding narrowed the programme's own claims. The sphere is
      where everyone's intuition is formed; the corpus treats it as a crime scene to be
      handled with gloves.
    mathematical: >
      CP^1 is diffeomorphic to the two-sphere; antipodal points are orthogonal states; the
      Fubini-Study measure is the normalised round area; trace distance is half the
      Euclidean chord. Mixed states fill the closed ball.

      For N above two, CP^(N-1) is not a sphere, has nontrivial topology, and admits no
      comparable elementary picture -- which is precisely why qubit-calibrated intuition
      transfers badly and why the corpus's N-of-three-and-up results needed different
      methods.
    person: >
      Felix Bloch (1905-1983) was born in Zurich, studied at the ETH, and took his doctorate
      under Heisenberg at Leipzig -- the thesis founded the band theory of solids, no small
      warm-up act. Jewish, he left Germany in 1933 and settled at Stanford for the rest of
      his career, with war work at Los Alamos and on radar at Harvard.

      The sphere comes from his work on spins precessing in magnetic fields -- nuclear
      magnetic resonance, for which he shared the 1952 Nobel Prize with Purcell, and which
      became MRI. He also served as CERN's first Director-General in 1954, lasting about a
      year before deciding administration was not physics. Quantum information adopted his
      sphere decades later, mostly without asking.
    term: Bloch sphere
    eponyms: [Bloch]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Bloch_sphere

  - slug: borel-set
    hook: >
      Before any region can have a probability, someone has to say which regions are allowed
      to have a size at all. This is the answer everyone uses.
    layman: >
      Here is the problem, and it genuinely shocked mathematics when it surfaced: not every
      collection of points can be assigned a size. Insist that every set has a volume and
      you get contradictions -- most famously, a solid ball that can be cut into five pieces
      and reassembled into two balls the same size as the original.

      The repair is to be selective. Fix a family of well-behaved sets -- start from simple
      ones like intervals, close under countable combinations -- and only ever measure
      those. That family is the Borel sets.

      The restriction sounds drastic and costs nothing. Every region you could describe,
      draw, or physically distinguish is Borel. The pathologies need the axiom of choice and
      cannot be exhibited, only proved to exist. Probability theory lives happily inside the
      fence.
    in_csd: >
      Every measure in the corpus is a Borel measure -- on the state space, on the unitary
      group -- and every outcome region whose volume becomes a Born weight is a Borel set.
      This is not decoration: the programme's central claim is a statement about the
      measures of regions, and it would be meaningless for regions without measures.

      One detail the constructions lean on: the boundaries between outcome regions are null
      sets. A state sitting exactly on a boundary is ambiguous about which outcome it
      belongs to -- and the ambiguity has probability zero, so no prediction ever depends on
      resolving it.
    mathematical: >
      The sigma-algebra generated by the open sets of a topological space. The corpus's
      measures are Borel probability measures on the projective space and on the unitary
      group; the outcome regions are Borel with Fubini-Study-null boundaries, and the null-
      boundary fact is used, not just noted.
    person: >
      Emile Borel (1871-1956) was born at Saint-Affrique in the Aveyron, a pastor's son, and
      topped the entrance examinations for BOTH the Ecole Normale Superieure and the Ecole
      Polytechnique -- choosing the Normale, to the Polytechnique's lasting chagrin. He
      taught at Lille and then in Paris, at the Normale and the Sorbonne, founding measure
      theory around 1898.

      His second life was public: Radical-Socialist deputy in the Chamber, Minister of the
      Navy in 1925, and at seventy, Resistance activity that earned him a spell in Vichy
      detention and, after the war, the Resistance Medal. The infinite monkey theorem is his
      image, from a 1913 paper. Few mathematicians have run a ministry; fewer still after
      founding a field.
    term: Borel set
    eponyms: [Borel]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Borel_set

  - slug: cglmp-inequality
    hook: >
      Bell's inequality is for two-outcome measurements. Go past two and you need a new
      inequality -- and the conflict gets stronger, not weaker.
    layman: >
      Here is the problem. Bell's argument, as usually stated, assumes each measurement has
      exactly two possible results. Real systems often have three, or five, or d. Does the
      conflict with local realism survive when outcomes multiply, or is it an artefact of
      the binary case?

      It survives, and it takes a new inequality to say so -- the CGLMP inequality, one for
      each number of outcomes. The surprise is the direction of travel: the violation grows
      with the number of outcomes. Higher-dimensional systems disagree with local realism
      more strongly, not less.

      There was a second surprise in the same paper. The state that violates the inequality
      most is not the maximally entangled one. The state that is most entangled by the
      standard bookkeeping is not the state most at odds with common sense -- a warning that
      entanglement is not one number.
    in_csd: >
      The corpus carries it so the contextuality results do not lean on two-level systems,
      which are special in ways that keep surprising people. And there is a structural echo
      worth noticing: three outcomes is precisely where the corpus's own fibre analysis
      finds that contextual content can no longer live on the projective base and must move
      to the fibre above it. The dimension where this inequality becomes necessary is the
      dimension where the programme's geometry changes character. That is either a
      coincidence or a hint, and the honest label for now is coincidence.
    mathematical: >
      A Bell-type inequality for bipartite systems with d outcomes per side, violated by
      quantum mechanics for every d at least two, with the maximal violation increasing in
      d. The maximising state is not maximally entangled, which remains one of the sharpest
      reminders that entanglement measures and non-locality measures order states
      differently.
    person: >
      Daniel Collins, Nicolas Gisin, Noah Linden, Serge Massar and Sandu Popescu published
      it in Physical Review Letters in 2002 -- Gisin at Geneva, Popescu and Linden at
      Bristol, Massar in Brussels, Collins a Bristol student. Five authors across four
      institutions for four pages of paper: a snapshot of how the European quantum
      information community actually worked in those years, by email and short visits, with
      the inequality named for the initials of whoever was on the manuscript when it
      converged.
    term: CGLMP inequality
    eponyms: [CGLMP]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://doi.org/10.1103/PhysRevLett.88.040404

  - slug: deutsch-jozsa
    hook: >
      The first problem a quantum computer provably settles in one question where exact
      classical computing needs exponentially many. Useless by design, and historic for it.
    layman: >
      Here is the problem, and it is deliberately artificial. A black box computes a
      function that is promised to be one of two kinds: constant (same answer on every
      input) or balanced (half one answer, half the other). Your job: decide which, asking
      the box as few questions as possible.

      Classically, certainty is expensive. In the worst case you must check just over half
      of all inputs -- exponentially many, as inputs grow. A quantum procedure asks once. It
      queries the box on a superposition of all inputs simultaneously and arranges the
      interference so that constant and balanced produce perfectly distinguishable outcomes.

      Nobody has ever needed to solve this problem. That was never the point. The point was
      existence: here is a task where quantum provably beats classical. The door it opened,
      others walked through.
    in_csd: >
      One of the corpus's algorithm witnesses, and the corpus is precise about what such
      witnesses are for. They are scope evidence, not foundations: the algorithms presuppose
      the unitary-evolution pillar rather than support it, and their theorems concern
      circuit semantics and query counts, not where quantum mechanics comes from.

      What they demonstrate is that the formalised machinery is the real thing -- strong
      enough to express and verify genuine algorithms with their amplitude bookkeeping
      intact, not a fragment tuned to make the foundational theorems pass. A reconstruction
      of quantum mechanics that could not run a quantum algorithm would invite a fair
      question.
    mathematical: >
      One oracle query decides constant-versus-balanced with certainty; exact classical
      algorithms need 2^(n-1)+1 queries in the worst case. The honest footnote: allow the
      classical side a tiny error probability and a handful of random queries suffice -- the
      exponential separation is against EXACT classical computation. The problem was built
      to exhibit a separation, and does exactly that much.
    person: >
      David Deutsch, born in Haifa in 1953, studied at Cambridge and Oxford and has remained
      at Oxford's Clarendon Laboratory in a famously unusual arrangement -- largely
      unsalaried, no teaching, working from home. The universal quantum computer is his 1985
      construction; this algorithm came in 1992 with Richard Jozsa, later of Bristol and
      Cambridge.

      Deutsch is also the most committed Everettian alive, and has argued in print that
      quantum computation is evidence for many worlds -- where else, he asks, would the
      computation happen? Most of the field declines the inference, and this programme,
      being single-trajectory, rejects it outright. The algorithm works either way, which is
      rather the point against the argument.
    term: Deutsch-Jozsa algorithm
    eponyms: [Deutsch]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Deutsch%E2%80%93Jozsa_algorithm

  - slug: dirichlet-distribution
    hook: >
      The fair way to be ignorant about proportions that must sum to one -- and, by a small
      miracle, exactly what quantum state space flattens into.
    layman: >
      Here is the problem. You want to pick a random set of proportions -- say, how a unit
      of probability splits across N outcomes. You cannot pick each share independently,
      because they are chained together: they must total one. Pick the first freely and the
      others feel it.

      The Dirichlet family is the standard machinery for randomness under exactly that
      constraint, and its flat member is the fair one: every legal way of dividing the whole
      is weighted equally. It is what a Bayesian writes down to mean I know nothing about
      these proportions.

      Usually it enters an analysis as a modelling choice -- a confessed prior. What earns
      it a page here is that it enters CSD's story a completely different way: as a computed
      consequence, not a choice.
    in_csd: >
      Compress a quantum state down to its outcome probabilities -- forget the phases -- and
      ask what the natural measure on states looks like after the compression. Answer, by
      the Duistermaat-Heckman theorem: the flat Dirichlet. Exactly. The curved geometry of
      state space projects to perfect fairness on the simplex.

      This is the workhorse behind the general-N Born result: it converts curved volume
      ratios into elementary simplex volumes. And it carries a small philosophical sting --
      the distribution that statisticians must assume, the geometry here derives. Nobody
      chose fairness; it fell out of symmetry.
    mathematical: >
      The Dirichlet family lives on the probability simplex, indexed by positive
      concentration parameters; all parameters equal to one gives flat Lebesgue measure. The
      theorem: the pushforward of the Fubini-Study measure along the (normalised) moment map
      is this flat member, at general N -- a computed identity, with the M-factorial
      normalisation explicit.
    person: >
      Peter Gustav Lejeune Dirichlet (1805-1859) was born at Duren, between Aachen and
      Cologne, to a family of Belgian descent, and studied in Paris -- where he reportedly
      kept Gauss's Disquisitiones under his pillow, having found the one book too expensive
      to buy and too essential to return. Breslau, then nearly thirty years in Berlin, then
      Gauss's own chair at Gottingen in 1855, which he enjoyed for only four years before
      his death.

      The modern concept of a function -- any rule, not necessarily a formula -- is
      substantially his, as is the pigeonhole principle and the first honest convergence
      proof for Fourier series. The distribution bearing his name arose from an integral he
      evaluated; the statistics came much later and kept the name.
    term: Dirichlet distribution
    eponyms: [Dirichlet]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Dirichlet_distribution

  - slug: elitzur-vaidman
    hook: >
      Certify that a bomb is live without a single photon touching it. The absence of an
      interaction becomes the measurement.
    layman: >
      Here is the problem, stated as its inventors did. A batch of bombs, each with a
      trigger so sensitive that one photon sets it off. Some are duds -- trigger missing,
      light passes through harmlessly. Find a live bomb. Testing means shining light on it;
      shining light on a live one destroys it. Classically the task is hopeless: any bomb
      you have verified, you have detonated.

      Quantum mechanics finds a way through, using an interferometer. Send one photon along
      two paths at once. A dud changes nothing -- the paths interfere as usual and a
      particular dark output port stays dark. A live bomb, merely by being CAPABLE of
      absorbing the photon, spoils the interference -- even on runs where nothing was
      absorbed. When the dark port clicks, you hold a certified live bomb no photon ever
      touched.

      The basic scheme certifies a quarter of the live ones and sacrifices half. Cleverer
      versions push efficiency as close to perfect as you like.
    in_csd: >
      One of the corpus's empirical twins, and among the sharpest tests an account of
      quantum mechanics can face -- because it forces a definite statement about the path
      not taken. A story in which the photon simply went one way must explain how an object
      sitting in the OTHER, untraveled arm changed the outcome. A story in which nothing was
      definite must explain what the final record is a record of.

      CSD routes its answer through the epistemic regions rather than through a story about
      paths: the presence of the absorber reshapes the region structure that the record is
      read against, and the volume bookkeeping does the rest. The point of carrying the case
      explicitly is that reproducing this experiment is a genuine constraint, not a
      formality.
    mathematical: >
      An interferometer in which an absorbing object in one arm destroys the interference,
      so a detection at the normally dark port certifies the object's presence without
      absorption. Base efficiency: one quarter certified, one half destroyed. Kwiat-style
      iterated variants exploit the quantum Zeno effect to drive the certified fraction
      arbitrarily close to one.
    person: >
      Avshalom Elitzur and Lev Vaidman published the bomb tester in Foundations of Physics
      in 1993. Vaidman, of Tel Aviv University, is a career foundations physicist -- co-
      inventor of weak measurements with Aharonov and Albert, and a cheerful, combative
      Everettian. Elitzur is the wilder card: no doctorate at the time, working outside the
      standard track, later associated with Bar-Ilan and a private institute, with interests
      running to time and thermodynamics.

      The idea was realised in the laboratory within two years, by Kwiat, Weinfurter,
      Herzog, Zeilinger and Kasevich at Innsbruck in 1995 -- using down-converted photons
      rather than bombs, to general relief.
    term: Elitzur-Vaidman bomb tester
    eponyms: [Elitzur]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Elitzur%E2%80%93Vaidman_bomb-tester

  - slug: euclidean-space
    hook: >
      Ordinary geometry, run over complex numbers: the stage every finite quantum system in
      this corpus stands on.
    layman: >
      Here is the problem, small but real. Quantum mechanics needs geometry -- lengths,
      angles, the whole toolkit -- but its amplitudes are complex numbers, and naive
      geometry over complex numbers gives complex lengths, which mean nothing.

      The fix is the complex inner product: a pairing arranged so that any vector paired
      with itself yields a real, positive length, while two different vectors can pair to
      something complex. That leftover complex phase is not a defect. It is where
      interference lives -- the single structural feature that separates quantum
      superposition from classical mixing.

      Finite-dimensional complex Euclidean space is just this, in N dimensions. Nothing
      exotic; the exotic things are built on top of it.
    in_csd: >
      This is the base camp, not a claim. State vectors live in finite complex Euclidean
      space; operators are matrices on it. The objects that carry content are built
      overhead: the projective space of rays -- because states differing by a phase are
      physically identical -- and the forced measure on it.

      The finiteness is a decision, not a convenience. The corpus is finite-dimensional
      everywhere, on purpose: completeness comes free, the pathologies of infinite dimension
      never arise, and the price is paid honestly in one place -- the exact canonical
      commutation relation is impossible, with the failure located and quantified rather
      than hidden.
    mathematical: >
      Finite-dimensional complex inner product space, realised as the L2 structure on
      functions from a finite index type, with matrices carrying the induced operator norm.
      Completeness is automatic, so Hilbert-space subtleties vanish; the corpus's
      continuous-variable work approximates infinite dimension at an explicit finite cutoff
      instead of importing it.
    person: >
      Euclid of Alexandria worked around 300 BC under Ptolemy I. Almost nothing personal is
      known -- the anecdotes (there is no royal road to geometry) are late inventions. The
      work is another matter: the Elements organised Greek geometry and number theory into
      definitions, postulates and deductions, and stayed a live textbook for over two
      thousand years -- the longest run any book has had in science.

      Every formal proof, this corpus's included, is downstream of that template. And its
      most productive failure: the fifth postulate resisted derivation for two millennia
      because it is independent -- the discovery of which gave us non-Euclidean geometry,
      and eventually the curved spaces on which both relativity and this glossary's state
      space stand.
    term: Euclidean space
    eponyms: [Euclidean]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Euclidean_space

  - slug: fisher-information
    hook: >
      How hard your data can ever push back on a parameter -- the floor under every error
      bar, classical or quantum.
    layman: >
      Here is the problem. You are estimating something -- a frequency, a field strength, a
      phase -- from noisy data. Better analysis shrinks your error bar, up to a point. Is
      there a floor? A best possible precision that no cleverness in processing can beat?

      There is, and Fisher information is its name. It measures how sharply your data's
      distribution responds when the underlying parameter shifts: responsive data can pin
      the parameter tightly, sluggish data cannot, and the reciprocal of the information is
      a hard lower bound on the variance of any unbiased estimate.

      The quantum version adds one more optimisation -- over all possible measurements, not
      just all ways of processing a fixed measurement's data -- and yields the ultimate
      floor physics allows for a given probe state.
    in_csd: >
      This lives in the corpus's metrology strand, which the documentation classifies
      carefully: an adjacent arm, not a step in the reconstruction. It consumes the
      formalised machinery -- states, Born rule, dynamics -- to state precision bounds and
      the protocols that meet them; it contributes nothing to deriving quantum mechanics and
      does not pretend to.

      Why carry it at all: a formalisation claiming practical reach should be able to state
      the standard quantum limit, the Heisenberg scaling that entanglement buys, and the gap
      between them. The corpus can.
    mathematical: >
      Classically: the variance of the score of a parametrised family; the Cramer-Rao
      inequality bounds any unbiased estimator's variance below by its inverse. Quantum:
      maximise over measurements to get the quantum Fisher information and the Braunstein-
      Caves bound -- the precision floor for a given parametrised family of states, before
      any choice of apparatus.
    person: >
      Ronald Fisher (1890-1962) was born in London, read mathematics at Cambridge, and did
      his transformative work not at a university but at Rothamsted Experimental Station
      from 1919, where crop trials posed the problems that produced experimental design,
      analysis of variance and maximum likelihood. Chairs followed -- the Galton Chair at
      University College London, then Cambridge.

      The record has a dark seam that the name of his London chair advertises: Fisher was a
      lifelong, institutionally active eugenicist, and his statistics were in significant
      part built in service of that programme. Late in life he took tobacco-industry
      consulting money while publicly disputing the smoking-cancer link. Both facts belong
      in any honest biography, next to the fact that modern statistics is unimaginable
      without him.
    term: Fisher information
    eponyms: [Fisher]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Fisher_information

  - slug: gibbs-state
    hook: >
      The state a system relaxes into at temperature T -- and the unique solution to a
      trade-off between energy and disorder.
    layman: >
      Here is the problem. Put a system in contact with a big environment at some
      temperature and wait. It does not fall into its lowest-energy configuration and stay
      there, because the environment keeps jostling it -- lending energy, taking it back.
      But it does not wander uniformly over all configurations either, because low energy is
      still favoured. What, exactly, is the compromise?

      Gibbs wrote down the answer: weight each configuration by a decaying exponential of
      its energy, with temperature setting the decay rate. Hot systems spread out, cold
      systems concentrate near the bottom, and the crossover is quantitative.

      What makes the answer canonical rather than plausible is a variational principle.
      Among all states with the same average energy, the Gibbs state is the one with the
      most entropy -- equivalently, the one minimising free energy. It is not a good guess.
      It is the unique solution to an optimisation problem.
    in_csd: >
      The thermodynamics strand of the corpus instantiates the Gibbs state on the field
      Hamiltonian and derives temperature and free energy from the variational principle --
      deriving rather than assuming, which is the difference between formalising
      thermodynamics and decorating it.

      It is also where two independently built strands of the corpus meet. The thermal side
      (Gibbs states, entropy, Landauer) and the field side (modes, propagators, light cones)
      developed separately for months; the exact KMS relation proved at the cutoff joined
      them, with the Gibbs state as the object on which they agree. Because the field
      Hamiltonian is diagonal, everything has closed form -- the thermal results are
      computations, not existence claims.
    mathematical: >
      The density operator proportional to exp(-beta H), normalised by the partition
      function. Unique minimiser of free energy at inverse temperature beta; equivalently
      the entropy maximiser at fixed mean energy.

      In the corpus the Hamiltonian is diagonal in the configuration basis, so the state is
      an explicit diagonal matrix with a finite geometric normalisation, the partition
      function factorises over modes, and the thermal two-point function and its vacuum
      limit are exact finite computations.
    person: >
      Josiah Willard Gibbs (1839-1903) spent essentially his whole life in New Haven,
      Connecticut. Yale gave him America's first engineering doctorate in 1863; after three
      years in Paris, Berlin and Heidelberg he came home to a Yale professorship he held
      unpaid for nine years, living on inheritance, because the university had no money for
      him.

      He published his great work in the Transactions of the Connecticut Academy of Arts and
      Sciences, a journal with a circulation approaching zero. Europe learned of him mainly
      through Maxwell, who read him, championed him, and made a plaster cast of one of
      Gibbs's thermodynamic surfaces with his own hands -- a copy went to Yale. Gibbs coined
      the very phrase statistical mechanics, in 1902, a year before he died.
    term: Gibbs state
    eponyms: [Gibbs]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Gibbs_measure

  - slug: gisin-theorem
    hook: >
      Every entangled pure state -- every single one, however slightly entangled -- violates
      a Bell inequality. There is no quiet zone.
    layman: >
      Here is a comfortable picture: entanglement comes in degrees, so maybe weak
      entanglement is effectively classical, and the famous Bell conflict only kicks in past
      some threshold of strangeness. Below the threshold, ordinary intuitions survive.

      Gisin's theorem deletes the comfortable picture, at least for pure states. Any
      entanglement at all -- any amount, however small -- produces correlations no local
      account can reproduce, for some choice of measurement settings. The conflict has no
      threshold and no safe margin. Either a pure state is unentangled and boring, or it is
      entangled and already in conflict with local realism.

      For mixed states, genuinely, the story is more complicated: there are entangled mixed
      states that violate nothing. The clean dichotomy is a pure-state fact.
    in_csd: >
      This matters to the programme because it forbids an economy measure. A substrate
      account might hope to handle weak entanglement classically and reserve its non-local
      machinery for the strongly entangled regime. Not allowed: whatever mechanism produces
      the correlations has to operate at every degree of entanglement, all the way down to
      almost-product states.

      The corpus can express statements of this generality because its CHSH machinery treats
      the singlet as an instance rather than the subject -- the theorems quantify over
      states and settings, so universal claims are statable rather than aspirational.
    mathematical: >
      Every pure entangled bipartite state violates the CHSH inequality for some settings.
      The result genuinely fails for mixed states -- Werner's examples are entangled yet
      admit a local hidden-variable model -- so entanglement and Bell non-locality are
      distinct properties there, and conflating them is an error the corpus is built to
      avoid.
    person: >
      Nicolas Gisin, born 1952, took his doctorate at Geneva and stayed, apart from a stint
      in industry building fibre-optic instruments -- which turned out to be the perfect
      apprenticeship. His group's 1997 experiments sent entangled photons through ten
      kilometres of deployed Swisscom telecom fibre under Lake Geneva, the moment quantum
      communication stopped being a tabletop subject.

      The theorem is from 1991, a two-page paper. He co-founded idQuantique, which sells
      quantum cryptography commercially, and has written a small book arguing that physics
      has been too quick to give up on genuine chance.
    term: Gisin's theorem
    eponyms: [Gisin]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Nicolas_Gisin

  - slug: grover-algorithm
    hook: >
      Search anything unsorted in square-root time -- and provably, nobody will ever do
      better.
    layman: >
      Here is the problem. One marked item hides among N possibilities, with no structure to
      exploit -- no sorting, no index, nothing. Classically you check items until you hit
      it: N/2 looks on average, N in the worst case. Surely that is just what search costs.

      Grover found that a quantum computer pays square root of N. The procedure is a rhythm:
      reflect the state about the marked item, reflect about the average, repeat. Each pair
      of reflections rotates the state a small fixed angle toward the answer; after about
      root-N steps you measure and find it. Run too long and you rotate PAST the answer --
      the algorithm has a punchline but also a timer.

      And here is the unusual part: the speedup is provably final. Not just the best known
      -- the best possible.
    in_csd: >
      One of the corpus's algorithm witnesses, with the standard disclaimer stated rather
      than implied: the algorithms consume the unitary pillar, they do not support it. Their
      content is circuit semantics -- amplitudes, iteration counts, success probabilities --
      not foundations.

      What this one demonstrates, beyond expressiveness, is that the formalisation handles
      genuinely quantitative algorithmics: the rotation-angle bookkeeping and the iteration
      schedule are exactly the kind of thing that a fragile formal fragment would fumble and
      this one carries.
    mathematical: >
      Amplitude amplification finds a marked element among N in order root-N oracle queries,
      versus order N classically. Optimality is a theorem: the BBBV hybrid argument shows no
      quantum algorithm beats order root-N for unstructured search.

      The geometry is two-dimensional: the state stays in the plane spanned by marked and
      unmarked components, each double reflection rotating it by a fixed angle -- so the
      query count is a right angle divided by that angle, and overshooting degrades success.
    person: >
      Lov Grover, born 1961 in India, studied at IIT Delhi and Stanford and was at Bell Labs
      in New Jersey when he published the algorithm in 1996 -- in a paper three pages long,
      titled as a database search result rather than a physics one.

      The optimality half of the story is the strange half: the lower bound (Bennett,
      Bernstein, Brassard, Vazirani) was proved shortly BEFORE the algorithm existed. The
      ceiling was known before anyone had built the thing that touches it -- one of the rare
      cases in algorithms where the achievement and its impossibility-of-more arrived in the
      wrong order.
    term: Grover's algorithm
    eponyms: [Grover]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Grover%27s_algorithm

  - slug: haar-measure
    hook: >
      On a compact group there is exactly one symmetric notion of volume. Every forced
      measure downstream of this programme inherits its uniqueness from that one fact.
    layman: >
      Here is the problem. Suppose you want to average over all rotations, or pick a random
      symmetry, or say two families of transformations are the same size. You need a notion
      of volume on the set of transformations itself -- and it had better not depend on your
      parametrisation, or your average is an artefact of your coordinates.

      The demand sounds mild: sizes should not change when everything is shifted by a group
      element. For compact groups it is devastatingly restrictive. Exactly one such volume
      exists, once you fix the total to one. Not one natural choice among several -- one,
      full stop.

      So questions like what does a random unitary do have definite, coordinate-independent
      answers. That is Haar's gift, and half of modern mathematics quietly leans on it.
    in_csd: >
      Trace the programme's central claim back far enough and you land here. The chain: the
      unitary group is compact, so it has a unique invariant probability measure. The state
      space is a quotient of that group -- a homogeneous space. Push the measure down along
      the orbit map and the uniqueness comes with it. That is the whole proof that the
      Fubini-Study measure is forced.

      Remove this link and everything downstream changes character: the measure becomes a
      preference, the Born derivation becomes circular, the reply to the smuggled-measure
      objection evaporates. It is also, pleasingly, what makes the base point of the
      construction immaterial -- any two orbit maps differ by a group element, and Haar
      measure cannot see group elements.
    mathematical: >
      A compact topological group carries a unique translation-invariant Borel probability
      measure. On a homogeneous space of such a group, invariant measures are unique up to
      scale, and normalisation fixes the scale.

      The corpus uses the unitary group's Haar measure directly and pushes it forward along
      the orbit map; uniqueness downstairs is inherited from uniqueness upstairs. No
      geometric argument is involved in the uniqueness proof -- it is group theory and
      measure theory all the way down.
    person: >
      Alfred Haar (1885-1933) was born in Budapest and took his doctorate at Gottingen under
      Hilbert in 1909; the Haar wavelet, now the first example in every wavelet course, is
      from that thesis. With Frigyes Riesz he built the mathematics institute at Szeged into
      a serious research centre -- and its journal, Acta Scientiarum Mathematicarum, into a
      serious journal.

      The measure theorem is from 1933, the last year of his life; he died of cancer at
      forty-seven. Von Neumann, who had been sceptical that such a measure existed in
      general, used it almost immediately to solve Hilbert's fifth problem for compact
      groups, and Weil built the general theory soon after. The result outlived its author
      before the year was out.
    term: Haar measure
    eponyms: [Haar]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Haar_measure

  - slug: hermitian-operator
    hook: >
      The symmetry condition that makes measured numbers real -- and hands you, free of
      charge, the whole machinery of outcomes and eigenstates.
    layman: >
      Here is the problem. Quantum mechanics represents measurable quantities by operators,
      but operators are matrices of complex numbers, and laboratory dials read real. Which
      operators are legitimate observables?

      The answer is a symmetry condition: the operator must equal its own conjugate
      transpose -- Hermitian. That single requirement buys everything a theory of
      measurement needs. The eigenvalues -- the possible outcomes -- are forced real. The
      eigenvectors -- the states giving each outcome with certainty -- form a complete
      orthogonal set. Measurement becomes sorting into perfectly distinguishable bins.

      Drop the condition and all of it collapses: complex outcomes, non-orthogonal
      certainties, no consistent sorting. The reality of experimental numbers, traced back,
      is this one algebraic symmetry.
    in_csd: >
      Everything measurable in the corpus is Hermitian -- observables, Hamiltonians, density
      operators -- and the spectral theorem that Hermiticity unlocks is used constantly. The
      most load-bearing instance: diagonalising a density operator before integrating
      against it, the step on which the trace-versus-norm bridge in the channel work stands.

      One workmanlike convention worth knowing: the corpus states Hermiticity as a predicate
      on plain matrices rather than bundling it into a subtype. Statements stay close to the
      mathematics, proofs stay close to the library, and the finite-dimensional spectral
      facts consumed are proved, not assumed.
    mathematical: >
      A matrix equal to its own conjugate transpose. Real eigenvalues; unitary
      diagonalisability with orthogonal eigenspaces; hence the functional calculus --
      applying real functions to operators through their spectra -- that the corpus's
      entropy and channel chains consume throughout.
    person: >
      Charles Hermite (1822-1901) was born at Dieuze in Lorraine with a malformed right
      foot, and the Ecole Polytechnique -- having admitted him -- forced him out over the
      disability, ending the engineering career he had trained for. Mathematics got him
      instead. He eventually taught at the Polytechnique that had rejected him, at the Ecole
      Normale and at the Sorbonne; Poincare was his student.

      His 1873 proof that e is transcendental was the first for any naturally occurring
      number, and his method handed Lindemann the transcendence of pi nine years later --
      closing the squaring of the circle after two millennia. He never sought the second
      result himself, writing that he dared not attempt it: one of history's more
      consequential displays of mathematical modesty.
    term: Hermitian operator
    eponyms: [Hermitian]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hermitian_matrix

  - slug: hilbert-space
    hook: >
      The stage quantum mechanics is usually performed on. CSD's claim is that it is scenery
      -- the shadow of the object, not the object.
    layman: >
      Here is the problem the concept solves. Quantum superposition needs vector addition;
      probabilities need lengths and angles; and analysis -- limits, convergence, calculus
      -- needs sequences to converge to something IN the space rather than leaking out of
      it. A Hilbert space is exactly a space with all three: vectors, inner product,
      completeness.

      In finite dimensions completeness is automatic, and a Hilbert space is nothing more
      exotic than complex Euclidean space. In infinite dimensions it is a genuine constraint
      and the source of most of the subject's analytical grief.

      The standard formulation of quantum mechanics identifies the theory with this stage.
      States ARE vectors in Hilbert space; that is where the theory happens. Or so the
      textbook says.
    in_csd: >
      CSD's sharpest departure from textbook framing is here. The ontology is NOT in Hilbert
      space. Physical states are points of the constraint surface; the Hilbert space -- more
      precisely the projective space of its rays -- is the epistemic bookkeeping built over
      the substrate, carrying outcome regions and probabilities.

      So quantum mechanics happens in Hilbert space is, on this account, like saying the
      weather happens on the weather map: true about the representation, silent about the
      thing represented. The corpus's fibre analysis pushes further -- the projective space
      is a LOSSY projection, with record-forming content living above it. Whether one buys
      the programme or not, this is the single sentence to understand about how it reads the
      formalism.
    mathematical: >
      A complete complex inner product space. The corpus is finite-dimensional throughout,
      so completeness is free and the operative object is CP^(N-1), the space of rays, since
      phase-differing vectors are one physical state. Infinite dimension -- unbounded
      operators, domains, continuous spectra -- is deliberately out of scope; the
      continuous-variable strand approximates it at an explicit finite cutoff instead.
    person: >
      David Hilbert (1862-1943) was born in Konigsberg and moved in 1895 to Gottingen, which
      he made the centre of world mathematics for a generation. The 1900 Paris address, with
      its twenty-three problems, set the century's agenda; his formalist dream --
      mathematics proved complete and consistent by finite means -- was bounded forever by
      Godel in 1931.

      Two footnotes with teeth. The space is not his coinage: von Neumann named it, while
      building quantum mechanics' rigorous foundations in Hilbert's own department. And when
      the Nazi education minister asked him, in 1934, whether Gottingen mathematics had
      suffered from the removal of the Jews, Hilbert answered: suffered? It no longer
      exists.
    term: Hilbert space
    eponyms: [Hilbert]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hilbert_space

  - slug: hong-ou-mandel
    hook: >
      Two identical photons meet at a beam splitter and refuse to come out separately --
      ever. Indistinguishability, made visible as a hole in the data.
    layman: >
      Here is the problem. Two photons arrive at a half-silvered mirror from opposite sides
      at the same instant. Each, on its own, would pass or reflect at random. So the pair
      should sometimes exit on opposite sides -- one detector clicking on each side, a
      coincidence. Simple counting says half the time.

      The experiment says: never. If the photons are truly identical, the two histories
      leading to a coincidence -- both passed, both reflected -- have amplitudes that cancel
      exactly, and both photons always leave together through the same port. Coincidence
      counts drop to zero.

      The signature is the HOM dip: scan the arrival-time offset and watch coincidences
      vanish as the photons become simultaneous. Depth measures how identical the photons
      are; width measures their coherence. What began as a demonstration is now a workshop
      tool -- the standard ruler for indistinguishability in photonics.
    in_csd: >
      One of the corpus's empirical twins, chosen because it probes a different organ than
      the Bell family. There is no separation here, no locality question at all -- just two
      alternatives cancelling. The question it puts to any account is pure: what, in your
      ontology, is the difference between both passed and both reflected, such that the two
      can annihilate?

      For a substrate theory the question has bite, since naively the two configurations
      differ only by an unobservable relabelling. Reproducing the dip is a real constraint
      on how CSD's regions and volumes handle exchange, which is exactly why the case is
      carried.
    mathematical: >
      For two indistinguishable bosons at the input ports of a balanced beam splitter, the
      both-transmitted and both-reflected amplitudes cancel; the output is a superposition
      of both-photons-left and both-photons-right, and the coincidence rate is zero. Partial
      distinguishability revives coincidences in proportion, making dip visibility a
      quantitative measure of photon identity.
    person: >
      Chung Ki Hong and Zheyu (Jeff) Ou were graduate students of Leonard Mandel at the
      University of Rochester when the three demonstrated the effect in 1987 -- in a paper
      whose stated headline was metrological: measuring sub-picosecond time intervals by
      counting coincidences, decades before femtosecond lasers made such numbers routine.

      Mandel (1927-2001), born in Berlin and brought to Britain as a refugee in 1938, took
      his degrees at Birkbeck College London and moved to Rochester in 1964, where he
      effectively founded experimental quantum optics -- half the field's senior figures
      passed through his group. Ou went on to a professorship at IUPUI in Indianapolis.
    term: Hong-Ou-Mandel effect
    eponyms: [Hong]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hong%E2%80%93Ou%E2%80%93Mandel_effect

  - slug: jacobi-identity
    hook: >
      The consistency law that turns order-of-operations mismatch into structure -- and
      makes classical and quantum dynamics two dialects of one language.
    layman: >
      Here is the problem. Do two operations in one order, then the other; the results
      differ; call the difference their bracket. Fine -- but is the bracket just a number
      you compute, or does it have laws of its own? If it had none, every calculation with
      it would be bespoke drudgery.

      It has exactly one deep law. Cycle three ingredients through nested brackets in all
      three arrangements, add, and everything cancels. That is the Jacobi identity, and it
      is what promotes the bracket from arithmetic accident to algebraic structure -- the
      multiplication of a Lie algebra, the algebra of continuous symmetry.

      The payoff for physics: the quantum commutator and the classical Poisson bracket both
      satisfy it. Same law, two theories. That shared grammar is why quantum and classical
      dynamics translate into each other as smoothly as they do.
    in_csd: >
      The identity sits underneath the programme's central translation. CSD's ontic side is
      a deterministic flow with Hamiltonian structure; its epistemic side is operator
      dynamics with commutators. These correspond, rather than merely resembling each other,
      because both brackets obey the same law -- without it, the two levels would be
      connected by analogy and hand-waving.

      Background structure here, not a theorem of the corpus: the formal content lives at
      the pointwise and volume level, the full symplectic-manifold story being beyond the
      proof assistant's current reach and recorded as such.
    mathematical: >
      For a Lie bracket: the cyclic sum of nested brackets vanishes. Equivalently,
      bracketing with a fixed element is a derivation -- the form it takes in actual
      calculations. The matrix commutator and the Poisson bracket both satisfy it, making
      each a Lie algebra multiplication and licensing the classical-quantum dictionary.
    person: >
      Carl Gustav Jacob Jacobi (1804-1851) was born in Potsdam to a Jewish banking family
      and converted to Christianity to make an academic career possible -- the standard toll
      of the era. He taught at Konigsberg for eighteen years, building it into a
      mathematical centre, before illness moved him to Berlin.

      Elliptic functions -- in a legendary race with Abel -- determinants, and mechanics:
      the Hamilton-Jacobi equation still carries his half of the name. He also left the
      era's best statement of pure-science defiance, answering Fourier's complaint that he
      wasted talent on number theory: the sole end of science is the honour of the human
      spirit.
    term: Jacobi identity
    eponyms: [Jacobi]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Jacobi_identity

  - slug: kronecker-product
    hook: >
      How two systems become one, in coordinates -- and why quantum resources multiply where
      classical ones merely add.
    layman: >
      Here is the problem. Two quantum systems sit side by side; what describes the pair?
      Classically you would just list both descriptions -- N states here, M states there, N
      plus M numbers of bookkeeping. Quantum mechanics demands more: every state of one can
      combine with every state of the other, and all superpositions of combinations are
      states too. The pair needs N times M dimensions, not N plus M.

      The Kronecker product is this fact in matrix form: a recipe multiplying an N-by-N grid
      and an M-by-M grid into an NM-by-NM grid. Mechanical to compute, explosive in
      consequence.

      That multiplication-instead-of-addition is the origin story of quantum computing's
      power and quantum simulation's difficulty alike: thirty qubits need a billion
      dimensions. The exponential lives here.
    in_csd: >
      Throughout the corpus this is how composition is realised -- and in one important
      place, how it is EARNED. The composite-system results do not assume tensor structure;
      they derive it: from commuting local subalgebras that jointly generate, the corpus
      proves the composite must be a tensor product with the product dimension, over
      arbitrary embeddings. The necessity audit rates that among the strongest results in
      the development.

      Elsewhere it is infrastructure: the partial trace that discards an environment, the
      reduced states, the thermal marginals -- all Kronecker bookkeeping, consumed daily.
    mathematical: >
      The matrix form of the operator tensor product, with the mixed-product identity --
      Kronecker of products equals product of Kroneckers -- doing the functorial work.
      Consumed by the partial-trace machinery; earned rather than assumed in the composite
      reconstruction, where commuting generating subalgebras force tensor structure and
      multiplicative dimension.
    person: >
      Leopold Kronecker (1823-1891) was born in Liegnitz, Silesia, was privately tutored by
      Kummer -- a lifelong alliance -- and then did something almost no mathematician has
      done: quit at his doctorate, spent a decade running the family's banking and estate
      business, got rich, and returned to mathematics at thirty with no need of a salary. He
      lectured at Berlin for twenty years before accepting a chair at all.

      He is remembered for constructivist conviction -- God made the integers, all else is
      the work of man -- and for prosecuting that conviction against Cantor's infinities
      with a persistence that shaded into persecution and darkened Cantor's life. The
      product bearing his name is, ironically, the least controversial thing attached to it.
    term: Kronecker product
    eponyms: [Kronecker]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Kronecker_product

  - slug: leggett-garg
    hook: >
      Bell's argument, rotated from space into time. What it tests is not spooky action --
      it is whether the world has a definite history.
    layman: >
      Here is the problem. Bell inequalities need two separated particles, so a skeptic can
      file the whole conflict under weird stuff about distance. Leggett and Garg asked the
      question with one particle and no distance at all: does a system have definite
      properties BETWEEN your looks at it? And can you look without disturbing?

      Grant those two assumptions -- a definite history, and gentle measurement -- and
      correlations between measurements at different TIMES obey a strict bound. Quantum
      mechanics breaks the bound. Experiments agree with quantum mechanics.

      So something has to go: either properties are not definite between measurements, or
      measurement is never really gentle. The inequality cannot tell you which. Every
      account of quantum mechanics has to choose.
    in_csd: >
      This test aims closer to CSD's heart than Bell does, which is exactly why the corpus
      carries it. A substrate theory practically advertises definite properties between
      measurements -- that is what having a substrate MEANS -- so an inequality targeting
      that assumption probes the programme where it is most exposed.

      CSD's escape is the second assumption, and the escape is principled rather than
      convenient: measurements here are physical interactions that produce records, and
      interactions are not gentle. The microstate is definite at every moment; the act of
      reading it participates in the dynamics. Definite history, invasive measurement --
      that combination violates nothing, and it is exactly the combination CSD is built
      from.
    mathematical: >
      A bound on combinations of two-time correlation functions following from macrorealism
      plus non-invasive measurability, violated by quantum mechanics. Both hypotheses are
      load-bearing; an account with definite properties but invasive measurements is
      untouched. That is the compartment this programme occupies, stated rather than
      implied.
    person: >
      Anthony Leggett, born in London in 1938, read Greats -- classics -- at Oxford before
      switching to physics, a route that no longer exists. Doctorate under Dirk ter Haar,
      twenty years at Sussex, then the University of Illinois at Urbana-Champaign from 1983.
      The 2003 Nobel Prize was for superfluid helium-3.

      The inequality, with his student Anupam Garg in 1985, was not foundations tourism:
      Leggett has argued seriously for decades that quantum mechanics might actually FAIL at
      macroscopic scales, and the inequality was built as the instrument to catch it
      failing. The experiments keep siding with quantum mechanics, which Leggett -- to his
      credit -- keeps reporting.
    term: Leggett-Garg inequality
    eponyms: [Leggett]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Leggett%E2%80%93Garg_inequality

  - slug: loewner-order
    hook: >
      What 'bigger' means for operators -- and the strange discovery that taking squares
      breaks it while taking square roots does not.
    layman: >
      Here is the problem. Quantum information runs on inequalities -- this entropy is at
      most that one, this channel loses at least this much -- but the objects being compared
      are operators, not numbers. What does A is at most B even mean for matrices?

      The Loewner order answers: A is at most B when their difference B minus A is positive
      semidefinite -- when it never produces a negative number from any state. Some pairs
      are simply incomparable; it is a partial order, and that is fine.

      The genuine surprise is which functions respect it. Send A and B, with A below B,
      through the square-root function: order preserved. Through the SQUARE: order can flip.
      Intuition trained on numbers fails at the second example, and half the classic
      blunders in operator inequalities are exactly this failure.
    in_csd: >
      The corpus's entropy and channel results are statements IN this order -- data
      processing, subadditivity, trace-distance contraction all compare operators. So are
      the operator-convexity results that support them.

      The machinery is imported, not claimed; what the corpus adds is formal verification,
      which for this topic has unusual value. Because naive number-intuition fails silently
      here, this is exactly the terrain where an informal proof can be confidently wrong --
      and where machine-checking pays for itself.
    mathematical: >
      A at most B iff B minus A is positive semidefinite. Operator monotone functions --
      those respecting the order under the functional calculus -- are characterised by
      Loewner's theorem: precisely the functions analytically continuing to map the upper
      half-plane to itself. Square root and logarithm qualify; the square does not. The
      corpus consumes the order throughout its entropy and channel chains.
    person: >
      Charles Loewner (1893-1968), born Karel Lowner near Prague, studied under Georg Pick
      at the German university there. His 1923 attack on the Bieberbach conjecture
      introduced an evolution equation that waited eighty years to become spectacularly
      famous -- as the Loewner in Schramm-Loewner evolution, now central to two-dimensional
      statistical physics.

      The operator-monotone characterisation is from 1934. Five years later the Nazi
      occupation forced him out of Prague; he restarted in America almost from zero --
      Louisville, Syracuse, finally Stanford from 1951, where he taught to the end. Two
      results, each a half-century ahead of its audience, from a man who had to rebuild his
      life in the middle.
    term: Loewner order
    eponyms: [Loewner]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Loewner_order

  - slug: mach-zehnder
    hook: >
      Split one particle down two paths and recombine it. Where it lands depends on both
      paths -- including the one you can prove it never took.
    layman: >
      Here is the problem in its cleanest hardware. A beam splitter sends light down two
      separate paths; mirrors bring the paths back together at a second beam splitter; two
      detectors wait at the outputs. Which detector fires depends on the DIFFERENCE between
      the two path lengths -- interference. So far, classical optics.

      Now dim the source until only one particle is in flight at a time. The interference
      stays. One photon, and its arrival statistics depend on both paths at once. Block
      either path and the interference dies instantly, replaced by a fifty-fifty split.

      Every hard question about quantum mechanics can be staged in this box: what happened
      in between? was there a path? when was it decided? That is why the box appears in
      every foundations argument since 1892.
    in_csd: >
      This is the standard arena for the corpus's interference twins -- the bomb tester and
      the quantum eraser both live inside it. Its value is diagnostic: it forces any account
      to say something definite about the unmeasured alternative, which is precisely where
      interpretations stop agreeing.

      The eraser variant is the sharpest instrument in the set: which-path information
      destroys interference, and DISCARDING that information afterwards restores it. Any
      story in which the particle simply took one definite path has real explaining to do
      about the restoration. CSD's account runs through the region structure rather than
      through path-stories, and reproducing both twins is treated as a pass-fail constraint,
      not decoration.
    mathematical: >
      Two balanced beam splitters, two paths, output intensities set by the relative phase
      between arms. Unlike the Michelson layout the paths are spatially separated and
      traversed once, which is what makes arm-specific interventions -- blockers, detectors,
      erasers -- cleanly statable, and hence what makes it the canonical which-path
      laboratory.
    person: >
      Ludwig Zehnder (1854-1949), Swiss, doctorate under Rontgen at Wurzburg, published the
      design in 1891; Ludwig Mach (1868-1951) refined it independently in 1892. Neither had
      quantum mechanics in mind -- the instrument was built for measuring refractive
      indices.

      The younger Mach was the son of Ernst Mach, whose positivism -- only what is
      observable is real -- shaped Einstein and the Vienna Circle. There is a neat irony in
      the son's instrument becoming, a century later, the standard stage for arguments about
      whether unobserved paths are real. The father would have had opinions.
    term: Mach-Zehnder interferometer
    eponyms: [Mach]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Mach%E2%80%93Zehnder_interferometer

  - slug: malus-law
    hook: >
      A cosine-squared law from 1808 -- discovered with a crystal and a sunset -- that turns
      out to be the Born rule's oldest data point.
    layman: >
      Here is the problem nobody knew was a problem. Pass polarised light through a second
      polariser tilted at some angle. How much gets through? Malus measured it in 1808: the
      fraction follows the square of the cosine of the angle. Aligned, everything passes;
      crossed, nothing; at forty-five degrees, exactly half.

      A century later quantum mechanics asked what happens when a SINGLE photon meets that
      tilted polariser -- and the answer is the same cosine squared, now as a probability.
      Malus had measured the Born rule before anyone knew there was a Born rule, before the
      photon, before probability entered physics at all.

      That makes it the oldest quantitative fact any theory of quantum probability must
      reproduce -- and the simplest test any such theory can face.
    in_csd: >
      The corpus derives this rather than assuming it: the region of states yielding pass
      occupies exactly the cosine-squared fraction of the state space, measured with the
      forced measure. It is the smallest complete instance of the entire programme -- the
      one case where the full argument, regions and volumes and all, can be followed by hand
      on the back of an envelope.

      That is also its danger, flagged where the corpus uses it: this is a two-level system,
      and the two-level case is deceptively special. The sphere makes the geometry so
      tractable that it is easy to mistake the special case for the general one. Smallest
      instance, best pedagogy, worst extrapolation.
    mathematical: >
      Transmitted fraction equals cosine squared of the angle between polariser settings --
      identically the Born weight for the corresponding spin measurement. In the corpus it
      is a volume ratio: the pass-region's Fubini-Study measure over the total, computed
      exactly on CP^1.
    person: >
      Etienne-Louis Malus (1775-1812) was a soldier-scientist of the Napoleonic era: Ecole
      Polytechnique in its first cohort, then an engineer on the Egyptian campaign, where he
      survived plague at Jaffa and never fully recovered his health.

      The discovery is the stuff of legend, and for once the legend is documented: in 1808,
      in his rooms on the Rue d'Enfer, he idly examined the sunset reflecting off the
      windows of the Luxembourg Palace through a calcite crystal -- and noticed the doubled
      image dimming and brightening as he rotated the crystal. Reflected light was
      polarised; nobody had known. He named polarisation, won the Academy prize for double
      refraction, and was dead at thirty-six.
    term: Malus's law
    eponyms: [Malus]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Malus%27s_law

  - slug: mermin-inequality
    hook: >
      Add more particles and the quantum-classical conflict grows exponentially. It does not
      average out. It compounds.
    layman: >
      Here is a natural guess: quantum weirdness is a small-systems phenomenon, and as you
      add particles it washes out into classical behaviour. Averages of averages, and the
      strangeness dilutes.

      Mermin's inequalities say the opposite happens. Take the Bell setup and add parties --
      three particles, four, ten. The gap between what quantum mechanics delivers and what
      any common-sense account allows does not shrink. It grows exponentially with the
      number of particles. Each added party doubles the headroom, roughly.

      So the conflict with local realism is not a fragile corner-case of tiny systems. It is
      a structural feature that gets more pronounced with size, which is the reverse of what
      the wash-out intuition predicted.
    in_csd: >
      The corpus carries the multi-party inequalities so its contextuality results are not
      hostage to the smallest case, and the exponential growth is the actual point of doing
      so. A substrate mechanism that happened to reproduce the two-party violation by some
      special trick would be exposed here: whatever produces the correlations has to keep
      producing them, more strongly, as parties are added.

      Together with GHZ this establishes the conflict at every size and in both logical
      shapes -- statistical and deterministic. That is the standard a substrate account must
      meet, and the corpus states the standard before claiming to meet it.
    mathematical: >
      A family of multipartite Bell inequalities whose classical bound is exceeded by
      quantum mechanics by a factor growing exponentially in the number of parties -- 2 to
      the power (n-1)/2 for n parties.

      The corpus proves the quantum value and the classical bound separately, which keeps
      the exponential gap a theorem rather than a plot.
    person: >
      David Mermin, born 1935, took his degrees at Harvard and spent his career at Cornell,
      much of it directing the Laboratory of Atomic and Solid State Physics. With Ashcroft
      he wrote the solid-state textbook that trained a generation.

      He is that rare thing, a physicist whose prose is part of his scientific reputation.
      The phrase shut up and calculate is his -- coined in 1989 as a description of an
      attitude he was criticising, then promptly attributed to Feynman and quoted with
      approval, a fate he has written about with resignation. The multi-party inequalities
      are from 1990, in a paper short enough to read over coffee, turning the GHZ conference
      argument into something an experiment could score.
    term: Mermin inequality
    eponyms: [Mermin]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/GHZ_experiment

  - slug: pauli-matrices
    hook: >
      Three little matrices that carry the entire two-level world -- and whose refusal to
      commute is the uncertainty principle in its smallest packaging.
    layman: >
      Here is the problem. The simplest quantum system has to describe spin measurements
      along ANY direction in three-dimensional space -- infinitely many possible questions
      -- with an economy fitting its two levels. What is the minimal toolkit?

      Three matrices, one per axis. Every observable of a two-level system is a mix of these
      three and the identity; a measurement along any tilted direction is the corresponding
      mix of the three. Four building blocks, all questions answered.

      Their crucial property is what they refuse to do: commute. Measuring along x then z
      differs from z then x, by a computable amount -- and that failure IS the uncertainty
      principle for spin, not an analogy to it. The whole two-level world, weirdness
      included, fits in these three matrices.
    in_csd: >
      These are the workhorses wherever the corpus touches spin: Bell and GHZ detector
      settings are built from them, singlet correlations computed through them, the
      Tsirelson bound proved in terms of them, the Bloch geometry is theirs.

      The corpus claims nothing about the matrices -- they are two centuries of linear
      algebra -- but their concreteness is doing real work. The empirical twins are exact
      finite computations rather than schematic arguments precisely because the settings are
      explicit matrices, and several results that would be awkward abstractly become
      arithmetic in this basis.
    mathematical: >
      Three traceless Hermitian involutions, pairwise anticommuting; with the identity they
      form a basis of two-by-two Hermitian matrices. Exponentials of i times their real
      combinations generate SU(2), the double cover of the rotation group -- which is why a
      spin-half state needs two full turns to return to itself, sign included.
    person: >
      Wolfgang Pauli (1900-1958) was born in Vienna -- Ernst Mach was his godfather -- and
      announced himself at nineteen with a review of general relativity that Einstein
      praised in print. Doctorate under Sommerfeld at Munich; the exclusion principle at
      twenty-four; the ETH Zurich chair from 1928; Princeton for the war; Nobel in 1945.

      He was the century's most feared critic -- not even wrong is his epitaph for
      untestable theorising -- and its most collegial: half the era's results were sharpened
      in savage letters from Zurich. The matrices come from his 1927 theory of spin. His
      decades-long correspondence with Carl Jung about physics and the psyche remains the
      strangest document left by any major physicist.
    term: Pauli matrices
    eponyms: [Pauli]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Pauli_matrices

  - slug: peres-criterion
    hook: >
      An entanglement test you can run with a pencil: transpose half the system and watch
      for a negative eigenvalue.
    layman: >
      Here is the problem. Correlation is not entanglement. Two systems can be correlated
      for boring reasons -- they were stamped from the same template -- and telling boring
      correlation from genuine entanglement is, in general, a provably hard computational
      problem. Is there at least a quick test that catches some of it?

      Peres found one of startling simplicity. Take the joint description. Apply
      transposition -- a bookkeeping reflection, harmless on any single system -- to ONE
      HALF only. If the result is no longer a legitimate state (a negative eigenvalue
      appears), the original was entangled. Guaranteed.

      For the two smallest system pairs, the test is perfect in both directions. Beyond that
      it can miss -- there exist entangled states it passes -- and the ones it misses turn
      out to be strange objects in their own right: bound entangled, correlated but
      undistillable.
    in_csd: >
      The corpus carries this beside its Bell machinery because the two detect different
      things, and conflating them is a standing error the programme cannot afford. Bell
      violation detects entanglement through statistics an experiment could show; the Peres
      test detects it through algebra on the description. They disagree: entangled mixed
      states exist that violate no Bell inequality.

      For a reconstruction, the distinction is load-bearing. Claims about non-locality and
      claims about entanglement have different scopes, and the corpus keeps separate
      instruments for them precisely so its theorems say what they say and no more.
    mathematical: >
      Separable implies positive partial transpose; the converse holds exactly in dimensions
      two-by-two and two-by-three (Horodecki), failing above, where PPT-entangled -- bound
      entangled -- states exist. The test itself is one eigenvalue computation, which is its
      entire charm given that separability in general is NP-hard.
    person: >
      Asher Peres (1934-2005) was born Aristide Pressman in Beaumont-de-Lomagne, France, to
      Polish-Jewish parents; the family survived the occupation in hiding, and he took a
      Hebrew name on emigrating to Israel in 1949. Doctorate at the Technion under Nathan
      Rosen -- the R of EPR -- and a Technion career thereafter: foundations pursued one
      degree of separation from the founding paradox.

      The criterion is from 1996; quantum teleportation, co-authored, from 1993; his 1993
      textbook remains the field's standard for saying exactly what is meant. His epigram --
      unperformed experiments have no results -- is quoted by every camp in the
      interpretation wars, each certain it supports them.
    term: Peres criterion
    eponyms: [Peres]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Peres%E2%80%93Horodecki_criterion

  - slug: poisson-bracket
    hook: >
      Classical mechanics' answer to the commutator -- same algebra, different century. The
      rhyme between them is why a deterministic flow can wear quantum clothes.
    layman: >
      Here is the problem, from the classical side. You want one machine that answers: how
      fast does ANY quantity change as a system moves? Not just position or momentum --
      energy, angular momentum, anything.

      The Poisson bracket is that machine. Feed it your quantity and the total energy; out
      comes the rate of change. All of classical dynamics compresses into one line: change
      equals bracket with the energy.

      The astonishment came a century later. The quantum commutator -- the order-of-
      operations mismatch -- obeys exactly the same algebraic laws: antisymmetry, the
      product rule, the Jacobi identity. Dirac spotted the rhyme within months of quantum
      mechanics existing and made it the quantisation recipe: keep the algebra, swap the
      bracket. Two theories, one grammar.
    in_csd: >
      For CSD the rhyme is not a curiosity -- it is the load-bearing wall. The programme's
      ontic side is a deterministic Hamiltonian-style flow; its epistemic side is operator
      dynamics with commutators. The claim that these are two descriptions of ONE thing,
      rather than an analogy, stands on the two brackets sharing their algebra.

      Honest scope: the corpus's formal content here is at the pointwise and volume level --
      the Kahler compatibility, the measure invariance. The full symplectic-manifold story
      is beyond the proof assistant's current libraries and is recorded as a gap, not
      glossed as done.
    mathematical: >
      The bilinear antisymmetric bracket on phase-space functions induced by the symplectic
      form; satisfies Jacobi; generates Hamiltonian flow via f-dot equals bracket of f with
      H. Its algebraic agreement with the commutator underwrites Dirac's quantisation
      dictionary. In the corpus: pointwise Kahler compatibility and measure invariance are
      formal; manifold-level symplectic geometry is a recorded gap.
    person: >
      Simeon Denis Poisson (1781-1840) was born at Pithiviers, arrived at the Ecole
      Polytechnique in 1798, and was immediately marked by Laplace and Lagrange as the
      coming man. He stayed within the Paris institutions all his life and put his name on
      more mathematics than almost anyone: the distribution, the equation, the ratio, the
      bracket -- the last from an 1809 memoir on planetary perturbation.

      The distribution, now everywhere, debuted in a book about the probability of criminal
      verdicts and was ignored for half a century. He was also, as an examiner, one of the
      officials who failed to recognise Galois -- a reminder that even the great ones grade
      badly.
    term: Poisson bracket
    eponyms: [Poisson]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Poisson_bracket

  - slug: ramsey-interferometry
    hook: >
      Two quick nudges separated by a long silence measure a frequency better than any
      amount of shouting. Every atomic clock is this trick.
    layman: >
      Here is the problem. To measure a system's natural frequency you drive it and watch
      the response -- but the driving itself muddies the measurement. The longer and harder
      you push, the more your push distorts the thing you are trying to read. Precision
      seems self-limiting.

      Ramsey's escape: barely push at all. One brief pulse to start the system oscillating,
      then a long stretch of nothing -- free, undisturbed evolution -- then a second brief
      pulse and a look. The phase accumulated during the silence shows up as interference
      fringes, and the longer the silence, the finer the fringes. The measurement's
      sharpness comes from the interval when nobody is touching anything.

      Caesium clocks run on this. So, therefore, does the definition of the second -- and
      GPS, downstream of it.
    in_csd: >
      This sits in the corpus's metrology strand, and the classification is stated rather
      than implied: an adjacent arm, consuming the reconstruction rather than contributing
      to it. States, Born rule, unitary dynamics go in; precision bounds and the protocols
      achieving them come out.

      The reason to carry it: a formalisation with claims to practical reach should be able
      to state the standard quantum limit, the Heisenberg scaling entanglement buys, and the
      protocol geometry connecting them. The corpus can, and this is the protocol.
    mathematical: >
      Two pulses separated by free evolution time T; the accumulated relative phase produces
      fringes with spacing inversely proportional to T. The linewidth is set by the free
      interval, not the drive -- the structural reason the method beats continuous
      interrogation and anchors frequency standards.
    person: >
      Norman Ramsey (1915-2011), born in Washington DC to an army family, collected degrees
      at Columbia and Cambridge and trained under Rabi -- whose molecular-beam resonance
      method he would decisively improve. War work: radar at the MIT Radiation Lab, then Los
      Alamos, where he headed the group delivering the weapons on Tinian.

      The separated-oscillatory-fields method is from 1949, his first year at Harvard, where
      he then stayed forty years. The Nobel committee got to it in 1989, when Ramsey was
      seventy-four -- a forty-year lag that he outlived comfortably, remaining
      scientifically active into his nineties.
    term: Ramsey interferometry
    eponyms: [Ramsey]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Ramsey_interferometry

  - slug: schrodinger-equation
    hook: >
      The equation is not postulated here. It is what any continuous, symmetry-preserving
      flow is forced to look like.
    layman: >
      Here is the problem. The Schrodinger equation is the law of motion for quantum states,
      and the textbook justification for it is: it works. Fair enough as physics. But as an
      explanation it is circular -- why this equation and not another? What about quantum
      states makes this the only way they could move?

      CSD's answer is that the equation is a theorem, not a choice. Suppose only two things
      about the underlying motion: it preserves the measurable relations between states, and
      it does not jump. Rigidity then forces it to act as a unitary symmetry at every
      moment. Continuity forces those symmetries to have a generator. Assemble the pieces
      and the familiar equation appears, with the Hamiltonian in the role of generator.

      Nothing about waves went in. Nothing about energy went in. Preserve the overlaps, do
      not jump -- that is the entire input.
    in_csd: >
      This is the second of the programme's two pillars, the Born rule being the first, and
      the corpus proves both on a single sector so that they are one story about one object.
      A reconstruction that derived probability on one arena and dynamics on another would
      not have shown they belong to the same theory. Here they demonstrably do.

      The route is Wigner rigidity followed by finite-dimensional Stone -- the two
      unconditional necessities, chained. And the honest caveat is stated where it belongs:
      the sector itself is posited, not derived. What is proved is that any flow on such a
      sector must take the Schrodinger form. Whether the world contains such a sector is
      exactly the kind of question a formal corpus cannot settle.
    mathematical: >
      For a strongly continuous projective flow preserving transition probabilities, the
      induced evolution is a one-parameter unitary group, hence generated by a Hamiltonian
      -- the usual equation of motion, up to phase.

      The phase is where a residue lives. Lifting a projective flow to a genuine unitary
      group requires killing a cocycle, and Bargmann's theorem, which does that from
      continuity alone, is beyond the proof assistant's current reach. So the lift carries a
      coboundary datum as an explicit hypothesis, recorded rather than hidden.
    person: >
      Erwin Schrodinger (1887-1961) was born in Vienna, held positions at Jena, Stuttgart,
      Breslau and Zurich, and succeeded Planck in Berlin in 1927. The equation was written
      over Christmas 1925 and the weeks after, at the Villa Herwig in Arosa in the Swiss
      Alps. He shared the 1933 Nobel Prize with Dirac -- the same year he left Germany in
      disgust at the regime, though he was not himself Jewish.

      After an ill-judged return to Austria and a hurried escape from Graz in 1938, he
      settled at the Dublin Institute for Advanced Studies, created for him by de Valera,
      and stayed seventeen years.

      The famous cat, from 1935, was not an illustration. It was an attack -- a reductio
      against the standard reading of his own equation. History's little joke is that it is
      now the standard classroom illustration of the very thing it was built to refute.
    term: Schrodinger equation
    eponyms: [Schrodinger]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Schr%C3%B6dinger_equation

  - slug: shor-algorithm
    hook: >
      Factoring in polynomial time -- the theorem that turned quantum computing from a
      curiosity into a budget line, and made every deployed cryptosystem provisional.
    layman: >
      Here is the problem. Multiply two large primes: instant. Recover the primes from the
      product: with the best classical methods, effectively forever once the numbers are big
      enough. That one-way-street is not a theorem, but it is the working assumption -- and
      most public-key cryptography protecting the internet leans on it.

      Shor's 1994 algorithm breaks the street. A quantum computer can factor in polynomial
      time. The route is indirect and elegant: factoring reduces, by classical number
      theory, to finding the period of a repeating sequence -- and period-finding is exactly
      what quantum interference does well. Load all values in superposition, apply the
      quantum Fourier transform, and the period stands out like a struck bell.

      Sufficiently large machines do not exist yet. The mortgage on current cryptography
      has, nonetheless, been signed.
    in_csd: >
      The most demanding of the corpus's algorithm witnesses, and the disclaimer is
      standing: witnesses mark scope, they do not support foundations. What makes this one
      heavy is the plumbing -- the reversible modular arithmetic beneath the algorithm is
      built and verified in full, adders and multipliers and all, because that is where a
      formalisation either survives or quietly cheats.

      The corpus makes no cryptographic claims, and the cost-model work bearing on real
      machines was deliberately extracted to a separate repository. What remains here is the
      existence proof: the formalised dynamics carries a complete, real algorithm end to
      end.
    mathematical: >
      Quantum order-finding extracts the period of modular exponentiation in polynomial time
      via the quantum Fourier transform; a classical reduction, essentially Legendre-era
      number theory, converts the period into a factor with high probability. The quantum
      content is entirely the period-finding; the corpus's labour is mostly the verified
      reversible arithmetic underneath it.
    person: >
      Peter Shor, born 1959, was an Olympiad medalist, took degrees at Caltech and MIT, and
      was at Bell Labs when he announced the algorithm in 1994. The community's reaction was
      unusually theatrical: word spread from a small talk before the paper existed, and
      within weeks half of physics had opinions about a result almost nobody had read.

      The objection came instantly -- decoherence would kill any real machine -- and Shor
      answered it himself in 1995 with the first quantum error-correcting code, dispatching
      the counterargument to his own revolution. He moved to MIT in 2003. Few people have
      built both a field's central promise and its central defence.
    term: Shor's algorithm
    eponyms: [Shor]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Shor%27s_algorithm

  - slug: stern-gerlach
    hook: >
      The atoms split into two clean beams instead of a smear -- and sorting them twice,
      along different axes, unsorts them. Measurement's whole strangeness in one 1922
      apparatus.
    layman: >
      Here is the problem the experiment was built for -- and the bigger one it found.
      Classical physics says atoms shot through an uneven magnetic field should smear
      continuously, their randomly tilted magnetic axes deflected by every amount. The old
      quantum theory said: discrete lumps. Stern built the apparatus to referee.

      The atoms split into two sharp beams. Point for quantisation. But the deeper shock is
      the second act: take the up beam from one magnet and pass it through another, tilted.
      It splits again -- and the original sorting is GONE. Re-measure along the first axis
      and up-ness has been forgotten.

      Measurements do not read off pre-existing labels. Asking a new question erases the
      answer to the old one. That is the finding under the finding, and it has never stopped
      being strange.
    in_csd: >
      The corpus's reference measurement, and the second act is the part that earns the
      place. Discreteness is cheap -- any theory with the right spectrum delivers it. The
      unsorting is contextuality in its most concrete laboratory form, and it is what a
      substrate account must PRODUCE, not excuse.

      CSD produces it structurally: the measurement context fixes which partition of the
      epistemic space the outcome is read against. The tilted magnet is a different context,
      hence a different partition, and a second sorting reads a different question of the
      same microstate -- not a stored answer to the old one. The forgetting is not decay of
      a label; there was never a label, only a state and a context.
    mathematical: >
      Spatial separation of beams by the eigenvalues of the spin component along the field
      gradient; sequential measurements along non-commuting axes fail to preserve earlier
      outcomes. Historical footnote with content: the experiment predates spin -- it was
      designed for orbital angular momentum in the old quantum theory, and the right answer
      emerged from two errors cancelling, understood only years later.
    person: >
      Otto Stern (1888-1969), born at Sohrau in Upper Silesia to a Jewish grain-milling
      family, was Einstein's first pupil in Prague and followed him to Zurich before
      settling at Frankfurt, where the experiment ran in 1922. Walther Gerlach (1889-1979),
      from Biebrich, doctorate at Tubingen, was the experimental hand.

      The beloved detail is documented: the silver deposit was invisible until Stern's
      breath -- heavy with sulphur from cheap cigars -- developed it like a photograph. The
      aftermath is the era in miniature: Stern left in 1933 for Carnegie Tech in Pittsburgh
      and the 1943 Nobel; Gerlach stayed, headed the Reich's uranium programme by war's end,
      and spent 1945 interned at Farm Hall, where the captured transcripts record the German
      physicists learning of Hiroshima.
    term: Stern-Gerlach experiment
    eponyms: [Stern]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Stern%E2%80%93Gerlach_experiment

  - slug: contextuality
    hook: >
      For some sets of quantum questions, no consistent answer sheet exists at all. CSD's
      response: stop demanding one answer per question, and say what the answer depends on.
    layman: >
      Here is the problem. You would like to believe a measurement reveals a property the
      system already had -- and that the property does not care what else you happened to
      measure alongside it. Call that the answer-sheet picture: every question has a pre-
      written answer, and companion questions are irrelevant.

      Quantum mechanics refutes the picture outright. There are collections of questions for
      which no answer sheet exists -- not hidden, not hard to find, but provably
      nonexistent, once you demand each answer stay the same across the different companion
      sets it could appear with. And this is not disturbance: the companion measurements are
      compatible, and need not touch the system at all.

      The conclusion has a name: outcomes are contextual. What you get depends on the
      company the question keeps.
    in_csd: >
      CSD does not grudgingly accommodate contextuality. It is built from it, and the
      distinction matters, because contextuality is usually presented as a tax that hidden-
      variable theories reluctantly pay. Here it is the architecture.

      The mechanism: the substrate holds a definite microstate, and a measurement context
      fixes which partition of the epistemic space the outcome is read against. Change the
      context, change the partition -- so the same microstate can honestly answer
      differently. Nothing hidden, nothing disturbed, no answer sheet ever demanded.

      The corpus proves both halves: the obstruction (no global assignment matches the
      singlet) and the existence (an explicit contextual model that does). Impossibility
      plus a working alternative is the two-sided claim; either half alone would be much
      weaker.
    mathematical: >
      Over one shared measurable state space, no jointly-defined outcome assignment for the
      four CHSH settings reproduces the singlet correlations; likewise over any shared
      probability space at every setting pair, and for GHZ.

      One conflation to avoid, flagged in the corpus itself: its fibre analysis --
      contextual content must leave the projective base for N of three and above -- is NOT a
      Kochen-Specker or Gleason consequence. Those constrain non-contextual assignments,
      which this account never makes. The fibre obstruction comes from covariance plus non-
      negativity, a different argument with a different shape.
    term: Contextuality
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: no_compatible_global_chsh_assignment_realises_singlet
    external:
      - text: "Stanford Encyclopedia: the Kochen-Specker theorem"
        url: https://plato.stanford.edu/entries/kochen-specker/

  - slug: hidden-variables
    hook: >
      The no-go theorems do not kill hidden variables. They price them. CSD reads the price
      tag and pays.
    layman: >
      Here is the problem. If the quantum state describes knowledge rather than the world,
      there has to be something the knowledge is about -- an underlying state of affairs,
      definite whether or not anyone looks. Theories that supply one are called hidden-
      variable theories, and a famous sequence of theorems is widely reported to have ruled
      them out.

      The reports are wrong, in an instructive way. What Bell and his successors actually
      ruled out are the well-behaved hidden-variable theories: the local ones, and the ones
      assigning values independent of measurement context. Hidden variables survive -- at
      the stated price of locality and non-contextuality.

      That is not a loophole. It is the theorem's actual content. Bohmian mechanics has been
      paying the price since 1952, and remains the standing proof that the reports of death
      were exaggerated.
    in_csd: >
      The constraint surface is a hidden-variable theory in the technical sense, and the
      programme says so out loud rather than hoping nobody asks. It is contextual and non-
      local -- exactly the two properties whose absence the theorems forbid -- and it proves
      the relevant obstructions in-house rather than citing them, since a reconstruction
      resting on trust in the theorems that constrain it would be oddly built.

      Two standard misreadings, both worth killing. First: CSD is not a repair of quantum
      mechanics. It reproduces the same predictions at leading order; candidate departures
      are recorded as owed by the papers, not claimed. Second: the quantum state is NOT the
      hidden variable. The state is the summary. The hidden variable is the point of the
      constraint surface underneath -- which is why the state can be epistemic without the
      theory being about nothing.
    mathematical: >
      No product partition of a shared hidden-state space reproduces the singlet
      correlations, at any setting pair; likewise GHZ. Proved over arbitrary measurable
      state spaces, so the constraint hits the class, not one construction.

      The positive half is also in the corpus: an explicit contextual, non-local assignment
      that does reproduce the singlet. Together the pair delimits the viable region from
      both sides -- what cannot work, and one thing that does.
    term: Hidden variables
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF6/ForcedContextuality.lean
      theorem: no_product_partition_realises_singlet
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hidden-variable_theory

  - slug: measurement-problem
    hook: >
      Quantum mechanics contains two incompatible rules and no instruction for when to
      switch. CSD replaces the switch with a theorem about what no dynamics can do.
    layman: >
      Here is the problem -- arguably THE problem. Left alone, a quantum system evolves
      smoothly, reversibly, keeping every superposition intact. Measured, it delivers one
      definite outcome and the alternatives vanish. The theory contains both behaviours and
      refuses to say where one ends and the other begins. What counts as a measurement? A
      detector? An eyeball? A graduate student?

      This is not a philosophical itch. The two rules are mathematically incompatible -- one
      linear and reversible, the other neither -- so a theory holding both without a
      boundary is not a closed description of anything.

      Every serious interpretation is, at bottom, a proposal for which rule to sacrifice.
      Many-Worlds keeps the smooth evolution and drops definite outcomes. Collapse theories
      keep the outcomes and modify the evolution. The question is old, unresolved, and
      entirely legitimate.
    in_csd: >
      CSD's move: nothing abrupt ever happens on the substrate. The underlying motion is
      deterministic and volume-preserving throughout; what changes at a measurement is which
      region of the epistemic space the trajectory gets recorded against. Both textbook
      rules become views of one process.

      What keeps this from being just another story is the trilemma -- three theorems that
      stake out what any account must give up. No volume-preserving map implements exact
      collapse. No continuous dynamics correlates a pointer perfectly everywhere on a
      connected arena. And approximate collapse has a stated price: accuracy costs ready-
      state improbability, quantitatively.

      So the corpus does not dissolve the measurement problem by narrative. It proves which
      combination of desiderata is impossible, then says openly which one CSD abandons. That
      is what separates a result from an interpretation.
    mathematical: >
      Three impossibility results on the pointer arena: no exact collapse by a measure-
      preserving map; no everywhere-correlating continuous propagator on a connected arena;
      a quantitative accuracy-versus-improbability bound.

      All three are CSD-free in statement -- measure theory, topology, and an estimate
      respectively. Any rival account with the corresponding structure inherits them. They
      cannot be cited against this programme without being cited against the citer.
    term: Measurement problem
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/RecordLayer/MeasurementConstraints.lean
      theorem: no_exact_collapse
    external:
      - text: "Stanford Encyclopedia: measurement in quantum theory"
        url: https://plato.stanford.edu/entries/qt-issues/

  - slug: collapse
    hook: >
      The state never jumps here -- and that is a theorem about volume-preserving maps, not
      a preference about interpretations.
    layman: >
      Here is the problem. The textbook says that when a measurement happens, the state
      discontinuously jumps to match the outcome. Is that jump a physical event, or an
      update to a description? The dispute is as old as the theory, and the stakes are real:
      a physical jump would be abrupt, irreversible, unexplained by any equation in the
      theory, and apparently instantaneous across any distance.

      An update, on the other hand, needs no physics at all -- when you learn which box the
      ball is in, your probabilities collapse and nobody is alarmed. The whole question is
      whether quantum collapse is more like the ball.

      CSD's answer is the ball -- but with a twist that makes the answer checkable rather
      than rhetorical: on a volume-preserving substrate, a physical collapse is not merely
      unnecessary. It is impossible.
    in_csd: >
      The corpus proves that no measure-preserving map implements exact collapse. So a
      deterministic, volume-conserving substrate could not contain a collapse process even
      if its designer wanted one. The stance becomes a constraint -- and CSD is on the
      record as unable to cheat.

      What replaces the jump is a record. System and apparatus evolve together under the one
      dynamics; the record fixes which epistemic region the trajectory realises; and the
      update rule the textbook postulates separately falls out of the record construction.
      The thing that changes discontinuously is the summary. The world underneath does what
      it was always doing.
    mathematical: >
      No measure-preserving map on the arena implements exact collapse. Approximate collapse
      exists but is priced: accuracy is bounded against ready-state improbability, with the
      exchange rate explicit.

      The post-measurement update is then derived rather than postulated -- it appears as
      the block projection realised on the pointer arena, an output of the record
      construction.
    term: Collapse
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/RecordLayer/MeasurementConstraints.lean
      theorem: no_exact_collapse
    external:
      - text: "Stanford Encyclopedia: collapse theories"
        url: https://plato.stanford.edu/entries/qm-collapse/

  - slug: typicality
    hook: >
      Probability without randomness: the world is deterministic, you do not know which
      state you have, and the odds are the sizes of the possibilities.
    layman: >
      Here is the problem. If the universe is deterministic, probabilities cannot come from
      genuine chance -- there is none. Yet quantum experiments deliver rock-solid
      statistics. Where do the numbers come from?

      From counting. Fix everything your preparation procedure controls; a vast set of
      microstates remains compatible with it; you do not know which one you got. Ask what
      fraction of that set leads to each outcome, and those fractions are the probabilities.
      Nothing is random -- you are ignorant, and the ignorance is quantified by sizes of
      sets. This is exactly how Boltzmann explained why gases equilibrate, imported into
      quantum foundations.

      The classic objection is as old as the move: fractions depend on how you measure the
      sets. Choose the measure to taste and the argument justifies anything. Any typicality
      account lives or dies by its answer to that.
    in_csd: >
      This is the engine of the whole programme, and both of its classic failure modes are
      addressed by theorems rather than by assurances.

      The measure objection: CSD's measure is forced by symmetry, uniquely, with a proof.
      There is no other invariant option to have chosen. That is the direct answer to the
      Valentini-style circularity charge, and it is the single most load-bearing fact in the
      corpus.

      The route matters too. Frequencies come from the law of large numbers over repeated
      preparations -- not from ergodicity, not from a single trajectory exploring the space.
      The corpus records the single-flow route as a proved dead end: one projective flow
      demonstrably cannot pin the measure. That tombstone is kept visible so nobody wanders
      back down the road.
    mathematical: >
      For independent trials, observed relative frequencies converge almost surely to volume
      fractions; combined with Born-weight-equals-volume-ratio, this yields Born frequencies
      at general dimension.

      Two honest notes. The independence hypothesis is pairwise, weaker than the usual
      statement. And the corpus flags an open debt: a deterministic substrate owes an
      account of why repeated preparations are independent at all -- and a substrate with
      memory would show departures from i.i.d. shot noise. That is one of the few places CSD
      could differ observably from quantum mechanics, at laboratory energies.
    term: Typicality
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF1/GeneralFrequency.lean
      theorem: freq_tendsto_of_iid
    external:
      - text: "Goldstein, typicality in statistical mechanics and quantum theory"
        url: https://arxiv.org/abs/1110.1349

  - slug: psi-epistemic
    hook: >
      The quantum state is what you know, not what exists. The hard part was always saying
      what it is knowledge OF -- and CSD's whole architecture is an answer to that.
    layman: >
      Here is the problem. Two readings of the quantum state have fought for a century.
      Realist: the state is a physical thing, so its jump on measurement is a physical
      process needing an explanation the theory does not give. Epistemic: the state is a
      description of what someone knows, so the jump is just an update -- learn something,
      revise -- no more mysterious than a poker player recalculating after seeing a card.

      The epistemic reading dissolves the measurement problem, which is its great charm. Its
      great embarrassment is the follow-up question: knowledge of WHAT? If there is nothing
      underneath, the reading says the theory is about nothing in particular. And theorems
      from the last fifteen years -- PBR most famously -- make naive versions of the
      underneath very hard to hold.

      So the position is attractive, constrained, and incomplete without a floor.
    in_csd: >
      CSD is psi-epistemic with a floor. The state is knowledge of which region of the
      constraint surface the microstate occupies. There is a fact underneath -- one point,
      one trajectory -- and the state summarises what a preparation pins down about it.

      Everything in the programme sorts into two levels, and keeping them apart is the
      discipline the whole account depends on. Epistemic: the projective state space, the
      outcome regions, the probabilities. Ontic: the substrate and the measure that weights
      it. The corpus's fibre analysis sharpened the split late in the day: the projective
      space turns out to be a lossy projection, with the record-forming content living above
      it, not on it.

      This entry carries no theorem, and says so. It is the reading OF the theorems -- the
      anchored entries hold the formal content.
    mathematical: >
      Positional, not proved. The formal counterpart is the two-level structure itself:
      outcome partitions live on the projective space, the typicality measure lives on the
      substrate.

      Which literature constraints bite -- PBR and its relatives -- depends delicately on
      what the state is taken to be knowledge of, and on the ontology's independence
      assumptions. The corpus does not currently formalise that boundary; a reader should
      treat it as live terrain rather than settled ground.
    term: Psi-epistemic
    status: definition
    source: curated
    external:
      - text: "Epistemic views of the quantum state"
        url: https://en.wikipedia.org/wiki/Epistemic_view_of_quantum_states

  - slug: determinism
    hook: >
      The substrate has no dice. The spread in the data is variation in what your
      preparation could not pin down.
    layman: >
      Here is the problem. Prepare two systems as identically as any procedure allows,
      measure them identically, and quantum mechanics happily reports different outcomes --
      offering no reason why this one rather than that. Either the world contains genuine
      chance, or the preparations were not actually identical.

      Determinism takes the second answer. The systems agreed on everything the procedure
      fixed, and differed in what it could not fix. The observed spread is that hidden
      variation showing through, and probability is bookkeeping for ignorance -- the same
      move classical statistical mechanics has always made about gases.

      Whether that answer is still available after the no-go theorems is not a matter of
      taste. It survives, at the stated price: contextuality and non-locality. See those
      entries for the receipts.
    in_csd: >
      The substrate's motion is deterministic and volume-preserving; chance appears nowhere
      in the dynamics. Probability enters exactly once -- as ignorance of the microstate
      within the region a preparation fixes -- and the forced measure turns that ignorance
      into unique numbers.

      The honest debt is recorded rather than buried, and it is the interesting part. The
      frequency argument assumes independent trials. A deterministic substrate with memory
      would violate that, showing up as deviations from ordinary shot noise in high-
      statistics data. This is one of the very few places CSD could differ measurably from
      quantum mechanics -- and it needs no Planck-scale machine, just patience and
      statistics.
    mathematical: >
      Positional. The formal content is the measure-preserving flow and the volume-ratio
      weights; determinism is the reading of that structure. The nearest formal object is
      the preservation field itself, carried as an ontic postulate and listed as such in the
      axiom ledger -- assumed for physical admissibility, not derived.
    term: Determinism
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: causal determinism"
        url: https://plato.stanford.edu/entries/determinism-causal/

  - slug: kochen-specker
    hook: >
      A finite list of directions in space with no consistent yes-no labelling.
      Contextuality by pure counting -- no experiment, no statistics, no separation.
    layman: >
      Here is the problem Bell left open. His argument needs two separated particles and
      statistics gathered over many runs -- so a determined skeptic could hope the trouble
      was about distance, or about probability. Is there a conflict that needs neither?

      Kochen and Specker built one. In three dimensions or more, there is a finite set of
      measurement directions that cannot be consistently labelled with answers at all. The
      labels must respect the algebra that the observables themselves satisfy, and no
      labelling does. Their original construction used 117 directions; the modern record is
      18. You can check it with a pencil.

      No experiment, no ensembles, no space-like separation. Just a finite combinatorial
      fact: the answer sheet does not exist, even for one particle, even in principle.
    in_csd: >
      CSD is contextual, so this theorem is a constraint it satisfies by construction -- no
      accommodation needed. What the corpus is genuinely careful about is a tempting
      misattribution nearby.

      The programme's fibre analysis found that at three levels and above, contextual
      content cannot live on the projective base and must move to the fibre above it. It
      would be natural -- and wrong -- to cite Kochen-Specker for that. KS constrains NON-
      contextual value assignments, and CSD never makes one, so the theorem simply does not
      engage. The fibre obstruction comes from covariance plus non-negativity: a different
      argument, a different shape. The corpus flags the distinction precisely because
      borrowing this theorem's authority would be such an easy overclaim.
    mathematical: >
      In dimension three and above, no non-contextual assignment of definite values to all
      observables respects the functional relations among commuting sets. Witnessed by
      explicit finite vector sets -- 117 originally, 18 in the smallest known.

      Dimension two escapes, the same exception that afflicts the original Gleason theorem,
      and one more instance of the qubit being a misleading guide to the general case.
    person: >
      Simon Kochen, Belgian-born, has spent his career at Princeton -- mostly in model
      theory and number theory; he later proved the free will theorem with John Conway.
      Ernst Specker (1920-2011) was Swiss, at the ETH Zurich for his whole career, working
      in logic and combinatorics.

      The publication story is unmatched. Specker published the core idea in 1960 -- in a
      THEOLOGY journal, Dialectica, framing it through a scholastic debate about whether God
      could know the answers to unasked questions. The joint theorem followed in 1967 in the
      Journal of Mathematics and Mechanics. From medieval counterfactuals to a pillar of
      quantum foundations, via the strangest venue in the subject's bibliography.
    term: Kochen-Specker theorem
    status: standard-mathematics
    source: curated
    external:
      - text: "Stanford Encyclopedia: the Kochen-Specker theorem"
        url: https://plato.stanford.edu/entries/kochen-specker/

  - slug: copenhagen
    hook: >
      The oldest position, and the one that declines the question: measurement is where the
      theory stops, not something it explains.
    layman: >
      Here is the problem Copenhagen answers -- by refusing it. Quantum mechanics needs a
      boundary between the quantum system and the classical apparatus that reads it. Where
      is the boundary? What happens at it?

      The traditional teaching account, associated with Bohr, treats the apparatus as
      classical by fiat and the state's jump on measurement as a primitive fact. More
      radically, Bohr held that the whole experimental arrangement determines what can
      meaningfully be said: asking what the electron was doing between measurements is not
      unanswered, it is rejected as meaningless.

      As a strategy this is not stupid -- it delivered a century of flawless physics, and
      its refusal to over-describe has aged better than several of its rivals' enthusiasms.
      But it is a decision not to explain, and everyone who wants an explanation eventually
      leaves it.
    in_csd: >
      The disagreement is narrower than the usual caricature. CSD agrees with Copenhagen
      that the state is not a physical object, and agrees that the classical-quantum
      boundary is where the real content lives. The parting of ways is one step further on:
      CSD declines to leave the boundary unanalysed.

      Here measurement is an ordinary physical interaction on the substrate that produces a
      record, and the two rules Copenhagen keeps apart -- smooth evolution, abrupt update --
      are one process seen at two levels of description. The contrast is interpretive, not
      empirical: no experiment distinguishes the two, and none is proposed. This entry
      states a position; there is no theorem behind it, and the missing anchor is
      deliberate.
    mathematical: >
      No formal content, and the absence is the information. The corpus contains nothing
      bearing directly on this position -- which is itself telling, since the disagreement
      is about whether the measurement boundary requires analysis, and no theorem settles a
      question of that kind.
    term: Copenhagen interpretation
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: the Copenhagen interpretation"
        url: https://plato.stanford.edu/entries/qm-copenhagen/

  - slug: many-worlds
    hook: >
      Keep the smooth evolution, drop the single outcome. CSD does the exact opposite -- one
      trajectory, one world, by settled commitment.
    layman: >
      Here is the problem Everett solved, at a price still being argued about. Take quantum
      evolution seriously as the whole story -- no collapse, no exceptions -- and after a
      measurement the apparatus and the observer are themselves in superposition, one branch
      per outcome. Something has to be said about that.

      Everett's move: say nothing is wrong. Every outcome happens. The branches decohere,
      stop interfering, and each contains an observer certain their result was the only one.
      Nothing is added to the formalism -- no collapse, no hidden variables -- which is the
      position's austere appeal.

      The cost surfaces at probability. If everything happens, what can it mean that one
      outcome was more probable than another? Counting branches gives the wrong answer. The
      decision-theoretic patches are ingenious and contested. That is the famous open wound
      of the interpretation.
    in_csd: >
      CSD is single-trajectory, and this is a settled commitment recorded in the programme's
      non-goals -- not an open question to be revisited. One microstate, one history, one
      outcome. The alternatives are regions of the epistemic space the trajectory did not
      enter; nowhere is there a branch where they occurred.

      The probability contrast is the instructive one. Everett's weight problem -- why
      observed frequencies match branch amplitudes -- does not arise here in that form,
      because there is always a definite state and probability is ignorance about it. The
      question becomes which measure weights the regions, and that has a proved answer: the
      unique symmetry-invariant one. Where the Everettian literature argues decision theory,
      this programme points at a uniqueness theorem. Positional entry; no theorem asserts
      it.
    mathematical: >
      No formal content. The formal contrast: outcome weights here are volume ratios on one
      constraint surface, so the measure problem is identifying a measure on a single space
      -- discharged by uniqueness under symmetry -- rather than justifying a weighting
      across many worlds, which is where Everettian effort concentrates.
    term: Many-Worlds interpretation
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: Everett's relative-state formulation"
        url: https://plato.stanford.edu/entries/qm-everett/

  - slug: bohmian-mechanics
    hook: >
      The nearest neighbour: deterministic, definite states, openly non-local. The fight is
      over where the probabilities come from.
    layman: >
      Here is the problem Bohm solved in 1952: prove, by construction, that a deterministic
      account of quantum mechanics is possible -- something the folklore of the time,
      leaning on von Neumann's flawed impossibility proof, said could not be done.

      The construction: particles have definite positions at all times, and a wave --
      evolving by the ordinary Schrodinger equation -- guides them. All quantum predictions
      come out exactly. The price is explicit non-locality: each particle's guidance depends
      instantaneously on where all the others are, across any distance. Bell, who admired
      the theory, showed that price is not Bohm's clumsiness but everyone's obligation.

      It remains the standing counterexample to every claim that quantum mechanics rules out
      determinism. Whatever else is true, that claim is dead.
    in_csd: >
      This is CSD's closest relative, and the family resemblance is real: determinism, a
      definite underlying state, non-locality accepted with open eyes, probabilities from
      ignorance. A reader placing CSD on the map should put it nearest here.

      The differences are ontological and, on one point, sharp. Bohm has a dual ontology --
      a physical guiding wave plus particle positions. CSD has one object, the constraint
      surface, with the quantum state demoted to epistemic bookkeeping; nothing guides
      anything. And the probability postulates differ in kind: Bohmian statistics require
      the quantum equilibrium hypothesis -- an assumed initial distribution, possibly
      relaxed into -- while CSD's measure is forced by a symmetry theorem. Where Bohmians
      must defend an initial condition, CSD points at uniqueness. That is the standing
      objection to Bohm that this programme claims to escape.
    mathematical: >
      No formal content in the corpus about the rival itself. The shared formal shape: both
      derive probabilities from a measure on an underlying state space rather than
      postulating the Born rule -- so both owe an account of the measure, and the accounts
      differ (assumed equilibrium there, forced uniqueness here).
    term: Bohmian mechanics
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: Bohmian mechanics"
        url: https://plato.stanford.edu/entries/qm-bohm/

  - slug: spontaneous-collapse
    hook: >
      The rival that changes the equations and can be killed by experiment. CSD, so far,
      cannot be -- and its own documentation says so.
    layman: >
      Here is the problem GRW attacked head-on: if collapse is real, put it in the
      equations. Ghirardi, Rimini and Weber modified quantum mechanics so that each
      particle's state spontaneously localises at random -- extraordinarily rarely, about
      once per hundred million years per particle.

      The trick is amplification. A cat contains a trillion trillion particles, all
      correlated, and one localisation anywhere drags the whole superposition down.
      Microscopic physics is untouched; macroscopic superpositions die in microseconds; no
      observer is ever mentioned.

      Because the modification has parameters -- a rate, a length -- it makes predictions
      that differ from standard quantum mechanics. Interferometry with large molecules and
      ultra-quiet mechanical sensors have been squeezing the allowed parameter space for
      decades. It might be refuted next year. That is a compliment: it is a theory, not an
      interpretation.
    in_csd: >
      The comparison is uncomfortable in a direction the corpus states plainly: GRW is
      falsifiable today and CSD is not. CSD reproduces standard quantum mechanics exactly at
      leading order; its candidate departures -- finite-sample statistics, corrections the
      papers have not yet pinned -- are recorded as owed, not claimed. One theory risks its
      neck; the other, so far, matches the textbook everywhere.

      Structurally the two could hardly differ more. GRW adds stochastic jumps to the
      dynamics; CSD's substrate is deterministic and volume-preserving, and the corpus
      proves that no volume-preserving process implements collapse -- so the very mechanism
      GRW adds is one CSD is formally barred from borrowing. Definite outcomes here come
      from records instead.
    mathematical: >
      No formal content about the rival. The formal boundary on CSD's side: no measure-
      preserving map implements exact collapse, so a GRW-style mechanism is unavailable to
      this substrate as a matter of theorem, not taste.
    term: Spontaneous collapse (GRW)
    status: definition
    source: curated
    external:
      - text: "Stanford Encyclopedia: collapse theories"
        url: https://plato.stanford.edu/entries/qm-collapse/

  - slug: qbism
    hook: >
      Epistemic all the way down: the state is one agent's betting book, and there is
      nothing underneath. CSD agrees about the state and insists on the underneath.
    layman: >
      Here is the problem QBism pushes to its logical end. Once you say the quantum state is
      not a physical thing -- that it represents somebody's information -- you owe an answer
      to: information about what? QBism's answer is bracing: about nothing beyond the
      agent's own future experiences. States are personal degrees of belief, probabilities
      are subjective bets, and a measurement outcome is an experience of the agent who makes
      it.

      The measurement problem evaporates -- there was never a physical state out there to
      collapse. Wigner's friend, non-locality puzzles, most of the paradox literature:
      dissolved, because nothing observer-independent was ever claimed.

      The cost is the point of contention: physics stops describing a world and starts
      describing each agent's gambling position. Proponents call that honesty. Critics call
      it surrender.
    in_csd: >
      The agreement runs deep and the split is clean, which makes this the most clarifying
      comparison on the list. Both hold the state is epistemic; both therefore treat its
      update as learning, not physics; both walk away from the measurement problem in its
      standard form.

      Then the floor. CSD's constraint surface exists whether or not anyone is looking.
      Probabilities are volume ratios on it -- not credences -- and the measure is fixed by
      a uniqueness theorem, so two rational agents cannot disagree about it. In QBism they
      legitimately can, because probability is personal. Slogan version, fair to both sides:
      epistemic states over an ontic substrate, versus epistemic states over nothing.
      Positional entry; no theorem states it.
    mathematical: >
      No formal content about the rival. The formal contrast: CSD's outcome weights are
      ratios of an invariant measure -- agent-independent, uniqueness-backed -- where QBist
      probabilities are Bayesian credences constrained by coherence but owned by an agent.
    term: QBism
    status: definition
