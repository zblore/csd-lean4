  - slug: shor-algorithm
    image:
      file: img/shor-algorithm.png
      alt: "Photograph of Peter Shor lecturing"
      caption: "Peter Shor receiving the Dirac Medal, 2017."
      credit: "International Centre for Theoretical Physics, CC BY 3.0, via Wikimedia Commons"
      licence: "CC BY 3.0"
      source: https://commons.wikimedia.org/wiki/File:Peter_Shor_2017_Dirac_Medal_Award_Ceremony.png
      article: https://en.wikipedia.org/wiki/Peter_Shor
    hook: >
      Shor's algorithm factors large numbers in polynomial time on a quantum computer, and
      it turned quantum computing from a curiosity into a budget line and made every
      deployed cryptosystem provisional.
    layman: >
      Multiply two large prime numbers together and you have the answer at once, but
      recover the two primes from their product and, with the best classical methods, you
      wait effectively forever once the numbers are large enough. That one-way street
      isn't a theorem, but it's the working assumption, and most of the public-key
      cryptography protecting the internet leans on it.

      Shor's 1994 algorithm breaks the street. A quantum computer can factor in polynomial
      time, meaning the running time grows only as a modest power of the number of digits
      rather than exploding with each digit added. The route is indirect and elegant.
      Classical number theory reduces factoring to finding the period of a repeating
      sequence, as the remainders left when successive powers of a chosen number are
      divided by the number to be factored eventually repeat, and the length of the repeat
      reveals a factor. Period-finding is exactly what quantum interference does well. A
      quantum register can hold every input value at once, in what's called a
      superposition, and the quantum Fourier transform, the quantum version of the
      mathematical tool that picks the frequencies out of a signal, makes the period stand
      out the way a single note stands out from a struck bell.

      Machines large enough to run the algorithm on numbers that matter don't yet exist,
      and the conclusion for current cryptography is nonetheless already settled, as it's
      living on borrowed time.
    in_csd: >
      Shor's algorithm is the most demanding of the corpus's algorithm witnesses. A
      witness is a known algorithm carried through the formalised framework to show the
      framework can support it, and witnesses mark scope and don't support foundations.
      What makes this one heavy is the plumbing, as the reversible modular arithmetic
      beneath the algorithm, the adders and multipliers built from steps that can each be
      run backwards as quantum logic requires, is built and verified in full, because
      that's where a formalisation either survives or quietly cheats.

      The corpus makes no cryptographic claims, and the cost-model work bearing on real
      machines was deliberately moved to a separate repository. What remains here is an
      existence proof, as the formalised dynamics carries a complete, real algorithm from
      end to end.
    mathematical: >
      Quantum order-finding extracts the period of modular exponentiation in polynomial
      time via the quantum Fourier transform, and a classical reduction, essentially
      Legendre-era number theory, converts the period into a factor with high probability.

      The quantum content is entirely the period-finding, and the corpus's labour is
      mostly the verified reversible arithmetic underneath it.
    person: >
      Peter Shor (b. 1959) was an Olympiad medallist, took degrees at Caltech and MIT, and
      was at Bell Labs when he announced the algorithm in 1994. The community's reaction
      was unusually theatrical, as word spread from a small talk before the paper existed,
      and within weeks half of physics had opinions about a result almost nobody had read.

      The objection came instantly, that decoherence, the loss of quantum behaviour
      through contact with the surroundings, would kill any real machine. Shor answered it
      himself in 1995 with the first quantum error-correcting code, dispatching the
      counterargument to his own revolution. He moved to MIT in 2003, and few people have
      built both a field's central promise and its central defence.
    term: Shor's algorithm
    eponyms: [Shor]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Shor%27s_algorithm
    site_link:
      url: https://www.constraintsurfacedynamics.com/roadmap
      text: The roadmap's third stage is the reconstruction this algorithm runs inside
    related: [quantum-fourier-transform, phase-estimation, grover-algorithm, simon-algorithm, shor-code, reversible-adder, toffoli-gate]

  - slug: stern-gerlach
    image:
      file: img/stern-gerlach.png
      wide: true
      alt: "Diagram of the Stern-Gerlach apparatus"
      caption: "The Stern-Gerlach experiment: a beam of silver atoms (1) passes through an inhomogeneous magnet (3) and splits into two spots (4, 5) on the screen."
      credit: "Tatoute, CC BY-SA 4.0, via Wikimedia Commons"
      licence: "CC BY-SA 4.0"
      source: https://commons.wikimedia.org/wiki/File:Stern-Gerlach_experiment.svg
      article: https://en.wikipedia.org/wiki/Stern%E2%80%93Gerlach_experiment
    hook: >
      Atoms sent through an uneven magnetic field split into two clean beams instead of a
      smear, and sorting them twice along different axes undoes the first sorting, so the
      whole strangeness of quantum measurement sits in one 1922 apparatus.
    layman: >
      An atom can behave like a tiny bar magnet, and an uneven magnetic field pushes a
      small magnet up or down by an amount that depends on how its axis is tilted relative
      to the field. Classical physics therefore predicted that a beam of atoms, their axes
      pointing every which way, would spread into a continuous smear, while the old
      quantum theory predicted discrete lumps instead, so Stern built the apparatus to
      referee.

      The atoms split into two sharp beams, a point for quantisation, but the deeper shock
      is the second act. Take the upper beam from one magnet and pass it through a second
      magnet tilted at an angle. It splits again, and the original sorting is gone, so if
      you send the result through a third magnet aligned with the first, the atoms that
      were all found to be up no longer all come out up.

      Measurements don't read off labels the atoms already carry, as asking a new question
      erases the answer to the old one. That's the finding underneath the finding, and it
      has never stopped being strange.
    in_csd: >
      The Stern-Gerlach experiment is the corpus's reference measurement, and the second
      act is the part that earns it the place. Discreteness is cheap, as any theory with
      the right list of allowed values delivers it. The unsorting is contextuality in its
      most concrete laboratory form, the dependence of an outcome on which question is
      asked and in what company, and a substrate account, one in which there's an
      underlying definite state, must produce that behaviour rather than excuse it.

      CSD produces it structurally. The measurement context, here the orientation of the
      magnet, fixes which partition of the epistemic space the outcome is read against,
      that is, which way the space of quantum states is divided into outcome regions. The
      tilted magnet is a different context, hence a different partition, and a second
      sorting asks a different question of the same microstate, the underlying definite
      state, rather than reading out a stored answer to the old one. The forgetting isn't
      the decay of a label, as there was never a label, only a state and a context.
    mathematical: >
      Spatial separation of beams according to the eigenvalues of the spin component along
      the field gradient, where sequential measurements along non-commuting axes fail to
      preserve earlier outcomes.

      A historical footnote has content, as the experiment predates spin. It was designed
      for orbital angular momentum in the old quantum theory, and the right answer emerged
      from two errors cancelling, understood only years later.
    person: >
      Otto Stern (1888-1969), from a Jewish grain-milling family at Sohrau in Upper
      Silesia, was Einstein's first pupil in Prague and followed him to Zurich before
      settling at Frankfurt, where the experiment ran in 1922. Walther Gerlach
      (1889-1979), from Biebrich, took his doctorate at Tubingen and was the experimental
      hand.

      The beloved detail is documented, as the silver deposit was invisible until Stern's
      breath, heavy with sulphur from cheap cigars, developed it like a photograph. The
      aftermath is the era in miniature. Stern left in 1933 for Carnegie Tech in
      Pittsburgh and received the 1943 Nobel Prize, while Gerlach stayed, headed the
      Reich's uranium programme by the war's end, and spent 1945 interned at Farm Hall,
      where the captured transcripts record the German physicists learning of Hiroshima.
    term: Stern-Gerlach experiment
    eponyms: [Stern, Gerlach]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Stern%E2%80%93Gerlach_experiment
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper A is the volume-based account of the outcome frequencies this experiment measures
    related: [malus-law, bloch-sphere, pointer-basis, measurement-flow, ramsey-interferometry]

  - slug: contextuality
    reviewed: 2026-09-14
    image:
      file: img/contextuality.jpg
      alt: "Photograph of Ernst Specker at a lectern"
      caption: "Ernst Specker, of the Kochen-Specker theorem."
      credit: "Konrad Jacobs, Erlangen, CC BY-SA 2.0 de, via Wikimedia Commons"
      licence: "CC BY-SA 2.0 de"
      source: https://commons.wikimedia.org/wiki/File:Ernst_Specker.jpeg
      article: https://en.wikipedia.org/wiki/Ernst_Specker
    hook: >
      For some sets of quantum questions no consistent answer sheet exists at all, and
      CSD's response is to stop demanding one answer per question and to say instead what
      the answer depends on.
    layman: >
      It would be natural to believe that a measurement reveals a property the system
      already had, and that the property doesn't care what else happened to be measured
      alongside it. Call this the answer-sheet picture, in which every question has a pre-
      written answer and the companion questions are irrelevant.

      Quantum mechanics refutes the picture outright. Two measurements are called
      compatible when they can be made together without either disturbing the other's
      result, and there are collections of questions for which no answer sheet exists, not
      hidden or hard to find but provably nonexistent, once you demand that each answer
      stay the same across the different sets of compatible companions it could appear
      with. And this isn't a matter of disturbance, as the companion measurements are
      compatible and needn't touch the system at all.

      The conclusion has a name, which is that outcomes are contextual. What you get
      depends on the company the question keeps.
    in_csd: >
      CSD doesn't grudgingly accommodate contextuality, as it's built from it, and the
      distinction matters because contextuality is usually presented as a tax that hidden-
      variable theories reluctantly pay. Here it's the architecture.

      The mechanism is this. The substrate, the underlying space of definite states, holds
      a definite microstate, and a measurement context fixes which partition of the
      epistemic space the outcome is read against, that is, which way the space of quantum
      states is divided into outcome regions. Change the context and you change the
      partition, so the same microstate can honestly answer differently, and nothing is
      hidden, nothing is disturbed, and no answer sheet is ever demanded.

      The corpus proves both halves of the story. The obstruction is that no single global
      assignment of answers reproduces the correlations of the singlet, the entangled pair
      of particles used in the standard tests, and the existence is that an explicit
      contextual model does reproduce them. Impossibility plus a working alternative is a
      two-sided claim, and either half alone would be much weaker.
    mathematical: >
      Over one shared measurable state space, no jointly-defined outcome assignment for
      the four CHSH settings reproduces the singlet correlations. A separate result rules
      out a different class, as no setting-local (product) pair of response functions
      reproduces the singlet at every setting pair. The corpus keeps these apart
      deliberately, since neither subsumes the other, and it proves the GHZ analogue for
      three parties.

      One conflation is flagged in the corpus itself, which is that its fibre analysis
      isn't a Kochen-Specker or Gleason consequence. Those constrain non-contextual
      assignments, which this account never makes. The fibre argument comes from
      covariance plus non-negativity, a different argument with a different shape, and,
      unlike the Bell obstructions above, it's a constraint chain rather than a no-go, so
      whether contextual content can stay on the projective base at N of three and above
      is open in both directions and not settled.
    term: Contextuality
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: no_compatible_global_chsh_assignment_realises_singlet
    external:
      - text: "Stanford Encyclopedia: the Kochen-Specker theorem"
        url: https://plato.stanford.edu/entries/kochen-specker/
    site_link:
      url: https://www.constraintsurfacedynamics.com/position
      text: >
        The position page states that the programme is contextual, Bell-violating and operationally
        no-signalling
    related: [bell-chsh, kochen-specker, singlet-contextual-model, hidden-variables, measurement-context]

  - slug: hidden-variables
    reviewed: 2026-09-14
    image:
      file: img/hidden-variables.jpg
      alt: "Portrait photograph of Louis de Broglie"
      caption: "Louis de Broglie, whose pilot wave was the first hidden-variable theory."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Broglie_Big.jpg
      article: https://en.wikipedia.org/wiki/Louis_de_Broglie
    hook: >
      The no-go theorems don't kill hidden variables, as they price them, and CSD reads
      the price tag and pays it.
    layman: >
      If the quantum state describes knowledge rather than the world, there has to be
      something the knowledge is about, an underlying state of affairs that's definite
      whether or not anyone looks. Theories that supply one are called hidden-variable
      theories, and a famous sequence of theorems is widely reported to have ruled them
      out.

      The reports are wrong, in an instructive way. What Bell and his successors actually
      ruled out are the well-behaved hidden-variable theories, the local ones, in which
      what happens here can't depend on a choice made far away, and the non-contextual
      ones, in which the value a system gives for one quantity doesn't depend on which
      other quantities are measured alongside it. Hidden variables survive, at the stated
      price of locality and non-contextuality.

      That isn't a loophole, as it's the actual content of the theorems. Bohmian mechanics
      has been paying the price since 1952, and it remains the standing proof that the
      reports of death were exaggerated.
    in_csd: >
      The constraint surface is a hidden-variable theory in the technical sense, and the
      programme says so plainly rather than hoping nobody asks. It's contextual and non-
      local, exactly the two properties whose absence the theorems forbid, and it proves
      the relevant obstructions in-house rather than citing them, since a reconstruction
      resting on trust in the theorems that constrain it would be oddly built.

      Two standard misreadings are worth heading off. First, CSD isn't a repair of quantum
      mechanics, as it reproduces the same predictions at leading order, and candidate
      departures are recorded as owed by the papers and not claimed. Second, the quantum
      state isn't the hidden variable. The state is the summary, and the hidden variable
      is the point of the constraint surface underneath, which is why the state can be
      epistemic without the theory being about nothing.
    mathematical: >
      No product partition of a shared hidden-state space reproduces the singlet
      correlations, at any setting pair, and likewise GHZ. This is proved over arbitrary
      measurable state spaces, so the constraint hits the class and not one construction.

      The positive half is also in the corpus, an explicit contextual, non-local
      assignment that does reproduce the singlet. Together the pair delimits the viable
      region from both sides, what can't work and one thing that does.
    term: Hidden variables
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF6/ForcedContextuality.lean
      theorem: no_product_partition_realises_singlet
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hidden-variable_theory
    site_link:
      url: https://www.constraintsurfacedynamics.com/position
      text: >
        The position page places the programme among the hidden-variable theories and the no-go
        results
