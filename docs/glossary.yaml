  - slug: ramsey-interferometry
    image:
      file: img/ramsey-interferometry.jpg
      alt: "Portrait photograph of Norman Ramsey"
      caption: "Norman Ramsey."
      credit: "Copyrighted free use, via Wikimedia Commons"
      licence: "Copyrighted free use"
      source: https://commons.wikimedia.org/wiki/File:Ramsey_Norman_A3.jpg
      article: https://en.wikipedia.org/wiki/Norman_Ramsey_Jr.
    hook: >
      Two brief nudges separated by a long stretch of doing nothing measure a frequency
      more sharply than any amount of continuous pushing, and every atomic clock runs on
      this trick.
    layman: >
      An atom has natural frequencies, much as a bell has a pitch, and a clock is nothing
      more than a device that counts a frequency precisely. The obvious way to measure an
      atom's frequency is to drive it with radiation and watch how it responds, but the
      driving disturbs the thing being measured, so the longer and harder you push the
      more your push distorts the reading, and precision seems to limit itself.

      Ramsey's escape is to barely push at all. One brief pulse sets the atom oscillating
      between two of its states, then comes a long interval in which nothing is done and
      the atom evolves undisturbed, and then a second brief pulse and a look at which
      state the atom ends up in. During the silent interval the atom's internal
      oscillation runs like a clock hand, and the phase is how far round that hand has
      travelled, which depends on the atom's frequency multiplied by the waiting time. The
      second pulse converts the phase into a probability of finding the atom in one state
      or the other, so scanning the driving frequency produces alternating bands of high
      and low probability, called interference fringes, and the longer the silence the
      finer the fringes and the sharper the frequency reading. The sharpness comes from
      the interval when nobody is touching anything.

      Caesium clocks run on this method, so the definition of the second does too, and so
      does satellite positioning, which depends on those clocks.
    in_csd: >
      Ramsey interferometry sits in the metrology strand of the corpus, the part concerned
      with the science of precise measurement, and its classification is stated rather
      than implied. It's an adjacent arm that consumes the reconstruction rather than
      contributing to it, so states, the Born rule and unitary dynamics go in, and
      precision bounds and the protocols that achieve them come out.

      The reason to carry it is that a formalisation with claims to practical reach should
      be able to state the standard quantum limit, the precision available with
      independent particles, the better Heisenberg scaling that entanglement buys, and the
      geometry of the protocol that connects them. The corpus can, and this is the
      protocol.
    mathematical: >
      Two pulses separated by a free-evolution interval T, where the relative phase
      accumulated during the free interval produces fringes with spacing inversely
      proportional to T.

      The free interval sets the linewidth and the drive doesn't, which is the structural
      reason the method beats continuous interrogation and anchors frequency standards.
    person: >
      Norman Ramsey (1915-2011) was born in Washington DC to an army family, collected
      degrees at Columbia and Cambridge, and trained under Rabi, whose molecular-beam
      resonance method he would decisively improve. His war work was radar at the MIT
      Radiation Laboratory, then Los Alamos, where he headed the group delivering the
      weapons on Tinian.

      The method of separated oscillatory fields dates from 1949, his first year at
      Harvard, where he then stayed for forty years. The Nobel committee reached it in
      1989, when Ramsey was seventy-four, a forty-year lag he outlived comfortably, as he
      remained scientifically active into his nineties.
    term: Ramsey interferometry
    eponyms: [Ramsey]
    status: standard-mathematics
