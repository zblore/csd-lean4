  - slug: csd-vs-bohmian-mechanics
    kind: question
    hook: >
      Cousins, not twins: both pay the no-go price, but Bohm postulates his
      equilibrium measure where CSD proves its measure unique -- and the arenas
      underneath are different objects.
    layman: >
      Bohmian mechanics is the standing proof that deterministic quantum
      theories exist: particles with definite positions, guided by the wave,
      reproducing quantum statistics. Any deterministic programme owes an
      account of how it differs, and the differences here are structural, not
      cosmetic.

      The arena: Bohm's world is particle configurations, with the
      wavefunction as a real field guiding them. CSD's arena is not
      configuration space -- it is a compact geometric space projecting onto
      the quantum state space, and the state is the projection's output, not
      an extra field with dynamics of its own.

      The measure: Bohm's statistics require quantum equilibrium -- the
      assumption that positions are distributed by the squared amplitude. CSD's
      analogous input is a theorem: the measure is the unique invariant one,
      so the distributional assumption is replaced by a uniqueness proof.

      The records: Bohmian outcomes are particle positions; CSD outcomes are
      basin memberships written into the arena's fibre, with their own
      stability theorem.
    in_csd: >
      The programme's respect for Bohm is on record -- the standing
      counterexample to "hidden variables are dead" -- and so is the
      divergence. CSD keeps the state epistemic in function where Bohm makes
      it a dynamical agent; CSD's contextuality lives in apparatus-fixed
      outcome maps where Bohm's lives in the guidance dynamics' contextual
      responses; and the equilibrium question -- WHY the right measure --
      is answered by symmetry-forced uniqueness rather than by hypothesis or
      relaxation arguments.

      No experiment currently separates the two, and neither side claims one.
      The separation is in what must be assumed, and in what has been
      machine-checked -- where the comparison is presently one-sided.
    mathematical: >
      The contrast is carried by the corpus's uniqueness and reconstruction
      theorems rather than by any formalisation of Bohmian mechanics itself:
      fubiniStudyMeasure_unique versus the quantum equilibrium hypothesis;
      the projection postulate carried as a hypothesis versus the guidance
      equation carried as dynamics; and the record layer's basin machinery
      versus position as the universal pointer.
    term: How does CSD differ from Bohmian mechanics?
    status: definition
    source: curated
    related: [bohmian-mechanics, hidden-variables, fubini-study-measure, is-csd-a-hidden-variable-theory, determinism]
