  - slug: euclidean-space
    hook: >
      Ordinary geometry, extended to complex numbers, is the stage on which every finite
      quantum system in the corpus stands.
    layman: >
      Quantum mechanics needs geometry: lengths, angles and the whole toolkit. But its
      amplitudes, the numbers that describe a state, are complex numbers, and naive
      geometry over complex numbers gives complex lengths, which mean nothing. The problem
      is small but real.

      The fix is the complex inner product, a rule for pairing two vectors to produce a
      single number. It is arranged so that any vector paired with itself yields a real,
      positive quantity, its squared length, while two different vectors can pair to
      something complex. That leftover complex phase is not a defect. It is where
      interference lives, the single structural feature that separates quantum
      superposition from classical mixing.

      Finite-dimensional complex Euclidean space is just this, in any finite number of
      dimensions. Nothing about it is exotic; the exotic things are built on top of it.
    in_csd: >
      This is the base camp, not a claim. State vectors live in finite-dimensional complex
      Euclidean space, and operators are matrices on it. The objects that carry content
      are built overhead: the projective space of rays, in which two vectors differing
      only by an overall phase count as one state because they are physically identical,
      and the forced measure on that space.

      The finiteness is a decision, not a convenience. The corpus is finite-dimensional
      everywhere, on purpose. Completeness comes free, the pathologies of infinite
      dimension never arise, and the price is paid honestly in one place: the exact
      canonical commutation relation is impossible, with the failure located and
      quantified rather than hidden.
    mathematical: >
      A finite-dimensional complex inner product space, realised as the L2 structure on
      functions from a finite index type, with matrices carrying the induced operator
      norm.

      Completeness is automatic, so Hilbert-space subtleties vanish; the corpus's
      continuous-variable work approximates infinite dimension at an explicit finite
      cutoff instead of importing it.
    person: >
      Euclid of Alexandria worked around 300 BC under Ptolemy I. Almost nothing personal
      is known, and the anecdotes, such as the reply that there is no royal road to
      geometry, are late inventions. The work is another matter. The Elements organised
      Greek geometry and number theory into definitions, postulates and deductions, and
      stayed a live textbook for over two thousand years, the longest run any book has had
      in science.

      Every formal proof, this corpus's included, is downstream of that template. Its most
      productive failure was the fifth postulate, which resisted derivation for two
      millennia because it is independent of the others. That discovery gave us
      non-Euclidean geometry, and eventually the curved spaces on which both relativity
      and this glossary's state space stand.
    term: Euclidean space
    eponyms: [Euclidean]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Euclidean_space
    related: [hilbert-space, hermitian-operator, kronecker-product, borel-set, fubini-study-measure]

  - slug: fisher-information
    hook: >
      There is a floor under every error bar, classical or quantum, and Fisher information
      is what sets it.
    layman: >
      Suppose you are estimating something, a frequency, a field strength, a phase, from
      noisy data. Better analysis shrinks your error bar, up to a point. Is there a floor,
      a best possible precision that no cleverness in processing can beat?

      There is, and Fisher information is its name. It measures how sharply the
      distribution of your data responds when the underlying parameter shifts. Responsive
      data can pin the parameter down tightly; sluggish data cannot. Turn the information
      upside down, taking its reciprocal, and you have a hard lower bound on the spread of
      any unbiased estimate, meaning any estimate that is right on average.

      The quantum version adds one more optimisation. Instead of considering only the ways
      of processing the data from a fixed measurement, it ranges over all possible
      measurements, and so yields the ultimate floor that physics allows for a given probe
      state.
    in_csd: >
      Fisher information lives in the corpus's metrology strand, which the documentation
      classifies carefully as an adjacent arm, not a step in the reconstruction. It
      consumes the formalised machinery of states, the Born rule and dynamics to state
      precision bounds and the protocols that meet them. It contributes nothing to
      deriving quantum mechanics and does not pretend to.

      The reason to carry it at all is that a formalisation claiming practical reach
      should be able to state the standard quantum limit, the improved Heisenberg scaling
      that entanglement buys, and the gap between them. The corpus can.
    mathematical: >
      In the classical setting, Fisher information is the variance of the score of a
      parametrised family, and the Cramer-Rao inequality bounds any unbiased estimator's
      variance below by its inverse.

      In the quantum setting, maximising over measurements gives the quantum Fisher
      information and the Braunstein-Caves bound: the precision floor for a given
      parametrised family of states, before any choice of apparatus.
    person: >
      Ronald Fisher (1890-1962) was born in London, read mathematics at Cambridge, and did
      his transformative work not at a university but at Rothamsted Experimental Station
      from 1919, where crop trials posed the problems that produced experimental design,
      analysis of variance and maximum likelihood. Chairs followed: the Galton Chair at
      University College London, then Cambridge.

      The record has a dark seam that the name of his London chair advertises. Fisher was
      a lifelong, institutionally active eugenicist, and his statistics were in
      significant part built in service of that programme. Late in life he took
      tobacco-industry consulting money while publicly disputing the link between smoking
      and cancer. Both facts belong in any honest biography, next to the fact that modern
      statistics is unimaginable without him.
    term: Fisher information
    eponyms: [Fisher]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Fisher_information
    related: [ramsey-interferometry, phase-estimation, born-weight, amplitude-estimation, robertson-uncertainty]

  - slug: gibbs-state
    hook: >
      The state a system settles into at a given temperature is the unique solution to a
      trade-off between energy and disorder.
    layman: >
      Put a system in contact with a large environment at some temperature and wait. It
      does not fall into its lowest-energy configuration and stay there, because the
      environment keeps jostling it, lending energy and taking it back. But it does not
      wander uniformly over all configurations either, because low energy is still
      favoured. What, exactly, is the compromise?

      Gibbs wrote down the answer: weight each configuration by a decaying exponential of
      its energy, with the temperature setting how fast the weight decays. Hot systems
      spread out over many configurations, cold systems concentrate near the bottom, and
      the crossover between the two is quantitative.

      What makes the answer canonical rather than merely plausible is a variational
      principle, meaning that the state is singled out as the best solution to an
      optimisation problem. Among all states with the same average energy, the Gibbs
      state is the one with the most entropy, the standard measure of disorder or of
      missing information. Equivalently, it is the one that minimises free energy, the
      quantity that balances energy against entropy at the given temperature. It is not a
      good guess. It is the unique solution to an optimisation problem.
    in_csd: >
      The thermodynamics strand of the corpus instantiates the Gibbs state on the field
      Hamiltonian, the energy function of the corpus's model of a field, and derives
      temperature and free energy from the variational principle. Deriving rather than
      assuming is the difference between formalising thermodynamics and decorating it.

      It is also where two independently built strands of the corpus meet. The thermal
      side covers Gibbs states, entropy and Landauer's principle; the field side covers
      modes, propagators and light cones. The two were built separately, and what joins
      them is the exact KMS relation at the cutoff, the identity that characterises
      thermal equilibrium by how correlations behave in time, with the Gibbs state as the
      object on which both sides agree. Because the field Hamiltonian is diagonal, meaning
      that the energy of each configuration is simply read off, everything has closed
      form: the thermal results are computations, not existence claims.
    mathematical: >
      The Gibbs state is the density operator proportional to exp(-beta H), normalised by
      the partition function. It is the unique minimiser of free energy at inverse
      temperature beta, equivalently the entropy maximiser at fixed mean energy.

      In the corpus the Hamiltonian is diagonal in the configuration basis, so the state
      is an explicit diagonal matrix with a finite geometric normalisation, the partition
      function factorises over modes, and the thermal two-point function and its vacuum
      limit are exact finite computations.
    person: >
      Josiah Willard Gibbs (1839-1903) spent essentially his whole life in New Haven,
      Connecticut. Yale gave him America's first engineering doctorate in 1863. After
      three years in Paris, Berlin and Heidelberg he came home to a Yale professorship
      that he held unpaid for nine years, living on an inheritance, because the university
      had no money for him.

      He published his great work in the Transactions of the Connecticut Academy of Arts
      and Sciences, a journal with a circulation approaching zero. Europe learned of him
      mainly through Maxwell, who read him, championed him, and made a plaster cast of one
      of Gibbs's thermodynamic surfaces with his own hands; a copy went to Yale. Gibbs
      coined the very phrase statistical mechanics in 1902, a year before he died.
    term: Gibbs state
    eponyms: [Gibbs]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Gibbs_measure
    related: [canonical-typicality, kms-condition, landauer-principle, klein-inequality, von-neumann-entropy, jarzynski-equality]

  - slug: gisin-theorem
    hook: >
      Every entangled pure state, however slightly entangled, violates a Bell inequality.
      There is no quiet zone.
    layman: >
      Entanglement is the quantum link between two systems that makes their measurement
      results correlated in ways no separate description of each system can capture, and
      it comes in degrees. That suggests a comfortable picture: perhaps weak entanglement
      is effectively classical, and the famous Bell conflict, in which quantum
      correlations exceed what any local account allows, only sets in past some threshold
      of strangeness. Below the threshold, ordinary intuitions would survive.

      Gisin's theorem deletes the comfortable picture, at least for pure states, the
      states of complete knowledge. Any entanglement at all, however small, produces
      correlations that no local account can reproduce, for some choice of measurement
      settings. The conflict has no threshold and no safe margin. Either a pure state is
      unentangled and boring, or it is entangled and already in conflict with local
      realism.

      For mixed states, the states of incomplete knowledge, the story is genuinely more
      complicated: there are entangled mixed states that violate nothing. The clean
      dichotomy is a pure-state fact.
    in_csd: >
      This matters to the programme because it forbids an economy measure. A substrate
      account might hope to handle weak entanglement classically and reserve its non-local
      machinery for the strongly entangled regime. That is not allowed. Whatever mechanism
      produces the correlations has to operate at every degree of entanglement, all the
      way down to states that are almost unentangled.

      The corpus can express statements of this generality because its Bell-test
      machinery, built around the CHSH inequality, treats the singlet, the standard
      maximally entangled pair, as an instance rather than as the subject. The theorems
      quantify over states and settings, so universal claims are statable rather than
      aspirational.
    mathematical: >
      Every pure entangled bipartite state violates the CHSH inequality for some choice of
      settings.

      The result genuinely fails for mixed states: Werner's examples are entangled yet
      admit a local hidden-variable model. Entanglement and Bell non-locality are
      therefore distinct properties there, and conflating them is an error the corpus is
      built to avoid.
    person: >
      Nicolas Gisin, born in 1952, took his doctorate at Geneva and stayed, apart from a
      stint in industry building fibre-optic instruments, which turned out to be the
      perfect apprenticeship. His group's 1997 experiments sent entangled photons through
      ten kilometres of deployed Swisscom telecom fibre under Lake Geneva, the moment
      quantum communication stopped being a tabletop subject.

      The theorem is from 1991, a two-page paper. He co-founded idQuantique, which sells
      quantum cryptography commercially, and has written a small book arguing that physics
      has been too quick to give up on genuine chance.
    term: Gisin's theorem
    eponyms: [Gisin]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Nicolas_Gisin
    related: [bell-chsh, cglmp-inequality, peres-criterion, bell-not-join, hidden-variables]

  - slug: grover-algorithm
    hook: >
      Grover's algorithm finds one marked item in an unsorted list in a number of steps
      proportional to the square root of the list size, and a separate theorem shows that no
      quantum algorithm can do better.
    layman: >
      Suppose one marked item is hidden somewhere in a long list with no structure to
      exploit, no sorting, no index, no pattern. The only way to find it classically is to
      check items one by one. On average you look at half the list, and in the worst case
      all of it. It is natural to assume that this is simply what unstructured search costs.

      Grover showed that a quantum computer can do it in a number of steps proportional to
      the square root of the list size: for a million items, roughly a thousand steps rather
      than half a million. The machine keeps one number for every item, called its
      amplitude, and the chance of reading out a given item at the end is the square of its
      amplitude. At the start all the amplitudes are equal. Each round of the algorithm does
      two things. First it flips the sign of the marked item's amplitude, which is the only
      step that uses any knowledge of which item is marked. Then it reflects every amplitude
      about the average of all of them, so that the one entry that now stands out is pushed
      further from the crowd.

      Seen geometrically, each round turns the machine's state through a small, fixed angle
      towards the marked item. After a number of rounds close to the square root of the list
      size the state is almost pointing at the answer, and a measurement reveals it with
      high probability. Stop too early and the answer is still unlikely; carry on too long
      and the rotation overshoots the target, so the probability falls again. The algorithm
      comes with a timer as well as a result.

      The unusual part is that the speedup is final. A separate theorem shows that no
      quantum algorithm, however ingenious, can find the item in fewer steps than this, up
      to a constant factor. It is not merely the best method known; it is the best method
      possible.
    in_csd: >
      Grover's algorithm is one of the algorithm witnesses in CSD's machine-checked corpus:
      a standard quantum algorithm formalised to show that the programme's account of
      quantum mechanics supports the working machinery of quantum computation. The
      relationship runs one way, and the corpus says so rather than leaving it implied. The
      algorithms depend on the programme's unitary pillar, its result establishing that
      quantum evolution is unitary, meaning reversible and probability-preserving; they take
      that result as input and give no evidence for it. Their content is the meaning of
      circuits, with their amplitudes, iteration counts and success probabilities, not
      foundations.

      What this particular witness demonstrates, beyond the fact that the algorithm can be
      written down, is that the formalisation copes with genuinely quantitative reasoning.
      The bookkeeping of rotation angles and the schedule of how many rounds to run are
      exactly the details that a fragile formal treatment would get wrong, and this one
      carries them through.
    mathematical: >
      Amplitude amplification finds a marked element among N in order root-N oracle queries,
      versus order N classically. Optimality is a theorem: the BBBV hybrid argument shows
      that no quantum algorithm beats order root-N queries for unstructured search.

      The geometry is two-dimensional. The state stays in the plane spanned by the marked
      and unmarked components, and each double reflection (about the marked component, then
      about the mean) rotates it by a fixed angle. The query count is therefore a right
      angle divided by that angle, and running past it degrades the success probability.
    person: >
      Lov Grover, born in 1961 in India, studied at IIT Delhi and Stanford and was at Bell
      Labs in New Jersey when he published the algorithm in 1996, in a paper three pages
      long whose title presented it as a database search result rather than a physics one.

      The optimality half of the story is the strange half. The lower bound, due to Bennett,
      Bernstein, Brassard and Vazirani, was proved shortly before the algorithm existed. The
      ceiling was known before anyone had built the thing that touches it, one of the rare
      cases in algorithms where the achievement and the proof that nothing better is
      possible arrived in the wrong order.
    term: Grover's algorithm
    eponyms: [Grover]
    status: standard-mathematics
    related: [amplitude-amplification, amplitude-estimation, shor-algorithm, deutsch-jozsa, hadamard-test]
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Grover%27s_algorithm

  - slug: haar-measure
    hook: >
      A closed and bounded family of symmetries has exactly one even-handed notion of
      volume, and every measure that CSD calls forced inherits its uniqueness from that one
      fact.
    layman: >
      Many questions ask for an average over all the symmetries of something: the average
      effect of a random rotation, say, or whether one family of transformations is larger
      than another. To answer them you need a notion of volume on the set of transformations
      itself, not on the objects they act on. That volume had better not depend on the
      coordinates you happen to use to label the transformations, or your average is an
      artefact of your labelling rather than a fact about the symmetries.

      Haar's theorem concerns groups, families of transformations that can be combined and
      undone, such as all the rotations of a sphere. The demand he placed on a volume is
      invariance, meaning that the size of any collection of transformations does not change
      when every member of the collection is followed by one fixed transformation. For
      rotations, this says that turning a whole set of rotations by a further fixed rotation
      leaves its size alone. The demand sounds mild. For compact groups, those that are
      closed and bounded in the way the rotations of a sphere are and the shifts of an
      infinite line are not, it is remarkably restrictive: once the total volume is set to
      one, exactly one invariant volume exists. Not one natural choice among several, but
      one, full stop.

      So a question such as what a random symmetry does, on average, has a definite answer
      that does not depend on anyone's choice of coordinates. That is Haar's gift, and a
      large part of modern mathematics quietly relies on it.
    in_csd: >
      Trace the programme's central claim back far enough and it rests on this theorem. The
      transformations that quantum mechanics allows on a system, the unitary transformations
      that preserve lengths and angles between states, form a compact group, so there is
      exactly one invariant way to assign volume to them. The space of quantum states can be
      built from that group: fix any one state, and every other state is what some unitary
      transformation turns it into. Sending each transformation to the state it produces
      carries the unique volume on transformations down to a volume on states, and its
      uniqueness comes with it. That is the whole proof that the Fubini-Study measure, the
      notion of volume on state space that the programme uses, is forced rather than chosen.

      Remove this link and everything downstream changes character. The measure would become
      a preference, the derivation of the Born rule would rest on that preference, and the
      reply to the objection that the programme smuggles in its measure would evaporate. The
      same fact is what makes the choice of starting state immaterial: two different
      starting states give two ways of labelling states by transformations, but the two
      labellings differ by a fixed transformation, and an invariant volume cannot tell the
      difference.
    mathematical: >
      A compact topological group carries a unique translation-invariant Borel probability
      measure. On a homogeneous space of such a group, invariant measures are unique up to
      scale, and normalisation fixes the scale.

      The corpus uses the unitary group's Haar measure directly and pushes it forward along
      the orbit map; uniqueness downstairs is inherited from uniqueness upstairs. No
      geometric argument enters the uniqueness proof. It is group theory and measure theory
      all the way down.
    person: >
      Alfred Haar (1885-1933) was born in Budapest and took his doctorate at Gottingen under
      Hilbert in 1909; the Haar wavelet, now the first example in every wavelet course,
      comes from that thesis. With Frigyes Riesz he built the mathematics institute at
      Szeged into a serious research centre, and its journal, Acta Scientiarum
      Mathematicarum, into a serious journal.

      The measure theorem dates from 1933, the last year of his life; he died of cancer at
      forty-seven. Von Neumann, who had been sceptical that such a measure existed in
      general, used it almost immediately to solve Hilbert's fifth problem for compact
      groups, and Weil built the general theory soon after. The result outlived its author
      before the year was out.
    term: Haar measure
    eponyms: [Haar]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Haar_measure
    related: [fubini-study-measure, liouville-measure, dirichlet-distribution, born-weight, typicality]

  - slug: hermitian-operator
    hook: >
      A single symmetry condition on an operator guarantees that every number it can produce
      in a measurement is real, and it delivers the whole machinery of outcomes and
      eigenstates at no extra cost.
    layman: >
      Quantum mechanics represents each measurable quantity, such as energy or the spin
      along a chosen axis, by an operator: a matrix that acts on the state of the system.
      But the entries of that matrix are complex numbers, numbers with an imaginary part,
      while every laboratory dial reads a real number. So which matrices can legitimately
      stand for something measurable?

      The answer is a symmetry condition. Take the matrix, flip it across its main diagonal,
      and replace every entry by its complex conjugate, the mirror-image number with the
      sign of its imaginary part reversed. If the result is the original matrix, the
      operator is Hermitian. Every square matrix has special vectors that it merely rescales
      rather than turning in a new direction; the rescaling factors are called its
      eigenvalues and the vectors its eigenvectors. For a Hermitian matrix the eigenvalues
      are forced to be real, and they are precisely the possible readings of the
      measurement. The eigenvectors are the states that give each reading with certainty,
      and they form a complete set of mutually perpendicular directions, which in quantum
      mechanics means perfectly distinguishable states. Measurement becomes a sorting of the
      state into bins that never blur into one another.

      Drop the condition and all of this falls apart: outcomes could be complex, the states
      of certainty need no longer be distinguishable, and no consistent sorting exists. The
      fact that experimental numbers are real, traced back to its source, is this one
      algebraic symmetry.
    in_csd: >
      Everything measurable in CSD's machine-checked corpus is Hermitian: observables, the
      Hamiltonians that generate motion, and the density operators that describe states
      which are only partly known. The spectral theorem, the result that a Hermitian
      operator can be broken into its eigenvalues and mutually perpendicular eigenvectors,
      is used constantly. Its most load-bearing single use is in the work on channels, the
      maps that describe how a state changes when it interacts with something else. There a
      density operator is first decomposed into its eigenvectors and only then integrated
      against, and the bridge between two ways of measuring the size of an operator, by
      trace and by norm, stands on that step.

      The finite-dimensional spectral facts the corpus consumes are proved within it rather
      than assumed, so this part of the measurement machinery is not taken on trust from
      outside the formal development.
    mathematical: >
      A Hermitian matrix is one equal to its own conjugate transpose. Its eigenvalues are
      real; it is unitarily diagonalisable with mutually orthogonal eigenspaces; and hence
      it admits the functional calculus, applying real functions to operators through their
      spectra, that the corpus's entropy and channel chains consume throughout.

      One workmanlike convention: the corpus states Hermiticity as a predicate on plain
      matrices rather than bundling it into a subtype. Statements stay close to the
      mathematics, proofs stay close to the library, and the finite-dimensional spectral
      facts consumed are proved, not assumed.
    person: >
      Charles Hermite (1822-1901) was born at Dieuze in Lorraine with a malformed right
      foot. The Ecole Polytechnique admitted him and then forced him out over the
      disability, ending the engineering career he had trained for, and mathematics got him
      instead. He eventually taught at the Polytechnique that had rejected him, at the Ecole
      Normale and at the Sorbonne; Poincare was his student.

      His 1873 proof that e is transcendental was the first for any naturally occurring
      number, and his method handed Lindemann the transcendence of pi nine years later,
      closing the problem of squaring the circle after two millennia. He never sought the
      second result himself, writing that he dared not attempt it: one of history's more
      consequential displays of mathematical modesty.
    term: Hermitian operator
    eponyms: [Hermitian]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hermitian_matrix
    related: [hilbert-space, pauli-matrices, loewner-order, stone-theorem, robertson-uncertainty]

  - slug: hilbert-space
    hook: >
      Hilbert space is the stage on which quantum mechanics is usually performed, and CSD's
      claim is that it is scenery: the shadow cast by the physical object, not the object
      itself.
    layman: >
      Quantum mechanics needs three things from the space its states live in. Superposition,
      the ability to combine two states into a third, requires that states can be added like
      arrows, which makes them vectors. Probabilities require lengths and angles, which come
      from an inner product, a rule that assigns a number to every pair of vectors and
      thereby measures how long each is and how far apart they point. And calculus, with its
      limits and convergence, requires that a sequence of states closing in on something
      actually closes in on a state within the space rather than leaking out of it; this
      property is called completeness. A Hilbert space is exactly a space with all three:
      vectors, an inner product and completeness.

      In finitely many dimensions completeness comes for free, and a Hilbert space is
      nothing more exotic than ordinary Euclidean space with complex coordinates. In
      infinitely many dimensions completeness is a genuine constraint and the source of most
      of the subject's analytical difficulties.

      The standard formulation of quantum mechanics identifies the theory with this stage.
      States are vectors in Hilbert space, and that is where the theory happens. Or so the
      textbook says.
    in_csd: >
      CSD's sharpest departure from textbook framing is here. On CSD's account the physical
      world does not live in Hilbert space. Physical states are points of the constraint
      surface, the programme's underlying state space. The Hilbert space, or more precisely
      the space of its rays (a vector and all its rescalings count as one physical state, so
      only the direction matters), is bookkeeping built above that substrate: it records
      what an observer can know, and it carries the regions of possible outcomes and the
      probabilities attached to them.

      To say that quantum mechanics happens in Hilbert space is, on this account, like
      saying that the weather happens on the weather map: true about the representation,
      silent about the thing represented. The programme's analysis of the fibre, the
      structure that sits above each point of the space of rays, pushes further. The space
      of rays is a lossy projection of the substrate, and the content that forms records
      lives above it. Whether or not one accepts the programme, this is the single point to
      grasp about how it reads the formalism.
    mathematical: >
      A Hilbert space is a complete complex inner product space. The corpus is
      finite-dimensional throughout, so completeness is free, and the operative object is
      CP^(N-1), the space of rays, since vectors differing by a phase are one physical
      state.

      Infinite dimension, with its unbounded operators, domains and continuous spectra, is
      deliberately out of scope; the continuous-variable strand approximates it at an
      explicit finite cutoff instead.
    person: >
      David Hilbert (1862-1943) was born in Konigsberg and moved in 1895 to Gottingen, which
      he made the centre of world mathematics for a generation. His 1900 Paris address, with
      its twenty-three problems, set the century's agenda; his formalist dream of
      mathematics proved complete and consistent by finite means was bounded for ever by
      Godel in 1931.

      Two footnotes with teeth. The space is not his coinage: von Neumann named it, while
      building the rigorous foundations of quantum mechanics in Hilbert's own department.
      And when the Nazi education minister asked him, in 1934, whether Gottingen mathematics
      had suffered from the removal of the Jews, Hilbert answered that it had not suffered;
      it no longer existed.
    term: Hilbert space
    eponyms: [Hilbert]
    status: standard-mathematics
