  - slug: kms-condition
    reviewed: 2026-09-14
    image:
      file: img/kms-condition.jpg
      alt: "Equations engraved on a black stone wall in Warsaw"
      caption: "The KMS condition, carved on the wall of the Centre of New Technologies in Warsaw."
      credit: "Halibutt, CC BY-SA 3.0, via Wikimedia Commons"
      licence: "CC BY-SA 3.0"
      source: https://commons.wikimedia.org/wiki/File:Warszawa_Centrum_Nowych_Technologii_UW-6.jpg
      article: https://en.wikipedia.org/wiki/KMS_state
    hook: >
      The algebraic signature of thermal equilibrium holds exactly on CSD's finite field
      arena, and cooling the thermal state all the way down recovers the vacuum.
    layman: >
      You can ask what makes a state thermal, and everyday talk of temperature leans on
      infinite systems, heat baths and limits. The Kubo-Martin-Schwinger, or KMS,
      condition is the sharp answer mathematical physicists settled on. It concerns
      correlation functions, the averages obtained by measuring one observable now and
      another one later. The formula for evolving an observable in time continues to make
      sense when the elapsed time is replaced by an imaginary number, and the KMS
      condition uses exactly that, so a state is in equilibrium at a given temperature
      precisely when shifting one of the two observables forward by an imaginary time
      fixed by the inverse temperature gives the same correlation as swapping the order of
      the pair.

      On the finite field arena this is neither an axiom nor a limit. The Boltzmann state,
      the standard thermal state in which each energy level is weighted by a factor that
      falls off exponentially with its energy divided by the temperature, satisfies the
      KMS symmetry exactly at the cutoff, by computation. Cool it all the way down and the
      thermal two-point function, the correlation between two field operators, converges
      to the vacuum one, with the zero-point contributions cancelling on the way.

      This is thermal physics at finite resolution, with no hand-waving about baths.
    in_csd: >
      The thermal tier joins the programme's thermodynamics track to its field track. The
      thermal state is the Gibbs state of the field Hamiltonian, the energy function of
      the arena, the partition function, the normalising sum over energy levels,
      factorises across modes, and the edge at which the propagator is truncated is
      explicit rather than hidden, the same candour about the cutoff the Wick tier
      maintains.

      The scope is labelled as breadth, as it's equilibrium structure on the isolated
      finite piece and not a claim about continuum thermodynamics.
    mathematical: >
      The theorem thermal_kms states that for the diagonal field Hamiltonian at cutoff,
      the thermal two-point function satisfies the exact KMS identity, with complex-time
      evolution entrywise and the identity reducing to Boltzmann-weight transport and an
      index shuffle.

      Companion results give closed-form diagonal Boltzmann weights via the continuous
      functional calculus, mode marginals, the off-diagonal vanishing, and the beta-to-
      infinity vacuum limit recovering the free propagator with no residue.
    person: >
      Ryogo Kubo (1920-1995), at Tokyo, built the linear-response formalism of statistical
      mechanics, and Paul Martin (1931-2016), at Harvard, and Julian Schwinger (1918-1994)
      wrote the 1959 paper whose boundary condition carried the same content. It was Haag,
      Hugenholtz and Winnink who in 1967 recognised the shared condition as the definition
      of equilibrium for infinite systems and attached the three initials to it.
    term: KMS condition
    eponyms: [Kubo, Martin, Schwinger]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/ThermalPropagator.lean
