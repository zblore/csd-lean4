  - slug: simon-algorithm
    hook: >
      Simon's algorithm was the exponential separation that convinced Shor, as a hidden
      bitwise mask, unfindable classically without exponential work, falls to a handful of
      quantum queries and some linear algebra.
    layman: >
      Imagine a black box that computes a function of bit strings, so you may feed it
      inputs and read the outputs but not look inside. The function repeats itself under a
      hidden mask, so two inputs give the same output exactly when they differ by a secret
      string, meaning one is obtained from the other by flipping the bits where the secret
      has ones, and the task is to find the secret. Classically all you can do is hunt for
      a collision, two inputs with the same output, and the same counting that governs
      shared birthdays in a crowd says this costs a number of queries growing
      exponentially with the length of the strings.

      Simon's procedure queries the box once with the register in superposition, holding
      every input at once, then measures in a way that asks about interference patterns
      across inputs rather than about any single input. Each run hands you one random
      linear equation the secret must satisfy, so after about as many runs as the secret
      has bits, followed by solving those simultaneous equations, the secret is yours.

      It was the first exponential separation between quantum and classical computation
      for a promise problem, one whose input is guaranteed in advance to have the required
      structure. Its direct descendant is famous, as Shor read Simon's paper and asked
      what the same trick does to periods that are arithmetic rather than bitwise.
    in_csd: >
      Simon's algorithm is one of the corpus's algorithm witnesses, in the family that
      works by querying an oracle between two layers of Hadamard gates, beside Deutsch-
      Jozsa and Bernstein-Vazirani. The standing disclaimer applies, as witnesses mark the
      scope of what the library can express and don't support the foundations.

      What's proved is the per-outcome content of one round, starting from the state left
      after the query and a measurement of the output register, an equal superposition of
      the two inputs that share the observed output. Outcomes that aren't orthogonal to
      the secret, meaning those whose bitwise parity against the secret is odd, have
      probability zero, and every orthogonal outcome carries the same probability. The
      classical post-processing, collecting equations and solving them, is stated as the
      reading of the result and not re-verified.
    mathematical: >
      After the oracle query and a second-register measurement, the first register is a
      coset state |x0> + |x0 + s>, and the Hadamard transform gives outcome y the
      amplitude (1/sqrt 2)^{n+1} (-1)^{<x0,y>} (1 + (-1)^{<s,y>}), which vanishes unless
      <s,y> = 0 mod 2 and is otherwise uniform of squared norm 2/2^n. The corpus proves
      both halves, as outcomes with <s,y> = 1 have probability zero (simon_orthogonal),
      and every outcome with <s,y> = 0 carries the same probability (simon_uniform).

      So each round samples uniformly from the subspace orthogonal to s, and n - 1
      independent samples determine s by linear algebra over F_2.
    person: >
      Daniel Simon proved the separation in 1993 while at the Universite de Montreal. The
      paper was initially rejected before appearing at FOCS 1994, in the same conference
      and the same session as Shor's factoring paper, which cites it as the trigger. Simon
      spent most of his subsequent career at Microsoft Research working on cryptography.
    term: Simon's algorithm
    eponyms: []
    status: standard-mathematics
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-limits
      text: The scope page explains why the algorithm layer supports nothing in the foundations
    related: [deutsch-jozsa, bernstein-vazirani, shor-algorithm, quantum-fourier-transform, grover-algorithm]
    external:
      - text: "Overview"
        url: https://en.wikipedia.org/wiki/Simon%27s_problem

  - slug: bernstein-vazirani
    image:
      file: img/bernstein-vazirani.png
      wide: true
      alt: "Quantum circuit diagram of the Bernstein-Vazirani algorithm"
      caption: "The Bernstein-Vazirani circuit: Hadamards, one oracle call, Hadamards."
      credit: "Sjoerd Terlouw, CC BY-SA 4.0, via Wikimedia Commons"
      licence: "CC BY-SA 4.0"
      source: https://commons.wikimedia.org/wiki/File:Bernstein-Vazirani_algorithm.svg
      article: https://en.wikipedia.org/wiki/Bernstein%E2%80%93Vazirani_algorithm
    hook: >
      A hidden string of bits costs one classical question per bit, or exactly one quantum
      question in total, so the Bernstein-Vazirani algorithm is the cleanest single-query
      win the field has.
    layman: >
      An oracle holds a secret string of bits and, for any input string you send, returns
      a single bit, the parity, meaning whether the number of positions where both your
      input and the secret have a one is odd or even. Classically each query buys you one
      bit of the secret, so a secret of a given length costs that many queries, and no
      cleverness helps.

      Bernstein and Vazirani ask once. Prepare the uniform superposition, the register
      holding every possible input at once with equal weight, let the oracle act, so it
      writes each parity into the sign of the corresponding amplitude rather than into a
      separate output, and then undo the superposition. The interference is total, so the
      register reads the secret string itself, with certainty, every time.

      There's no probability, no repetition and no post-processing, so it's one query and
      one answer.
    in_csd: >
      Bernstein-Vazirani is an algorithm witness in the same family as Deutsch-Jozsa and
      Simon, an oracle between two layers of Hadamard gates, and the corpus proves the
      strong version, that the full circuit's output is concentrated entirely on the
      secret string, with that outcome having probability one and every other outcome
      probability zero. Unlike the reduced analysis of Simon's algorithm, this is the
      complete circuit, superposition, oracle and undoing, with no measurement reduction
      along the way.

      The standing disclaimer applies as ever, as the algorithms consume the programme's
      unitary-evolution pillar and don't support the foundations.
    mathematical: >
      The circuit is H^n then the phase oracle |x> to (-1)^{<a,x>} |x> then H^n, on |0^n>.
      The output amplitude at y is (1/2^n) sum over x of (-1)^{<y+a, x>}, and the
      character sum reduces to 2^n [y = a], the Kronecker delta. The corpus proves outcome
      a with probability one (bv_certain) and every other outcome zero (bv_zero).

      The content is one orthogonality of characters over F_2^n, and the algorithm is the
      observation that a single physical query evaluates all the parities in
      superposition.
    person: >
      Ethan Bernstein and Umesh Vazirani published the algorithm inside their 1993 STOC
      paper on quantum complexity theory, the paper that defined BQP and made quantum
      computation a complexity class rather than a curiosity. Vazirani, at Berkeley, went
      on to shape much of the field's theory, and Bernstein was his doctoral student.
    term: Bernstein-Vazirani algorithm
    eponyms: [Bernstein, Vazirani]
    status: standard-mathematics
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-limits
      text: The scope page keeps the algorithm layer apart from the programme's own claims
    related: [deutsch-jozsa, simon-algorithm, hadamard-test, grover-algorithm, quantum-fourier-transform]
    external:
      - text: "Overview"
        url: https://en.wikipedia.org/wiki/Bernstein%E2%80%93Vazirani_algorithm

  - slug: swap-test
    hook: >
      The swap test measures how alike two quantum states are without learning anything
      about what either one is, so it's a comparison that keeps both secrets.
    layman: >
      Two devices each hand you a quantum state, and you want to know whether they agree.
      Measuring either state disturbs it and reveals only a little about it, and comparing
      the two lists of amplitudes directly isn't an operation nature offers.

      The swap test threads one extra qubit, called an ancilla, through both states. Put
      the ancilla into a superposition of its two readings, and in the branch where it
      reads one swap the two states while in the other branch you leave them alone, then
      close the superposition so the two branches interfere, and read the ancilla. If the
      two states are identical, the swap changed nothing, and the ancilla reads zero every
      time, and if the states are orthogonal, meaning perfectly distinguishable, the
      ancilla is a fair coin. In between, the bias of the coin measures the overlap of the
      two states, the standard gauge of their resemblance, which runs from zero for
      perfectly distinguishable states to one for identical ones.

      Repeat as often as you like and the overlap is estimated to any accuracy, while
      neither state is ever identified. It's the standard likeness-meter of quantum
      information.
    in_csd: >
      The swap test is the witness that opens the corpus's ancilla-interferometry family,
      the algorithms that read a quantity off the interference of a single helper qubit,
      beside the oracle family of Deutsch-Jozsa, Bernstein-Vazirani and Simon. The
      probability that the ancilla reads zero is proved to be exactly one half plus half
      the squared overlap of the two states, with the identical-state and orthogonal-state
      readings as corollaries.

      The standing disclaimer applies, as the algorithms consume the programme's unitary-
      evolution pillar and don't support the foundations.
    mathematical: >
      H on the ancilla, controlled swap, H again, on |0> tensor psi tensor phi, and the
      ancilla-zero marginal is (1/4) times the squared norm of psi tensor phi + phi tensor
      psi, so the cross term <psi tensor phi, phi tensor psi> = |<psi, phi>|^2 closes it,
      giving P(0) = (1 + |<psi, phi>|^2)/2 exactly (swap_test_prob).

      P(0) = 1 iff the states coincide up to phase, P(0) = 1/2 iff they're orthogonal, and
      the estimator is quadratic in the overlap, which is why it reveals magnitude and not
      phase.
    term: swap test
    status: standard-mathematics
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: TN4 covers the mixed states whose overlap this test estimates
    related: [hadamard-test, amplitude-estimation, hong-ou-mandel, fisher-information, grover-algorithm]
    external:
      - text: "Overview"
        url: https://en.wikipedia.org/wiki/Swap_test

  - slug: hadamard-test
    image:
      file: img/hadamard-test.jpg
      alt: "Portrait photograph of Jacques Hadamard"
      caption: "Jacques Hadamard."
      credit: "Cropped by Off-shell, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Hadamard2_cropped.jpg
      article: https://en.wikipedia.org/wiki/Jacques_Hadamard
    hook: >
      The Hadamard test turns a matrix element, a complex number buried inside an
      operator, into the bias of a single coin.
    layman: >
      Quantum algorithms constantly need expectation values. An operator is a
      transformation of a quantum state, a rotation of it, say, and its expectation value
      in a given state is the number you get by comparing the state with its transformed
      version, how much of the original survives and with what phase. That number lives in
      the amplitudes, and amplitudes aren't things a measurement returns.

      The Hadamard test converts the number into a coin. One helper qubit, an ancilla, is
      put into a superposition of its two readings and controls whether the operator acts,
      so in one branch it does and in the other it doesn't. Closing the superposition
      makes the two histories interfere, and the ancilla's bias towards reading zero is
      exactly the real part of the expectation value. A complex number has a real part and
      an imaginary part, and a small phase adjustment on the ancilla before the final step
      reads the imaginary part instead.

      Flip the coin enough times and the number emerges. It's the parent trick behind the
      swap test and behind half of the variational quantum algorithms.
    in_csd: >
      The Hadamard test is the parent witness of the corpus's ancilla-interferometry
      family, the algorithms that read a quantity off the interference of a single helper
      qubit. Three facts are proved, that the probability the ancilla reads zero is
      exactly one half plus half the real part of the expectation value, that the
      probability of reading one is the complement, and that the difference between the
      two is exactly the real part itself. A fourth theorem recovers the swap test as the
      instance in which the operator is the swap of two registers, tying parent to child.

      The standing disclaimer applies, as the algorithms consume the programme's unitary-
      evolution pillar and don't support the foundations.
    mathematical: >
      H on the ancilla, controlled-U, H again, on |0> tensor psi, and the ancilla
      marginals are (1 plus-or-minus Re<psi, U psi>)/2. The corpus proves P(0) = (1 +
      Re<psi, U psi>)/2 (hadamard_test_prob), the complementary outcome, and the sign
      reading P(0) - P(1) = Re<psi, U psi> (hadamard_test_prob_diff). The estimator is
      linear in the operator, which is what makes it the general-purpose expectation-value
      primitive.

      The corpus also closes the family loop, as at U the swap on a doubled system the
      test's bias reproduces the swap test's (hadamard_test_swap_closed), tying parent to
      child in one theorem.
    term: Hadamard test
    status: standard-mathematics
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: TN4 covers the states and reductions this test reads an overlap from
    related: [swap-test, phase-estimation, deutsch-jozsa, bernstein-vazirani, amplitude-estimation]
    external:
      - text: "Overview"
        url: https://en.wikipedia.org/wiki/Hadamard_test

  - slug: amplitude-amplification
    reviewed: 2026-09-29
    image:
      file: img/amplitude-amplification.jpg
      alt: "Portrait photograph of Gilles Brassard"
      caption: "Gilles Brassard in 2019."
      credit: "Lëa-Kim Châteauneuf, CC BY-SA 4.0, via Wikimedia Commons"
      licence: "CC BY-SA 4.0"
      source: https://commons.wikimedia.org/wiki/File:Gilles_Brassard_(2019).jpg
      article: https://en.wikipedia.org/wiki/Gilles_Brassard
    hook: >
      Amplitude amplification is the theorem of which Grover's algorithm is a shadow, as
      any quantum procedure with any success probability can have that probability raised
      by pure interference, quadratically faster than retrying.
    layman: >
      Suppose your quantum procedure succeeds only sometimes, with some fixed probability.
      Classically the only remedy for a small probability is repetition, about one over
      the probability runs, and it's natural to assume that's simply what boosting success
      must cost.

      Brassard, Hoyer, Mosca and Tapp found the general trick hiding inside Grover's
      search. Reflect the state about the failures, then reflect it about where you
      started. A reflection here is the quantum analogue of a mirror, as it flips the sign
      of one part of the state and leaves the rest alone, and two reflections make a
      rotation, so each round rotates the state by a fixed angle towards success. After
      about one over the square root of the probability rounds, not one over the
      probability, you measure and win, and the exact success curve at every round is
      known in closed form.

      Run past the sweet spot and you rotate beyond the target, so the procedure has a
      timer, just as Grover's does. Grover's search is exactly this machine pointed at a
      uniform starting state with one marked item.
    in_csd: >
      Amplitude amplification is a library theorem in the corpus, deliberately free of CSD
      content and fully general, for any finite register, any set of outcomes counted as
      good, and any starting state whose success probability lies strictly between zero
      and one. The two-reflection rotation and the closed-form success curve are exact
      statements and not approximations for large registers. The recommended round count
      succeeds with probability at least one minus the starting probability, and that
      round count is at most a fixed constant times one over the square root of the
      starting probability, which is the quadratic speedup as a named inequality.

      The corpus's module on Grover's algorithm is rebuilt on this theorem, so the search
      step is proved to be the amplification step, the headline result is re-derived as an
      instance, and the distribution for several marked items arrives free. For an unknown
      success probability the module also carries the randomised search engine from the
      same paper, as a round count chosen uniformly at random below a cap succeeds with
      average probability at least one quarter once the cap is large enough relative to
      the success probability, and the sum over rounds telescopes to an exact closed form.
      The whole search with its exponentially growing caps is proved as well, so a run
      finishes in an expected number of steps at most a fixed constant times one over the
      square root of the success probability, with the run modelled as independent stages
      on a probability space. The exact threshold is stated in the mathematical section. The standing disclaimer
      applies, as the algorithm layer consumes the programme's unitary-evolution pillar
      and doesn't support the foundations.
    mathematical: >
      A Cat-1 theorem. On EuclideanSpace C over a finite basis with good set G, the step
      is reflection about the initial state composed with the sign flip on the good
      coordinates. On the plane spanned by the normalised good and bad components the step
      is a rotation by 2 theta with sin theta = sqrt(goodProb), and j rounds send the
      plane angle to (2j+1) theta, so the success probability is exactly sin^2((2j+1)
      theta), that is sin^2((2j+1) arcsin sqrt(a)) (amplitude_amplification).

      The optimal count m = floor(pi/(4 theta)) lands the angle within theta of pi/2,
      giving success at least cos^2(theta) = 1 - a, and m <= pi/(4 sqrt a) since sqrt a =
      sin theta <= theta. For unknown a the QSearch engine (BHMT Lemma 2) is also proved,
      as a uniformly random round count below M succeeds with average probability at least
      1/4 once M * 2 sqrt(a(1-a)) >= 1, the odd-angle sum telescoping to an exact closed
      form. The full QSearch (BHMT Theorem 3) is proved in QSearch.lean: with caps M_l =
      ceil((6/5)^l), the stages modelled as independent random variables (QSearchRun) and
      the cost 2 + 2j charged to a reached stage with round count j, the expected number
      of applications is at most 54/sqrt(a) for 0 < a < 1 (qsearch_expected_cost), and the
      model is consistent (exists_qsearchRun). Degenerate boundaries a = 0 (no plane) and a = 1 (nothing to amplify) are
      excluded by hypothesis. Round counting is abstract, and no oracle model or gate
      decomposition is claimed.
    person: >
      Gilles Brassard (Montreal) is one half of the BB84 quantum-cryptography protocol.
      Peter Hoyer (Calgary), Michele Mosca (Waterloo, later a founder of the Institute for
      Quantum Computing) and Alain Tapp (Montreal) were his collaborators in the Quebec-
      Ontario quantum information school of the late 1990s.

      Their paper, "Quantum Amplitude Amplification and Estimation" (2000, published
      2002), unified a string of post-Grover boosting tricks into one two-reflection
      geometry and paired it with amplitude estimation, the phase-estimation reading of
      the same rotation, which is where the two workhorse subroutines of the field meet.
    term: amplitude amplification
    eponyms: [Brassard, Hoyer, Mosca, Tapp]
    status: proved-in-corpus
