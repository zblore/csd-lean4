  - slug: mach-zehnder
    image:
      file: img/mach-zehnder.gif
      wide: true
      alt: "Diagram of a Mach-Zehnder interferometer"
      caption: "A Mach-Zehnder interferometer: two beam splitters, two mirrors, two exits."
      credit: "L3erdnik, CC0, via Wikimedia Commons"
      licence: "CC0"
      source: https://commons.wikimedia.org/wiki/File:Mach–Zehnder_interferometer.gif
      article: https://en.wikipedia.org/wiki/Mach%E2%80%93Zehnder_interferometer
    hook: >
      Split a single particle down two paths and recombine them, and where it lands
      depends on both paths, including the one you can prove it never took.
    layman: >
      The Mach-Zehnder interferometer is the cleanest hardware for the central puzzle of
      quantum mechanics. A beam splitter, a half-silvered mirror, sends light down two
      separate paths, ordinary mirrors bring the paths back together at a second beam
      splitter, and two detectors wait at the two exits. Which detector fires depends on
      the difference between the two path lengths, as the light travelling each path
      arrives as a wave, and the two waves either reinforce or cancel at each exit
      according to how far out of step the two paths have put them. This is interference,
      and so far it's classical optics.

      Now dim the source until only one particle of light, one photon, is in flight at a
      time, and the interference stays. A single photon's arrival statistics depend on
      both paths at once, and if you block either path the interference dies instantly,
      replaced by a fifty-fifty split between the detectors.

      Every hard question about quantum mechanics can be staged in this box, such as what
      happened in between the splitters, whether there was a path, and when the outcome
      was decided. That's why the instrument appears in every foundations argument since
      1892.
    in_csd: >
      This is the standard arena for the interference experiments among the programme's
      empirical twins, the flagship experiments CSD's machine-checked corpus reproduces as
      pass-or-fail tests, as the bomb tester and the quantum eraser both live inside it.
      Its value is diagnostic, as it forces any account of quantum mechanics to say
      something definite about the alternative that wasn't measured, which is precisely
      where interpretations stop agreeing.

      The eraser variant is the sharpest instrument in the set. Recording which path the
      particle took destroys the interference, and discarding that record afterwards
      restores it, so any story in which the particle simply took one definite path has
      real explaining to do about the restoration. CSD's account runs through the
      structure of regions in its state space rather than through stories about paths, and
      reproducing both twins is treated as a pass-or-fail constraint and not decoration.
    mathematical: >
      Two balanced beam splitters and two paths, with output intensities set by the
      relative phase between the arms.

      Unlike the Michelson layout, the paths are spatially separated and traversed once,
      which is what makes arm-specific interventions (blockers, detectors, erasers)
      cleanly statable, and hence what makes it the canonical which-path laboratory.
    person: >
      Ludwig Zehnder (1854-1949), a Swiss physicist with a doctorate under Rontgen at
      Wurzburg, published the design in 1891, and Ludwig Mach (1868-1951) refined it
      independently in 1892. Neither had quantum mechanics in mind, as the instrument was
      built for measuring refractive indices.

      The younger Mach was the son of Ernst Mach, whose positivism, the doctrine that only
      what's observable is real, shaped Einstein and the Vienna Circle. There's a neat
      irony in the son's instrument becoming, a century later, the standard stage for
      arguments about whether unobserved paths are real, and the father would have had
      opinions.
    term: Mach-Zehnder interferometer
    eponyms: [Mach, Zehnder]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Mach%E2%80%93Zehnder_interferometer
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-4
      text: >
        The fourth primer page explains visibility loss, which is what this interferometer measures
    related: [elitzur-vaidman, hong-ou-mandel, ramsey-interferometry, malus-law, collapse]

  - slug: malus-law
    image:
      file: img/malus-law.jpg
      alt: "Portrait of Étienne-Louis Malus"
      caption: "Étienne-Louis Malus, painted by Boilly in 1810."
      credit: "Louis-Léopold Boilly, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Malus_by_Boilly_1810.jpg
      article: https://en.wikipedia.org/wiki/%C3%89tienne-Louis_Malus
    hook: >
      Malus's law is a cosine-squared rule discovered in 1808 with a crystal and a sunset,
      and it turns out to be the oldest data point for the Born rule.
    layman: >
      Light can be polarised, meaning that its wave oscillates in one fixed direction
      across its line of travel, and a polariser is a filter that passes only light
      oscillating along its own axis. Pass polarised light through a second polariser
      tilted at some angle to the first and ask how much gets through. Malus measured it
      in 1808, and the transmitted fraction is the square of the cosine of the angle
      between the two axes, so aligned polarisers pass everything, crossed ones at right
      angles pass nothing, and at forty-five degrees exactly half gets through.

      A century later quantum mechanics asked what happens when a single photon, one
      particle of light, meets that tilted polariser. A photon can't be split, so it
      either passes or it doesn't, and the answer is the same cosine squared, now as the
      probability of passing. The Born rule is the general law of quantum mechanics that
      turns a state into probabilities for outcomes, and here it already was, as Malus had
      measured it before anyone knew there was such a rule, before the photon, and before
      probability entered physics at all.

      That makes Malus's law the oldest quantitative fact any theory of quantum
      probability must reproduce, and the simplest test any such theory can face.
    in_csd: >
      CSD's machine-checked corpus derives this law rather than assuming it. Among the
      states of a single photon's polarisation, those that lead to the photon passing form
      a region, and that region occupies exactly the cosine-squared fraction of the whole
      state space when the space is measured with the programme's forced measure, the one
      even-handed notion of volume it admits. It's the smallest complete instance of the
      entire programme, the one case where the full argument, regions and volumes and all,
      can be followed by hand on the back of an envelope.

      That's also its danger, flagged wherever the corpus uses it. Polarisation is a two-
      level system, and the two-level case is deceptively special, as its state space is a
      sphere, which makes the geometry so tractable that it's easy to mistake the special
      case for the general one. It's the smallest instance, the best pedagogy, and the
      worst extrapolation.
    mathematical: >
      The transmitted fraction equals the cosine squared of the angle between the
      polariser settings, which is identically the Born weight for the corresponding spin
      measurement.

      In the corpus it's a volume ratio, the Fubini-Study measure of the pass region over
      the total, computed exactly on CP^1.
    person: >
      Etienne-Louis Malus (1775-1812) was a soldier-scientist of the Napoleonic era, a
      member of the Ecole Polytechnique's first cohort and then an engineer on the
      Egyptian campaign, where he survived plague at Jaffa and never fully recovered his
      health.

      The discovery is the stuff of legend, and for once the legend is documented. In
      1808, in his rooms on the Rue d'Enfer, he idly examined the sunset reflecting off
      the windows of the Luxembourg Palace through a calcite crystal, and he noticed the
      doubled image dimming and brightening as he rotated the crystal. Reflected light was
      polarised, and nobody had known. He named polarisation, won the Academy prize for
      double refraction, and was dead at thirty-six.
    term: Malus's law
    eponyms: [Malus]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Malus%27s_law
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper A's volume account of outcome frequencies is what this law comes out of
    related: [born-weight, stern-gerlach, mach-zehnder, bloch-sphere, born-volume-ratio]

  - slug: mermin-inequality
    image:
      file: img/mermin-inequality.jpg
      alt: "Photograph of David Mermin speaking"
      caption: "David Mermin in Stockholm, 2009."
      credit: "Prolineserver (talk), CC BY-SA 3.0, via Wikimedia Commons"
      licence: "CC BY-SA 3.0"
      source: https://commons.wikimedia.org/wiki/File:Mermin_Stockholm_2009.jpg
      article: https://en.wikipedia.org/wiki/N._David_Mermin
    hook: >
      Add more particles and the conflict between quantum mechanics and common sense grows
      exponentially, so it doesn't average out but compounds.
    layman: >
      A natural guess is that quantum strangeness is a small-systems phenomenon, and that
      as you add particles it washes out into classical behaviour as averages of averages
      dilute the strangeness.

      Mermin's inequalities say the opposite happens. Start from the Bell experiment, in
      which two separated particles are measured and their results compared, and add
      parties, three particles, four, ten. For any number of parties there's a bound every
      common-sense account must respect, meaning any account in which each particle
      carries its own definite answers and nothing influences anything at a distance.
      Quantum mechanics predicts correlations that exceed the bound, and the gap between
      what it delivers and what the bound allows doesn't shrink as parties are added, as
      it grows exponentially with the number of particles, doubling roughly every two
      parties added.

      So the conflict with local realism, the combination of definite local properties and
      no action at a distance, isn't a fragile corner case of tiny systems. It's a
      structural feature that becomes more pronounced with size, which is the reverse of
      what the wash-out intuition predicted.
    in_csd: >
      CSD's machine-checked corpus carries the multi-party inequalities so that its
      results on contextuality, the dependence of measurement outcomes on what else is
      measured alongside them, aren't hostage to the smallest case, and the exponential
      growth is the actual point of doing so. A substrate mechanism that happened to
      reproduce the two-party violation by some special trick would be exposed here, as
      whatever produces the correlations has to keep producing them, and more strongly, as
      parties are added.

      Together with the GHZ argument, which reaches the same conflict through a single
      outright contradiction rather than through statistics, this establishes the conflict
      at every size and in both logical shapes, statistical and deterministic. That's the
      standard a substrate account must meet, and the corpus states the standard before
      claiming to meet it.
    mathematical: >
      A family of multipartite Bell inequalities whose classical bound is exceeded by
      quantum mechanics by a factor growing exponentially in the number of parties, 2 to
      the power (n-1)/2 for n parties.

      The corpus proves the quantum value and the classical bound separately, which keeps
      the exponential gap a theorem rather than a plot.
    person: >
      David Mermin, born in 1935, took his degrees at Harvard and spent his career at
      Cornell, much of it directing the Laboratory of Atomic and Solid State Physics. With
      Ashcroft he wrote the solid-state textbook that trained a generation.

      He's that rare thing, a physicist whose prose is part of his scientific reputation.
      The phrase shut up and calculate is his, coined in 1989 as a description of an
      attitude he was criticising, then promptly attributed to Feynman and quoted with
      approval, a fate he has written about with resignation. The multi-party inequalities
      date from 1990, in a paper short enough to read over coffee, which turned the GHZ
      conference argument into something an experiment could score.
    term: Mermin inequality
    eponyms: [Mermin]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/GHZ_experiment
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-claims
      text: The current-claims page lists the Bell-violating correlations this inequality tests
    related: [ghz-state, bell-chsh, tsirelson-bound, cglmp-inequality, contextuality]

  - slug: pauli-matrices
    image:
      file: img/pauli-matrices.jpg
      alt: "Portrait photograph of Wolfgang Pauli"
      caption: "Wolfgang Pauli."
      credit: "Nobel foundation, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Pauli.jpg
      article: https://en.wikipedia.org/wiki/Wolfgang_Pauli
    hook: >
      Three small matrices carry the entire two-level world, and their refusal to commute
      is the uncertainty principle in its smallest packaging.
    layman: >
      The simplest quantum system has just two levels, like the spin of an electron, which
      when measured along any axis comes out either up or down. Yet it has to answer
      infinitely many possible questions, since spin can be measured along any direction
      in three-dimensional space, so you can ask what the minimal toolkit for describing
      all of them is.

      It's three matrices, one for each of the three perpendicular axes of space. In
      quantum mechanics a measurable quantity is represented by a matrix, and every
      measurable quantity of a two-level system is a weighted mix of these three and the
      identity matrix, the matrix that changes nothing, so a spin measurement along any
      tilted direction is represented by the corresponding mix of the three. Four building
      blocks answer every question.

      Their crucial property is what they refuse to do, which is commute, that is, give
      the same result regardless of order. Applying the matrix for one axis and then the
      matrix for another gives a different result from applying them the other way round,
      by a computable amount. That failure to commute is the uncertainty principle for
      spin, the impossibility of definite values along two axes at once, and not merely an
      analogy to it. The whole two-level world, strangeness included, fits in these three
      matrices.
    in_csd: >
      These are the workhorses wherever CSD's machine-checked corpus touches spin. The
      detector settings in the Bell and GHZ experiments are built from them, the
      correlations of the singlet state (the two-particle state whose spins are perfectly
      opposed along every axis) are computed through them, the Tsirelson bound, the
      ceiling on how far quantum mechanics can exceed Bell's limit, is proved in terms of
      them, and the Bloch geometry, the picture of two-level states as points on a sphere,
      is theirs.

      The corpus claims nothing about the matrices themselves, as they're two centuries of
      linear algebra, but their concreteness does real work. The programme's empirical
      twins, its reproductions of flagship experiments, are exact finite computations
      rather than schematic arguments precisely because the measurement settings are
      explicit matrices, and several results that would be awkward in the abstract become
      arithmetic in this basis.
    mathematical: >
      Three traceless Hermitian involutions, pairwise anticommuting, which together with
      the identity form a basis of the two-by-two Hermitian matrices.

      Exponentials of i times their real linear combinations generate SU(2), the double
      cover of the rotation group, which is why a spin-half state needs two full turns to
      return to itself, sign included.
    person: >
      Wolfgang Pauli (1900-1958) was born in Vienna, with Ernst Mach as his godfather, and
      announced himself at nineteen with a review of general relativity that Einstein
      praised in print. He took his doctorate under Sommerfeld at Munich, found the
      exclusion principle at twenty-four, held the ETH Zurich chair from 1928, spent the
      war at Princeton, and received the Nobel Prize in 1945.

      He was the century's most feared critic, and his phrase not even wrong remains the
      epitaph for untestable theorising, and he was also its most collegial, since half
      the era's results were sharpened in savage letters from Zurich. The matrices come
      from his 1927 theory of spin. His decades-long correspondence with Carl Jung about
      physics and the psyche remains the strangest document left by any major physicist.
    term: Pauli matrices
    eponyms: [Pauli]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Pauli_matrices
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: TN0 fixes the conventions, and TN3 is the pointer Hamiltonian these matrices build
    related: [bloch-sphere, hermitian-operator, gottesman-knill, shor-code, steane-code]

  - slug: peres-criterion
    image:
      file: img/peres-criterion.jpg
      alt: "Portrait photograph of Asher Peres"
      caption: "Asher Peres."
      credit: "Lev Vaidman, CC BY-SA 4.0, via Wikimedia Commons"
      licence: "CC BY-SA 4.0"
      source: https://commons.wikimedia.org/wiki/File:Asher_Peres.jpg
      article: https://en.wikipedia.org/wiki/Asher_Peres
    hook: >
      You can test for entanglement with a pencil, as you transpose half of the joint
      description, and if a negative eigenvalue appears the pair is entangled.
    layman: >
      Correlation isn't entanglement. Two systems can be correlated for boring reasons,
      for instance because they were stamped from the same template, and their results
      will then agree without anything quantum being involved. Entanglement is the
      stronger, specifically quantum kind of connection, and telling boring correlation
      from genuine entanglement is, in general, a provably hard computational problem, so
      you can ask whether there's at least a quick test that catches some of it.

      Peres found one of startling simplicity. Take the joint description of the pair, a
      matrix called the density operator. Transposition, flipping a matrix across its main
      diagonal, is a harmless bookkeeping reflection when applied to the description of
      any single system, as it turns a legitimate state into a legitimate state. Now apply
      it to one half of the pair only. A legitimate state has eigenvalues, the
      characteristic numbers of its matrix, that are all probabilities and so never
      negative, so if the half-transposed result has a negative eigenvalue it's no longer
      a legitimate state, and the original was entangled, guaranteed.

      For the two smallest kinds of pair the test is perfect in both directions, as it
      catches every entangled state and never raises a false alarm. Beyond that it can
      miss, as there exist entangled states that pass the test, and the ones it misses
      turn out to be strange objects in their own right, bound entangled, meaning
      correlated in the quantum way yet impossible to distil into the clean entanglement
      quantum protocols use.
    in_csd: >
      CSD's machine-checked corpus carries this criterion beside its Bell machinery
      because the two detect different things, and conflating them is a standing error the
      programme can't afford. A Bell violation detects entanglement through statistics an
      experiment could show, and the Peres test detects it through algebra on the
      description. They disagree, as entangled mixed states exist that violate no Bell
      inequality.

      For a reconstruction of quantum mechanics the distinction is load-bearing. Claims
      about non-locality and claims about entanglement have different scopes, and the
      corpus keeps separate instruments for them precisely so its theorems say what they
      say and no more.
    mathematical: >
      Separable implies positive partial transpose. The converse holds exactly in
      dimensions two-by-two and two-by-three (Horodecki) and fails above, where PPT-
      entangled, that is bound entangled, states exist.

      The test itself is one eigenvalue computation, which is its entire charm given that
      separability in general is NP-hard.
    person: >
      Asher Peres (1934-2005) was born Aristide Pressman in Beaumont-de-Lomagne, France,
      to Polish-Jewish parents, and the family survived the occupation in hiding, so he
      took a Hebrew name on emigrating to Israel in 1949. He took his doctorate at the
      Technion under Nathan Rosen, the R of EPR, and spent his career at the Technion
      thereafter, pursuing foundations one degree of separation from the founding paradox.

      The criterion dates from 1996, quantum teleportation, which he co-authored, from
      1993, and his 1993 textbook remains the field's standard for saying exactly what is
      meant. His epigram that unperformed experiments have no results is quoted by every
      camp in the interpretation wars, each certain it supports them.
    term: Peres criterion
    eponyms: [Peres]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Peres%E2%80%93Horodecki_criterion
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: TN4 covers the mixed states this criterion tests
    related: [gisin-theorem, bell-not-join, partial-trace, kronecker-product, no-signalling]

  - slug: poisson-bracket
    image:
      file: img/poisson-bracket.jpg
      alt: "Portrait of Siméon Denis Poisson"
      caption: "Siméon Denis Poisson."
      credit: "François-Séraphin Delpech / After Nicolas Eustache Maurin, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:SiméonDenisPoisson.jpg
      article: https://en.wikipedia.org/wiki/Sim%C3%A9on_Denis_Poisson
    hook: >
      The Poisson bracket is the one rule that tells classical mechanics how fast any
      quantity changes, and the quantum commutator obeys exactly the same algebra, so that
      shared grammar is what lets a deterministic flow present itself in quantum form.
    layman: >
      In classical mechanics the state of a system is a point, specified by positions and
      momenta, and as time passes that point traces a path. A natural question is how fast
      any given quantity changes along the path, not just a position or a momentum but the
      energy, the angular momentum, the distance between two planets, anything you can
      compute from the state. The Poisson bracket is the single rule that answers it, as
      you feed it the quantity you care about together with the total energy and out comes
      the rate of change, so the whole of classical dynamics compresses into one line,
      that the rate of change of anything equals its bracket with the energy.

      The bracket takes two quantities and produces a third, and it obeys three algebraic
      laws. It's antisymmetric, meaning that swapping the two inputs flips the sign of the
      result. It obeys a product rule of the same shape as the rule for differentiating a
      product. And it obeys the Jacobi identity, a consistency condition on what happens
      when three quantities are bracketed together in different orders.

      A century later the same three laws turned up somewhere unexpected. In quantum
      mechanics physical quantities are represented by operators, and the order in which
      two operators are applied matters, so the commutator measures that mismatch, as you
      apply the first then the second, minus the second then the first. Dirac noticed,
      within months of quantum mechanics existing, that the commutator satisfies exactly
      the laws the Poisson bracket does, and he turned the observation into the recipe for
      quantisation, which is to keep the algebra and replace the bracket by the
      commutator. It's two theories with one grammar.
    in_csd: >
      For CSD the shared algebra isn't a curiosity but a structural support. The
      programme's ontic side, the level at which things actually happen, is a
      deterministic flow of the Hamiltonian kind on the constraint surface, and its
      epistemic side, the level of what can be predicted, is ordinary operator dynamics
      with commutators. The claim that these are two descriptions of one process, rather
      than an analogy between two processes, rests on the two brackets obeying the same
      laws.

      The scope of the formal work is narrower than the idea and is stated as such. The
      corpus establishes that the state space is a symplectic manifold, the general
      setting in which the bracket is defined, so its oriented-area structure is closed
      and non-degenerate, it's Kahler, meaning that its notion of distance and its notion
      of oriented area fit together in the way the bracket requires, Hamiltonian vector
      fields and their flows are constructed on it, and the flow preserves the volume
      measure. The bracket itself is formal in canonical coordinates, where the vanishing
      of the bracket for functions with disjoint supports is proved and used. What isn't
      yet stated is the bracket of two functions on the manifold itself, with its Jacobi
      identity, and that step is recorded as a gap and not presented as done.
    mathematical: >
      The bilinear antisymmetric bracket on phase-space functions induced by the
      symplectic form. It satisfies the Jacobi identity and generates Hamiltonian flow via
      df/dt = {f, H}, and its algebraic agreement with the commutator underwrites Dirac's
      quantisation dictionary.

      In the corpus the symplectic manifold structure of CP^(N-1) is formal
      (fsForm_isSymplectic, IsKahler, hamiltonianVectorField and its integral curves,
      Mathlib/Geometry/Manifold/), as is the canonical bracket in a Darboux chart with its
      disjoint-support vanishing theorem (SigmaLayer/ChartBracket.lean). The manifold-
      level bracket of functions, omega(X_f, X_g), isn't yet named, and its Jacobi
      identity isn't stated, and that's the recorded gap.
    person: >
      Simeon Denis Poisson (1781-1840), from Pithiviers, entered the Ecole Polytechnique
      in 1798 and was at once marked out by Laplace and Lagrange as the coming man. He
      stayed within the Paris institutions all his life and put his name on more
      mathematics than almost anyone, the distribution, the equation, the ratio and the
      bracket, the last from an 1809 memoir on planetary perturbation.

      The distribution, now everywhere, made its first appearance in a book about the
      probability of criminal verdicts and was ignored for half a century. As an examiner
      he was also one of the officials who failed to recognise Galois, which is a reminder
      that even the great ones grade badly.
    term: Poisson bracket
    eponyms: [Poisson]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Poisson_bracket
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper D develops the geometric mechanics this bracket generates
