  - slug: projective-sector
    reviewed: 2026-09-14
    hook: >
      Quantum mechanics is written on a curved projective space, and in CSD that space
      isn't fundamental, as it's the sector the arena projects onto, with its geometry
      forced by symmetry.
    layman: >
      The space of quantum states isn't a vector space, whatever the opening chapters of
      the textbooks suggest. A quantum state is written as a vector, but two vectors that
      differ only by an overall phase, a rotation of the vector's mathematical description
      that changes no prediction at all, are the same physical state. Once you treat all
      such vectors as a single point, quotienting the redundancy away, you're standing on
      complex projective space, a compact arena, meaning one of finite extent, that's
      curved and highly symmetric.

      Most formulations treat that space as the fundamental stage, and CSD demotes it. The
      projective space is a sector, the image of the real arena under a many-to-one
      projection, a map under which many points of the arena share one quantum state, so
      states are shadows and the surface casting them is bigger.

      The demotion has a payoff. Questions that are awkward even to pose on the state
      space, such as which outcome actually happened and what carries the record of it,
      have room to be answered one level down.
    in_csd: >
      The sector is where the epistemic half of the reconstruction lives, the half that
      concerns descriptions rather than what exists. Measurement contexts partition the
      sector into outcome regions, and the Fubini-Study measure prices them, as it's the
      natural volume on complex projective space and the unique one left unchanged by
      unitary symmetry, the transformations that preserve every quantum probability. The
      ontic half stays below, as the weight of a sector region is the Liouville volume,
      the arena's own volume, of its preimage, the set of arena points that project into
      it.

      The sector is posited, through projectability, and then heavily constrained, as it's
      compact, it's Kahler, carrying the curved geometry complex projective space is known
      for, and it has a unique invariant measure. The corpus's working instance takes the
      sector to be complex projective space exactly, with the projection's fibre, the set
      of arena points lying above a single state, carrying what the sector can't.
    mathematical: >
      ProjectiveSector bundles the measurable projection to CP^(N-1) with the pushforward
      law connecting the ontic measure to the sector measure.

      The Kahler instance instantiates it on CP^(N-1) x T^2 with projection onto the first
      factor, and the pushforward of the Liouville measure is the Fubini-Study measure,
      which is a theorem and not a stipulation.
    term: Projective sector
    status: physical-postulate
    source: curated
    lean:
      module: CsdLean4/SigmaLayer/ProjectiveSector.lean
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-limits
