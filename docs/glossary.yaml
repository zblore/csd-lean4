  - slug: lieb-robinson-bound
    hook: >
      Even without relativity, information has a speed limit -- and on the finite
      field arena that limit is a theorem with the velocity constant written out.
    layman: >
      Here is the problem. Nothing in non-relativistic quantum mechanics obviously
      forbids an effect here from showing up arbitrarily fast over there. Yet
      matter behaves locally. Lieb and Robinson proved in 1972 that lattice
      systems with local interactions enforce their own speed limit: outside an
      effective cone, influence is not merely weak, it is exponentially
      negligible.

      The corpus proves the finite-arena version from scratch, in stages that
      mirror the physics: influences commute exactly below the graph distance;
      the leading term decays like a power; the factorial strengthening makes
      the bound decay at every time; and the closing form extracts an explicit
      velocity -- outside the cone set by that velocity, the commutator is
      suppressed by an exponential in the distance.

      A light cone, earned from coupling structure alone.
    in_csd: >
      The bound is load-bearing, not decorative: it is the mechanism behind the
      programme's locality story on the field arena. The record-layer bridge
      runs it through the arena: a record cell in the fibre cannot be steered
      from outside the cone, which is what makes records stable against distant
      meddling by theorem rather than hope.

      The scope is honest: velocity bounded, not optimal; a finite mode graph,
      not a continuum; and the identification of this dynamical cone with the
      kinematic light rays of the dispersion analysis is explicitly NOT made.
    mathematical: >
      The chain: nested commutators of edge-supported generators stay in the
      coupling graph's k-ball and vanish exactly below the graph distance; the
      flow remainder obeys a factorial estimate via an integral bound; hence
      the commutator of time-evolved and static observables is bounded by
      2 norm(A) norm(B) (2 norm(S) t)^d / d!, and outside v t <= d with
      v = 2 e^2 norm(S) it is at most 2 norm(A) norm(B) e^(-d).
    person: >
      Elliott Lieb, born 1932, is an American mathematical physicist at
      Princeton whose name attaches to an improbable number of sharp
      inequalities across analysis and quantum theory. Derek Robinson
      (1935-2021) was a British-Australian mathematical physicist, long at the
      Australian National University, co-author of the standard operator-algebra
      treatment of quantum statistical mechanics. Their 1972 paper in
      Communications in Mathematical Physics proved the group velocity bound
      for lattice spin systems; it waited three decades for its renaissance,
      then became the workhorse of quantum information theory's locality
      estimates.
    term: Lieb-Robinson bound
    eponyms: [Lieb, Robinson]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/LiebRobinson.lean
      theorem: norm_commutator_velocity_le
    related: [field-arena, record-light-cone, no-signalling]

  - slug: wick-theorem
    hook: >
      The combinatorial engine of field theory -- correlators as sums over
      pairings -- survives the finite cutoff exactly, with the threshold where it
      fails stated as part of the theorem.
    layman: >
      Here is the problem. Quantum field theory computes everything from a
      miracle of bookkeeping: any correlation of many field operators reduces to
      a sum over ways of pairing them up, each pair contributing a basic
      propagator. That is Wick's theorem, and it is usually proved with
      infinitely many oscillator levels in hand.

      Cut the ladder at N quanta -- as any finite arena must -- and the question
      becomes quantitative: does the pairing formula survive, and where exactly
      does it break? The corpus's answer: it survives verbatim below an explicit
      threshold, because a 2n-step return walk simply cannot reach the missing
      levels; at the threshold it fails by a computed amount.

      Approximation with an error bar is replaced by exactness with a boundary.
    in_csd: >
      This is the field track's breadth at its most textbook: four-point
      functions at equal and distinct times closing into the pairing sum, the
      two-time kernel carrying the time dependence, and the full moment ladder
      -- the double-factorial law for arbitrary even powers -- proved by a
      commutator recursion in which the cutoff defect is killed by the walk
      band, not ignored.

      The honest boundary is in the header: the one-shot sum-over-matchings
      formula for arbitrary interleaved operator words is not claimed; the
      double factorial carries that content on the mode diagonal.
    mathematical: >
      timeFourPoint_wick: the distinct-times four-point function equals the
      pairing sum of two-time kernels over every mode pattern, for cutoffs
      above two. The moment ladder: the vacuum expectation of Q to the 2n is
      (2n-1) double factorial times one-half to the n, exactly, for n below
      the cutoff, via the recursion against the truncated commutation relation;
      odd moments vanish by walk parity, and grouped mode patterns factorise
      by clustering.
    person: >
      Gian Carlo Wick (1909-1992) was born in Turin, worked alongside Fermi in
      Rome in the 1930s, and after the war held positions at Berkeley --
      which he left rather than sign the loyalty oath -- then Carnegie Tech,
      Brookhaven and Columbia. The 1950 theorem on evaluating products of
      field operators, published in the Physical Review, systematised the
      calculations of the newly renormalised quantum electrodynamics and has
      been the daily tool of the subject ever since.
    term: Wick's theorem
    eponyms: [Wick]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/Wick.lean
      theorem: timeFourPoint_wick
    related: [field-arena, gibbs-state, kms-condition]

  - slug: kms-condition
    hook: >
      The algebraic fingerprint of thermal equilibrium holds exactly on the finite
      arena -- the corpus's first KMS statement, with the vacuum recovered in the
      zero-temperature limit.
    layman: >
      Here is the problem. What makes a state thermal? Temperature talk usually
      leans on infinite systems, baths, and limits. The Kubo-Martin-Schwinger
      condition is the sharp answer algebraists settled on: a state is in
      equilibrium at a given temperature precisely when its correlation
      functions obey one specific symmetry -- evolve one observable forward in
      imaginary time by the inverse temperature and the order of the pair swaps.

      On the finite field arena this is not an axiom or a limit: the Boltzmann
      state at the cutoff satisfies the KMS symmetry exactly, by computation.
      Cool it all the way down and the thermal two-point function converges to
      the vacuum one -- zero-point contributions cancelling on the way.

      Thermal physics, at finite resolution, with no hand-waving about baths.
    in_csd: >
      The thermal tier joins the programme's thermodynamics track to the field
      track: the thermal state IS the Gibbs state of the field Hamiltonian, the
      partition function factorises across modes, and the propagator's
      truncation edge is explicit rather than hidden -- the same honesty about
      the cutoff that the Wick tier maintains.

      Labelled breadth, as ever: equilibrium structure on the isolated finite
      piece, not a claim about continuum thermodynamics.
    mathematical: >
      thermal_kms: for the diagonal field Hamiltonian at cutoff, the thermal
      two-point function satisfies the exact KMS identity -- complex-time
      evolution entrywise, the identity reducing to Boltzmann-weight transport
      and an index shuffle. Companions: closed-form diagonal Boltzmann weights
      via the continuous functional calculus, mode marginals, the off-diagonal
      vanishing, and the beta-to-infinity vacuum limit recovering the free
      propagator with no residue.
    person: >
      Ryogo Kubo (1920-1995), at Tokyo, built the linear-response formalism of
      statistical mechanics; Paul Martin (1931-2016), at Harvard, and Julian
      Schwinger (1918-1994) wrote the 1959 paper whose boundary condition
      carried the same content. It was Haag, Hugenholtz and Winnink in 1967 who
      recognised the shared condition as the definition of equilibrium for
      infinite systems and attached the three initials to it.
    term: KMS condition
    eponyms: [Kubo, Martin, Schwinger]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/ThermalPropagator.lean
      theorem: thermal_kms
    related: [gibbs-state, field-arena, wick-theorem, von-neumann-entropy]

  - slug: lindblad-equation
    hook: >
      The master equation of open quantum systems, formalised end to end: the flow
      of every Lindblad generator is completely positive -- literally, with the
      ancilla identification proved, not gestured at.
    layman: >
      Here is the problem. Real systems leak: they dephase, decay, decohere. The
      equation governing an open quantum system's density matrix is the Lindblad
      equation, and its defining virtue is supposed to be that it generates
      legitimate physics at every time -- probabilities stay probabilities, even
      when the system is entangled with a bystander.

      That virtue -- complete positivity -- is precisely what is delicate to
      prove, because the flow is an exponential of a generator with competing
      parts. The corpus does it from first principles: split the generator into
      a drift that acts by conjugation and a jump part whose exponential is a
      positive series, reassemble by a Trotter product formula proved for the
      purpose, and then show the flow of the ancilla-amplified generator IS the
      identity-tensor-flow map, so amplified positivity is complete positivity
      in so many words.

      A staple of every open-systems textbook, now with a kernel-checked proof.
    in_csd: >
      The open-system tier is where the programme prices imperfect isolation:
      the exhibited dephasing and amplitude-damping semigroups are Lindblad
      flows, and the general theorem certifies that every such flow -- for any
      Hermitian Hamiltonian and any jump operators -- is a legitimate quantum
      channel at every nonnegative time.

      The supporting Banach-algebra Trotter formula was deliberately proved in
      Mathlib-upstreamable generality, and the label the corpus once carried --
      that exponentiated positivity was out of reach -- was retired when the
      gate was re-checked and the route found to be entirely in-corpus.
    mathematical: >
      lindbladSemigroup_completelyPositive: for Hermitian H, jump family L,
      t >= 0 and every finite ancilla, the identity-tensor amplification of
      the flow maps positive semidefinite matrices to positive semidefinite
      matrices. Route: the drift flow is conjugation by a matrix exponential;
      the jump exponential is a positive Kraus series with positivity closed
      under limits; the general Lie-Trotter formula assembles the flow; and
      the blockwise identification of the amplified generator's flow with
      id-tensor-Phi makes the amplified statement literally complete
      positivity.
    person: >
      Goran Lindblad (1940-2022) was a Swedish mathematical physicist at the
      Royal Institute of Technology in Stockholm. His 1976 paper on generators
      of quantum dynamical semigroups gave the general form of the equation;
      Gorini, Kossakowski and Sudarshan published the finite-dimensional
      classification the same year, which is why careful writers say GKSL. By
      the standards of a result used daily across quantum optics and quantum
      information, its authors are remarkably rarely read.
    term: Lindblad equation
    eponyms: [Lindblad]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF6/LindbladPositivity.lean
      theorem: lindbladSemigroup_completelyPositive
    related: [quantum-channel, choi-theorem, pointer-basis, lie-trotter-formula]

  - slug: lie-trotter-formula
    hook: >
      Split an exponential into alternating small steps and the error dies like one
      over n -- proved here for general Banach algebras, in Mathlib-ready form,
      because the open-systems tier needed it and nothing on the shelf existed.
    layman: >
      Here is the problem. The exponential of a sum is not the product of the
      exponentials when the pieces do not commute -- and in quantum mechanics the
      interesting pieces never commute. The Lie-Trotter formula is the repair:
      alternate many tiny steps of each piece, and in the limit you recover the
      exponential of the sum exactly.

      Physicists use this daily; it is the licence behind every quantum
      simulation. The corpus needed it in a form its libraries did not have: for
      operators on matrix space, with a quantitative error, and without special
      structural assumptions on the pieces.

      So it was proved from scratch, at textbook generality: any complete normed
      algebra, explicit convergence rate, one step's defect controlled by a
      series-tail estimate and telescoped without growth.
    in_csd: >
      The formula is the assembly step in the complete-positivity proof of the
      Lindblad flow: the drift and jump parts of the generator are separately
      positive flows, and Trotter is what lets their alternation converge to the
      full flow so positivity passes to the limit.

      It is staged as a Mathlib-upstream candidate -- CSD-free by construction,
      the kind of infrastructure the formalisation deliberately leaves better
      than it found.
    mathematical: >
      NormedSpace.trotter_product: in a complete normed real algebra with unit
      norm one, the n-fold alternating product of exp(A/n) and exp(B/n)
      converges to exp(A+B), with a one-step defect of order one over n
      squared, telescoped to an overall rate with the explicit constant
      s^2 (3 + s) e^(2s) over n for s the sum of the norms. The earlier staged
      version required skew-adjointness; the de-skewed form replaces the two
      places skewness entered by norm bounds the final constant absorbs.
    person: >
      Hale Trotter (1931-2022) was a Canadian-American mathematician at
      Princeton; the 1959 product formula came out of his thesis work on
      semigroups of operators. The finite-dimensional antecedent is Sophus
      Lie's, from the nineteenth-century theory of continuous groups, which is
      why the formula carries both names -- and Masuo Suzuki's later
      higher-order refinements are why simulation people say Trotter-Suzuki.
    term: Lie-Trotter product formula
    eponyms: [Trotter]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Mathlib/Analysis/NormedSpace/TrotterGeneral.lean
      theorem: trotter_product
    related: [lindblad-equation, stone-theorem, schrodinger-equation]

  - slug: choi-theorem
    hook: >
      A quantum channel is legitimate exactly when one matrix built from it is
      positive semidefinite -- both directions machine-checked, so "is this map
      physical" is a decidable linear-algebra question.
    layman: >
      Here is the problem. Which transformations of a quantum state are
      physically allowed? The abstract answer -- completely positive
      trace-preserving maps -- involves a quantifier over all possible bystander
      systems, which is not something you can check by computation.

      Choi's 1975 insight collapses the quantifier: encode the whole map into a
      single matrix -- feed it half of a maximally entangled pair -- and the map
      is legitimate precisely when that one matrix is positive semidefinite.
      An infinite family of conditions becomes one eigenvalue check.

      The corpus proves both directions: every Kraus-form channel has a
      positive Choi matrix, and every positive matrix on the composite index
      arises from some Kraus family. The equivalence is the theorem.
    in_csd: >
      Choi's theorem is the workhorse of the corpus's channel layer: the
      generator-tier positivity witnesses in the open-system results, the
      channel constructions of the coarse-graining tier, and the jump-part
      arguments in the Lindblad complete-positivity proof all route through
      Kraus decompositions certified by it.

      It sits on the operational stratum -- standard quantum information,
      formalised because the programme's claims lean on it, with the
      construction fully explicit: the converse direction actually builds the
      Kraus family from the spectral decomposition of the Choi matrix.
    mathematical: >
      choi_iff_posSemidef: a matrix on the composite index is the Choi matrix
      of some Kraus family if and only if it is positive semidefinite. The
      forward direction is the rank-one decomposition of the Choi matrix into
      outer products of vectorised Kraus operators; the converse reconstructs
      Kraus operators from a PSD matrix's spectral square roots, de-vectorised
      along the index pairing.
    person: >
      Man-Duen Choi, born 1945 in Hong Kong, spent his career at the
      University of Toronto working in operator algebras. The 1975 paper --
      Completely positive linear maps on complex matrices, in Linear Algebra
      and its Applications -- is a model of brevity, and its central object
      was independently studied by Andrzej Jamiolkowski, which is why the
      encoding is often called the Choi-Jamiolkowski isomorphism.
    term: Choi's theorem
    eponyms: [Choi]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF2/ChoiConverse.lean
      theorem: choi_iff_posSemidef
    related: [quantum-channel, lindblad-equation, loewner-order]

  - slug: quantum-channel
    hook: >
      The most general thing that can happen to a quantum state, as a data type:
      a Kraus family with a completeness law, and the physicality certificates
      proved rather than assumed.
    layman: >
      Here is the problem. Unitary evolution is what happens to a perfectly
      isolated system, and nothing is perfectly isolated. Send a photon down a
      real fibre and it attenuates, dephases, mixes with noise. The general
      description of any such process -- any physically realisable
      transformation of quantum states -- is called a channel.

      The structure theorem for channels says every one of them can be written
      as a family of simpler operators applied and summed -- the Kraus form --
      subject to one completeness condition that guarantees probabilities
      still add to one afterwards.

      The corpus formalises channels in exactly that form and then proves the
      certificates: trace preserved, positivity preserved, and the Choi-matrix
      criterion for complete positivity, in both directions.
    in_csd: >
      Channels are the vocabulary of the programme's open-system and
      coarse-graining tiers: the dephasing and damping semigroups are channel
      families in time; the mode-tracing coarse-graining of the field arena is
      a channel built from an explicit isometry; and the renormalisation-step
      error budget is stated as a distance between channel outputs.

      The layer is operational-stratum breadth, formalised to the corpus's
      usual standard: no channel property is used anywhere without a named
      theorem carrying it.
    mathematical: >
      QuantumChannel: an indexed Kraus family with the completeness law summing
      adjoint-products to the identity; apply is the Kraus sum. Proved:
      trace preservation, PSD preservation, unitality criteria, and
      choiMatrix_posSemidef -- the easy direction of Choi -- with the converse
      in the companion module closing the equivalence. Composition and the
      dilation-side constructions live where their consumers need them.
    term: Quantum channel
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF2/QuantumChannel.lean
      theorem: choiMatrix_posSemidef
    related: [choi-theorem, lindblad-equation, naimark-dilation]

  - slug: record-light-cone
    hook: >
      Records are safe from distant meddling by theorem: nothing outside the
      light cone can steer which outcome the arena's fibre has written down.
    layman: >
      Here is the problem. If measurement outcomes are written into a hidden
      part of the arena, a skeptic should ask how robust the writing is. Could
      a distant disturbance -- some operation far from the apparatus -- reach
      in and rewrite the record? If so, records would be too fragile to ground
      anything.

      The answer is a locality theorem aimed exactly at that worry. Take a
      record written into the arena's fibre by a local interaction. Take any
      disturbance supported far away, and let everything evolve. The theorem
      bounds how much the record cell can move by a quantity that dies
      factorially in the graph distance -- the same light-cone suppression
      that governs ordinary observables.

      Distant meddling does not slightly corrupt records. It exponentially
      fails to touch them.
    in_csd: >
      This is the record layer and the field track meeting: the fibred arena
      carries record strokes -- fibre shifts controlled by base observables --
      and the Lieb-Robinson machinery transports its cone through the bridge.
      Disjoint kicks commute with record writing exactly; distant kicks steer
      the written cell by at most the cone bound.

      Scope, stated where it is proved: the stroke shape of fibre activity --
      base-dependent fibre shifts, the corpus's own record mechanism -- not
      arbitrary base-coupled fibre velocities, which nothing in the record
      layer needs.
    mathematical: >
      record_lightcone: for a record stroke driven by an observable A and a
      disturbance outside distance d, the displacement of the recorded fibre
      cell after time t is bounded by the Lipschitz data of the stroke times
      2 (2 norm(S) t)^d / d! times norm(A) -- the rigid part of the fibre
      rotation cancelling between the disturbed and undisturbed histories.
      Companions: exact commutation of disjoint kicks with record writing,
      and the arena-level cone the bridge transports.
    term: Record light cone
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/FibredArenaBridge.lean
      theorem: record_lightcone
    related: [lieb-robinson-bound, record-layer, fibre, field-arena]

  - slug: partial-trace
    hook: >
      Mathlib has no matrix partial trace, so the corpus built one -- the
      staple operation of quantum information, staged for upstreaming with its
      API proved.
    layman: >
      Here is the problem, and it is the formal-methods reader's problem more
      than the physicist's. Ignoring part of a quantum system -- tracing out
      the environment, keeping the subsystem -- is the single most common
      operation in quantum information. Ask what a library of formalised
      mathematics offers for it, and until recently the answer for Lean's
      Mathlib was: nothing at the matrix level.

      The corpus's staging tree fills the gap: the partial trace over either
      tensor factor, with the lemmas one actually needs -- linearity, trace
      preservation, positivity preservation, the reduced state of a density
      matrix being a density matrix, and the defining identities pairing a
      joint operator against one-sided observables.

      Category-one infrastructure: nothing CSD-specific anywhere in it, built
      to be given away.
    in_csd: >
      The partial trace is load-bearing across the corpus: reduced states in
      the decoherence and einselection tiers, marginals of the composite field
      arena -- where local observations on entangled points are exactly
      reduced-state expectations -- and the entropy tier's subadditivity
      arguments all consume it.

      A small library-hygiene story attaches: the defining reduced-trace
      identities were originally proved in the entropy module, and when the
      entangled-weights work needed them without the entropy stack they were
      rehomed beside the definition -- the rule that the defining property of
      an operation lives with the operation.
    mathematical: >
      partialTraceRight and partialTraceLeft on Matrix (n x m) (n x m), with:
      bundled linearity; trace preservation; Kronecker reduction, the trace of
      the traced-out factor scaling the survivor; Hermiticity and positivity
      preservation via tensor witness vectors; density-to-density; and the
      reduced-trace identities Tr(M (X (x) I)) = Tr(Tr_B M X) and its mirror.
      All foundational-triple-only.
    term: Partial trace
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/PartialTrace.lean
      theorem: partialTraceRight
    related: [quantum-channel, von-neumann-entropy, entropy-subadditivity, kronecker-product]

  - slug: entropy-subadditivity
    hook: >
      Information in the whole never exceeds the sum of its parts -- von
      Neumann's inequality, proved at the matrix level with the operator
      logarithm split that usually gets waved through.
    layman: >
      Here is the problem. Entropy measures missing information, and for
      quantum systems the basic sanity check is subadditivity: the entropy of
      a joint system is at most the sum of the entropies of its parts.
      Correlations can only make the whole MORE predictable than its parts
      suggest, never less.

      Every textbook states it; the proof leans on two steps that are easy to
      say and laborious to formalise. Klein's inequality -- relative entropy
      is nonnegative -- needs a careful spectral argument with a
      doubly-stochastic overlap matrix. And the logarithm of a tensor product
      splitting into a sum needs the operator functional calculus to commute
      with the Kronecker structure, which is exactly the step informal proofs
      wave through.

      Both are done, so the inequality stands on checked ground, including for
      pure entangled states -- the case where the whole has zero entropy and
      the parts do not, which is the quantum signature classical entropy
      forbids.
    in_csd: >
      The entropy tier serves the programme's thermodynamics track and its
      decoherence accounting: entropy production in measurement, the entropy
      ledger of the chaos diagnostics, and the Landauer touchpoint all cite
      the von Neumann entropy machinery this inequality anchors.

      Deferred pieces are named rather than hidden: the strong version --
      subadditivity with three parties -- is proved conditionally on the data
      processing inequality, stated as an explicit hypothesis, and the
      triangle inequality's purification construction is recorded as the
      missing step.
    mathematical: >
      vonNeumannEntropy_subadditive: S(rho_AB) <= S(rho_A) + S(rho_B) for a
      bipartite density with positive-definite marginals, the joint state
      merely PSD. Route: Klein's inequality via the doubly-stochastic overlap
      expansion; the Kronecker-log split log(A (x) B) = log A (x) I + I (x)
      log B via a diagonalisation-respecting functional calculus; and the
      reduced-trace identities collapsing the cross terms. Araki-Lieb's one
      side is proved under its stated hypotheses.
    term: Entropy subadditivity
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Subadditivity.lean
      theorem: vonNeumannEntropy_subadditive
    related: [von-neumann-entropy, partial-trace, landauer-principle, gibbs-state]

  - slug: schrodinger-from-records
    hook: >
      The Schrodinger equation is not postulated here. Preserving record
      statistics forces unitarity, unitarity plus continuity forces a
      Hamiltonian, and the exponential form is a theorem at the end of a chain.
    layman: >
      Here is the problem. Reconstructions of quantum mechanics usually spend
      their effort on probability and quietly assume the dynamics: states
      evolve by the Schrodinger equation because that is the theory being
      reconstructed. If the arena picture is doing real work, the dynamics
      should be earned too.

      The corpus's route earns it from records. Suppose the arena's dynamics
      preserves record statistics -- the pairwise outcome frequencies that
      experiments actually accumulate. A rigidity theorem going back to Wigner
      says a map preserving those statistics must be unitary or antiunitary; a
      selection argument kills the antiunitary branch along a continuous flow;
      a phase-lifting step and a continuity theorem of Stone's type then
      deliver a self-adjoint generator.

      The endpoint is the exponential form of the Schrodinger equation,
      derived -- with the premise being about statistics of records, not about
      Hilbert-space structure.
    in_csd: >
      The W-series is the dynamics spine: the projected sector flow is
      conjugation by a one-parameter unitary group, proved from the descent
      structure rather than assumed, with the record-level premise conversion
      making the hypothesis operational -- transition probabilities ARE record
      observables, so preserving record statistics and preserving transition
      probabilities are the same predicate, by theorem.

      The honest scope is tracked mechanically: the sector-linkage guard
      enforces that the descent equation is genuinely consumed, and the
      connectivity manifest -- not this page -- is the single source of truth
      for which end-to-end connective claims are backed.
    mathematical: >
      sigmaFlow_schrodinger_form: for sector data with a projectable flow, the
      projected dynamics is exp(-itH)-conjugation on rays, via Wigner rigidity
      on the transition-probability-preserving hypothesis, the Bargmann branch
      discriminator, the U(1) phase lift, and a C^1 Stone theorem. The
      record-level conversion equates the operational premise with the
      geometric one and re-derives the flow theorem from record statistics,
      with the invariance of the Fubini-Study measure obtained with U(N) in
      the proof and never in the statement.
    term: Schrodinger from records
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF4/PhaseLift.lean
      theorem: sigmaFlow_schrodinger_form
    related: [schrodinger-equation, wigner-rigidity, stone-theorem, bargmann]

  - slug: shor-code
    hook: >
      The first quantum error-correcting code that fixes everything, verified
      gate by gate: nine qubits, any single-qubit error, built by concatenation
      and proved including its famous degeneracy.
    layman: >
      Here is the problem. Quantum information cannot be copied, and measuring
      it disturbs it -- so error correction, which classically works by
      redundancy and inspection, looks impossible. Shor's nine-qubit code was
      the 1995 proof that it is not: encode one qubit across nine, and any
      error on any single qubit -- flip, phase, or both -- can be detected and
      undone without ever learning the protected information.

      The corpus verifies the code as built objects, not as prose: the
      stabiliser checks, the syndrome extraction, the correction operations,
      and the recovery theorems for each error type.

      The subtle point survives formalisation intact: two different phase
      errors can produce the same syndrome and the same correction still
      works -- the degeneracy that makes quantum codes stranger than
      classical ones.
    in_csd: >
      The QEC suite is empirical breadth, labelled as such: quantum mechanics'
      own machinery reproduced inside the corpus's formal frame, part of the
      regression suite that keeps the programme's operational layer honest.
      The code is built by concatenation -- the phase-flip code layered over
      the bit-flip code -- so the module structure mirrors the pedagogy.

      For the formal-methods reader the interest is the object level:
      encoders, syndromes and corrections are explicit maps with theorems,
      not a stabiliser formalism cited from outside.
    mathematical: >
      shor_corrects_X, shor_corrects_Z_degenerate, shor_corrects_XZ: for every
      block position and every logical state, applying the error followed by
      syndrome-directed correction returns the encoded state -- with the Z
      case proved through the degeneracy (correction at any position within
      the affected block) and the combined XZ case composing both recoveries.
      Stabiliser fixing lemmas certify the code space.
    term: Shor code
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Empirical/QM/QEC/ShorNine.lean
      theorem: shor_corrects_XZ
    related: [shor-algorithm, pauli-matrices, quantum-channel]

  - slug: robertson-uncertainty
    hook: >
      The uncertainty principle, with its ontic half computed: the variances in
      Robertson's inequality are honest integrals over the arena, not just
      Hilbert-space expectations.
    layman: >
      Here is the problem. The uncertainty principle is quantum mechanics'
      most famous export and its most misquoted. The precise statement is
      Robertson's: for any two observables, the product of their spreads in a
      given state is bounded below by half the expectation of their
      commutator. No measurement-disturbance story required -- it is a fact
      about statistics.

      The corpus proves Robertson's inequality and then does the part that
      belongs to the arena picture: it identifies each variance as an
      integral over the ontic space, so the spread the inequality bounds is
      the spread of a genuinely distributed quantity, not an abstract
      expectation.

      Two concrete witnesses pin it down, including a case where the bound is
      saturated -- the inequality is tight, and the formalisation exhibits
      the tightness.
    in_csd: >
      This is the observable-correspondence tier: Hermitian observables
      acquire ontic representatives whose Lebesgue integrals reproduce
      Hilbert-space expectations, via a genuine spectral expansion on one
      side and the fibre partition on the other. Robertson's inequality then
      holds with the left-hand side read ontically -- the uncertainty bound
      as a statement about spreads of arena quantities.

      The witnesses are Pauli pairs on explicit states: saturation at the
      qubit, and the parametric axis version quantified over unit directions.
    mathematical: >
      kahler_robertson_ontic_variance: the product of ontic-side variances
      dominates the commutator bound, with the variance identification
      running through the spectral-region integral identities -- the ontic
      centred second moment equals the Hilbert-space variance. Companions:
      pauli_xy_robertson_saturation with both sides equal to one, and the
      parametric pauliDot version over arbitrary axes.
    person: >
      Howard Percy Robertson (1903-1961) was an American mathematical
      physicist at Caltech and Princeton, known jointly for the
      Robertson-Walker metric of cosmology and the 1929 general uncertainty
      relation -- a one-page Physical Review note sharpening Heisenberg's
      heuristic into an inequality for arbitrary observable pairs, later
      refined by Schrodinger with the covariance term.
    term: Robertson uncertainty relation
    eponyms: [Robertson]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF4/UncertaintyKahler.lean
      theorem: kahler_robertson_ontic_variance
    related: [hermitian-operator, pauli-matrices, poisson-bracket]

  - slug: interaction-price
    hook: >
      Turning on an interaction costs locality at a linear rate -- and the price
      is exact on both sides: bounded below by the coupling and above by twice
      the coupling.
    layman: >
      Here is the problem. Free field dynamics keeps observables confined to
      their modes forever. Interactions spread them. The qualitative statement
      is folklore; the quantitative question is the interesting one: at what
      RATE does interaction buy delocalisation, and is the rate you can prove
      also the rate that actually occurs?

      The corpus answers with a sandwich. Upper bound: after one period of an
      interacting drive, every local observable stays within twice
      coupling-times-time of some exactly local operator -- locality violation
      priced linearly. Lower bound, on an explicit witness: a computable
      commutator forces every exactly local operator to be at least a
      comparable linear distance away.

      Between the two, "costs at most" becomes "costs exactly", up to a
      constant between one-over-pi and two.
    in_csd: >
      The price ladder is the field track's quantitative locality backbone: it
      feeds the propagator's interacting corrections, the cutoff-uniform
      renormalised couplings, and the channel-level coarse-graining budget,
      where the whole error of a renormalisation step is the interaction's
      price because the free part intertwines exactly.

      The attainment closed a declared boundary: the upper bound had stood
      alone with its sharpness explicitly unclaimed, and the witness
      construction retired that caveat.
    mathematical: >
      price_linear_attained: the distance from the interacting Heisenberg
      observable to the subalgebra supported on the free modes satisfies
      tau lambda / pi <= dist <= 2 tau lambda -- the lower bound via the
      commutator functional (any supported operator commutes with a disjoint
      probe, so one computed commutator bounds the distance to the whole
      subalgebra) with the commutator entry of modulus 2 sin(tau lambda / 2)
      exactly, and the Jordan inequality converting the sine to the linear
      form.
    term: Interaction price
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/CV/PriceAttainment.lean
      theorem: price_linear_attained
    related: [field-arena, lieb-robinson-bound, no-exact-finite-ccr]

  - slug: does-csd-violate-bell
    kind: question
    hook: >
      No. Bell's theorem stands, CSD proves its own versions of it, and the escape
      route is the one the theorem itself prices: contextuality, paid openly.
    layman: >
      Bell's theorem is not violated by any theory that matches experiment, CSD
      included. What the theorem forbids is a specific package: hidden variables
      that are local and context-independent. Quantum experiments violate Bell's
      INEQUALITIES; the theorem survives that violation -- it is precisely the
      proof that no local package can produce it.

      CSD reproduces the quantum violations and respects the theorem by not being
      in the forbidden class: its outcome assignments depend on the measurement
      context. That is not a loophole discovered last week; it is the theorem's
      stated price, and the programme pays it in the open.

      The distinctive part is that CSD does not ask you to take any of this on
      trust. The obstruction theorems are proved inside the corpus, and so is the
      existence half most discussions skip: an explicit contextual model that
      actually reproduces the singlet statistics, in full.
    in_csd: >
      The corpus carries both directions as one machine-checked capstone. The
      negative direction: no product partition of a shared state space reproduces
      the singlet correlations, and no global context-independent assignment is
      compatible with the reproduced table -- Bell-type obstructions proved
      in-house, for the class, not for a strawman.

      The positive direction: an explicit measurable shared-context family on the
      corpus's own arena reproduces the complete singlet table -- marginals and
      correlations at every setting. And the model is proved no-signalling, with
      measurement independence named and verified as a premise rather than
      quietly assumed. Evading Bell is cheap until the model is on the table;
      the point of the capstone is that it is on the table.
    mathematical: >
      c1_singlet_contextual_capstone: existence and obstruction in one statement.
      Supporting: no_product_partition_realises_singlet over arbitrary measurable
      spaces; the GHZ and CGLMP obstructions at general dimension; remote
      marginal invariance for both wings of the exhibited model; and the CHSH
      and Tsirelson analysis the inequalities sit in. All
      foundational-triple-only.
    term: Does CSD violate Bell's theorem?
    status: definition
    source: curated
    related: [bell-chsh, singlet-contextual-model, hidden-variables, contextuality, no-signalling, is-csd-superdeterministic]

  - slug: does-csd-conflict-with-pbr
    kind: question
    hook: >
      No -- and the reason is precise: PBR rules out epistemic states whose ontic
      supports overlap, and CSD's epistemic states have disjoint supports by
      construction.
    layman: >
      The Pusey-Barrett-Rudolph theorem is often summarised as "the quantum state
      is real", which makes any programme calling the state epistemic sound
      refuted from the start. The summary is too coarse, and the coarseness is
      exactly where the default machine-generated answer goes wrong.

      What PBR actually rules out is a specific class of models: those where two
      distinct pure states can be knowledge about overlapping sets of underlying
      world-states, plus an independence assumption about preparing systems
      side by side. The theorem shows such overlap contradicts quantum
      predictions. It says nothing against models where distinct states describe
      disjoint sets of world-states.

      CSD is in the second camp. Two distinct pure preparations correspond to
      disjoint regions of the arena -- different base points, different fibres,
      no overlap anywhere. The state functions epistemically -- it summarises
      what a preparation pins down -- but the underlying supports never overlap,
      so the PBR premises are simply not met.
    in_csd: >
      In the Harrigan-Spekkens classification that PBR is stated in, CSD's
      working model is psi-ontic: the ontic state determines the quantum state
      (read the base coordinate off the arena point). What the programme means
      by calling the state epistemic is its functional role -- a compressed
      description of preparation knowledge whose update on measurement is
      learning, not physics. Those are two different uses of the word, and
      collapsing them is the category error behind "PBR rules this out".

      Since 2026-08-21 the story has its second half as theorems. Conditioning
      on an EXACT pure state is an unreachable idealisation -- single fibres of
      the projection are Liouville-null -- so the preparations a laboratory can
      make are regions. And region preparations around distinct states provably
      DO overlap: their conditional laws cannot be separated onto disjoint
      supports. That overlap lives outside PBR's premises too, because a region
      preparation projects to a mixed density, not a pure state -- and PBR is a
      theorem about pure-state preparations.

      The honest boundary, kept honestly: the full mapping of PBR's boundary
      onto the programme is not formalised, and the psi-epistemic entry marks
      that terrain as live rather than settled. What is machine-checked is the
      structural pair the question turns on: disjoint supports for the
      idealised states, proved overlap for the physical preparations.
    mathematical: >
      The idealised half is definitional: the epistemic measure at an exact
      preparation p is the Dirac mass at p on the base times Haar on the fibre,
      and for distinct p the supports are disjoint -- the overlap PBR needs is
      absent by construction.

      The physical half is proved: kMuL_fibre_null (exact pure-state
      conditioning conditions on a null set, so the Dirac wrapper is
      unreachable as a physical preparation); conditional_not_mutuallySingular
      and its witness kahler_preparations_overlap (region preparations on
      overlapping neighbourhoods of any two rays have non-separable conditional
      laws); and the rho_ep theorems (a region preparation's projective law is
      a density against the Fubini-Study measure -- a mixed state, outside
      PBR's pure-state premises).
    term: Does the PBR theorem rule out CSD?
    status: definition
    source: curated
    external:
      - text: "Pusey, Barrett and Rudolph, On the reality of the quantum state, Nature Physics 2012"
        url: https://doi.org/10.1038/nphys2309
    related: [psi-epistemic, epistemic-measure, hidden-variables, is-the-wavefunction-real, ontic-vs-epistemic]

  - slug: is-the-born-rule-derived
    kind: question
    hook: >
      Derived as a volume, from a measure nobody chose -- with the posits that
      remain listed by name rather than hidden in the machinery.
    layman: >
      The Born rule -- probabilities as squared amplitudes -- is an axiom in the
      textbook. In CSD it is a computed quantity: the probability of an outcome
      is the size of a region of the arena, measured with the unique measure the
      space's symmetry allows, and a convergence theorem turns those sizes into
      observed frequencies.

      Two things make that more than a restatement. The measure is forced -- its
      uniqueness is a theorem, so nobody tuned the ruler to get the right sizes.
      And the regions, in the mature form of the results, are not carved to fit
      either: their sizes fall out of the geometry through the moment map.

      What is NOT claimed is derivation from nothing. The projection from arena
      to state space is a postulate; reading probability as typicality over
      repeated preparations is a stance the theorems make precise rather than
      prove. The programme's habit is to say exactly this out loud.
    in_csd: >
      The chain: the Fubini-Study measure is the unique invariant measure
      (Paper B's argument, proved at general dimension); the Born weight equals
      a volume ratio in that measure, unconditionally, for every coordinate; and
      empirical frequencies converge to those volumes almost surely under
      repeated preparation. The historically carved constructions are retained
      and labelled -- the corpus's own word for them is carving -- and the
      derived route stands independent of them.

      The remaining posits are structural and named: projectability (the sector
      postulate), and the typicality reading of the conditioned measure. The
      operational stratum's Gleason-type route exists in parallel and is kept
      distinct, so nobody can mistake which stratum a citation leans on.
    mathematical: >
      fubiniStudyMeasure_unique; fs_born_volume_ratio_N with the apex variant;
      born_frequency_convergence_N for the joint almost-sure statement; and the
      moment-map identity momentMap_mk_eq_inner_sq with the Duistermaat-Heckman
      pushforward behind it. The volume route is Gleason-free end to end; the
      effect-Gleason representation is proved separately on the operational
      stratum.
    term: Is the Born rule derived or assumed in CSD?
    status: definition
    source: curated
    related: [born-weight, born-volume-ratio, fubini-study-measure, typicality-volume, carving, gleason-theorem]

  - slug: where-do-probabilities-come-from
    kind: question
    hook: >
      From ignorance, priced honestly: the dynamics never rolls dice, and the
      statistics are the measured sizes of what a preparation cannot pin down.
    layman: >
      A deterministic world seems to leave no room for quantum probability. The
      resolution is old and respectable -- probability as ignorance of initial
      conditions -- but it always carried a debt: who chooses the measure of
      ignorance? Choose it freely and you can get any answer you like.

      CSD's account: every run of an experiment starts from a slightly
      different microstate, because no procedure controls the arena completely.
      The set of compatible microstates is the preparation region. What
      fraction of it leads to outcome i? That fraction -- computed in the one
      measure symmetry allows, not one chosen for convenience -- is the
      outcome's probability, and the strong law of large numbers converts it
      into the frequencies laboratories actually record.

      One path through the world, dice nowhere, and the randomness entirely in
      which microstate each preparation happened to land.
    in_csd: >
      This is repeated-preparation typicality, and the distinction it is NOT is
      worth stating: probabilities do not come from watching one trajectory
      forever and hoping it explores fairly. The corpus proves the projected
      flow is not ergodic -- the time-average route is closed at that level --
      and never needs it: each trial is a fresh draw from the conditioned
      measure, and the frequency theorems run on that alone.

      The measure-choice debt is paid by the uniqueness theorem: the
      Fubini-Study measure is the only invariant option, so the ignorance is
      priced by a ruler nobody selected.
    mathematical: >
      LF1_main_theorem_ae converts region volumes into almost-sure limiting
      frequencies under i.i.d. preparation sampling; fubiniStudyMeasure_unique
      removes the measure freedom; the general-N volume identities make the
      limiting values the Born weights. The non-ergodicity of the epistemic
      unitary flow is proved and kept as a boundary marker between the claimed
      route and the unclaimed one.
    term: If CSD is deterministic, where do probabilities come from?
    status: definition
    source: curated
    related: [typicality, typicality-volume, preparation-region, single-trajectory, determinism, lf1-main-theorem]

  - slug: is-csd-a-hidden-variable-theory
    kind: question
    hook: >
      Yes, in the technical sense, and the programme says so on page one of the
      argument: contextual, correlations beyond locality, both no-go prices paid
      in the open.
    layman: >
      "Hidden-variable theory" is a technical classification, not an insult: a
      theory in which something definite underlies the quantum state. CSD has
      exactly that -- the arena and its one real trajectory -- so the honest
      answer is yes, with the classification's fine print read aloud.

      The fine print is the no-go theorems, and they do not say what the
      one-line summaries claim. Bell rules out LOCAL hidden variables;
      Kochen-Specker rules out NON-CONTEXTUAL ones. Surviving both means being
      contextual and letting correlations exceed what locality permits -- which
      is precisely the shape CSD has, on purpose.

      One error to avoid: the quantum state is not the hidden variable. The
      state is the visible summary; the hidden variable is the arena point
      beneath it, including the fibre coordinate no state determines.
    in_csd: >
      The corpus proves the constraining theorems itself rather than citing
      them: product partitions cannot reproduce the singlet, global assignments
      cannot survive contextuality, GHZ and CGLMP obstructions at general
      dimension. And it proves the survival is genuine rather than verbal: the
      contextual model that reproduces the singlet table exists as a
      constructed object.

      Where the correlations exceed locality, signalling still provably does
      not: locality of OPERATIONS holds exactly -- a distant kick moves no
      local statistic -- which is the physically load-bearing half of locality
      and the one experiments enforce.
    mathematical: >
      no_product_partition_realises_singlet and its GHZ companion over
      arbitrary measurable state spaces; the global-assignment obstruction and
      the contextual witness in the C1 capstone; composite_no_signalling exact
      for all states; and the Kochen-Specker-adjacent contextuality machinery
      of the Mermin-Peres square, all in-corpus.
    term: Is CSD a hidden-variable theory?
    status: definition
    source: curated
    related: [hidden-variables, contextuality, does-csd-violate-bell, does-kochen-specker-rule-out-csd, bohmian-mechanics]

  - slug: does-kochen-specker-rule-out-csd
    kind: question
    hook: >
      No -- Kochen-Specker forbids context-independent value assignments, and
      CSD assigns values through the measurement context by construction.
    layman: >
      The Kochen-Specker theorem is the quieter sibling of Bell's: it shows you
      cannot assign definite answers to all possible quantum measurements at
      once, independent of which experiment is actually performed. Any theory
      claiming a definite underlying reality has to reckon with it.

      The reckoning is the same as with Bell, and it is not evasion: the
      theorem's target is NON-CONTEXTUAL assignment. A theory whose outcome
      map depends on the measurement context -- on the actual physical
      arrangement doing the asking -- is outside the theorem's scope, at the
      declared cost of accepting that dependence.

      CSD accepts the dependence and then does something the usual discussion
      does not: it makes the context a formal object with its own data, so
      "the outcome depends on the context" is a definition you can compute
      with, not a slogan.
    in_csd: >
      A measurement context is a rate field on the arena's base -- the
      apparatus's own data -- and outcome basins are built from it. Distinct
      contexts genuinely induce distinct partitions, which is exactly the
      dependence Kochen-Specker demands of a surviving theory. The corpus
      proves the obstruction side too, in its own frame: no global assignment
      is compatible with the exhibited contextual statistics, and the
      Mermin-Peres machinery pins the finite-dimensional contradiction.

      One clarification the fibre analysis added: the base-only failure at
      dimension three and above is NOT a Kochen-Specker corollary -- CSD's
      partitions being contextual, the classical no-gos do not apply to them
      -- it is a separate covariance-and-positivity obstruction, proved on
      its own.
    mathematical: >
      The contextuality tier: the global-assignment obstruction in the C1
      chain; the Mermin-Peres square's contextuality witness; the
      context-indexed outcome map machinery with its definitional separation
      -- no Fine-theorem shortcut assumed; and the N >= 3 fibre-forcing
      analysis, explicitly distinguished from Gleason and Kochen-Specker in
      the source.
    term: Does the Kochen-Specker theorem rule out CSD?
    status: definition
    source: curated
    related: [kochen-specker, contextuality, measurement-context, mermin-inequality, is-csd-a-hidden-variable-theory]

  - slug: is-csd-superdeterministic
    kind: question
    hook: >
      No. The exhibited Bell model satisfies measurement independence -- named as
      a premise and proved for the model -- and the escape from Bell runs through
      contextual outcome maps, not conspiratorial settings.
    layman: >
      Superdeterminism is the escape from Bell's theorem most physicists find too
      expensive: deny that measurement settings can be chosen independently of
      the hidden state, so the correlations were arranged in the initial
      conditions of the universe. It saves locality by making experiments
      unreadable -- if settings and systems conspire, no measurement tests
      anything.

      CSD does not take that route, and the claim is checkable rather than
      rhetorical. In the corpus's Bell analysis, measurement independence -- one
      shared distribution over the hidden states, the same across all setting
      choices -- is stated as an explicit premise and PROVED for the exhibited
      model. The model's escape from Bell is contextuality of the outcome maps:
      what depends on the setting is how outcomes are read off, not which
      hidden states occur.

      Deterministic, yes. Superdeterministic -- settings correlated with the
      hidden state -- demonstrably not.
    in_csd: >
      The distinction the question turns on is between two places setting-
      dependence could enter: the distribution over hidden states (that is
      superdeterminism) and the outcome functions (that is contextuality). The
      corpus's model has one fixed measure across every context -- measurement
      independence holding by construction and stated in-module -- while the
      per-context outcome maps carry all the setting dependence.

      The honesty note the documentation itself makes: measurement independence
      is a genuine premise of Bell derivations, and naming it is part of
      keeping the Bell analysis auditable. Naming a premise is not denying it.
    mathematical: >
      The C1 chain's operational no-signalling stack: remote marginal
      invariance for both wings under a single shared measure -- which IS
      measurement independence, stated in-module -- proved for the
      singlet-reproducing contextual model; the model's context dependence
      isolated in the outcome family; and the obstruction theorems showing the
      dependence cannot be removed.
    term: Is CSD superdeterministic?
    status: definition
    source: curated
    related: [does-csd-violate-bell, singlet-contextual-model, contextuality, determinism, hidden-variables]

  - slug: is-the-wavefunction-real
    kind: question
    hook: >
      The arena is real; the wavefunction is its visible coordinate. Real enough
      to be readable off the world, too thin to be the world.
    layman: >
      "Is the wavefunction real?" runs two questions together. Does something in
      the world correspond to it? And is it the complete story of what exists?
      CSD's answers come apart cleanly: yes, and emphatically no.

      Yes: the quantum state is not a fiction or a mere gambling position. Every
      arena point projects to a definite state, so the state tracks a genuine
      feature of the world -- you could read it off the world's actual
      configuration if you had access.

      No: the state is radically incomplete. The projection that produces it is
      many-to-one, and everything that decides measurement outcomes -- the
      fibre coordinate, the basin the trajectory occupies -- lives in what the
      projection forgets. Treating the state as the whole world is exactly the
      move that generates the measurement problem; treating it as a lossy
      coordinate dissolves it.
    in_csd: >
      The state's dual character is structural, not rhetorical. Functionally it
      is epistemic: it summarises what a preparation pins down, and its update
      on measurement is learning. Ontologically its supports are disjoint --
      distinct states describe disjoint sets of arena points -- which is why
      the reality theorems aimed at overlapping-support models do not bite.

      The programme's discipline is to refuse the shorter slogans in both
      directions: "the wavefunction is everything" overclaims what the sector
      carries -- the fibre analysis proves record-forming content cannot live
      there at higher dimension -- and "the wavefunction is nothing" ignores
      that it is a faithful coordinate of the real arena.
    mathematical: >
      The formal content is the projection structure: a measurable many-to-one
      pi from the arena to the projective sector, the epistemic measure exact
      on the base and spread on the fibre, and the record layer's theorems
      placing outcome-deciding structure in the fibre at N >= 3. The
      operational stratum's state notion -- density operators and effects --
      is proved consistent with the volume stratum wherever both speak.
    term: Is the wavefunction real in CSD?
    status: definition
    source: curated
    related: [psi-epistemic, does-csd-conflict-with-pbr, many-to-one-projection, ontic-vs-epistemic, fibre]

  - slug: what-happens-during-measurement
    kind: question
    hook: >
      The system stops being isolated, the joint dynamics writes a record into
      the arena, and "collapse" is the update of a description -- one law,
      no switch.
    layman: >
      The textbook's answer is famously two answers: smooth evolution until a
      measurement, then a jump, with no rule for when to switch. CSD's answer
      has one law and three stages, each of them ordinary physics.

      First, de-isolation: measuring means coupling the system to an apparatus,
      deliberately ending its isolation. Second, sorting: the joint
      deterministic dynamics carries the arena point into one of the outcome
      basins -- regions fixed by the apparatus alone, before the system
      arrived. Third, the record: which basin the trajectory occupies is a
      physical fact of the arena, stable, re-readable, protected from distant
      interference by a light-cone theorem.

      The state's jump is then bookkeeping: you learned which basin, you update
      the description. Nothing physical collapsed; your summary caught up with
      the world.
    in_csd: >
      Each stage is formalised at its own tier. De-isolation flows exist as
      constructed objects -- deterministic, measure-preserving, provably not
      the identity -- realising the measurement dilation dynamically, with
      pointer-block volumes equal to the Born weights. The basins are the
      record layer's context-fixed partition, Born-weighted by theorem. The
      Luders update rule is derived as the correct conditional bookkeeping in
      the sequential and mixed tiers.

      The stated open frontier is the junction: deriving the fibre-level
      record mechanism from the de-isolation dynamics, rather than exhibiting
      each side separately. The programme calls this the record layer's
      remaining work, in public.
    mathematical: >
      measurement_flow_born_frequency for the dynamics tier;
      globalBasin_born and the disjointness and exhaustion theorems for the
      kinematic tier; record_lightcone for the record's stability; the Luders
      tier for sequential conditioning; and the einselection theorems for why
      pointer readings are the stable alphabet.
    term: What happens during a measurement in CSD?
    status: definition
    source: curated
    related: [de-isolation, measurement-problem, collapse, outcome-region, record-layer, measurement-flow]

  - slug: what-is-machine-checked
    kind: question
    hook: >
      Every theorem in the corpus, from zero imported axioms -- and the honest
      list of what a proof assistant cannot check is published next to it.
    layman: >
      "Machine-checked" gets used loosely, so here is the strict version this
      programme means. Every theorem in the csd-lean4 corpus is verified by the
      Lean proof assistant down to its logical kernel: tens of thousands of
      lines in which no step is taken on trust.

      Two facts sharpen it. The corpus imports zero axioms beyond Lean's
      foundational three -- an early reliance on an unproved representation
      theorem was discharged by proving it. And the physical postulates are not
      axioms smuggled in: they are hypotheses carried visibly in theorem
      statements, so the cost of each result is auditable at its use site.

      Equally strict is what checking cannot do: it cannot certify that a
      formal statement MEANS what the prose says it means. A fluent, false
      description of a true theorem is the actual failure mode -- so the
      repository runs mechanical guards against prose drift, and says plainly
      that the mathematics-to-physics reading is a human responsibility.
    in_csd: >
      The verification posture is layered: the library and its regression
      suite build with warnings as errors; an axiom-audit suite pins every
      headline constant's axiom set; a validation ledger tracks each claim's
      status row by row; and a battery of guard scripts checks the things a
      compiler cannot see -- vacuous statements, carried-but-unused
      hypotheses, prose claims outrunning proved connectivity, and glossary
      anchors like the ones behind this page.

      The distinctive commitments: postulates as hypotheses rather than
      axioms, honest-scope notes in the modules themselves, and a stated rule
      that a wall is reported rather than papered over with a stub.
    mathematical: >
      The kernel-checked corpus spans the frequency layer, the measure and
      Born tiers, measurement dynamics, the entangled tier, the record layer,
      thermodynamics and the finite field track, with every pinned constant
      reporting exactly propext, Classical.choice and Quot.sound. The staging
      tree contributes Mathlib-candidate infrastructure -- partial trace,
      the general Lie-Trotter formula -- built CSD-free.
    term: What exactly is machine-checked in CSD?
