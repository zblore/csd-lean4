# docs/glossary.yaml - the ONLY prose source for the CSD glossary.
#
# One record per CONCEPT, keyed by the eponym(s) that name it. The key set comes
# from scripts/extract-eponyms.sh, which reads declaration and module names: the
# corpus decides what needs explaining, not taste. Pairs collapse here (Fubini +
# Study are one measure), because collapsing is editorial and the extractor
# deliberately refuses to do it.
#
# FIELDS
#   hook          one sentence, the thing a reader would repeat to someone else.
#                 Not a definition and not a category label. If it is neither
#                 surprising nor consequential, the entry has no reason to exist.
#   layman        no notation, no jargon. OPEN WITH THE PROBLEM -- the concrete
#                 puzzle this thing exists to answer -- then what the answer is.
#   in_csd        how CSD solves that problem and what the thing means inside the
#                 programme. State the solution, not just the role.
#   mathematical  what was proved and how it was proved, for a specialist.
#   person        who the name belongs to: places, universities, and the story of
#                 how the result was written or published, when there is one.
#   image         OPTIONAL {file, alt, caption, credit, licence, source, article, wide}:
#                 a portrait or diagram from Wikimedia Commons, self-hosted under
#                 docs/img/ (file is the path relative to docs/), shown beside the
#                 plain-terms register (wide: true for a landscape diagram, which then
#                 sits full width above the text) and as the social-preview image. Only where a
#                 relevant free image exists: a portrait for an eponym, the standard
#                 diagram for an apparatus or a construction, nothing decorative. The
#                 credit line carries the attribution the licence asks for and the
#                 caption says what the image is. check-glossary.sh requires the file
#                 and every attribution field. scripts/lib/glossary_images.py is the
#                 fetch-and-review tool that produced the first pass (2026-09-14).
#   site_link     OPTIONAL {url, text}: the ONE onward link into the main site
#                 (meta.site_main) a reader of this entry would actually want.
#                 The text is a specific sentence -- "Paper B derives the Born
#                 rule from this measure" -- never "Read more about CSD".
#                 check-glossary.sh verifies the URL is on the site_main domain
#                 and returns 200; an entry without one draws a warning.
#
# EDITORIAL RULES (author direction, 2026-09-11; replaces the 2026-08-19 voice note).
# Write for a curious, intelligent adult who has no specialist knowledge of quantum
# mechanics, advanced mathematics, CSD or Lean. Make the explanation understandable
# through its content, not merely through short sentences or conversational language.
#
#   1. Explain the idea and its importance first. Open with what the concept means and
#      the question it helps answer. Give readers a reason to care before describing the
#      mathematical construction.
#   2. Make "In plain terms" (the layman register) self-contained. A reader should
#      understand the central idea without consulting another page or reading the
#      mathematical section. Introduce necessary technical terms one at a time and explain
#      them immediately. Words such as "phase", "overlap" and "invariant" require
#      explanation even when they seem familiar to a physicist. A glossary link supplements
#      an explanation; it does not replace one.
#   3. Build understanding step by step. Start from something familiar, introduce the new
#      idea, then explain its consequence. Use a concrete example or analogy when it
#      genuinely clarifies the concept. Keep analogies faithful to the mathematics and
#      explain their limits where those limits affect understanding.
#   4. Explain the CSD connection (the in_csd register) in ordinary language. State how CSD
#      uses the concept and what that allows the programme to establish. Explain the role
#      of a result before describing its proof. Put derivations, theorem identifiers, axiom
#      details and implementation terminology in the mathematical register or in the
#      proof metadata (lean, papers, status).
#   5. Use a confident, natural voice. Sound like a knowledgeable scientist explaining an
#      interesting idea clearly. Use active verbs, familiar words and connected paragraphs.
#      Keep the personality without slang, theatrical declarations, exaggerated importance,
#      forced rhetorical questions or unexplained metaphors. Use British English. Avoid
#      all-capitals emphasis and em dashes.
#   6. Use tense consistently with the purpose. Use present tense for definitions,
#      established relationships and what a formal result establishes. Use past tense for
#      historical events. For evergreen reference pages, describe the current result
#      directly. Reserve phrases such as "now proves", "previously assumed" and "recently
#      completed" for explicitly dated progress reports.
#   7. Preserve scientific precision. Retain assumptions and qualifications that materially
#      change a claim. Distinguish established mathematics, CSD assumptions, formal results
#      and physical interpretations wherever relevant. Make strong claims when the sources
#      support them. Do not introduce sweeping claims or generic disclaimers for rhetorical
#      effect.
#   8. Make the page easy to scan. Give each paragraph one main purpose. The registers are
#      the headings (hook, In plain terms, In CSD, Mathematically, The name) and guide the
#      reader from intuition to application to optional technical detail. Keep historical
#      material relevant and sourced. Glossary links are added by the generator on the
#      first whole-word match of another entry's term, so use a term only when it denotes
#      the linked concept, not because its spelling matches.
#   9. Build each sentence the way a person types one (author direction, 2026-09-14, after
#      reading the RL-1 and TH5d prose). Start with the subject and its verb. Do not open
#      with a label, a fragment or a scene-setter. Join a fact and what follows from it with
#      "so", "as", "and" or "which", so one sentence carries both rather than two clipped
#      sentences with a full stop between. Contract where speech would ("doesn't", "isn't",
#      "that's"). Use plain verbs and plain nouns: "have a look", "doesn't need doing", "a
#      smaller job", never "identification", "instantiation" or "what's missing is". Say
#      what the reader gets or can now do, not the fact on its own. Drop the rhetorical
#      shaping: no colon-then-reveal, no sentence whose only job is to set up the next one,
#      no "the point is". Each sentence reports something and stops. Rule 9 applies to all
#      four registers; the mathematical register keeps its precision but not its stiffness.
#
# Before an entry is finished, review it from the perspective of someone encountering the
# subject for the first time: could they explain what the concept is, why it matters and
# how CSD uses it after reading the hook, In plain terms and In CSD? Revise any sentence
# that depends on unexplained specialist knowledge.
#
# Mechanics that survive from the earlier note: each register is a few paragraphs
# separated by a blank line (a blank line in a folded scalar parses to a newline, and the
# generator renders each as its own <p>); one idea per paragraph; ASCII only (write
# "Kahler", "--" is not used, dashes are avoided); no notation in hook, layman or in_csd.
#
# Three registers because the CSD query research found eight of nine reader
# personas have a repo path built for them and no page that says what the thing is.
#
# status must be one of the controlled values in scripts/check-glossary.sh. The
# vocabulary follows AXIOMS.md section 0 so the glossary cannot disagree with the
# ledger. lean.sha pins source links: paths on a moving branch rot, permalinks do not.

