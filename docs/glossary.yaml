  - slug: constraint-surface
    reviewed: 2026-09-14
    hook: >
      There's one arena, it's deterministic, and it doesn't grow, and everything else in
      the programme is bookkeeping about how much of it a measurement context lets you
      see.
    layman: >
      Quantum mechanics is spectacularly good at predicting what detectors do and
      spectacularly silent about what the world is, as the textbook hands you a recipe for
      outcomes and no picture of what exists between them.

      CSD starts by paying the cost most approaches defer, as it posits the world. There's
      one total space of everything that exists, called the constraint surface (the
      programme names it Sigma), and a single deterministic trajectory runs on it, a path
      in which each state fixes the next by law, with no branching, no dice, and no
      observer in the basement. What you can't do is ask what the surface is made of, as
      it's the floor, and every theory has a floor, so this programme says out loud where
      its floor is.

      The surprise is how little freedom the floor turns out to have. Ask what the surface
      must look like for quantum statistics to come out, and symmetry pins down its
      measure uniquely, where the measure is the rule that assigns a size to each region
      of the surface and so, eventually, a probability to each outcome, and symmetry also
      constrains its geometry tightly. The surface is posited, then constrained until
      almost nothing about it is a choice.
    in_csd: >
      The constraint surface is the floor and it's everything, the total, fixed, local
      ontic space, where ontic means existing independently of anyone's knowledge.
      Deriving it is a non-question, since there's nothing beneath a floor to derive it
      from, and what's legitimate, and actively pursued, is constraining it from above.
      The measure on the projected state space, the space of quantum states seen as a
      shadow of the surface, is forced by unitary symmetry, the group of transformations
      that preserve every quantum probability, and the concrete working arena is a compact
      Kahler space, a space of finite extent whose curved geometry is of the kind complex
      projective space carries.

      Everything quantum then happens at two levels. A measurement context, the choice of
      what to measure, partitions the projected view of the surface into outcome regions,
      and that partition is epistemic, a matter of description, while the weight of each
      region is an honest volume on the surface, and that measure is ontic. The Born rule,
      the quantum rule for assigning probabilities to outcomes, is the meeting point of
      the two.
    mathematical: >
      The corpus carries Sigma as the OnticSetup structure, a measurable space with a
      finite measure (the Liouville measure, finite but not normalised, as weights are
      ratios, and the preparation region is required to have nonzero measure so the
      normalisation is well-defined), a deterministic flow with a measure-preservation
      field, and a preparation region. Outcome frequencies converge almost surely to
      volume ratios by the strong law, which is the LF1 main theorem, with no
      probabilistic input beyond repeated-preparation sampling.

      The module makes one disclosure this page repeats, which is that through LF1 to LF3
      only measurability of the flow is consumed. The measure-preservation content is
      carried as structural payload for physical admissibility and becomes load-bearing
      only when LF4 derives the measure from a concrete volume form.

      The concrete instance is Sigma = CP^(N-1) x T^2 with the Fubini-Study measure on the
      base times normalised Haar on the torus fibre. Compactness does real work, as it's
      what forces the invariant measure to be unique.
    term: Constraint surface
    status: physical-postulate
    source: curated
    lean:
      module: CsdLean4/LF1/Setup.lean
    related: [projective-sector, liouville-measure, projectability, fibre, single-trajectory]
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper A builds outcome frequencies on exactly this arena

  - slug: ontic-vs-epistemic
    hook: >
      What exists is one question and what a measurement context lets you say is another,
      and most quantum paradoxes are category errors between the two.
    layman: >
      Quantum mechanics keeps two kinds of statement in one notation. The sentence "the
      atom is here" sounds like a fact about the world, and the sentence "the atom has a
      thirty percent chance of being here" sounds like a fact about what you know. The
      wavefunction, the mathematical object that encodes everything quantum mechanics says
      about a system, carries both voices at once, and a century of argument has been
      about which voice is fundamental.

      The distinction between map and territory is old, and it only starts to bite when
      you enforce it. A fact is ontic when it belongs to the territory, so it's true
      whether or not anyone looks, and a fact is epistemic when it belongs to the map some
      agent or apparatus draws. The trouble starts when a map-fact is mistaken for a
      territory-fact, that is, when a change in the description is read as a change in the
      world.

      Collapse, the abrupt jump of the quantum state at measurement, is the canonical
      casualty. If the state is a map, its sudden update on measurement is no stranger
      than a weather forecast changing when you open the curtains.
    in_csd: >
      CSD makes the split load-bearing and never lets it blur. The outcome regions a
      measurement context defines live on the projected state space, the space of quantum
      states, and they're epistemic, as the apparatus fixes the partition and the
      partition is a description. The measure that weights those regions is ontic, an
      invariant volume on the constraint surface itself, one the symmetry leaves
      unchanged, fixed by that symmetry and indifferent to anyone's knowledge.

      The Born rule, the quantum rule for outcome probabilities, is precisely the
      handshake, an epistemic region weighed by an ontic volume. Measurement is the ontic
      selection, the record written on the surface, of which epistemic region the one real
      trajectory realises. Keeping the two levels distinct isn't philosophical hygiene, as
      it's the structure of the reconstruction.
    mathematical: >
      The two-strata reading is written into the axiom ledger. The operational stratum
      speaks the effect-and-density language and carries the Gleason-type representation,
      and the ontic stratum computes weights as ratios of the Liouville measure over the
      preparation region.

      The corpus proves that the two strata meet, as the same Born vector is reached by
      the operational route and by the volume route, through structurally distinct
      machinery.
    term: Ontic vs epistemic
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-3
      text: The third primer page explains quantum states as summaries rather than physical waves
    related: [psi-epistemic, epistemic-measure, is-the-wavefunction-real, constraint-surface, many-to-one-projection]

  - slug: projectability
    reviewed: 2026-09-14
    hook: >
      Projectability is the one genuine postulate at the interface, that the ontic arena
      projects onto the space quantum mechanics is written on, and downstream of that
      symmetry does the choosing.
    layman: >
      If the world is a large deterministic space and quantum mechanics is written on a
      much smaller curved one, something must connect them, as you can't get the small
      picture out of the big one for free. The connection is structure, and structure has
      to be paid for.

      Projectability is the payment, made openly. It says the arena admits a many-to-one
      projection onto the quantum state space, a map that sends every point of the large
      space to a point of the small one, with many points sharing each target, much as a
      solid object casts a flat shadow. The projection must be compatible with the
      dynamics, so motion on the arena maps to the expected motion of quantum states, and
      with the symmetry. It's one postulate, stated once, and carried as an explicit
      hypothesis everywhere it's used.

      The discipline lies in what isn't postulated. The measure isn't, as symmetry forces
      it. The Born rule, the quantum rule for outcome probabilities, isn't, as it's
      computed as a volume. The dynamics on the projected space aren't, as they're derived
      from record statistics. The programme keeps its postulate count where you can audit
      it.
    in_csd: >
      This is Paper C's sector postulate, the assumption that the constraint surface
      projects onto a projective sector, the curved space of quantum states regarded as a
      view of the arena, on which the reconstruction runs. It's projectability, and never
      "the origin of the constraint surface", as the projection points the wrong way for
      that reading, so the surface is the floor and the sector is a view of it and not its
      source.

      In the formal corpus the postulate is never assumed globally. Every theorem that
      needs it takes it as an explicit hypothesis, so the corpus's record of assumptions
      stays clean and the cost is visible at every point of use.
    mathematical: >
      In Lean the postulate is a structure field and not an axiom, so the kernel's axiom
      report is unaffected by it. SectorData packages the postulate as a measurable
      projection from the ontic space to an abstract projective target, a group acting on
      both sides, invariance of the Liouville measure, and equivariance of the projection.

      A guard script enforces that the descent equation is genuinely consumed downstream,
      as the corpus was once burned by a substrate that was carried but unused, and the
      linkage is checked mechanically.
    term: Projectability
    status: physical-postulate
    source: curated
    lean:
      module: CsdLean4/LF2/Setup.lean
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-limits
      text: The scope page states plainly that the quantum-effective sector is posited, not derived
