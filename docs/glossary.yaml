  - slug: peres-criterion
    hook: >
      You can test for entanglement with a pencil: transpose half of the joint description,
      and if a negative eigenvalue appears, the pair is entangled.
    layman: >
      Correlation is not entanglement. Two systems can be correlated for boring reasons, for
      instance because they were stamped from the same template, and their results will then
      agree without anything quantum being involved. Entanglement is the stronger,
      specifically quantum kind of connection. Telling boring correlation from genuine
      entanglement is, in general, a provably hard computational problem. Is there at least
      a quick test that catches some of it?

      Peres found one of startling simplicity. Take the joint description of the pair, a
      matrix called the density operator. Transposition, flipping a matrix across its main
      diagonal, is a harmless bookkeeping reflection when applied to the description of any
      single system: it turns a legitimate state into a legitimate state. Now apply it to
      one half of the pair only. A legitimate state has eigenvalues, the characteristic
      numbers of its matrix, that are all probabilities and so never negative. If the
      half-transposed result has a negative eigenvalue, it is no longer a legitimate state,
      and the original was entangled. Guaranteed.

      For the two smallest kinds of pair, the test is perfect in both directions: it catches
      every entangled state and never raises a false alarm. Beyond that it can miss. There
      exist entangled states that pass the test, and the ones it misses turn out to be
      strange objects in their own right: bound entangled, meaning correlated in the quantum
      way yet impossible to distil into the clean entanglement that quantum protocols use.
    in_csd: >
      CSD's machine-checked corpus carries this criterion beside its Bell machinery because
      the two detect different things, and conflating them is a standing error the programme
      cannot afford. A Bell violation detects entanglement through statistics that an
      experiment could show; the Peres test detects it through algebra on the description.
      They disagree: entangled mixed states exist that violate no Bell inequality.

      For a reconstruction of quantum mechanics the distinction is load-bearing. Claims
      about non-locality and claims about entanglement have different scopes, and the corpus
      keeps separate instruments for them precisely so that its theorems say what they say
      and no more.
    mathematical: >
      Separable implies positive partial transpose. The converse holds exactly in dimensions
      two-by-two and two-by-three (Horodecki) and fails above, where PPT-entangled, that is
      bound entangled, states exist.

      The test itself is one eigenvalue computation, which is its entire charm given that
      separability in general is NP-hard.
    person: >
      Asher Peres (1934-2005) was born Aristide Pressman in Beaumont-de-Lomagne, France, to
      Polish-Jewish parents; the family survived the occupation in hiding, and he took a
      Hebrew name on emigrating to Israel in 1949. He took his doctorate at the Technion
      under Nathan Rosen, the R of EPR, and spent his career at the Technion thereafter:
      foundations pursued one degree of separation from the founding paradox.

      The criterion dates from 1996; quantum teleportation, which he co-authored, from 1993;
      and his 1993 textbook remains the field's standard for saying exactly what is meant.
      His epigram that unperformed experiments have no results is quoted by every camp in
      the interpretation wars, each certain it supports them.
    term: Peres criterion
    eponyms: [Peres]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Peres%E2%80%93Horodecki_criterion
    related: [gisin-theorem, bell-not-join, partial-trace, kronecker-product, no-signalling]

  - slug: poisson-bracket
    hook: >
      The Poisson bracket is the one rule that tells classical mechanics how fast any
      quantity changes, and the quantum commutator obeys exactly the same algebra. That
      shared grammar is what lets a deterministic flow present itself in quantum form.
    layman: >
      In classical mechanics the state of a system is a point, specified by positions and
      momenta, and as time passes that point traces a path. A natural question is how fast
      any given quantity changes along the path: not just a position or a momentum, but the
      energy, the angular momentum, the distance between two planets, anything you can
      compute from the state. The Poisson bracket is the single rule that answers it. Feed
      it the quantity you care about together with the total energy, and out comes the rate
      of change. The whole of classical dynamics compresses into one line: the rate of
      change of anything equals its bracket with the energy.

      The bracket takes two quantities and produces a third, and it obeys three algebraic
      laws. It is antisymmetric, meaning that swapping the two inputs flips the sign of the
      result. It obeys a product rule of the same shape as the rule for differentiating a
      product. And it obeys the Jacobi identity, a consistency condition on what happens
      when three quantities are bracketed together in different orders.

      A century later the same three laws turned up somewhere unexpected. In quantum
      mechanics, physical quantities are represented by operators, and the order in which
      two operators are applied matters. The commutator measures that mismatch: apply the
      first then the second, minus the second then the first. Dirac noticed, within months
      of quantum mechanics existing, that the commutator satisfies exactly the laws the
      Poisson bracket does, and he turned the observation into the recipe for quantisation:
      keep the algebra, replace the bracket by the commutator. Two theories, one grammar.
    in_csd: >
      For CSD the shared algebra is not a curiosity but a structural support. The
      programme's ontic side, the level at which things actually happen, is a
      deterministic flow of the Hamiltonian kind on the constraint surface. Its epistemic
      side, the level of what can be predicted, is ordinary operator dynamics with
      commutators. The claim that these are two descriptions of one process, rather than
      an analogy between two processes, rests on the two brackets obeying the same laws.

      The scope of the formal work is narrower than the idea and is stated as such. The
      corpus establishes that the state space is a symplectic manifold, the general setting in
      which the bracket is defined: its oriented-area structure is closed and non-degenerate,
      it is Kahler, meaning that its notion of distance and its notion of oriented area fit
      together in the way the bracket requires, Hamiltonian vector fields and their flows are
      constructed on it, and the flow preserves the volume measure. The bracket itself is
      formal in canonical coordinates, where the vanishing of the bracket for functions with
      disjoint supports is proved and used. What is not yet stated is the bracket of two
      functions on the manifold itself, with its Jacobi identity. That step is recorded as a
      gap, not presented as done.
    mathematical: >
      The bilinear antisymmetric bracket on phase-space functions induced by the symplectic
      form. It satisfies the Jacobi identity and generates Hamiltonian flow via df/dt =
      {f, H}. Its algebraic agreement with the commutator underwrites Dirac's quantisation
      dictionary.

      In the corpus the symplectic manifold structure of CP^(N-1) is formal
      (fsForm_isSymplectic, IsKahler, hamiltonianVectorField and its integral curves,
      Mathlib/Geometry/Manifold/), as is the canonical bracket in a Darboux chart with its
      disjoint-support vanishing theorem (SigmaLayer/ChartBracket.lean). The manifold-level
      bracket of functions, omega(X_f, X_g), is not yet named, and its Jacobi identity is not
      stated; that is the recorded gap.
    person: >
      Simeon Denis Poisson (1781-1840), from Pithiviers, entered the Ecole Polytechnique in
      1798 and was at once marked out by Laplace and Lagrange as the coming man. He stayed
      within the Paris institutions all his life and put his name on more mathematics than
      almost anyone: the distribution, the equation, the ratio and the bracket, the last
      from an 1809 memoir on planetary perturbation.

      The distribution, now everywhere, made its first appearance in a book about the
      probability of criminal verdicts and was ignored for half a century. As an examiner
      he was also one of the officials who failed to recognise Galois, a reminder that even
      the great ones grade badly.
    term: Poisson bracket
    eponyms: [Poisson]
    status: standard-mathematics
