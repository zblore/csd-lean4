      module: CsdLean4/Mathlib/Analysis/Matrix/StoneC1.lean
      theorem: Matrix.StoneC1.stone_continuous
    related: [wigner-rigidity, schrodinger-equation, schrodinger-from-records, hermitian-operator, bargmann]

  - slug: bell-chsh
    reviewed: 2026-09-12
    hook: >
      No pre-written answer sheet for all four measurement settings can match what a
      singlet pair of particles does, and the corpus proves this as a theorem about every
      possible answer sheet.
    layman: >
      Prepare two particles together in a particular joint state called a singlet, separate
      them, and measure each one with a choice of two settings. Common sense says that
      every measurement you might make already has an answer waiting, fixed when the pair
      was created and merely revealed by the apparatus. Bell's insight was that this
      innocent-sounding assumption has teeth: it forces a numerical limit on how strongly
      the results on the two sides can be correlated.

      Quantum mechanics predicts correlations above that limit. So common sense and quantum
      mechanics disagree about an experiment, and the experiment can be run. It has been
      run for five decades, with every loophole closed in turn. The correlations are there,
      and the answer sheet is not.

      What the corpus proves is the sharp version of this. Take one shared space of hidden
      states, the imagined complete description of the pair. No assignment of answers to
      all four settings at once, however contrived, reproduces the singlet's statistics.
    in_csd: >
      CSD is contextual and non-local at the level of its substrate, by design. Contextual
      means that what a measurement reveals can depend on which other measurements are made
      alongside it; non-local means that the hidden description of the pair does not split
      into a separate part for each particle. That commitment creates a debt. The programme
      must show that its own model cannot be secretly rewritten as the common-sense
      picture, or it would be claiming a virtue it had not earned. This theorem pays the
      debt.

      The result comes paired. The corpus also exhibits an explicit contextual model that
      does reproduce the singlet's correlations, so the claim is two-sided: here is the
      impossibility, and here is the thing that evades it. Obstruction and existence are
      cited together as one unit.

      There is a lesson in how the theorem came to be stated. For a long time the formal
      model gave each measurement setting its own separate space of hidden states, and the
      Bell question could not even be asked: there was nothing against which to compare a
      single global assignment of answers. A distinction in the bookkeeping stood where a
      theorem should have been. Rebuilding the model on one shared space made the question
      expressible, and the answer turned out to be the theorem above.
    mathematical: >
      Over a single shared measurable state space, no jointly defined assignment of
      outcomes to the four CHSH settings reproduces the singlet correlations. Companion
      results rule out a different class rather than restating this one: no setting-local
      (product) pair of response functions reproduces the singlet at every setting pair,
      over any shared probability space. Neither result subsumes the other, and the corpus
      says so. The GHZ analogue for three parties is proved separately.

      The shared-space form is the load-bearing one, since it is the shape the
      contextuality claim actually posits. The corpus pairs the obstruction with an
      explicit contextual model reproducing the same correlations, so the negative and
      positive halves are proved together rather than the no-go standing alone.
    person: >
      John Stewart Bell (1928-1990) was born in Belfast to a working-class family and left
      school at sixteen. He got into physics by working as a laboratory technician at
      Queen's University, where the staff noticed him and pushed him into a degree. He took
      his doctorate at Birmingham and spent his career at CERN designing accelerators.
      Foundations, he insisted, was a hobby for sabbaticals.

      It was some hobby. The 1964 paper was written while he was visiting Stanford and
      appeared in Physics 1, a journal so obscure that it paid authors instead of charging
      them, and which died after a few issues. The paper showed that the hidden-variables
      question, which physicists had filed under philosophy for thirty years, was
      experimentally decidable. Clauser, Horne, Shimony and Holt made it testable in 1969.

      Bell died of a stroke in 1990, the year he was nominated for the Nobel Prize. The
      2022 prize went to the experimenters who confirmed him.
    term: Bell and CHSH
    eponyms: [Bell]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: no_compatible_global_chsh_assignment_realises_singlet
    papers:
