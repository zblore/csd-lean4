        url: https://en.wikipedia.org/wiki/Schr%C3%B6dinger_equation
    related: [schrodinger-from-records, stone-theorem, hermitian-operator, lindblad-equation, poisson-bracket]

  - slug: shor-algorithm
    hook: >
      Shor's algorithm factors large numbers in polynomial time on a quantum computer. It
      turned quantum computing from a curiosity into a budget line and made every deployed
      cryptosystem provisional.
    layman: >
      Multiply two large prime numbers together and you have the answer at once. Recover
      the two primes from their product and, with the best classical methods, you wait
      effectively forever once the numbers are large enough. That one-way street is not a
      theorem, but it is the working assumption, and most of the public-key cryptography
      protecting the internet leans on it.

      Shor's 1994 algorithm breaks the street. A quantum computer can factor in polynomial
      time, meaning that the running time grows only as a modest power of the number of
      digits rather than exploding with each digit added. The route is indirect and
      elegant. Classical number theory reduces factoring to finding the period of a
      repeating sequence: the remainders left when successive powers of a chosen number are
      divided by the number to be factored eventually repeat, and the length of the repeat
      reveals a factor. Period-finding is exactly what quantum interference does well. A
      quantum register can hold every input value at once, in what is called a
      superposition, and the quantum Fourier transform, the quantum version of the
      mathematical tool that picks the frequencies out of a signal, makes the period stand
      out the way a single note stands out from a struck bell.

      Machines large enough to run the algorithm on numbers that matter do not yet exist.
      The conclusion for current cryptography is nonetheless already settled: it is living
      on borrowed time.
    in_csd: >
      Shor's algorithm is the most demanding of the corpus's algorithm witnesses. A witness
      is a known algorithm carried through the formalised framework to show that the
      framework can support it; witnesses mark scope, they do not support foundations.
      What makes this one heavy is the plumbing. The reversible modular arithmetic beneath
      the algorithm, the adders and multipliers built from steps that can each be run
      backwards as quantum logic requires, is built and verified in full, because that is
      where a formalisation either survives or quietly cheats.

      The corpus makes no cryptographic claims, and the cost-model work bearing on real
      machines was deliberately moved to a separate repository. What remains here is an
      existence proof: the formalised dynamics carries a complete, real algorithm from end
      to end.
    mathematical: >
      Quantum order-finding extracts the period of modular exponentiation in polynomial
      time via the quantum Fourier transform; a classical reduction, essentially
      Legendre-era number theory, converts the period into a factor with high probability.

      The quantum content is entirely the period-finding; the corpus's labour is mostly
      the verified reversible arithmetic underneath it.
    person: >
      Peter Shor (b. 1959) was an Olympiad medallist, took degrees at Caltech and MIT, and
      was at Bell Labs when he announced the algorithm in 1994. The community's reaction
      was unusually theatrical: word spread from a small talk before the paper existed, and
      within weeks half of physics had opinions about a result almost nobody had read.

      The objection came instantly, that decoherence, the loss of quantum behaviour through
      contact with the surroundings, would kill any real machine. Shor answered it himself
      in 1995 with the first quantum error-correcting code, dispatching the counterargument
      to his own revolution. He moved to MIT in 2003. Few people have built both a field's
      central promise and its central defence.
    term: Shor's algorithm
    eponyms: [Shor]
    status: standard-mathematics
