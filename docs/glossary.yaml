  - slug: fibre
    image:
      file: img/fibre.png
      wide: true
      alt: "A Möbius strip"
      caption: "A Möbius strip is a bundle of line segments over a circle; each segment is a fibre."
      credit: "Inductiveload, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Moebius_Surface_1_Display_Small.png
      article: https://en.wikipedia.org/wiki/Fiber_bundle
    hook: >
      The arena of CSD is larger than the space of quantum states by exactly one compact
      factor, and from three dimensions upward the natural ways of doing without that
      factor stop working.
    layman: >
      If quantum states are shadows cast by a richer arena, something has to be said about
      the part of the arena that doesn't show up in the shadow, and it had better not be
      idle decoration, as hidden structure that never does anything is the first thing a
      critic should cut away. The fibre is that hidden part, and the point of this entry
      is why it's there.

      A fibre, in the geometer's sense, is a small space attached over every point of a
      larger one, like the bristles of a brush standing over each point of its backing. In
      CSD's working arena the space of quantum states is the base, and over each of its
      points stands a copy of a torus, the surface of a doughnut, which is compact,
      meaning finite in extent and closed up on itself with no edge. A point of the arena
      is therefore a quantum state together with a position on the torus above it. The
      fibre is where the arena keeps what the quantum state can't, which outcome basin,
      meaning which of the regions of the fibre belonging to the different outcomes, the
      trajectory of the world actually occupies, and that's the raw material from which
      records are made.

      The fibre earned its place by argument and not by taste. At the level of a qubit,
      the simplest quantum system with two possible outcomes, you can just about manage
      without it, as the two-level case has a coincidence that lets the outcome structure
      sit on the state space itself. One dimension higher that coincidence is gone, and
      the natural candidates for doing without a fibre fail, so the fibre is where the
      corpus puts the structure. That the failure extends to every conceivable candidate
      is expected but not established.
    in_csd: >
      The fibre is where the record layer lives. The outcome basins fixed by a measurement
      context are arcs of the fibre coordinate, read off above each point of the base, and
      the epistemic measure, which describes what an observer who knows only the quantum
      state can say, spreads evenly over the fibre. The basin the trajectory occupies is
      the ontic record, the fact about the world a measurement reveals. How the fibre is
      weighted isn't a modelling choice either, as the arena's measure is the only
      probability measure invariant under the arena's own symmetry, the unitary
      transformations turning the state space together with the translations turning the
      fibre. The base half of that uniqueness was already known, and the fibre half
      completes it, so nothing about how the arena is weighted is left to taste.

      The load-bearing discovery is dimensional. With two-dimensional states, a partition
      fixed by the context alone can be built on the base, a special accident of the two-
      dimensional state space, and with three or more dimensions the natural base-only
      construction is constrained to very little. Two requirements do the constraining,
      covariance, meaning that the construction must respect the symmetry of the state
      space, and positivity, meaning that a density can't take negative values. Together
      they force a density on the base that depends on the prepared state alone, and on it
      only through the distance from it, to have disjoint supports for different outcomes
      and to vanish below a threshold that rises with the dimension, and the split between
      two dimensions and three or more shows up in three independent ways. The scope
      matters, because this page has overstated it twice, as the chain of arguments stops
      short of a no-go theorem. Two of its inputs are undischarged and the closing step
      needs machinery that doesn't exist, so the base-only route is open in both
      directions, neither refuted nor exhibited, and is parked. The fibred reading is
      canonical by the author's decision, taken because either answer leads to the same
      next move, and this narrows where the mechanism can live without refuting it, since
      existence is proved.

      A second argument for the fibre was offered and later withdrawn. It said the outcome
      race needs several independent clocks one deterministic trajectory can't supply, so
      the fibre must supply them, and that doesn't hold. Time in the arena is a single
      shared parameter, so the clocks are aligned deterministic readings of one microstate
      and not independent processes, and the corpus's Born construction on the fibre never
      races anything, as it cuts the fibre circle into consecutive arcs and reads each
      weight off the arc length, one uniformly distributed coordinate with no independence
      anywhere. The dimensional argument above is unaffected and stands alone.

      An older frontier question, deriving the fibre mechanism from a mixing de-isolation
      flow, one that stirs the arena thoroughly enough to spread any region evenly, was
      retired as mis-specified rather than merely hard, and its successor was mis-stated
      too, because the obvious phrasing is also wrong. There are two partitions to keep
      apart. The outcome regions on the projective base are epistemic, as they belong to a
      calculation space, nothing sculpts them, and they match the volumes because the
      measure is forced by symmetry and the weights are the moment map, and not because
      any dynamics carved them. The fibre cells are a different object, placed on the
      ontic fibre, and the outcome is the ontic selection of which cell the point
      occupies, and the corpus adds that the particular cell family is one concrete
      realisation of an interface, so the shapes of the cells are bookkeeping while the
      fibre, the rates and the selection aren't. The successor question is therefore about
      the readout and not the regions, which is whether a physical de-isolation
      interaction generates a pointer whose level sets, the sets of arena points on which
      the pointer shows one reading, carry the Born measures. The Born weights themselves
      don't wait on the answer, because the corpus proves that any measurable pointer with
      those basin measures gives Born, independently of the flow.
    mathematical: >
      The arena is CP^(N-1) x T^2 with the flat torus fibre carrying normalised Haar
      measure. The base factor of that product measure is proved to be the normalised
      symplectic volume of the Fubini-Study form
      (manyToOneSetup_liouvilleMeasure_eq_fsVolumeNormalized_prod,
      LF4/SectorManifold.lean), so the arena measure is derived from the volume form on
      the base and Haar measure on the fibre and not posited as a product, and it's the
      unique probability measure invariant under U(N) acting on the base and translations
      acting on the fibre. Basins are preimages of arcs under the first fibre coordinate,
      with the arc endpoints set by the context's rate field.

      The N >= 3 argument isn't a Gleason-type theorem, since CSD's partitions are
      contextual and Gleason and Kochen-Specker don't apply. It's a chain of machine-
      checked necessary conditions on a base-only radial density, disjoint supports and
      vanishing below a threshold rising with dimension, and it leaves very little room
      and stops short of closing it. Two inputs are undischarged and the terminal step
      needs machinery Mathlib doesn't have, so the base-only route is open in both
      directions and parked as such.

      For the record, the independent-clocks argument for the fibre was offered in August
      2026 and withdrawn on 2026-08-26, and the mixing-flow frontier was retired in the
      same month.
    reviewed: 2026-09-29
