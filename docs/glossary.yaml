  - slug: record-layer
    hook: >
      A measurement is over when the world itself carries which outcome happened, and the
      record layer is where that fact lives, on the arena and not in anyone's notebook.
    layman: >
      Suppose outcome probabilities really are the volumes of regions in some space of
      states. You still owe an account of the outcome itself, as after the experiment
      something in the world, a pointer, a grain of silver, a memory, holds which result
      occurred, and a theory that prices outcomes but can't say where the outcome is
      written has stopped one step short.

      The record layer is that last step, and it asks for two things. First, the outcome
      regions must be fixed by the apparatus alone, in the way that a referee's rulebook
      doesn't depend on which team is playing. Second, the record must be a physical
      configuration of the arena, the space of everything that exists in CSD, so it's an
      ontic fact, one that holds independently of anyone's knowledge, selected by the one
      real trajectory.

      Nothing mystical is on offer. A record is structure the arena already has, singled
      out by where the trajectory went.
    in_csd: >
      This is the programme's near frontier, and it's partly built. The partition fixed by
      the context exists, as outcome regions, called basins, are defined from the
      apparatus's rate field, the outcome weights the apparatus assigns at each point of
      the state space, with no preparation anywhere in the definition, and their weights
      come out as the Born weights, the probabilities quantum mechanics assigns. For the
      qubit, the simplest quantum system, with two outcomes, the whole story is proved end
      to end. At higher dimension the analysis indicates that the contextual structure,
      the dependence of the outcome regions on the whole measurement context, doesn't sit
      on the base alone, the base being the projected state space, and the corpus places
      it in the fibre, the part of the arena lying above each state. That placement
      narrows where the mechanism can be, though it rests on refuting one natural class of
      base candidate rather than on a no-go.

      What remains open, and is stated as open, is deriving the fibre mechanism from de-
      isolation dynamics, the physics of a system losing its isolation during measurement,
      rather than exhibiting it. The record layer is where the reconstruction is completed
      or not.
    mathematical: >
      The proved tier is that a measurable simplex-valued rate field on the base defines
      pairwise-disjoint basins whose epistemic probability at preparation psi is the Born
      weight, from a partition that never mentions psi. Sequential and mixed-state
      versions run through the Luders tier.

      The open tier is dynamical and not kinematic, as no interaction Hamiltonian
      generating the basins is constructed, and the corpus says so in the module that
      would need it.
    term: Record layer
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-4
      text: The fourth primer page describes measurement as an engineered loss of isolation
    related: [de-isolation, measurement-flow, pointer-basis, collapse, record-light-cone]

  - slug: de-isolation
    hook: >
      Nothing collapses, as a measured system stops being isolated, and measurement is
      what de-isolation dynamics looks like from inside.
    layman: >
      Textbook quantum mechanics has two rules for change, smooth, deterministic evolution
      while nobody looks, and an abrupt jump when somebody does. That's two rules, one
      world, and no principled statement of when each applies, which isn't a paradox but
      an unfinished theory.

      CSD's diagnosis is that the second rule describes a change of circumstance and not a
      change of law. An isolated system follows the smooth rule, measurement is the
      deliberate destruction of that isolation, by coupling the system to an apparatus,
      and the jump is what the resulting joint dynamics looks like when you only keep
      track of the system.

      It's one law, applied twice. The dial that turns is isolation, and it's a physical
      dial and not an interpretive one.
    in_csd: >
      De-isolation is the programme's word for the measurement interaction seen on the
      arena, and the corpus realises it concretely. A deterministic, measure-preserving
      de-isolation flow, one that never changes the volume of any set of states and is
      genuinely not the identity, couples the system to a pointer, the part of the
      apparatus that displays the result. It realises the measurement dilation
      dynamically, where a dilation is the standard description of a measurement as smooth
      evolution of system and apparatus together, and the volumes of its pointer blocks,
      the regions in which the pointer shows a given result, reproduce the Born weights
      for every preparation. The entangled tier has its own witness, as the singlet, the
      simplest entangled pair of systems, has a state that can't be split into separate
      states of the two parts, and that non-factorisation is realised by an explicit de-
      isolation flow on the enlarged arena.

      What de-isolation doesn't do, and what remains open, is generate the record layer's
      fibre mechanism from first principles, and the honest boundary between "exhibited"
      and "derived" is maintained wherever the flows appear.

      One specific attempt to derive it was retired as mis-specified rather than merely
      hard. The idea was to use a mixing de-isolation flow, one that stirs the arena so
      thoroughly that every region eventually spreads evenly through every other, and to
      obtain an exponential law for first passage, the time at which the trajectory first
      enters an outcome region, as a limit theorem. Three things defeat it. The limit
      theorems for hitting times need the target sets to be vanishingly rare, while the
      cells of a Born partition have sizes that sum to one. An asymptotic law would
      deliver the Born weights only in a limit, which is weaker than what the corpus
      proves exactly. And the race between outcomes needs independent clocks, which one
      deterministic trajectory can't supply. What survived is the clock law, which is
      forced rather than chosen, and the rates, which Kac's formula reads off any ergodic
      flow, as for a flow that visits every region in proportion to its volume the average
      time between visits to a region is fixed by that volume.

      De-isolation also has an operational face, and the corpus proves the two agree. The
      flow that couples system and pointer, watched from the system alone, is a channel
      that keeps the pointer-basis diagonal of the density operator and discards the rest.
      Entropy never decreases under it, the second law of the thermodynamics track is its
      coarse-graining, and the classical information it lets through is exactly one bit
      per qubit, so the same de-isolation dynamics that realises the Born weights as
      volumes also realises decoherence as a channel, with no second mechanism.
    mathematical: >
      The measurement-dynamics tier is a von Neumann de-isolation flow on the dilated
      space, measure-preserving and distinct from the identity, whose pointer-block
      volumes and almost-sure frequencies are the Born weights. The Naimark dilation is
      realised dynamically rather than cited abstractly, and the pointer-partition
      theorems deliver the outcome map per microstate.

      The mixing-flow route to the fibre mechanism, with an exponential first-passage law
      arriving as a limit theorem, was retired in August 2026 as mis-specified rather than
      merely hard, as hitting-time limit theorems require shrinking target sets, an
      asymptotic law is weaker than the exact Born identity already proved, and one
      deterministic trajectory supplies no independent clocks. The clock law and the Kac-
      formula rates survive.

      deisolationChannel N (LF6/DecoherenceChannel.lean) is stinespringChannel of the von
      Neumann coupling unitary with the pointer ready.
      deisolationChannel_apply_outerProduct recovers decohereReduced on rank-one inputs,
      deisolationChannel_apply_eq_pinch identifies it with the pinching of the second-law
      module, vonNeumannEntropy_le_deisolation is the entropy non-decrease and
      deisolationChannel_holevoCapacity the one-bit capacity.
    term: De-isolation
    status: definition
    source: curated
    site_link:
