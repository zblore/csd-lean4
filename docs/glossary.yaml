  - slug: lie-trotter-formula
    reviewed: 2026-09-14
    image:
      file: img/lie-trotter-formula.jpg
      alt: "Portrait photograph of Sophus Lie"
      caption: "Sophus Lie."
      credit: "L. Szaciński (Christiania), No restrictions, via Wikimedia Commons"
      licence: "No restrictions"
      source: https://commons.wikimedia.org/wiki/File:Portrett_av_Sophus_Lie.jpg
      article: https://en.wikipedia.org/wiki/Sophus_Lie
    hook: >
      Alternate many tiny steps of two operations that don't commute and the result
      converges to the exponential of their sum, with an error that shrinks like one over
      the number of steps, and CSD proves this in textbook generality, in a form ready for
      the Mathlib library, because its open-systems tier needed it and nothing on the
      shelf existed.
    layman: >
      For ordinary numbers, the exponential of a sum is the product of the exponentials.
      For operations that don't commute, meaning the result depends on the order in which
      they're applied, this fails, and in quantum mechanics, where evolution over a
      stretch of time is the exponential of an energy generator, the interesting pieces of
      the generator never commute.

      The Lie-Trotter formula is the repair. Alternate many tiny steps of each piece, and
      in the limit of ever smaller steps you recover the exponential of the sum exactly.
      Physicists use this daily, as it's the licence behind every quantum simulation, in
      which a complicated evolution is approximated by a sequence of simple ones.

      The corpus needed the formula in a form its libraries didn't have, for operators
      acting on the space of matrices, as the generator of an open-system evolution does,
      with a quantitative error, and without special structural assumptions on the pieces.
      So it was proved from scratch at textbook generality, for any complete normed
      algebra, a setting in which elements can be added, multiplied and measured for size
      and in which limits exist, with an explicit rate of convergence. The defect of a
      single step is controlled by an estimate on the tail of a series, and the defects
      are added up without growth.
    in_csd: >
      The formula is the assembly step in the proof that the Lindblad flow is completely
      positive. The drift part and the jump part of the generator separately generate
      evolutions that preserve positivity, and the product formula is what lets their
      alternation converge to the full evolution, so positivity passes to the limit.

      It's staged as a candidate for contribution to Mathlib, free of anything CSD-
      specific by construction, the kind of infrastructure the formalisation deliberately
      leaves better than it found it.
    mathematical: >
      The theorem NormedSpace.trotter_product states that in a complete normed real
      algebra with unit norm one, the n-fold alternating product of exp(A/n) and exp(B/n)
      converges to exp(A+B), with a one-step defect of order one over n squared,
      telescoped to an overall rate with the explicit constant s^2 (3 + s) e^(2s) over n
      for s the sum of the norms.

      The earlier staged version required skew-adjointness, and the de-skewed form
      replaces the two places skewness entered by norm bounds the final constant absorbs.
    person: >
      Hale Trotter (1931-2022) was a Canadian-American mathematician at Princeton, and the
      1959 product formula came out of his thesis work on semigroups of operators. The
      finite-dimensional antecedent is Sophus Lie's, from the nineteenth-century theory of
      continuous groups, which is why the formula carries both names, and Masuo Suzuki's
      later higher-order refinements are why simulation people say Trotter-Suzuki.
    term: Lie-Trotter product formula
    eponyms: [Trotter]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Mathlib/Analysis/NormedSpace/TrotterGeneral.lean
      theorem: trotter_product
