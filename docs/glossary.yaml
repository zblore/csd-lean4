entries:
  - slug: fubini-study-measure
    term: Fubini-Study measure
    eponyms: [Fubini, Study]
    status: proved-in-corpus
    hook: >
      There is exactly one way to measure the space of quantum states without
      secretly favouring a direction. The Born rule is what that measure says.
    layman: >
      Every state a quantum system can be in is a point in a curved space, much as
      every place on Earth is a point on a globe. To ask how likely an outcome is,
      you need to know how large a region of that space is. But size needs a ruler,
      and a carelessly chosen ruler would quietly build the answer you wanted into
      the question. The Fubini-Study measure is the one ruler that treats every
      direction alike. Because it is the only such ruler, the sizes it reports are
      not anybody's choice.
    in_csd: >
      CSD does not assume the Born rule. It derives outcome probabilities as ratios
      of volumes, and a ratio of volumes means nothing until the ruler is fixed.
      This is the ruler, and the point is that it is forced rather than picked. The
      unitary group acts transitively on projective state space, and a space with a
      transitive symmetry admits exactly one invariant probability measure. So the
      measure falls out of the state space and its symmetry instead of going in as
      an assumption, which is the whole reason Born weights arrive here as theorems
      rather than postulates. Helland reaches the same uniqueness from group
      representation theory over accessible variables. CSD reaches it from geometry.
    mathematical: >
      CP^(N-1) is the compact homogeneous space U(N)/(U(1) x U(N-1)). The
      Fubini-Study measure is the unique U(N)-invariant Borel probability measure on
      it: the normalised Riemannian volume of the Fubini-Study metric, equivalently
      the top exterior power of the associated Kahler form over n factorial.
      Uniqueness is Haar uniqueness. An invariant measure on a homogeneous space is
      unique up to scale when the action is transitive, and normalisation fixes the
      scale. Proved here at general N with no imported axioms. The construction takes a
      reference point, but that is bookkeeping rather than a degree of freedom:
      `fubiniStudyMeasure_basepoint_independent` shows any two choices give the same
      measure, so the canonical `defaultFubiniStudyMeasure` is *the* Fubini-Study
      measure and not one of a family.
    person: >
      Guido Fubini (1879-1943), Italian, is best known for the theorem on exchanging
      the order of integration that carries his name, and worked extensively on
      projective differential geometry. Stripped of his university post by the racial
      laws of fascist Italy in 1938, he emigrated to the United States and taught at
      Princeton until his death. Eduard Study (1862-1930), German, worked on invariant
      theory and the geometry of complex spaces. The two arrived at this metric
      independently around 1904-1905, which is why it carries both names.
    lean:
      module: CsdLean4/Mathlib/LinearAlgebra/Projectivization/FubiniStudyUnique.lean
      theorem: fubiniStudyMeasure_unique
    papers:
      - doi: 10.5281/zenodo.19557174
        note: TN1, the Fubini-Study measure as an SU(N)-equivariant pushforward
      - doi: 10.5281/zenodo.16746829
        note: Paper B, the symmetry argument that fixes the measure
    external:
      - text: "Bengtsson and Zyczkowski, Geometry of Quantum States, 2nd ed., CUP 2020"
        url: https://www.cambridge.org/core/books/geometry-of-quantum-states/
    related: [duistermaat-heckman, liouville-measure, kahler-form, born-weight]

  - slug: born-weight
    term: Born rule
    eponyms: [Born]
    status: proved-in-corpus
    hook: >
      Quantum mechanics' probability rule is not assumed here. It is what you get
      by measuring the size of a region, once the ruler is fixed.
    layman: >
      Ask a quantum system a question and you get one answer, but ask many times and
      the answers come in stable proportions. Textbook quantum mechanics writes those
      proportions down as a law and leaves it there. Here they are not a law but a
      consequence of size: the space of states divides into regions, one per outcome,
      and an outcome's frequency is the fraction of the space its region occupies.
      Nothing is put in by hand except the ruler, and the ruler is forced.
    in_csd: >
      This is the programme's central result and the reason the rest exists. The
      outcome regions carve the state space, the Fubini-Study measure supplies the
      only unbiased notion of their size, and the ratio of volumes comes out equal to
      the textbook weight. It is derived at general dimension, not checked on
      examples, and without the usual route through Gleason's theorem, which is why
      the corpus can claim a derivation rather than a rediscovery. What turns on it:
      if this failed, the programme would be a reinterpretation of quantum mechanics
      instead of a reconstruction of it.
    mathematical: >
      For a preparation vector psi on CP^(N-1), the Fubini-Study measure of the
      barycentric outcome region attached to basis vector e_k equals the Born weight
      |<e_k, psi>|^2. Proved coordinate-by-coordinate at general N, unconditional, and
      Gleason-free. The companion apex statement covers the dropped vertex, so the
      identity holds on all N coordinates of a generic preparation.
    person: >
      Max Born (1882-1970), German, gave the probability reading of the wavefunction in a 1926 footnote -- added at proof stage, and the reason he is remembered. Dismissed from Gottingen in 1933 under the Nazi civil-service laws and exiled to Edinburgh, he received the Nobel Prize in 1954, nearly three decades after the work.
    lean:
      module: CsdLean4/LF4/MomentBornN.lean
      theorem: fs_born_volume_ratio_N
    related: [fubini-study-measure, duistermaat-heckman, gleason-theorem]

  - slug: duistermaat-heckman
    term: Duistermaat-Heckman formula
    eponyms: [Duistermaat, Heckman]
    status: proved-in-corpus
    hook: >
      Project the space of quantum states down onto its outcome probabilities and the
      curvature disappears: what lands is flat.
    layman: >
      The space of quantum states is curved, and one might expect that measuring
      regions of it would be a delicate business. It is not. There is a natural way of
      recording only the outcome probabilities of a state, discarding everything else,
      and under that recording the curved space flattens completely. Sizes become
      ordinary volumes of the kind you would measure in a triangle. This is why the
      probability calculation stays tractable at any number of outcomes.
    in_csd: >
      This is the engine that makes Born weights computable rather than merely
      defined. The moment map sends a state to its tuple of outcome probabilities,
      and the pushforward of the Fubini-Study measure along it is flat on the
      probability simplex. So a volume ratio in a curved high-dimensional space
      becomes a Lebesgue volume in a simplex, which is what turns the Born statement
      into a finite computation at general N.
    mathematical: >
      For a measurable region R of the open free moment simplex, the Fubini-Study
      measure of its preimage under the normalised moment map equals M factorial times
      the Lebesgue volume of R. Equivalently the pushforward of the Fubini-Study
      measure along the moment map is the flat (uniform Dirichlet) distribution on the
      simplex. Unconditional, and the genuine general-N Duistermaat-Heckman content on
      this space.
    person: >
      Hans Duistermaat (1942-2010) and Gerrit Heckman, both Dutch, proved the exact-stationary-phase formula in 1982. Its striking feature is that an approximation which is normally only a first term happens to be exact here, and the reason is symmetry.
    lean:
      module: CsdLean4/LF4/MomentBornN.lean
      theorem: fs_volume_eq_dirichlet
    related: [fubini-study-measure, born-weight]

  - slug: gleason-theorem
    term: Gleason and Busch theorems
    eponyms: [Gleason, Busch]
    status: proved-in-corpus
    hook: >
      The standard route to the Born rule was carried here as a borrowed assumption
      for months. It is now proved, and the corpus imports no axioms at all.
    layman: >
      There is a celebrated argument that any consistent way of assigning
      probabilities to quantum questions must be the standard one. It is powerful and
      it is hard, so formalisation projects usually assume it and move on. Assuming it
      is not free: it means the probability rule was put in rather than derived. Here
      the effect-valued version was assumed at first, then proved outright, so nothing
      of the sort is borrowed any more.
    in_csd: >
      Two things turn on this. First, honesty of the axiom ledger: with this discharged
      the corpus depends on no imported result and no postulate beyond the foundations
      of its proof assistant. Second, independence: the programme's own Born derivation
      goes through volume ratios and does not use this theorem, so the two routes are
      genuinely separate confirmations rather than one argument wearing two hats. A
      published abstract once described this as an external input; that was true when
      written and false by the time it was read, which is the reason this glossary is
      guarded.
    mathematical: >
      Every operational package on a finite-dimensional space admits an effect-Gleason
      representation: the probability assignment on effects is given by a density
      operator through the trace pairing. This is the Busch effect-valued form, which
      unlike the original projection-valued Gleason theorem holds in dimension two as
      well. Proved in-corpus 2026-07-21, foundational-triple only.
    person: >
      Andrew Gleason (1921-2008), American, worked as a Navy cryptanalyst before proving in 1957 that the probability rule is forced -- a result he regarded as a minor piece. Paul Busch (1955-2018), German, later extended it to generalised measurements, which is the form that survives in dimension two and the form proved here.
    lean:
      module: CsdLean4/LF2/EffectGleason.lean
      theorem: effect_gleason_representation
    papers:
      - doi: 10.5281/zenodo.20100580
        note: LF2, the measure bridge and Born-weight wrapper
    related: [born-weight, fubini-study-measure]

  - slug: wigner-rigidity
    term: Wigner rigidity
    eponyms: [Wigner]
    status: proved-in-corpus
    hook: >
      Preserve the overlaps between quantum states and you have no freedom left: you
      are a symmetry, whether you meant to be one or not.
    layman: >
      Quantum states have a notion of how much any two of them agree. Suppose you
      rearrange the space of states in any way at all, subject to one condition: the
      agreement between any two states is unchanged. That sounds like weak information,
      and yet it pins you down completely. The only rearrangements are the rigid
      motions physics already knows about. You cannot be creative here; the structure
      leaves no room.
    in_csd: >
      This is the single strongest result in the corpus by logical type: an
      unconditional necessity, not a consistency check and not conditional on a posited
      symmetry. Almost everything else that is called "forced" here rests on assuming a
      symmetry group; this one assumes only that overlaps are preserved and derives the
      group. It is what licenses treating unitary evolution as compelled rather than
      chosen, and it is a natural anchor for the record layer, where the preserved
      quantity is a record statistic.
    mathematical: >
      Every transition-probability-preserving self-map of CP^(N-1) is induced by a
      unitary or by an antiunitary map. Linearity is an output of the construction and
      is never assumed; the antiunitary branch is genuinely present, and the global
      unitary-or-antiunitary alternative is forced by overlap preservation alone.
      Foundational-triple only.
    person: >
      Eugene Wigner (1902-1995), Hungarian, left Europe in the 1930s and shared the 1963 Nobel Prize for symmetry principles in physics. His theorem on symmetries of quantum states dates from 1931; the antiunitary alternative it uncovers is what later accounted for time reversal.
    lean:
      module: CsdLean4/Mathlib/LinearAlgebra/Projectivization/WignerRigidity.lean
      theorem: wigner_rigidity
    related: [fubini-study-measure, stone-theorem]

  - slug: stone-theorem
    term: Stone's theorem
    eponyms: [Stone]
    status: proved-in-corpus
    hook: >
      Continuity is enough. Ask only that time evolution not jump, and differentiability
      and a Hamiltonian follow.
    layman: >
      A system evolving in time is described by a family of transformations, one for
      each moment. It is tempting to assume this family is smooth, so that one can
      differentiate it and speak of a rate of change. That assumption is stronger than
      it looks and it is unnecessary. Merely requiring that the evolution not jump
      forces smoothness, and with it the existence of the object whose rate of change
      it is, which physics calls the Hamiltonian.
    in_csd: >
      The programme needs the generator of evolution to be earned, not posited, because
      a posited generator would smuggle in the dynamics it is trying to derive. This
      supplies exactly that at finite dimension: from continuity alone it produces the
      skew-Hermitian generator, so the Schrodinger form of the dynamics is an output.
      Together with Wigner rigidity it is the second unconditional necessity in the
      corpus.
    mathematical: >
      A strongly continuous one-parameter group of unitary matrices is the exponential
      of t times a skew-Hermitian generator. Continuity-only hypothesis: the C^1
      assumption of the earlier packaged version is derived rather than assumed. Note
      that the proof assistant's library carries no Stone theorem at this pin, so this
      is supplied here.
    person: >
      Marshall Stone (1903-1989), American, proved the theorem on one-parameter unitary groups in 1932, connecting continuous symmetry to its generator. He is equally remembered for the Stone-Weierstrass theorem and for rebuilding the Chicago mathematics department after the war.
    lean:
      module: CsdLean4/Mathlib/Analysis/Matrix/StoneC1.lean
      theorem: Matrix.StoneC1.stone_continuous
    related: [wigner-rigidity]

  - slug: bell-chsh
    term: Bell and CHSH
    eponyms: [Bell]
    status: proved-in-corpus
    hook: >
      No assignment of definite outcomes to all four measurement settings at once can
      reproduce what a singlet does. The obstruction is a theorem here, not a slogan.
    layman: >
      Take two particles prepared together and then separated, and measure each with a
      choice of settings. Common sense suggests every possible measurement already has
      an answer waiting, and that we simply reveal it. The correlations rule that out.
      What is proved here is the sharp form of the impossibility: on a single shared
      space of hidden states, no way of writing down answers for all the settings at
      once matches the quantum predictions.
    in_csd: >
      The programme is explicitly contextual and non-local at the level of its
      substrate, so it must show its own model cannot be quietly rewritten as the naive
      alternative. This is that demonstration, and it comes with a positive companion:
      an explicit contextual model that does reproduce the singlet. Existence and
      obstruction in one place is what makes the claim two-sided rather than a bare
      no-go. Getting the statement expressible at all required replacing per-setting
      state spaces with one shared space; while each setting had its own space there
      was nothing to compare against, and the missing theorem went unnoticed.
    mathematical: >
      Over a single shared measurable state space, no jointly-defined assignment of
      outcomes to the four CHSH settings reproduces the singlet correlations. Companion
      results give the same conclusion over any shared probability space at every
      setting pair, and the GHZ analogue.
    person: >
      John Stewart Bell (1928-1990), from Belfast, worked at CERN on accelerator physics and treated foundations as, in his phrase, a hobby. His 1964 paper showed the question of hidden variables was experimentally decidable rather than philosophical. Clauser, Horne, Shimony and Holt gave the testable form in 1969. Bell died before the Nobel recognising the experiments.
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: no_compatible_global_chsh_assignment_realises_singlet
    papers:
      - doi: 10.5281/zenodo.20354293
        note: LF3, the machine-verified singlet kernel and empirical chain
    related: [ghz-state, tsirelson-bound]

  - slug: ghz-state
    term: GHZ state
    eponyms: [GHZ]
    status: proved-in-corpus
    hook: >
      Three particles can contradict local realism with certainty, in a single run.
      No statistics, no inequality, no margin.
    layman: >
      Bell's argument needs many repetitions: the disagreement with common sense shows
      up in the proportions. With three particles the disagreement becomes sharper.
      There is a set of measurements whose outcomes any common-sense account must
      predict one way, and quantum mechanics predicts the opposite every single time.
      One run suffices in principle, because the prediction is certainty against
      certainty rather than a difference of averages.
    in_csd: >
      The corpus carries the GHZ obstruction alongside the two-particle one so that the
      contextuality claim does not rest on a single example or on a single logical
      shape. The Bell case is a statistical impossibility; this one is an
      all-or-nothing algebraic impossibility, and a substrate account has to survive
      both.
    mathematical: >
      No product partition of a shared hidden-state space reproduces the GHZ
      correlations. Proved as a theorem over an arbitrary measurable state space rather
      than exhibited on a chosen model.
    person: >
      Daniel Greenberger, Michael Horne and Anton Zeilinger introduced the three-particle argument in 1989, showing the conflict could be made all-or-nothing rather than statistical. Zeilinger shared the 2022 Nobel Prize for experimental work on entanglement.
    lean:
      module: CsdLean4/LF6/GHZContextuality.lean
      theorem: no_product_partition_realises_ghz
    related: [bell-chsh, tsirelson-bound]

  - slug: tsirelson-bound
    term: Tsirelson bound
    eponyms: [Tsirelson]
    status: proved-in-corpus
    hook: >
      Quantum mechanics breaks the classical limit on correlations, but not by as much
      as it could. Something stops it well short of the logical maximum.
    layman: >
      There is a standard score summarising how correlated two separated measurements
      are. Any common-sense account keeps that score at or below two. Quantum mechanics
      exceeds it, which is the content of Bell's argument. But it does not run away:
      it stops at roughly 2.83, while nothing about signalling or logic would forbid
      going all the way to four. Why the ceiling sits where it does, rather than higher,
      is a question the bare formalism does not answer.
    in_csd: >
      A reconstruction has to reproduce not only that the classical bound is violated
      but by exactly how much, since the gap between the quantum ceiling and the
      logical one is a real feature to be explained rather than a coincidence to be
      inherited. The bound is proved here universally: every unit bipartite state, all
      settings, not merely the singlet at optimal angles.
    mathematical: >
      For every unit bipartite state and all detector settings, the CHSH combination of
      spin correlations satisfies |S| <= 2 times the square root of 2. The
      singlet-specific attainment is proved separately, so the ceiling and its
      saturation are distinct statements.
    person: >
      Boris Tsirelson (1950-2020), Soviet-born and later Israeli, proved in 1980 that quantum correlations stop well short of the logical maximum. Why they stop exactly there became a research programme of its own.
    lean:
      module: CsdLean4/SigmaLayer/BellGenerality.lean
      theorem: qm_chsh_le_tsirelson
    related: [bell-chsh, ghz-state]

  - slug: landauer-principle
    term: Landauer's principle
    eponyms: [Landauer]
    status: proved-in-corpus
    hook: >
      Forgetting costs heat. The price is fixed by temperature alone, and it is a
      theorem here rather than a thermodynamic slogan.
    layman: >
      Erasing information is not free. Resetting a memory to a definite state means
      reducing the number of ways it could be, and that reduction has to be paid for
      by dumping heat into the surroundings. The exchange rate is set purely by the
      temperature of those surroundings. This is the point where information stops
      being an abstraction and acquires a physical cost.
    in_csd: >
      Thermodynamics is not bolted onto this programme; the substrate is
      measure-preserving underneath and irreversibility appears only when a record is
      coarse-grained. That makes an erasure bound a natural consequence rather than an
      import, and it is the tightest link between the record layer and physical cost.
      It is also the fourth tranche of a thermodynamics track whose earlier results
      derive temperature and free energy rather than assuming them.
    mathematical: >
      The entropy removed from a system by a process is bounded by beta times the heat
      delivered to the bath. Proof route: entropy conservation under unitary evolution
      on a product state, plus subadditivity, bound the system entropy drop by the bath
      entropy rise; the bath Clausius inequality converts that into the heat bound.
    person: >
      Rolf Landauer (1927-1999), German-born American, worked at IBM and argued that information is physical -- that erasing a bit has an unavoidable thermodynamic cost. The principle dates from 1961 and was confirmed experimentally only in 2012.
    lean:
      module: CsdLean4/Thermo/Landauer.lean
      theorem: landauer_bound
    related: [von-neumann-entropy]

  - slug: von-neumann-entropy
    term: von Neumann entropy
    eponyms: [Neumann]
    status: proved-in-corpus
    hook: >
      Two systems together can be perfectly known while each of them separately is
      not. Entropy is where entanglement stops being a metaphor.
    layman: >
      Entropy counts how much you do not know. For ordinary objects, knowing the whole
      means knowing the parts. Quantum systems break that: a pair can be in a
      completely definite joint state while each member, considered alone, is as
      undetermined as possible. The missing information is not in either part; it is in
      the relationship. Entropy is the quantity that makes this precise, and the
      inequalities it obeys are the arithmetic of that fact.
    in_csd: >
      The corpus needs entropy for two jobs. It measures the irreversibility produced
      when a pure state is coarse-grained into a record, which is how the second law
      enters a substrate that is reversible underneath. And its inequalities are the
      working machinery of the thermodynamics track, subadditivity being the step that
      converts an entropy statement into the Landauer heat bound.
    mathematical: >
      For a bipartite density operator the von Neumann entropy is subadditive: the
      entropy of the whole is at most the sum of the entropies of its marginals. Stated
      here at positive-definite marginal scope. The strong subadditivity strengthening
      is carried separately, from an explicit data-processing premise.
    person: >
      John von Neumann (1903-1957), Hungarian, gave quantum mechanics its Hilbert-space formulation in 1932 and introduced this entropy there, before Shannon's classical version. His contributions to computing, game theory and mathematics were of comparable scale.
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Subadditivity.lean
      theorem: vonNeumannEntropy_subadditive
    related: [landauer-principle]

  - slug: liouville-measure
    term: Liouville measure
    eponyms: [Liouville]
    status: proved-in-corpus
    hook: >
      The substrate's own notion of volume is not chosen. On the sector the programme
      works with, it is forced to be the same measure the Born rule uses.
    layman: >
      An underlying deterministic world needs a way of saying how much of it is of
      one kind rather than another, and that means a notion of volume that the motion
      does not distort as it flows. Classical mechanics has one and calls it after
      Liouville. The worry is that such a volume might be picked to order, tuned to
      produce whatever answer was wanted. On the space this programme uses, it cannot
      be: the space and its symmetry leave exactly one option.
    in_csd: >
      This is the hinge between the ontic story and the probability story. The
      substrate carries a finite Liouville measure and a motion that preserves it;
      the epistemic side needs the Fubini-Study measure to turn regions into Born
      weights. On the identity-projection sector those two are proved to be the same
      object, so the ruler used for probability is the substrate's own volume rather
      than a second, convenient assumption. It is also the honest reply to the
      standard objection that typicality arguments smuggle in the measure they
      justify.
    mathematical: >
      For the unitary-flow sector the Liouville measure is the Fubini-Study measure,
      and it is the forced Kahler volume: the sector's typicality measure is
      determined by the state space and its unitary symmetry rather than posited.
      Scope to disclose: measure-preservation of the flow is carried as a structure
      field for physical admissibility (an ontic postulate), not derived; what is
      proved is that IF the sector is this one, the volume is forced.
    person: >
      Joseph Liouville (1809-1882), French, proved in 1838 that phase-space volume is conserved by Hamiltonian motion. He also founded a major mathematics journal and was the first to exhibit transcendental numbers.
    lean:
      module: CsdLean4/LF4/KahlerVolumeForced.lean
      theorem: unitaryFlowSetup_liouville_isForcedKahlerVolume
    related: [fubini-study-measure, kahler-form, born-weight]

  - slug: kahler-form
    term: Kahler form
    eponyms: [Kahler]
    status: proved-in-corpus
    hook: >
      The space of quantum states carries a metric and a rotation that agree with each
      other. That agreement is what makes its volume canonical rather than arbitrary.
    layman: >
      The space of quantum states has three structures that could each have been
      independent: a way of measuring distance, a way of measuring area, and a
      quarter-turn operation coming from the complex numbers. In fact they lock
      together, each recoverable from the other two. A space where they lock together
      in this way has a volume nothing else has to supply, which is why the ruler used
      throughout this programme is not an extra ingredient.
    in_csd: >
      This underwrites the claim that the typicality measure is geometric rather than
      chosen. What is proved here is the pointwise compatibility on the tangent model:
      the quarter-turn squares to minus one, the area form is the metric composed with
      it and vice versa, the form is invariant under the quarter-turn on both slots,
      and pairing a vector with its own turn returns its squared length. Flat
      closedness is likewise proved on the tangent model.
    mathematical: >
      With g the real part of the inner product, omega the imaginary part, and J
      multiplication by i, the Fubini-Study Kahler compatibility holds pointwise:
      J^2 = -1, omega = g composed with J, g = omega composed with J, omega is of type
      (1,1), and omega(u, Ju) = the squared norm of u. Proved axiom-free.
      Scope to disclose, and it is load-bearing: the MANIFOLD residual is NOT
      formalised. Closedness and the top-power identity omega^(N-1)/(N-1)! = the
      Fubini-Study measure ON the projective space itself await a manifold
      differential-form API the proof assistant does not yet carry. Kahler
      differential geometry must therefore not be described as load-bearing here; the
      pointwise core is what the corpus owns.
    person: >
      Erich Kahler (1906-2000), German, introduced these manifolds in 1933. The compatibility of metric, complex structure and area form he identified turned out to be the natural setting for much of modern geometry and, later, for the geometry of quantum states.
    lean:
      module: CsdLean4/LF4/KahlerOnticSetup.lean
      theorem: isFubiniStudyKahler
    related: [liouville-measure, fubini-study-measure]

  - slug: luders-rule
    term: Luders rule
    eponyms: [Luders]
    status: proved-in-corpus
    hook: >
      The textbook rule for how a state changes when it is measured is not a second
      postulate here. It is what the record layer does.
    layman: >
      Measure a quantum system and two things happen: an outcome appears, and the
      state afterwards is different from the state before. Textbook quantum mechanics
      states the update as a rule of its own. In this programme the update is not a
      separate rule but a description of what the recording apparatus has already
      done, so the outcome and the new state come from one mechanism rather than two
      postulates that must be kept consistent by hand.
    in_csd: >
      This is the record layer earning its keep. Records and the state update live on
      the same pointer arena, and the Born weights of the recorded outcomes come out
      of the same construction that produces the updated state. The degenerate case
      matters here rather than being a technicality: when several outcomes share a
      value the update must project onto a block rather than a ray, and it is that
      block form the arena realises.
    mathematical: >
      On the pointer arena, the record-conditioned marginal reproduces the Born weights
      of the preparation and the post-measurement state is the block projection of the
      Lueders form. Degenerate (block) measurements are the general case treated; the
      rank-one projective case is the specialisation.
    person: >
      Gerhart Luders (1920-1995), German, gave the general state-update rule in 1951, correcting von Neumann's version for measurements with repeated eigenvalues. He is also known for the CPT theorem.
    lean:
      module: CsdLean4/RecordLayer/PointerLudersMarginal.lean
      theorem: pointer_luders_born_prep
    related: [born-weight, naimark-dilation]

  - slug: naimark-dilation
    term: Naimark dilation
    eponyms: [Naimark]
    status: proved-in-corpus
    hook: >
      Every generalised measurement is a plain one performed in a larger room. That is
      what lets the volume derivation cover generalised measurements at all.
    layman: >
      Not every quantum measurement is of the simple kind that sorts states into
      mutually exclusive alternatives; real detectors are noisier and more flexible
      than that. The saving fact is that any such general measurement can be seen as a
      simple one carried out on the system together with an extra piece of apparatus.
      Enlarge the room and the complicated thing becomes the simple thing again.
    in_csd: >
      Without this the programme's Born derivation would apply only to idealised
      measurements, which would be a serious limitation for a claim about physics
      rather than about textbooks. Dilating a generalised measurement to a projective
      one on a larger space lets the same volume-ratio argument run, so the
      generalised case is closed by transfer rather than by a separate derivation.
    mathematical: >
      For a POVM with a Naimark dilation, the Born weight of an effect equals the
      Fubini-Study volume of the corresponding outcome region in the dilated space, and
      the frequency statement transfers with it. Stated unconditionally.
    person: >
      Mark Naimark (1909-1978), Soviet, proved the dilation theorem in 1940. It says any generalised measurement is a simple one on a larger space, and it is what lets results proved for ideal measurements reach realistic ones.
    lean:
      module: CsdLean4/LF4/BornRegionUncond.lean
      theorem: povm_born_eq_dilated_volume_uncond
    related: [born-weight, luders-rule]

  - slug: no-exact-finite-ccr
    term: No exact finite-dimensional CCR
    status: proved-in-corpus
    hook: >
      Position and momentum cannot satisfy their textbook relation in any finite
      system. The proof is one line of trace arithmetic, and it constrains every
      finite theory, not only this one.
    layman: >
      Position and momentum are related by a rule that sits at the heart of quantum
      mechanics. If the world had only finitely many distinguishable states, that rule
      could not hold exactly: a simple counting argument forbids it. So any finite
      theory must either give up the exact relation or explain where it fails. Here it
      fails only at the very top of the energy ladder, and the failure is displayed
      rather than hidden.
    in_csd: >
      The programme is finite by construction, so it owes an account of this rather
      than an apology. The account is sharp: the relation holds exactly on the
      low-energy sector and breaks by a single rank-one defect at the ceiling, by
      precisely the amount that makes the trace argument come out right. The wider
      point is that this obligation is not peculiar to this programme; it applies to
      any finite-dimensional reconstruction, which is why the result is stated in
      CSD-free form.
    mathematical: >
      There are no finite matrices with the commutator of Q and P equal to a nonzero
      multiple of the identity: the trace of a commutator vanishes while the trace of
      c times the identity is c times the dimension. The companion construction gives
      a conjugate pair whose commutator is exactly i on every level but the top, with
      the defect a rank-one term at the highest level.
    lean:
      module: CsdLean4/CV/ApproxCCR.lean
      theorem: no_exact_finite_ccr
    related: [canonical-typicality]

  - slug: canonical-typicality
    term: Canonical typicality
    status: proved-in-corpus
    hook: >
      A small piece of a large quantum system looks thermal not because it was
      prepared that way, but because almost every state of the whole makes it so.
    layman: >
      Thermodynamics usually begins by assuming an ensemble: a collection of possible
      states, weighted somehow. Canonical typicality removes the assumption. Take one
      large system in a single definite state, look at a small part of it, and the part
      appears thermal for almost any choice of the whole. Equilibrium becomes a
      statement about how much room there is in the space of states, not about an
      ensemble anyone had to posit.
    in_csd: >
      This is the closest point of contact between the programme and mainstream
      statistical mechanics, and the contact runs both ways. Thermal behaviour here is
      volume again, exactly as Born weights are, so thermodynamics is native to the
      construction rather than bolted on. In the other direction, the literature's
      standing complaint about canonical typicality is that its reference measure is an
      unmotivated prior; on this account that measure is the substrate's own volume,
      which is a reply the usual presentations cannot give.
    mathematical: >
      For a global pure state drawn from the Fubini-Study measure, the average reduced
      state of a tensor subsystem is maximally mixed on that subsystem. Scope to
      disclose, and it is the difference between this and the literature's headline:
      what is proved is the EXPECTATION, not the concentration. The typical-state
      statement, that a single drawn state has a reduced state close to maximally mixed
      with probability exponentially near one, needs measure concentration on
      high-dimensional spheres, which the proof assistant does not carry. The mean is
      exactly the value concentration would concentrate around; only the deviation
      bound is absent. This is also not dynamical thermalisation.
    lean:
      module: CsdLean4/Thermo/CanonicalTypicality.lean
      theorem: canonical_typicality_expectation
    related: [fubini-study-measure, von-neumann-entropy, born-weight]

  - slug: bargmann
    term: Bargmann invariant
    eponyms: [Bargmann]
    status: standard-mathematics
    hook: >
      A phase that no choice of convention can remove, which is exactly why it carries physical information.
    layman: >
      A quantum state's overall phase is a matter of convention and means nothing on its own. Take three states, multiply their overlaps around the cycle, and the phase of that product survives every convention change. It is among the smallest quantities that are genuinely present rather than artefacts of bookkeeping.
    in_csd: >
      The corpus uses it as the invariant separating the unitary branch from the antiunitary one in the Wigner analysis, since the two conjugate it oppositely. Honest scope: Bargmann's theorem proper, that continuity kills the projective cocycle, is recorded as a gap the proof assistant cannot yet close, not as something proved here.
    mathematical: >
      For rays u, v, w the Bargmann invariant is the phase of the product of the three pairwise overlaps taken around the cycle. It is unchanged under independent rescaling of each representative vector.
    person: >
      Valentine Bargmann (1908-1989), German-born, worked as Einstein's assistant at Princeton. His 1954 paper on projective representations settled when a symmetry's phase ambiguity can be removed, which is what completes Wigner's theorem into a statement about groups.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Wigner%27s_theorem

  - slug: bloch-sphere
    term: Bloch sphere
    eponyms: [Bloch]
    status: standard-mathematics
    hook: >
      The two-level system is a ball, and that is the one accident which makes the smallest case misleadingly easy.
    layman: >
      The states of the simplest quantum system can be drawn as points on an ordinary sphere. Directions are measurement settings, and angles between them govern the statistics. It is the friendliest picture in quantum mechanics, and its friendliness is special to two levels rather than a general truth.
    in_csd: >
      Used throughout the qubit-level results as the concrete arena. The programme flags the accident explicitly: at two levels the projective state space IS a sphere, so structure that must in general live in a fibre above the space can sit on the space itself. Conclusions drawn from the sphere therefore do not automatically generalise, and the corpus makes that point rather than glossing it.
    mathematical: >
      The projective space of a two-dimensional complex Hilbert space is diffeomorphic to the two-sphere, antipodal points being orthogonal states, with the Fubini-Study measure the normalised round area.
    person: >
      Felix Bloch (1905-1983), Swiss, shared the 1952 Nobel Prize for nuclear magnetic resonance -- the technique behind MRI. The sphere comes from that work on spins in magnetic fields, not from quantum information, where it later became the standard picture.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Bloch_sphere

  - slug: borel-set
    term: Borel set
    eponyms: [Borel]
    status: standard-mathematics
    hook: >
      Before you can say how likely a region is, you must say which regions are allowed to have a size at all.
    layman: >
      Not every collection of points can be assigned a size without contradiction. The standard repair is to fix in advance a family of well-behaved sets, built up from simple ones by countable operations, and to measure only those. Essentially anything one would naturally draw belongs to it.
    in_csd: >
      Every measure in the corpus is a Borel measure on its state space, and the outcome regions whose volumes give Born weights are required to be Borel. This is background machinery, used as any measure-theoretic development uses it; nothing particular is claimed about it here.
    mathematical: >
      The sigma-algebra generated by the open sets of a topological space. The measures used here are Borel probability measures.
    person: >
      Emile Borel (1871-1956), French, founded measure theory around 1898, making it possible to say which sets have a size at all. He also served in the French government and the Resistance, and was imprisoned by the Vichy regime.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Borel_set

  - slug: cglmp-inequality
    term: CGLMP inequality
    eponyms: [CGLMP]
    status: standard-mathematics
    hook: >
      Bell's argument was written for two-outcome measurements. Past two the right inequality is a different one, and quantum mechanics violates that too.
    layman: >
      The famous test of local realism assumes each measurement has two possible results. Real systems often have more, and extending the argument is not cosmetic: a new inequality is needed and the margin of violation changes. That the conflict survives past the simplest case is what makes it structural rather than an artefact of the example everyone quotes.
    in_csd: >
      The corpus carries it so the contextuality results are not confined to two-level systems. A reconstruction claiming to recover quantum mechanics in general must reproduce the higher-outcome conflicts as well, not only the two-outcome one.
    mathematical: >
      A Bell-type inequality for bipartite systems with d outcomes per measurement, due to Collins, Gisin, Linden, Massar and Popescu, violated by quantum mechanics for every d of at least two.
    person: >
      Named for Daniel Collins, Nicolas Gisin, Noah Linden, Serge Massar and Sandu Popescu, whose 2002 paper extended Bell's argument beyond two outcomes per measurement.
    external:
      - text: "Overview and history"
        url: https://doi.org/10.1103/PhysRevLett.88.040404

  - slug: deutsch-jozsa
    term: Deutsch-Jozsa algorithm
    eponyms: [Deutsch]
    status: standard-mathematics
    hook: >
      The first problem shown to fall to a quantum computer in a single question where a classical method might need exponentially many.
    layman: >
      Suppose a hidden function is promised to be either constant on every input or split evenly between two answers, and you must say which. Classically you may have to examine a huge number of inputs. A quantum procedure settles it in one query, by arranging for the wrong answers to cancel.
    in_csd: >
      Held in the corpus as one of the algorithm witnesses. Its role is scope-marking rather than foundational: it shows the formalised machinery is strong enough to state and verify real quantum algorithms, which is a different claim from anything about the substrate.
    mathematical: >
      Given an oracle for a function promised constant or balanced, a single query decides which, against a classical worst case exponential in the number of input bits.
    person: >
      David Deutsch, British, formulated the universal quantum computer in 1985 and, with Richard Jozsa, gave this algorithm in 1992 -- the first clear separation between quantum and classical query complexity.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Deutsch%E2%80%93Jozsa_algorithm

  - slug: dirichlet-distribution
    term: Dirichlet distribution
    eponyms: [Dirichlet]
    status: standard-mathematics
    hook: >
      The natural way to be evenly ignorant about a list of probabilities that has to add up to one.
    layman: >
      To choose a set of proportions at random with none favoured, you cannot simply choose each independently, because they must sum to one. The Dirichlet family is the standard answer, and its flat member spreads weight evenly over every way of dividing a whole into parts.
    in_csd: >
      This is what the state space looks like once the moment map has discarded everything except the outcome probabilities. The flat member is what the Fubini-Study measure becomes under that projection, which is the content of the Duistermaat-Heckman statement and the reason Born weights reduce to ordinary volumes of regions in a simplex.
    mathematical: >
      A family of distributions on the probability simplex. The uniform member is flat Lebesgue measure on the simplex, and it is the pushforward of the Fubini-Study measure along the moment map.
    person: >
      Peter Gustav Lejeune Dirichlet (1805-1859), German, worked on number theory and Fourier analysis. The modern definition of a function as an arbitrary rule rather than a formula is largely his.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Dirichlet_distribution

  - slug: elitzur-vaidman
    term: Elitzur-Vaidman bomb tester
    eponyms: [Elitzur]
    status: standard-mathematics
    hook: >
      You can establish that an object is there without any light ever touching it.
    layman: >
      Imagine a bomb so sensitive that a single particle of light detonates it, in a batch where some are duds. Sorting them looks impossible, since testing means illuminating and illuminating means detonating. Quantum interference permits a test in which some live bombs are identified precisely because nothing went the way that would have triggered them. The absence of an interaction becomes the evidence.
    in_csd: >
      Carried as one of the empirical twins: a prediction counterintuitive enough that reproducing it is a genuine test of an account rather than a formality. Interaction-free measurement is a sharp probe of what a substrate story must say about the path not taken.
    mathematical: >
      An interferometer in which a blocking object destroys the interference, so a detection at the normally dark port certifies the object's presence without absorbing anything.
    person: >
      Avshalom Elitzur and Lev Vaidman, both Israeli, published the bomb-tester in 1993 as a sharp demonstration that quantum mechanics permits learning about an object without interacting with it.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Elitzur%E2%80%93Vaidman_bomb-tester

  - slug: euclidean-space
    term: Euclidean space
    eponyms: [Euclidean]
    status: standard-mathematics
    hook: >
      Ordinary geometry of lengths and angles, carried over to complex numbers: the setting every finite quantum system here lives in.
    layman: >
      Ordinary geometry supplies a way to say how long something is and how far two directions differ. Quantum mechanics needs both, but over complex numbers, so lengths stay real and positive while directions can carry a phase. Everything finite in this programme is built on that structure.
    in_csd: >
      State vectors live in finite complex Euclidean space and operators are matrices on it. This is the base setting rather than a subject of claims; what carries content is the projective space built from it and the measures on that space.
    mathematical: >
      Finite-dimensional complex inner product space, written here in its L2 form on a finite index type, with matrices carrying the induced operator norm.
    person: >
      Euclid of Alexandria, active around 300 BC, organised geometry into axioms and proofs in the Elements -- the model for deductive mathematics ever since, and the reason a formal proof looks the way it does.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Euclidean_space

  - slug: fisher-information
    term: Fisher information
    eponyms: [Fisher]
    status: standard-mathematics
    hook: >
      How sharply a measurement can tell nearby possibilities apart, and therefore how well anything can ever be estimated.
    layman: >
      If the quantity you are trying to measure shifts slightly, your results shift too, but only a little and against a background of noise. Fisher information quantifies how much the results respond, and it sets a floor under the error of any estimate. It is the mathematics of how good a measurement could possibly be.
    in_csd: >
      Used in the metrology strand, where quantum precision limits are stated. That strand is an adjacent arm rather than part of the reconstruction: it consumes the formalised machinery instead of contributing to the derivation of quantum mechanics.
    mathematical: >
      The variance of the score of a parametrised family; its inverse bounds the variance of any unbiased estimator through the Cramer-Rao inequality, with a quantum analogue for parametrised families of states.
    person: >
      Ronald Fisher (1890-1962), British, largely created modern statistics: maximum likelihood, experimental design, analysis of variance. His advocacy of eugenics is part of the record and is not incidental to how his statistical work was applied.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Fisher_information

  - slug: gibbs-state
    term: Gibbs state
    eponyms: [Gibbs]
    status: standard-mathematics
    hook: >
      The state a system settles into at a given temperature, singled out as the one that balances energy against disorder.
    layman: >
      Left in contact with a large environment at some temperature, a system does not sit in its lowest-energy configuration. It spreads across configurations, favouring low energy but not exclusively. The Gibbs state is that compromise, and it is picked out by a variational principle: it is the state of least free energy.
    in_csd: >
      The thermodynamics strand instantiates it on the field Hamiltonian and derives temperature and free energy rather than positing them. It is also the object joined to the field-theoretic strand by the exact equilibrium condition proved at the cutoff, which is where those two strands of the corpus meet.
    mathematical: >
      The density operator proportional to the exponential of minus beta times the Hamiltonian, normalised by the partition function; the unique minimiser of the free energy functional at inverse temperature beta.
    person: >
      Josiah Willard Gibbs (1839-1903), American, worked in near-obscurity at Yale and founded statistical mechanics, deriving thermodynamics from the statistics of molecular states.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Gibbs_measure

  - slug: gisin-theorem
    term: Gisin's theorem
    eponyms: [Gisin]
    status: standard-mathematics
    hook: >
      Every entangled pure state violates a Bell inequality. Entanglement and non-classical correlation are the same thing, with no exceptions to hunt for.
    layman: >
      One might expect entanglement to come in degrees, with weakly entangled states behaving classically and only strong ones showing the famous conflict. Not so, for pure states: any entanglement at all, however slight, produces correlations no local account can reproduce. There is no quiet zone.
    in_csd: >
      The corpus carries the CHSH machinery in a form general enough that the singlet is an instance rather than the subject, which is what makes statements of this shape expressible. It matters to the programme because a substrate account cannot treat weak entanglement as effectively classical.
    mathematical: >
      Every pure entangled bipartite state violates the CHSH inequality for some choice of settings. The corpus proves the universal quantum ceiling and the singlet's saturation of it separately.
    person: >
      Nicolas Gisin, Swiss, proved in 1991 that every entangled pure state violates a Bell inequality, and led much of the experimental work on quantum communication over deployed telecom fibre.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Nicolas_Gisin

  - slug: grover-algorithm
    term: Grover's algorithm
    eponyms: [Grover]
    status: standard-mathematics
    hook: >
      Searching an unsorted haystack in about the square root of the number of straws, and that speedup is provably the best possible.
    layman: >
      To find one marked item among many with no structure to exploit, classical search must on average look at half of them. A quantum procedure repeatedly nudges amplitude toward the marked item, needing roughly the square root of that number of steps. The gain is modest next to other quantum speedups, but it applies to almost any search, and it cannot be improved.
    in_csd: >
      One of the algorithm witnesses in the corpus. Like the others it marks scope: the machinery can express and verify real algorithms. It bears on the substrate story only indirectly, by showing the formalised dynamics is the genuine article rather than a restricted fragment.
    mathematical: >
      Amplitude amplification finds a marked element among N with order square root of N oracle queries, which is optimal for unstructured search.
    person: >
      Lov Grover, Indian-born American, published the search algorithm in 1996 while at Bell Labs. Its quadratic speedup is provably optimal for unstructured search, which is unusual: the algorithm and its lower bound arrived together.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Grover%27s_algorithm

  - slug: haar-measure
    term: Haar measure
    eponyms: [Haar]
    status: standard-mathematics
    hook: >
      On a group, there is essentially one notion of volume that the group's own action leaves alone. Uniqueness there is what forces uniqueness everywhere else here.
    layman: >
      A group is a set of transformations that can be composed. Asking for a notion of size on such a set that is unchanged when everything is shifted by a transformation turns out to be very restrictive: for compact groups there is exactly one, once total size is fixed. Symmetry leaves no room for choice.
    in_csd: >
      This is the engine behind the claim that the programme's ruler is forced rather than chosen. The unitary group carries its Haar measure; the state space is a quotient of that group; and uniqueness of the invariant measure downstairs is inherited from uniqueness upstairs. Remove this and the Fubini-Study measure becomes a preference instead of a consequence.
    mathematical: >
      A compact topological group carries a unique translation-invariant Borel probability measure. Invariant measures on a homogeneous space of such a group are unique up to scale, and normalisation fixes the scale.
    person: >
      Alfred Haar (1885-1933), Hungarian, proved the existence of the invariant measure on a group in 1933, the year he died. It became one of the foundations of harmonic analysis.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Haar_measure

  - slug: hermitian-operator
    term: Hermitian operator
    eponyms: [Hermitian]
    status: standard-mathematics
    hook: >
      The operators whose values come out real. Anything that can be measured has to be one.
    layman: >
      Quantum mechanics represents measurable quantities by operators, and measured numbers are real. That forces a symmetry condition: the operator must equal its own conjugate transpose. Such operators have real eigenvalues and a full set of orthogonal eigenvectors, which is what lets a measurement be thought of as sorting states into alternatives.
    in_csd: >
      Observables, Hamiltonians and density operators in the corpus are all Hermitian, and the spectral decomposition that follows is used constantly, notably to diagonalise a state before integrating against it. Standard machinery: the corpus makes no claim about it, though it does prove the finite-dimensional spectral facts it consumes.
    mathematical: >
      A matrix equal to its own conjugate transpose. Its eigenvalues are real and it is unitarily diagonalisable, which supports the functional calculus used throughout.
    person: >
      Charles Hermite (1822-1901), French, worked on number theory and proved that e is transcendental. He was born with a deformed foot and, refusing to have it treated, was barred from the career in engineering he had trained for.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hermitian_matrix

  - slug: hilbert-space
    term: Hilbert space
    eponyms: [Hilbert]
    status: standard-mathematics
    hook: >
      The stage quantum mechanics is normally set on. This programme treats it as scenery rather than substance.
    layman: >
      The standard formulation puts quantum states in a space with lengths and angles that is complete, meaning limits of sequences stay inside. In finite dimensions completeness is automatic and the space is just complex Euclidean space. It is the stage on which the usual account is performed.
    in_csd: >
      The programme's ontology is deliberately not here. Physical states are points of the constraint surface, and the Hilbert space enters as the epistemic bookkeeping built over it: the projective space of rays is what carries the outcome regions. Saying that quantum mechanics happens in Hilbert space is, on this account, describing the shadow rather than the object.
    mathematical: >
      A complete complex inner product space. Everything in this corpus is finite-dimensional, so completeness is automatic and the relevant object is the projective space of rays.
    person: >
      David Hilbert (1862-1943), German, was the leading mathematician of his era. His 1900 list of twenty-three problems set much of the century's agenda, and his formalist programme -- that mathematics could be made complete and consistent -- was limited by Godel in 1931.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hilbert_space

  - slug: hong-ou-mandel
    term: Hong-Ou-Mandel effect
    eponyms: [Hong]
    status: standard-mathematics
    hook: >
      Two identical photons meeting at a beam splitter always leave together. Indistinguishability, made visible as a hole in the data.
    layman: >
      Send two identical photons into the two sides of a half-silvered mirror at the same instant. Classically they should sometimes emerge one each way. They never do: the possibilities that would separate them cancel exactly, and both always exit on the same side. The signature is a dip to zero in the rate of coincidences, and it is a direct measure of how alike the two particles are.
    in_csd: >
      One of the empirical twins in the corpus. It is a useful test case because the effect is pure interference between alternatives rather than a correlation between separated wings, so it probes a different part of an account than the Bell family does.
    mathematical: >
      For two indistinguishable bosons entering the separate input ports of a balanced beam splitter, the amplitudes for both-transmitted and both-reflected cancel, so the coincidence rate falls to zero.
    person: >
      Chung Ki Hong, Zheyu Ou and Leonard Mandel demonstrated the effect at Rochester in 1987. Mandel (1927-2001) was a founder of quantum optics as an experimental subject.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hong%E2%80%93Ou%E2%80%93Mandel_effect

  - slug: jacobi-identity
    term: Jacobi identity
    eponyms: [Jacobi]
    status: standard-mathematics
    hook: >
      The rule that stops a bracket from being arbitrary. It is why commutators and Poisson brackets behave like the same thing.
    layman: >
      Take two operations and ask by how much doing them in the other order changes the result. That mismatch is itself an operation, and it obeys a compatibility law: cycle three ingredients through it and the pieces cancel. That law is what makes the mismatch a structure rather than a mess, and it is shared by the quantum commutator and its classical counterpart.
    in_csd: >
      It sits underneath the correspondence the programme leans on: the classical bracket and the quantum commutator obey the same law, which is what lets a Hamiltonian description translate between the ontic flow and the operator picture. Background structure rather than a subject of claims here.
    mathematical: >
      For a Lie bracket, the cyclic sum of the bracket of x with the bracket of y and z vanishes. Both the matrix commutator and the Poisson bracket satisfy it.
    person: >
      Carl Gustav Jacob Jacobi (1804-1851), German, worked on elliptic functions and dynamics. The Hamiltonian formulation of mechanics owes much of its modern shape to him.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Jacobi_identity

  - slug: kronecker-product
    term: Kronecker product
    eponyms: [Kronecker]
    status: standard-mathematics
    hook: >
      How two systems become one system, written out in coordinates.
    layman: >
      Put two quantum systems side by side and the combined system is not the pair of descriptions but something larger: every state of the first can be combined with every state of the second. In coordinates this is a way of multiplying two grids of numbers to make a much bigger grid, which is where the rapid growth of quantum computing resources comes from.
    in_csd: >
      The concrete realisation of composition throughout the corpus. It carries real weight in the results about composite systems, where the tensor structure is not assumed but forced from commuting local subalgebras, and in the partial trace used to discard an environment. Standard machinery in itself.
    mathematical: >
      The matrix realisation of the tensor product of operators, with the identity that the product of Kronecker products is the Kronecker product of the products.
    person: >
      Leopold Kronecker (1823-1891), German, was a successful businessman before returning to mathematics. He is remembered for insisting that mathematics be constructive, and for his hostility to Cantor's infinities.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Kronecker_product

  - slug: leggett-garg
    term: Leggett-Garg inequality
    eponyms: [Leggett]
    status: standard-mathematics
    hook: >
      Bell's argument turned from two places to two times. What it rules out is not distant influence but a definite history.
    layman: >
      Bell's inequalities compare measurements at separated places. Leggett and Garg asked the analogous question about one system at different moments: does it have a definite property all along, which observation merely reveals, and can it be observed without disturbance? Quantum mechanics says no, and it says so without any appeal to separation in space.
    in_csd: >
      Useful to the programme precisely because it isolates the temporal assumption. A substrate account naturally suggests that properties are definite between measurements, so a test targeting exactly that assumption is more searching, for this kind of theory, than a spatial Bell test.
    mathematical: >
      A bound on combinations of two-time correlation functions that follows from macrorealism plus non-invasive measurability, violated by quantum mechanics.
    person: >
      Anthony Leggett, British-American, shared the 2003 Nobel Prize for work on superfluidity. With Anupam Garg he proposed in 1985 the temporal analogue of Bell's inequalities, testing whether a system has definite properties between measurements.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Leggett%E2%80%93Garg_inequality

  - slug: loewner-order
    term: Loewner order
    eponyms: [Loewner]
    status: standard-mathematics
    hook: >
      A way of saying one operator is larger than another, and the reason the natural functions of operators are the ones that respect it.
    layman: >
      For plain numbers, saying which is larger is easy. For operators it is subtler: one counts as larger when the difference is positive in the sense of never returning a negative value. Some ordinary functions preserve this ordering when applied to operators and some, surprisingly, do not, which is a recurring source of difficulty in quantum information.
    in_csd: >
      Used in the corpus's entropy and channel results, where inequalities between operators are the working currency, and in the operator-convexity development that supports them. Standard machinery, imported rather than claimed.
    mathematical: >
      The partial order in which A is at most B when B minus A is positive semidefinite. Operator monotone and operator convex functions are those respecting it under the functional calculus.
    person: >
      Charles Loewner (1893-1968), Czech-born, emigrated after the Nazi occupation. His 1934 work on operator monotone functions established which functions respect the order on operators -- a question that turned out to matter for quantum information.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Loewner_order

  - slug: mach-zehnder
    term: Mach-Zehnder interferometer
    eponyms: [Mach]
    status: standard-mathematics
    hook: >
      Split a particle's path, bring it back, and what arrives depends on a route it can be shown never to have taken.
    layman: >
      A beam is divided along two paths and recombined. Whether the output is bright or dark depends on the difference between the two routes, even when only one particle is present at a time. Block a path and the pattern vanishes. It is the cleanest laboratory setting in which the question of what happened in between becomes pressing.
    in_csd: >
      The standard arena for the corpus's interference twins, including the interaction-free measurement and the eraser. Its value to the programme is that it forces an account to say something definite about the unmeasured alternative, which is exactly where interpretations differ.
    mathematical: >
      A two-path interferometer with two balanced beam splitters, whose output port intensities depend on the relative phase accumulated between the arms.
    person: >
      Ludwig Mach (1868-1951) and Ludwig Zehnder (1854-1949) devised the interferometer independently in the 1890s. Ludwig was the son of Ernst Mach, the physicist and philosopher whose critique of absolute space influenced Einstein.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Mach%E2%80%93Zehnder_interferometer

  - slug: malus-law
    term: Malus's law
    eponyms: [Malus]
    status: standard-mathematics
    hook: >
      The oldest quantitative rule about measurement outcomes, and the first thing any account of the Born rule has to reproduce.
    layman: >
      Send polarised light through a second polariser at an angle and the fraction that gets through follows the square of the cosine of that angle. Discovered long before quantum mechanics, it is the same rule as the quantum prediction for a single particle, which makes it the simplest possible check on any story about where outcome probabilities come from.
    in_csd: >
      The corpus derives it as a volume ratio rather than assuming it, which makes it the smallest complete instance of the programme's central claim. It is the case where the general statement can be seen entirely by hand, and it is also where the two-level accident is easiest to mistake for the general situation.
    mathematical: >
      The transmitted intensity through crossed polarisers is proportional to the squared cosine of the angle between them, matching the Born weight for a spin measurement on the corresponding axis.
    person: >
      Etienne-Louis Malus (1775-1812), French, served as an engineer in Napoleon's Egyptian campaign and discovered polarisation by reflection in 1808, reportedly while looking at sunlight reflected from a Paris window. He died at thirty-six.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Malus%27s_law

  - slug: mermin-inequality
    term: Mermin inequality
    eponyms: [Mermin]
    status: standard-mathematics
    hook: >
      With more parties the conflict with common sense stops being statistical and becomes arithmetic, and it grows with the number of participants.
    layman: >
      Bell's conflict shows up in averages over many runs. Add more particles and the disagreement sharpens into one about signs that must all come out consistently and cannot. The margin by which quantum mechanics beats any common-sense account grows as parties are added, so the effect becomes more pronounced rather than washing out.
    in_csd: >
      The corpus carries the multi-party form alongside the two-party one so that its contextuality results are not tied to the smallest case. Together with the GHZ obstruction it establishes that the conflict is a structural feature at every size, which is a stronger obligation for a substrate account to meet.
    mathematical: >
      A family of multipartite Bell inequalities whose classical bound is exceeded by quantum mechanics by a factor growing exponentially in the number of parties.
    person: >
      David Mermin, American, is known for lucid writing on quantum foundations as much as for his research -- the phrase shut up and calculate is his, coined as a criticism. He gave these multi-party inequalities in 1990.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/GHZ_experiment

  - slug: pauli-matrices
    term: Pauli matrices
    eponyms: [Pauli]
    status: standard-mathematics
    hook: >
      Three small matrices that generate everything a single quantum bit can do.
    layman: >
      The simplest quantum system needs a way to describe measurements along different directions in space. Three matrices, one per axis, do the whole job: every observable of a two-level system is built from them and the identity, and their failure to commute is the concrete face of the uncertainty principle.
    in_csd: >
      Used everywhere the corpus touches spin: the detector settings in the Bell and GHZ results are built from them, the singlet correlations are computed with them, and the Bloch picture is their geometry. Standard machinery, and the corpus claims nothing about the matrices themselves.
    mathematical: >
      Three traceless Hermitian involutions on a two-dimensional space, pairwise anticommuting, which with the identity form a basis of the Hermitian operators there.
    person: >
      Wolfgang Pauli (1900-1958), Austrian, formulated the exclusion principle at twenty-four and won the Nobel Prize for it. Famously severe as a critic, he is the source of the phrase not even wrong.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Pauli_matrices

  - slug: peres-criterion
    term: Peres criterion
    eponyms: [Peres]
    status: standard-mathematics
    hook: >
      A test for entanglement that is a single arithmetic operation: transpose half the system and look for a negative number.
    layman: >
      Deciding whether two systems are entangled or merely correlated is generally hard. There is a strikingly simple necessary test: perform a transposition on one half only. If the result fails to be a legitimate state, the original was entangled. For the smallest systems the test is also sufficient, which makes entanglement decidable there.
    in_csd: >
      Carried in the corpus alongside the Bell results as the structural counterpart to them: Bell inequalities detect entanglement through statistics, this detects it through algebra. Having both matters because they are not equivalent in general, and an account should not conflate correlation strength with entanglement.
    mathematical: >
      If a bipartite state is separable then its partial transpose is positive semidefinite. The converse holds in dimensions two by two and two by three.
    person: >
      Asher Peres (1934-2005), Israeli, gave the partial-transpose test for entanglement in 1996 and co-authored the quantum teleportation protocol. His textbook is among the clearest written on quantum theory.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Peres%E2%80%93Horodecki_criterion

  - slug: poisson-bracket
    term: Poisson bracket
    eponyms: [Poisson]
    status: standard-mathematics
    hook: >
      The classical ancestor of the commutator, and the reason a deterministic flow can look like quantum dynamics.
    layman: >
      In classical mechanics, the rate at which any quantity changes is given by a bracket of it with the energy. The bracket obeys the same structural laws as the quantum commutator. This is why a deterministic flow underneath and an operator description on top are not rival languages but two views of one structure.
    in_csd: >
      Load-bearing for the programme's ambition, since the ontic side is a deterministic measure-preserving flow and the epistemic side is operator dynamics, and the bracket is the bridge. The corpus's formal content here is at the pointwise and volume level; the manifold-level symplectic geometry remains outside what the proof assistant can currently express.
    mathematical: >
      The bilinear antisymmetric bracket on functions of phase space determined by the symplectic form, satisfying the Jacobi identity and generating Hamiltonian flow.
    person: >
      Simeon Denis Poisson (1781-1840), French, introduced the bracket in 1809. His name attaches to results across probability, mechanics and electrostatics; the Poisson distribution is the best known.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Poisson_bracket

  - slug: ramsey-interferometry
    term: Ramsey interferometry
    eponyms: [Ramsey]
    status: standard-mathematics
    hook: >
      Two short pushes separated by a long wait measure a frequency far better than one long push. It is how clocks are built.
    layman: >
      Rather than driving a system continuously, give it a brief nudge, let it evolve freely for a while, then nudge it again. The phase accumulated during the wait shows up as an interference pattern, and the longer the wait the finer the resolution. Atomic clocks and much of precision measurement rest on this trick.
    in_csd: >
      The corpus uses it in the metrology strand, where precision limits are stated and the standard and Heisenberg scalings compared. That strand consumes the formalised dynamics rather than contributing to the reconstruction, and is labelled as an adjacent arm.
    mathematical: >
      A two-pulse scheme in which the accumulated relative phase during free evolution produces fringes whose spacing narrows with the free-evolution time.
    person: >
      Norman Ramsey (1915-2011), American, invented the separated-oscillatory-fields method in 1949 and received the 1989 Nobel Prize for it. The definition of the second rests on the technique.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Ramsey_interferometry

  - slug: schrodinger-equation
    term: Schrodinger equation
    eponyms: [Schrodinger]
    status: standard-mathematics
    hook: >
      Quantum dynamics is not postulated here. It is what a continuous symmetry-preserving flow is forced to look like.
    layman: >
      The standard formulation writes down an equation of motion for the quantum state and takes it as a law. In this programme the equation is a conclusion. If the underlying motion preserves the relations between states and does not jump, then rigidity forces it to act as a symmetry at each moment, and continuity forces a generator to exist. What emerges is the familiar equation, with the Hamiltonian as the generator.
    in_csd: >
      This is the second of the programme's two pillars, the first being the Born rule, and both are demonstrated on a single sector so they are not separate stories. The route is Wigner rigidity followed by the finite-dimensional Stone theorem. Honest scope: the sector is posited, and what is proved is that a flow on it must take this form, not that this flow must exist.
    mathematical: >
      For a strongly continuous projective flow preserving transition probabilities, the induced evolution is a one-parameter unitary group and so is generated by a Hamiltonian, giving the usual equation of motion up to phase.
    person: >
      Erwin Schrodinger (1887-1961), Austrian, wrote down the wave equation in 1926 and shared the Nobel Prize in 1933. He disliked the probabilistic reading his own equation received, and devised the cat as a reductio against it -- an argument now more often quoted as an illustration of the thing it was meant to refute.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Schr%C3%B6dinger_equation

  - slug: shor-algorithm
    term: Shor's algorithm
    eponyms: [Shor]
    status: standard-mathematics
    hook: >
      Factoring large numbers efficiently, which would break most deployed public-key cryptography.
    layman: >
      The security of much of modern encryption rests on the belief that splitting a large number into its prime factors is impractically slow. A quantum computer can do it in time that grows only polynomially, by turning factoring into a question about the period of a repeating pattern and using interference to read that period off.
    in_csd: >
      Present in the corpus as the most demanding of the algorithm witnesses, with the reversible arithmetic beneath it built and verified. It bears on the substrate story only as scope evidence: the formalised machinery is strong enough to carry a full algorithm rather than a toy. The programme makes no claim about cryptography.
    mathematical: >
      Quantum order-finding gives the period of modular exponentiation in polynomial time, from which a factor follows classically with high probability.
    person: >
      Peter Shor, American, published the factoring algorithm in 1994, turning quantum computing from a theoretical curiosity into a subject with a budget. He also gave the first quantum error-correcting code.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Shor%27s_algorithm

  - slug: stern-gerlach
    term: Stern-Gerlach experiment
    eponyms: [Stern]
    status: standard-mathematics
    hook: >
      The experiment that showed measurement outcomes come in discrete lumps, and that asking a second question can undo the answer to the first.
    layman: >
      Send atoms through a non-uniform magnetic field and they do not spread into a smear as expected, but split into distinct beams. Worse for intuition, sorting by one direction and then by another destroys the earlier sorting. The experiment shows both that outcomes are discrete and that measurements interfere with one another.
    in_csd: >
      The reference example for measurement in the corpus, and a useful one for the programme because the second half, the destruction of the earlier sorting, is exactly the contextuality that any substrate account must produce rather than explain away.
    mathematical: >
      A spatial separation of beams according to the eigenvalues of a spin component along the field gradient, with successive measurements along non-commuting axes failing to preserve the earlier outcome.
    person: >
      Otto Stern (1888-1969) and Walther Gerlach (1889-1979) performed the experiment in Frankfurt in 1922. Stern, who was Jewish, left Germany in 1933 and received the Nobel Prize in 1943; Gerlach remained and led part of the German nuclear programme.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Stern%E2%80%93Gerlach_experiment

  - slug: contextuality
    term: Contextuality
    status: proved-in-corpus
    source: curated
    hook: >
      An outcome can depend on what else you chose to measure alongside it. Not a disturbance, and not ignorance: no consistent set of answers exists.
    layman: >
      It is natural to think a measurement reveals a property the system already had, and that measuring something else at the same time is irrelevant. Quantum mechanics denies it. There are collections of questions for which no assignment of answers works at all, no matter how the answers are chosen, provided each answer is required to be the same regardless of which companion questions are asked. The result depends on the company the question keeps.
    in_csd: >
      CSD is contextual by construction, so this is a commitment rather than a concession. The substrate carries a definite microstate, and a measurement context fixes which partition of the epistemic space the outcome is read against; change the context and you change the partition, so the same microstate can yield different answers. The corpus proves the obstruction rather than asserting it, and pairs it with an explicit contextual model that reproduces the singlet, so the position is two-sided: contextuality is not a gap in the account but the shape of it.
    mathematical: >
      Over a single shared measurable state space, no jointly-defined assignment of outcomes to the four CHSH settings reproduces the singlet correlations. Companion statements give the same conclusion over any shared probability space at every setting pair, and for GHZ.
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: no_compatible_global_chsh_assignment_realises_singlet
    external:
      - text: "Stanford Encyclopedia: the Kochen-Specker theorem"
        url: https://plato.stanford.edu/entries/kochen-specker/

  - slug: hidden-variables
    term: Hidden variables
    status: proved-in-corpus
    source: curated
    hook: >
      A theory can have a definite underlying state and still reproduce quantum mechanics, provided it gives up the right thing. The no-go theorems say what.
    layman: >
      If quantum mechanics is about our knowledge rather than the world, something must be there to be known. A hidden-variable theory supplies it: an underlying state, definite at all times, of which the quantum description is a summary. A series of famous theorems constrain such theories severely. They do not, contrary to a common reading, rule them out; they rule out the well-behaved ones, and the price of survival is precisely stated.
    in_csd: >
      The constraint surface is a hidden-variable theory in the technical sense, and the programme accepts the price openly. What Bell's argument forbids is a theory that is both local and non-contextual; this one is neither, and the corpus proves the obstructions itself rather than citing them. Two things follow that are easy to get wrong. First, the substrate is not a repair of quantum mechanics -- it reproduces the same predictions, and where it might one day differ is recorded as owed rather than claimed. Second, the state on the epistemic side is not the hidden variable; it is the summary. The hidden variable is the point of the constraint surface beneath it.
    mathematical: >
      No product partition of a shared hidden-state space reproduces the singlet correlations, at any setting pair, and likewise for GHZ. The obstruction is proved over an arbitrary measurable state space rather than exhibited on a chosen model.
    lean:
      module: CsdLean4/LF6/ForcedContextuality.lean
      theorem: no_product_partition_realises_singlet
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hidden-variable_theory

  - slug: measurement-problem
    term: Measurement problem
    status: proved-in-corpus
    source: curated
    hook: >
      Evolution is continuous and reversible; measurement is abrupt and not. The theory contains both and does not say where one stops.
    layman: >
      Left alone, a quantum system evolves smoothly and reversibly, and superpositions persist. Measured, it yields one definite result and the alternatives are gone. Textbook quantum mechanics supplies both rules and no account of which applies when. It is not a puzzle about interpretation only: the two rules are mathematically incompatible, so something in the picture has to give.
    in_csd: >
      The programme's answer is that nothing abrupt happens on the substrate. The underlying motion is deterministic and measure-preserving throughout; what changes at a measurement is which region of the epistemic space the trajectory is recorded against. Where this becomes sharp rather than a story is the trilemma: the corpus proves that no measure-preserving map implements exact collapse, that no continuous propagator correlates a pointer everywhere on a connected arena, and that buying accuracy costs improbability in the ready state, with the exchange rate stated. So the account does not dissolve the problem by assertion. It proves which of the desirable properties cannot be had together, and then says which one it gives up.
    mathematical: >
      Three impossibility results on the pointer arena: no exact collapse by a measure-preserving map, no everywhere-correlating continuous propagator, and a quantitative bound trading collapse accuracy against ready-state improbability. All CSD-free in statement.
    lean:
      module: CsdLean4/RecordLayer/MeasurementConstraints.lean
      theorem: no_exact_collapse
    external:
      - text: "Stanford Encyclopedia: measurement in quantum theory"
        url: https://plato.stanford.edu/entries/qt-issues/

  - slug: collapse
    term: Collapse
    status: proved-in-corpus
    source: curated
    hook: >
      The state does not jump here. Something is proved about why it cannot, rather than assumed about why it need not.
    layman: >
      The standard account says that on measurement the state discontinuously becomes the one matching the result. Whether that is a physical event or a bookkeeping update is the oldest dispute in the subject. If it is physical, it is unlike anything else in the theory: abrupt, irreversible and unexplained.
    in_csd: >
      There is no collapse on the substrate, and the corpus makes that a theorem rather than a preference: no measure-preserving map implements exact collapse, so a deterministic volume-preserving substrate could not contain one even if it wanted to. What replaces it is a record. The apparatus and system evolve together, the record selects which epistemic region the trajectory realises, and the update rule textbooks postulate separately is what the record layer does. The state that changes is the summary, not the world.
    mathematical: >
      No measure-preserving map on the arena implements exact collapse; the accuracy of any approximate collapse is bounded against the improbability of the ready state. The post-measurement update appears instead as the block projection realised on the pointer arena.
    lean:
      module: CsdLean4/RecordLayer/MeasurementConstraints.lean
      theorem: no_exact_collapse
    external:
      - text: "Stanford Encyclopedia: collapse theories"
        url: https://plato.stanford.edu/entries/qm-collapse/

  - slug: typicality
    term: Typicality
    status: proved-in-corpus
    source: curated
    hook: >
      Probability without randomness: the answer is fixed, and the question is what fraction of the possibilities give it.
    layman: >
      If the world is deterministic, where do the odds come from? The typicality answer is that they come from counting. Fix what you know about a system, look at the space of states consistent with it, and ask what fraction of that space leads to each outcome. Nothing is random; you are simply ignorant of which state you have, and the fractions are facts about the space rather than about chance.
    in_csd: >
      This is the engine the whole account runs on, and it is why the Born rule can be a theorem here rather than a postulate. The outcome weight is a ratio of volumes on the constraint surface, and the law of large numbers converts that ratio into observed frequencies over repeated preparations. Two points the programme is careful about. The measure doing the counting is not chosen but forced by symmetry, which is what answers the standard objection that typicality arguments presuppose their own measure. And frequencies are forced by the law of large numbers, not by an ergodic or single-flow argument -- that route is recorded as a proved dead end.
    mathematical: >
      For independent trials, the observed relative frequency of an outcome converges almost surely to its volume fraction. Combined with the volume-ratio identification of the Born weight, this delivers Born frequencies at general dimension.
    lean:
      module: CsdLean4/LF1/GeneralFrequency.lean
      theorem: freq_tendsto_of_iid
    external:
      - text: "Goldstein, typicality in statistical mechanics and quantum theory"
        url: https://arxiv.org/abs/1110.1349

  - slug: psi-epistemic
    term: Psi-epistemic
    status: definition
    source: curated
    hook: >
      The quantum state describes what is known, not what is there. Everything else in the programme follows from taking that literally.
    layman: >
      There are two ways to read the quantum state. Either it is a thing in the world, in which case its abrupt change on measurement is a physical event needing explanation; or it is a description of what an observer knows, in which case the change is just an update and needs no more explanation than revising a probability after looking. The second reading is the epistemic one. Its difficulty has always been saying what the state is knowledge *of*.
    in_csd: >
      The programme is epistemic about the state and answers the standing difficulty directly: the state is knowledge of which region of the constraint surface the microstate lies in. That gives the position a floor. The projective space of states, the outcome regions and the probabilities are all on the epistemic side; the substrate and the measure that weights it are ontic. Keeping the two levels apart is the discipline the whole account rests on, and the fibre analysis sharpened it -- the projective space is a lossy epistemic projection, with the record-forming content living above it.
    mathematical: >
      Not a theorem and not stated as one. It is the reading OF the theorems: the projective state space carries the epistemic outcome partition, while the typicality measure that weights those regions is defined on the substrate.
    external:
      - text: "Epistemic views of the quantum state"
        url: https://en.wikipedia.org/wiki/Epistemic_view_of_quantum_states

  - slug: determinism
    term: Determinism
    status: definition
    source: curated
    hook: >
      The substrate has no chance in it. The randomness is in which state you happen to have, not in what it does.
    layman: >
      A deterministic theory fixes the future from the present with no room left over. Quantum mechanics appears to violate this: identically prepared systems give different results. The deterministic response is that the preparations were not identical -- they agreed on everything recorded and differed in what was not -- and that the observed spread reflects that unrecorded variation rather than genuine chance.
    in_csd: >
      The substrate is deterministic and its motion preserves volume, so nothing probabilistic is built into the dynamics. Probability enters exactly once, as ignorance of which microstate a preparation produced, and the volume of the region of states compatible with what was fixed is what turns that ignorance into numbers. This is the same manoeuvre classical statistical mechanics makes, which is deliberate. What the programme owes, and records as owed rather than claimed, is that a deterministic substrate with memory would show departures from the independence assumed in the frequency argument -- which is one of the few places it could differ from quantum mechanics observably.
    mathematical: >
      Positional. The formal content is that the flow is measure-preserving and the outcome weights are volume ratios; determinism is the reading of that structure, not a separate statement.
    external:
      - text: "Stanford Encyclopedia: causal determinism"
        url: https://plato.stanford.edu/entries/determinism-causal/

  - slug: kochen-specker
    term: Kochen-Specker theorem
    status: standard-mathematics
    source: curated
    hook: >
      A finite set of questions with no consistent set of answers. Contextuality proved by counting, with no reference to distance or separation.
    layman: >
      Bell's argument needs two separated wings and a statistical comparison. Kochen and Specker showed something starker and purely local: in three dimensions or more there is a finite collection of measurement directions such that no assignment of answers is consistent with the algebraic relations among them. No experiment is needed to see the contradiction, and no appeal to separation.
    in_csd: >
      The programme is contextual, so this theorem is a constraint it satisfies rather than a threat -- and the corpus is careful about a related trap. Its own fibre analysis found that at three levels and above the contextual content cannot sit on the projective base and must live in the fibre above it, and that conclusion does NOT come from Kochen-Specker or Gleason: those constrain non-contextual assignments, and this account is contextual, so they do not apply. The obstruction is instead covariance together with non-negativity. Keeping the two arguments apart matters, because borrowing this theorem's authority for a result it does not support would be a subtle overclaim.
    mathematical: >
      For Hilbert spaces of dimension at least three there is no non-contextual assignment of definite values to all observables consistent with the functional relations among commuting sets. Finite explicit sets of vectors witness it.
    external:
      - text: "Stanford Encyclopedia: the Kochen-Specker theorem"
        url: https://plato.stanford.edu/entries/kochen-specker/

  - slug: copenhagen
    term: Copenhagen interpretation
    status: definition
    source: curated
    hook: >
      The oldest position, and the one that declines the question. Measurement is where the theory stops rather than something it explains.
    layman: >
      The traditional teaching account treats the measuring apparatus as classical and outside the quantum description, and the state's change on measurement as a primitive fact rather than a process. It is not so much an explanation of measurement as a decision not to require one. That has been enough to do a century of physics with, which is why it survived.
    in_csd: >
      The programme's disagreement is narrow and specific. It agrees the state is not a physical thing and it agrees the classical/quantum divide is where the interesting content is; it declines to leave the divide unanalysed. Measurement here is a physical interaction on the substrate producing a record, and the two rules the traditional account keeps apart are one process. This is an interpretive contrast rather than an empirical one -- no experiment distinguishes them -- and this entry states a position rather than reporting a theorem.
    mathematical: >
      No formal content. Included so a reader comparing accounts can place this one.
    external:
      - text: "Stanford Encyclopedia: the Copenhagen interpretation"
        url: https://plato.stanford.edu/entries/qm-copenhagen/

  - slug: many-worlds
    term: Many-Worlds interpretation
    status: definition
    source: curated
    hook: >
      Keep the smooth evolution and drop the single outcome. This programme does the opposite.
    layman: >
      If the smooth reversible evolution is the whole story and never gets interrupted, then after a measurement the apparatus and observer are themselves in a superposition of registering each result. The Everettian move is to accept that at face value: every outcome happens, in branches that no longer interfere. Nothing is added to the formalism, and the difficulty moves to explaining why the branches carry the weights they do.
    in_csd: >
      This account is single-trajectory, and that is settled rather than an open question. One microstate, one history, one outcome; the alternatives are regions of the epistemic space that the trajectory did not enter, not places where something else occurred. Because it retains a definite state throughout, the probability difficulty that Everettian accounts face -- why branch weights should be the observed ones -- takes a different form here, as a question about the measure on the substrate, which is answered by a uniqueness argument. This entry is positional; the single-trajectory commitment is recorded in the programme's non-goals.
    mathematical: >
      No formal content. The contrast is the single-trajectory commitment: outcome weights are volume ratios on one constraint surface, not weights across branches.
    external:
      - text: "Stanford Encyclopedia: Everett's relative-state formulation"
        url: https://plato.stanford.edu/entries/qm-everett/

  - slug: bohmian-mechanics
    term: Bohmian mechanics
    status: definition
    source: curated
    hook: >
      The nearest neighbour: deterministic, definite configurations, explicitly non-local. The differences are in what plays the role of the state.
    layman: >
      The pilot-wave account gives particles definite positions at all times and has them guided by a wave. It is deterministic, it reproduces quantum predictions exactly, and it purchases this with explicit non-locality: the guidance of one particle depends instantaneously on where the others are. It is the standing proof that a deterministic account of quantum mechanics is possible at all.
    in_csd: >
      This is the closest relative among established accounts, and the similarities are real: determinism, a definite underlying state, non-locality accepted rather than avoided, and probabilities from ignorance about that state. The differences are in ontology. There the wave is a physical guiding field and the configuration is the extra variable; here the underlying object is the constraint surface itself, and the quantum state is epistemic rather than a guiding thing. The equilibrium assumption that supplies Bohmian probabilities has its counterpart here in the typicality measure -- with the difference that the measure is forced by symmetry rather than assumed as a starting distribution, which is the standing objection Bohmian accounts have to answer.
    mathematical: >
      No formal content. The nearest formal point of contact is that both accounts derive probabilities from a measure over an underlying state space rather than postulating the Born rule.
    external:
      - text: "Stanford Encyclopedia: Bohmian mechanics"
        url: https://plato.stanford.edu/entries/qm-bohm/

  - slug: spontaneous-collapse
    term: Spontaneous collapse (GRW)
    status: definition
    source: curated
    hook: >
      The rival that changes the predictions, and can therefore be ruled out by experiment. This programme cannot.
    layman: >
      Rather than interpreting quantum mechanics, spontaneous-collapse theories modify it: the state undergoes rare random localisations, negligible for a single particle and overwhelming for anything macroscopic, so superpositions of large objects decay on their own. Because the modification has parameters, it makes predictions that differ from standard quantum mechanics, and experiments have been narrowing the allowed range for decades.
    in_csd: >
      The contrast is instructive and slightly uncomfortable. These theories are honest in a way this programme currently is not: they can be killed by an experiment. This account reproduces standard quantum mechanics exactly at leading order, so at present nothing distinguishes it empirically, and its own documentation records the candidate departures as owed by the papers rather than established. It also differs structurally -- there is no stochastic modification here, the substrate is deterministic and volume-preserving, and definite outcomes come from records rather than from a physical collapse process.
    mathematical: >
      No formal content. The structural contrast is that no stochastic term modifies the dynamics here; the corpus proves that exact collapse is unavailable to a measure-preserving substrate.
    external:
      - text: "Stanford Encyclopedia: collapse theories"
        url: https://plato.stanford.edu/entries/qm-collapse/

  - slug: qbism
    term: QBism
    status: definition
    source: curated
    hook: >
      Epistemic all the way down: the state is one agent's betting odds, and there is nothing underneath. This programme keeps a floor.
    layman: >
      QBism takes the epistemic reading to its conclusion. Quantum states are an agent's personal degrees of belief, probabilities are subjective, and a measurement outcome is an experience for the agent who made it. The measurement problem dissolves because there was never a physical state to collapse. The cost is that the theory declines to describe a world independent of agents.
    in_csd: >
      The agreement is genuine and the disagreement is sharp. Both hold the state is epistemic, so both refuse to treat its update as a physical event. But this account keeps an ontic floor: the constraint surface exists whether or not anyone is looking, probabilities are volume ratios on it rather than personal credences, and the measure is forced by symmetry rather than chosen by an agent. The slogan version -- epistemic states over an ontic substrate, rather than epistemic states over nothing -- is fair to both. This entry is positional and no theorem states it.
    mathematical: >
      No formal content. The formal contrast is that outcome weights here are ratios of an invariant measure on a state space, which is not an agent-relative quantity.
    external:
      - text: "Stanford Encyclopedia: QBism and quantum Bayesianism"
        url: https://plato.stanford.edu/entries/quantum-bayesian/
