  - slug: stinespring-dilation
    reviewed: 2026-09-14
    hook: >
      Every noisy quantum process is a reversible process on a larger system with part of
      that system ignored, and in CSD the larger system is the constraint surface itself,
      so every channel the programme uses is the environment's marginal of a volume-
      preserving flow.
    layman: >
      The basic evolution of quantum mechanics is reversible, so nothing is lost and
      running it backwards recovers the starting state exactly. Real processes aren't like
      that, as a qubit stored in a device gradually loses its coherence, a photon in a
      fibre is sometimes absorbed, and a measurement leaves the system changed in a way
      that can't be undone. The general description of such a process is a channel, a rule
      that turns states into states while respecting probabilities, and channels can lose
      information.

      Stinespring's theorem reconciles the two pictures. Any channel, however lossy, is a
      reversible evolution of the system together with an environment, followed by
      ignoring the environment, where ignoring means averaging over everything the
      environment could be doing, an operation called the partial trace. The information
      isn't destroyed, as it has moved into correlations with the environment, where a
      description of the system alone can't see it. A bit flip that happens with some
      probability, for instance, is a reversible interaction with a single environment
      qubit that records whether the flip occurred, seen from the side that doesn't read
      that record.
    in_csd: >
      The theorem is the hinge between the programme's ontic and operational layers. The
      constraint surface carries system and environment together, and its dynamics is a
      volume-preserving flow that lifts a reversible evolution of the joint state space.
      The corpus proves that when such a flow acts on a preparation whose environment
      starts in a ready state, the density operator of the flowed preparation, seen from
      the system alone, is a channel applied to the density operator of the original
      preparation, and it identifies which channel, the one Stinespring's construction
      assigns to the joint evolution and the ready state. So the channels of quantum
      information aren't introduced into the programme, as they're what its flows look
      like from inside. The measurement flow yields the de-isolation channel in this way,
      and the bit-flip errors of the three-qubit code arise from a flow on the register
      with a four-level environment. A mixed environment is covered as well, through the
      spectral decomposition of its density operator.
    mathematical: >
      Channel.ofIsometry builds the channel Tr_env(V rho V^H) from an isometry V into
      system times environment, and apply_eq_traceRight_stinespring together with
      stinespringIsom_isom shows every Kraus channel arises this way, with the Kraus
      operators as the environment blocks of V. stinespringChannel U hU e_0
      (LF2/FlowChannel.lean) is the channel of a joint unitary with a ready environment,
      and traceRight_barycenter_flow states that for a flow lifting U in the projector
      sense (IsUnitaryLift) and a preparation that is a product with the environment
      ready, almost everywhere in the representative, the reduced barycentre of the flowed
      preparation is that channel applied to the system's barycentre.
      isUnitaryLift_unitSection removes the section hypothesis for projective actions,
      stinespringChannelMixed handles a mixed environment, and channelEquiv
      (LF2/ChannelBridge.lean) transports the construction between the corpus's two
      channel structures.
    person: >
      W. Forrest Stinespring (1929-2012) taught at the University of Illinois at Chicago
      for most of his career. The dilation theorem is in a short 1955 paper in the
      Proceedings of the American Mathematical Society, written in the language of
      positive maps on operator algebras and generalising Naimark's dilation of a positive
      operator measure. Its reading as the statement that every quantum channel is a
      unitary on a larger space, with the environment traced away, came with Kraus's work
      on operator-sum representations in the 1970s and 1980s, long after the mathematics
      was settled.
    term: Stinespring dilation
    eponyms: [Stinespring]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Stinespring.lean
      theorem: apply_eq_traceRight_stinespring
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: TN4 covers the POVMs and reductions this dilation explains
    related: [quantum-channel, naimark-dilation, partial-trace, de-isolation, measurement-flow]

  - slug: klein-inequality
    reviewed: 2026-09-14
    image:
      file: img/klein-inequality.jpg
      alt: "Portrait photograph of Oskar Klein"
      caption: "Oskar Klein."
      credit: "Royal Norwegian Society of Sciences and Letters, CC BY-SA 4.0, via Wikimedia Commons"
      licence: "CC BY-SA 4.0"
      source: https://commons.wikimedia.org/wiki/File:OskarKlein.jpg
      article: https://en.wikipedia.org/wiki/Oskar_Klein
    hook: >
      One quantum state is never negatively distinguishable from another, as the relative
      entropy of a state with respect to a second is at least zero, and that single
      inequality drives the second law, subadditivity, concavity and the Holevo bound in
      the corpus.
    layman: >
      Relative entropy measures how surprised you should be, on average, if you believe a
      system is in one state when it's really in another. It compares the true state with
      the assumed one, and it's the quantum version of a quantity that appears throughout
      statistics and information theory. Klein's inequality says this surprise is never
      negative and is zero only when the two states coincide, so believing something false
      about a system can never make its behaviour look more predictable than the truth
      would.

      The statement sounds obvious and isn't. Quantum states are matrices, the logarithm
      of a matrix is defined through its eigenvalues, and two states generally have
      different eigenvectors, so the two logarithms don't simply line up. The proof
      expands one state in the eigenbasis of the other and uses the fact that the overlaps
      between the two sets of eigenvectors form a doubly stochastic pattern, one whose
      rows and columns each sum to one, which is enough to pull the ordinary convexity of
      the logarithm through the matrix algebra.
    in_csd: >
      The inequality is proved once in the corpus and spent many times. The thermodynamics
      track uses it for the H-theorem, the statement that coarse-graining a state onto a
      fixed basis can only raise its entropy, and that theorem is exactly what the de-
      isolation channel does to the measured system, so the second law on the constraint
      surface rests on it. Subadditivity of entropy, the Landauer bound that follows from
      subadditivity, the concavity of entropy under mixing and the Holevo bound on how
      much classical information a channel carries are all consequences, and in each case
      the inequality supplies the one step informal accounts tend to wave through.
    mathematical: >
      klein_inequality (Mathlib/QuantumInfo/Subadditivity.lean) says that for rho positive
      semidefinite of unit trace and sigma positive definite, relEntropy is non-negative.
      The proof is the doubly stochastic overlap expansion in the two eigenbases with the
      convexity of x log x. The consumers are vonNeumannEntropy_subadditive and
      landauer_bound, vonNeumannEntropy_le_pinching (Thermo/SecondLaw.lean), which is the
      H-theorem, the concavity theorem vonNeumannEntropy_mixture_ge, obtained from the
      positive-definite case by mixing with the maximally mixed state and closedness in
      the mixing parameter, and holevoChi_nonneg. The equality case, that zero forces the
      two states to coincide, isn't formalised.
    person: >
      Oskar Klein (1894-1977) was a Swedish physicist better known for the Kaluza-Klein
      fifth dimension, the Klein-Gordon equation and the Klein-Nishina formula. The
      inequality comes from a 1931 paper in the Zeitschrift fur Physik on the quantum-
      mechanical foundation of the second law of thermodynamics, written in Stockholm,
      where he had just taken the chair of theoretical physics. His aim was the H-theorem,
      to show that the entropy of a quantum system, once its fine-grained coherences are
      discarded, can only increase, so the inequality was the tool, and it outlived the
      argument it was built for.
    term: Klein's inequality
    eponyms: [Klein]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Subadditivity.lean
      theorem: klein_inequality
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: TN4 covers the mixed states this inequality compares
    related: [von-neumann-entropy, entropy-subadditivity, holevo-bound, landauer-principle, gibbs-state]

  - slug: knill-laflamme
    reviewed: 2026-09-29
    image:
      file: img/knill-laflamme.png
      alt: "Photograph of Raymond Laflamme seated, in front of a Canadian flag"
      caption: "Raymond Laflamme, one of the two names on the conditions."
      credit: "Public Policy Forum, CC BY 3.0, via Wikimedia Commons"
      licence: "CC BY 3.0"
      source: https://commons.wikimedia.org/wiki/File:Raymond_Laflamme.png
      article: https://en.wikipedia.org/wiki/Raymond_Laflamme
    hook: >
      Quantum error correction has an exact test, as a set of errors is correctable if and
      only if the code can't tell those errors apart, and that condition is a piece of
      algebra you can check before building any repair.
    layman: >
      A classical computer can check its memory by reading it, and quantum memory doesn't
      allow that, as reading a quantum state destroys the superposition you were trying to
      protect. So the first question about any quantum code isn't how to repair it but
      whether repair is possible at all, given the kinds of damage you expect.

      Knill and Laflamme answered that with a condition on the code alone. Write down the
      set of errors you want to survive, a bit flip on the third qubit, a phase flip on the
      fifth, and so on, then ask what happens to the overlaps between encoded states when
      an error hits. Overlap is the quantity that decides whether two states can be told
      apart by any measurement, so if every error changes all the overlaps in the same
      way, by a factor that depends on the pair of errors and not on which encoded state
      you started from, then no measurement on the damaged state reveals anything about the
      protected information.

      That's exactly the situation you want. The damage carries no trace of what was
      encoded, so the damage can be diagnosed and undone without disturbing the data, and
      one repair operation works for every error in the set at once. The condition is
      necessary as well as sufficient, so a code that fails it has no repair, however
      clever you are.
    in_csd: >
      The corpus proves the equivalence in both directions and then builds the repair, so
      the error-correction layer rests on a theorem rather than on a recipe. From the
      condition it constructs the recovery channel explicitly, by diagonalising the matrix
      of overlap factors, recombining the errors into a family whose images of the code
      space are mutually orthogonal, and reading the repair off those images. In the other
      direction, any channel that corrects the errors up to scalars is shown to force the
      condition, which is what makes it a test and not a sufficient condition dressed up as
      one.

      One corollary carries most of the weight downstream. The correction property is
      linear in each error slot and a channel is linear, so a recovery that handles a
      family handles every combination of that family as well. Correcting the four basic
      single-qubit errors therefore corrects every possible single-qubit fault, including
      ones no one listed, which is how the Steane code's recovery covers arbitrary damage
      on one of its seven qubits. The encoder form of the condition, stated about the map
      that builds encoded states rather than about the projector onto them, is what lets
      the same argument run over several blocks at once in the fault-tolerance rows.
    mathematical: >
      A code is an orthogonal projector P and a family of error operators E i is
      correctable exactly when P (E i)-dagger (E j) P = c i j times P for some matrix c
      (knillLaflamme_iff). Forward: c is Hermitian, so the spectral theorem gives c = U D
      U-dagger, and the canonical errors F k = sum over i of U i k times E i satisfy P (F
      k)-dagger (F l) P = d k times delta k l times P with d k nonnegative. The Kraus
      operators R k = d k^(-1/2) P (F k)-dagger have orthogonal ranges summing to a
      projector Q, and 1 - Q completes the channel, giving R (E i rho (E j)-dagger) = c j i
      times rho on code states. Converse: each R k E i P sends every code vector to a
      multiple of itself, via the sandwiched identity sum over k of |<u, R k E i v>|^2 = lam
      times |<u, v>|^2, hence is a scalar on the code, and trace preservation reassembles
      the condition.

      Degenerate codes are included, as c need not be invertible and errors with d k = 0
      act as zero on the code. The recovery is constructed, not shown unique.
      recovery_apply_lin_comb is the discretisation step: the correction property is
      bilinear in the two error slots, so a recovery for a family corrects the whole span of
      that family, up to the scalar the coefficients supply.
    person: >
      Emanuel Knill and Raymond Laflamme published the conditions in 1997 while at Los
      Alamos, and an equivalent criterion appeared at the same time in work of Bennett,
      DiVincenzo, Smolin and Wootters. Laflamme had been Stephen Hawking's doctoral student
      and is remembered for persuading Hawking to change his mind about the arrow of time,
      before he turned to quantum information and helped build the first small quantum
      processors.

      The conditions arrived a year after the first codes, which is the usual order of
      events, as Shor and Steane built working examples and the general criterion followed
      and explained why they worked.
    term: Knill-Laflamme conditions
    eponyms: [Laflamme]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/KnillLaflamme.lean
      theorem: knillLaflamme_iff
    site_link:
      url: https://www.constraintsurfacedynamics.com/roadmap
      text: The roadmap's third stage is the finite-dimensional reconstruction this error-correction layer is built on
    related: [steane-code, shor-code, stabiliser-code, quantum-channel, transversal-gate]
    external:
