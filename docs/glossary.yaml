entries:
  - slug: fubini-study-measure
    layman: >
      Every state a quantum system can be in is a point in a curved space, much as every
      place on Earth is a point on a globe. To ask how likely an outcome is, you need to
      know how large a region of that space is. But size needs a ruler, and a carelessly
      chosen ruler would quietly build the answer you wanted into the question: stretch one
      direction and outcomes in that direction become more probable, for no reason except
      the stretching. The Fubini-Study measure is the one ruler that treats every direction
      alike. It is not merely a sensible convention among several; it is the only measure
      the space admits that does not single out a direction, and that uniqueness is a
      theorem rather than a preference. So the sizes it reports are not anybody's choice,
      and a probability computed as a ratio of those sizes inherits the same standing.
    in_csd: >
      CSD does not assume the Born rule. It derives outcome probabilities as ratios of
      volumes, and a ratio of volumes means nothing until the ruler is fixed. This is the
      ruler, and the point is that it is forced rather than picked. The unitary group acts
      transitively on projective state space -- any state can be carried to any other by a
      symmetry -- and a space with a transitive symmetry admits exactly one invariant
      probability measure, by the same argument that makes Haar measure unique on a group.
      So the measure falls out of the state space and its symmetry instead of going in as an
      assumption, which is the whole reason Born weights arrive here as theorems rather than
      postulates. It also answers the objection every typicality argument attracts, that it
      presupposes the measure it uses to justify itself: here the measure is not presupposed
      but derived from the symmetry of the arena. Helland reaches the same uniqueness from
      group representation theory over accessible variables; CSD reaches it from geometry,
      and the agreement of two routes is worth more than either alone.
    mathematical: >
      CP^(N-1) is the compact homogeneous space U(N)/(U(1) x U(N-1)). The Fubini-Study
      measure is the unique U(N)-invariant Borel probability measure on it: equivalently the
      normalised Riemannian volume of the Fubini-Study metric, or the top exterior power of
      the associated Kahler form divided by n factorial. Uniqueness is Haar uniqueness
      transported downstairs: an invariant measure on a homogeneous space of a compact group
      is unique up to scale when the action is transitive, and normalisation fixes the
      scale. Proved here at general N with no imported axioms, by pushing the probability-
      normalised Haar measure on the unitary group forward along the orbit map. The
      construction takes a reference point, but that is bookkeeping rather than a degree of
      freedom: fubiniStudyMeasure_basepoint_independent shows any two choices give the same
      measure, since each is an invariant probability measure and uniqueness identifies
      them, so the canonical defaultFubiniStudyMeasure is THE Fubini-Study measure and not
      one of a family.
    person: >
      Guido Fubini (1879-1943) was born in Venice and studied at the Scuola Normale
      Superiore in Pisa, holding chairs at Catania, Genoa and from 1908 the Politecnico di
      Torino. He is best known for the theorem on exchanging the order of integration that
      carries his name, but worked extensively on projective differential geometry, which is
      where this metric arose. Stripped of his university post by the racial laws of fascist
      Italy in 1938, he emigrated to the United States in 1939 and taught at Princeton and
      at New York University until his death. Eduard Study (1862-1930) was born in Coburg,
      studied at Jena, Strasbourg, Leipzig and Munich, and after positions at Marburg and
      Gottingen held the chair at Bonn from 1904. He worked on invariant theory, the
      geometry of complex spaces and what would now be called kinematics, and was known for
      an abrasive independence that kept him at the edge of the Gottingen establishment. The
      two arrived at this metric independently around 1904-1905, which is why it carries
      both names.
    term: Fubini-Study measure
    eponyms: [Fubini, Study]
    status: proved-in-corpus
    hook: >
      There is exactly one way to measure the space of quantum states without
      secretly favouring a direction. The Born rule is what that measure says.
    lean:
      module: CsdLean4/Mathlib/LinearAlgebra/Projectivization/FubiniStudyUnique.lean
      theorem: fubiniStudyMeasure_unique
    papers:
      - doi: 10.5281/zenodo.19557174
        note: TN1, the Fubini-Study measure as an SU(N)-equivariant pushforward
      - doi: 10.5281/zenodo.16746829
        note: Paper B, the symmetry argument that fixes the measure
    external:
      - text: "Bengtsson and Zyczkowski, Geometry of Quantum States, 2nd ed., CUP 2020"
        url: https://www.cambridge.org/core/books/geometry-of-quantum-states/
    related: [duistermaat-heckman, liouville-measure, kahler-form, born-weight]

  - slug: born-weight
    layman: >
      Ask a quantum system a question and you get one answer, but ask many times and the
      answers come in stable proportions. Textbook quantum mechanics writes those
      proportions down as a law and leaves it there: the probability is the squared size of
      a coefficient, because that is what is observed. Here they are not a law but a
      consequence of size. The space of states divides into regions, one per outcome,
      according to which answer a state would give; an outcome's frequency is then the
      fraction of the space its region occupies. Nothing is put in by hand except the ruler
      used to measure the regions, and the ruler is itself forced by symmetry. The rule that
      looks arbitrary in the textbook -- why the square, and not some other power -- becomes
      a geometrical fact about how the space divides.
    in_csd: >
      This is the programme's central result and the reason the rest exists. The outcome
      regions carve the epistemic state space, the Fubini-Study measure supplies the only
      unbiased notion of their size, and the ratio of volumes comes out equal to the
      textbook weight. Three features matter for how much this is worth. It is derived at
      general dimension rather than checked on examples, so it is not a coincidence of the
      qubit case. It is Gleason-free: the usual route to the Born rule runs through
      Gleason's theorem or its effect-valued strengthening, and this one does not use
      either, so the two are independent confirmations rather than one argument in two
      costumes. And the measure it integrates against is forced rather than assumed, which
      is what keeps the derivation from being circular. What turns on it: if this failed,
      the programme would be a reinterpretation of quantum mechanics rather than a
      reconstruction of it, and the distinction between those two things is the whole claim.
    mathematical: >
      For a preparation vector psi on CP^(N-1), the Fubini-Study measure of the barycentric
      outcome region attached to basis vector e_k equals the Born weight given by the
      squared modulus of the inner product of e_k with psi. Proved coordinate-by-coordinate
      at general N, unconditionally, and without Gleason's theorem or its Busch
      strengthening. The companion apex statement covers the dropped vertex of the simplex,
      so the identity holds on all N coordinates of a generic preparation rather than on a
      chart that misses one. The route runs through the moment map: outcome regions pull
      back to regions of the probability simplex, where the Fubini-Study measure becomes
      flat, so the volume ratio reduces to an ordinary Lebesgue computation.
    person: >
      Max Born (1882-1970) was born in Breslau, then in Prussia and now Wroclaw, to an
      assimilated Jewish family; his father was an anatomist. He studied at Breslau,
      Heidelberg, Zurich and Gottingen, where Hilbert made him his assistant, and after
      Berlin and Frankfurt he returned in 1921 to the Gottingen chair he held until the
      dismissals. His institute in those years trained or hosted Heisenberg, Pauli, Jordan,
      Fermi, Oppenheimer, Delbruck and Teller. He gave the probability reading of the
      wavefunction in a 1926 paper on collisions, and famously in a footnote added at proof
      stage -- the body of the paper had the amplitude itself as the probability, and the
      correction to its squared modulus went in as an afterthought. Dismissed in 1933 under
      the Nazi civil-service laws, he went to Cambridge and then to the Tait Chair at
      Edinburgh, where he stayed until 1953 before returning to Bad Pyrmont in Germany. The
      Nobel Prize came in 1954, twenty-eight years after the work, and he regarded the delay
      as a slight. Olivia Newton-John was his granddaughter.
    term: Born rule
    eponyms: [Born]
    status: proved-in-corpus
    hook: >
      Quantum mechanics' probability rule is not assumed here. It is what you get
      by measuring the size of a region, once the ruler is fixed.
    lean:
      module: CsdLean4/LF4/MomentBornN.lean
      theorem: fs_born_volume_ratio_N
    related: [fubini-study-measure, duistermaat-heckman, gleason-theorem]

  - slug: duistermaat-heckman
    layman: >
      The space of quantum states is curved, and one might expect that measuring regions of
      it would be a delicate business requiring the full apparatus of Riemannian geometry.
      It is not. There is a natural way of recording only the outcome probabilities of a
      state, discarding the phases and everything else, and under that recording the curved
      space flattens completely. Sizes become ordinary volumes of the kind you would measure
      in a triangle or a tetrahedron. This is a genuinely surprising fact rather than a
      convenience: the curvature does not merely become manageable, it disappears exactly.
      That is why the probability calculation stays tractable no matter how many outcomes
      there are, where a naive approach would grow forbidding with dimension.
    in_csd: >
      This is the engine that makes Born weights computable rather than merely defined. The
      moment map sends a state to its tuple of outcome probabilities, and the pushforward of
      the Fubini-Study measure along it is flat -- the uniform distribution on the
      probability simplex. So a volume ratio in a curved high-dimensional space becomes a
      Lebesgue volume of a region in a simplex, which is what turns the Born statement from
      an existence claim into a finite computation at general N. Without it the general-N
      result would either be unreachable or would have to be assembled case by case, and the
      programme would be in the position of checking its central claim on examples. The
      formula is also the point where a piece of symplectic geometry that was developed for
      entirely unrelated reasons turns out to be exactly what a foundations question needs.
    mathematical: >
      For a measurable region R of the open free moment simplex, the Fubini-Study measure of
      its preimage under the normalised moment map equals M factorial times the Lebesgue
      volume of R. Equivalently, the pushforward of the Fubini-Study measure along the
      moment map is the flat Dirichlet distribution on the simplex, all of whose parameters
      are one. This is the exact-stationary-phase phenomenon in its measure-theoretic form:
      the Duistermaat-Heckman theorem says that for a Hamiltonian torus action the
      pushforward of Liouville measure is piecewise polynomial, and in this case that
      polynomial is constant. Unconditional, and the genuine general-N content on this space
      rather than a specialisation to small dimension.
    person: >
      Hans Duistermaat (1942-2010) was born in Den Helder in the Netherlands and took his
      doctorate at Utrecht in 1968, holding a chair at Nijmegen before returning to Utrecht
      in 1975, where he remained for the rest of his career and became the leading Dutch
      geometer of his generation. Gerrit Heckman, also Dutch, was his student at Leiden and
      Utrecht and later held a chair at Nijmegen, working on hypergeometric functions
      associated with root systems. They proved the exact-stationary-phase formula in a 1982
      paper in Inventiones, with an addendum the following year correcting the treatment of
      degenerate cases. Its striking feature is that an approximation normally valid only to
      leading order turns out to be exact here, and the reason is symmetry: the higher-order
      corrections cancel because a torus acts. Atiyah and Bott soon recast the result in
      terms of equivariant cohomology, which is the form most geometers now know it in.
      Duistermaat died suddenly of a lymphoma at sixty-seven, while still actively
      supervising.
    term: Duistermaat-Heckman formula
    eponyms: [Duistermaat, Heckman]
    status: proved-in-corpus
    hook: >
      Project the space of quantum states down onto its outcome probabilities and the
      curvature disappears: what lands is flat.
    lean:
      module: CsdLean4/LF4/MomentBornN.lean
      theorem: fs_volume_eq_dirichlet
    related: [fubini-study-measure, born-weight]

  - slug: gleason-theorem
    layman: >
      There is a celebrated argument that any consistent way of assigning probabilities to
      quantum questions must be the standard one. The hypothesis is remarkably weak --
      assign a number to each yes-or-no question, require only that the numbers add up
      correctly across any set of mutually exclusive alternatives -- and the conclusion is
      that the assignment must have the textbook form. It is powerful and its proof is hard,
      so formalisation projects usually assume it and move on. Assuming it is not free: it
      means the probability rule was put in rather than derived, and any later claim to have
      explained where probabilities come from is compromised by the assumption made at the
      start. Here the effect-valued version was assumed at first, then proved outright, so
      nothing of the sort is borrowed any more.
    in_csd: >
      Two things turn on this, and they pull in different directions, which is why both are
      worth stating. The first is honesty of the axiom ledger: with this discharged the
      corpus depends on no imported mathematical result and no postulate beyond the
      foundations of its proof assistant, so the phrase axiom-free means what it says rather
      than meaning modulo one large borrowed theorem. The second is independence: the
      programme's own Born derivation goes through volume ratios and does not use this
      theorem anywhere, so the two routes are genuinely separate confirmations of the same
      rule rather than one argument wearing two hats. That independence would be worth
      little if the imported version were still an assumption, which is the connection
      between the two points. A published abstract once described this as an external input;
      that was true when written and false by the time it was read, which is the reason this
      glossary is guarded by a script rather than by good intentions.
    mathematical: >
      Every operational package on a finite-dimensional space admits an effect-Gleason
      representation: the probability assignment on effects is given by a density operator
      through the trace pairing. This is the Busch effect-valued form, which unlike the
      original projection-valued Gleason theorem holds in dimension two as well -- the qubit
      is the notorious exception to the original, because its projections are too sparse to
      constrain a frame function, while its effects are not. Proved in-corpus on 2026-07-21,
      foundational-triple only, discharging what had until then been the corpus's single
      imported axiom.
    person: >
      Andrew Gleason (1921-2008) was born in Fresno, California and read mathematics at
      Yale, leaving without a doctorate to work as a Navy cryptanalyst on Japanese and later
      Soviet ciphers -- work he returned to periodically for the rest of his life. He spent
      his career at Harvard, appointed to the Society of Fellows in 1946 and to a chair he
      held until retirement, and never took a PhD, which remained a Harvard curiosity. He
      proved the probability theorem in 1957 and regarded it as a minor piece of work, being
      more attached to his contribution to Hilbert's fifth problem. Paul Busch (1955-2018)
      was born in Germany, took his doctorate at Cologne, and after positions in Cologne and
      Hull held a chair at the University of York from 2005. He worked throughout on the
      mathematical structure of quantum measurement, and his 2003 extension to effects is
      the form that survives in dimension two and the form proved here.
    term: Gleason and Busch theorems
    eponyms: [Gleason, Busch]
    status: proved-in-corpus
    hook: >
      The standard route to the Born rule was carried here as a borrowed assumption
      for months. It is now proved, and the corpus imports no axioms at all.
    lean:
      module: CsdLean4/LF2/EffectGleason.lean
      theorem: effect_gleason_representation
    papers:
      - doi: 10.5281/zenodo.20100580
        note: LF2, the measure bridge and Born-weight wrapper
    related: [born-weight, fubini-study-measure]

  - slug: wigner-rigidity
    layman: >
      Quantum states have a notion of how much any two of them agree, a number between zero
      and one that experiment can get at directly as the probability of one being found when
      the other was prepared. Now suppose you rearrange the space of states in any way at
      all, subject to one condition: the agreement between any two states is unchanged by
      the rearrangement. That sounds like weak information -- no continuity is demanded, no
      linearity, not even that the map be reversible -- and yet it pins you down completely.
      The only rearrangements satisfying it are the rigid motions physics already knows
      about, the unitary ones and their mirror images. There is no room to be creative: the
      structure leaves exactly two families and nothing else.
    in_csd: >
      This is the single strongest result in the corpus by logical type: an unconditional
      necessity, not a consistency check and not conditional on a posited symmetry. The
      distinction matters more here than it might elsewhere, because the corpus's own
      necessity audit found that almost everything else it calls forced rests on assuming a
      symmetry group, usually the unitary group, and then deriving consequences. This one
      assumes only that overlaps are preserved and derives the group. That makes it what
      licenses treating unitary evolution as compelled rather than chosen, which is half of
      the Schrodinger pillar. It is also the natural anchor for the record layer, where the
      quantity preserved is a record statistic rather than an abstract overlap, and where
      the same rigidity converts an operational invariance into the group.
    mathematical: >
      Every transition-probability-preserving self-map of CP^(N-1) is induced by a unitary
      or by an antiunitary map. Linearity is an output of the construction and is never
      assumed; bijectivity likewise is derived rather than hypothesised; the antiunitary
      branch is genuinely present rather than an artefact of the proof, and the global
      unitary-or-antiunitary alternative is forced by overlap preservation alone.
      Foundational-triple only. The antiunitary branch is not a technicality: it is what
      accommodates time reversal, which is the one physical symmetry that cannot be unitary.
    person: >
      Eugene Wigner (1902-1995) was born in Budapest to a Jewish family that converted to
      Lutheranism in 1919, and trained as a chemical engineer at the Technische Hochschule
      in Berlin before turning to physics -- a training he credited for his instinct about
      which problems mattered. He worked at Gottingen and Berlin, left Europe as the Nazis
      rose, and settled at Princeton in 1930, where he spent the rest of his career apart
      from wartime work on the Manhattan Project at Chicago and Oak Ridge. He shared the
      1963 Nobel Prize for symmetry principles in physics. The theorem on symmetries of
      quantum states dates from his 1931 book on group theory and atomic spectra; the
      antiunitary alternative it uncovers is what later accounted for time reversal, and
      Wigner himself supplied that application.
    term: Wigner rigidity
    eponyms: [Wigner]
    status: proved-in-corpus
    hook: >
      Preserve the overlaps between quantum states and you have no freedom left: you
      are a symmetry, whether you meant to be one or not.
    lean:
      module: CsdLean4/Mathlib/LinearAlgebra/Projectivization/WignerRigidity.lean
      theorem: wigner_rigidity
    related: [fubini-study-measure, stone-theorem]

  - slug: stone-theorem
    layman: >
      A system evolving in time is described by a family of transformations, one for each
      moment, composing the way durations add. It is tempting to assume this family is
      smooth, so that one can differentiate it and speak of a rate of change, and physics
      texts generally do assume it without comment. That assumption is stronger than it
      looks and it is unnecessary. Merely requiring that the evolution not jump -- that
      states at nearby times be near each other -- forces smoothness, and with it the
      existence of the object whose rate of change the evolution is. Physics calls that
      object the Hamiltonian. So the generator of the dynamics is not an extra ingredient to
      be posited; it is extracted from continuity alone.
    in_csd: >
      The programme needs the generator of evolution to be earned rather than posited,
      because a posited generator would smuggle in exactly the dynamics the reconstruction
      is trying to derive. This supplies that at finite dimension: from continuity alone it
      produces the skew-Hermitian generator, so the Schrodinger form of the dynamics is an
      output of the argument rather than an input to it. Combined with Wigner rigidity the
      chain is complete -- rigidity says a transition-preserving flow must act by unitaries
      at each instant, and this says a continuous one-parameter family of unitaries has a
      Hamiltonian. Together they are the corpus's two unconditional necessities, and they
      are what make the second pillar a derivation rather than a restatement.
    mathematical: >
      A strongly continuous one-parameter group of unitary matrices is the exponential of t
      times a skew-Hermitian generator. The hypothesis is continuity only: the C-one
      assumption of the earlier packaged version is derived rather than assumed, which is
      the strengthening that matters, since assuming differentiability is close to assuming
      the generator exists. Worth recording that the proof assistant's library carries no
      Stone theorem at this pin -- the names there beginning with Stone are Stone-
      Weierstrass and Stone duality -- so the finite-dimensional case is supplied here
      rather than imported.
    person: >
      Marshall Stone (1903-1989) was born in New York, the son of a Chief Justice of the
      United States Supreme Court, and took his doctorate at Harvard under George Birkhoff.
      He taught at Columbia, Yale and Harvard before moving in 1946 to the University of
      Chicago, where as department chairman he rebuilt a distinguished but ageing department
      into arguably the strongest in the world, recruiting Weil, Chern, Zygmund and Mac Lane
      in a few years -- an episode still referred to as the Stone Age. He proved the theorem
      on one-parameter unitary groups in 1932, connecting continuous symmetry to its
      infinitesimal generator, and is equally remembered for the Stone-Weierstrass
      approximation theorem and for Stone duality between Boolean algebras and topological
      spaces.
    term: Stone's theorem
    eponyms: [Stone]
    status: proved-in-corpus
    hook: >
      Continuity is enough. Ask only that time evolution not jump, and differentiability
      and a Hamiltonian follow.
    lean:
      module: CsdLean4/Mathlib/Analysis/Matrix/StoneC1.lean
      theorem: Matrix.StoneC1.stone_continuous
    related: [wigner-rigidity]

  - slug: bell-chsh
    layman: >
      Take two particles prepared together and then separated, and measure each with a
      choice of settings. Common sense suggests every possible measurement already has an
      answer waiting, fixed when the pair was made, and that measuring merely reveals it.
      Bell's insight was that this suggestion is not a matter of taste: it implies a
      numerical limit on how strongly the two sets of results can be correlated, and quantum
      mechanics predicts correlations beyond that limit. What is proved here is the sharp
      form of the impossibility, on a single shared space of hidden states: no way of
      writing down answers for all four measurement settings at once matches the quantum
      predictions. The experiment has since been done to exhaustion, closing each loophole
      in turn, and the correlations are there.
    in_csd: >
      The programme is explicitly contextual and non-local at the level of its substrate, so
      it must show its own model cannot be quietly rewritten as the naive alternative --
      otherwise it would be claiming a virtue it had not earned. This is that demonstration,
      and it comes with a positive companion: an explicit contextual model that does
      reproduce the singlet correlations. Existence and obstruction in one place is what
      makes the claim two-sided rather than a bare no-go, and it is why the pair CL-031 and
      CL-052 are cited together. Getting the statement expressible at all required a
      modelling change worth recording: while each measurement setting had its own state
      space there was nothing to compare against a global assignment, so the Bell question
      could not even be posed, and the missing theorem went unnoticed for a long time behind
      a type distinction that looked like content and was not.
    mathematical: >
      Over a single shared measurable state space, no jointly-defined assignment of outcomes
      to the four CHSH settings reproduces the singlet correlations. Companion results give
      the same conclusion over any shared probability space at every setting pair, and the
      GHZ analogue for three parties. The shared-space formulation is the load-bearing one:
      it is the shape the contextuality claim actually posits, and it became statable only
      once the per-context domains were replaced by one domain -- while each setting carried
      its own state space there was nothing to compare a global assignment against, so the
      question could not be posed. The corpus pairs this obstruction with an explicit
      contextual model reproducing the same correlations, so existence and impossibility are
      established together rather than the negative half standing alone.
    person: >
      John Stewart Bell (1928-1990) was born in Belfast to a working-class Anglican family
      and left school at sixteen, working as a laboratory technician at Queen's University
      Belfast before the staff there encouraged him into a degree. He took his doctorate at
      Birmingham and spent his career at CERN in Geneva working on accelerator design and
      quantum field theory, treating foundations as what he called a hobby pursued on
      sabbatical. The 1964 paper that made his name was written while visiting Stanford and
      SLAC, and appeared in an obscure journal that paid no fees; it showed the question of
      hidden variables was experimentally decidable rather than philosophical. Clauser,
      Horne, Shimony and Holt gave the testable inequality in 1969. Bell died of a stroke in
      1990, the year he had been nominated for the Nobel Prize, and long before the 2022
      award to the experimentalists who confirmed him.
    term: Bell and CHSH
    eponyms: [Bell]
    status: proved-in-corpus
    hook: >
      No assignment of definite outcomes to all four measurement settings at once can
      reproduce what a singlet does. The obstruction is a theorem here, not a slogan.
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: no_compatible_global_chsh_assignment_realises_singlet
    papers:
      - doi: 10.5281/zenodo.20354293
        note: LF3, the machine-verified singlet kernel and empirical chain
    related: [ghz-state, tsirelson-bound]

  - slug: ghz-state
    layman: >
      Bell's argument needs many repetitions, because the disagreement with common sense
      shows up only in the proportions: no single run is impossible on a classical account,
      merely improbable in aggregate. With three particles the disagreement becomes sharper
      and changes character. There is a set of measurements whose outcomes any common-sense
      account must predict one way, and quantum mechanics predicts the opposite every single
      time. A single run suffices in principle, because the prediction is certainty against
      certainty rather than a difference of averages. The conflict is arithmetic rather than
      statistical, which makes it both easier to explain and harder to explain away.
    in_csd: >
      The corpus carries the three-party obstruction alongside the two-party one so that the
      contextuality claim does not rest on a single example or, more importantly, on a
      single logical shape. The Bell case is a statistical impossibility and the GHZ case an
      all-or-nothing algebraic one, and a substrate account has to survive both, since an
      account could conceivably reproduce statistical violations by some averaging mechanism
      while failing to reproduce a deterministic contradiction. Proving it over an arbitrary
      measurable state space rather than exhibiting it on a chosen model is what makes it a
      constraint on any hidden-variable theory of the relevant kind rather than a fact about
      one construction.
    mathematical: >
      No product partition of a shared hidden-state space reproduces the GHZ correlations.
      Proved as a theorem quantifying over an arbitrary measurable state space rather than
      exhibited on a chosen model, which is what makes it a genuine no-go rather than a
      failed construction. The algebraic character of the contradiction is what
      distinguishes it from the inequality-based two-party case: the product of the four
      predicted outcome signs is forced to be plus one by multiplying the individual
      predictions and minus one by the quantum state, so the contradiction is a matter of
      arithmetic rather than of exceeding a bound, and one run suffices in principle rather
      than an ensemble.
    person: >
      Daniel Greenberger, American, spent his career at the City College of New York;
      Michael Horne (1943-2019) taught at Stonehill College in Massachusetts and had been a
      co-author of the CHSH inequality as a graduate student under Shimony at Boston
      University; Anton Zeilinger, Austrian, worked at Vienna, Innsbruck and later the
      Austrian Academy of Sciences. The three introduced the argument in 1989 at a
      conference in Erice, showing the conflict with local realism could be made all-or-
      nothing rather than statistical. Zeilinger shared the 2022 Nobel Prize with Alain
      Aspect and John Clauser for experimental work on entanglement; Horne had died three
      years earlier.
    term: GHZ state
    eponyms: [GHZ]
    status: proved-in-corpus
    hook: >
      Three particles can contradict local realism with certainty, in a single run.
      No statistics, no inequality, no margin.
    lean:
      module: CsdLean4/LF6/GHZContextuality.lean
      theorem: no_product_partition_realises_ghz
    related: [bell-chsh, tsirelson-bound]

  - slug: tsirelson-bound
    layman: >
      There is a standard score summarising how correlated two separated measurements are.
      Any common-sense account keeps that score at or below two, which is the content of
      Bell's argument. Quantum mechanics exceeds it, which is why the argument was worth
      making. But quantum mechanics does not run away with it: the score stops at roughly
      2.83, while nothing about signalling or logic would forbid going all the way to four.
      Hypothetical theories that reach the higher value have been constructed and they are
      perfectly consistent, and they do not permit faster-than-light messaging either. So
      the ceiling is not explained by relativity, and why it sits exactly where it does has
      become a research programme in its own right.
    in_csd: >
      A reconstruction has to reproduce not only that the classical bound is violated but by
      exactly how much, since the gap between the quantum ceiling and the logical one is a
      real feature of the world to be explained rather than a coincidence to be inherited.
      If an account reproduced Bell violation but predicted the wrong maximum, it would be a
      different physical theory that happened to agree qualitatively. The bound is proved
      here universally -- every unit bipartite state, all detector settings -- rather than
      for the singlet at optimal angles, and its saturation is proved separately, so the
      ceiling and the fact that it is attained are distinct statements rather than one
      observation.
    mathematical: >
      For every unit bipartite state and all detector settings, the CHSH combination of spin
      correlations satisfies an absolute value at most two times the square root of two.
      Delivered in the Khalfin-Tsirelson algebraic form: a purely operator-theoretic
      inequality about products of anticommuting involutions, from which the state-dependent
      version follows by taking expectations. That ordering is the load-bearing part,
      because the algebraic form makes no reference to any particular state and so bounds
      the entire theory rather than a family of examples. The corpus proves saturation
      separately, exhibiting settings at which the singlet attains the bound exactly, so the
      ceiling and its attainment are distinct statements and neither is inferred from the
      other.
    person: >
      Boris Tsirelson (1950-2020) was born in Leningrad and studied at Leningrad State
      University under Ibragimov, working primarily in probability theory -- Brownian
      motion, noise, and what he called black noise -- with quantum correlations a
      comparatively small part of his output. He emigrated to Israel in 1991 and held a
      chair at Tel Aviv University until his retirement. The bound dates from a 1980 paper
      in Letters in Mathematical Physics, published while he was still in the Soviet Union
      and largely unnoticed in the West for years. He was also a prolific and unusually
      careful contributor to Wikipedia's mathematics articles.
    term: Tsirelson bound
    eponyms: [Tsirelson]
    status: proved-in-corpus
    hook: >
      Quantum mechanics breaks the classical limit on correlations, but not by as much
      as it could. Something stops it well short of the logical maximum.
    lean:
      module: CsdLean4/SigmaLayer/BellGenerality.lean
      theorem: qm_chsh_le_tsirelson
    related: [bell-chsh, ghz-state]

  - slug: landauer-principle
    layman: >
      Erasing information is not free. Resetting a memory to a definite state means reducing
      the number of configurations it could be in, and that reduction has to be paid for by
      dumping heat into the surroundings. The exchange rate is fixed by the temperature of
      those surroundings and by nothing else -- not by the technology, not by how cleverly
      the erasure is engineered. This is the point at which information stops being an
      abstraction and acquires a physical cost, and it is the resolution of Maxwell's demon:
      the demon can sort molecules, but it must eventually forget what it learned, and the
      forgetting costs precisely what the sorting gained.
    in_csd: >
      Thermodynamics is not bolted onto this programme. The substrate is measure-preserving
      underneath, so it is entropy-conserving at the fine grain, and irreversibility appears
      only when a record is coarse-grained -- which is the Boltzmann picture, reversible
      microdynamics with irreversibility from the coarse-graining rather than from the
      equations. That makes an erasure bound a natural consequence rather than an import,
      and it is the tightest link the corpus has between the record layer and physical cost.
      It is also the fourth tranche of a thermodynamics track whose earlier results derive
      temperature and free energy rather than assuming them, so the bound is stated in terms
      the same track has already earned.
    mathematical: >
      The entropy removed from a system by a process is bounded by beta times the heat
      delivered to the bath. The proof route: entropy conservation under unitary evolution
      on an initially product state, together with subadditivity of the von Neumann entropy,
      bounds the system entropy drop by the bath entropy rise; the bath Clausius inequality
      then converts that into a bound on heat. Stated in the Reeb-Wolf form, which makes the
      bath's initial Gibbs state and the finiteness assumptions explicit rather than leaving
      them implicit in a limiting argument -- a distinction that matters, since several
      informal derivations of the principle are known to smuggle in assumptions at exactly
      that point.
    person: >
      Rolf Landauer (1927-1999) was born in Stuttgart to a Jewish family and came to New
      York as a child in 1938 after his father's death, taking his degrees at Harvard and
      joining IBM in 1952, where he spent his career at the Watson Research Center in
      Yorktown Heights. His slogan, that information is physical, was a deliberate
      provocation against treating computation as an abstract mathematical activity. The
      principle dates from a 1961 paper in the IBM Journal of Research and Development; its
      consequence that reversible computation could in principle cost nothing was drawn out
      by his colleague Charles Bennett a decade later. The bound was confirmed
      experimentally only in 2012, thirteen years after Landauer's death.
    term: Landauer's principle
    eponyms: [Landauer]
    status: proved-in-corpus
    hook: >
      Forgetting costs heat. The price is fixed by temperature alone, and it is a
      theorem here rather than a thermodynamic slogan.
    lean:
      module: CsdLean4/Thermo/Landauer.lean
      theorem: landauer_bound
    related: [von-neumann-entropy]

  - slug: von-neumann-entropy
    layman: >
      Entropy counts how much you do not know. For ordinary objects, knowing the whole means
      knowing the parts: if you have complete information about a machine you have complete
      information about each component. Quantum systems break that. A pair can be in a
      completely definite joint state -- nothing further to learn about the pair -- while
      each member considered alone is as undetermined as it could possibly be. The missing
      information is not located in either part; it is in the relationship between them.
      Entropy is the quantity that makes this precise, and the inequalities it satisfies are
      the arithmetic of that fact, which is why they are the working tools of quantum
      information rather than decorative results.
    in_csd: >
      The corpus needs entropy for two distinct jobs. It measures the irreversibility
      produced when a pure state is coarse-grained into a record, which is how a second law
      enters a substrate that is reversible underneath -- the fine-grained motion conserves
      entropy, the coarse-graining increases it, and the gap between them is where
      thermodynamic time direction comes from. Separately, its inequalities are the working
      machinery of the thermodynamics track: subadditivity is the step that converts an
      entropy statement into the Landauer heat bound, and without it that derivation does
      not close. The scope caveat is worth reading: the subadditivity proved here is at
      positive-definite marginal scope, which for pure states means full Schmidt rank.
    mathematical: >
      For a bipartite density operator the von Neumann entropy is subadditive: the entropy
      of the whole is at most the sum of the entropies of its marginals, with equality
      exactly for product states. Stated here at positive-definite marginal scope, which for
      a pure global state means full Schmidt rank. The strong subadditivity strengthening --
      the three-party inequality of Lieb and Ruskai, which is both deeper and far harder,
      and from which most of quantum information theory's structural results follow -- is
      carried separately in the corpus and derived from an explicit data-processing premise
      rather than proved from scratch, a scope decision recorded in the ledger rather than
      left to be discovered.
    person: >
      John von Neumann (1903-1957) was born Neumann Janos in Budapest to a banking family
      ennobled in 1913, and was a prodigy who took a chemical engineering degree at Zurich
      and a mathematics doctorate at Budapest in the same period. He taught at Berlin and
      Hamburg before moving to Princeton in 1930 and joining the Institute for Advanced
      Study at its founding in 1933. He gave quantum mechanics its Hilbert-space formulation
      in a 1932 book and introduced this entropy there, more than fifteen years before
      Shannon's classical version. His work on game theory, the architecture of stored-
      program computers, and the Manhattan Project would each have been a career; he died of
      cancer at fifty-three, probably from radiation exposure at weapons tests.
    term: von Neumann entropy
    eponyms: [Neumann]
    status: proved-in-corpus
    hook: >
      Two systems together can be perfectly known while each of them separately is
      not. Entropy is where entanglement stops being a metaphor.
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Subadditivity.lean
      theorem: vonNeumannEntropy_subadditive
    related: [landauer-principle]

  - slug: liouville-measure
    layman: >
      An underlying deterministic world needs a way of saying how much of it is of one kind
      rather than another, and that means a notion of volume the motion does not distort as
      it flows. Classical mechanics has one and names it after Liouville: as a region of
      possible states is carried along by the dynamics it may be stretched and folded beyond
      recognition, but its total volume never changes. The worry for any theory built this
      way is that such a volume might be chosen to order, tuned to deliver whatever
      probabilities were wanted, in which case the derivation of those probabilities would
      be circular. On the space this programme uses, it cannot be so chosen: the space and
      its symmetry leave exactly one option.
    in_csd: >
      This is the hinge between the ontic story and the probability story, and it is where
      the two levels the programme keeps apart are joined. The substrate carries a finite
      Liouville measure and a motion preserving it; the epistemic side needs the Fubini-
      Study measure to turn regions into Born weights. On the identity-projection sector
      those two are proved to be the same object, so the ruler used for probability is the
      substrate's own volume rather than a second and conveniently chosen assumption. That
      identification is what makes the typicality argument non-circular, and it is the
      specific reply to the standard objection -- raised against every typicality account
      since Boltzmann -- that such arguments smuggle in the measure they claim to justify.
    mathematical: >
      For the unitary-flow sector the Liouville measure is the Fubini-Study measure, and it
      is the forced Kahler volume: the sector's typicality measure is determined by the
      state space and its unitary symmetry rather than posited. Scope to disclose, and it is
      load-bearing: measure-preservation of the flow is carried as a structure field for
      physical admissibility -- an ontic postulate, listed as such in the axiom ledger --
      and is not derived. What is proved is the conditional, that IF the sector is this one
      THEN the volume is forced, which is a statement about the sector rather than a
      derivation of it.
    person: >
      Joseph Liouville (1809-1882) was born at Saint-Omer in northern France and educated at
      the Ecole Polytechnique in Paris, teaching there and at the College de France and the
      Faculte des Sciences. He proved in 1838 that phase-space volume is conserved by
      Hamiltonian motion, a result now inseparable from statistical mechanics though he
      arrived at it through celestial mechanics. He founded the Journal de Mathematiques
      Pures et Appliquees, still running, and was the first to exhibit explicit
      transcendental numbers in 1844, three decades before Hermite and Lindemann settled e
      and pi. He also rescued Evariste Galois's papers from obscurity, publishing them in
      1846, fourteen years after Galois was killed in a duel at twenty.
    term: Liouville measure
    eponyms: [Liouville]
    status: proved-in-corpus
    hook: >
      The substrate's own notion of volume is not chosen. On the sector the programme
      works with, it is forced to be the same measure the Born rule uses.
    lean:
      module: CsdLean4/LF4/KahlerVolumeForced.lean
      theorem: unitaryFlowSetup_liouville_isForcedKahlerVolume
    related: [fubini-study-measure, kahler-form, born-weight]

  - slug: kahler-form
    layman: >
      The space of quantum states carries three structures that could in principle have been
      independent of one another: a way of measuring distance between states, a way of
      measuring area spanned by two directions, and a quarter-turn operation inherited from
      multiplication by the imaginary unit. In fact they lock together, each recoverable
      from the other two, and a space where they lock together in this way is called Kahler.
      The consequence that matters here is that such a space has a volume nothing external
      has to supply -- the area form, raised to the top power, is the volume. So the ruler
      used throughout this programme is not an extra ingredient chosen by hand but something
      the geometry already contains.
    in_csd: >
      This underwrites the claim that the typicality measure is geometric rather than
      chosen, which is the difference between a derivation of the Born rule and an elaborate
      restatement of it. What is proved is the pointwise compatibility on the tangent model:
      the quarter-turn squares to minus one, the area form is the metric composed with it
      and the metric is the area form composed with it, the form is invariant when the turn
      is applied to both slots, and pairing a vector with its own turn returns its squared
      length. Flat closedness is likewise proved on the tangent model. The honest limitation
      is in the next register and it is not a technicality.
    mathematical: >
      With g the real part of the inner product, omega the imaginary part, and J
      multiplication by i, the Fubini-Study Kahler compatibility holds pointwise: J squared
      is minus one, omega equals g composed with J, g equals omega composed with J, omega is
      of type (1,1), and omega of u with Ju is the squared norm of u. Proved axiom-free.
      Scope to disclose, and it is load-bearing: the MANIFOLD residual is NOT formalised.
      Closedness of the form and the top-power identity, that omega to the (N-1) over (N-1)
      factorial equals the Fubini-Study measure ON the projective space itself, await a
      manifold differential-form API the proof assistant does not yet carry. The corpus's
      own permitted-claims list accordingly forbids describing Kahler differential geometry
      as load-bearing here; the pointwise core is what it owns, and the uniqueness argument
      that actually carries the weight runs through Haar rather than through geometry.
    person: >
      Erich Kahler (1906-2000) was born in Leipzig and took his doctorate there at twenty-
      two, holding positions at Konigsberg, Hamburg, Leipzig and, after the war and a period
      as a French prisoner of war, chairs at Berlin and again Hamburg. He introduced these
      manifolds in a short 1933 paper, and the compatibility of metric, complex structure
      and area form he identified turned out to be the natural setting for much of
      twentieth-century geometry, from Hodge theory to the Calabi-Yau spaces of string
      theory. His later work turned increasingly philosophical and attracted little
      following. The name was attached to the objects by Andre Weil in the 1950s, two
      decades after the paper.
    term: Kahler form
    eponyms: [Kahler]
    status: proved-in-corpus
    hook: >
      The space of quantum states carries a metric and a rotation that agree with each
      other. That agreement is what makes its volume canonical rather than arbitrary.
    lean:
      module: CsdLean4/LF4/KahlerOnticSetup.lean
      theorem: isFubiniStudyKahler
    related: [liouville-measure, fubini-study-measure]

  - slug: luders-rule
    layman: >
      Measure a quantum system and two things happen: an outcome appears, and the state
      afterwards differs from the state before. Textbook quantum mechanics states the update
      as a rule of its own, separate from the equation of motion, which is the source of
      much of the discomfort about measurement -- there are two rules and no account of
      which applies when. The subtlety Luders identified is that the obvious version of the
      rule is wrong when several distinct states share a measured value: the update must
      then project onto the whole block of states sharing that value, not onto a single one,
      or repeated measurements give inconsistent answers.
    in_csd: >
      This is the record layer earning its keep. Records and the state update live on the
      same pointer arena, and the Born weights of the recorded outcomes come out of the same
      construction that produces the updated state, so the two rules textbooks keep apart
      are one mechanism here rather than two postulates held consistent by hand. The
      degenerate case is the general one in this treatment rather than a technicality
      deferred to a footnote: the arena realises the block projection directly, and the
      rank-one projective case is recovered as the specialisation where every block is a
      single ray. That ordering matters, because real measurements are almost always
      degenerate -- a detector that reports which of two regions a particle landed in does
      not resolve the states within a region.
    mathematical: >
      On the pointer arena, the record-conditioned marginal reproduces the Born weights of
      the preparation, and the post-measurement state is the block projection of the Luders
      form. Degenerate block measurements are the general case treated here; the rank-one
      projective case is recovered as the specialisation in which every block is a single
      ray. Companion results establish that a swap-based apparatus reproduces the Luders
      marginal exactly when it is calibrated, and -- the sharper statement -- that no fixed
      ray-level calibration works for all preparations, so the calibration must be context-
      dependent. That negative result is what forces the block treatment rather than making
      it a generalisation for its own sake.
    person: >
      Gerhart Luders (1920-1995) was born in Hamburg, took his doctorate at Gottingen under
      Heisenberg's circle, and after periods at Gottingen and CERN held a chair at Gottingen
      from 1960. He gave the general state-update rule in a 1951 paper, correcting von
      Neumann's 1932 version for measurements with repeated eigenvalues -- a correction that
      stood unremarked for years before becoming standard. He is at least as well known for
      the CPT theorem, proved independently around 1954, which says that the combination of
      charge conjugation, parity and time reversal is a symmetry of any local relativistic
      quantum field theory.
    term: Luders rule
    eponyms: [Luders]
    status: proved-in-corpus
    hook: >
      The textbook rule for how a state changes when it is measured is not a second
      postulate here. It is what the record layer does.
    lean:
      module: CsdLean4/RecordLayer/PointerLudersMarginal.lean
      theorem: pointer_luders_born_prep
    related: [born-weight, naimark-dilation]

  - slug: naimark-dilation
    layman: >
      Not every quantum measurement is of the simple kind that sorts states into mutually
      exclusive alternatives with sharp boundaries. Real detectors are noisier and more
      flexible than that: they can be unsharp, they can have more outcomes than the system
      has dimensions, and they can report partial information. The saving fact is that any
      such general measurement can be seen as a simple one carried out on the system
      together with an extra piece of apparatus. Enlarge the room and the complicated thing
      becomes the simple thing again. This is why the theory of generalised measurements is
      not a separate subject with its own rules but the shadow of the ordinary theory cast
      by a larger space.
    in_csd: >
      Without this the programme's Born derivation would apply only to idealised
      measurements, which would be a serious limitation for an account claiming to be about
      physics rather than about textbooks -- essentially every real experiment is a
      generalised measurement. Dilating to a projective measurement on a larger space lets
      the same volume-ratio argument run unchanged, so the generalised case is closed by
      transfer rather than by a separate derivation, and the corpus records the POVM step as
      closed for exactly this reason. The concrete instances in the corpus -- SIC sets,
      mutually unbiased bases, trine and unambiguous-discrimination measurements, weak
      measurements -- are all built through the canonical dilation, so they inherit the
      volume statement rather than each needing their own.
    mathematical: >
      For a POVM with a Naimark dilation, the Born weight of an effect equals the Fubini-
      Study volume of the corresponding outcome region in the dilated space, and the
      frequency statement transfers with it. Stated unconditionally, with no genericity
      hypothesis on the preparation. The dilation is constructed canonically from the effect
      square roots rather than assumed to exist, so the result is constructive: given a
      POVM, the enlarged space and the projective measurement on it are produced explicitly.
      The corpus instantiates this on SIC sets, mutually unbiased bases, trine measurements,
      unambiguous state discrimination and weak measurements, each of which then inherits
      the volume statement rather than requiring its own derivation.
    person: >
      Mark Naimark (1909-1978) was born in Odessa, the son of an artist, and studied there
      before moving to Moscow, where he worked at the Steklov Institute and taught at the
      Moscow Institute of Physics and Technology. He proved the dilation theorem in 1940, in
      parallel with work by Stinespring and Sz.-Nagy on closely related extension problems,
      and is equally known for the Gelfand-Naimark theorem characterising C-star algebras,
      written with Israel Gelfand in 1943. His career unfolded largely within the Soviet
      functional-analysis school around Gelfand, whose seminar was among the most productive
      mathematical institutions of the century.
    term: Naimark dilation
    eponyms: [Naimark]
    status: proved-in-corpus
    hook: >
      Every generalised measurement is a plain one performed in a larger room. That is
      what lets the volume derivation cover generalised measurements at all.
    lean:
      module: CsdLean4/LF4/BornRegionUncond.lean
      theorem: povm_born_eq_dilated_volume_uncond
    related: [born-weight, luders-rule]

  - slug: no-exact-finite-ccr
    layman: >
      Position and momentum are related by a rule sitting at the heart of quantum mechanics:
      measuring them in the two possible orders differs by a fixed amount, and that
      difference is what makes the uncertainty principle inescapable. If the world had only
      finitely many distinguishable states, that rule could not hold exactly. The argument
      is a single line of counting and requires no physics: take the trace of both sides.
      One side is a difference of two products taken in opposite orders, whose trace is
      necessarily zero; the other is a nonzero multiple of the identity, whose trace is not.
      So any finite theory must either give up the exact relation or explain where it fails.
    in_csd: >
      The programme is finite by construction, so it owes an account of this rather than an
      apology, and the account is sharp rather than evasive. The relation holds exactly on
      the low-energy sector and breaks by a single rank-one defect at the ceiling, by
      precisely the amount that makes the trace argument come out right -- the defect is not
      a nuisance to be minimised but the exact compensation the counting demands. On states
      with negligible population at the top level the departure is negligible, which is
      every state a laboratory prepares. The wider point, and the reason the result is
      stated in CSD-free form, is that this obligation is not peculiar to this programme: it
      binds any finite-dimensional reconstruction, so a rival account claiming finiteness
      inherits the same debt.
    mathematical: >
      There are no finite matrices whose commutator of Q and P is a nonzero multiple of the
      identity, since the trace of a commutator vanishes while the trace of c times the
      identity is c times the dimension. The companion construction on the truncated
      oscillator gives a conjugate pair whose commutator is exactly i on every level but the
      top, with the defect a rank-one term at the highest Fock level, of magnitude exactly
      N. The physical corollary is that the constant cannot be i times h-bar in finite
      dimension.
    term: No exact finite-dimensional CCR
    status: proved-in-corpus
    hook: >
      Position and momentum cannot satisfy their textbook relation in any finite
      system. The proof is one line of trace arithmetic, and it constrains every
      finite theory, not only this one.
    lean:
      module: CsdLean4/CV/ApproxCCR.lean
      theorem: no_exact_finite_ccr
    related: [canonical-typicality]

  - slug: canonical-typicality
    layman: >
      Thermodynamics usually begins by assuming an ensemble: a collection of possible
      states, weighted somehow, from which the system's is drawn. Canonical typicality
      removes the assumption. Take one large system in a single definite state, look at a
      small part of it, and the part appears thermal for almost any choice of the whole.
      Equilibrium becomes a statement about how much room there is in the space of states
      rather than about an ensemble anyone had to posit, and the thermal appearance of the
      small part is explained by the overwhelming majority of global states producing it
      rather than by an assumption that the global state was drawn from a thermal
      distribution.
    in_csd: >
      This is the closest point of contact between the programme and mainstream statistical
      mechanics, and the contact runs both ways. Thermal behaviour here is volume again,
      exactly as Born weights are, so thermodynamics is native to the construction rather
      than bolted on -- the same measure does both jobs. In the other direction the
      programme has something to offer the literature: the standing complaint about
      canonical typicality is that its reference measure is an unmotivated prior, chosen for
      convenience, and on this account that measure is the substrate's own volume with a
      uniqueness theorem behind it. That is a reply the usual presentations cannot give, and
      it is why this is the most promising bridge between the corpus and an adjacent field.
    mathematical: >
      For a global pure state drawn from the Fubini-Study measure, the average reduced state
      of a tensor subsystem is maximally mixed on that subsystem. Scope to disclose, and it
      is exactly the difference between this and the literature's headline: what is proved
      is the EXPECTATION, not the concentration. The typical-state statement -- that a
      single drawn state has a reduced state close to maximally mixed with probability
      exponentially near one -- requires measure concentration on high-dimensional spheres,
      Levy's lemma, which the proof assistant does not carry. The mean proved here is
      precisely the value that concentration would concentrate around, so only the deviation
      bound is absent; but a bound is what the literature means by the phrase. This is also
      not dynamical thermalisation, which would need mixing or an eigenstate hypothesis and
      is out of scope.
    term: Canonical typicality
    status: proved-in-corpus
    hook: >
      A small piece of a large quantum system looks thermal not because it was
      prepared that way, but because almost every state of the whole makes it so.
    lean:
      module: CsdLean4/Thermo/CanonicalTypicality.lean
      theorem: canonical_typicality_expectation
    related: [fubini-study-measure, von-neumann-entropy, born-weight]

  - slug: bargmann
    layman: >
      A quantum state's overall phase is a matter of convention and means nothing on its
      own: multiply everything by a unit complex number and no measurable quantity changes.
      Take three states, though, multiply their overlaps around the cycle, and the phase of
      that product survives every convention change, because each arbitrary factor appears
      once multiplied and once conjugated. It is among the smallest quantities that are
      genuinely present rather than artefacts of bookkeeping, and it is the ancestor of the
      geometric phases that show up whenever a quantum system is carried slowly around a
      loop.
    in_csd: >
      The corpus uses it as the invariant separating the unitary branch from the antiunitary
      one in the Wigner analysis, since the two conjugate it oppositely -- a unitary
      preserves the three-fold product and an antiunitary sends it to its conjugate, so the
      invariant detects which branch a given symmetry belongs to. That is what allows the
      branch alternative to be resolved pointwise rather than assumed. Honest scope, and it
      is recorded as a gap rather than glossed: Bargmann's theorem proper, which says that
      continuity kills the projective cocycle and so lets a projective representation be
      lifted to a genuine one, is beyond the proof assistant's current reach and is listed
      in the corpus's Mathlib-gaps register. The phase lift accordingly carries a coboundary
      datum as a hypothesis where Bargmann's theorem would have supplied it.
    mathematical: >
      For rays u, v, w the Bargmann invariant is the phase of the product of the three
      pairwise overlaps taken around the cycle. It is unchanged under independent rescaling
      of each representative vector, because each arbitrary factor enters once directly and
      once conjugated. Under a unitary map it is preserved; under an antiunitary map it is
      conjugated, which is precisely what allows the two branches of Wigner's alternative to
      be distinguished pointwise rather than assumed. It is the discrete ancestor of the
      geometric phase acquired when a state is transported around a closed loop.
    person: >
      Valentine Bargmann (1908-1989) was born in Berlin to a Jewish family and studied there
      until the 1933 dismissals, completing his doctorate at Zurich under Wentzel and Pauli.
      He emigrated to the United States in 1937 and worked at the Institute for Advanced
      Study in Princeton as an assistant to Einstein, later joining the Princeton University
      faculty, where he stayed until retirement. His 1954 paper on projective unitary
      representations settled when a symmetry group's phase ambiguity can be removed, which
      is what completes Wigner's theorem into a statement about groups rather than about
      individual maps. He was also an accomplished pianist and worked on irreducible
      representations of the Lorentz group with Wigner.
    term: Bargmann invariant
    eponyms: [Bargmann]
    status: standard-mathematics
    hook: >
      A phase that no choice of convention can remove, which is exactly why it carries physical information.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Wigner%27s_theorem

  - slug: bloch-sphere
    layman: >
      The states of the simplest quantum system, one with two distinguishable levels, can be
      drawn as points on an ordinary sphere. Directions on the sphere correspond to
      measurement settings, opposite points are the perfectly distinguishable pairs, and the
      angle between two directions governs the statistics relating them. Mixed states fill
      the interior, with the maximally uncertain state at the centre. It is by some distance
      the friendliest picture in quantum mechanics, and the source of most people's
      intuition about qubits -- which is exactly the difficulty, because its friendliness is
      a special feature of two levels rather than a general truth about quantum systems.
    in_csd: >
      Used throughout the qubit-level results as the concrete arena, and the corpus flags
      the accident explicitly rather than trading on it. At two levels the projective state
      space IS a sphere, so structure that must in general live in a fibre above the state
      space can sit on the space itself, and the qubit case gives no warning that this is
      happening. The programme's own fibre analysis makes this precise: base-only contextual
      structure works at two levels because of the accidental identification, and provably
      fails from three levels upward. Conclusions drawn from the sphere therefore do not
      automatically generalise, and the corpus treats that as a substantive caution rather
      than a footnote, since the qubit is where nearly everyone's intuition is formed.
    mathematical: >
      The projective space of a two-dimensional complex Hilbert space is diffeomorphic to
      the two-sphere, with antipodal points the orthogonal states and the Fubini-Study
      measure the normalised round area. Mixed states fill the closed ball, the centre being
      the maximally mixed state, and the trace distance between two states is half the
      Euclidean distance between their points. The identification is an accident of low
      dimension: for N above two the projective space is not a sphere, has nontrivial
      topology, and admits no comparable picture, which is why intuitions calibrated here
      transfer badly.
    person: >
      Felix Bloch (1905-1983) was born in Zurich and studied at the ETH before moving to
      Leipzig for a doctorate under Heisenberg -- his thesis on electrons in crystals
      founded solid-state band theory. Jewish, he left Germany in 1933 and settled at
      Stanford, where he spent his career apart from wartime work at Los Alamos and on radar
      at Harvard. He shared the 1952 Nobel Prize with Purcell for nuclear magnetic
      resonance, the technique underlying MRI, and served as the first Director-General of
      CERN in 1954. The sphere comes from that work on spins precessing in magnetic fields,
      not from quantum information, where it became the standard picture only decades later.
    term: Bloch sphere
    eponyms: [Bloch]
    status: standard-mathematics
    hook: >
      The two-level system is a ball, and that is the one accident which makes the smallest case misleadingly easy.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Bloch_sphere

  - slug: borel-set
    layman: >
      Not every collection of points can be assigned a size without contradiction -- a fact
      that startled mathematicians when it emerged, and that leads to paradoxical
      decompositions if ignored. The standard repair is to fix in advance a family of well-
      behaved sets, built up from simple ones like intervals by countably many unions,
      intersections and complements, and to measure only those. Essentially anything one
      would naturally draw or describe belongs to it, so the restriction costs nothing in
      practice while making the theory consistent. Everything in measure theory and
      probability rests on this move.
    in_csd: >
      Every measure in the corpus is a Borel measure on its state space, and the outcome
      regions whose volumes give Born weights are required to be Borel sets -- which is not
      a formality, since the whole derivation is an assertion about the measure of certain
      regions and would be meaningless for regions without one. This is background
      machinery, used exactly as any measure-theoretic development uses it, and the corpus
      claims nothing about it. Worth noting that the boundaries of the outcome regions are
      null sets, so the ambiguity about which region a boundary point belongs to has measure
      zero and does not affect any probability.
    mathematical: >
      The sigma-algebra generated by the open sets of a topological space. The measures used
      throughout the corpus are Borel probability measures on the projective state space and
      on the unitary group. Worth recording that the boundaries of the outcome regions are
      null with respect to the Fubini-Study measure, so the ambiguity about which region a
      boundary point belongs to has measure zero and cannot affect any probability -- a
      point the corpus's region constructions rely on rather than gloss over.
    person: >
      Emile Borel (1871-1956) was born at Saint-Affrique in the Aveyron, the son of a
      Protestant pastor, and topped the entrance examinations for both the Ecole Normale
      Superieure and the Ecole Polytechnique, choosing the former. He taught at Lille and
      then in Paris at the Ecole Normale and the Sorbonne, founding measure theory around
      1898 and making it possible to say which sets have a size at all. He was also a
      Radical-Socialist deputy in the Chamber and served as Minister of the Navy in 1925;
      imprisoned briefly by the Vichy regime in 1941 for Resistance activity, he was awarded
      the Resistance Medal after the war. The infinite monkey theorem is his illustration.
    term: Borel set
    eponyms: [Borel]
    status: standard-mathematics
    hook: >
      Before you can say how likely a region is, you must say which regions are allowed to have a size at all.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Borel_set

  - slug: cglmp-inequality
    layman: >
      The famous test of local realism assumes each measurement has two possible results,
      because that is the simplest case and the one Bell wrote down. Real systems often have
      more, and extending the argument is not cosmetic: a new inequality is needed, the
      classical bound changes, and the margin by which quantum mechanics beats it changes
      too -- in fact the relative violation grows with the number of outcomes, so higher-
      dimensional systems conflict with local realism more strongly rather than less. That
      the conflict survives and strengthens past the simplest case is what makes it
      structural rather than an artefact of the example everyone quotes.
    in_csd: >
      The corpus carries it so that the contextuality results are not confined to two-level
      systems, which matters for the same reason the Bloch-sphere caution matters: the qubit
      is a special case in ways that are easy to miss, and a reconstruction claiming to
      recover quantum mechanics in general must reproduce the higher-outcome conflicts as
      well. It also connects to the fibre analysis, where three levels is precisely the
      threshold at which base-only contextual structure fails, so the dimension at which the
      mathematics changes character is the same dimension at which this inequality becomes
      necessary.
    mathematical: >
      A Bell-type inequality for bipartite systems with d outcomes per measurement, due to
      Collins, Gisin, Linden, Massar and Popescu, violated by quantum mechanics for every d
      of at least two. The maximal violation increases with d, and the state achieving it is
      not the maximally entangled one, which was among the paper's surprises and remains a
      point of interest: the state that is most entangled by the standard measure is not the
      state that conflicts most sharply with local realism.
    person: >
      Named for Daniel Collins, Nicolas Gisin, Noah Linden, Serge Massar and Sandu Popescu,
      whose 2002 paper in Physical Review Letters extended Bell's argument beyond two
      outcomes per measurement. Gisin was at Geneva, Popescu and Linden at Bristol, Massar
      at the Universite Libre de Bruxelles, and Collins was Popescu's student at Bristol --
      an unusually distributed collaboration for a paper of that length, and one that
      reflects how the European quantum-information community worked in that period.
    term: CGLMP inequality
    eponyms: [CGLMP]
    status: standard-mathematics
    hook: >
      Bell's argument was written for two-outcome measurements. Past two the right inequality is a different one, and quantum mechanics violates that too.
    external:
      - text: "Overview and history"
        url: https://doi.org/10.1103/PhysRevLett.88.040404

  - slug: deutsch-jozsa
    layman: >
      Suppose a hidden function is promised to be either constant on every input or exactly
      balanced between two answers, and you must say which. Classically, in the worst case,
      you may have to examine more than half of all possible inputs before the promise
      resolves, which grows exponentially with the size of the input. A quantum procedure
      settles it with a single query, by preparing a superposition over all inputs at once
      and arranging that the wrong answer's amplitudes cancel. The problem is artificial and
      has no application, which was the point: it was constructed to show that a separation
      exists at all.
    in_csd: >
      Held in the corpus as one of the algorithm witnesses. Its role is scope-marking rather
      than foundational, and the corpus is explicit about this: the algorithms presuppose
      the unitary-evolution pillar rather than contributing to it, so they are theorems
      about circuit semantics and cost, not about the reconstruction. What they establish is
      that the formalised machinery is strong enough to state and verify real quantum
      algorithms rather than toy fragments, which is worth demonstrating for a corpus
      claiming to have formalised quantum dynamics rather than a restricted piece of it.
    mathematical: >
      Given an oracle for a function promised constant or balanced, a single query decides
      which, against a classical worst case exponential in the number of input bits. The
      bounded-error classical complexity is by contrast constant, which is the honest
      qualification: the exponential separation holds against exact classical algorithms,
      and the problem's artificiality was the point, since it was constructed to exhibit a
      separation rather than to be useful.
    person: >
      David Deutsch, British, was born in Haifa in 1953 and studied at Cambridge and Oxford,
      where he has remained at the Clarendon Laboratory in an unusual position, largely
      unsalaried and without teaching duties. He formulated the universal quantum computer
      in a 1985 paper and gave the single-query algorithm in 1992 with Richard Jozsa, then
      also at Oxford and later at Bristol and Cambridge. Deutsch is a committed Everettian
      and has argued that the existence of quantum algorithms is evidence for many worlds --
      a claim most of the field does not accept, and one this account explicitly rejects.
    term: Deutsch-Jozsa algorithm
    eponyms: [Deutsch]
    status: standard-mathematics
    hook: >
      The first problem shown to fall to a quantum computer in a single question where a classical method might need exponentially many.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Deutsch%E2%80%93Jozsa_algorithm

  - slug: dirichlet-distribution
    layman: >
      To choose a set of proportions at random with none favoured, you cannot simply choose
      each one independently, because they are constrained to sum to one -- picking the
      first restricts what the rest can be. The Dirichlet family is the standard answer to
      this, a family of distributions living on the set of all such proportions, and its
      flat member spreads weight evenly over every way of dividing a whole into parts. It is
      the natural notion of complete ignorance about a set of probabilities, and it appears
      throughout Bayesian statistics for exactly that reason.
    in_csd: >
      This is what the space of quantum states looks like once the moment map has discarded
      everything except the outcome probabilities. The flat member of the family is what the
      Fubini-Study measure becomes under that projection, which is the content of the
      Duistermaat-Heckman statement and the reason Born weights reduce to ordinary volumes
      of regions in a simplex rather than requiring integration over a curved space. The
      appearance of the uniform Dirichlet here is not an assumption imported from statistics
      but a computed consequence of the geometry, which is worth stressing, since a reader
      meeting it in a Bayesian context is used to it being a modelling choice.
    mathematical: >
      A family of distributions on the probability simplex parametrised by positive
      concentration parameters. The uniform member, with all parameters one, is flat
      Lebesgue measure on the simplex, and it is the pushforward of the Fubini-Study measure
      along the moment map. That identification is a computed consequence of the geometry
      rather than a modelling assumption, which distinguishes its appearance here from its
      familiar role in Bayesian statistics as a chosen prior.
    person: >
      Peter Gustav Lejeune Dirichlet (1805-1859) was born at Duren, then under French
      administration, to a family of Belgian descent, and studied in Paris, where he read
      Gauss's Disquisitiones so thoroughly that he was said to keep it under his pillow. He
      taught at Breslau and then Berlin for nearly thirty years before succeeding Gauss at
      Gottingen in 1855. The modern definition of a function as an arbitrary rule rather
      than a formula is largely his, as is the pigeonhole principle and the first proof of
      convergence of Fourier series under general conditions. He died at fifty-four, four
      years after taking the Gottingen chair.
    term: Dirichlet distribution
    eponyms: [Dirichlet]
    status: standard-mathematics
    hook: >
      The natural way to be evenly ignorant about a list of probabilities that has to add up to one.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Dirichlet_distribution

  - slug: elitzur-vaidman
    layman: >
      Imagine a bomb so sensitive that a single particle of light detonates it, in a batch
      where some are duds whose trigger is broken. Sorting the live ones from the duds looks
      impossible, since testing means illuminating and illuminating means detonating.
      Quantum interference permits a test in which some live bombs are identified precisely
      because nothing went the way that would have triggered them: a live bomb, merely by
      being capable of absorbing, destroys the interference that a dud would have preserved,
      and a detection at the normally dark port certifies it. The absence of an interaction
      becomes the evidence, which is about as counterintuitive as quantum mechanics gets.
    in_csd: >
      Carried in the corpus as one of the empirical twins: a prediction counterintuitive
      enough that reproducing it is a genuine test of an account rather than a formality.
      Interaction-free measurement is a particularly sharp probe for a substrate theory,
      because it forces the account to say something definite about the path not taken. A
      story in which the particle simply went one way and the other branch was empty has to
      explain why the presence of an object in the empty branch changes the outcome; a story
      in which nothing definite happened until measurement has to explain what the record is
      a record of. This account's answer runs through the epistemic regions rather than
      through a path, which is why the case is worth carrying explicitly.
    mathematical: >
      An interferometer arrangement in which a blocking object destroys the interference, so
      a detection at the normally dark port certifies the object's presence without
      absorbing anything. In the basic scheme the success probability is one quarter, with
      half the live objects destroyed; iterated variants using the quantum Zeno effect push
      the efficiency arbitrarily close to one, which is what turned the puzzle into a
      serious proposal for interaction-free imaging.
    person: >
      Avshalom Elitzur and Lev Vaidman, both Israeli, published the bomb-tester in 1993 in
      Foundations of Physics. Vaidman has spent his career at Tel Aviv University and is a
      prominent Everettian as well as a co-author of the weak-measurement programme with
      Aharonov and Albert. Elitzur has worked at Bar-Ilan and elsewhere and later founded a
      private research institute; his interests run to the foundations of time and
      thermodynamics. The paper is unusual in being both a serious contribution and a
      memorable puzzle, and the scheme was realised experimentally by Kwiat and
      collaborators at Innsbruck in 1995.
    term: Elitzur-Vaidman bomb tester
    eponyms: [Elitzur]
    status: standard-mathematics
    hook: >
      You can establish that an object is there without any light ever touching it.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Elitzur%E2%80%93Vaidman_bomb-tester

  - slug: euclidean-space
    layman: >
      Ordinary geometry supplies a way to say how long something is and how far two
      directions differ, through the notion of a dot product from which both length and
      angle can be recovered. Quantum mechanics needs both notions but over complex numbers,
      so lengths stay real and positive while directions can carry a phase -- the inner
      product of a vector with itself is a positive real, but the inner product of two
      different vectors is generally complex, and that complex phase is where interference
      comes from. Everything finite in this programme is built on that structure.
    in_csd: >
      State vectors live in finite complex Euclidean space and operators are matrices on it.
      This is the base setting rather than a subject of claims; what carries content is the
      projective space built from it -- states that differ by a phase are the same physical
      state, so the arena is the space of rays rather than the space of vectors -- and the
      measures on that projective space. The corpus is finite-dimensional throughout by
      deliberate choice rather than convenience, which makes completeness automatic and
      means the analytical subtleties of infinite-dimensional Hilbert space simply do not
      arise, at the price of the exact canonical commutation relation.
    mathematical: >
      Finite-dimensional complex inner product space, written here in its L2 form on a
      finite index type, with matrices carrying the induced operator norm. Completeness is
      automatic in finite dimension, so the distinction between inner-product and Hilbert
      space collapses; the corpus works throughout in this setting deliberately, which is
      what makes the exact canonical commutation relation unavailable and the truncation
      defect a permanent feature rather than an artefact.
    person: >
      Euclid of Alexandria, active around 300 BC under Ptolemy I, is known almost entirely
      through his work; the biographical anecdotes are late and unreliable. The Elements
      organised existing Greek geometry and number theory into definitions, postulates and
      proofs, and became the model for deductive mathematics -- it remained a standard
      textbook for over two thousand years, and the reason a formal proof looks the way it
      does is traceable to it. That its fifth postulate resisted derivation for two
      millennia, and was eventually shown independent, is how non-Euclidean geometry and
      ultimately the geometry underlying relativity arrived.
    term: Euclidean space
    eponyms: [Euclidean]
    status: standard-mathematics
    hook: >
      Ordinary geometry of lengths and angles, carried over to complex numbers: the setting every finite quantum system here lives in.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Euclidean_space

  - slug: fisher-information
    layman: >
      If the quantity you are trying to measure shifts slightly, your results shift too, but
      only a little and against a background of noise. Fisher information quantifies how
      much the distribution of results responds to a change in the parameter, and its
      reciprocal sets a floor under the variance of any unbiased estimate -- no amount of
      cleverness in processing the data can beat it. It is the mathematics of how good a
      measurement could possibly be, as opposed to how good a particular technique happens
      to be, and it is why claims of unlimited precision from better analysis are generally
      wrong.
    in_csd: >
      Used in the metrology strand, where quantum precision limits are stated and the
      standard scaling is compared against the Heisenberg scaling that entangled probes
      permit. That strand is an adjacent arm rather than part of the reconstruction: it
      consumes the formalised machinery -- states, measurements, the Born rule -- instead of
      contributing to the derivation of quantum mechanics, and the corpus lists it among the
      adjacent arms whose theorems are independent consumers rather than a cascade from the
      foundational layer. It is included because a formalisation claiming practical reach
      should be able to state a precision bound.
    mathematical: >
      The variance of the score of a parametrised family; its inverse bounds the variance of
      any unbiased estimator through the Cramer-Rao inequality. The quantum analogue
      replaces the classical family by a parametrised family of states and maximises over
      measurements, giving the quantum Fisher information and the Braunstein-Caves bound,
      which is what sets the ultimate precision available to any measurement strategy rather
      than to a chosen one.
    person: >
      Ronald Fisher (1890-1962) was born in London and studied at Cambridge, working at
      Rothamsted Experimental Station from 1919 -- where the agricultural field trials gave
      him the problems that produced experimental design and analysis of variance -- before
      chairs at University College London and then Cambridge. He largely created modern
      statistics: maximum likelihood, sufficiency, the analysis of variance, randomisation.
      He was also a lifelong eugenicist who held the Galton Chair, opposed the early
      evidence linking smoking to cancer while consulting for the tobacco industry, and
      whose statistical work was in significant part developed in service of eugenic aims.
      That is part of the record rather than incidental to it.
    term: Fisher information
    eponyms: [Fisher]
    status: standard-mathematics
    hook: >
      How sharply a measurement can tell nearby possibilities apart, and therefore how well anything can ever be estimated.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Fisher_information

  - slug: gibbs-state
    layman: >
      Left in contact with a large environment at some temperature, a system does not sit in
      its lowest-energy configuration. It spreads across configurations, favouring low
      energy but not exclusively, because the environment is constantly supplying and
      removing small amounts of energy. The Gibbs state is that compromise, and what singles
      it out is a variational principle: among all states with a given average energy it has
      the most entropy, and equivalently it minimises the free energy. Temperature enters as
      the exchange rate between energy and entropy in that trade.
    in_csd: >
      The thermodynamics strand instantiates it on the field Hamiltonian and derives
      temperature and free energy from the variational principle rather than positing them,
      which is the difference between formalising thermodynamics and assuming it. It is also
      the object joined to the field-theoretic strand by the exact equilibrium condition
      proved at the cutoff -- the KMS relation, which is the corpus's first and the point
      where the thermal and field-theoretic verticals meet after developing independently.
      Because the field Hamiltonian is diagonal in the configuration basis, the state has a
      closed form with geometric normalisation, so the thermal results are computations
      rather than existence statements.
    mathematical: >
      The density operator proportional to the exponential of minus beta times the
      Hamiltonian, normalised by the partition function; the unique minimiser of the free
      energy functional at inverse temperature beta, and equivalently the maximiser of
      entropy at fixed mean energy. In the corpus it is instantiated on the free-field
      Hamiltonian, which is diagonal in the configuration basis, so the state has a closed
      form with a finite geometric normalisation and the thermal results are explicit
      computations rather than existence claims.
    person: >
      Josiah Willard Gibbs (1839-1903) was born in New Haven and spent almost his entire
      life there, taking the first American doctorate in engineering at Yale in 1863 and,
      after three years in Paris, Berlin and Heidelberg, returning to a Yale professorship
      he held unpaid for a decade because the university had no funds. He published in the
      Transactions of the Connecticut Academy, a journal almost nobody read, and his work
      reached Europe largely through Maxwell, who recognised its importance and made a
      plaster model of one of Gibbs's thermodynamic surfaces. He founded statistical
      mechanics, deriving thermodynamics from the statistics of molecular states, and coined
      the term itself in 1902.
    term: Gibbs state
    eponyms: [Gibbs]
    status: standard-mathematics
    hook: >
      The state a system settles into at a given temperature, singled out as the one that balances energy against disorder.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Gibbs_measure

  - slug: gisin-theorem
    layman: >
      One might expect entanglement to come in degrees, with weakly entangled states
      behaving essentially classically and only strongly entangled ones showing the famous
      conflict with local realism. That would be a comfortable picture, with a threshold
      below which ordinary intuitions apply. It is false for pure states: any entanglement
      at all, however slight, produces correlations that no local account can reproduce, for
      some choice of measurement settings. There is no quiet zone and no threshold. For
      mixed states the situation is genuinely more complicated, and entangled states that
      violate no Bell inequality do exist.
    in_csd: >
      The corpus carries the CHSH machinery in a form general enough that the singlet is an
      instance rather than the subject, which is what makes statements of this shape
      expressible at all -- a treatment specialised to the singlet could not say anything
      about arbitrary entangled states. It matters to the programme because a substrate
      account cannot treat weak entanglement as effectively classical and confine its non-
      locality to a strongly entangled regime. Whatever mechanism produces the correlations
      has to operate at every degree of entanglement, which constrains the account more
      tightly than the singlet case alone would.
    mathematical: >
      Every pure entangled bipartite state violates the CHSH inequality for some choice of
      settings. The result does not extend to mixed states, where entangled states admitting
      a local hidden-variable model exist -- Werner's examples -- so entanglement and Bell
      non-locality are genuinely distinct properties there. The corpus proves the universal
      quantum ceiling and the singlet's saturation of it separately, which is the machinery
      a statement of this generality requires.
    person: >
      Nicolas Gisin, Swiss, was born in 1952 and took his doctorate at Geneva, where he
      spent his career apart from a period in industry building fibre-optic instruments. He
      proved in 1991 that every entangled pure state violates a Bell inequality, and led
      much of the experimental work carrying quantum communication out of the laboratory and
      onto deployed telecommunications fibre under Lake Geneva -- the 1997 experiments over
      ten kilometres of Swisscom fibre were a turning point in making quantum information
      look like engineering. He co-founded the company idQuantique and has written for
      general readers on the philosophy of indeterminism.
    term: Gisin's theorem
    eponyms: [Gisin]
    status: standard-mathematics
    hook: >
      Every entangled pure state violates a Bell inequality. Entanglement and non-classical correlation are the same thing, with no exceptions to hunt for.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Nicolas_Gisin

  - slug: grover-algorithm
    layman: >
      To find one marked item among many with no structure to exploit, classical search must
      on average look at half of them, and in the worst case at all. A quantum procedure
      repeatedly nudges amplitude toward the marked item -- reflecting about the average,
      then about the marked state, over and over -- and needs roughly the square root of
      that number of steps. The gain is modest next to the exponential speedups elsewhere,
      but it applies to almost any search problem rather than to a special structure, and it
      is provably the best any quantum algorithm can do for unstructured search, which is
      unusual: the algorithm and its optimality proof arrived within a year of each other.
    in_csd: >
      One of the algorithm witnesses in the corpus. Like the others it marks scope rather
      than contributing to the foundations, and the corpus is explicit that the algorithms
      presuppose the unitary-evolution pillar rather than supporting it -- their theorems
      are statements about circuit semantics and query counts, not about where quantum
      mechanics comes from. What they establish is worth establishing nonetheless: that the
      formalised machinery is strong enough to express and verify real algorithms, with
      their amplitude bookkeeping, their iteration schedules and their success
      probabilities, rather than only structural facts about states and measurements. A
      corpus claiming to have formalised quantum dynamics rather than a convenient fragment
      of it should be able to run an algorithm through, and this is one of the
      demonstrations that it can.
    mathematical: >
      Amplitude amplification finds a marked element among N with order square root of N
      oracle queries, against the order N required classically, and this is optimal: no
      quantum algorithm can do unstructured search in fewer, by the hybrid argument of
      Bennett, Bernstein, Brassard and Vazirani. Each iteration is a reflection about the
      marked state followed by a reflection about the uniform superposition, which together
      rotate the state vector by a fixed small angle in the two-dimensional plane spanned by
      the marked and unmarked components -- so the count is a matter of dividing a right
      angle by that rotation, and overshooting degrades the success probability rather than
      improving it.
    person: >
      Lov Grover, Indian-born American, was born in 1961, studied at IIT Delhi and Stanford,
      and published the search algorithm in 1996 while at Bell Laboratories in New Jersey.
      The paper is three pages long. Its quadratic speedup was shown optimal for
      unstructured search by Bennett, Bernstein, Brassard and Vazirani, whose lower bound
      had in fact appeared shortly before the algorithm did, so the ceiling was known before
      anyone had reached it.
    term: Grover's algorithm
    eponyms: [Grover]
    status: standard-mathematics
    hook: >
      Searching an unsorted haystack in about the square root of the number of straws, and that speedup is provably the best possible.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Grover%27s_algorithm

  - slug: haar-measure
    layman: >
      A group is a collection of transformations that can be composed and undone. Asking for
      a notion of size on such a collection that is unchanged when everything is shifted by
      one of the transformations turns out to be enormously restrictive: for compact groups
      there is exactly one such notion once the total size is fixed to be one. Symmetry
      leaves no room for choice. This is why questions about averaging over all rotations,
      or all unitary transformations, have definite answers rather than answers depending on
      how one chose to parametrise the group.
    in_csd: >
      This is the engine behind the claim that the programme's ruler is forced rather than
      chosen, and it is worth tracing the chain. The unitary group carries its Haar measure,
      unique by compactness. The state space is a quotient of that group by the subgroup
      fixing a point, so it is a homogeneous space. Uniqueness of the invariant measure
      downstairs is inherited from uniqueness upstairs by pushing forward along the orbit
      map. Remove this and the Fubini-Study measure becomes a preference rather than a
      consequence, the Born derivation becomes circular, and the programme loses its central
      claim. It is also what makes the base point of the construction immaterial, since any
      two orbit maps differ by a group element that Haar measure does not see.
    mathematical: >
      A compact topological group carries a unique translation-invariant Borel probability
      measure. Invariant measures on a homogeneous space of such a group are unique up to
      scale, and normalisation fixes the scale. The corpus uses the unitary group's Haar
      measure directly and pushes it forward along the orbit map; uniqueness downstairs is
      inherited from uniqueness upstairs, and it is this inheritance rather than any
      geometric argument that carries the weight in the Fubini-Study uniqueness proof.
    person: >
      Alfred Haar (1885-1933) was born in Budapest and studied at Gottingen under Hilbert,
      taking his doctorate in 1909 on orthogonal function systems -- the Haar wavelet comes
      from that thesis and is now the standard first example in wavelet theory. He taught at
      Gottingen and Klausenburg before helping found, with Frigyes Riesz, the mathematics
      institute at Szeged, which became a centre of Hungarian analysis and published the
      journal Acta Scientiarum Mathematicarum. He proved the existence of the invariant
      measure on a locally compact group in 1933, the year he died of cancer at forty-seven;
      von Neumann and Weil developed the uniqueness and the general theory shortly
      afterwards.
    term: Haar measure
    eponyms: [Haar]
    status: standard-mathematics
    hook: >
      On a group, there is essentially one notion of volume that the group's own action leaves alone. Uniqueness there is what forces uniqueness everywhere else here.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Haar_measure

  - slug: hermitian-operator
    layman: >
      Quantum mechanics represents measurable quantities by operators, and measured numbers
      are real. That forces a symmetry condition: the operator must equal its own conjugate
      transpose. The consequences are exactly what a theory of measurement needs. Such
      operators have real eigenvalues, which are the possible measurement outcomes; they
      have a complete set of mutually orthogonal eigenvectors, which are the states giving
      each outcome with certainty; and the two together let a measurement be understood as
      sorting states into perfectly distinguishable alternatives. Drop the condition and
      none of it survives.
    in_csd: >
      Observables, Hamiltonians and density operators in the corpus are all Hermitian, and
      the spectral decomposition that follows is used constantly -- most visibly to
      diagonalise a state before integrating against it, which is how the trace-versus-
      operator-norm bound in the channel work is proved. Standard machinery, and the corpus
      claims nothing about the notion itself, though it does prove the finite-dimensional
      spectral facts it consumes rather than assuming them. Worth noting the corpus's
      convention: it uses the self-adjointness predicate on matrices directly rather than a
      bundled subtype, which keeps the statements closer to the mathematics and the proofs
      closer to the library.
    mathematical: >
      A matrix equal to its own conjugate transpose. Its eigenvalues are real and it is
      unitarily diagonalisable with orthogonal eigenspaces, which supports the functional
      calculus used throughout the corpus -- most visibly in diagonalising a density
      operator before integrating against it. The corpus uses the self-adjointness predicate
      on matrices directly rather than a bundled subtype, a convention that keeps statements
      close to the mathematics and proofs close to the library.
    person: >
      Charles Hermite (1822-1901) was born at Dieuze in Lorraine with a deformity of the
      right foot and, refusing surgery that might have corrected it, was barred from the
      engineering career at the Ecole Polytechnique for which he had trained -- he was
      admitted, then required to leave. He eventually taught at the Ecole Polytechnique, the
      Ecole Normale and the Sorbonne. He proved in 1873 that e is transcendental, the first
      number not constructed for the purpose to be shown so, and his method let Lindemann
      settle pi nine years later. Poincare was his student. He also had a long
      correspondence with Stieltjes and was, unusually for the period, generous in
      circulating unpublished ideas.
    term: Hermitian operator
    eponyms: [Hermitian]
    status: standard-mathematics
    hook: >
      The operators whose values come out real. Anything that can be measured has to be one.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hermitian_matrix

  - slug: hilbert-space
    layman: >
      The standard formulation puts quantum states in a space with lengths and angles that
      is complete, meaning that sequences which ought to converge do converge inside the
      space rather than escaping it. In finite dimensions completeness is automatic and the
      space is simply complex Euclidean space; in infinite dimensions it is a genuine
      condition and the source of most of the analytical difficulty in quantum theory. It is
      the stage on which the usual account is performed, and the usual account tends to
      identify the stage with the physics.
    in_csd: >
      The programme's ontology is deliberately not here, and this is the single most
      important thing to understand about how it differs from a textbook presentation.
      Physical states are points of the constraint surface; the Hilbert space enters as the
      epistemic bookkeeping built over it, and specifically it is the projective space of
      rays that carries the outcome regions. Saying that quantum mechanics happens in
      Hilbert space is, on this account, describing the shadow rather than the object --
      accurate as far as it goes, and misleading about what is doing the work. The corpus's
      fibre analysis sharpens the point further: the projective space is a lossy projection,
      and the record-forming content lives above it rather than on it.
    mathematical: >
      A complete complex inner product space. Everything in this corpus is finite-
      dimensional, so completeness is automatic and the relevant object is the projective
      space of rays rather than the space of vectors, since states differing by a phase are
      physically identical. The infinite-dimensional case, with its unbounded operators,
      domain questions and continuous spectra, is deliberately outside scope -- the corpus's
      continuous-variable work approximates it at a finite cutoff instead.
    person: >
      David Hilbert (1862-1943) was born in Konigsberg, studied and taught there, and moved
      in 1895 to Gottingen, which he made the mathematical centre of the world until the
      Nazi dismissals of 1933 emptied it -- asked by the education minister whether
      Gottingen had suffered from the removal of the Jews, he replied that it had not
      suffered, it no longer existed. His 1900 address in Paris listing twenty-three
      problems set much of the century's agenda. His formalist programme, that mathematics
      could be shown complete and consistent by finite means, was limited by Godel in 1931;
      the space is not his coinage but von Neumann's, who named it while giving quantum
      mechanics its rigorous form in Hilbert's own department.
    term: Hilbert space
    eponyms: [Hilbert]
    status: standard-mathematics
    hook: >
      The stage quantum mechanics is normally set on. This programme treats it as scenery rather than substance.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hilbert_space

  - slug: hong-ou-mandel
    layman: >
      Send two identical photons into the two input ports of a half-silvered mirror at the
      same instant. Classically they should sometimes emerge one at each output, since each
      independently either passes through or reflects. They never do. The two possibilities
      that would separate them -- both transmitted, both reflected -- carry amplitudes that
      cancel exactly, so both photons always leave on the same side. The signature is a dip
      to zero in the rate of coincident detections as the arrival times are brought
      together, and the depth and width of that dip measure how alike the two particles are.
    in_csd: >
      One of the empirical twins in the corpus. It is a useful test case because the effect
      is pure interference between alternatives rather than a correlation between separated
      wings, so it probes a different part of an account than the Bell family does -- there
      is no locality question here at all, only the question of what it means for two
      possibilities to cancel. For a substrate theory that is a sharp probe: the account
      must say what is different about the two configurations whose amplitudes cancel, when
      in the naive picture nothing distinguishes them except a label.
    mathematical: >
      For two indistinguishable bosons entering the separate input ports of a balanced beam
      splitter, the amplitudes for both-transmitted and both-reflected cancel, so the
      coincidence rate falls to zero. The cancellation is exact only for perfectly
      indistinguishable particles, so the depth of the dip measures indistinguishability and
      its width measures the coherence time -- which is what makes the effect a standard
      diagnostic in photonics rather than only a demonstration.
    person: >
      Chung Ki Hong, Zheyu Ou and Leonard Mandel demonstrated the effect at the University
      of Rochester in 1987, in a paper measuring intervals of less than a picosecond by an
      entirely optical method. Mandel (1927-2001) was born in Berlin, came to Britain as a
      refugee in 1937, took his degrees at Birkbeck College London, taught at Imperial
      College, and moved to Rochester in 1964, where he founded quantum optics as an
      experimental subject. Hong and Ou were his graduate students; Ou went on to a career
      at Indiana University-Purdue University Indianapolis.
    term: Hong-Ou-Mandel effect
    eponyms: [Hong]
    status: standard-mathematics
    hook: >
      Two identical photons meeting at a beam splitter always leave together. Indistinguishability, made visible as a hole in the data.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hong%E2%80%93Ou%E2%80%93Mandel_effect

  - slug: jacobi-identity
    layman: >
      Take two operations and ask by how much doing them in one order differs from the
      other. That mismatch is itself an operation, and it obeys a compatibility law: cycle
      three ingredients through it in all three ways, add the results, and everything
      cancels. That law is what makes the mismatch a structure rather than a mess -- it is
      what makes the bracket the multiplication of a Lie algebra, and hence what connects it
      to continuous symmetry. The quantum commutator and the classical Poisson bracket both
      satisfy it, which is the formal reason the two theories look so alike at the level of
      dynamics.
    in_csd: >
      It sits underneath the correspondence the programme leans on: the classical bracket
      and the quantum commutator obey the same law, which is what lets a Hamiltonian
      description translate between the ontic flow on the constraint surface and the
      operator picture on the epistemic side. Without that shared structure the two levels
      would be related only by analogy. It is background structure here rather than a
      subject of claims, and the corpus's formal content in this area is at the pointwise
      and volume level rather than the full symplectic-manifold level, which remains outside
      what the proof assistant can express.
    mathematical: >
      For a Lie bracket, the cyclic sum of the bracket of x with the bracket of y and z
      vanishes. Both the matrix commutator and the Poisson bracket satisfy it, which is what
      makes each the multiplication of a Lie algebra and is the formal content behind the
      parallel between classical and quantum dynamics. It is equivalent to saying that the
      bracket with a fixed element acts as a derivation, which is the form in which it
      usually enters calculations.
    person: >
      Carl Gustav Jacob Jacobi (1804-1851) was born in Potsdam to a Jewish banking family,
      converted to Christianity to secure an academic post, and taught at Konigsberg from
      1826 to 1844 before ill health took him to Berlin. He worked on elliptic functions in
      competition with Abel, on determinants, and on dynamics, where the Hamilton-Jacobi
      formulation and much of the modern shape of analytical mechanics are his. He was among
      the first to insist that mathematics be pursued for the honour of the human spirit
      rather than for applications, in a letter answering Fourier's complaint that he wasted
      time on number theory.
    term: Jacobi identity
    eponyms: [Jacobi]
    status: standard-mathematics
    hook: >
      The rule that stops a bracket from being arbitrary. It is why commutators and Poisson brackets behave like the same thing.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Jacobi_identity

  - slug: kronecker-product
    layman: >
      Put two quantum systems side by side and the combined system is not the pair of
      descriptions but something much larger: every state of the first can be combined with
      every state of the second, and superpositions of those combinations are states too. In
      coordinates this is a way of multiplying two grids of numbers to make a grid whose
      dimensions are the products of the originals. That multiplication of dimensions,
      rather than addition, is where the exponential growth that makes quantum computing
      powerful and quantum simulation hard both come from.
    in_csd: >
      The concrete realisation of composition throughout the corpus. It carries real weight
      in the composite-system results, where the tensor structure is not assumed but forced:
      from commuting local subalgebras that generate the whole, the corpus derives that the
      composite must be a tensor product with the product dimension, quantified over
      arbitrary embeddings. That is one of the strongest results it has, and it is what
      makes composition a consequence rather than a postulate. The product also appears in
      the partial trace used to discard an environment, which is how reduced states and the
      thermal marginal are computed.
    mathematical: >
      The matrix realisation of the tensor product of operators, with the identity that the
      product of Kronecker products is the Kronecker product of the products -- the property
      that makes it functorial and hence usable. The corpus consumes it in the partial-trace
      machinery and in the composite-system results, where the tensor structure is not
      assumed but derived from commuting local subalgebras that generate the whole, with the
      dimension coming out as the product.
    person: >
      Leopold Kronecker (1823-1891) was born in Liegnitz in Silesia to a prosperous Jewish
      family, was tutored privately by Kummer, and took his doctorate at Berlin in 1845
      before spending a decade managing the family banking and estate business with enough
      success to retire wealthy at thirty. He returned to mathematics without a salaried
      post, lecturing at Berlin from 1862 and taking a chair only in 1883. He is remembered
      for insisting that mathematics be constructive -- his line that God made the integers
      and all else is the work of man -- and for a sustained hostility to Cantor's
      infinities that damaged Cantor personally.
    term: Kronecker product
    eponyms: [Kronecker]
    status: standard-mathematics
    hook: >
      How two systems become one system, written out in coordinates.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Kronecker_product

  - slug: leggett-garg
    layman: >
      Bell's inequalities compare measurements made at separated places, and what they rule
      out is a local account of the correlations. Leggett and Garg asked the analogous
      question about one system at different moments. Does it have a definite property all
      along, which observation merely reveals, and can it be observed without disturbing it?
      Those two assumptions together imply a bound on combinations of correlations taken at
      pairs of times, and quantum mechanics violates that bound. Nothing about separation in
      space enters, so what is at stake is not distant influence but the existence of a
      definite history.
    in_csd: >
      This is unusually searching for an account of this kind, and that is why it is worth
      carrying. A substrate theory naturally suggests that properties are definite between
      measurements -- that is close to what having a substrate means -- so a test aimed
      precisely at that assumption probes the account where it is most exposed. The escape
      is the second assumption rather than the first: measurements here are physical
      interactions producing records, so they are not non-invasive, and the inequality's
      derivation needs both. That is an honest answer rather than an evasion, but it does
      mean the account cannot claim the comfortable picture of properties sitting there
      waiting to be read.
    mathematical: >
      A bound on combinations of two-time correlation functions that follows from
      macrorealism together with non-invasive measurability, violated by quantum mechanics.
      Both hypotheses are needed, and which one an account gives up is the substantive
      question: a theory with definite properties between measurements but invasive
      measurements is untouched by the inequality, which is the position this account
      occupies.
    person: >
      Anthony Leggett, British-American, was born in London in 1938 to a family of Irish
      descent, read classics before switching to physics at Oxford, and took his doctorate
      there under Dirk ter Haar. He taught at Sussex for two decades before moving in 1983
      to the University of Illinois at Urbana-Champaign, where he remains. He shared the
      2003 Nobel Prize for theoretical work on superfluid helium-3, and has argued
      persistently that quantum mechanics may fail at macroscopic scales -- the inequalities
      he proposed with his student Anupam Garg in 1985 were designed to test exactly that.
    term: Leggett-Garg inequality
    eponyms: [Leggett]
    status: standard-mathematics
    hook: >
      Bell's argument turned from two places to two times. What it rules out is not distant influence but a definite history.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Leggett%E2%80%93Garg_inequality

  - slug: loewner-order
    layman: >
      For plain numbers, saying which of two is larger is easy. For operators it is subtler:
      one counts as larger when the difference between them is positive, in the sense of
      never returning a negative value when applied to a vector and paired back with it.
      This gives a partial order rather than a total one, since two operators can simply be
      incomparable. What makes it interesting is that ordinary functions do not
      automatically respect it. The square root does, the square does not, and which
      functions do respect it turns out to be a deep question with a complete answer.
    in_csd: >
      Used in the corpus's entropy and channel results, where inequalities between operators
      are the working currency rather than a decoration -- data processing, subadditivity
      and the trace-distance contraction are all statements in this order. It also underpins
      the operator-convexity development the corpus carries, which is what supports several
      of the entropy results. Standard machinery, imported rather than claimed, but not
      trivial: the failure of naive intuitions here is a recurring source of error in
      quantum information, and having the correct statements formalised is part of what
      makes the entropy chain trustworthy.
    mathematical: >
      The partial order in which A is at most B when B minus A is positive semidefinite.
      Operator monotone and operator convex functions are those respecting it under the
      functional calculus; the square root and the logarithm are operator monotone while the
      square is not, and Loewner's theorem characterises the monotone ones exactly as those
      with an analytic continuation mapping the upper half-plane to itself. The corpus
      consumes the order in its entropy and channel inequalities.
    person: >
      Charles Loewner (1893-1968), born Karel Lowner in Lany near Prague to a Jewish family,
      studied at the German university in Prague under Georg Pick and held positions in
      Berlin, Prague again and Louisville after fleeing the Nazi occupation in 1939, ending
      at Syracuse and then Stanford from 1951. His 1923 work on the Bieberbach conjecture
      introduced the differential equation that became, eighty years later, the basis of the
      Schramm-Loewner evolution. The 1934 paper on operator monotone functions established
      exactly which functions respect this order -- a question that looked technical and
      turned out to matter for quantum information half a century later.
    term: Loewner order
    eponyms: [Loewner]
    status: standard-mathematics
    hook: >
      A way of saying one operator is larger than another, and the reason the natural functions of operators are the ones that respect it.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Loewner_order

  - slug: mach-zehnder
    layman: >
      A beam is divided along two paths by a half-silvered mirror and recombined at a second
      one. Whether the output emerges bright or dark depends on the difference in length
      between the two routes, even when the source is dimmed until only one particle is in
      the apparatus at a time. Block one path and the pattern vanishes, replaced by a simple
      even split. It is the cleanest laboratory setting in which the question of what
      happened in between becomes pressing, because the particle apparently must have
      sampled both routes and yet always arrives whole.
    in_csd: >
      The standard arena for the corpus's interference twins, including the interaction-free
      measurement and the quantum eraser. Its value to the programme is that it forces an
      account to say something definite about the unmeasured alternative, which is exactly
      where interpretations differ and where a substrate theory owes the most explanation.
      The eraser variant is the sharper one, since it shows that the interference can be
      recovered after the fact by discarding which-path information, which constrains any
      story in which the path was simply definite all along.
    mathematical: >
      A two-path interferometer with two balanced beam splitters, whose output port
      intensities depend on the relative phase accumulated between the arms. Unlike the
      Michelson arrangement the two paths are spatially separated and traversed once each,
      which is what makes it the natural setting for which-path discussions: an object or
      detector can be placed in one arm without disturbing the other.
    person: >
      Ludwig Mach (1868-1951) and Ludwig Zehnder (1854-1949) devised the interferometer
      independently in 1891 and 1892, Zehnder publishing first. Ludwig Mach was the son of
      Ernst Mach, the Vienna physicist and philosopher whose critique of absolute space and
      time influenced Einstein directly and whose positivism shaped the Vienna Circle; the
      son worked as his father's collaborator and later edited his papers. Zehnder was
      Swiss, took his doctorate under Rontgen at Wurzburg, and taught at Freiburg and Basel.
    term: Mach-Zehnder interferometer
    eponyms: [Mach]
    status: standard-mathematics
    hook: >
      Split a particle's path, bring it back, and what arrives depends on a route it can be shown never to have taken.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Mach%E2%80%93Zehnder_interferometer

  - slug: malus-law
    layman: >
      Send polarised light through a second polariser oriented at an angle to the first and
      the fraction that gets through follows the square of the cosine of that angle: full
      transmission when aligned, none when crossed, and a half on average at forty-five
      degrees. Malus discovered this in 1808, more than a century before quantum mechanics,
      as a fact about beams of light. It is the same rule as the quantum prediction for a
      single particle measured along a tilted axis, which makes it the simplest possible
      check on any account of where outcome probabilities come from -- and the one place
      where the classical and quantum statements coincide exactly.
    in_csd: >
      The corpus derives it as a volume ratio rather than assuming it, which makes it the
      smallest complete instance of the programme's central claim: the region of states
      giving one outcome has exactly the fraction of the total volume that the cosine-
      squared rule demands. It is the case where the general argument can be followed
      entirely by hand, which is pedagogically valuable and analytically dangerous in equal
      measure -- it is also where the two-level accident is easiest to mistake for the
      general situation, since the sphere makes the geometry so tractable that one can
      forget it is special.
    mathematical: >
      The transmitted intensity through crossed polarisers is proportional to the squared
      cosine of the angle between them, matching the Born weight for a spin measurement
      along the corresponding axis. In the corpus it is derived as a volume ratio rather
      than assumed, making it the smallest complete instance of the central claim -- and the
      case where the two-level accident is most easily mistaken for the general situation,
      since the sphere renders the geometry unusually tractable.
    person: >
      Etienne-Louis Malus (1775-1812) was born in Paris, entered the Ecole Polytechnique in
      its first cohort, and served as an engineer in Napoleon's Egyptian campaign,
      contracting the plague at Jaffa and never fully recovering. He discovered polarisation
      by reflection in 1808 -- the story is that he was looking through a calcite crystal at
      sunlight reflected from the windows of the Luxembourg Palace and noticed the two
      images changing in brightness as he rotated it. He coined the term polarisation, won
      the Academy's prize for his mathematical theory of double refraction, and died at
      thirty-six.
    term: Malus's law
    eponyms: [Malus]
    status: standard-mathematics
    hook: >
      The oldest quantitative rule about measurement outcomes, and the first thing any account of the Born rule has to reproduce.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Malus%27s_law

  - slug: mermin-inequality
    layman: >
      Bell's conflict shows up in averages over many runs, and the margin by which quantum
      mechanics beats the classical bound is modest -- a factor of the square root of two.
      Add more particles and the disagreement sharpens into one about signs that must all
      come out consistently and cannot. What is striking is that the margin grows
      exponentially with the number of parties, so far from washing out as systems get
      larger, the conflict becomes more pronounced. That is the opposite of what one would
      expect if quantum effects were a small-scale phenomenon giving way to classical
      behaviour in aggregate.
    in_csd: >
      The corpus carries the multi-party form alongside the two-party one so that its
      contextuality results are not tied to the smallest case, and the growth of the
      violation is the reason it matters rather than being a generalisation for its own
      sake. Together with the GHZ obstruction it establishes that the conflict is a
      structural feature at every size, which is a stronger obligation for a substrate
      account to meet: whatever produces the correlations must keep producing them, more
      strongly, as parties are added. An account that reproduced the two-party case by some
      special mechanism would be exposed here.
    mathematical: >
      A family of multipartite Bell inequalities whose classical bound is exceeded by
      quantum mechanics by a factor growing exponentially in the number of parties. The
      growth is the point: the conflict with local realism strengthens rather than washes
      out as systems are enlarged, which is the opposite of what a picture in which quantum
      behaviour gives way to classical behaviour at scale would predict.
    person: >
      David Mermin, American, was born in 1935, took his degrees at Harvard, and spent his
      career at Cornell, where he was for many years director of the Laboratory of Atomic
      and Solid State Physics. He is known for unusually lucid writing on quantum
      foundations as much as for his research -- the phrase shut up and calculate is his,
      coined in 1989 as a criticism of the attitude rather than an endorsement of it, and
      frequently misattributed to Feynman. He gave these multi-party inequalities in 1990,
      and co-authored with Ashcroft the solid-state textbook that taught the subject to a
      generation.
    term: Mermin inequality
    eponyms: [Mermin]
    status: standard-mathematics
    hook: >
      With more parties the conflict with common sense stops being statistical and becomes arithmetic, and it grows with the number of participants.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/GHZ_experiment

  - slug: pauli-matrices
    layman: >
      The simplest quantum system needs a way to describe measurements along different
      directions in space, and three matrices -- one per axis -- do the whole job. Every
      observable of a two-level system is a combination of them and the identity, so the
      three of them exhaust what can be asked. Their most important property is that they
      fail to commute: measuring along one axis and then another gives a different result
      from the reverse order, and the precise amount by which they fail is the concrete face
      of the uncertainty principle for spin.
    in_csd: >
      Used everywhere the corpus touches spin. The detector settings in the Bell and GHZ
      results are built from them, the singlet correlations are computed with them, the
      Bloch picture is their geometry, and the Tsirelson bound is proved in terms of them.
      Standard machinery, and the corpus claims nothing about the matrices themselves, but
      they are not incidental: the concreteness they provide is what makes the empirical
      twins computable rather than schematic, and several results that would be awkward in
      the abstract become finite calculations once the setting is written in this basis.
    mathematical: >
      Three traceless Hermitian involutions on a two-dimensional space, pairwise
      anticommuting, which together with the identity form a basis of the Hermitian
      operators there. Their products close into the algebra of the quaternions up to
      factors of i, and the exponentials of i times real combinations of them give exactly
      the special unitary group in two dimensions -- which is the double cover of the
      rotation group, and the reason a spin-half state returns to itself only after two full
      turns.
    person: >
      Wolfgang Pauli (1900-1958) was born in Vienna, was Ernst Mach's godson, and wrote a
      review of general relativity at nineteen that Einstein praised and that remained
      standard for decades. He took his doctorate at Munich under Sommerfeld, worked at
      Gottingen, Copenhagen and Hamburg, and held a chair at the ETH Zurich from 1928,
      spending the war years at Princeton. He formulated the exclusion principle at twenty-
      four and won the Nobel Prize for it in 1945. Famously severe as a critic, he is the
      source of the phrase not even wrong; his correspondence with Jung about physics and
      psychology ran for decades.
    term: Pauli matrices
    eponyms: [Pauli]
    status: standard-mathematics
    hook: >
      Three small matrices that generate everything a single quantum bit can do.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Pauli_matrices

  - slug: peres-criterion
    layman: >
      Deciding whether two systems are genuinely entangled or merely classically correlated
      is in general a hard computational problem. There is a strikingly simple necessary
      test: perform a transposition on one half of the joint description only, leaving the
      other half alone. Transposition is a perfectly innocent operation on a state by
      itself, so if the result of doing it to half a joint state fails to be a legitimate
      state at all -- if it acquires a negative eigenvalue -- then the original could not
      have been a mixture of independent pieces. For the two smallest cases the test is also
      sufficient, so entanglement there is fully decidable by one calculation.
    in_csd: >
      Carried in the corpus alongside the Bell results as the structural counterpart to
      them: Bell inequalities detect entanglement through statistics that an experiment
      could measure, this detects it through algebra performed on the description. Having
      both matters because they are not equivalent -- there exist entangled mixed states
      that violate no Bell inequality, so a programme that identified entanglement with Bell
      violation would be conflating two different things. For a reconstruction, keeping the
      distinction visible is part of not overclaiming what the non-locality results
      establish.
    mathematical: >
      If a bipartite state is separable then its partial transpose is positive semidefinite.
      The converse holds in dimensions two by two and two by three, and fails above, where
      bound entangled states with positive partial transpose exist -- states that are
      entangled but from which no entanglement can be distilled. The test is a single
      eigenvalue computation, which is what makes it useful given that deciding separability
      in general is NP-hard.
    person: >
      Asher Peres (1934-2005) was born Aristide Pressman in Beaumont-de-Lomagne in France to
      a Jewish family from Poland; the family survived the occupation in hiding. He
      emigrated to Israel in 1949 and took his doctorate at the Technion in Haifa under
      Nathan Rosen -- the Rosen of the Einstein-Podolsky-Rosen paper -- and spent his career
      there. He gave the partial-transpose test in 1996, co-authored the quantum
      teleportation protocol in 1993, and wrote a 1993 textbook on quantum theory admired
      for its refusal to be vague. His maxim that unperformed experiments have no results is
      a fair summary of his position.
    term: Peres criterion
    eponyms: [Peres]
    status: standard-mathematics
    hook: >
      A test for entanglement that is a single arithmetic operation: transpose half the system and look for a negative number.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Peres%E2%80%93Horodecki_criterion

  - slug: poisson-bracket
    layman: >
      In classical mechanics the rate at which any quantity changes is given by a bracket of
      that quantity with the energy. The bracket takes two functions on the space of
      possible states and returns a third, and it obeys the same structural laws as the
      quantum commutator -- antisymmetry, linearity, a product rule, and the Jacobi
      identity. This is why a deterministic classical flow underneath and an operator
      description on top are not rival languages but two views of one structure, and it is
      the formal content behind the correspondence principle.
    in_csd: >
      Load-bearing for the programme's ambition, since the ontic side is a deterministic
      measure-preserving flow and the epistemic side is operator dynamics, and the bracket
      is what relates them. Without a shared structure the two levels would be connected
      only by analogy and the claim that quantum mechanics is what the substrate looks like
      when isolated would be a slogan. The corpus's formal content here is at the pointwise
      and volume level -- the Kahler compatibility and the invariance of the measure --
      while the manifold-level symplectic geometry, closedness of the form and the top-power
      identity on the projective space itself, remains outside what the proof assistant can
      currently express and is recorded as such.
    mathematical: >
      The bilinear antisymmetric bracket on functions of phase space determined by the
      symplectic form, satisfying the Jacobi identity and generating Hamiltonian flow. Its
      structural agreement with the commutator is what underlies the correspondence
      principle and Dirac's quantisation prescription. The corpus's formal content here is
      the pointwise Kahler compatibility and the invariance of the measure; the manifold-
      level symplectic statements remain outside the proof assistant's current reach.
    person: >
      Simeon Denis Poisson (1781-1840) was born at Pithiviers, entered the Ecole
      Polytechnique in 1798 where Laplace and Lagrange spotted him immediately, and taught
      there and at the Sorbonne, becoming one of the dominant figures of French mathematical
      physics. He introduced the bracket in 1809 in work on planetary perturbations. His
      name attaches to results across probability, mechanics, electrostatics and elasticity;
      the Poisson distribution appeared in a book on the probability of judicial verdicts
      and was largely ignored for fifty years. He was politically conservative and, as an
      examiner, is said to have obstructed Galois.
    term: Poisson bracket
    eponyms: [Poisson]
    status: standard-mathematics
    hook: >
      The classical ancestor of the commutator, and the reason a deterministic flow can look like quantum dynamics.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Poisson_bracket

  - slug: ramsey-interferometry
    layman: >
      Rather than driving a system continuously and watching how it responds, give it a
      brief nudge, let it evolve freely for a long while, then nudge it again and look. The
      phase accumulated during the free interval shows up as an interference pattern in the
      final measurement, and the longer the interval the finer the resolution -- the fringes
      narrow in proportion to the wait. The trick is that the free interval is undisturbed,
      so nothing about the driving field broadens the line. Atomic clocks work this way, and
      the definition of the second rests on it.
    in_csd: >
      The corpus uses it in the metrology strand, where precision limits are stated and the
      standard scaling with the number of probes is compared against the improved scaling
      that entangled probes permit. That strand consumes the formalised dynamics rather than
      contributing to the reconstruction, and the corpus lists it among the adjacent arms
      whose theorems are independent consumers of the foundational layer rather than steps
      in a cascade from it. It is present because a formalisation claiming practical reach
      should be able to state a metrological bound and the protocol achieving it.
    mathematical: >
      A two-pulse scheme in which the accumulated relative phase during free evolution
      produces fringes whose spacing narrows in inverse proportion to the free-evolution
      time. Because the interrogation happens during an interval when no driving field is
      present, the linewidth is set by the interval rather than by the field, which is what
      makes the method the basis of atomic frequency standards and hence of the definition
      of the second.
    person: >
      Norman Ramsey (1915-2011) was born in Washington DC, the son of a West Point officer,
      and took degrees at Columbia, Cambridge and Columbia again under Isidor Rabi. He
      worked on radar at the MIT Radiation Laboratory and on the Manhattan Project at Los
      Alamos, where he was responsible for assembling the weapons on Tinian, and afterwards
      helped found Brookhaven National Laboratory before a long career at Harvard. He
      invented the separated-oscillatory-fields method in 1949 and received the 1989 Nobel
      Prize for it, at seventy-four.
    term: Ramsey interferometry
    eponyms: [Ramsey]
    status: standard-mathematics
    hook: >
      Two short pushes separated by a long wait measure a frequency far better than one long push. It is how clocks are built.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Ramsey_interferometry

  - slug: schrodinger-equation
    layman: >
      The standard formulation writes down an equation of motion for the quantum state --
      the state's rate of change is the energy operator applied to it, times a factor of i
      -- and takes that equation as a fundamental law, justified by the fact that its
      predictions come out right. In this programme the equation is a conclusion rather than
      a starting point. If the underlying motion preserves the relations between states and
      does not jump, then rigidity forces it to act as a symmetry at each moment, and
      continuity forces a generator for that family of symmetries to exist. What emerges is
      the familiar equation, with the Hamiltonian appearing as the generator rather than
      being posited.
    in_csd: >
      This is the second of the programme's two pillars, the first being the Born rule, and
      the corpus demonstrates both on a single sector so that they are not two separate
      stories about two different objects -- a reconstruction that derived probability on
      one arena and dynamics on another would not have shown they are the same theory. The
      route is Wigner rigidity followed by the finite-dimensional Stone theorem, both
      unconditional necessities. Honest scope, and it is the standing caveat of the whole
      programme: the sector is posited rather than derived, so what is proved is that a flow
      on such a sector must take this form, not that such a flow must exist.
    mathematical: >
      For a strongly continuous projective flow preserving transition probabilities, the
      induced evolution is a one-parameter unitary group and so is generated by a
      Hamiltonian, giving the usual equation of motion up to phase. The phase lift is where
      a residue sits: the coboundary datum is carried as a hypothesis, since Bargmann's
      theorem, which would supply it from continuity alone, is beyond the proof assistant's
      current reach.
    person: >
      Erwin Schrodinger (1887-1961) was born in Vienna and studied there under Hasenohrl,
      holding positions at Jena, Stuttgart, Breslau and Zurich before succeeding Planck at
      Berlin in 1927. He wrote the wave equation in 1926 during a stay at Arosa, and shared
      the Nobel Prize with Dirac in 1933 -- the year he left Germany in disgust at the Nazi
      regime, though not himself Jewish. After an unhappy return to Graz and a hurried
      escape in 1938 he settled at the Dublin Institute for Advanced Studies for seventeen
      years. He disliked the probabilistic reading his own equation received and devised the
      cat in 1935 as a reductio against it, an argument now more often quoted as an
      illustration of the thing it was meant to refute.
    term: Schrodinger equation
    eponyms: [Schrodinger]
    status: standard-mathematics
    hook: >
      Quantum dynamics is not postulated here. It is what a continuous symmetry-preserving flow is forced to look like.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Schr%C3%B6dinger_equation

  - slug: shor-algorithm
    layman: >
      The security of much of modern encryption rests on the belief that splitting a large
      number into its prime factors is impractically slow -- the best known classical
      methods take time growing nearly exponentially in the number of digits. A quantum
      computer can do it in time growing only polynomially, by converting factoring into a
      question about the period of a repeating sequence and using interference to read that
      period off in one go. The consequence is that a sufficiently large quantum computer
      would break the public-key cryptography currently protecting most internet traffic.
    in_csd: >
      Present in the corpus as the most demanding of the algorithm witnesses, with the
      reversible modular arithmetic beneath it built and verified rather than assumed --
      which is the bulk of the work, since the number-theoretic circuits are where the
      complexity lives. It bears on the substrate story only as scope evidence: the
      formalised machinery is strong enough to carry a full algorithm with its arithmetic,
      not merely a schematic. The corpus makes no claim about cryptography, and the cost-
      model work that would bear on real-world resource estimates was extracted to a
      separate repository.
    mathematical: >
      Quantum order-finding gives the period of modular exponentiation in polynomial time,
      from which a factor follows classically with high probability by an elementary
      argument going back to Legendre. The quantum content is entirely in the period-
      finding, which uses the quantum Fourier transform; the reduction from factoring to
      order-finding is classical, and the corpus's work is largely in the reversible modular
      arithmetic the circuit requires.
    person: >
      Peter Shor, American, was born in 1959, won a silver medal at the International
      Mathematical Olympiad, and took degrees at Caltech and MIT before joining Bell
      Laboratories in New Jersey. He published the factoring algorithm in 1994, turning
      quantum computing from a theoretical curiosity into a subject with substantial
      government funding almost overnight. He also gave the first quantum error-correcting
      code in 1995, answering the objection that decoherence made the whole enterprise
      hopeless, and moved to a chair at MIT in 2003.
    term: Shor's algorithm
    eponyms: [Shor]
    status: standard-mathematics
    hook: >
      Factoring large numbers efficiently, which would break most deployed public-key cryptography.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Shor%27s_algorithm

  - slug: stern-gerlach
    layman: >
      Send atoms through a magnetic field that is stronger at one end than the other and
      they should, on classical expectations, spread into a continuous smear as their
      randomly oriented magnetic moments are deflected by varying amounts. They do not. They
      split into distinct beams. Worse for intuition, sorting by one direction and then
      sorting the output by a different direction destroys the earlier sorting, so a beam
      known to be up along one axis, once sorted along another, is no longer purely up along
      the first. The experiment shows both that outcomes are discrete and that measurements
      interfere with each other.
    in_csd: >
      The reference example for measurement in the corpus, and a useful one for the
      programme because the second half is the important half. Discreteness alone is
      reproduced by any theory with the right spectrum; the destruction of the earlier
      sorting is contextuality in its most concrete laboratory form, and it is what a
      substrate account must produce rather than explain away. This account produces it by
      making the measurement context fix which partition the outcome is read against, so a
      second measurement along a different axis is not re-reading a stored property but
      reading a different partition of the same microstate.
    mathematical: >
      A spatial separation of beams according to the eigenvalues of a spin component along
      the field gradient, with successive measurements along non-commuting axes failing to
      preserve the earlier outcome. Historically the experiment predates the concept of
      spin, having been designed to test space quantisation of orbital angular momentum in
      the old quantum theory, and the correct value emerged from a cancellation of two
      errors that was only understood later.
    person: >
      Otto Stern (1888-1969) was born at Sohrau in Upper Silesia to a Jewish grain-merchant
      family, took his doctorate at Breslau, and worked with Einstein at Prague and Zurich
      before positions at Frankfurt, Rostock and Hamburg. Walther Gerlach (1889-1979) was
      born at Biebrich and took his doctorate at Tubingen. They performed the experiment at
      Frankfurt in 1922, reportedly aided by Stern's cheap cigars, whose sulphur helped
      develop the faint silver deposit. Stern left Germany in 1933 for the Carnegie
      Institute of Technology in Pittsburgh and received the Nobel Prize in 1943; Gerlach
      remained, led part of the German nuclear programme, and was interned at Farm Hall in
      1945.
    term: Stern-Gerlach experiment
    eponyms: [Stern]
    status: standard-mathematics
    hook: >
      The experiment that showed measurement outcomes come in discrete lumps, and that asking a second question can undo the answer to the first.
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Stern%E2%80%93Gerlach_experiment

  - slug: contextuality
    layman: >
      It is natural to think a measurement reveals a property the system already had, and
      that measuring something else compatible alongside it is irrelevant to the answer.
      Quantum mechanics denies it. There are collections of questions for which no
      assignment of answers works at all, no matter how the answers are chosen, provided
      each answer is required to be the same regardless of which companion questions are
      asked. This is not a claim about disturbance -- the companion measurements need not
      touch the system -- and not a claim about ignorance, since the failure is not that we
      cannot find the assignment but that none exists. The result depends on the company the
      question keeps.
    in_csd: >
      CSD is contextual by construction, so this is a commitment rather than a concession,
      and the distinction is worth being clear about because contextuality is often
      presented as a cost that hidden-variable theories reluctantly pay. Here it is
      structural. The substrate carries a definite microstate; a measurement context fixes
      which partition of the epistemic space the outcome is read against; change the context
      and you change the partition, so the same microstate can legitimately yield different
      answers to what looks like the same question. Nothing is hidden in that story and
      nothing is disturbed. The corpus proves the obstruction rather than asserting it, and
      pairs it with an explicit contextual model that reproduces the singlet correlations,
      so the position is two-sided: contextuality is not a gap in the account but the shape
      of it.
    mathematical: >
      Over a single shared measurable state space, no jointly-defined assignment of outcomes
      to the four CHSH settings reproduces the singlet correlations. Companion statements
      give the same conclusion over any shared probability space at every setting pair, and
      for GHZ. Note that the corpus's own fibre analysis reaches a related but logically
      distinct conclusion -- that for three levels and above the contextual content cannot
      live on the projective base -- by an argument from covariance and non-negativity
      rather than from Kochen-Specker, and the two must not be conflated.
    term: Contextuality
    status: proved-in-corpus
    source: curated
    hook: >
      An outcome can depend on what else you chose to measure alongside it. Not a disturbance, and not ignorance: no consistent set of answers exists.
    lean:
      module: CsdLean4/LF6/C1BellConsistency.lean
      theorem: no_compatible_global_chsh_assignment_realises_singlet
    external:
      - text: "Stanford Encyclopedia: the Kochen-Specker theorem"
        url: https://plato.stanford.edu/entries/kochen-specker/

  - slug: hidden-variables
    layman: >
      If quantum mechanics is about our knowledge rather than about the world, something
      must be there to be known. A hidden-variable theory supplies it: an underlying state,
      definite at all times, of which the quantum description is a summary. A series of
      famous theorems constrain such theories severely, and they are routinely reported as
      having ruled them out. They have not. What they rule out is the well-behaved ones --
      those that are local, or those that assign values independently of context -- and the
      price of survival is precisely stated rather than vague. A theory willing to pay it is
      not refuted by anything proved so far, which is why such theories continue to be
      constructed and taken seriously.
    in_csd: >
      The constraint surface is a hidden-variable theory in the technical sense, and the
      programme accepts the price openly rather than looking for a loophole. What Bell's
      argument forbids is a theory that is both local and non-contextual; this one is
      neither, and the corpus proves the relevant obstructions itself rather than citing
      them, which matters because a reconstruction that cited them would be taking on trust
      the very results that constrain it. Two things are easy to get wrong here. The
      substrate is not a repair of quantum mechanics: it reproduces the same predictions at
      leading order, and where it might one day differ is recorded in the corpus as owed by
      the papers rather than claimed. And the quantum state is not the hidden variable; it
      is the summary. The hidden variable is the point of the constraint surface underneath
      it, which is why the state can be epistemic without the theory being about nothing.
    mathematical: >
      No product partition of a shared hidden-state space reproduces the singlet
      correlations, at any setting pair, and likewise for GHZ. The obstruction is proved
      over an arbitrary measurable state space rather than exhibited on a chosen model, so
      it constrains the whole class rather than one construction. What survives is a
      contextual and non-local assignment, which the corpus also exhibits explicitly, so the
      pair of results delimits the space of viable theories from both sides rather than only
      ruling out.
    term: Hidden variables
    status: proved-in-corpus
    source: curated
    hook: >
      A theory can have a definite underlying state and still reproduce quantum mechanics, provided it gives up the right thing. The no-go theorems say what.
    lean:
      module: CsdLean4/LF6/ForcedContextuality.lean
      theorem: no_product_partition_realises_singlet
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hidden-variable_theory

  - slug: measurement-problem
    layman: >
      Left alone, a quantum system evolves smoothly and reversibly, and superpositions
      persist indefinitely. Measured, it yields one definite result and the alternatives are
      gone. Textbook quantum mechanics supplies both rules and no account of which applies
      when, or of what counts as a measurement. It is not a puzzle about interpretation
      only: the two rules are mathematically incompatible, since one is linear and
      reversible and the other is neither, so a theory containing both without a boundary
      between them is not a closed description. Every serious account of quantum mechanics
      is in the end a proposal about which of the two to modify, or about how to make the
      boundary principled.
    in_csd: >
      The programme's answer is that nothing abrupt happens on the substrate. The underlying
      motion is deterministic and measure-preserving throughout; what changes at a
      measurement is which region of the epistemic space the trajectory is recorded against.
      Where this becomes sharp rather than a story is the trilemma, and it is the sharpest
      thing the corpus has to say on the subject: it proves that no measure-preserving map
      implements exact collapse, that no continuous propagator correlates a pointer
      everywhere on a connected arena, and that buying collapse accuracy costs improbability
      in the ready state, with the exchange rate stated quantitatively. So the account does
      not dissolve the problem by assertion. It proves which of the desirable properties
      cannot be had together, and then says which one it gives up, which is the difference
      between an interpretation and a result.
    mathematical: >
      Three impossibility results on the pointer arena: no exact collapse by a measure-
      preserving map, no everywhere-correlating continuous propagator on a connected arena,
      and a quantitative bound trading collapse accuracy against ready-state improbability.
      All three are CSD-free in statement -- the first is measure theory, the second
      topology, the third an estimate -- so they constrain any account of measurement
      carrying the corresponding structure, and a rival programme inherits them rather than
      being able to cite them against this one.
    term: Measurement problem
    status: proved-in-corpus
    source: curated
    hook: >
      Evolution is continuous and reversible; measurement is abrupt and not. The theory contains both and does not say where one stops.
    lean:
      module: CsdLean4/RecordLayer/MeasurementConstraints.lean
      theorem: no_exact_collapse
    external:
      - text: "Stanford Encyclopedia: measurement in quantum theory"
        url: https://plato.stanford.edu/entries/qt-issues/

  - slug: collapse
    layman: >
      The standard account says that on measurement the state discontinuously becomes the
      one matching the result obtained. Whether that is a physical event or a bookkeeping
      update is the oldest dispute in the subject, and the two readings are not idle
      variants: if it is physical, it is unlike anything else in the theory, being abrupt,
      irreversible, unexplained, and apparently instantaneous across arbitrary distances. If
      it is bookkeeping, then the theory owes an account of what is being updated and of why
      the update looks the way it does.
    in_csd: >
      There is no collapse on the substrate, and the corpus makes that a theorem rather than
      a preference: no measure-preserving map implements exact collapse, so a deterministic
      volume-preserving substrate could not contain such a process even if one wanted it to.
      That converts a stance into a constraint. What replaces collapse is a record. The
      apparatus and the system evolve together under the ordinary dynamics, the record
      selects which epistemic region the trajectory realises, and the update rule that
      textbooks postulate separately is simply what the record layer does. The state that
      changes is the summary, not the world, which is the same thing that happens when a
      classical probability distribution is conditioned on an observation -- nothing
      physical collapses, and nobody has ever thought it did.
    mathematical: >
      No measure-preserving map on the arena implements exact collapse. The accuracy of any
      approximate collapse is bounded against the improbability of the ready state, so
      approximate collapse is available but priced, and the price is stated rather than
      gestured at. The post-measurement update appears instead as the block projection
      realised on the pointer arena, where it is derived from the record construction rather
      than postulated as a second dynamical rule.
    term: Collapse
    status: proved-in-corpus
    source: curated
    hook: >
      The state does not jump here. Something is proved about why it cannot, rather than assumed about why it need not.
    lean:
      module: CsdLean4/RecordLayer/MeasurementConstraints.lean
      theorem: no_exact_collapse
    external:
      - text: "Stanford Encyclopedia: collapse theories"
        url: https://plato.stanford.edu/entries/qm-collapse/

  - slug: typicality
    layman: >
      If the world is deterministic, where do the odds come from? The typicality answer is
      that they come from counting. Fix what you know about a system, look at the space of
      states consistent with that knowledge, and ask what fraction of that space leads to
      each outcome. Nothing is random. You are ignorant of which state you have, and the
      fractions are facts about the space rather than about chance. The move is old -- it is
      how Boltzmann explained why gases behave thermodynamically -- and its persistent
      difficulty is equally old: the fractions depend on how the space is measured, so the
      choice of measure is doing the work and had better not be arbitrary.
    in_csd: >
      This is the engine the whole account runs on, and it is why the Born rule can be a
      theorem here rather than a postulate. The outcome weight is a ratio of volumes on the
      constraint surface, and the law of large numbers converts that ratio into observed
      frequencies over repeated preparations. Two points the programme is careful about. The
      measure doing the counting is not chosen but forced by symmetry, which is the direct
      answer to the standard objection that typicality arguments presuppose the measure that
      justifies them -- an objection Valentini and others press against this style of
      argument generally, and one that must be met rather than deflected. And frequencies
      are forced by the law of large numbers, not by an ergodic or single-flow argument:
      that route is recorded in the corpus as a proved dead end rather than an unexplored
      option, since a single projective flow provably cannot pin the measure.
    mathematical: >
      For independent trials, the observed relative frequency of an outcome converges almost
      surely to its volume fraction. Combined with the volume-ratio identification of the
      Born weight, this delivers Born frequencies at general dimension. The independence
      hypothesis is pairwise rather than full, which is weaker than the standard statement
      and worth recording; the corpus separately flags that a deterministic substrate owes
      an account of why repeated preparations should be independent at all, which is where
      its most plausible observable departure from quantum mechanics would appear.
    term: Typicality
    status: proved-in-corpus
    source: curated
    hook: >
      Probability without randomness: the answer is fixed, and the question is what fraction of the possibilities give it.
    lean:
      module: CsdLean4/LF1/GeneralFrequency.lean
      theorem: freq_tendsto_of_iid
    external:
      - text: "Goldstein, typicality in statistical mechanics and quantum theory"
        url: https://arxiv.org/abs/1110.1349

  - slug: psi-epistemic
    layman: >
      There are two ways to read the quantum state. Either it is a thing in the world, in
      which case its abrupt change on measurement is a physical event needing explanation,
      and the theory owes an account of a process unlike any other it contains. Or it is a
      description of what an observer knows, in which case the change is an update and needs
      no more explanation than revising a probability after looking in a box. The second
      reading is the epistemic one, and its attraction is that it makes the measurement
      problem evaporate. Its difficulty, pressed hard for decades and sharpened by theorems
      in the last fifteen years, has always been saying what the state is knowledge OF.
    in_csd: >
      The programme is epistemic about the state and answers the standing difficulty
      directly: the state is knowledge of which region of the constraint surface the
      microstate lies in. That gives the position a floor, which is what distinguishes it
      from readings that are epistemic all the way down and end up denying there is anything
      to be ignorant about. The consequence is a two-level discipline the whole account
      rests on. The projective space of states, the outcome regions and the probabilities
      are epistemic; the substrate and the measure that weights it are ontic. Keeping those
      apart is the single easiest thing to get wrong in describing the programme, and the
      corpus's fibre analysis sharpened it further: the projective space is a lossy
      epistemic projection, with the record-forming content living above it rather than on
      it.
    mathematical: >
      Not a theorem and not stated as one. It is the reading OF the theorems: the projective
      state space carries the epistemic outcome partition, while the typicality measure
      weighting those regions is defined on the substrate and is where the ontic content
      sits. A reader wanting formal content should follow the anchored entries instead. The
      distinction matters because theorems in the literature constrain epistemic readings
      sharply, and which of those constraints bite depends on exactly what the state is
      taken to be knowledge of.
    term: Psi-epistemic
    status: definition
    source: curated
    hook: >
      The quantum state describes what is known, not what is there. Everything else in the programme follows from taking that literally.
    external:
      - text: "Epistemic views of the quantum state"
        url: https://en.wikipedia.org/wiki/Epistemic_view_of_quantum_states

  - slug: determinism
    layman: >
      A deterministic theory fixes the future from the present with no room left over.
      Quantum mechanics appears to violate this at the most basic level: systems prepared as
      identically as we know how to prepare them give different results, and the theory
      offers no reason why this one rather than that. The deterministic response is that the
      preparations were not in fact identical. They agreed on everything the preparation
      procedure fixed and differed in what it did not, and the observed spread reflects that
      unrecorded variation rather than genuine chance. Whether that response is available is
      not a matter of taste; it is constrained by theorems, and it survives only at a price.
    in_csd: >
      The substrate is deterministic and its motion preserves volume, so nothing
      probabilistic is built into the dynamics anywhere. Probability enters exactly once, as
      ignorance of which microstate a preparation produced, and the volume of the region
      compatible with what the preparation fixed is what turns that ignorance into numbers.
      This is the manoeuvre classical statistical mechanics makes, deliberately so, and the
      programme is explicit that it inherits both the strengths and the debts of that
      tradition. The most interesting debt is recorded rather than hidden: a deterministic
      substrate with memory would show departures from the independence the frequency
      argument assumes, which would appear as deviations from ordinary shot noise in high-
      statistics data. That is one of the few places the account could differ observably
      from quantum mechanics, and it needs no Planck-scale energies.
    mathematical: >
      Positional. The formal content is that the flow is measure-preserving and the outcome
      weights are volume ratios; determinism is the reading of that structure rather than a
      separate statement, and no theorem in the corpus asserts it. The nearest formal
      statement is the measure-preservation field itself, which is carried as a structure
      field for physical admissibility -- an ontic postulate listed as such in the axiom
      ledger rather than something derived.
    term: Determinism
    status: definition
    source: curated
    hook: >
      The substrate has no chance in it. The randomness is in which state you happen to have, not in what it does.
    external:
      - text: "Stanford Encyclopedia: causal determinism"
        url: https://plato.stanford.edu/entries/determinism-causal/

  - slug: kochen-specker
    layman: >
      Bell's argument needs two separated wings and a statistical comparison across many
      runs. Kochen and Specker showed something starker and purely local. In three
      dimensions or more there is a finite collection of measurement directions such that no
      assignment of definite answers is consistent with the algebraic relations among them
      -- relations that any account must respect, since they hold as identities among the
      observables themselves. No experiment is needed to see the contradiction, no appeal to
      separation or to relativity, and no statistics. The original construction used 117
      directions; later ones need as few as 18. It is arguably the cleanest impossibility
      result in the subject.
    in_csd: >
      The programme is contextual, so this theorem is a constraint it satisfies rather than
      a threat, and no work is needed to accommodate it. What the corpus is careful about is
      a related trap that is easy to fall into. Its own fibre analysis found that at three
      levels and above the contextual content cannot sit on the projective base and must
      live in the fibre above it -- and that conclusion does NOT come from Kochen-Specker or
      from Gleason. Those theorems constrain non-contextual value assignments, and this
      account is contextual, so they simply do not apply to it. The obstruction is instead
      covariance together with non-negativity, which kills the radial state-only base
      density. Keeping the two arguments apart matters, because borrowing this theorem's
      authority for a result it does not support would be a subtle and rather tempting
      overclaim.
    mathematical: >
      For Hilbert spaces of dimension at least three there is no non-contextual assignment
      of definite values to all observables consistent with the functional relations among
      commuting sets. Finite explicit sets of vectors witness it -- 117 in the original
      construction, 18 in the smallest known. Dimension two escapes, the same exception that
      afflicts the original Gleason theorem and the same accident that makes the qubit an
      unreliable guide to the general case.
    person: >
      Simon Kochen, Belgian-born American, spent his career at Princeton working in model
      theory and number theory before this excursion into foundations; he later co-authored
      the free will theorem with John Conway. Ernst Specker (1920-2011) was Swiss, born in
      Zurich, and spent his career at the ETH Zurich, working in logic, combinatorics and
      set theory. Their joint paper appeared in 1967 in the Journal of Mathematics and
      Mechanics, though Specker had published the essential idea in a theological journal in
      1960 -- an unusual venue chosen because he framed the question in terms of scholastic
      debates about counterfactual knowledge.
    term: Kochen-Specker theorem
    status: standard-mathematics
    source: curated
    hook: >
      A finite set of questions with no consistent set of answers. Contextuality proved by counting, with no reference to distance or separation.
    external:
      - text: "Stanford Encyclopedia: the Kochen-Specker theorem"
        url: https://plato.stanford.edu/entries/kochen-specker/

  - slug: copenhagen
    layman: >
      The traditional teaching account treats the measuring apparatus as classical and
      outside the quantum description, and the state's change on measurement as a primitive
      fact rather than a process to be analysed. Bohr's emphasis was that the experimental
      arrangement as a whole determines what can meaningfully be said, so asking what the
      system was doing between measurements is not answered but rejected as ill-formed. It
      is not so much an explanation of measurement as a principled decision not to require
      one. That has been enough to do a century of successful physics with, which is why it
      survived, and why its critics have never displaced it in practice.
    in_csd: >
      The disagreement is narrow and specific, and worth stating precisely rather than
      caricaturing. This programme agrees the state is not a physical thing, and agrees that
      the classical-quantum divide is where the interesting content sits; what it declines
      to do is leave that divide unanalysed. Measurement here is an ordinary physical
      interaction on the substrate that produces a record, and the two rules the traditional
      account keeps apart are one process seen at two levels of description. This is an
      interpretive contrast rather than an empirical one -- no experiment distinguishes
      them, and none is proposed -- and this entry states a position rather than reporting a
      theorem, which is why it carries no anchor.
    mathematical: >
      No formal content. Included so a reader comparing accounts can place this one, and so
      that the absence of an anchor is visible rather than inferred from silence. The corpus
      contains nothing that bears on this position directly, which is itself informative:
      the disagreement is about whether the measurement boundary requires analysis, and that
      is not the kind of question a theorem settles.
    term: Copenhagen interpretation
    status: definition
    source: curated
    hook: >
      The oldest position, and the one that declines the question. Measurement is where the theory stops rather than something it explains.
    external:
      - text: "Stanford Encyclopedia: the Copenhagen interpretation"
        url: https://plato.stanford.edu/entries/qm-copenhagen/

  - slug: many-worlds
    layman: >
      If the smooth reversible evolution is the whole story and is never interrupted, then
      after a measurement the apparatus and the observer are themselves in a superposition
      of having registered each result. The Everettian move is to accept that at face value:
      every outcome happens, in branches that no longer interfere with one another and so
      cannot compare notes. The attraction is real -- nothing is added to the formalism, no
      collapse, no extra variables, no boundary to draw. The difficulty moves elsewhere, to
      explaining why the branches carry the weights they do, since on the face of it every
      branch simply happens and counting them does not obviously give the Born rule.
    in_csd: >
      This account is single-trajectory, and that is settled rather than an open question --
      it is recorded among the programme's non-goals precisely so it is not re-litigated.
      One microstate, one history, one outcome; the alternatives are regions of the
      epistemic space that the trajectory did not enter, not places where something else
      occurred. The contrast on probability is the instructive part. Because a definite
      state is retained throughout, the difficulty Everettian accounts face -- why branch
      weights should be the observed ones, which has generated a substantial decision-
      theoretic literature -- does not arise in that form. It reappears as a question about
      which measure weights the regions, and that question has an answer here: uniqueness
      under symmetry. This entry is positional and no theorem states it.
    mathematical: >
      No formal content. The formal contrast is that outcome weights are volume ratios on a
      single constraint surface rather than weights distributed across branches, so the
      measure problem takes the form of identifying a measure on one space -- which the
      corpus does, by a uniqueness argument -- rather than justifying a weighting over many
      worlds, which is where the Everettian literature has concentrated.
    term: Many-Worlds interpretation
    status: definition
    source: curated
    hook: >
      Keep the smooth evolution and drop the single outcome. This programme does the opposite.
    external:
      - text: "Stanford Encyclopedia: Everett's relative-state formulation"
        url: https://plato.stanford.edu/entries/qm-everett/

  - slug: bohmian-mechanics
    layman: >
      The pilot-wave account gives particles definite positions at all times and has them
      guided by a wave that evolves by the ordinary equation. It is deterministic, it
      reproduces the quantum predictions exactly, and it purchases this with explicit non-
      locality: the guidance of one particle depends instantaneously on where all the others
      are, however far away. Its historical importance is hard to overstate. It is the
      standing existence proof that a deterministic account of quantum mechanics is possible
      at all, which is what makes the frequent claim that such accounts are impossible a
      misreading of the theorems rather than a consequence of them.
    in_csd: >
      This is the closest relative among established accounts and the similarities are
      genuine: determinism, a definite underlying state, non-locality accepted openly rather
      than avoided, and probabilities arising from ignorance about the underlying state
      rather than from chance. The differences are in ontology and in what is assumed. There
      the wave is a physical guiding field and the particle configuration is the additional
      variable; here the underlying object is the constraint surface itself and the quantum
      state is epistemic rather than a guiding thing, so there is no dual ontology of wave
      plus particles. The equilibrium assumption supplying Bohmian probabilities -- that the
      initial distribution matches the squared wavefunction -- has its counterpart here in
      the typicality measure, with the difference that the measure is forced by symmetry
      rather than assumed as a starting condition. That is the standing objection Bohmian
      accounts must answer, and it is where this account claims to do better.
    mathematical: >
      No formal content. The nearest formal point of contact is that both accounts derive
      probabilities from a measure over an underlying state space rather than postulating
      the Born rule, and both must therefore answer where that measure comes from. The
      answers differ in kind: quantum equilibrium is an assumption about initial conditions,
      possibly justified by a relaxation argument, whereas the measure here is fixed by a
      uniqueness theorem under symmetry.
    term: Bohmian mechanics
    status: definition
    source: curated
    hook: >
      The nearest neighbour: deterministic, definite configurations, explicitly non-local. The differences are in what plays the role of the state.
    external:
      - text: "Stanford Encyclopedia: Bohmian mechanics"
        url: https://plato.stanford.edu/entries/qm-bohm/

  - slug: spontaneous-collapse
    layman: >
      Rather than interpreting quantum mechanics, spontaneous-collapse theories modify it.
      The state undergoes rare random localisations -- in the original proposal about once
      every hundred million years for a single particle -- which is negligible for one
      particle and overwhelming for anything macroscopic, since a large object's
      constituents are correlated and any one localisation carries the whole along.
      Superpositions of large objects therefore decay on their own, with no observer
      required. Because the modification carries parameters, it makes predictions differing
      from standard quantum mechanics, and experiments in interferometry and in low-noise
      mechanical resonators have been narrowing the allowed parameter range for decades.
    in_csd: >
      The contrast is instructive and slightly uncomfortable, and is worth stating in the
      uncomfortable direction. These theories are honest in a way this programme currently
      is not: they can be killed by an experiment, and have been substantially constrained
      by several. This account reproduces standard quantum mechanics exactly at leading
      order, so at present nothing distinguishes it empirically, and its own documentation
      records the candidate departures as owed by the paper sequence rather than established
      -- the correction tower is theory-gated. It also differs structurally: there is no
      stochastic modification here, the substrate is deterministic and volume-preserving,
      and definite outcomes come from records rather than from a physical collapse process,
      which the corpus proves a measure-preserving substrate could not contain.
    mathematical: >
      No formal content. The structural contrast is that no stochastic term modifies the
      dynamics here; the corpus proves separately that exact collapse is unavailable to a
      measure-preserving substrate, so the mechanism these theories add is one this account
      is formally barred from using. The empirical contrast is sharper still: their
      parameters are experimentally constrained, while this account currently makes no
      prediction differing from standard quantum mechanics.
    term: Spontaneous collapse (GRW)
    status: definition
    source: curated
    hook: >
      The rival that changes the predictions, and can therefore be ruled out by experiment. This programme cannot.
    external:
      - text: "Stanford Encyclopedia: collapse theories"
        url: https://plato.stanford.edu/entries/qm-collapse/

  - slug: qbism
    layman: >
      QBism takes the epistemic reading to its conclusion. Quantum states are an agent's
      personal degrees of belief, probabilities are subjective in the Bayesian sense, and a
      measurement outcome is an experience for the agent who made it rather than a fact
      about the world independent of them. The measurement problem dissolves entirely,
      because there was never a physical state to collapse and no observer-independent
      process to explain. The cost is that the theory declines to describe a world
      independent of agents, which its proponents regard as the honest conclusion and its
      critics as an abandonment of what physics is for.
    in_csd: >
      The agreement is genuine and the disagreement is sharp, which makes this the most
      useful comparison on the list. Both accounts hold that the quantum state is epistemic,
      so both refuse to treat its update on measurement as a physical event, and both
      therefore avoid the measurement problem in its usual form. But this account keeps an
      ontic floor. The constraint surface exists whether or not anyone is looking,
      probabilities are volume ratios on it rather than personal credences, and the measure
      is forced by symmetry rather than chosen by an agent -- so two agents cannot
      rationally disagree about it, which in QBism they may. The slogan version is fair to
      both: epistemic states over an ontic substrate, rather than epistemic states over
      nothing. This entry is positional and no theorem states it.
    mathematical: >
      No formal content. The formal contrast is that outcome weights here are ratios of an
      invariant measure on a state space, which is not an agent-relative quantity and is
      fixed by a uniqueness theorem rather than by anyone's credence -- so two agents cannot
      rationally disagree about it, which in a thoroughly personalist reading they may.
    term: QBism
    status: definition
    source: curated
    hook: >
      Epistemic all the way down: the state is one agent's betting odds, and there is nothing underneath. This programme keeps a floor.
    external:
      - text: "Stanford Encyclopedia: QBism and quantum Bayesianism"
        url: https://plato.stanford.edu/entries/quantum-bayesian/
