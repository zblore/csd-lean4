  - slug: feynman-kac
    reviewed: 2026-09-29
    image:
      file: img/feynman-kac.jpg
      alt: "Photograph of Mark Kac at a desk"
      caption: "Mark Kac, who recognised his own Wiener integrals in the path integral."
      credit: "Konrad Jacobs, Erlangen, copyright MFO, CC BY-SA 2.0 DE, via Wikimedia Commons"
      licence: "CC BY-SA 2.0 DE"
      source: https://commons.wikimedia.org/wiki/File:Mark_Kac.jpg
      article: https://en.wikipedia.org/wiki/Mark_Kac
    hook: >
      The Feynman-Kac formula makes the path integral rigorous in imaginary time, as the
      solution of a heat equation with a potential is an average over Brownian paths weighted
      by the potential they travelled through.
    layman: >
      Feynman's path integral says that a quantum amplitude is a sum over all histories, each
      contributing a phase. It's the most intuitive statement in quantum mechanics and the
      hardest to make mathematically respectable, since the sum is over an infinite-dimensional
      space of paths and the phases refuse to settle down.

      Kac noticed that the difficulty is the phase rather than the sum. Replace time by
      imaginary time and the oscillating phases become decaying weights, and the resulting
      integral over paths is a perfectly ordinary average with respect to the measure that
      describes Brownian motion, which mathematics already had. The formula that comes out
      says: to solve a diffusion equation with a potential, start a Brownian path at your
      point, follow it for the given time, weight it by the exponential of minus the potential
      accumulated along the way, and average.

      This is the workhorse behind quantum Monte Carlo methods, behind the modern treatment of
      Schrodinger operators, and behind option pricing in finance, which is the same equation
      wearing different clothes. The real-time path integral remains a formal device, and the
      imaginary-time version is a theorem.
    in_csd: >
      The programme's claim is that the formulations of quantum mechanics agree, so the path
      integral had to be proved rather than gestured at, and the corpus builds it in a chain of
      rows. The perturbed heat semigroup comes first, as a Dyson series around the free
      semigroup with the potential as the interaction and no generator written down. The
      time-sliced Wiener functional comes next. The formula is then the statement that the two
      limits of the same time-sliced expression agree, one converging by the Trotter product
      formula and one by the convergence of Riemann sums along a continuous path.

      The same chain supports the rest of the programme's Feynman row: a unitary Schrodinger
      propagator on square-integrable functions, the heat semigroup, and the Nelson result
      that connects the diffusion picture to the Schrodinger equation. The honest boundary is
      that a Brownian motion is a hypothesis rather than a construction, since the Mathlib pin
      doesn't build one, and that the potential is bounded and continuous.
    mathematical: >
      For a Brownian motion B with almost surely continuous paths, bounded continuous V and
      bounded f in L2 of d-dimensional space, feynmanKac states that the perturbed heat
      semigroup applied to f at x equals the expectation of f(x + B_t) times exp(minus the
      integral of V(x + B_s) over [0, t]), for almost every x. The operator side converges by
      tendsto_trotter_perturbedHeat once exp_smul_neg_potential identifies the exponential of a
      multiplication operator with multiplication by the exponential; the Wiener side is the
      time-sliced functional of TimeSlicedWiener.lean with tendsto_riemannSum and domination;
      the two limits agree because their integrals over every finite-measure set agree.

      IsBrownianVec B P is a hypothesis (BrownianVec.lean); the extension to f in L2 alone is
      FeynmanKacL2.lean. The real-time path integral is not claimed anywhere in the corpus; the
      unitary propagator is obtained from the semigroup route instead.
    person: >
      Mark Kac heard Feynman describe the path integral at a Cornell seminar in the late
      1940s and
      recognised his own Wiener-integral formulas in it, which is how the formula came to carry
      both names although the two men worked on different problems. Kac's paper that year is
      about distributions of Wiener functionals and never mentions quantum mechanics.

      Richard Feynman's thesis of 1942 and his 1948 paper introduced the sum over histories as
      a reformulation of quantum mechanics, and it remains the language of quantum field
      theory, where the imaginary-time version is what lattice calculations actually compute.
    term: Feynman-Kac formula
    eponyms: [Kac]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/Probability/FeynmanKac.lean
      theorem: feynmanKac
    site_link:
      url: https://www.constraintsurfacedynamics.com/roadmap
      text: The roadmap's fifth stage is the controlled continuum limits this formula belongs to
