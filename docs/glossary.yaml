  - slug: preparation-region
    reviewed: 2026-09-14
    hook: >
      Repeating the same experiment is a physical claim, and this is what it refers to, a
      region of the arena and not a single point, that the preparation procedure lands the
      world in.
    layman: >
      No laboratory procedure controls a system completely. Cool an atom, align a
      polariser, fire the same laser pulse, and what you fix is everything your
      instruments can see, while the world keeps the rest. So preparing the same state a
      thousand times can't mean putting the world in the same complete condition a
      thousand times, and the preparation region is the honest version of that phrase, and
      it's where quantum statistics begin.

      The preparation region is the set of all points of the arena, the space of complete
      world-states, that are compatible with what the procedure fixed. Each run of the
      experiment is one point drawn from that region, so the statistics of many runs are
      the statistics of the region, and how often an outcome occurs is how much of the
      region leads to it.

      Once the matter is put this way, quantum probability stops being mysterious in kind.
      It's the same ignorance over a region of possibilities that classical statistical
      mechanics runs on when it describes a gas by its temperature rather than by the
      position of every molecule. The work is in proving that the numbers come out right,
      and that's where the theorems about measures and volumes earn their keep.
    in_csd: >
      The preparation region is a primitive of the corpus's first formal layer, a
      measurable subset of the arena with positive volume under the arena's natural
      measure, the Liouville measure. Repeated trials draw from it independently, each
      draw governed by the arena's measure restricted to the region and rescaled so the
      region as a whole has total weight one, and every frequency theorem in the corpus is
      stated relative to it, so the weight of an outcome is the volume of the part of the
      region that leads to that outcome, divided by the volume of the whole region.

      The refinement to pure states carries its own honesty note. When the measure is
      passed to the continuous setting, the set of arena points lying over a single
      quantum state has zero volume, so restricting the ambient measure to it isn't
      defined. Pure preparations therefore carry a posited law for trials on that set
      rather than one derived from the ambient measure, and the corpus states this
      wherever the posit is used.
    mathematical: >
      prepMeasure conditions the Liouville measure on the preparation region, repeated
      trials are i.i.d. draws from it, and the LF1 main theorem sends empirical
      frequencies to volume weights almost surely.

      The conditional-measure formula and the weight-as-volume-ratio identity, the weight
      of an outcome region O being the Liouville volume of O intersected with the
      preparation region divided by the volume of the preparation region, are the exported
      infrastructure the higher layers consume.
    term: Preparation region
    status: definition
    source: curated
    lean:
      module: CsdLean4/LF1/Preparation.lean
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: >
        TN6 covers outcome sectors and sequential measurement, where preparation regions do their work
    related: [outcome-region, epistemic-measure, born-weight, von-neumann-entropy, typicality-volume]

  - slug: measurement-context
    hook: >
      A measurement isn't a question put to the quantum state, as it's a piece of
      apparatus, and the apparatus brings its own way of dividing the world into outcomes.
    layman: >
      Quantum mechanics is contextual. You can't assign answers to every possible
      measurement at once, as you can only assign them to the measurements one actual
      arrangement of equipment can perform together, so the measurement is never just a
      quantity written on paper. It's a physical context, and which context is in place
      makes a difference to what can happen, and the measurement context is the concept
      that records this.

      CSD takes the context seriously enough to make it a definite piece of data. A
      context is the information the apparatus contributes, so for every possible state of
      the world it gives a set of rates, one per outcome, saying how strongly each outcome
      is favoured. Fix the context and the regions of the arena that lead to each outcome
      are fixed, and if you change the context a genuinely different division of the arena
      applies.

      A useful comparison is a referee's rulebook. The rulebook belongs to the referee,
      exists before the match starts, and doesn't consult the players, and in the same way
      the context belongs to the apparatus, is fixed before the run, and doesn't depend on
      which state was prepared. The comparison stops there, as a rulebook is written by
      people, whereas in CSD the natural context is read off the geometry of the state
      space.
    in_csd: >
      Formally a context is a rate field on the base of the arena, the space of quantum
      states, so to every point of the base it assigns a list of outcome weights, each
      non-negative and all summing to one, in a way that lets the resulting regions be
      measured. The preparation plays no part in this assignment, and that independence is
      one of the programme's stated requirements, so the corpus builds its outcome basins
      from the context's field alone. The canonical context reads its rates off the moment
      map, the map that extracts the Born weights from the geometry of the state space, so
      even the rates are geometry rather than bookkeeping.

      Contextuality then has a precise home. Distinct contexts induce distinct partitions
      of the arena. The no-go theorems against assigning context-independent answers to
      every measurement at once are proved in the corpus, and alongside them stands a
      positive witness, a contextual model that reproduces the statistics of the singlet
      state, the standard two-particle entangled state, in full.
    mathematical: >
      A ContextField consists of rate functions p -> Fin N -> R, measurable per outcome,
      nonnegative, summing to one at every point, and the preparation-independence of the
      field is the A7 requirement.

      The induced basins are measurable and pairwise disjoint with Born-weight epistemic
      probabilities, and the canonical instance takes rate := momentMap with measurability
      supplied by the moment-map infrastructure.
    term: Measurement context
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-4
      text: The fourth primer page explains how the apparatus fixes which outcomes are available
    related: [contextuality, carving, luders-rule, kochen-specker, pointer-basis]

  - slug: single-trajectory
    hook: >
      There's one world and it follows one path, so probability lives in how experiments
      are repeated and not in how the world evolves, and theorems rather than wording keep
      the two apart.
    layman: >
      A deterministic account of quantum mechanics faces a fork, as either the world
      splits, or there's a vast space of possible world-states and one actual path through
      it. CSD takes the second branch without hedging, with a single trajectory on a
      single arena evolving deterministically, and this is what the programme means by a
      single-trajectory theory.

      You can then ask where statistics come from, and the answer is repetition. Each run
      of an experiment re-prepares the system, which lands the world at a fresh point of
      the preparation region, the set of world-states compatible with the preparation
      procedure, so a thousand runs sample the region a thousand times. The frequencies
      those samples produce are what the volume theorems compute, so an outcome's share of
      the runs matches its share of the region's volume.

      What statistics don't come from is one run watched forever. Whether a single
      evolving path eventually visits every part of its space in fair proportion is a
      property called ergodicity, and it's a different and much stronger property than
      repeated preparation, so the programme doesn't rely on it.
    in_csd: >
      CSD is a single-trajectory theory, so physical reality is one deterministic path on
      the arena. Its typicality is the typicality of repeated preparation, ignorance
      spread across runs and priced by the arena's natural measure restricted to the
      preparation region, and not the averaging of one path over time.

      The corpus even proves the cautionary half. The unitary flow projected onto the
      space of quantum states isn't ergodic, so a time-average route to the Born weights
      is closed at that level. That's a narrow fact about one flow on the projective space
      and not an objection to the mechanism, because the frequency theorems never invoke
      ergodicity, and that they don't need it is exactly the point.
    mathematical: >
      The LF1 chain formalises the repetition, with i.i.d. draws from the conditioned
      Liouville measure, indicator processes per outcome, and the strong law of large
      numbers delivering almost-sure convergence of empirical frequencies to volume
      weights.

      The non-ergodicity of the epistemic unitary flow on the projective sector is a
      proved theorem kept as a boundary marker, as the volume route and the time-average
      route aren't the same route, and only the first is claimed.
    term: Single trajectory
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-1
      text: The first primer page sets out the guiding idea of one trajectory underneath
    related: [determinism, constraint-surface, where-do-probabilities-come-from, first-passage-race, typicality]

  - slug: witness-and-engine
    hook: >
      A working model proves that the machinery runs, and it doesn't prove that the
      machinery is the world, so CSD names that distinction and audits itself against it.
    layman: >
      Every foundational programme faces the same temptation. Build a concrete model in
      which your mechanism visibly works, and it becomes fatally easy to announce that the
      mechanism explains everything the model contains, but the model had quantum
      mechanics built into its bones, so of course quantum mechanics came out. The
      distinction between witness and engine is CSD's vocabulary for resisting that
      temptation.

      The engine is the general machinery, typicality over a preparation region, outcome
      weights given by volumes, and a measure forced by symmetry. A witness is a concrete
      arena on which the engine demonstrably runs, with familiar structures such as the
      space of quantum states and their unitary evolution built in from the start.

      The claim that the engine runs and here is a witness is provable, and it's proved.
      The claim that quantum mechanics is therefore derived would be an overclaim, and the
      corpus's own guard documents exist to keep it from being made.
    in_csd: >
      The finite-dimensional quantum-mechanical closure is the flagship example, a
      concrete projective witness carrying the symmetric measure and unitary evolution, on
      which the full reconstruction pipeline executes. It demonstrates the engine, and it
      isn't quantum mechanics derived from CSD, because the witness supplies structures a
      derivation would have to earn.

      The distinction is enforced and not just stated. A manifest names exactly which end-
      to-end claims are backed by theorems, an automated check rejects phrasings that have
      been retracted as overclaims, and results are labelled by which side of the line
      between realisation and derivation they sit on.
    mathematical: >
      The witness tier is SectorData instances on CP^(N-1) and on the Kahler arena, with
      the measure bridge proved instance-by-instance rather than assumed abstractly, and
      the engine tier is the frequency and volume theorems quantified over the structures,
      consuming the postulates as hypotheses.

      The audit tier is mechanical, as the connectivity manifest and the claims guard are
      scripts that fail the build when prose claims outrun the proved connectivity.
    term: Witness and engine
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-limits
      text: The scope page is where the difference between a witness and a derivation is kept honest
    related: [lf1-main-theorem, what-is-machine-checked, measurement-flow, born-volume-ratio, de-isolation]

  - slug: field-arena
    reviewed: 2026-09-14
    hook: >
      Take finitely many field modes, cap the number of quanta each can hold, and the
      whole toolbox of quantum field theory, propagators, light cones, Wick's theorem and
      thermal states, reappears as exact theorems on one finite arena.
    layman: >
      Everything else in this glossary concerns systems with finitely many outcomes, while
      the working theory of the physical world is quantum field theory, which has
      infinitely many modes and no limit on the number of quanta. A reconstruction that
      can't even gesture at fields would be a reconstruction of a toy, and the field arena
      is that gesture made precise, deliberately at finite resolution.

      A mode is one independent way a field can vibrate, like a single note on a string,
      and a quantum is one unit of excitation of a mode, the field-theoretic version of a
      particle. The field arena keeps finitely many modes and lets each hold at most some
      fixed number of quanta, and on the space of quantum states built from those
      configurations the canon of field theory is re-proved as exact finite theorems. Free
      propagators, which describe how a disturbance travels when nothing interacts,
      oscillate at the right frequency. The effects of an interaction are priced linearly
      in the strength of the coupling. There's a genuine light cone, a limit on how fast
      an influence can spread, with an explicit bound on the velocity. Thermal states
      satisfy the KMS condition, the exact condition that characterises equilibrium at a
      given temperature.

      This is breadth, and it's labelled as such, as it's the image of standard physics
      inside the programme's arena and not the frontier of the reconstruction.
    in_csd: >
      The field arena is the stage for the programme's continuous-variable track. It's the
      space of quantum states over configurations of finitely many modes with a fixed cap
      on the quanta per mode, and its role in the programme is honestly bounded. It's the
      isolated-piece image, as it shows that the structure of effective field theory
      survives at finite cutoff on exactly the kind of arena the reconstruction runs on,
      and no continuum limit and no renormalisation-group flow is claimed.

      The bridge theorems tie it back to the record layer. Observations on the arena are
      pairings with a density, dynamics act by kicks, observables supported on disjoint
      sets of modes commute exactly, and the Lieb-Robinson light cone bounds how fast a
      record cell in the fibre can be steered from afar.
    mathematical: >
      FieldArena K N is the projective space over configurations of K modes at cutoff N.
      Mode-local subalgebras are unital star-subalgebras supported on their blocks, free
      and interacting drives are exact matrix exponentials, and the two-point and four-
      point functions close into Wick's pairing sum at explicit thresholds.

      The commutator bound decays factorially in graph distance with velocity constant
      2e^2 times the coupling norm, and composite arenas compose by mode concatenation,
      with no-signalling exact for all states, entangled included.
    term: Field arena
    status: definition
    source: curated
    lean:
      module: CsdLean4/CV/ArenaBridge.lean
    site_link:
      url: https://www.constraintsurfacedynamics.com/roadmap
      text: The roadmap's sixth stage is the quantum-effective sector this arena belongs to
    related: [lieb-robinson-bound, wick-theorem, no-exact-finite-ccr, record-light-cone, interaction-price]

  - slug: isolation
    hook: >
      Being isolated isn't scene-setting, as it's the variable the whole theory turns on,
      and quantum mechanics is what isolated pieces of the arena look like from outside.
    layman: >
      Quantum mechanics works flawlessly for systems carefully shielded from everything
      else, and its rules seem to bend exactly when the shielding fails, at measurement,
      in decoherence, wherever the outside gets in. Most formulations treat this as a
      nuisance, and CSD treats it as the signal, with isolation as the concept that
      carries it.

      In CSD isolation is the operative condition. An isolated subsystem follows the
      smooth unitary rule, the reversible evolution textbook quantum mechanics prescribes,
      and measurement is de-isolation, the engineered ending of that condition. And the
      familiar quantum state describes exactly what an isolated piece of the arena
      presents to the outside world, so not the full condition of the piece but the part
      of it the rest of the world can see while the piece is sealed off.

      In slogan form, quantum mechanics is the physics of isolation, and the measurement
      rule is the physics of ending it.
    in_csd: >
      Isolation enters the formal layer as conditioning. The state of knowledge available
      at a preparation, given that the system is isolated, is the epistemic measure, which
      is exact on the visible coordinate, the quantum state, and spread evenly over the
      hidden fibre above it. This reading, that isolation is conditioning, is written into
      the definitions of the record layer.

      The complementary dynamical statement is the de-isolation tier. Coupling an isolated
      system to a pointer is what produces records, and the flows that do it are exhibited
      in the corpus. The same isolated-piece image frames the field track, as the
      continuous-variable arena shows standard physics reappearing on an isolated finite
      piece, and the corpus labels that as breadth rather than as the frontier.
    mathematical: >
      The epistemic measure implements conditioning on isolation (the P6 reading,
      isolation is conditioning), exact on the base coordinate with Haar measure on the
      fibre, and the de-isolation flows implement its termination.

      The open-system tier prices partial isolation quantitatively, with dephasing and
      damping semigroups with exact decay laws, and the Lindblad flow proved completely
      positive, so the effective dynamics of an imperfectly isolated system is a
      legitimate quantum channel at every time.
    term: Isolation
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-4
      text: The fourth primer page follows a system's trajectory in visibility and isolation
    related: [de-isolation, no-signalling, field-arena, lieb-robinson-bound, constraint-surface]

  - slug: moment-map
    reviewed: 2026-09-14
    hook: >
      The Born probabilities are coordinates, and the moment map reads them straight off
      the geometry of the space of quantum states, with no measurement postulate
      consulted.
    layman: >
      You can accept that probabilities are volumes and still find the link between a
      quantum state and its outcome weights opaque, and wonder why these particular
      numbers. Classical mechanics has an answer waiting. The state space of a classical
      system, its phase space, has a geometry in which every continuous symmetry comes
      paired with a conserved quantity, so turning the system about an axis pairs with
      angular momentum and shifting it in time pairs with energy. When a system has
      several such symmetries at once, their conserved quantities can be collected into a
      single map, the moment map, which sends each state to the list of values those
      quantities take there.

      The space of quantum states has exactly the right kind of symmetry. Each possible
      outcome contributes to the state with a size and an angle, the angle is called the
      phase, and turning the phase of one outcome's contribution changes nothing that can
      be measured. Turning each outcome's phase independently gives a family of
      symmetries, one circle of rotations per outcome, and together those circles form a
      torus. The moment map of that torus symmetry sends a state to a list of numbers, one
      per outcome, that add up to one, and if you compute the list it's the Born weights,
      the probabilities the textbook obtains by squaring the size of each contribution.

      So the probabilities were sitting in the geometry all along, as the conserved
      quantities of phase rotation.
    in_csd: >
      The moment map is the corpus's route to the Born numbers that draws no regions by
      hand. The weight of an outcome is the corresponding coordinate of the moment map, a
      quantity fixed by the geometry of the state space and forced by the requirement that
      it generate the torus symmetry, with no partition drawn and no operational input
      consulted. It also supplies the canonical measurement context, whose rate field is
      the moment map itself, so even the rates of the record layer are geometric.

      Downstream, pushing the symmetric measure on the state space forward through the
      moment map gives the uniform law on the space of probability lists. This is the
      Duistermaat-Heckman fact that converts statements about volumes into integrals over
      that space, and it closes the programme of obtaining the Born weights from volume in
      every finite dimension.
    mathematical: >
      For the torus action on CP^(N-1) the moment map sends a ray to its vector of squared
      amplitudes, the identity is proved as momentMap_mk_eq_inner_sq, and the moment map
      is forced by torus generation (torusGenerated_eq_momentMap). The joint pushforward
      of the Fubini-Study measure is (N-1)-factorial times Lebesgue measure on the open
      simplex, the flat Dirichlet law, proved via the Gaussian representation and a
      product-index bridge, and consumed by the unconditional volume-ratio and frequency
      theorems at every N.

      The defining equation is proved at manifold level, as the velocity field of the
      torus action is the Hamiltonian vector field of 2 sum theta_k mu_k for the Fubini-
      Study symplectic form (torusField_isHamiltonianVectorField), a moment map is unique
      up to a constant and the normalisation pins it, its image is exactly the standard
      simplex (range_momentMap), and the torus orbits are its integral curves. For any
      Hermitian H the Schrodinger flow is the Hamiltonian flow of minus twice the
      expectation of H (schrodingerField_isHamiltonianVectorField), and the torus is the
      diagonal case.

      The moment map is also a map between geometries. Its differential kills the torus
      directions and, on their Fubini-Study orthogonal complement, carries the Fubini-Study
      metric to the Fisher-Rao metric of the weights with constant one
      (fsMetric_eq_fisherRaoInner), so the Born weights of a state sit in the simplex at
      the statistical distances the quantum distances dictate.
    term: Moment map
    status: standard-mathematics
    source: curated
    external:
      - text: "Wikipedia: moment map"
        url: https://en.wikipedia.org/wiki/Moment_map
      - text: "Atiyah, Convexity and commuting Hamiltonians, Bull. LMS 1982"
        url: https://doi.org/10.1112/blms/14.1.1
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper B uses the moment map to push the measure to the simplex
    related: [kahler-form, duistermaat-heckman, poisson-bracket, fubini-study-measure, liouville-measure, fisher-rao-metric]

  - slug: lf1-main-theorem
    reviewed: 2026-09-14
    hook: >
      In a deterministic world with repeated preparations, the frequencies you observe
      converge to volume ratios with probability one, and the theorem is machine-checked
      with no randomness anywhere in the dynamics.
    layman: >
      Any account that says probability is volume owes one non-negotiable theorem. Run the
      experiment over and over, and the fraction of runs that give a particular outcome
      must actually approach the volume assigned to that outcome, because without that
      bridge "probability is volume" is a metaphor. This theorem is that bridge,
      formalised, and it's the foundation stone of the corpus.

      The setting is simple. The world evolves deterministically, and each run of the
      experiment draws a fresh complete world-state from the preparation region, the set
      of world-states compatible with the preparation procedure. A given outcome happens
      when the drawn world-state sits in the region of the arena belonging to that
      outcome, and the theorem says that, with probability one over the sequence of draws,
      the running frequency of the outcome converges to the region's share of the
      preparation region's volume. Probability one means the exceptional sequences of
      draws together have weight zero.

      The proof engine is the strong law of large numbers, the same theorem that keeps
      casinos solvent, applied to indicator variables, quantities that equal one when a
      run gives the outcome and zero otherwise, and which the deterministic evolution
      defines. Chance lives entirely in the sampling, and the physics never rolls dice.
    in_csd: >
      Every empirical claim in the corpus stands on this layer. The higher layers change
      what the regions are, from regions of the space of quantum states to regions sized
      by the Born weights to basins fixed by a measurement context, but the conversion
      from frequency to volume is always this theorem, applied through the layer's
      interface.

      The design is deliberately spare. The theorem handles one outcome region at a time,
      and statements about several outcomes at once are assembled by intersecting the
      corresponding probability-one events. The only hypothesis left to the caller is
      pairwise independence of the trial indicators, as integrability of the indicators,
      meaning that their averages are well defined, and identical distribution across
      trials are proved internally.
    mathematical: >
      LF1_main_theorem_ae (CsdLean4/LF1/MainTheorem.lean) says that for a trial model over
      an ontic setup and an outcome region O, the empirical frequencies of O converge
      almost surely to O's volume weight under the conditioned Liouville measure.

      The chain behind it, the conditional preparation measure, pullback events, indicator
      integrability and identical distribution, is exported as reusable infrastructure,
      and the whole layer carries no axioms beyond Lean's foundational three.
    term: LF1 main theorem
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF1/MainTheorem.lean
      theorem: LF1_main_theorem_ae
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: LF1 is the machine-verified typicality and frequency-convergence theorem this states
    related: [born-weight, typicality, witness-and-engine, born-volume-ratio, what-is-machine-checked]

  - slug: born-volume-ratio
    reviewed: 2026-09-29
    hook: >
      In every finite dimension the Born weight of an outcome equals a ratio of volumes in
      the space of quantum states, for every outcome and every state, with no genericity
      condition attached.
    layman: >
      Showing that probability equals volume for one contrived example proves little, as
      the claim earns its keep only at full strength, in every dimension, for every state,
      for every outcome, with no fine print. The Born volume ratio is the full-strength
      version, and it's the theorem that turns the volume story from an illustration into
      a derivation.

      Take a quantum state in any finite dimension, that is, a system with any finite
      number of possible outcomes. Its Born weight for a given outcome, the number the
      textbook computes by squaring the size of that outcome's contribution to the state,
      equals the volume of an explicitly described region of the space of quantum states
      divided by the volume of the whole space. The volume is measured with the Fubini-
      Study measure, the natural notion of size on that space, the one that respects its
      symmetry. The equality is exact rather than approximate, and it holds for every
      state, including states in which some outcomes have zero weight.

      The regions are barycentric cells over the probability simplex. The simplex is the
      set of all possible lists of outcome probabilities, a triangle when there are three
      outcomes, a tetrahedron when there are four, and so on, and a state's own list of
      probabilities is a point of it, so that point cuts the simplex into one cell per
      outcome. Nobody carved the cells to fit, as their sizes come out of the geometry.
    in_csd: >
      This is the derived side of the carving line in every finite dimension, the theorem
      that turned the volume story from realisation into derivation. The route runs
      through the moment map, which reads the Born weights off the geometry, and the
      Duistermaat-Heckman law, which says that pushing the symmetric measure on the state
      space forward through the moment map gives the flat law on the simplex, so the
      volume of a cell is an honest integral over the simplex, computed once and equal to
      the Born weight.

      Downstream, the frequency companion turns the identity into an empirical statement,
      as independent draws from the Fubini-Study measure give observed frequencies that
      converge jointly to the full vector of Born weights.
    mathematical: >
      fs_born_volume_ratio_N and its apex variant, in the unconditional form
      fs_born_volume_ratio_N_uncond (CsdLean4/LF4/BornRegionUncond.lean), say the Born
      weight of each of the N coordinates equals the Fubini-Study volume ratio of the
      corresponding barycentric region, unconditional in the preparation.

      The proof composes the Gaussian representation of the Fubini-Study measure, the
      product-index bridge to exponential laws, and the joint Dirichlet pushforward, and
      the earlier positivity hypothesis was retired by a per-cell dichotomy on closed
      simplex faces.
    term: Born volume ratio
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF4/BornRegionUncond.lean
      theorem: fs_born_volume_ratio_N_uncond
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper A is the volume-based account of outcome frequencies
    related: [born-weight, typicality-volume, fubini-study-measure, lf1-main-theorem, naimark-dilation]

  - slug: measurement-flow
    reviewed: 2026-09-29
    hook: >
      A deterministic, volume-preserving flow carries out a measurement, and the volumes
      of its pointer blocks are the Born weights, for every preparation.
    layman: >
      Saying that measurement is de-isolation dynamics is a picture, and the picture
      carries a debt, which is to exhibit actual dynamics, one deterministic map that
      respects the arena's volume, couples a system to a pointer, and sorts trajectories
      into outcome blocks of the right sizes. The measurement flow is the theorem that
      pays that debt.

      The flow exists, it preserves volume, and it's provably not the identity, so it
      genuinely does something. After it runs, the arena decomposes into pointer blocks,
      one per outcome, which are regions of starting points that end with the pointer
      showing that outcome. The volume of each block is exactly the Born weight of its
      outcome, and if you repeat the preparation many times the fraction of runs landing
      in each block converges to that weight, with probability one.

      There's no collapse anywhere. There's one deterministic map, run once per trial,
      plus ignorance of the starting point.
    in_csd: >
      This is the tier of the corpus that realises von Neumann's measurement scheme
      dynamically. In that scheme a measurement is an ordinary evolution of a larger
      system, obtained by adjoining a pointer to the system measured, an enlargement
      called a dilation. The dilation abstract measurement theory cites is here an actual
      flow on the enlarged arena, and that closes the gap between the volume results,
      which are purely kinematic, and the de-isolation picture. The outcome map for each
      individual starting point, saying which block a given microstate lands in, is
      delivered by the theorems that partition the arena into pointer blocks, and that
      discharges a debt the corpus had carried explicitly, the need for an outcome
      function assigning a result to each microstate.

      Its boundary is equally explicit. The flow realises measurement dynamics at the
      level of the space of quantum states, and whether a physical de-isolation
      interaction generates a pointer whose readings carry the Born measures on the ontic
      fibre is the open question that remains. The earlier form of that question, deriving
      the fibre mechanism from a mixing flow, was retired as mis-specified, as the fibre
      entry explains.

      Seen from the system alone, the measurement flow is a channel. Trace out the pointer
      after the flow has acted on a preparation that starts with the pointer ready, and
      the system's density operator is the de-isolation channel applied to its density
      operator before the measurement, so the operator is kept on the pointer basis and
      its coherences between different pointer readings are removed. No representative of
      the rays has to be chosen for this to hold, because the corpus supplies a canonical
      measurable one. The channel keeps entropy from decreasing, and the amount of
      classical information it transmits is exactly one bit per qubit, the pointer bit and
      nothing else.
    mathematical: >
      measurement_flow_born_frequency (LF5 capstone, CsdLean4/LF5/Capstone.lean) says the
      de-isolation flow is Fubini-Study measure-preserving with pointer-block volumes
      equal to the Born weights, and empirical block frequencies converge almost surely,
      for every unit preparation. The earlier genericity hypothesis was retired by the
      unconditional volume engine.

      The disjointness of the pointer blocks and the outcome map per microstate are
      separate, reusable theorems.

      measurementFlow_traceRight_barycenter_unitSection (LF6/MeasurementFlowChannel.lean)
      says the environment marginal of the flowed barycentre is deisolationChannel applied
      to the system's barycentre, with Projectivization.unitSection as the representative,
      so no section hypothesis remains. deisolationChannel_apply_eq_pinch identifies the
      channel's action with the pinching of Thermo/SecondLaw.lean,
      deisolationChannel_holevoCapacity (LF6/DeisolationCapacity.lean) gives log 2 as the
      greatest element of its single-letter Holevo range, and
      measurementFlow_vonNeumannEntropy_le is the entropy statement.
