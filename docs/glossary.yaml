  - slug: contextuality
    reviewed: 2026-09-12
    hook: >
      For some sets of quantum questions, no consistent answer sheet exists at all. CSD's
      response is to stop demanding one answer per question and to say instead what the
      answer depends on.
    layman: >
      It would be natural to believe that a measurement reveals a property the system
      already had, and that the property does not care what else happened to be measured
      alongside it. Call this the answer-sheet picture: every question has a pre-written
      answer, and the companion questions are irrelevant.

      Quantum mechanics refutes the picture outright. Two measurements are called
      compatible when they can be made together without either disturbing the other's
      result. There are collections of questions for which no answer sheet exists, not
      hidden or hard to find but provably nonexistent, once you demand that each answer
      stay the same across the different sets of compatible companions it could appear
      with. And this is not a matter of disturbance. The companion measurements are
      compatible, and need not touch the system at all.

      The conclusion has a name: outcomes are contextual. What you get depends on the
      company the question keeps.
    in_csd: >
      CSD does not grudgingly accommodate contextuality. It is built from it, and the
      distinction matters, because contextuality is usually presented as a tax that
      hidden-variable theories reluctantly pay. Here it is the architecture.

      The mechanism is this. The substrate, the underlying space of definite states, holds
      a definite microstate, and a measurement context fixes which partition of the
      epistemic space the outcome is read against, that is, which way the space of quantum
      states is divided into outcome regions. Change the context and you change the
      partition, so the same microstate can honestly answer differently. Nothing is hidden,
      nothing is disturbed, and no answer sheet is ever demanded.

      The corpus proves both halves of the story. The obstruction: no single global
      assignment of answers reproduces the correlations of the singlet, the entangled pair
      of particles used in the standard tests. The existence: an explicit contextual model
      does reproduce them. Impossibility plus a working alternative is a two-sided claim,
      and either half alone would be much weaker.
    mathematical: >
      Over one shared measurable state space, no jointly-defined outcome assignment for the
      four CHSH settings reproduces the singlet correlations. A separate result rules out a
      different class: no setting-local (product) pair of response functions reproduces the
      singlet at every setting pair. The corpus keeps these apart deliberately, since
      neither subsumes the other, and proves the GHZ analogue for three parties.

      One conflation to avoid, flagged in the corpus itself: its fibre analysis is not a
      Kochen-Specker or Gleason consequence. Those constrain non-contextual assignments,
      which this account never makes. The fibre argument comes from covariance plus
      non-negativity, a different argument with a different shape, and, unlike the Bell
      obstructions above, it is a constraint chain rather than a no-go: whether contextual
      content can stay on the projective base at N of three and above is open in both
      directions, not settled.
    term: Contextuality
    status: proved-in-corpus
    source: curated
