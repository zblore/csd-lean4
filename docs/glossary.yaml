  - slug: does-csd-make-new-predictions
    kind: question
    hook: >
      Not yet, and it does not pretend otherwise: the current claim is
      reproduction with fewer postulates, verified -- with candidate departures
      recorded as owed, not asserted.
    layman: >
      The blunt question deserves a blunt answer. At present, CSD claims no
      experiment whose outcome it predicts differently from quantum mechanics.
      The corpus's empirical suite consists of formal twins of the flagship
      experiments -- interference, Bell tests, quantum eraser, interaction-free
      measurement and the rest -- each reproduced within the programme's frame.

      What the programme claims instead is a different kind of gain: the same
      predictions from less. Fewer postulates, a probability rule computed
      rather than assumed, a measurement account with one law instead of two --
      and the whole thing machine-checked, which no rival interpretation
      currently offers.

      Whether genuinely new physics emerges -- departures at regimes the
      reconstruction constrains -- is treated as owed future work in the
      papers, not as a present claim. A reader should hold the programme to
      exactly that standard.
    in_csd: >
      The empirical layer's design is reproduction with receipts: every
      flagship quantum experiment in the suite has a CSD-side twin, and the
      validation ledger tracks what each twin actually establishes. The
      interpretive contrast with rivals is stated as interpretive -- the
      corpus's own comparison entries say no experiment currently
      distinguishes the positions.

      The disciplined phrasing matters because overclaiming here is the
      commonest failure of reconstruction programmes; the repository's claims
      guard exists to keep the public statements at exactly the strength of
      the theorems.
    mathematical: >
      The Empirical tree: the QM branch reproducing standard results in the
      operational formalism, and the CSD branch re-deriving the same
      experiments through the volume machinery -- double-slit, singlet and
      CHSH, GHZ, CGLMP, eraser and Elitzur-Vaidman among them -- with the
      chain capstones connecting frequencies to Born weights on the
      programme's own route.
    term: Does CSD make new predictions?
    status: definition
    source: curated
