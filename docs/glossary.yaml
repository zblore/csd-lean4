  - slug: steane-code
    reviewed: 2026-09-11
    hook: >
      Seven qubits protect one: the Steane code was the first to correct any single-qubit
      error by using the same classical Hamming code twice, once for bit flips and once for
      phase flips.
    layman: >
      Classical error correction has a gem called the Hamming code: seven bits carry four
      bits of information, arranged so that if any single bit flips, a few parity checks
      (does this group of bits contain an even number of ones?) announce which one. Quantum
      errors come in two flavours. A bit flip turns a zero into a one; a phase flip changes
      the sign between the two branches of a superposition, which no classical code can
      even see. Steane's insight was that one and the same Hamming code can police both
      flavours at once, provided its parity checks are compatible with each other in a
      precise sense.

      They are, and the result is seven physical qubits protecting one logical qubit, the
      encoded qubit whose information is spread across all seven, against any single-qubit
      error. Measure six stabiliser checks, measurements designed to reveal whether an
      error has occurred without revealing the protected information itself; the pattern
      of answers spells out which qubit went wrong and in which way.

      The construction, a classical code and its own dual, used once for each flavour of
      error, is called CSS after Calderbank, Shor and Steane, and it is the template from
      which most practical quantum codes descend.
    in_csd: >
      The Steane code is the first genuine CSS instance of the corpus's stabiliser layer.
      The rows of the Hamming parity-check matrix give three bit-flip checks and three
      phase-flip checks; the compatibility condition that CSS codes require is
      machine-checked; and the general stabiliser machinery then applies wholesale, so
      that the code space has dimension exactly two by the general trace formula: one
      logical qubit.

      Both logical states are exhibited concretely, as uniform superpositions over the
      Hamming code's row space and over its all-ones coset, and are proved to be left
      unchanged by all sixty-four elements of the stabiliser group and to be orthonormal.
      The logical bit-flip and phase-flip operators act on them as a genuine encoded qubit.
      Single-qubit errors are proved to produce syndromes, patterns of check answers, that
      are nonzero and pairwise distinct: the distance-three property, which is what makes
      every single error identifiable. Honest scope: no recovery map, no Knill-Laflamme
      conditions and no fault-tolerance claims, the same posture as the three-qubit code
      modules that the Steane code generalises.
    mathematical: >
      Take H the 3-by-7 Hamming parity matrix whose columns are the binary expansions of 1
      through 7. The rows satisfy H H^T = 0 over F2, so the six Pauli operators X^(h_i) and
      Z^(h_i) commute and generate a 64-element stabiliser group with trivial signs. The
      stabiliser trace formula gives code dimension 2^7/2^6 = 2.

      The logical zero is the uniform superposition over the row space C2 (eight strings);
      the logical one over the coset C2 + 1111111, the all-ones string being a Hamming
      codeword outside the row space, so the supports are disjoint. Both are proved
      stabilised by the full group (steaneZero_stabilised for the logical zero) and
      orthonormal. X^(all-ones) swaps the two states; Z^(all-ones) fixes the zero and
      negates the one, since the all-ones string has odd weight against itself and even
      against the rows. Single-error syndromes are the columns of H: nonzero and pairwise
      distinct, hence distance 3.
    person: >
      Andrew Steane, an Oxford atomic physicist, found the seven-qubit code in 1996 within
      months of Shor's nine-qubit construction, and independently of the Calderbank-Shor
      paper whose framework it shares; that is why "CSS codes" carries all three names.
      Steane's version is smaller than Shor's and self-dual, which makes its logical gates
      unusually clean: applying a Clifford gate to each of the seven qubits separately
      implements the same gate on the logical qubit.

      Steane went on to become one of the architects of fault-tolerant quantum
      computation; the seven-qubit code remains the standard teaching example and a
      building block of colour codes.
    term: Steane code
    eponyms: [Steane]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Empirical/QM/QEC/Steane.lean
      theorem: steaneZero_stabilised
    related: [shor-code, gottesman-knill, magic-state, pauli-matrices, quantum-channel]
    external:
      - text: "Steane, Error correcting codes in quantum theory (PRL 77, 793)"
        url: https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.77.793

  - slug: magic-state
    reviewed: 2026-09-11
    hook: >
      A magic state is the fuel of quantum advantage: a single special state that, consumed
      by otherwise classically trackable Clifford circuits, unlocks the one gate the
      Gottesman-Knill theorem cannot simulate.
    layman: >
      The Gottesman-Knill theorem says that circuits built from the Clifford gates can be
      simulated classically, so where does quantum advantage hide? In one extra gate, the
      T gate, which twists the phase of one branch of a qubit's superposition by an eighth
      of a turn. Add T to the Clifford set and you can approximate any quantum
      computation; leave it out and a laptop keeps up.

      What makes T genuinely different can be proved. Push a Pauli operation, a bit flip, a
      phase flip or both, through any Clifford gate and out comes another Pauli operation;
      that closure is the whole mechanism of classical simulability. Push a Pauli operation
      through T and what comes out is not a Pauli operation, and cannot be made one.

      The magic state is T's resource form: the specific single-qubit state that T produces
      from a plain equal superposition. Feed copies of it into circuits made only of
      Clifford gates and the effect of the T gate is obtained without ever applying it,
      which is why fault-tolerant architectures spend most of their budget manufacturing,
      or distilling, high-quality magic states.
    in_csd: >
      The magic layer is the precise complement of the corpus's Gottesman-Knill layer.
      Three theorems draw the boundary. Applying T twice gives the Clifford phase gate, so
      the hierarchy of gates descends as it should. Pushing the bit-flip Pauli operation
      through T gives an explicit combination of two Pauli operations, out of the Pauli
      family but inside its two-term span, the level-three hierarchy identity as a closed
      operator equation. And the no-go: no multiple of any Pauli operation equals that
      result, proved by comparing two columns of the matrices until the arithmetic demands
      an impossibility.

      The magic state itself is exhibited with explicit coordinates and unit length. Honest
      scope: distillation protocols (the fifteen-to-one scheme of Bravyi and Kitaev), the
      universality of Clifford plus T, and the injection circuit that spends a magic state
      to perform a T gate are named residues with reasons; the module proves what magic
      is, not how it is farmed. The standing disclaimer applies: the algorithm layer
      consumes the programme's unitary-evolution pillar and does not support the
      foundations.
    mathematical: >
      With tPhase = e^(i pi/4): tPhase squared is i, so T^2 = S on the register. The
      conjugation identity T X T-dagger = (X + i XZ)/sqrt 2 holds coordinatewise via
      e^(+-i pi/4) = (1 +- i)/sqrt 2. The no-go (tGate_conj_X_not_pauli): if
      T X T-dagger = c X^a Z^b then reading the |0> and |1> columns forces c = e^(i pi/4)
      and e^(-i pi/4) = c times a sign, hence e^(-i pi/2) in {+1, -1}, but
      e^(-i pi/2) = -i. The magic state T H |0> has coordinates (1, e^(i pi/4))/sqrt 2.
    person: >
      The term "magic state" belongs to Sergey Bravyi and Alexei Kitaev, from their 2005
      paper showing that noisy copies of certain single-qubit states can be distilled by
      ideal Clifford operations into fuel for universal computation, the fifteen-to-one
      protocol that still anchors fault-tolerant cost estimates. The gate-injection idea
      goes back to Gottesman and Chuang's 1999 teleportation construction, which organised
      gates into the Clifford hierarchy: Paulis at level one, Clifford gates at level two,
      T at level three.

      The economics of quantum computing largely reduce to magic-state throughput, which is
      why "magic", Bravyi and Kitaev's deliberately playful word, became sober technical
      vocabulary.
    term: magic state
    eponyms: []
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Magic.lean
      theorem: tGate_conj_X_not_pauli
    related: [gottesman-knill, steane-code, shor-code, pauli-matrices, amplitude-amplification]
    external:
      - text: "Bravyi-Kitaev, Universal quantum computation with ideal Clifford gates and noisy ancillas (PRA 71, 022316)"
        url: https://arxiv.org/abs/quant-ph/0403025

  - slug: holevo-bound
    reviewed: 2026-09-12
    hook: >
      A quantum system can be prepared in infinitely many distinct ways, yet no reader can extract
      more classical information from it than from a classical system of the same size, and the
      measurement channel of CSD is proved to pass exactly one bit per qubit.
    layman: >
      A single qubit, the quantum unit of information, can be prepared in a continuum of different
      states, and it is natural to hope that this continuum could be used to store more than one
      bit. Holevo's bound says it cannot. Suppose a sender chooses one of several states with known
      probabilities and hands the system over. The most a receiver can learn about which state was
      chosen, whatever measurement is performed, is bounded by the entropy of the average state,
      and entropy in turn is bounded by the logarithm of the number of perfectly distinguishable
      states the system has. For a qubit that is one bit. The continuum of preparations is real,
      but the states in it are not distinguishable from one another, and the bound measures exactly
      how much distinguishability is available.

      The quantity in the bound is the difference between the entropy of the average state and the
      average of the entropies of the individual states. It is zero when the states are identical,
      it is largest when they are perfectly distinguishable, and it is never negative. The last
      fact is not a triviality: it is the statement that mixing states never lowers their average
      entropy, which is a concavity property of the entropy itself.
    in_csd: >
      The bound is proved in the corpus with no side conditions, for any finite collection of
      states and any weights, and it is then applied to a channel the programme produces rather
      than posits. The de-isolation channel, which is what the measurement flow looks like from the
      measured system alone, keeps the pointer basis intact and removes everything else. Its
      single-letter classical capacity, the largest amount of information any collection of input
      states can carry through it in one use, is proved to be exactly one bit for a qubit: the bound
      caps every collection, and the two pointer states attain it. That is the information-theoretic
      reading of a record. A measurement extracts the pointer bit and nothing more, and the flow that
      creates the record is the same flow that limits what it can carry.
    mathematical: >
      holevoChi p rho is S(sum p_i rho_i) minus sum p_i S(rho_i). holevoChi_nonneg is concavity of
      the von Neumann entropy without a support hypothesis (Mathlib/QuantumInfo/ConcavityFull.lean).
      holevoChi_le_vonNeumannEntropy and holevoChi_le_log_card are the bound and its dimension form,
      using only non-negativity of the components' entropies. holevoRange of a channel is the set of
      Holevo quantities of its outputs over all finite ensembles of density matrices, bounded by
      holevoRange_le_log_card, and deisolationChannel_holevoCapacity (LF6/DeisolationCapacity.lean)
      states that log 2 is the greatest element of the range of the de-isolation channel on a qubit.
      The regularised capacity over many uses is not defined, and the converse direction, that the
      bound is asymptotically attainable, is not proved.
    person: >
      Alexander Holevo, born in 1943, has spent his career at the Steklov Mathematical Institute in
      Moscow. The bound appears in a 1973 paper in the Soviet journal Problems of Information
      Transmission, at a time when quantum information was not yet a field, and it stood for a
      quarter of a century as a limit before the matching achievability result, proved
      independently by Holevo and by Schumacher and Westmoreland in the late 1990s, turned it into
      the capacity formula for classical information over quantum channels. He received the
      Shannon Award of the IEEE Information Theory Society in 2016.
    term: Holevo bound
    eponyms: [Holevo]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/HolevoBound.lean
      theorem: holevoChi_le_log_card
    related: [von-neumann-entropy, klein-inequality, de-isolation, measurement-flow, quantum-channel]

  - slug: stinespring-dilation
    reviewed: 2026-09-12
    hook: >
      Every noisy quantum process is a reversible process on a larger system with part of that
      system ignored, and in CSD the larger system is the constraint surface itself: every channel
      the programme uses is the environment's marginal of a volume-preserving flow.
    layman: >
      The basic evolution of quantum mechanics is reversible: nothing is lost, and running it
      backwards recovers the starting state exactly. Real processes are not like that. A qubit
      stored in a device gradually loses its coherence, a photon in a fibre is sometimes absorbed,
      a measurement leaves the system changed in a way that cannot be undone. The general
      description of such a process is a channel, a rule that turns states into states while
      respecting probabilities, and channels can lose information.

      Stinespring's theorem reconciles the two pictures. Any channel, however lossy, is a
      reversible evolution of the system together with an environment, followed by ignoring the
      environment. Ignoring means averaging over everything the environment could be doing, an
      operation called the partial trace. The information is not destroyed; it has moved into
      correlations with the environment, where a description of the system alone cannot see it. A
      bit flip that happens with some probability, for instance, is a reversible interaction with a
      single environment qubit that records whether the flip occurred, seen from the side that does
      not read that record.
    in_csd: >
      The theorem is the hinge between the programme's ontic and operational layers. The
      constraint surface carries system and environment together, and its dynamics is a
      volume-preserving flow that lifts a reversible evolution of the joint state space. The corpus
      proves that when such a flow acts on a preparation whose environment starts in a ready state,
      the density operator of the flowed preparation, seen from the system alone, is a channel
      applied to the density operator of the original preparation, and it identifies which channel:
      the one Stinespring's construction assigns to the joint evolution and the ready state. So the
      channels of quantum information are not introduced into the programme; they are what its flows
      look like from inside. The measurement flow yields the de-isolation channel in this way, and
      the bit-flip errors of the three-qubit code arise from a flow on the register with a four-level
      environment. A mixed environment is covered as well, through the spectral decomposition of
      its density operator.
    mathematical: >
      Channel.ofIsometry builds the channel Tr_env(V rho V^H) from an isometry V into system times
      environment, and apply_eq_traceRight_stinespring together with stinespringIsom_isom shows
      every Kraus channel arises this way, with the Kraus operators as the environment blocks of V.
      stinespringChannel U hU e_0 (LF2/FlowChannel.lean) is the channel of a joint unitary with a
      ready environment, and traceRight_barycenter_flow states that for a flow lifting U in the
      projector sense (IsUnitaryLift) and a preparation that is a product with the environment ready,
      almost everywhere in the representative, the reduced barycentre of the flowed preparation is
      that channel applied to the system's barycentre. isUnitaryLift_unitSection removes the section
      hypothesis for projective actions, stinespringChannelMixed handles a mixed environment, and
      channelEquiv (LF2/ChannelBridge.lean) transports the construction between the corpus's two
      channel structures.
    person: >
      W. Forrest Stinespring (1929-2012) taught at the University of Illinois at Chicago for most of
      his career. The dilation theorem is in a short 1955 paper in the Proceedings of the American
      Mathematical Society, written in the language of positive maps on operator algebras and
      generalising Naimark's dilation of a positive operator measure. Its reading as the statement
      that every quantum channel is a unitary on a larger space, with the environment traced away,
      came with Kraus's work on operator-sum representations in the 1970s and 1980s, long after the
      mathematics was settled.
    term: Stinespring dilation
    eponyms: [Stinespring]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Stinespring.lean
      theorem: apply_eq_traceRight_stinespring
    related: [quantum-channel, naimark-dilation, partial-trace, de-isolation, measurement-flow]

  - slug: klein-inequality
    reviewed: 2026-09-12
    hook: >
      One quantum state is never negatively distinguishable from another: the relative entropy of a
      state with respect to a second is at least zero, and that single inequality drives the second
      law, subadditivity, concavity and the Holevo bound in the corpus.
    layman: >
      Relative entropy measures how surprised you should be, on average, if you believe a system is
      in one state when it is really in another. It compares the true state with the assumed one,
      and it is the quantum version of a quantity that appears throughout statistics and
      information theory. Klein's inequality says that this surprise is never negative and is zero
      only when the two states coincide. Believing something false about a system can never make its
      behaviour look more predictable than the truth would.

      The statement sounds obvious and is not. Quantum states are matrices, the logarithm of a
      matrix is defined through its eigenvalues, and two states generally have different
      eigenvectors, so the two logarithms do not simply line up. The proof expands one state in the
      eigenbasis of the other and uses the fact that the overlaps between the two sets of
      eigenvectors form a doubly stochastic pattern, one whose rows and columns each sum to one,
      which is enough to pull the ordinary convexity of the logarithm through the matrix algebra.
    in_csd: >
      The inequality is proved once in the corpus and spent many times. The thermodynamics track
      uses it for the H-theorem, the statement that coarse-graining a state onto a fixed basis can
      only raise its entropy, and that theorem is exactly what the de-isolation channel does to the
      measured system, so the second law on the constraint surface rests on it. Subadditivity of
      entropy, the Landauer bound that follows from subadditivity, the concavity of entropy under
      mixing and the Holevo bound on how much classical information a channel carries are all
      consequences. In each case the inequality supplies the one step that informal accounts tend to
      wave through.
    mathematical: >
      klein_inequality (Mathlib/QuantumInfo/Subadditivity.lean): for rho positive semidefinite of
      unit trace and sigma positive definite, relEntropy is non-negative. The proof is the doubly
      stochastic overlap expansion in the two eigenbases with the convexity of x log x. Consumers:
      vonNeumannEntropy_subadditive and landauer_bound; vonNeumannEntropy_le_pinching
      (Thermo/SecondLaw.lean), which is the H-theorem; the concavity theorem
      vonNeumannEntropy_mixture_ge, obtained from the positive-definite case by mixing with the
      maximally mixed state and closedness in the mixing parameter; and holevoChi_nonneg. The
      equality case, that zero forces the two states to coincide, is not formalised.
    person: >
      Oskar Klein (1894-1977) was a Swedish physicist better known for the Kaluza-Klein fifth
      dimension, the Klein-Gordon equation and the Klein-Nishina formula. The inequality comes from
      a 1931 paper in the Zeitschrift für Physik on the quantum-mechanical foundation of the second
      law of thermodynamics, written in Stockholm, where he had just taken the chair of theoretical
      physics. His aim was the H-theorem: to show that the entropy of a quantum system, once its
      fine-grained coherences are discarded, can only increase. The inequality was the tool, and it
      outlived the argument it was built for.
    term: Klein's inequality
    eponyms: [Klein]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Subadditivity.lean
      theorem: klein_inequality
    related: [von-neumann-entropy, entropy-subadditivity, holevo-bound, landauer-principle, gibbs-state]
