  - slug: ghz-state
    reviewed: 2026-09-12
    hook: >
      Three particles can contradict local realism with certainty in a single run: no
      statistics, no inequality and no margin of error.
    layman: >
      Bell's argument has one feature that a determined sceptic can pick at: it is
      statistical. No single run of a Bell experiment is impossible on the common-sense
      picture, in which every measurement has an answer fixed in advance; the runs are only
      collectively improbable. You need thousands of runs and error bars, and someone can
      always mutter about statistics.

      Greenberger, Horne and Zeilinger found a way to remove the error bars. With three
      particles instead of two, prepared together in what is now called a GHZ state, there
      is a set of measurements for which the common-sense picture predicts one definite
      answer and quantum mechanics predicts the opposite definite answer. Not different
      averages; opposite certainties.

      One run settles the matter, in principle. The conflict stops being about probability
      and becomes arithmetic. Each measurement gives plus one or minus one. Multiply out
      the answers that the common-sense picture demands and the product must be plus one;
      quantum mechanics says minus one. Something has to give, and experiment says it is
      the answer sheet.
    in_csd: >
      The corpus carries the three-party obstruction alongside the two-party one for a
      specific defensive reason: the two have different logical shapes, and an account
      built on an underlying substrate has to survive both. One could imagine a mechanism
      that reproduces the statistical Bell violations through some averaging trick but
      fails on a deterministic contradiction. Carrying the GHZ result closes that escape.

      The proof quantifies over arbitrary spaces of hidden states rather than examining one
      model. That is what makes it a constraint on the whole class of accounts in which the
      hidden description splits into a separate part for each particle, including naive
      rewrites of this programme, which is the point.
    mathematical: >
      No product partition of a shared hidden-state space reproduces the GHZ correlations.
      Proved over an arbitrary measurable state space.

      The contradiction is algebraic. The four predicted outcome-sign products cannot be
      consistently assigned: multiplying the local predictions forces plus one where the
      quantum state forces minus one. No inequality is involved and no bound is
      approached; the two predictions simply differ, which is why a single ideal run
      distinguishes them.
    person: >
      Daniel Greenberger of City College New York, Michael Horne (1943-2019) of Stonehill
      College, and Anton Zeilinger of Vienna and Innsbruck introduced the argument in 1989.
      Horne, as Shimony's graduate student at Boston University, had already co-authored
      the CHSH inequality.

      The publication story is odd. The result appeared in the proceedings of a conference
      at Erice rather than in a journal, and spread mostly by word of mouth until Mermin
      wrote it up and made it famous. Zeilinger shared the 2022 Nobel Prize for
      entanglement experiments; Horne had died three years earlier.
    term: GHZ state
    eponyms: [GHZ]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF6/GHZContextuality.lean
      theorem: no_product_partition_realises_ghz
    related: [bell-chsh, mermin-inequality, contextuality, hidden-variables, no-signalling]

  - slug: tsirelson-bound
    reviewed: 2026-08-25
    hook: >
      Quantum mechanics breaks the classical limit on correlations and then stops, well
      short of what logic alone would allow. Why it stops exactly there is a genuinely open
      question.
    layman: >
      Quantum mechanics is not as strange as it could be. In the standard Bell test, the
      results of two separated measurements are combined into a single correlation score.
      Any theory in which measurements have answers fixed in advance keeps that score at 2
      or below. Quantum mechanics reaches about 2.83, the famous violation. But sheer logic
      permits a score of 4, and theories that reach 4 exist on paper, cause no paradoxes,
      and allow no faster-than-light messages.

      So relativity is not what stops quantum mechanics at 2.83. Something else does, and
      nobody fully knows what. The ceiling is called the Tsirelson bound, and explaining
      why nature's ceiling sits exactly there, rather than at the logical maximum, has
      become a research programme in its own right.

      The honest position is this. We can prove where the quantum ceiling is. We cannot yet
      say, from first principles that anyone agrees on, why that is the ceiling the world
      chose.
    in_csd: >
      A reconstruction has to get the ceiling right, not just the violation. Reproducing
      the Bell violation with the wrong maximum would mean having built a different theory
      that agrees with quantum mechanics only qualitatively: interesting, but not quantum
      mechanics. So the corpus proves the bound over the whole family of two-qubit systems,
      a qubit being the simplest quantum system: every state of a pair of qubits and every
      choice of measurement directions, not just the singlet at the textbook angles.

      Saturation is proved separately: there really are settings at which the singlet
      reaches 2.83 exactly. Ceiling and attainment are two theorems rather than one
      observation, and keeping them apart is what lets each be checked on its own.
    mathematical: >
      For every unit two-qubit state and all detector settings, the CHSH combination of
      Pauli correlations satisfies absolute value at most 2 root 2. The route is algebraic
      but not operator-algebraic: the load-bearing lemma bounds the expression
      Re<alpha,beta> - Re<alpha,beta'> + Re<alpha',beta> + Re<alpha',beta'> for any four
      unit vectors in a complex inner product space, by the parallelogram law and
      Cauchy-Schwarz, and the quantum bound follows by the standard Tsirelson substitution
      alpha = (sigma.a tensor I)psi, beta = (I tensor sigma.b)psi.

      Be precise about the form, because it is easy to overstate. The operator-form
      Loewner-order statement, the inequality about products of anticommuting involutions
      with no state mentioned, is not what the corpus has. It was the original target and
      is blocked upstream on a missing ordered-module instance for matrices, as the module
      records. The vector form is general in its own right and yields the same expectation
      bound. Saturation by the singlet is exhibited explicitly and separately.
    person: >
      Boris Tsirelson (1950-2020) was born in Leningrad and trained there under Ibragimov,
      mostly in probability: Brownian motion, exotic noises, and what he called black
      noise. The quantum bound was almost a side project.

      It appeared in 1980 in Letters in Mathematical Physics, written from inside the
      Soviet Union, and sat largely unread in the West for years, because the field that
      would need it did not yet exist. He emigrated to Israel in 1991 and spent the rest of
      his career at Tel Aviv University. In later life he became one of the most careful
      mathematics editors on Wikipedia, which he treated as seriously as journal work.
    term: Tsirelson bound
    eponyms: [Tsirelson]
    status: proved-in-corpus
    lean:
      module: CsdLean4/SigmaLayer/BellGenerality.lean
      theorem: qm_chsh_le_tsirelson
    related: [bell-chsh, cglmp-inequality, mermin-inequality, no-signalling, does-csd-violate-bell]

  - slug: landauer-principle
    reviewed: 2026-09-12
    hook: >
      Forgetting costs heat, at a rate set by temperature alone. This is the point at which
      information stops being an abstraction and acquires a physical price.
    layman: >
      The story starts with a demon. Maxwell imagined a tiny being that sorts fast
      molecules from slow ones, apparently creating a temperature difference for nothing
      and so breaking the second law of thermodynamics, the law that says the disorder of
      an isolated system never decreases. For a century the demon dodged every exorcism;
      each proposed fix turned out to have a loophole.

      Landauer found the real answer, and it is about memory. The demon must record what it
      learns, its memory is finite, and so eventually it must erase. Erasing is the step
      that cannot be free. Resetting a memory to a blank state compresses many possible
      configurations into one, and that compression must be paid for in heat released to
      the surroundings.

      The price is universal. It depends on the temperature and on nothing else: not the
      technology, not the ingenuity of the engineering. Forgetting one bit of information
      costs, at minimum, a tiny but fixed quantity of heat, and with that payment the
      demon's books balance exactly.
    in_csd: >
      Thermodynamics is not bolted onto this programme; it grows from the same soil as the
      Born rule. The motion of the substrate preserves volume, so at the finest grain
      nothing is ever lost and entropy, the measure of missing information, is conserved.
      Irreversibility appears only when a record is coarse-grained, that is, when many
      detailed configurations are lumped together under one description. This is
      Boltzmann's picture: reversible microscopic dynamics, with irreversibility living in
      the description rather than in the dynamics.

      Given that setup, an erasure bound is not an import from another field. It is what
      the record layer, the part of CSD that describes how outcomes are recorded, owes and
      pays. The corpus derives temperature and free energy first, from a variational
      principle, a rule that singles out a state by making some quantity as small or as
      large as it can be, and then proves the Landauer bound in those earned terms. It is
      the tightest link the development has between information and physical cost.

      The bound is also stated on the constraint surface. Take a preparation of a system
      together with a bath, in product form, whose bath component has a Gibbs state as its
      density operator, and let a volume-preserving flow lifting a unitary act on the pair.
      The entropy the system loses is then bounded by the heat the bath receives, with the
      same constant as the matrix-level theorem. Nothing about the flow is posited beyond its
      lifting the joint unitary, so the thermodynamic cost of erasure is read off the
      substrate's own dynamics.
    mathematical: >
      The entropy removed from a system is bounded by beta times the heat delivered to the
      bath. The proof route is this: unitary evolution on an initially product state
      conserves total entropy; subadditivity bounds the system's entropy drop by the bath's
      entropy rise; the bath's Clausius inequality converts entropy rise into heat.

      The statement is in the Reeb-Wolf form, which forces the assumptions into the open:
      the bath starts in a Gibbs state, everything is finite-dimensional, the initial
      system state is positive-definite, and both final marginals are full-rank. The last
      two are not decoration. They are what the subadditivity step consumes, and that step
      is proved only at positive-definite marginal scope. Naming them is the point, because
      several informal derivations of the principle are known to smuggle assumptions at
      exactly the step this version makes visible.

      landauer_flow (Thermo/SigmaSecondLaw.lean) is landauer_bound applied to the barycentres
      of a product preparation flowed by a lift of the joint unitary, with the bath
      preparation's barycentre equal to the Gibbs state; the full-rank hypotheses of the
      matrix theorem are inherited, not removed.
    person: >
      Rolf Landauer (1927-1999) was born in Stuttgart; his family fled to New York in 1938
      after his father's death. He took his degrees at Harvard and joined IBM in 1952,
      spending his whole career at the Watson Research Center in Yorktown Heights,
      corporate research at its mid-century best, where a physicist could spend decades on
      the question of why computing costs energy.

      The principle appeared in 1961 in the IBM Journal of Research and Development, a
      house journal, under the resolutely unglamorous title of a paper about heat
      generation. His slogan, that information is physical, was a deliberate provocation.
      His colleague Charles Bennett drew the astonishing corollary a decade later:
      computation itself can be free, and only forgetting costs. Experimental confirmation
      came in 2012, thirteen years after Landauer died.
    term: Landauer's principle
    eponyms: [Landauer]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Thermo/Landauer.lean
      theorem: landauer_bound
    related: [von-neumann-entropy, entropy-subadditivity, gibbs-state, klein-inequality, de-isolation, jarzynski-equality]

  - slug: jarzynski-equality
    reviewed: 2026-09-13
    hook: >
      Rush a system between two equilibrium conditions as violently as you like, and the
      average of a particular exponential of the work you did still returns the equilibrium
      free energy difference exactly. Irreversible experiments measure a reversible quantity.
    layman: >
      Free energy is the price of moving a system from one equilibrium condition to another
      at fixed temperature: the least work that has to be paid, and it is paid in full only
      if the change is made infinitely slowly. Real changes are made in finite time. A
      stretched molecule, a compressed gas, a switched field: each is driven faster than it
      can keep up, the work done in a run exceeds the free energy difference, and it exceeds
      it by a different amount every time, because the microscopic starting configuration
      differs from run to run. The second law of thermodynamics says only that the average
      excess is never negative. It does not say what the average is.

      Jarzynski found that a different average is fixed exactly. Instead of averaging the
      work, average the exponential of minus the work divided by the thermal energy. That
      quantity, averaged over many repetitions of the same fast protocol, equals the
      exponential of minus the free energy difference divided by the same thermal energy,
      whatever the protocol and however fast. The rare runs in which the work came out
      small, or even negative, dominate this average, which is why it can see past the
      irreversibility of the typical run.

      The consequence is practical as well as conceptual. Single molecules can be pulled
      apart with laser tweezers thousands of times, quickly and irreversibly, and the
      equilibrium free energy of the unfolding transition read off from the record of work
      values. The result was tested that way on RNA hairpins within five years of its
      publication. The ordinary second law, that the average work is at least the free
      energy difference, follows from the equality in one line, because an average of an
      exponential is at least the exponential of the average.
    in_csd: >
      Thermodynamics in this programme is not a separate subject with its own postulates. The
      state a system settles into at a given temperature, the Gibbs state, is derived from a
      variational principle, and the weight it gives to each energy level is the Born weight
      of an energy reading made on the equilibrium preparation. The Jarzynski equality is the
      first result in the corpus that ties those equilibrium weights to a process: the system
      is read, driven by a unitary change of its dynamics, and read again, and the work is the
      difference of the two readings.

      What the equality establishes is that the exponential average of that difference
      depends only on the two equilibrium conditions, not on the driving. The proof rests on
      two facts the programme already owns. The equilibrium weight of the first reading
      contains the exponential of minus the starting energy, which cancels exactly against
      the matching factor inside the exponential of minus the work. And the table of
      transition probabilities between the two sets of energy readings, being built from a
      unitary, has every row and every column summing to one, so the remaining sum over
      starting readings collapses. What is left is the ratio of the two partition functions,
      which is the free energy difference in disguise. The second law for the driven process,
      that the mean work is at least the free energy difference, then follows from the
      convexity of the exponential function.

      The theorem is stated at the level of matrices, the level at which the corpus states
      its other thermodynamic results. On the constraint surface the two readings are records
      of a single trajectory, the equilibrium preparation is a measure on the sector whose
      density operator is the Gibbs state, and the driving is the Schrodinger flow, which the
      corpus identifies with a Hamiltonian flow preserving the sector's volume. Stating the
      equality in those terms, as a property of the two time record law, is the next step in
      the thermodynamics track.
    mathematical: >
      Let H_0 and H_1 be Hermitian matrices on a finite-dimensional space, U a unitary, and
      beta an inverse temperature. The two point measurement protocol reads the energy in the
      Gibbs state of H_0 (outcome i, the i-th eigenvalue E_0(i), with probability
      exp(-beta E_0(i)) / Z_0, which the corpus proves equals the Born weight of the i-th
      eigenvector in the Gibbs state), applies U, and reads the energy of H_1 (outcome j,
      eigenvalue E_1(j), with probability the squared modulus of the matrix element of U
      between the i-th eigenvector of H_0 and the j-th eigenvector of H_1). The work on the
      pair (i, j) is W = E_1(j) - E_0(i). The theorem is that the sum over all pairs of the
      joint probability times exp(-beta W) equals Z_1 / Z_0, the ratio of the partition
      functions, which by the corpus's TH3 free energy F = -log Z / beta is exp(-beta (F_1 -
      F_0)).

      The proof is the cancellation described above made exact. The factor exp(-beta E_0(i))
      in the Gibbs weight cancels exp(+beta E_0(i)) in exp(-beta W); the transition matrix
      is the matrix of squared moduli of V_1^* U V_0, with V_k the eigenvector unitary of
      H_k, and both its row sums and its column sums are one because V_1^* U V_0 is again
      unitary (the diagonal entries of M^* M = 1 and of M M^* = 1). Summing over i first
      leaves the sum over j of exp(-beta E_1(j)) / Z_0. Jensen's inequality for the convex
      exponential, applied to the joint law as a finite probability measure, gives the mean
      work bound: F_1 - F_0 is at most the expected work.

      Scope: finite dimension, projective energy readings in the eigenbases chosen by the
      spectral theorem (degenerate spectra are allowed; the sum runs over eigenvectors, not
      over distinct eigenvalues), a closed driven system with no bath, so the work is the
      whole energy change, and the same beta at both ends. The free energy difference is
      that of the Gibbs states of H_1 and H_0 at that temperature.
    person: >
      Christopher Jarzynski is an American physicist. He took his doctorate at the
      University of California, Berkeley, in 1994, moved to Los Alamos National Laboratory,
      and has been at the University of Maryland, College Park, since 2006, where he is a
      Distinguished University Professor.

      The equality appeared in Physical Review Letters in 1997, under the title
      Nonequilibrium equality for free energy differences, written at Los Alamos. It was
      received with some disbelief, since it appeared to extract an equilibrium quantity
      from arbitrarily irreversible processes, and the classical derivation was scrutinised
      closely before the result was accepted. Gavin Crooks sharpened it in 1998 and 1999 into
      a relation between the forward and reverse work distributions, of which the equality
      is a corollary. Jan Liphardt, Carlos Bustamante and their collaborators confirmed it
      experimentally in 2002 by pulling single RNA molecules with optical tweezers. The
      quantum version used here, in which the work is defined by two energy readings, was
      formulated by Jorge Kurchan and by Hal Tasaki in 2000; Peter Talkner, Eric Lutz and
      Peter Hanggi made the point in 2007 that quantum work is a two time quantity and not
      an observable.
    term: Jarzynski equality
    eponyms: [Jarzynski]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Thermo/Jarzynski.lean
      theorem: jarzynski
    related: [gibbs-state, landauer-principle, von-neumann-entropy, canonical-typicality]

  - slug: von-neumann-entropy
    reviewed: 2026-09-13
    hook: >
      A quantum whole can be perfectly known while its parts are as uncertain as they could
      possibly be. Entropy is where that stops being a metaphor and becomes arithmetic.
    layman: >
      Entropy measures missing information: how much you would still need to learn to know
      the state of something completely. For ordinary things it behaves sensibly. Know
      everything about a machine and you know everything about its parts. Quantum
      mechanics breaks this sensible behaviour in a specific, quantifiable way.

      Two entangled particles can be in a jointly definite state, with entropy zero and
      nothing left to learn about the pair, while each particle on its own is in the most
      uncertain state possible, with maximum entropy. The information is not hiding in one
      particle or the other. It lives in the relationship between them, and no inspection
      of the parts separately can find it.

      Von Neumann's entropy is the quantity that makes this precise. The inequalities it
      obeys, which say how the entropy of a whole constrains the entropies of its parts,
      are the working arithmetic of quantum information. They also turn out to be most of
      thermodynamics.
    in_csd: >
      The corpus uses entropy for two different jobs. The first is to measure the
      irreversibility created when a pure state, one that is completely known, is
      coarse-grained into a record, so that many detailed configurations are lumped under
      one outcome. The substrate conserves entropy exactly; the record does not; and the
      gap between those two statements is where the second law of thermodynamics, and
      arguably the arrow of time, enters this programme.

      The second job is as load-bearing machinery. Subadditivity, the inequality that says
      the entropy of a whole is at most the sum of the entropies of its parts, is the
      specific step that turns an entropy statement into the Landauer heat bound; remove it
      and that derivation does not close. The corpus proves subadditivity under a stated
      technical condition on the states of the two parts, that each is of full rank, so
      that no possibility is assigned probability exactly zero. It carries the much harder
      three-part inequality, strong subadditivity, separately, derived from an explicitly
      stated data-processing assumption rather than proved from scratch. Both are scope
      decisions recorded in the corpus's ledger, not something a reader has to discover.

      The corpus also assigns an entropy to a preparation on the constraint surface itself,
      not only to a matrix handed in from outside. A preparation is a probability measure on
      the surface; its density operator is the average of the rank-one projectors of the rays
      it occupies, and the entropy of the preparation is the entropy of that operator. Three
      things are proved about it. It is zero exactly when the preparation sits on a single
      ray, so purity and zero entropy are the same condition on the surface. Coarse-graining a
      preparation, mixing several of them with weights, never lowers it, with no side
      condition on the states involved. And along a volume-preserving flow it is conserved,
      while the coarse-graining that a measurement performs on the system alone can only raise
      it: that is the second law read on the surface, produced by the environment being
      ignored rather than by any loss in the dynamics.
    mathematical: >
      For a bipartite density operator, the entropy of the whole is at most the sum of the
      entropies of the marginals. Proved here at positive-definite marginal scope, which for
      pure global states means full Schmidt rank. The standard equality condition, that the
      bound is attained exactly on product states, is stated in the module as the reason
      the inequality is not vacuous; it is not itself formalised, so do not cite it as
      proved.

      Strong subadditivity, the three-party inequality of Lieb and Ruskai from which most
      structural results of quantum information follow, is not re-proved from scratch: it
      is derived from an explicit data-processing hypothesis, and the ledger says so.

      On the surface: preparationDensity is the Gleason witness of a preparation and
      preparationDensity_eq_barycenter identifies it with the Bochner integral of the outer
      products of a unit section along the projective law (LF2/PreparationBarycenter.lean);
      preparationEntropy_eq_zero_iff (LF2/PreparationPurity.lean) says the entropy vanishes
      exactly when the projective law is a Dirac mass at one ray, through the matrix-level
      vonNeumannEntropy_eq_zero_iff. Concavity, vonNeumannEntropy_mixture_ge
      (Mathlib/QuantumInfo/ConcavityFull.lean), holds for arbitrary density matrices: the
      positive-definite case is Klein's inequality averaged, and the support hypothesis is
      removed by mixing with the maximally mixed state, whose entropy is explicit, and passing
      to the closed set of mixing parameters on which the inequality holds. The second law on
      the surface is vonNeumannEntropy_le_pinching_flow (Thermo/SigmaSecondLaw.lean): the
      flowed preparation has the same entropy, and the de-isolation channel, which is the
      pinching of the second-law module, does not lower it.
    person: >
      John von Neumann (1903-1957) was born Neumann Janos in Budapest, into an ennobled
      banking family. He took a chemistry degree in Zurich and a mathematics doctorate in
      Budapest more or less simultaneously, then moved through Berlin and Hamburg to
      Princeton in 1930 and to the Institute for Advanced Study at its founding. The
      entropy appears in his 1932 book, the one that gave quantum mechanics its
      Hilbert-space form, fifteen years before Shannon.

      The naming story is the good part. When Shannon later needed a name for his own
      uncertainty quantity, von Neumann reportedly told him to call it entropy, for two
      reasons: the formula already existed in statistical mechanics under that name, and
      nobody knew what entropy really was, so in a debate Shannon would always have the
      advantage. Shannon took the advice. The joke has been paying dividends ever since.
    term: von Neumann entropy
    eponyms: [Neumann]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Subadditivity.lean
      theorem: vonNeumannEntropy_subadditive
    related: [entropy-subadditivity, klein-inequality, holevo-bound, landauer-principle, canonical-typicality]

  - slug: liouville-measure
    reviewed: 2026-09-12
    hook: >
      A deterministic substrate needs a notion of volume that its own motion cannot
      distort. On CSD's sector that volume is forced, and it is the Born measure.
    layman: >
      Any theory with a deterministic underworld needs to say how much of that world is one
      way rather than another: how big a set of possible states is. And the notion of size
      had better be one that the motion respects. If flowing forward in time inflated some
      regions and shrank others, sizes would depend on when you measured them, and
      probabilities built from them would be meaningless.

      Classical mechanics solved this long ago. The complete state of a classical system,
      all of its positions and all of its velocities, is a single point in a space called
      phase space, and the laws of motion move that point along a path. Liouville proved
      that this motion preserves the volume of phase space exactly: a region can be
      stretched and folded into filigree, but its total volume never changes. A volume with
      this property is called a Liouville measure.

      The residual worry is choice. If several motion-respecting volumes existed, a
      theorist could pick whichever delivered the desired answer, and any derivation of
      probabilities would be quietly rigged. The theorem here closes that gap. On the
      sector CSD works with, the one whose motion is unitary, there is exactly one option.
    in_csd: >
      This is the hinge that joins the ontic story, about what exists, to the probability
      story. The substrate carries a volume that its flow preserves; the epistemic side,
      which concerns what an observer can know, needs the Fubini-Study measure to turn
      regions into Born weights. On the unitary-flow sector these are proved to be the same
      object. The ruler used for probability is the substrate's own volume, not a second,
      conveniently chosen assumption.

      That identification is the programme's reply to the oldest objection against
      reasoning from typicality, pressed from Boltzmann's day to Valentini's: that the
      measure is smuggled in. Here it is forced, and the forcing is a theorem with a
      uniqueness proof behind it.

      The scope should be stated plainly. That the flow preserves volume is one of CSD's
      stated postulates about the substrate, carried as an explicit assumption rather than
      derived for constraint dynamics in general. For every flow generated by a smooth
      energy function on the space of states, Liouville's theorem is proved in the corpus at
      the level of the manifold itself, so the postulate is a theorem for all such flows;
      what keeps it a postulate is that the measurement steps of the constraint dynamics are
      not of that kind globally. What the corpus proves about the measure is conditional: if
      the sector is this one, then its volume is forced and coincides with the geometric
      volume of the space of states. The theorem is about the sector, not a derivation of it.
    mathematical: >
      For the unitary-flow sector, the Liouville measure equals the Fubini-Study measure,
      and it is the forced Kahler volume, determined by the state space and its unitary
      symmetry rather than posited. It is also proved to be the symplectic volume: the
      normalised top power of the Fubini-Study form
      (unitaryFlowSetup_liouvilleMeasure_eq_fsVolumeNormalized), which the sector's flow
      preserves (unitaryFlowSetup_flow_measurePreserving_fsVolume), and the forced volume
      and the symplectic volume are the same measure (fsVolumeNormalized_isForcedKahlerVolume).

      Scope, stated plainly because it is load-bearing: measure-preservation of the flow is
      carried as a structure field, an ontic postulate listed in the axiom ledger, not
      derived for the constraint dynamics in general. It is a theorem for the unitary
      flows, by invariance, and for every Hamiltonian flow of a smooth energy on complex
      projective space by the manifold-level Liouville theorem
      (IsSymplectic.map_hamiltonianFlow_topFormMeasure_wedgePow, instantiated as
      fsVolume_map_hamiltonianFlow): the flow of the Hamiltonian vector field preserves the
      measure of every power of the symplectic form, proved through the flat Liouville
      theorem in charts with Cartan's formula and the change of variables for top forms.
      The measurement pieces of the constraint dynamics are only locally Hamiltonian, which
      is why the field remains a postulate. What is proved about the measure is the
      conditional: if the sector is this one, then its volume is forced and is the
      symplectic volume. The theorem is about the sector, not a derivation of it.
    person: >
      Joseph Liouville (1809-1882) was born at Saint-Omer and trained at the Ecole
      Polytechnique. He taught there, at the College de France and at the Sorbonne. The
      volume-preservation theorem dates from 1838 and was reached through celestial
      mechanics rather than any inkling of statistical physics.

      He left two other legacies. He founded the Journal de Mathematiques Pures et
      Appliquees, which is still publishing, and used it in 1846 for an act of scientific
      rescue: printing the papers of Evariste Galois, fourteen years after Galois died in a
      duel at twenty, and thereby saving the founding documents of group theory from
      oblivion. He was also the first to exhibit a provably transcendental number, decades
      before e and pi were settled.
    term: Liouville measure
    eponyms: [Liouville]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF4/KahlerVolumeForced.lean
      theorem: unitaryFlowSetup_liouville_isForcedKahlerVolume
    related: [fubini-study-measure, kahler-form, constraint-surface, typicality, poisson-bracket]

  - slug: kahler-form
    reviewed: 2026-09-12
    hook: >
      On the space of quantum states, distance, area and a quarter-turn coming from the
      complex numbers lock together. That lock is what makes the volume of the space
      nobody's choice.
    layman: >
      The space of quantum states carries three structures that could, in principle, have
      nothing to do with one another. There is a way of measuring distances between
      states, called a metric. There is a way of measuring areas, called a form. And there
      is a quarter-turn operation, which comes from multiplying by the imaginary unit, the
      number whose square is minus one; applying it twice reverses a direction, just as two
      quarter-turns make a half-turn.

      On this space the three are not independent. Each one can be recovered from the other
      two: turn the metric through a quarter-turn and you get the area form, and so on
      around the triangle. A space in which the three lock together in this way is called
      Kahler, and the lock has a payoff. Such a space owns a volume of its own. Take the
      area form, raise it to the highest power the dimension allows, and the result
      measures volume. No external ruler is required.

      That is why the measure used throughout this programme is not an extra ingredient
      that someone had to supply. The geometry already contains it.
    in_csd: >
      This underwrites the claim that CSD's typicality measure, the measure used to say how
      large a region of states is, is geometric rather than chosen. That is the difference
      between deriving the Born rule and restating it with more steps.

      The corpus proves the locking of the three structures at two levels. At each point,
      in the space of directions through that point, it establishes the compatibility
      relations: the quarter-turn squares to minus one, the area form is the metric
      composed with the turn and vice versa, the form survives turning both of its inputs,
      and pairing a direction with its own quarter-turn returns its squared length. For the
      whole space of states, it establishes that the area form has the two properties that
      make a space symplectic, the setting in which classical mechanics is done; that the
      quarter-turn is the complex structure the space naturally carries, so that the space
      is Kahler in both of the standard senses; and that the top power of the form is the
      Fubini-Study measure up to a fixed constant.

      What this does not change is what carries the Born derivation, which still runs
      through the invariance characterisation of the measure: the fact that it is the
      unique measure left unchanged by the unitary symmetries. The geometry is proved to
      agree with that measure, not to replace it. The mathematical section gives the exact
      claims.
    mathematical: >
      With g the real part of the inner product, omega the imaginary part, and J
      multiplication by i: J squared is minus one, omega equals g after J, g equals omega
      after J, omega is of type (1,1), and omega(u, Ju) equals the squared norm of u. All
      of this is proved axiom-free, pointwise, on the tangent model.

      The manifold statements are all proved in the corpus's own manifold layer (Mathlib
      has no differential forms on manifolds at the pin): fsForm_isSymplectic (the
      Fubini-Study form is closed and non-degenerate on CP^n), fsForm_isKahler (with J the
      multiplication by i, read through the holomorphic atlas), IsKahler.nijenhuis_eq_zero
      (the Nijenhuis tensor vanishes), fsVolume_eq_smul_fubiniStudyMeasure (the top power
      of the form is (4 pi)^n times the Fubini-Study measure), and riemannianVolume_fsMetric
      (the Riemannian volume of the compatible metric is that top power over n factorial).
      The sector's posited Liouville measure is proved to be this volume
      (LF4/SectorManifold.lean).

      One restriction remains as stated. The corpus's permitted-claims list forbids calling
      Kahler geometry load-bearing for the Born rule, because the uniqueness argument that
      carries the programme runs through Haar measure. The geometry is proved to agree with
      it, not to replace it.
    person: >
      Erich Kahler (1906-2000) was born in Leipzig and took his doctorate there at
      twenty-two. After the war, which included a spell as a French prisoner of war, he
      held chairs at Berlin and Hamburg.

      The manifolds come from one short 1933 paper. He had noticed that when metric,
      complex structure and form are compatible, a single potential function generates
      everything, a simplification whose consequences he did not live to see fully spent:
      Hodge theory, the classification of complex surfaces, Calabi-Yau spaces, string
      theory. Andre Weil attached the name in the 1950s, two decades late. Kahler's own
      later work drifted into a private philosophical system that attracted essentially no
      following, a reminder that mathematicians get one name on the map, and rarely two.
    term: Kahler form
    eponyms: [Kahler]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/Geometry/Manifold/Instances/ProjectiveSpaceFubiniStudySymplectic.lean
      theorem: fsForm_isKahler
    related: [fubini-study-measure, liouville-measure, moment-map, poisson-bracket, duistermaat-heckman]

  - slug: luders-rule
    reviewed: 2026-09-12
    hook: >
      The textbook's second rule, which says how a state changes when it is measured, is
      not a second rule in CSD. It is what the record layer does.
    layman: >
      Measure a quantum system and two things happen: an outcome appears, and the state
      afterwards is different from the state before. Textbooks handle this with a separate
      postulate, the update rule, bolted on beside the equation of motion. Two rules, and
      no explanation of why the second exists or when it applies.

      There is also a subtlety inside the update rule itself, and Luders is the one who
      caught it. Sometimes several distinct states share the same measured value. Such a
      measurement is called degenerate, and a detector that reports only which region a
      particle landed in, without resolving anything finer, is an everyday example. For a
      degenerate measurement the naive update, jumping to one particular state with the
      measured value, is wrong. The right update projects onto the whole block of states
      that share the value, disturbing nothing within the block. Get this wrong and
      repeated measurements give inconsistent answers.

      Von Neumann's original rule of 1932 got the degenerate case wrong. Luders fixed it in
      1951, and the fix went largely unremarked for years: a correction to the foundations
      of measurement theory, published quietly and absorbed silently.
    in_csd: >
      In CSD the update is not a postulate at all. Records and the state update live on the
      same pointer arena, the space of states enlarged to include the pointer of the
      measuring device, and they are produced by the same construction. The record selects
      which region the trajectory realises, the Born weights come out of the volumes of the
      regions, and the state after measurement is the block projection. One mechanism, and
      the two textbook rules recovered as its two faces.

      The corpus treats the degenerate case as the general one, not as a footnote. Physics
      forces that ordering: real detectors are almost always degenerate, reporting which
      region a particle landed in without resolving the states within the region. A
      companion result sharpens the point. No fixed calibration at the level of individual
      states reproduces the update for every preparation, so the block form is not
      optional.

      The result carries a condition of its own, which should travel with it: it applies to
      outcomes whose weight is not too small, and says nothing about outcomes below that
      threshold.
    mathematical: >
      On the pointer arena, the record-conditioned marginal reproduces the Born weights of
      the preparation, and the post-measurement state is the Luders block projection. The
      conditioning carries a smallness condition that should travel with the statement:
      the outcome's weight must exceed the width of the corridor that the smooth witness
      leaves unrecorded, so the result says nothing about outcomes weighted below it.
      Degenerate block measurements are the case treated; rank-one projective measurements
      are the specialisation in which every block is a single ray.

      Two companion results complete the picture. A swap-based apparatus reproduces the
      Luders marginal exactly when calibrated, and, as the sharper negative, no fixed
      ray-level calibration works for every preparation, so calibration must be
      context-dependent. That negative is what forces the block treatment.
    person: >
      Gerhart Luders (1920-1995) was born in Hamburg, trained in the Gottingen orbit, and
      held a chair at Gottingen from 1960. The update rule comes from a 1951 paper
      correcting von Neumann: in effect a graduate student's observation that the great
      man's measurement postulate mishandled repeated eigenvalues.

      He is at least equally remembered for the CPT theorem, proved independently around
      1954: the statement that charge conjugation, parity and time reversal, composed, form
      a symmetry of every local relativistic field theory. Two results, both structural,
      both about what quantum theories must do rather than what any particular one does.
    term: Luders rule
    eponyms: [Luders]
    status: proved-in-corpus
    lean:
      module: CsdLean4/RecordLayer/PointerLudersMarginal.lean
      theorem: pointer_luders_born_prep
    related: [collapse, measurement-flow, pointer-basis, naimark-dilation, measurement-context]

  - slug: naimark-dilation
    reviewed: 2026-08-25
    hook: >
      Every noisy, imperfect measurement made in a real laboratory is an ideal textbook
      measurement carried out on a larger system. That single fact is what lets CSD's
      derivation of the Born weights cover actual experiments rather than idealised ones.
    layman: >
      A textbook quantum measurement is clean. Its outcomes are mutually exclusive, each
      outcome corresponds to a sharp yes-or-no test on the system, and the boundaries
      between outcomes are exact. Real detectors are not like that. They are noisy, they
      blur neighbouring outcomes together, and they sometimes report more outcomes than the
      system has distinguishable states. The general description of such a detector is a
      generalised measurement, usually called a POVM: a list of effects, one for each
      outcome, each of which assigns a probability to its outcome without the outcomes
      needing to be sharply separated. On its face this is a different and worse-behaved
      kind of object.

      Naimark's theorem says the mess is a matter of perspective. Any generalised
      measurement, however noisy, is an ordinary sharp measurement performed on the system
      together with an extra piece of apparatus. Enlarge the system to include that
      apparatus, a step called dilation, and the complicated measurement becomes a simple
      one. The blur is what a sharp measurement of the combined system looks like when you
      keep track of the original system alone. A rough analogy is a shadow: a blurred,
      complicated shadow on a wall can be cast by a simple solid object, and the blur
      belongs to the act of projecting down, not to the object. The analogy has one limit
      worth knowing. The larger system in the theorem is a mathematical construction, and
      it need not coincide with the physical detector on the bench.

      The consequence is that there is no separate theory of realistic measurements. There
      is one theory, sometimes viewed through a keyhole.
    in_csd: >
      CSD derives the Born weights as volumes: each outcome corresponds to a region of the
      space of states, and the probability of the outcome is the fraction of the natural
      volume that the region occupies. On its own, that argument covers only ideal sharp
      measurements. Since essentially every real experiment is a generalised measurement,
      this would be a serious gap for a programme that claims to be about physics rather
      than textbooks.

      Naimark's theorem closes the gap by transfer rather than by a second derivation.
      Dilate the measurement to the larger system, run the same volume-ratio argument
      there, and pull the answer back down. The generalised case then holds with no
      extra assumption: nothing about the measurement needs to be typical or generic for
      the transfer to work.

      The corpus builds the dilation explicitly and then uses it repeatedly. Symmetric
      informationally complete measurements, mutually unbiased bases, trine measurements,
      unambiguous state discrimination and weak measurements are each constructed through
      the same canonical dilation, and each inherits the volume statement without further
      work. The generalised-measurement chapter of the reconstruction is recorded as closed
      on exactly this mechanism.
    mathematical: >
      For a POVM equipped with a Naimark dilation, the Born weight of each effect equals
      the Fubini-Study volume of the corresponding outcome region in the dilated space, and
      the frequency statement transfers along with it. The result is unconditional: no
      genericity hypothesis is needed. The corpus theorem is
      povm_born_eq_dilated_volume_uncond.

      The dilation is constructed rather than assumed. It is built canonically from the
      square roots of the effects, so existence comes with an explicit witness, and the
      instances in the corpus inherit the theorem instead of re-proving it.
    person: >
      Mark Naimark (1909-1978) was born in Odessa, the son of an artist, and worked in
      Moscow at the Steklov Institute while teaching at the Moscow Institute of Physics and
      Technology. The dilation theorem dates from 1940. Its close cousins, due to
      Stinespring and Sz.-Nagy, form a small family of extension theorems discovered across
      a decade divided by war.

      His best-known work is the 1943 Gelfand-Naimark theorem characterising C-star
      algebras, written with Israel Gelfand, whose Moscow seminar was one of the most
      productive mathematical institutions of the century: a weekly event that ran for
      fifty years and was famous for the vigour of its arguments.
    term: Naimark dilation
    eponyms: [Naimark]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF4/BornRegionUncond.lean
      theorem: povm_born_eq_dilated_volume_uncond
    related: [stinespring-dilation, born-weight, luders-rule, measurement-flow, gleason-theorem]

  - slug: no-exact-finite-ccr
    reviewed: 2026-08-25
    hook: >
      In a world with only finitely many distinguishable states, the founding equation of
      quantum mechanics cannot hold exactly. One line of arithmetic proves it, and CSD says
      precisely where the equation gives way.
    layman: >
      Position and momentum obey the most famous relation in quantum mechanics, the
      canonical commutation relation: applying the two operations in opposite orders gives
      results that differ by a fixed universal amount. Everything characteristic of the
      theory, the uncertainty principle above all, flows from that relation. CSD holds that
      the world has only finitely many distinguishable states. The question is whether the
      relation can survive in such a world.

      It cannot, and the proof fits in a few sentences. In quantum mechanics, position and
      momentum are represented by square tables of numbers called matrices, and a finite
      world means finite tables. Adding up the entries along the main diagonal of a matrix
      gives a number called its trace, and the trace has a useful property: the trace of a
      product of two matrices does not depend on the order in which they are multiplied.
      The left side of the relation is the difference between two products in opposite
      orders, so its trace is always zero. The right side is a fixed nonzero constant
      placed on every diagonal entry, so its trace is that constant times the number of
      states, which is not zero. Zero cannot equal something nonzero, so no finite tables
      can satisfy the relation.

      So any finite theory owes an account of where the relation fails. The question is
      not whether it fails but where.
    in_csd: >
      The corpus pays this debt exactly rather than apologising for it. The model is the
      truncated oscillator: the harmonic oscillator, the standard quantum model of
      vibration, whose infinite ladder of energy levels is cut off at a finite top rung.
      On that ladder the relation holds perfectly on every energy level except the very top
      one, where it fails by a single localised defect of precisely the size the trace
      argument demands. The defect is not noise to be minimised. It is the exact
      compensation the counting requires, pushed into the one place a finite ladder must
      end.

      For any state a laboratory can actually prepare, with negligible population at the
      top rung, the departure is invisible. The result is deliberately stated without
      reference to CSD's own assumptions, because the obligation binds every
      finite-dimensional reconstruction of quantum mechanics: a rival programme claiming
      finiteness inherits the same debt whether or not it has noticed.
    mathematical: >
      No finite matrices satisfy [Q,P] = c times identity with c nonzero: the trace of a
      commutator vanishes, while the trace of c times identity is c times the dimension.
      As a corollary, the constant cannot be i h-bar in finite dimension. The corpus
      theorem is no_exact_finite_ccr.

      The companion construction gives the sharp positive statement: a conjugate pair on
      the N-level oscillator whose commutator is exactly i everywhere except the top Fock
      level, where a rank-one defect of magnitude N sits, exactly what makes the trace
      vanish.
    term: No exact finite-dimensional CCR
    status: proved-in-corpus
    lean:
      module: CsdLean4/CV/ApproxCCR.lean
      theorem: no_exact_finite_ccr
    related: [field-arena, wick-theorem, hermitian-operator, robertson-uncertainty, lie-trotter-formula]

  - slug: canonical-typicality
    reviewed: 2026-09-12
    hook: >
      A small piece of a large quantum system looks thermal not because anything prepared
      it that way, but because almost every state of the whole makes it look that way.
    layman: >
      Statistical mechanics traditionally starts with an ensemble: an imagined collection
      of copies of a system, weighted by probability, from which yours is somehow drawn.
      But your coffee is not an ensemble. It is one cup, in one state. Why should reasoning
      about imaginary collections say anything true about one actual cup?

      Canonical typicality dissolves the embarrassment. Take one large system in a single
      definite quantum state, with no ensemble and no drawing. Look at a small piece of it,
      meaning everything you could observe by measuring that piece alone. For the
      overwhelming majority of possible states of the whole, the piece looks thermal: its
      statistics are exactly those of a system in equilibrium with a heat bath. Calling a
      majority overwhelming requires a way of measuring how much of the space of states a
      set of states occupies, and the natural volume on that space provides it.

      You do not need to assume equilibrium statistics. You need only fail to be in an
      astronomically unlikely global state. Equilibrium, on this view, is not a physical
      process that happened to you. It is a statement about how much room there is in the
      space of states, and how little of that room the exceptions occupy.
    in_csd: >
      This is where the programme touches mainstream statistical mechanics, and the traffic
      goes both ways. Inbound, thermal behaviour is volume in the space of states, exactly
      as the Born weights are volume, so thermodynamics is native to the construction: one
      measure does both jobs.

      Outbound, the literature's standing complaint about canonical typicality is that its
      measure is an unmotivated prior. What does most look like, and who chose the ruler?
      CSD has an answer nobody else has: the ruler is the natural volume of the substrate,
      CSD's own underlying state space, and a uniqueness theorem stands behind it. That
      turns the programme's central manoeuvre into a contribution to someone else's open
      problem.

      The corpus is precise about what it establishes. It has the average statement, that
      the piece is thermal on average over global states, and it has concentration at a
      polynomial rate for diagonal statistics, meaning that a single sample does see the
      thermal value, up to the guarantee that Chebyshev's inequality gives (a general bound
      on how far a quantity can stray from its average, given its spread). The exponential
      rate that the literature headlines is the one piece still owed, and none of this is
      dynamical thermalisation, which would need mixing assumptions and lies outside the
      scope.
    mathematical: >
      For a global pure state drawn from the Fubini-Study measure, the average reduced
      state of a tensor subsystem is exactly maximally mixed. That is the first theorem,
      the expectation statement (canonical_typicality_expectation).

      The second is concentration at polynomial rate. The Fubini-Study second moments turn
      out to be pure symmetry algebra: a two-coordinate Hadamard rotation, a sign flip and
      a quarter-phase force E[x_i^2] = 2/(N(N+1)) and E[x_i x_j] = 1/(N(N+1)) with no
      integral ever computed, so every diagonal statistic has variance O(1/N) and Chebyshev
      makes a single sample typical (fs_chebyshev_concentration).

      The literature's headline rate, exponentially close to one, needs Levy's lemma,
      concentration of measure on high-dimensional spheres, which the proof assistant's
      library does not carry. That deviation-rate upgrade is recorded as a named residual
      rather than papered over. None of this is dynamical thermalisation, which would need
      mixing assumptions and is out of scope.
    person: >
      The modern result has two independent birth certificates, both from 2006. Goldstein,
      Lebowitz, Tumulka and Zanghi came from the Rutgers-Bochum-Genoa axis of the Bohmian
      school, which had kept typicality arguments alive through decades of unfashion.
      Popescu, Short and Winter came from quantum information at Bristol and Cambridge. It
      was the same theorem in two vocabularies, from two communities that barely cited
      each other.

      The idea itself is older. Schrodinger sketched it in the 1920s, and von Neumann proved
      a version in 1929 that was misunderstood, mistranslated and dismissed for eighty years
      before being rehabilitated. Few results have been discovered this many times.
    term: Canonical typicality
    status: proved-in-corpus
    lean:
      module: CsdLean4/Thermo/CanonicalTypicality.lean
      theorem: canonical_typicality_expectation
    related: [gibbs-state, typicality, von-neumann-entropy, fubini-study-measure, kms-condition]

  - slug: bargmann
    reviewed: 2026-09-11
    hook: >
      One phase survives every change of convention: the phase of the product of three
      overlaps taken around a cycle. It is also the fingerprint that tells a unitary
      symmetry from an anti-unitary one.
    layman: >
      A quantum state is described by a list of complex numbers, its amplitudes. A complex
      number has a size and a direction, and the direction is called its phase. Multiply
      every amplitude of a state by the same complex number of size one, which rotates all
      the phases by the same angle, and no measurement on that state changes. So the
      overall phase of a state is pure convention, and phases look like bookkeeping to be
      discarded. Yet geometric phases, the phases a state picks up when it is carried
      around a loop, are measurable physics. Which phases are real?

      Bargmann's invariant is the minimal answer. Any two states have an overlap, a
      complex number that records how much they resemble each other; its size fixes how
      easily the two states can be confused, and its phase depends on the conventions
      chosen for both. Take three states and multiply their overlaps around the cycle:
      first to second, second to third, third back to first. Each state's arbitrary phase
      enters that product twice, once as itself and once with its sign reversed, and the
      two appearances cancel. What remains is independent of every convention. It is the
      smallest phase that is genuinely there.

      This is the ancestor of every geometric phase. Carry a state slowly around a loop and
      the extra phase it acquires is this invariant, applied step by step along the edges
      of the loop.
    in_csd: >
      The corpus uses the invariant as a fingerprint in its Wigner analysis. A symmetry of
      quantum mechanics is a transformation of states that preserves every measurement
      probability, and Wigner's theorem says such symmetries come in exactly two families:
      unitary, which preserve phases, and anti-unitary, which reverse them, as time
      reversal does. The invariant tells the families apart, because unitaries leave it
      unchanged while anti-unitaries reverse it. That is what lets the choice between the
      two branches in the rigidity theorem be decided at each point rather than assumed.

      Bargmann's theorem is a separate result, and the corpus gets what it needs from it
      without proving the general case. Wigner's theorem hands you each symmetry with an
      undetermined phase. When two symmetries are applied in succession, the phases need
      not match up, and the mismatch is a leftover factor that can spoil any attempt to
      assign one consistent phase to every symmetry. Bargmann's theorem says continuity
      removes the leftover, so a family of symmetries defined only up to phase lifts to a
      genuine family with consistent phases. In general that is hard to prove. The corpus
      only ever needs it for a one-parameter group, a family of symmetries labelled by a
      single continuous number such as time, and there the obstruction is not merely
      surmountable but absent.

      The reason is that the real line has no loops. Any continuous phase along it can be
      unwound without obstruction, and the only freedom left over is a quantity that can
      take finitely many values yet must vary continuously, so it cannot vary at all and is
      absorbed by a rescaling. The consequence for the programme is that a phase
      consistency condition which would otherwise have to be assumed is proved instead.
      Together with the finite-dimensional Stone theorem, which turns a continuous
      one-parameter family of unitary symmetries into a Hamiltonian generator, this means
      that continuity of the flow alone delivers Schrodinger evolution.
    mathematical: >
      For rays u, v, w the invariant is the phase of the product of pairwise overlaps
      around the cycle. It is invariant under independent rescaling of each representative,
      since each scale factor appears once plainly and once conjugated. It is preserved by
      unitaries and conjugated by anti-unitaries, which is exactly the discriminator the
      rigidity proof needs.

      The one-parameter lift is a separate statement, proved in the corpus as
      `exists_continuous_phase_trivialisation`. Given a continuous U with
      U(s+t) = c(s,t) U(s) U(t), it produces a continuous unit-modulus b with
      c(s,t) b(s+t) = b(s) b(t). Determinants give d(s+t) = c(s,t)^N d(s) d(t) on the
      circle; the covering lift through `Circle.exp` gives a continuous theta with
      d = exp(i theta); b0 = exp(-i theta / N) then leaves a residual with Nth power one,
      constant by connectedness, and absorbed by rescaling. The coboundary datum is thereby
      discharged rather than carried as a hypothesis of the phase lift. The proof depends
      only on the foundational axiom triple.
    person: >
      Valentine Bargmann (1908-1989) was born in Berlin, left in 1933 when the dismissals
      began, and finished his doctorate in Zurich under Wentzel and Pauli. He emigrated in
      1937 and joined the Institute for Advanced Study as Einstein's assistant, working
      with him daily, before moving to the Princeton faculty for the rest of his career.

      His 1954 paper on projective representations answered the question Wigner's theorem
      leaves open: the theorem hands you a symmetry with an undetermined phase, and
      Bargmann settled when the phases can all be chosen consistently. He also worked out
      representations of the Lorentz group with Wigner, and was by all accounts a
      concert-grade pianist who had considered the other career.
    term: Bargmann invariant
    eponyms: [Bargmann]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/Analysis/Matrix/ProjectiveLift.lean
      theorem: exists_continuous_phase_trivialisation
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Wigner%27s_theorem
    related: [wigner-rigidity, schrodinger-from-records, stone-theorem, projective-sector, hilbert-space]

  - slug: bloch-sphere
    hook: >
      The states of the simplest quantum system form an ordinary ball. That is a lovely
      accident of low dimension, and it is the single most misleading picture in quantum
      mechanics.
    layman: >
      A qubit is the simplest quantum system, one with just two perfectly distinguishable
      states. Its possible states map exactly onto an ordinary sphere, and the map is
      useful. Measurement settings are directions in space. Two perfectly distinguishable
      states sit at opposite poles. The angle between two points sets the statistics of
      measuring one when the other was prepared. States of incomplete knowledge, called
      mixed states, fill the interior, with the state of complete ignorance, the coin flip,
      at dead centre. Every quantum intuition you can have in three dimensions, you can
      have here.

      Then comes the trap. All of that is an accident of having two levels. Go to a system
      with three distinguishable states and its state space is not a sphere, is not any
      familiar shape, and supports none of the same tricks. The picture that teaches
      everyone the subject also quietly teaches them falsehoods about the general case.

      Both halves matter. Use the sphere, and know when to put it down.
    in_csd: >
      The corpus computes on the sphere wherever qubits appear, in the Bell settings, the
      singlet correlations and the qubit Born rule, and it flags the accident explicitly
      rather than trading on it. For two levels the projective space, the space of
      physically distinct pure states, is itself a sphere. As a result, structure that in
      general has to be placed in a fibre above the state space, extra data attached over
      each state, can sit on the space itself, and nothing warns you that this is
      happening.

      The programme's fibre analysis makes the warning concrete. Contextual content, the
      part of the theory that makes an outcome depend on which other measurements
      accompany it, can live on the base for two levels purely because of this accident,
      and from three levels up the natural ways of keeping it there stop working. That
      finding narrowed the programme's own claims. The sphere is where everyone's
      intuition is formed, and the corpus treats it with corresponding care.
    mathematical: >
      CP^1 is diffeomorphic to the two-sphere; antipodal points are orthogonal states; the
      Fubini-Study measure is the normalised round area; trace distance is half the
      Euclidean chord. Mixed states fill the closed ball.

      For N above two, CP^(N-1) is not a sphere, has nontrivial topology, and admits no
      comparable elementary picture, which is precisely why qubit-calibrated intuition
      transfers badly and why the corpus's results for N at least three needed different
      methods.
    person: >
      Felix Bloch (1905-1983) was born in Zurich, studied at the ETH, and took his
      doctorate under Heisenberg at Leipzig with a thesis that founded the band theory of
      solids. Being Jewish, he left Germany in 1933 and settled at Stanford for the rest of
      his career, with war work at Los Alamos and on radar at Harvard.

      The sphere comes from his work on spins precessing in magnetic fields, the basis of
      nuclear magnetic resonance, for which he shared the 1952 Nobel Prize with Purcell and
      which became MRI. He also served as CERN's first Director-General in 1954, lasting
      about a year before deciding that administration was not physics. Quantum
      information adopted his sphere decades later.
    term: Bloch sphere
    eponyms: [Bloch]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Bloch_sphere
    related: [pauli-matrices, fubini-study-measure, hilbert-space, stern-gerlach, ramsey-interferometry]

  - slug: borel-set
    hook: >
      Before any region can have a probability, someone has to say which regions are
      allowed to have a size at all. The Borel sets are the answer everyone uses.
    layman: >
      Not every collection of points can be assigned a size, and this genuinely shocked
      mathematics when it surfaced. Insist that every set has a volume and you get
      contradictions, most famously a solid ball that can be cut into five pieces and
      reassembled into two balls each the same size as the original.

      The repair is to be selective. Fix a family of well-behaved sets, starting from
      simple ones like intervals, and allow yourself to combine them in countably many
      steps: take the union of a sequence of sets, take the complement of a set, and
      repeat. Only ever measure sets built this way. That family is the Borel sets.

      The restriction sounds drastic and costs nothing. Every region you could describe,
      draw or physically distinguish is a Borel set. The pathological sets need the axiom
      of choice, a principle allowing selections that no rule could specify, and so they
      can be proved to exist but never exhibited. Probability theory lives happily inside
      the fence.
    in_csd: >
      Every measure in the corpus is a Borel measure, whether on the state space or on the
      group of unitary transformations, and every outcome region whose volume becomes a
      Born weight is a Borel set. This is not decoration. The programme's central claim is
      a statement about the measures of regions, and it would be meaningless for regions
      that have no measure.

      One detail the constructions lean on is that the boundaries between outcome regions
      are null sets, meaning sets of volume zero. A state sitting exactly on a boundary is
      ambiguous about which outcome it belongs to, but the ambiguity has probability zero,
      so no prediction ever depends on resolving it.
    mathematical: >
      The Borel sigma-algebra of a topological space is the sigma-algebra generated by its
      open sets: the smallest family that contains the open sets and is closed under
      complements and countable unions.

      The corpus's measures are Borel probability measures on the projective space
      CP^(N-1) and on the unitary group U(N); the outcome regions are Borel sets with
      Fubini-Study-null boundaries, and the null-boundary fact is used in the proofs, not
      just noted.
    person: >
      Emile Borel (1871-1956) was born at Saint-Affrique in the Aveyron, a pastor's son,
      and topped the entrance examinations for both the Ecole Normale Superieure and the
      Ecole Polytechnique, choosing the Normale to the Polytechnique's lasting chagrin. He
      taught at Lille and then in Paris, at the Normale and the Sorbonne, founding measure
      theory around 1898.

      His second life was public: Radical-Socialist deputy in the Chamber, Minister of the
      Navy in 1925, and at seventy, Resistance activity that earned him a spell in Vichy
      detention and, after the war, the Resistance Medal. The infinite monkey theorem is
      his image, from a 1913 paper. Few mathematicians have run a ministry; fewer still
      after founding a field.
    term: Borel set
    eponyms: [Borel]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Borel_set
    related: [outcome-region, epistemic-measure, liouville-measure, euclidean-space, typicality-volume]

  - slug: cglmp-inequality
    hook: >
      Bell's inequality is built for measurements with two outcomes. Go beyond two and you
      need a new inequality, and the conflict with local realism grows stronger, not
      weaker.
    layman: >
      A Bell inequality is a bound on how strongly the results of measurements on two
      separated systems can be correlated if every result is fixed in advance and no
      influence travels between the systems, a picture called local realism. Quantum
      mechanics breaks the bound, and experiments agree with quantum mechanics. Bell's
      argument, as usually stated, assumes that each measurement has exactly two possible
      results. Real systems often have three, or five, or any number. Does the conflict
      with local realism survive when outcomes multiply, or is it an artefact of the
      two-outcome case?

      It survives, and it takes a new inequality to say so: the CGLMP inequality, one for
      each number of outcomes. The surprise is the direction of travel. The violation grows
      with the number of outcomes, so higher-dimensional systems disagree with local
      realism more strongly, not less.

      There was a second surprise in the same paper. The state that violates the inequality
      most is not the maximally entangled one. The state that is most entangled by the
      standard bookkeeping is not the state most at odds with common sense, a warning that
      entanglement is not a single number.
    in_csd: >
      The corpus carries the inequality so that its contextuality results do not lean on
      two-level systems, which are special in ways that keep surprising people. There is
      also a structural echo worth noticing. Three outcomes is precisely where the corpus's
      own fibre analysis finds the natural base-only constructions stop working, which is
      why it places contextual content in the fibre above the base; that placement is a
      judgement against a tight chain of constraints, not a proved dichotomy.

      So the dimension where this inequality becomes necessary is the dimension where the
      programme's geometry changes character. That is either a coincidence or a hint, and
      the honest label for now is coincidence.
    mathematical: >
      A Bell-type inequality for bipartite systems with d outcomes per side, violated by
      quantum mechanics for every d at least two, with the maximal violation increasing in
      d.

      The maximising state is not maximally entangled, which remains one of the sharpest
      reminders that entanglement measures and non-locality measures order states
      differently.
    person: >
      Daniel Collins, Nicolas Gisin, Noah Linden, Serge Massar and Sandu Popescu published
      the inequality in Physical Review Letters in 2002, with Gisin at Geneva, Popescu and
      Linden at Bristol, Massar in Brussels, and Collins a Bristol student. Five authors
      across four institutions for four pages of paper: a snapshot of how the European
      quantum information community actually worked in those years, by email and short
      visits, with the inequality named for the initials of whoever was on the manuscript
      when it converged.
    term: CGLMP inequality
    eponyms: [CGLMP]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://doi.org/10.1103/PhysRevLett.88.040404
    related: [bell-chsh, tsirelson-bound, mermin-inequality, gisin-theorem, contextuality]

  - slug: deutsch-jozsa
    hook: >
      The Deutsch-Jozsa algorithm settles a question with a single query where any exact
      classical method needs exponentially many. The problem it solves is useless by
      design, and historic for exactly that reason.
    layman: >
      The problem is deliberately artificial. A black box computes a function that is
      promised to be one of two kinds: constant, giving the same answer on every input, or
      balanced, giving one answer on exactly half the inputs and the other answer on the
      rest. Your job is to decide which kind it is while asking the box as few questions
      as possible.

      Classically, certainty is expensive. In the worst case you must check just over half
      of all inputs, and the number of inputs grows exponentially with the size of the
      problem. A quantum procedure asks once. It queries the box on a superposition of all
      inputs at the same time, a single state in which every input is present with some
      amplitude, and it arranges the interference between those amplitudes so that a
      constant function and a balanced function produce perfectly distinguishable
      outcomes.

      Nobody has ever needed to solve this problem, and that was never the point. The point
      was existence: here is a task where quantum computation provably beats classical
      computation. Others walked through the door it opened.
    in_csd: >
      This is one of the corpus's algorithm witnesses, and the corpus is precise about what
      such witnesses are for. They are scope evidence, not foundations. The algorithms
      presuppose the unitary-evolution pillar rather than support it, and their theorems
      concern circuit semantics and query counts, not where quantum mechanics comes from.

      What they demonstrate is that the formalised machinery is the real thing: strong
      enough to express and verify genuine algorithms with their amplitude bookkeeping
      intact, not a fragment tuned to make the foundational theorems pass. A
      reconstruction of quantum mechanics that could not run a quantum algorithm would
      invite a fair question.
    mathematical: >
      One oracle query decides constant-versus-balanced with certainty, whereas exact
      classical algorithms need 2^(n-1)+1 queries in the worst case for an n-bit input.

      The honest footnote is that if the classical side is allowed a tiny error
      probability, a handful of random queries suffice: the exponential separation is
      against exact classical computation. The problem was built to exhibit a separation,
      and does exactly that much.
    person: >
      David Deutsch, born in Haifa in 1953, studied at Cambridge and Oxford and has
      remained at Oxford's Clarendon Laboratory in a famously unusual arrangement, largely
      unsalaried, without teaching duties, working from home. The universal quantum
      computer is his 1985 construction; this algorithm came in 1992 with Richard Jozsa,
      later of Bristol and Cambridge.

      Deutsch is also the most committed Everettian alive, and has argued in print that
      quantum computation is evidence for many worlds: where else, he asks, would the
      computation happen? Most of the field declines the inference, and this programme,
      being single-trajectory, rejects it outright. The algorithm works either way, which
      is rather the point against the argument.
    term: Deutsch-Jozsa algorithm
    eponyms: [Deutsch]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Deutsch%E2%80%93Jozsa_algorithm
    related: [bernstein-vazirani, simon-algorithm, grover-algorithm, hadamard-test, quantum-fourier-transform]

  - slug: dirichlet-distribution
    hook: >
      Being fairly ignorant about proportions that must add up to one has a precise
      mathematical form, and by a small miracle it is exactly the form that quantum state
      space flattens into.
    layman: >
      Suppose you want to pick a random set of proportions, say the way a unit of
      probability splits across several possible outcomes. You cannot pick each share
      independently, because the shares are chained together: they must total one. Pick
      the first freely and the others feel it.

      The Dirichlet family is the standard machinery for randomness under exactly that
      constraint, and its flat member is the fair one: every legal way of dividing the
      whole is weighted equally. It is what a statistician writes down to express complete
      ignorance about a set of proportions, a starting assumption declared openly before
      any data arrive.

      Usually, then, it enters an analysis as a modelling choice. What earns it a page
      here is that it enters CSD's story in a completely different way: as a computed
      consequence, not a choice.
    in_csd: >
      Take a quantum state and compress it down to its outcome probabilities for a given
      measurement, forgetting the phases. Then ask what the natural volume on the space of
      states looks like after the compression. The answer, by the Duistermaat-Heckman
      theorem, a result about how symmetric curved spaces project onto flat ones, is the
      flat Dirichlet distribution, exactly. The curved geometry of state space projects to
      perfect fairness on the set of all possible proportions.

      This is the workhorse behind the Born result for systems with any number of levels:
      it converts curved volume ratios into elementary volumes of flat regions. It also
      carries a small philosophical sting. The distribution that statisticians must
      assume, the geometry here derives. Nobody chose fairness; it fell out of symmetry.
    mathematical: >
      The Dirichlet family lives on the probability simplex, indexed by positive
      concentration parameters; setting all parameters equal to one gives flat Lebesgue
      measure on the simplex.

      The theorem is that the pushforward of the Fubini-Study measure on CP^(N-1) along
      the (normalised) moment map is this flat member, at general N. It is a computed
      identity, with the M-factorial normalisation explicit.
    person: >
      Peter Gustav Lejeune Dirichlet (1805-1859) was born at Duren, between Aachen and
      Cologne, to a family of Belgian descent, and studied in Paris, where he reportedly
      kept Gauss's Disquisitiones under his pillow, having found the one book too
      expensive to buy and too essential to return. He worked at Breslau, then for nearly
      thirty years in Berlin, and then took Gauss's own chair at Gottingen in 1855, which
      he held for only four years before his death.

      The modern concept of a function, any rule and not necessarily a formula, is
      substantially his, as are the pigeonhole principle and the first rigorous
      convergence proof for Fourier series. The distribution bearing his name arose from
      an integral he evaluated; the statistics came much later and kept the name.
    term: Dirichlet distribution
    eponyms: [Dirichlet]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Dirichlet_distribution
    related: [fubini-study-measure, born-volume-ratio, duistermaat-heckman, typicality-volume, haar-measure]

  - slug: elitzur-vaidman
    hook: >
      You can certify that a bomb is live without a single photon touching it. The absence
      of an interaction becomes the measurement.
    layman: >
      The problem, as its inventors stated it, is this. You have a batch of bombs, each
      with a trigger so sensitive that a single photon sets it off. Some are duds: the
      trigger is missing and light passes through harmlessly. Find a live bomb. Testing
      means shining light on it, and shining light on a live one destroys it. Classically
      the task is hopeless, because any bomb you have verified you have also detonated.

      Quantum mechanics finds a way through, using an interferometer: a device that splits
      a single photon so that it travels along two paths at once and then recombines the
      paths so that they interfere. A dud changes nothing, the paths interfere as usual
      and a particular dark output port stays dark. A live bomb spoils the interference
      merely by being capable of absorbing the photon, and it does so even on runs where
      nothing was absorbed. When the dark port clicks, you hold a certified live bomb that
      no photon ever touched.

      The basic scheme certifies a quarter of the live bombs and sacrifices half. Cleverer
      versions push the efficiency as close to perfect as you like.
    in_csd: >
      This is one of the corpus's empirical twins, and among the sharpest tests an account
      of quantum mechanics can face, because it forces a definite statement about the path
      not taken. A story in which the photon simply went one way must explain how an
      object sitting in the other, untravelled arm changed the outcome. A story in which
      nothing was definite must explain what the final record is a record of.

      CSD routes its answer through the epistemic regions rather than through a story
      about paths. In CSD each measurement outcome corresponds to a region of the space of
      states, and the record is read against those regions. The presence of the absorber
      reshapes the region structure that the record is read against, and the volume
      bookkeeping does the rest. The point of carrying the case explicitly is that
      reproducing this experiment is a genuine constraint, not a formality.
    mathematical: >
      An interferometer in which an absorbing object in one arm destroys the interference,
      so that a detection at the normally dark port certifies the object's presence
      without absorption. The base efficiency is one quarter certified and one half
      destroyed.

      Kwiat-style iterated variants exploit the quantum Zeno effect to drive the certified
      fraction arbitrarily close to one.
    person: >
      Avshalom Elitzur and Lev Vaidman published the bomb tester in Foundations of Physics
      in 1993. Vaidman, of Tel Aviv University, is a career foundations physicist, the
      co-inventor of weak measurements with Aharonov and Albert, and a cheerful, combative
      Everettian. Elitzur is the wilder card: he had no doctorate at the time, worked
      outside the standard track, and was later associated with Bar-Ilan and a private
      institute, with interests running to time and thermodynamics.

      The idea was realised in the laboratory within two years, by Kwiat, Weinfurter,
      Herzog, Zeilinger and Kasevich at Innsbruck in 1995, using down-converted photons
      rather than bombs, to general relief.
    term: Elitzur-Vaidman bomb tester
    eponyms: [Elitzur]
    status: standard-mathematics
