  - slug: hermitian-operator
    image:
      file: img/hermitian-operator.jpg
      alt: "Portrait photograph of Charles Hermite"
      caption: "Charles Hermite."
      credit: "Eugène Pirou / Paul Dujardin, public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Charles_Hermite.jpg
      article: https://en.wikipedia.org/wiki/Charles_Hermite
    hook: >
      A single symmetry condition on an operator guarantees that every number it can
      produce in a measurement is real, and it delivers the whole machinery of outcomes
      and eigenstates at no extra cost.
    layman: >
      Quantum mechanics represents each measurable quantity, such as energy or the spin
      along a chosen axis, by an operator, a matrix that acts on the state of the system.
      But the entries of that matrix are complex numbers, numbers with an imaginary part,
      while every laboratory dial reads a real number, so you can ask which matrices can
      legitimately stand for something measurable.

      The answer is a symmetry condition. Take the matrix, flip it across its main
      diagonal, and replace every entry by its complex conjugate, the mirror-image number
      with the sign of its imaginary part reversed, and if the result is the original
      matrix the operator is Hermitian. Every square matrix has special vectors it merely
      rescales rather than turning in a new direction, and the rescaling factors are
      called its eigenvalues and the vectors its eigenvectors. For a Hermitian matrix the
      eigenvalues are forced to be real, and they're precisely the possible readings of
      the measurement. The eigenvectors are the states that give each reading with
      certainty, and they form a complete set of mutually perpendicular directions, which
      in quantum mechanics means perfectly distinguishable states, so measurement becomes
      a sorting of the state into bins that never blur into one another.

      Drop the condition and all of this falls apart, as outcomes could be complex, the
      states of certainty need no longer be distinguishable, and no consistent sorting
      exists. The fact that experimental numbers are real, traced back to its source, is
      this one algebraic symmetry.
    in_csd: >
      Everything measurable in CSD's machine-checked corpus is Hermitian, the observables,
      the Hamiltonians that generate motion, and the density operators that describe
      states which are only partly known. The spectral theorem, the result that a
      Hermitian operator can be broken into its eigenvalues and mutually perpendicular
      eigenvectors, is used constantly. Its most load-bearing single use is in the work on
      channels, the maps that describe how a state changes when it interacts with
      something else, where a density operator is first decomposed into its eigenvectors
      and only then integrated against, and the bridge between two ways of measuring the
      size of an operator, by trace and by norm, stands on that step.

      The finite-dimensional spectral facts the corpus consumes are proved within it
      rather than assumed, so this part of the measurement machinery isn't taken on trust
      from outside the formal development.
    mathematical: >
      A Hermitian matrix is one equal to its own conjugate transpose. Its eigenvalues are
      real, it's unitarily diagonalisable with mutually orthogonal eigenspaces, and hence
      it admits the functional calculus, applying real functions to operators through
      their spectra, that the corpus's entropy and channel chains consume throughout.

      One workmanlike convention is that the corpus states Hermiticity as a predicate on
      plain matrices rather than bundling it into a subtype, so statements stay close to
      the mathematics, proofs stay close to the library, and the finite-dimensional
      spectral facts consumed are proved and not assumed.
    person: >
      Charles Hermite (1822-1901) was born at Dieuze in Lorraine with a malformed right
      foot. The Ecole Polytechnique admitted him and then forced him out over the
      disability, ending the engineering career he had trained for, so mathematics got him
      instead. He eventually taught at the Polytechnique that had rejected him, at the
      Ecole Normale and at the Sorbonne, and Poincare was his student.

      His 1873 proof that e is transcendental was the first for any naturally occurring
      number, and his method handed Lindemann the transcendence of pi nine years later,
      closing the problem of squaring the circle after two millennia. He never sought the
      second result himself, writing that he dared not attempt it, which is one of
      history's more consequential displays of mathematical modesty.
    term: Hermitian operator
    eponyms: [Hermitian]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hermitian_matrix
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: TN0 fixes the operator conventions the corpus uses
    related: [hilbert-space, pauli-matrices, loewner-order, stone-theorem, robertson-uncertainty]

  - slug: hilbert-space
    image:
      file: img/hilbert-space.jpg
      alt: "Portrait photograph of David Hilbert"
      caption: "David Hilbert."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Hilbert.jpg
      article: https://en.wikipedia.org/wiki/David_Hilbert
    hook: >
      Hilbert space is the stage on which quantum mechanics is usually performed, and
      CSD's claim is that it's scenery, the shadow cast by the physical object and not the
      object itself.
    layman: >
      Quantum mechanics needs three things from the space its states live in.
      Superposition, the ability to combine two states into a third, requires that states
      can be added like arrows, which makes them vectors. Probabilities require lengths
      and angles, which come from an inner product, a rule that assigns a number to every
      pair of vectors and thereby measures how long each is and how far apart they point.
      And calculus, with its limits and convergence, requires that a sequence of states
      closing in on something actually closes in on a state within the space rather than
      leaking out of it, and this property is called completeness. A Hilbert space is
      exactly a space with all three, vectors, an inner product and completeness.

      In finitely many dimensions completeness comes for free, and a Hilbert space is
      nothing more exotic than ordinary Euclidean space with complex coordinates. In
      infinitely many dimensions completeness is a genuine constraint and the source of
      most of the subject's analytical difficulties.

      The standard formulation of quantum mechanics identifies the theory with this stage,
      so states are vectors in Hilbert space and that's where the theory happens, or so
      the textbook says.
    in_csd: >
      CSD's sharpest departure from textbook framing is here. On CSD's account the
      physical world doesn't live in Hilbert space, as physical states are points of the
      constraint surface, the programme's underlying state space. The Hilbert space, or
      more precisely the space of its rays (a vector and all its rescalings count as one
      physical state, so only the direction matters), is bookkeeping built above that
      substrate, and it records what an observer can know and carries the regions of
      possible outcomes and the probabilities attached to them.

      To say that quantum mechanics happens in Hilbert space is, on this account, like
      saying that the weather happens on the weather map, which is true about the
      representation and silent about the thing represented. The programme's analysis of
      the fibre, the structure that sits above each point of the space of rays, pushes
      further, as the space of rays is a lossy projection of the substrate and the content
      that forms records lives above it. Whether or not you accept the programme, this is
      the single point to grasp about how it reads the formalism.
    mathematical: >
      A Hilbert space is a complete complex inner product space. The corpus is finite-
      dimensional throughout, so completeness is free, and the operative object is
      CP^(N-1), the space of rays, since vectors differing by a phase are one physical
      state.

      Infinite dimension, with its unbounded operators, domains and continuous spectra, is
      deliberately out of scope, and the continuous-variable strand approximates it at an
      explicit finite cutoff instead.
    person: >
      David Hilbert (1862-1943) was born in Konigsberg and moved in 1895 to Gottingen,
      which he made the centre of world mathematics for a generation. His 1900 Paris
      address, with its twenty-three problems, set the century's agenda, and his formalist
      dream of mathematics proved complete and consistent by finite means was bounded for
      ever by Godel in 1931.

      Two footnotes have teeth. The space isn't his coinage, as von Neumann named it while
      building the rigorous foundations of quantum mechanics in Hilbert's own department.
      And when the Nazi education minister asked him, in 1934, whether Gottingen
      mathematics had suffered from the removal of the Jews, Hilbert answered that it
      hadn't suffered, as it no longer existed.
    term: Hilbert space
    eponyms: [Hilbert]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hilbert_space
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper C reconstructs operational quantum mechanics without giving Hilbert space primacy
    related: [euclidean-space, hermitian-operator, projective-sector, bloch-sphere, kronecker-product]

  - slug: hong-ou-mandel
    image:
      file: img/hong-ou-mandel.png
      wide: true
      alt: "Diagram of the four output possibilities in the Hong-Ou-Mandel effect"
      caption: "The four ways two photons can leave a beam splitter; the middle two cancel, so the photons always leave together."
      credit: "Pieter Kok, CC BY-SA 3.0, via Wikimedia Commons"
      licence: "CC BY-SA 3.0"
      source: https://commons.wikimedia.org/wiki/File:Hong_Ou_Mandel_effect.png
      article: https://en.wikipedia.org/wiki/Hong–Ou–Mandel_effect
    hook: >
      When two identical photons meet at a beam splitter they always leave together and
      never one through each exit, so their indistinguishability shows up as a hole in the
      data.
    layman: >
      A beam splitter is a half-silvered mirror, so light that hits it is either
      transmitted straight through or reflected, and for a single photon, a single
      particle of light, the choice is random with equal odds. Now send two photons at the
      splitter from opposite sides so they arrive at the same instant, with a detector
      waiting at each exit. Simple counting suggests that half the time the photons should
      leave through different exits, with one detector clicking on each side, an event
      called a coincidence.

      The experiment says never. If the photons are truly identical, the two histories
      that lead to a coincidence, both transmitted and both reflected, cancel each other.
      In quantum mechanics each possible history carries a number called an amplitude, and
      when different histories end in the same outcome their amplitudes are added before
      the probability is worked out, so for the coincidence outcome the two amplitudes are
      equal and opposite and their sum is zero. Both photons always leave through the same
      exit, and coincidence counts drop to nothing.

      The signature is the Hong-Ou-Mandel dip. Scan the time offset between the photons'
      arrivals and watch the coincidences vanish as the two become simultaneous. The depth
      of the dip measures how identical the photons are, and its width measures their
      coherence time, the stretch of time over which each photon's wave keeps step with
      itself. What began as a demonstration is now a workshop tool, the standard ruler for
      indistinguishability in photonics.
    in_csd: >
      The Hong-Ou-Mandel effect is one of the programme's empirical twins, the flagship
      experiments CSD's machine-checked corpus reproduces as pass-or-fail tests, and it
      was chosen because it probes a different organ from the Bell family of experiments.
      There's no separation here and no question of locality at all, only two alternatives
      cancelling. The question it puts to any account of quantum mechanics is pure, as it
      asks what, in your description of the world, is the difference between both photons
      transmitted and both reflected, such that the two can annihilate.

      For a theory with an underlying substrate the question has bite, because naively the
      two configurations differ only by a relabelling that nothing could observe.
      Reproducing the dip is therefore a real constraint on how CSD's regions and volumes
      handle the exchange of identical particles, which is exactly why the case is
      carried.
    mathematical: >
      For two indistinguishable bosons at the input ports of a balanced beam splitter, the
      both-transmitted and both-reflected amplitudes cancel, so the output is a
      superposition of both-photons-left and both-photons-right and the coincidence rate
      is zero.

      Partial distinguishability revives coincidences in proportion, which makes the
      visibility of the dip a quantitative measure of photon identity.
    person: >
      Chung Ki Hong and Zheyu (Jeff) Ou were graduate students of Leonard Mandel at the
      University of Rochester when the three demonstrated the effect in 1987, in a paper
      whose stated headline was metrological, measuring sub-picosecond time intervals by
      counting coincidences, decades before femtosecond lasers made such numbers routine.

      Mandel (1927-2001), born in Berlin and brought to Britain as a refugee in 1938, took
      his degrees at Birkbeck College London and moved to Rochester in 1964, where he
      effectively founded experimental quantum optics, and half the field's senior figures
      passed through his group. Ou went on to a professorship at IUPUI in Indianapolis.
    term: Hong-Ou-Mandel effect
    eponyms: [Hong, Mandel]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hong%E2%80%93Ou%E2%80%93Mandel_effect
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-4
      text: The fourth primer page explains the interference and visibility this effect displays
    related: [mach-zehnder, elitzur-vaidman, bell-not-join, typicality-volume, ramsey-interferometry]

  - slug: jacobi-identity
    image:
      file: img/jacobi-identity.jpg
      alt: "Portrait of Carl Gustav Jacob Jacobi"
      caption: "Carl Gustav Jacob Jacobi."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Carl_Jacobi.jpg
      article: https://en.wikipedia.org/wiki/Carl_Gustav_Jacob_Jacobi
    hook: >
      The Jacobi identity is the law that turns the mismatch between doing things in
      different orders into a structure of its own, and it's why classical and quantum
      dynamics read as two dialects of one language.
    layman: >
      Many operations depend on the order in which they're done. Turn a book a quarter
      turn about a vertical axis and then about a horizontal one, and it ends up in a
      different position from the one it reaches when the two turns are done the other way
      round. Take two operations, do them in one order and then in the other, and call the
      difference their bracket, which measures how badly the two fail to commute, that is,
      to give the same result in either order. The question is whether this bracket is
      merely a number you compute case by case, or whether it obeys laws of its own,
      because if it had none every calculation involving it would be bespoke drudgery.

      It obeys exactly one deep law. Take three ingredients, form the bracket of the first
      with the bracket of the other two, then cycle the roles so each ingredient takes the
      outer position in turn, and add the three results, and everything cancels. That's
      the Jacobi identity, and it's what promotes the bracket from an arithmetical
      accident to an algebraic structure, the multiplication of what mathematicians call a
      Lie algebra, the algebra of continuous symmetries such as rotations and time
      evolution.

      The payoff for physics is that two very different brackets both satisfy it. In
      quantum mechanics the bracket is the commutator, the difference between applying two
      operators in one order and in the other, and in classical mechanics it's the Poisson
      bracket, the rule that says how one quantity, such as position, changes along the
      motion generated by another, such as energy. It's the same law in two theories, and
      that shared grammar is why quantum and classical dynamics translate into each other
      as smoothly as they do.
    in_csd: >
      The identity sits underneath the programme's central translation. CSD's ontic side,
      its description of what actually exists, is a deterministic flow with Hamiltonian
      structure, the same kind of structure that governs classical mechanics, and its
      epistemic side, its description of what can be known, is operator dynamics with
      commutators, the familiar quantum formalism. The two levels correspond rather than
      merely resembling each other, because both brackets obey the same law, and without
      it the two levels would be connected only by analogy and hand-waving.

      This is background structure rather than a theorem of the corpus, and the formal
      work around it has a definite edge. The state space is established as a symplectic
      manifold, the geometric setting in which Hamiltonian flows are usually studied, so
      its area-like structure is closed and non-degenerate, the space is Kahler, and
      Hamiltonian vector fields with their flows are constructed on it. The bracket of two
      functions on that manifold, and the Jacobi identity for it, aren't yet stated at the
      manifold level, as the bracket is formal in canonical coordinates, where its
      vanishing for functions with disjoint supports is proved and used, and that
      remaining step is recorded as a gap.
    mathematical: >
      For a Lie bracket, the cyclic sum of nested brackets vanishes, and equivalently
      bracketing with a fixed element is a derivation, which is the form the identity
      takes in actual calculations.

      The matrix commutator and the Poisson bracket both satisfy it, making each a Lie
      algebra multiplication and licensing the classical-quantum dictionary.

      The corpus status is that the symplectic structure of CP^(N-1) is formal
      (fsForm_isSymplectic, the atlas-sense IsKahler, hamiltonianVectorField with integral
      curves, Mathlib/Geometry/Manifold/), and the canonical bracket in a Darboux chart
      and its disjoint-support vanishing are formal (SigmaLayer/ChartBracket.lean,
      poissonBracket, poissonBracket_eq_zero_of_disjoint). A manifold-level bracket of
      functions and its Jacobi identity aren't stated, and that's the recorded gap.
    person: >
      Carl Gustav Jacob Jacobi (1804-1851) was born in Potsdam to a Jewish banking family
      and converted to Christianity to make an academic career possible, the standard toll
      of the era. He taught at Konigsberg for eighteen years, building it into a
      mathematical centre, before illness moved him to Berlin.

      His work covered elliptic functions, in a legendary race with Abel, determinants,
      and mechanics, and the Hamilton-Jacobi equation still carries his half of the name.
      He also left the era's best statement of pure-science defiance, answering Fourier's
      complaint that he wasted his talent on number theory with the reply that the sole
      end of science is the honour of the human spirit.
    term: Jacobi identity
    eponyms: [Jacobi]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Jacobi_identity
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper D's geometric mechanics is where this identity carries the dynamics
    related: [poisson-bracket, kahler-form, liouville-measure, moment-map, schrodinger-from-records]

  - slug: kronecker-product
    image:
      file: img/kronecker-product.jpg
      alt: "Portrait photograph of Leopold Kronecker"
      caption: "Leopold Kronecker in 1865."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Leopold_Kronecker_1865.jpg
      article: https://en.wikipedia.org/wiki/Leopold_Kronecker
    hook: >
      Two quantum systems become one by multiplying their descriptions rather than adding
      them, which is why quantum resources multiply where classical ones merely add.
    layman: >
      Two quantum systems sit side by side, and you want to know what describes the pair.
      Classically you'd simply list both descriptions, one after the other, and the size
      of the joint description would be the sum of the two sizes. Quantum mechanics
      demands more, as every state of the first system can be paired with every state of
      the second, and every superposition of such pairings, every way of combining them
      with weights, is also a state of the pair, so the number of independent directions
      the pair can point in, its dimension, is the product of the two individual
      dimensions and not their sum.

      The Kronecker product is this fact written out in matrix form. It's a recipe that
      takes a square grid of numbers describing one system and a square grid describing
      the other, and multiplies them into a much larger grid describing both, with one row
      and one column for every pairing of a row from the first with a row from the second.
      It's mechanical to compute and explosive in its consequences.

      That multiplication instead of addition is the origin of quantum computing's power
      and of the difficulty of simulating quantum systems alike, as thirty qubits, thirty
      two-level systems, need about a billion dimensions to describe. The exponential
      lives here.
    in_csd: >
      Throughout CSD's machine-checked corpus the Kronecker product is how composition,
      the joining of systems into a larger one, is realised, and in one important place
      it's also how composition is earned rather than assumed. The results on composite
      systems don't start from the tensor-product structure of quantum mechanics, as they
      derive it. Starting from two collections of operations, one for each part, such that
      operations on different parts can be done in either order and the two collections
      together generate every operation on the whole, the corpus proves that the whole
      must have the structure of a tensor product, with dimension equal to the product of
      the parts' dimensions, and it proves this for arbitrary ways of embedding the parts
      in the whole. The programme's necessity audit, its internal review of its results,
      rates that among the strongest in the development.

      Elsewhere it's infrastructure. The partial trace that discards an environment, the
      reduced states that describe one part of a larger system, and the marginals of
      thermal states are all Kronecker bookkeeping, consumed daily.
    mathematical: >
      The Kronecker product is the matrix form of the operator tensor product, with the
      mixed-product identity, (A tensor B)(C tensor D) = (AC) tensor (BD), doing the
      functorial work.

      The partial-trace machinery consumes it, and the composite reconstruction earns it
      rather than assuming it, as commuting generating subalgebras force tensor structure
      and multiplicative dimension.
    person: >
      Leopold Kronecker (1823-1891) was born in Liegnitz, Silesia, and was privately
      tutored by Kummer, the start of a lifelong alliance. He then did something almost no
      mathematician has done, as he stopped at his doctorate, spent a decade running the
      family's banking and estate business, grew rich, and returned to mathematics at
      thirty with no need of a salary. He lectured at Berlin for twenty years before
      accepting a chair at all.

      He's remembered for his constructivist conviction, summed up in his remark that God
      made the integers and all else is the work of man, and for prosecuting that
      conviction against Cantor's infinities with a persistence that shaded into
      persecution and darkened Cantor's life. The product bearing his name is, ironically,
      the least controversial thing attached to it.
    term: Kronecker product
    eponyms: [Kronecker]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Kronecker_product
    site_link:
      url: https://www.constraintsurfacedynamics.com/technical-notes
      text: TN4 covers the composite systems this product describes
    related: [partial-trace, hilbert-space, bell-not-join, field-arena, stinespring-dilation]

  - slug: leggett-garg
    image:
      file: img/leggett-garg.jpg
      alt: "Portrait photograph of Anthony Leggett"
      caption: "Anthony Leggett in 2007."
      credit: "Kenneth C. Zirkel, CC BY-SA 3.0, via Wikimedia Commons"
      licence: "CC BY-SA 3.0"
      source: https://commons.wikimedia.org/wiki/File:Nobel_Laureate_Sir_Anthony_James_Leggett_in_2007_(cropped).jpg
      article: https://en.wikipedia.org/wiki/Anthony_Leggett
    hook: >
      Bell's argument can be rotated from space into time, and what it then tests isn't
      action at a distance but whether the world has a definite history.
    layman: >
      Bell inequalities need two separated particles, so a sceptic can file the whole
      conflict with common sense under strange facts about distance. Leggett and Garg
      asked the question with a single particle and no distance at all, which is whether a
      system has definite properties in between the moments when you look at it, and
      whether you can look without disturbing it.

      Grant those two assumptions, a definite history and gentle measurement, and the
      correlations between measurements made at different times, the degree to which one
      result predicts the next, obey a strict bound. Quantum mechanics breaks the bound,
      and experiments agree with quantum mechanics.

      So one of the two assumptions has to go, as either properties aren't definite
      between measurements or measurement is never really gentle. The inequality can't
      tell you which, and every account of quantum mechanics has to choose.
    in_csd: >
      This test aims closer to CSD's heart than Bell does, which is exactly why the
      programme's machine-checked corpus carries it. A theory built on an underlying
      substrate practically advertises definite properties between measurements, as that's
      what having a substrate means, so an inequality that targets precisely this
      assumption probes the programme where it's most exposed.

      CSD's escape is through the second assumption, and the escape is principled rather
      than convenient. Measurements in CSD are physical interactions that produce records,
      and interactions aren't gentle. The underlying state is definite at every moment,
      and the act of reading it participates in the dynamics. A definite history with
      invasive measurement violates nothing in the argument, and that's exactly the
      combination CSD is built from.
    mathematical: >
      The inequality bounds combinations of two-time correlation functions. It follows
      from macrorealism plus non-invasive measurability, and quantum mechanics violates
      it.

      Both hypotheses are load-bearing, so an account with definite properties but
      invasive measurements is untouched, and that's the compartment this programme
      occupies, stated rather than implied.
    person: >
      Anthony Leggett, born in London in 1938, read Greats, the Oxford classics course,
      before switching to physics, a route that no longer exists. He took his doctorate
      under Dirk ter Haar, spent twenty years at Sussex, and moved to the University of
      Illinois at Urbana-Champaign in 1983. His 2003 Nobel Prize was for superfluid
      helium-3.

      The inequality, with his student Anupam Garg in 1985, wasn't foundations tourism.
      Leggett has argued seriously for decades that quantum mechanics might actually fail
      at macroscopic scales, and the inequality was built as the instrument to catch it
      failing. The experiments keep siding with quantum mechanics, which Leggett, to his
      credit, keeps reporting.
    term: Leggett-Garg inequality
    eponyms: [Leggett, Garg]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Leggett%E2%80%93Garg_inequality
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-4
      text: The fourth primer page explains why an intermediate measurement is not innocent
