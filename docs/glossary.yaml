  - slug: many-to-one-projection
    hook: >
      Behind every quantum state stands a crowd of world-states, and the projection that
      maps the crowd to one state loses information on purpose, and that loss is where
      quantum probability comes from.
    layman: >
      If the world is deterministic and you know the quantum state exactly, you can ask
      why you can't predict the outcome of a measurement. Something must separate what the
      state tells you from what the world knows, and in CSD that something is a
      projection, a map from the full arena of world-states down to the space of quantum
      states, whose important feature is that it forgets.

      Many distinct points of the arena map to the same quantum state, as the map is many-
      to-one by design. Knowing the quantum state therefore fixes only the visible
      coordinate of the world's position and says nothing about the rest, and outcomes
      depend on the rest, so exact knowledge of the state is compatible with genuine
      ignorance of the outcome, even though nothing in the world is random.

      This is the oldest move in statistical physics, relocated. The temperature of a gas
      is a single number many different arrangements of molecules share, and knowing the
      temperature doesn't tell you where the molecules are. The novelty in CSD isn't the
      move itself but what's proved about the projection.
    in_csd: >
      The projection from the arena to the projective sector, CSD's name for the space of
      quantum states, is postulated to be measurable and many-to-one. Measurable means
      that any region of the state space to which a size can be assigned pulls back to a
      region of the arena to which a size can be assigned, so volumes upstairs and
      downstairs can be compared, and the many-to-one character is intended and is stated
      as such in the source.

      Everything epistemic, everything about what an observer can know, happens downstream
      of the projection, and everything ontic, everything about what's actually the case,
      happens upstream. The Born weight of a region of the state space is the ontic volume
      of the set of arena points that project into it, so the information the projection
      forgets is exactly the information typicality averages over.

      What keeps this from being a shell game is an anti-circularity discipline. The
      projection carries no Born equality, no identity between measures and no unitarity,
      as those are theorems proved about it downstream and not properties packed into the
      definition.
    mathematical: >
      ProjectiveSector carries the measurable map pi from Sigma to the projective space
      with no further structure, and the projective law is the pushforward of an ontic
      measure along pi. On the Kahler instance pi is the product projection CP^(N-1) x T^2
      -> CP^(N-1), with every fibre a full torus.

      The pushforward identity, Liouville measure to Fubini-Study measure, is proved, and
      the guard scripts enforce that the projection's descent equation is genuinely
      consumed downstream rather than decoratively carried.
    term: Many-to-one projection
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-3
      text: The third primer page explains quantum states as summaries of hidden detail
    related: [fibre, constraint-surface, projectability, ontic-vs-epistemic, projective-sector]

  - slug: pointer-basis
    reviewed: 2026-09-14
    hook: >
      A measuring apparatus doesn't record what you ask it to, as it records what it can
      keep, and what it can keep is decided by its interaction with the surroundings and
      not by the experimenter.
    layman: >
      A measuring device is supposed to end up in one of several stable readings, so the
      needle points left or it points right. Yet the equations of quantum mechanics
      happily describe superpositions of pointer readings, states in which the needle is
      in no definite position at all, and nobody has ever seen one, so you can ask why
      pointers settle into some states and not others. The pointer basis is the name for
      the privileged set of readings a device can settle into, and the question is what
      picks it out.

      The standard answer, which CSD adopts, is called einselection, short for
      environment-induced selection. The environment interacts with the apparatus
      continuously, and only certain states of the apparatus survive that interaction
      unscrambled, so those survivors form the pointer basis. A pointer position is robust
      because bumping into air molecules doesn't change it, and a superposition of two
      positions is fragile because the first bump registers which position the molecule
      met, and the superposition is gone.

      What decides which states survive is a property called commutation. Two operations
      commute when the order in which they're carried out makes no difference, and an
      observable, a measurable property of the apparatus, survives the interaction exactly
      when the interaction commutes with it, so the interaction can't alter it. In the
      corpus this is a theorem rather than a slogan, as an observable is left unchanged by
      the interaction at every moment if and only if it commutes with it. What remains
      owed sits one level up, as which interaction a given apparatus realises is an input
      to the theorem, and deriving that interaction from the arena's own dynamics is an
      open problem, which the corpus says wherever the result is stated.
    in_csd: >
      In the record layer the pointer basis is what makes a record a record, a stable, re-
      readable configuration the de-isolation dynamics writes and the environment doesn't
      erase. It's important to be precise about what's proved. The state of a system is
      written as a table of numbers called a density matrix, whose diagonal entries are
      the populations, the probabilities of the individual readings, and whose off-
      diagonal entries are the coherences, the terms that encode a superposition. For a
      general number of outcomes the dephasing channel is defined as the map that keeps
      the diagonal of the density matrix and discards everything else, so the statement
      that it kills the coherences and preserves the populations is a definitional
      unfolding, and the pointer basis is, by construction, the basis in which the matrix
      was written down. The corpus flags this in the theorem's own documentation rather
      than leaving it to be discovered.

      The content near that statement is real but narrower. The channel genuinely acts on
      a superposed state rather than leaving it alone, the degenerate case, where all
      readings are equally likely and no basis is preferred, is handled rather than waved
      at, and for a two-level system the continuous-time law of decay is exact. The
      commutation criterion is a full characterisation, as the pointer observables of a
      supplied interaction are exactly the commuting ones. They're constants of the
      interaction's motion, their populations are conserved in every state, and any non-
      commuting projection is provably disturbed. The ontic origin of the pointer basis,
      einselection from the arena's own dynamics rather than from a supplied interaction,
      is explicitly deferred to a later tier of the programme.

      The two-level reading applies here as everywhere in CSD, as the pointer basis is a
      fact about the dynamics, on the ontic side, while which pointer reading obtains in a
      given run is the record, selected by the trajectory.
    mathematical: >
      The theorem einselectionN states that the general-N dephasing channel zeroes the
      off-diagonal terms in the pointer basis and preserves the diagonal populations.
      Stated alone this is definitional, since the channel is diagonal(rho i i) and the
      off-diagonal part of a diagonal matrix is zero, and the docstring says so. The
      content sits in the companions, as the channel acts non-trivially on a coherent
      state, it restricts to the derived qubit reduction, and at equal populations it
      degenerates to a multiple of the identity, invariant under any unitary conjugation,
      so no basis is preferred.

      The genuinely dynamical statement is the qubit dephasing semigroup, where the off-
      diagonal coherence decays exactly as exp(-gamma t) with populations conserved and
      the limit at large t proved, and amplitude damping is its companion. Both are two-
      level. At general N the criterion is characterised in PointerCommutation.lean, where
      pointer_invariant_iff_commute proves that an observable is a constant of the
      interaction flow at every time iff it commutes with the Hermitian generator, with
      the disturbance of any non-commuting observable proved alongside. The interaction is
      the input, and einselection from Sigma-dynamics is gated to the entangled tier.
    term: Pointer basis
    status: proved-in-corpus
