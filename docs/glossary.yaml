  - slug: choi-theorem
    reviewed: 2026-09-14
    hook: >
      A transformation of quantum states is physically allowed exactly when one matrix
      built from it passes a single positivity test, and CSD proves both directions, so
      whether a map is physical becomes a decidable question of linear algebra.
    layman: >
      You can ask which transformations of a quantum state are physically allowed, and the
      abstract answer is the completely positive, trace-preserving maps. Trace-preserving
      means total probability is conserved, and completely positive means probabilities
      stay nonnegative not only for the system itself but for the system together with any
      bystander system it might be entangled with. That last clause quantifies over every
      possible bystander, which isn't something you can check by computation.

      Choi's insight of 1975 collapses the quantifier. Encode the whole map into a single
      matrix by feeding it one half of a maximally entangled pair, a pair of systems whose
      joint state is as correlated as quantum mechanics allows. The map is legitimate
      precisely when that one matrix is positive semidefinite, meaning that it has no
      negative eigenvalues, which is the matrix analogue of a number being nonnegative, so
      an infinite family of conditions becomes one eigenvalue check.

      The corpus proves both directions. Every channel written in Kraus form, as a family
      of simpler operators applied and summed, has a positive Choi matrix, and every
      positive semidefinite matrix on the combined system arises from some Kraus family,
      and the equivalence is the theorem.
    in_csd: >
      Choi's theorem is the workhorse of the corpus's channel layer. The positivity
      witnesses at the generator level in the open-system results, the channel
      constructions of the coarse-graining tier, and the arguments about the jump part in
      the proof that the Lindblad flow is completely positive all route through Kraus
      decompositions certified by it.

      It sits on the operational stratum, standard quantum information formalised because
      the programme's claims lean on it, and the construction is fully explicit, as the
      converse direction actually builds the Kraus family from the spectral decomposition
      of the Choi matrix.
    mathematical: >
      The theorem choi_iff_posSemidef states that a matrix on the composite index is the
      Choi matrix of some Kraus family if and only if it's positive semidefinite.

      The forward direction is the rank-one decomposition of the Choi matrix into outer
      products of vectorised Kraus operators, and the converse reconstructs Kraus
      operators from a PSD matrix's spectral square roots, de-vectorised along the index
      pairing.
    person: >
      Man-Duen Choi, born in 1945 in Hong Kong, spent his career at the University of
      Toronto working in operator algebras. The 1975 paper, Completely positive linear
      maps on complex matrices, in Linear Algebra and its Applications, is a model of
      brevity, and its central object was independently studied by Andrzej Jamiolkowski,
      which is why the encoding is often called the Choi-Jamiolkowski isomorphism.
    term: Choi's theorem
    eponyms: [Choi]
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/LF2/ChoiConverse.lean
      theorem: choi_iff_posSemidef
