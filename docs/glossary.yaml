  - slug: is-the-born-rule-derived
    kind: question
    hook: >
      Derived, as the volume of a region of the underlying state space measured
      with the one ruler its symmetry allows; the assumptions that remain are
      named posits, listed openly rather than hidden in the machinery.
    layman: >
      The Born rule is the textbook's recipe for quantum probabilities. A
      quantum state assigns each possible outcome a number called an amplitude,
      and the rule says the probability of that outcome is the square of the
      amplitude's size. In the textbook this is an axiom: it is postulated, not
      explained. In CSD it is a computed quantity. The probability of an outcome
      is the size of a region of the arena, the underlying state space, measured
      with the unique measure the space's symmetry allows, and a convergence
      theorem turns those sizes into the frequencies observed over many runs.

      Two things make this more than a restatement. The measure is forced. Its
      uniqueness is a theorem, so nobody tuned the ruler to get the right sizes.
      And the regions, in the mature form of the results, are not carved to fit
      either. Their sizes fall out of the geometry through the moment map, the
      function that reads off from each point of the state space the quantities
      its symmetry conserves.

      What is not claimed is derivation from nothing. The projection from the
      arena to the space of quantum states is a postulate. And reading
      probability as typicality, the fraction of the compatible microstates
      that lead to an outcome across repeated preparations, is a stance that the
      theorems make precise rather than prove. The programme's habit is to say
      exactly this out loud.
    in_csd: >
      The chain runs in three steps. The Fubini-Study measure, the natural volume
      on the space of quantum states, is the unique measure invariant under the
      symmetries of that space, meaning unchanged by every symmetry
      transformation; this is the argument of Paper B, proved at general
      dimension. The Born weight equals a ratio of volumes in that measure,
      unconditionally and for every coordinate. And empirical frequencies
      converge to those volumes almost surely under repeated preparation. The
      historically carved constructions, in which regions were cut to reproduce
      the right sizes, are retained and labelled as such, using the corpus's own
      word carving, and the derived route stands independent of them.

      The remaining posits are structural and named. Projectability, the sector
      postulate, says that the arena projects onto the space of quantum states.
      The typicality reading interprets the conditioned measure as probability.
      The cell law says that a measurement context's outcome rates generate its
      pointer torus, the family of rotations of the state space associated with
      the apparatus, and this is what ties the outcome regions to the moment
      map. A separate route to the Born rule of the Gleason type exists on the
      operational stratum, the layer that describes measurements in the language
      of laboratory operations, and it is kept distinct so that nobody can
      mistake which layer a citation leans on.
    mathematical: >
      The route is fubiniStudyMeasure_unique; fs_born_volume_ratio_N with the
      apex variant; born_frequency_convergence_N for the joint almost-sure
      statement; and the moment-map identity momentMap_mk_eq_inner_sq with the
      Duistermaat-Heckman pushforward behind it.

      The volume route is Gleason-free end to end; the effect-Gleason
      representation is proved separately on the operational stratum. The
      remaining posits (projectability, the typicality reading, the cell law)
      are registered in specs/POSITS.md.
    term: Is the Born rule derived or assumed in CSD?
    status: definition
    source: curated
    related: [born-weight, typicality, fubini-study-measure, where-do-probabilities-come-from, lf1-main-theorem]

  - slug: where-do-probabilities-come-from
    kind: question
    hook: >
      From ignorance of the exact starting point: the dynamics never rolls dice,
      and the probabilities are the sizes of the sets of microstates a
      preparation cannot tell apart, measured with a ruler nobody was free to
      choose.
    layman: >
      A deterministic world seems to leave no room for quantum probability. The
      resolution is old and respectable: probability as ignorance of the initial
      conditions. But that resolution always carried a debt. Who chooses the
      measure of ignorance, the rule that says how much weight each possible
      starting point gets? Choose it freely and you can get any answer you like.

      CSD's account starts from the fact that every run of an experiment begins
      from a slightly different microstate, a slightly different point of the
      underlying state space, because no procedure controls the arena
      completely. The set of microstates compatible with what the procedure
      does control is the preparation region. What fraction of that region
      leads to a given outcome? That fraction, computed in the one measure the
      symmetry of the space allows rather than one chosen for convenience, is
      the outcome's probability. The strong law of large numbers, the theorem
      that averages over many independent repetitions settle down to the
      underlying fractions, converts those fractions into the frequencies that
      laboratories actually record.

      So there is one path through the world, dice nowhere, and the randomness
      lies entirely in which microstate each preparation happened to land on.
    in_csd: >
      This is typicality under repeated preparation, and it is worth stating
      what it is not. Probabilities do not come from watching one trajectory for
      ever and hoping it explores the space fairly, visiting each region in
      proportion to its size. That property, called ergodicity, is one the
      corpus proves the projected flow does not have, so the time-average route
      is closed at that level. The programme never needs it. Each trial is a
      fresh draw from the conditioned measure, and the frequency theorems run
      on that alone.

      The measure-choice debt is paid by a uniqueness theorem. The Fubini-Study
      measure, the natural volume on the space of quantum states, is the only
      one invariant under the symmetries of that space, so the ignorance is
      priced by a ruler nobody selected.
    mathematical: >
      LF1_main_theorem_ae converts region volumes into almost-sure limiting
      frequencies under i.i.d. preparation sampling; fubiniStudyMeasure_unique
      removes the measure freedom; the general-N volume identities make the
      limiting values the Born weights.

      The non-ergodicity of the epistemic unitary flow is proved and kept as a
      boundary marker between the claimed route and the unclaimed one.
    term: If CSD is deterministic, where do probabilities come from?
    status: definition
    source: curated
    related: [typicality, determinism, single-trajectory, is-the-born-rule-derived, typicality-volume]

  - slug: is-csd-a-hidden-variable-theory
    kind: question
    hook: >
      Yes, in the technical sense: something definite underlies the quantum
      state in CSD, and the programme openly pays the two prices the no-go
      theorems demand, dependence on measurement context and correlations beyond
      what locality permits.
    layman: >
      "Hidden-variable theory" is a technical classification, not an insult. It
      means a theory in which something definite underlies the quantum state,
      so that the state is a summary of a more detailed reality. CSD has
      exactly that: the arena, its underlying state space, and the one real
      trajectory through it. So the honest answer is yes, with the
      classification's fine print read aloud.

      The fine print is the no-go theorems, and they do not say what the
      one-line summaries claim. Bell's theorem rules out local hidden variables,
      those in which a choice made far away can never affect an outcome here.
      The Kochen-Specker theorem rules out non-contextual ones, those in which
      every measurement has a fixed answer regardless of which other
      measurements are made alongside it. Surviving both means being contextual
      and letting correlations exceed what locality permits, which is precisely
      the shape CSD has, on purpose.

      One error to avoid: the quantum state is not the hidden variable. The
      state is the visible summary. The hidden variable is the point of the
      arena beneath it, including the fibre coordinate, the part of the
      underlying state that no quantum state determines.
    in_csd: >
      The corpus proves the constraining theorems itself rather than citing
      them. No way of splitting a shared space of hidden states into a part for
      each particle can reproduce the singlet correlations, the strongest
      correlations of a paired two-particle state. No single context-independent
      assignment of outcomes survives contextuality. And the GHZ and CGLMP
      obstructions, named after Greenberger, Horne and Zeilinger and after
      Collins, Gisin, Linden, Massar and Popescu, which are further Bell-type
      results for more than two particles and for measurements with more than
      two outcomes, hold at general dimension. The corpus also proves that the
      survival is genuine rather than verbal: the contextual model that
      reproduces the singlet table exists as a constructed object.

      Where the correlations exceed locality, signalling still provably does
      not occur. Locality of operations holds exactly: an intervention far away
      moves no local statistic. That is the physically load-bearing half of
      locality, and the one experiments enforce.
    mathematical: >
      no_product_partition_realises_singlet and its GHZ companion over
      arbitrary measurable state spaces; the global-assignment obstruction and
      the contextual witness in the C1 capstone; composite_no_signalling, exact
      for all states.

      The Kochen-Specker-adjacent contextuality machinery of the Mermin-Peres
      square is also in-corpus.
    term: Is CSD a hidden-variable theory?
    status: definition
    source: curated
    related: [hidden-variables, contextuality, does-csd-violate-bell, csd-vs-bohmian-mechanics, does-kochen-specker-rule-out-csd]

  - slug: does-kochen-specker-rule-out-csd
    kind: question
    hook: >
      No. The Kochen-Specker theorem forbids giving every possible measurement a
      fixed answer independent of which experiment is actually performed, and
      CSD assigns outcomes through the measurement context by construction.
    layman: >
      The Kochen-Specker theorem is the quieter sibling of Bell's. It shows that
      you cannot assign definite answers to all possible quantum measurements at
      once, independent of which experiment is actually performed: any such
      table of answers contradicts itself. Any theory claiming a definite
      underlying reality has to reckon with it.

      The reckoning is the same as with Bell, and it is not evasion. The
      theorem's target is non-contextual assignment, meaning answers that do not
      depend on the measurement context, the actual physical arrangement doing
      the asking. A theory whose outcomes depend on that context is outside the
      theorem's scope, at the declared cost of accepting the dependence.

      CSD accepts the dependence and then does something the usual discussion
      does not. It makes the context a formal object with its own data, so that
      "the outcome depends on the context" is a definition you can compute
      with, not a slogan.
    in_csd: >
      In CSD a measurement context is a field of rates on the base of the arena,
      the space of quantum states, and it is the apparatus's own data. The
      outcome basins, the regions of the arena whose points lead to each
      outcome, are built from it. Distinct contexts genuinely induce distinct
      partitions of the arena, which is exactly the dependence Kochen-Specker
      demands of a surviving theory. The corpus proves the obstruction side too,
      in its own frame: no global context-independent assignment is compatible
      with the exhibited contextual statistics, and the Mermin-Peres
      construction supplies the finite-dimensional contradiction.

      One clarification comes from the analysis of where contextual structure
      lives. For systems of dimension three and above, the base-only
      construction fails. That base-only failure is not a corollary
      of Kochen-Specker: CSD's partitions are contextual, so the classical
      no-go theorems do not apply to them. It is a separate constraint, coming
      from covariance and positivity, argued on its own.
    mathematical: >
      The contextuality tier: the global-assignment obstruction in the C1 chain;
      the Mermin-Peres square's contextuality witness; and the context-indexed
      outcome map machinery with its definitional separation, with no
      Fine-theorem shortcut assumed.

      The N >= 3 fibre-placement analysis is explicitly distinguished from
      Gleason and Kochen-Specker in the source, and it is short of a no-go in
      its own right.
    term: Does the Kochen-Specker theorem rule out CSD?
    status: definition
    source: curated
    related: [kochen-specker, contextuality, measurement-context, is-csd-a-hidden-variable-theory, gleason-theorem]

  - slug: is-csd-superdeterministic
    kind: question
    hook: >
      No. In CSD's Bell model the distribution of hidden states is provably the
      same whatever settings the experimenters choose, and the escape from
      Bell's theorem runs through outcomes that depend on the measurement
      context, not through settings arranged in advance.
    layman: >
      Superdeterminism is the escape from Bell's theorem that most physicists
      find too expensive. It denies that measurement settings can be chosen
      independently of the hidden state, so that the observed correlations were
      arranged in the initial conditions of the universe. This saves locality by
      making experiments unreadable: if the settings and the systems conspire,
      no measurement tests anything.

      CSD does not take that route, and the claim is checkable rather than
      rhetorical. In the corpus's Bell analysis, measurement independence, the
      assumption that there is one shared distribution over the hidden states
      and that it is the same whichever settings are chosen, is stated as an
      explicit premise and proved for the exhibited model. The model's escape
      from Bell is contextuality of the outcome maps: what depends on the
      setting is how outcomes are read off from the hidden state, not which
      hidden states occur.

      Deterministic, yes. Superdeterministic, with settings correlated with the
      hidden state, demonstrably not.
    in_csd: >
      The question turns on a distinction between two places where dependence
      on the settings could enter. It could enter the distribution over hidden
      states; that is superdeterminism. Or it could enter the functions that
      turn a hidden state into an outcome; that is contextuality. The corpus's
      model has one fixed measure across every context, so measurement
      independence holds by construction and is stated explicitly in the formal
      development, while the per-context outcome maps carry all the dependence
      on the setting.

      The documentation makes an honesty note of its own. Measurement
      independence is a genuine premise of Bell derivations, and naming it is
      part of keeping the Bell analysis auditable. Naming a premise is not
      denying it.
    mathematical: >
      The C1 chain's operational no-signalling stack: remote marginal
      invariance for both wings under a single shared measure, which is
      measurement independence, stated in-module, proved for the
      singlet-reproducing contextual model.

      The model's context dependence is isolated in the outcome family, and the
      obstruction theorems show that the dependence cannot be removed.
    term: Is CSD superdeterministic?
    status: definition
    source: curated
    related: [determinism, does-csd-violate-bell, single-trajectory, no-signalling, hidden-variables]

  - slug: is-the-wavefunction-real
    kind: question
    hook: >
      The wavefunction is a genuine but incomplete coordinate of a real
      underlying world: it can be read off the world's actual configuration,
      yet it leaves out the part of that configuration which decides what a
      measurement will show.
    layman: >
      "Is the wavefunction real?" runs two questions together. Does something in
      the world correspond to it? And is it the complete story of what exists?
      CSD's answers come apart cleanly: yes, and emphatically no.

      Yes, because the quantum state is not a fiction or a mere betting
      position. Every point of the arena, the underlying state space, projects
      to a definite quantum state, so the state tracks a genuine feature of the
      world. If you had access to the world's actual configuration you could
      read the state off it.

      No, because the state is radically incomplete. The projection that
      produces it is many-to-one: many different underlying configurations give
      the same quantum state. Everything that decides measurement outcomes, the
      fibre coordinate that distinguishes those configurations and the outcome
      basin the trajectory occupies, lives in what the projection forgets.
      Treating the state as the whole world is exactly the move that generates
      the measurement problem. Treating it as a lossy coordinate dissolves the
      problem.
    in_csd: >
      The state's dual character is structural rather than rhetorical.
      Functionally the state is epistemic: it summarises what a preparation
      fixes, and its update on measurement is learning, not a physical jump.
      Ontologically its supports are disjoint: distinct states describe disjoint
      sets of arena points. That is why the reality theorems aimed at models
      with overlapping supports do not bite.

      The programme's discipline is to refuse the shorter slogans in both
      directions. "The wavefunction is everything" overclaims what the quantum
      state carries. The analysis of the fibre places record-forming content,
      the structure that decides outcomes, above the state at higher dimension,
      on a chain of constraints that stops short of proving the base cannot
      carry it. "The wavefunction is nothing" ignores that the state is a
      faithful coordinate of the real arena.
    mathematical: >
      The formal content is the projection structure: a measurable many-to-one
      pi from the arena to the projective sector, the epistemic measure exact on
      the base and spread on the fibre, and the record layer's theorems placing
      outcome-deciding structure in the fibre at N >= 3.

      The operational stratum's state notion, density operators and effects, is
      proved consistent with the volume stratum wherever both speak.
    term: Is the wavefunction real in CSD?
    status: definition
    source: curated
    related: [ontic-vs-epistemic, psi-epistemic, does-csd-conflict-with-pbr, qbism, excess-baggage]

  - slug: what-happens-during-measurement
    kind: question
    hook: >
      The system stops being isolated, the joint dynamics of system and
      apparatus carries the underlying state into one outcome region and leaves
      a record there, and the famous collapse is the updating of a description:
      one law, no switch.
    layman: >
      The textbook's answer is famously two answers: smooth evolution until a
      measurement happens, then a sudden jump, with no rule for when to switch
      from one to the other. CSD's answer has one law and three stages, each of
      them ordinary physics.

      The first stage is de-isolation. Measuring something means coupling it to
      an apparatus, which deliberately ends its isolation. The second is
      sorting. The joint deterministic dynamics of system and apparatus carries
      the point of the arena, the underlying state space, into one of the
      outcome basins, regions fixed by the apparatus alone, before the system
      ever arrived. The third is the record. Which basin the trajectory occupies
      is a physical fact about the arena: stable, re-readable, and protected
      from distant interference by a theorem showing that no influence from far
      away can reach it faster than a fixed speed allows.

      The state's jump is then bookkeeping. You learned which basin, so you
      update the description. Nothing physical collapsed; your summary caught
      up with the world.
    in_csd: >
      Each stage is formalised at its own level of the programme. De-isolation
      flows exist as constructed objects. They are deterministic, they preserve
      the arena's volume, and they are provably not the identity, so they do
      something. They realise dynamically what textbook quantum mechanics calls
      the measurement dilation, the description of a measurement as ordinary
      reversible evolution on a larger system that includes the apparatus, and
      the volumes of their pointer blocks equal the Born weights, the textbook
      probabilities. The basins are the record layer's context-fixed partition
      of the arena, and they are Born-weighted by theorem. The Luders update
      rule, the textbook prescription for how the state should be revised once
      an outcome is known, is derived as the correct conditional bookkeeping
      both for sequences of measurements and for mixed states.

      The stated open frontier is the junction between the stages: deriving the
      record mechanism at the level of the fibre from the de-isolation
      dynamics, rather than exhibiting each side separately. The programme
      calls this the record layer's remaining work, and says so in public.
    mathematical: >
      measurement_flow_born_frequency for the dynamics tier; globalBasin_born
      and the disjointness and exhaustion theorems for the kinematic tier;
      record_lightcone for the record's stability.

      The Luders tier covers sequential conditioning, and the einselection
      theorems explain why pointer readings are the stable alphabet.
    term: What happens during a measurement in CSD?
    status: definition
    source: curated
    related: [de-isolation, measurement-flow, collapse, record-layer, measurement-problem]

  - slug: what-is-machine-checked
    kind: question
    hook: >
      Every theorem in the CSD corpus is verified by a proof assistant from zero imported
      axioms, and the list of what such checking cannot certify is published alongside it.
    layman: >
      "Machine-checked" gets used loosely, so here is the strict sense this programme
      means. A proof assistant is a computer program that accepts a proof only when every
      step follows from earlier steps by fixed logical rules; the one used here is called
      Lean. Every theorem in the CSD corpus, tens of thousands of lines of it, has passed
      that check all the way down to Lean's logical core, so no step in any proof is taken
      on trust.

      Two facts sharpen the claim. First, every mathematical proof rests on some basic
      assumptions, and Lean has a small fixed set of them built in. The corpus adds none of
      its own: an early dependence on an unproved representation theorem was removed by
      proving that theorem. Second, the physical postulates of CSD are not assumptions
      slipped in at the foundations. They appear as explicit hypotheses in the statements
      of the theorems that use them, so a reader can see exactly what each result costs and
      where it pays.

      Equally strict is what checking cannot do. A proof assistant cannot certify that a
      formal statement means what the accompanying prose says it means. The real failure
      mode is a fluent but false description of a true theorem, so the repository runs
      automatic checks against prose drifting away from the mathematics, and says plainly
      that reading the mathematics as physics is a human responsibility.
    in_csd: >
      The verification is layered. The library and its regression suite build with every
      warning treated as an error. An audit records, for each headline result, exactly
      which foundational assumptions it rests on, so that any change in that list is
      caught. A validation ledger tracks the status of each claim row by row. And a battery
      of guard scripts checks the things a compiler cannot see: statements that hold for
      empty reasons, hypotheses that are carried but never used, prose claims that outrun
      what the proofs actually connect, and glossary anchors such as the ones behind this
      page.

      Three commitments make the posture distinctive. Postulates are hypotheses rather than
      axioms. Honest notes on scope live inside the modules themselves rather than in a
      separate document. And a stated rule requires that an obstacle be reported as an
      obstacle rather than hidden behind a placeholder.
    mathematical: >
      The kernel-checked corpus spans the frequency layer, the measure and Born tiers,
      measurement dynamics, the entangled tier, the record layer, thermodynamics and the
      finite field track. An axiom-audit suite pins every headline constant's axiom set,
      and every pinned constant reports exactly Lean's three foundational axioms, propext,
      Classical.choice and Quot.sound; the corpus imports no axiom of its own. The staging
      tree contributes Mathlib-candidate infrastructure, the partial trace and the general
      Lie-Trotter formula among it, built CSD-free.

      The quantum-information layer is reached from the posits by theorems rather than by
      instantiation: the density operator of a preparation on the surface is the barycentre of
      its rays, channels are the environment marginals of volume-preserving flows that lift a
      unitary, and the second law, data processing, Landauer's bound, concavity, the Holevo
      capacity of the de-isolation channel and error correction on the three-qubit register
      are all stated for preparations on the surface. Strong subadditivity remains conditional
      on an explicit data-processing hypothesis, which the audit records.
    term: What exactly is machine-checked in CSD?
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/formalisation
      text: The formalisation page tracks the Lean corpus and its scope
    related: [witness-and-engine, lf1-main-theorem, partial-trace, lie-trotter-formula, does-csd-make-new-predictions]

  - slug: does-csd-make-new-predictions
    kind: question
    hook: >
      Not yet, and the programme does not pretend otherwise: the present claim is that CSD
      reproduces the predictions of quantum mechanics from fewer postulates, with the
      reproduction machine-checked, while candidate departures are recorded as owed future
      work rather than asserted.
    layman: >
      A blunt question deserves a blunt answer. At present CSD names no experiment whose
      outcome it predicts differently from quantum mechanics. The corpus's empirical suite
      consists of formal twins of the flagship experiments: interference of single
      particles, the Bell tests of correlations between distant particles, the quantum
      eraser, interaction-free measurement and the rest. Each is reproduced within the
      programme's own framework.

      What the programme claims instead is a different kind of gain: the same predictions
      from less. Fewer postulates go in. The probability rule is computed rather than
      assumed. Measurement is described by one law of motion instead of two, where standard
      quantum mechanics uses one rule for evolution between measurements and a separate
      rule for what happens at a measurement. And the whole reconstruction is
      machine-checked, which no rival interpretation currently offers.

      Whether genuinely new physics emerges, in the form of departures from quantum
      mechanics in regimes that the reconstruction constrains, is treated in the papers as
      owed future work, not as a present claim. A reader should hold the programme to
      exactly that standard.
    in_csd: >
      The empirical layer is designed as reproduction with receipts. Every flagship quantum
      experiment in the suite has a CSD-side twin, and the validation ledger records what
      each twin actually establishes, so the strength of each reproduction can be read off
      rather than assumed. The contrast with rival interpretations is stated as
      interpretive: the corpus's own comparison entries say that no experiment currently
      distinguishes the positions.

      The disciplined phrasing matters because overclaiming is the commonest failure of
      reconstruction programmes. The repository's claims guard exists to keep the public
      statements at exactly the strength of the theorems, neither stronger nor weaker.
    mathematical: >
      The Empirical tree has two branches. The QM branch reproduces the standard results in
      the operational formalism; the CSD branch re-derives the same experiments through the
      volume machinery, the double-slit, the singlet and CHSH, GHZ, CGLMP, the eraser and
      Elitzur-Vaidman among them. The chain capstones connect frequencies to Born weights
      on the programme's own route.
    term: Does CSD make new predictions?
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-claims
      text: The current-claims page states what is and is not claimed
    related: [what-is-machine-checked, spontaneous-collapse, record-light-cone, interaction-price, where-do-probabilities-come-from]

  - slug: csd-vs-bohmian-mechanics
    kind: question
    hook: >
      Cousins rather than twins: both theories pay the price that the no-go theorems demand
      of any deterministic account, but Bohmian mechanics postulates its equilibrium
      distribution where CSD proves its measure unique, and the arenas underneath the two
      are different kinds of object.
    layman: >
      Bohmian mechanics is the standing proof that deterministic quantum theories exist. In
      it, particles always have definite positions, the wavefunction acts as a real field
      that guides their motion, and the resulting statistics reproduce those of quantum
      mechanics. Any other deterministic programme owes an account of how it differs, and
      the differences here are structural rather than cosmetic.

      The first difference is the arena, the space of possible states of the world. Bohm's
      arena is the space of particle configurations, with the wavefunction as an extra
      field on top. CSD's arena is not a configuration space at all. It is a compact
      geometric space (finite in extent, so that nothing can escape to infinity) that
      projects onto the space of quantum states: every point of the arena maps to a quantum
      state, with many points mapping to each one. The quantum state is the output of that
      projection, not an additional field with dynamics of its own.

      The second difference is the measure, the rule that assigns sizes, and hence
      probabilities, to regions of the arena. Bohm's statistics require quantum
      equilibrium, the assumption that particle positions are distributed according to the
      squared amplitude of the wavefunction. CSD's counterpart is a theorem: its measure is
      the only one that the symmetries of the state space leave unchanged, so a
      distributional assumption is replaced by a uniqueness proof.

      The third difference is the record of an outcome. In Bohmian mechanics an outcome is
      a particle position. In CSD an outcome is membership of a basin, a region of the arena
      whose trajectories all flow to the same result, and that membership is written into
      the fibre, the extra directions of the arena that lie above each quantum state. The
      records come with their own stability theorem.
    in_csd: >
      The programme's respect for Bohm is on record: Bohmian mechanics is the standing
      counterexample to the claim that hidden variables are dead. So is the divergence. CSD
      keeps the quantum state epistemic in function, a description of what is known about
      the underlying arena rather than a physical agent, where Bohm makes it a dynamical
      agent that guides the particles. Contextuality, the dependence of an outcome on what
      else is measured alongside it, lives in CSD in outcome maps fixed by the apparatus,
      where in Bohmian mechanics it lives in the contextual responses of the guidance
      dynamics. And the equilibrium question, why the right measure is the right one, is
      answered by symmetry-forced uniqueness rather than by hypothesis or by arguments that
      the distribution relaxes towards equilibrium over time.

      No experiment currently separates the two theories, and neither side claims one. The
      separation lies in what must be assumed, and in what has been machine-checked, where
      the comparison is one-sided.
    mathematical: >
      The contrast is carried by the corpus's uniqueness and reconstruction theorems rather
      than by any formalisation of Bohmian mechanics itself: fubiniStudyMeasure_unique
      versus the quantum equilibrium hypothesis; the projection postulate carried as a
      hypothesis versus the guidance equation carried as dynamics; and the record layer's
      basin machinery versus position as the universal pointer.
    term: How does CSD differ from Bohmian mechanics?
    status: definition
    source: curated
    related: [bohmian-mechanics, is-csd-a-hidden-variable-theory, single-trajectory, determinism, hidden-variables]

