        url: https://doi.org/10.1103/PhysRevA.67.042105
      - text: "Rozema et al., Violation of Heisenberg's measurement-disturbance relationship by weak measurements, Phys. Rev. Lett. 109, 100404 (2012)"
        url: https://doi.org/10.1103/PhysRevLett.109.100404
    site_link:
