# docs/glossary.yaml - the ONLY prose source for the CSD glossary.
#
# One record per CONCEPT, keyed by the eponym(s) that name it. The key set comes
# from scripts/extract-eponyms.sh, which reads declaration and module names: the
# corpus decides what needs explaining, not taste. Pairs collapse here (Fubini +
# Study are one measure), because collapsing is editorial and the extractor
# deliberately refuses to do it.
#
# FIELDS
#   hook          one sentence, the thing a reader would repeat to someone else.
#                 Not a definition and not a category label. If it is neither
#                 surprising nor consequential, the entry has no reason to exist.
#   layman        no notation, no jargon. Carry ONE metaphor and reuse it in the
#                 registers below, so the entry reads as a single thought rather
#                 than three disconnected blocks.
#   in_csd        the role it plays in THIS programme, and what turns on it.
#   mathematical  the formal statement, for a specialist.
#
# Three registers because the CSD query research found eight of nine reader
# personas have a repo path built for them and no page that says what the thing is.
#
# status must be one of the controlled values in scripts/check-glossary.sh. The
# vocabulary follows AXIOMS.md section 0 so the glossary cannot disagree with the
# ledger. lean.sha pins source links: paths on a moving branch rot, permalinks do not.

meta:
  site: https://glossary.constraintsurfacedynamics.com
  repo: https://github.com/zblore/csd-lean4
  sha: 237e9b042ca4dbb9fc99fb484ef4d686bfe302a3

# ---------------------------------------------------------------------------
# refs — the external reference registry.
#
# The generator links the FIRST occurrence of each of these in an entry's prose,
# automatically. Written once here, applied across every entry forever, so adding
# an entry costs no link-marking. Terms that match another entry's term or eponym
# resolve INTERNALLY instead and need no record here.
#
# Longest match wins, so "Fubini-Study metric" beats "Fubini". Matching is
# case-insensitive and whole-word. An entry never links to itself.
#
# Choose the reference a specialist would accept and a newcomer can read. For a
# person, link the CONCEPT they are named for, not the biography: a reader meeting
# "Haar" here wants Haar measure, not Alfred Haar's dates.
# ---------------------------------------------------------------------------
