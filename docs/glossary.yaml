  - slug: is-csd-superdeterministic
    kind: question
    hook: >
      No. In CSD's Bell model the distribution of hidden states is provably the same
      whatever settings the experimenters choose, and the escape from Bell's theorem runs
      through outcomes that depend on the measurement context and not through settings
      arranged in advance.
    layman: >
      Superdeterminism is the escape from Bell's theorem that most physicists find too
      expensive. It denies that measurement settings can be chosen independently of the
      hidden state, so the observed correlations were arranged in the initial conditions
      of the universe, and this saves locality by making experiments unreadable, because
      if the settings and the systems conspire no measurement tests anything.

      CSD doesn't take that route, and the claim is checkable rather than rhetorical. In
      the corpus's Bell analysis, measurement independence, the assumption that there's
      one shared distribution over the hidden states and that it's the same whichever
      settings are chosen, is stated as an explicit premise and proved for the exhibited
      model. The model's escape from Bell is contextuality of the outcome maps, so what
      depends on the setting is how outcomes are read off from the hidden state and not
      which hidden states occur.

      It's deterministic, yes. It's superdeterministic, with settings correlated with the
      hidden state, demonstrably not.
    in_csd: >
      The question turns on a distinction between two places where dependence on the
      settings could enter. It could enter the distribution over hidden states, which is
      superdeterminism, or it could enter the functions that turn a hidden state into an
      outcome, which is contextuality. The corpus's model has one fixed measure across
      every context, so measurement independence holds by construction and is stated
      explicitly in the formal development, while the per-context outcome maps carry all
      the dependence on the setting.

      The documentation makes an honesty note of its own. Measurement independence is a
      genuine premise of Bell derivations, and naming it is part of keeping the Bell
      analysis auditable, and naming a premise isn't denying it.
    mathematical: >
      The C1 chain's operational no-signalling stack proves remote marginal invariance for
      both wings under a single shared measure, which is measurement independence, stated
      in-module, for the singlet-reproducing contextual model.

      The model's context dependence is isolated in the outcome family, and the
      obstruction theorems show that the dependence can't be removed.
    term: Is CSD superdeterministic?
    status: definition
    source: curated
