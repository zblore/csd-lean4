  - slug: grover-algorithm
    image:
      file: img/grover-algorithm.png
      wide: true
      alt: "Geometric diagram of one Grover iteration as two reflections"
      caption: "Grover's step as a rotation: reflecting |s⟩ about the marked state and then about |s⟩ itself turns the state by θ towards the target."
      credit: "Danski14, CC BY-SA 3.0, via Wikimedia Commons"
      licence: "CC BY-SA 3.0"
      source: https://commons.wikimedia.org/wiki/File:Grovers_algorithm_geometry.png
      article: https://en.wikipedia.org/wiki/Grover's_algorithm
    hook: >
      Grover's algorithm finds one marked item in an unsorted list in a number of steps
      proportional to the square root of the list size, and a separate theorem shows that
      no quantum algorithm can do better.
    layman: >
      Suppose one marked item is hidden somewhere in a long list with no structure to
      exploit, no sorting, no index and no pattern. The only way to find it classically is
      to check items one by one, so on average you look at half the list and in the worst
      case all of it, and it's natural to assume that's simply what unstructured search
      costs.

      Grover showed that a quantum computer can do it in a number of steps proportional to
      the square root of the list size, so for a million items it takes roughly a thousand
      steps rather than half a million. The machine keeps one number for every item,
      called its amplitude, and the chance of reading out a given item at the end is the
      square of its amplitude. At the start all the amplitudes are equal, and each round
      of the algorithm does two things. First it flips the sign of the marked item's
      amplitude, which is the only step that uses any knowledge of which item is marked,
      and then it reflects every amplitude about the average of all of them, so the one
      entry that now stands out is pushed further from the crowd.

      Seen geometrically, each round turns the machine's state through a small, fixed
      angle towards the marked item. After a number of rounds close to the square root of
      the list size the state is almost pointing at the answer, and a measurement reveals
      it with high probability. If you stop too early the answer is still unlikely, and if
      you carry on too long the rotation overshoots the target so the probability falls
      again, which means the algorithm comes with a timer as well as a result.

      The unusual part is that the speedup is final. A separate theorem shows that no
      quantum algorithm, however ingenious, can find the item in fewer steps than this, up
      to a constant factor, so it isn't merely the best method known but the best method
      possible.
    in_csd: >
      Grover's algorithm is one of the algorithm witnesses in CSD's machine-checked
      corpus, a standard quantum algorithm formalised to show that the programme's account
      of quantum mechanics supports the working machinery of quantum computation. The
      relationship runs one way, and the corpus says so rather than leaving it implied.
      The algorithms depend on the programme's unitary pillar, its result establishing
      that quantum evolution is unitary, meaning reversible and probability-preserving,
      and they take that result as input and give no evidence for it. Their content is the
      meaning of circuits, with their amplitudes, iteration counts and success
      probabilities, and not foundations.

      What this particular witness demonstrates, beyond the fact that the algorithm can be
      written down, is that the formalisation copes with genuinely quantitative reasoning.
      The bookkeeping of rotation angles and the schedule of how many rounds to run are
      exactly the details a fragile formal treatment would get wrong, and this one carries
      them through.
    mathematical: >
      Amplitude amplification finds a marked element among N in order root-N oracle
      queries, versus order N classically. Optimality is a theorem, as the BBBV hybrid
      argument shows that no quantum algorithm beats order root-N queries for unstructured
      search.

      The geometry is two-dimensional. The state stays in the plane spanned by the marked
      and unmarked components, and each double reflection (about the marked component,
      then about the mean) rotates it by a fixed angle, so the query count is a right
      angle divided by that angle, and running past it degrades the success probability.
    person: >
      Lov Grover, born in 1961 in India, studied at IIT Delhi and Stanford and was at Bell
      Labs in New Jersey when he published the algorithm in 1996, in a paper three pages
      long whose title presented it as a database search result rather than a physics one.

      The optimality half of the story is the strange half. The lower bound, due to
      Bennett, Bernstein, Brassard and Vazirani, was proved shortly before the algorithm
      existed, so the ceiling was known before anyone had built the thing that touches it,
      one of the rare cases in algorithms where the achievement and the proof that nothing
      better is possible arrived in the wrong order.
    term: Grover's algorithm
    eponyms: [Grover]
    status: standard-mathematics
    site_link:
      url: https://www.constraintsurfacedynamics.com/roadmap
      text: The roadmap's third stage is the reconstruction this search algorithm runs inside
    related: [amplitude-amplification, amplitude-estimation, shor-algorithm, deutsch-jozsa, hadamard-test]
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Grover%27s_algorithm

  - slug: haar-measure
    image:
      file: img/haar-measure.jpg
      alt: "Portrait photograph of Alfréd Haar"
      caption: "Alfréd Haar."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Haar_Alfréd.jpg
      article: https://en.wikipedia.org/wiki/Alfr%C3%A9d_Haar
    hook: >
      A closed and bounded family of symmetries has exactly one even-handed notion of
      volume, and every measure CSD calls forced inherits its uniqueness from that one
      fact.
    layman: >
      Many questions ask for an average over all the symmetries of something, the average
      effect of a random rotation say, or whether one family of transformations is larger
      than another. To answer them you need a notion of volume on the set of
      transformations itself and not on the objects they act on, and that volume had
      better not depend on the coordinates you happen to use to label the transformations,
      or your average is an artefact of your labelling rather than a fact about the
      symmetries.

      Haar's theorem concerns groups, families of transformations that can be combined and
      undone, such as all the rotations of a sphere. The demand he placed on a volume is
      invariance, meaning that the size of any collection of transformations doesn't
      change when every member of the collection is followed by one fixed transformation,
      so for rotations this says that turning a whole set of rotations by a further fixed
      rotation leaves its size alone. The demand sounds mild. For compact groups, those
      that are closed and bounded in the way the rotations of a sphere are and the shifts
      of an infinite line aren't, it's remarkably restrictive, as once the total volume is
      set to one exactly one invariant volume exists, and not one natural choice among
      several but one, full stop.

      So a question such as what a random symmetry does, on average, has a definite answer
      that doesn't depend on anyone's choice of coordinates. That's Haar's gift, and a
      large part of modern mathematics quietly relies on it.
    in_csd: >
      Trace the programme's central claim back far enough and it rests on this theorem.
      The transformations quantum mechanics allows on a system, the unitary
      transformations that preserve lengths and angles between states, form a compact
      group, so there's exactly one invariant way to assign volume to them. The space of
      quantum states can be built from that group, as you fix any one state and every
      other state is what some unitary transformation turns it into. Sending each
      transformation to the state it produces carries the unique volume on transformations
      down to a volume on states, and its uniqueness comes with it, so that's the whole
      proof that the Fubini-Study measure, the notion of volume on state space the
      programme uses, is forced rather than chosen.

      Remove this link and everything downstream changes character. The measure would
      become a preference, the derivation of the Born rule would rest on that preference,
      and the reply to the objection that the programme smuggles in its measure would
      evaporate. The same fact is what makes the choice of starting state immaterial, as
      two different starting states give two ways of labelling states by transformations,
      but the two labellings differ by a fixed transformation and an invariant volume
      can't tell the difference.
    mathematical: >
      A compact topological group carries a unique translation-invariant Borel probability
      measure. On a homogeneous space of such a group, invariant measures are unique up to
      scale, and normalisation fixes the scale.

      The corpus uses the unitary group's Haar measure directly and pushes it forward
      along the orbit map, so uniqueness downstairs is inherited from uniqueness upstairs.
      No geometric argument enters the uniqueness proof, as it's group theory and measure
      theory all the way down.
    person: >
      Alfred Haar (1885-1933) was born in Budapest and took his doctorate at Gottingen
      under Hilbert in 1909, and the Haar wavelet, now the first example in every wavelet
      course, comes from that thesis. With Frigyes Riesz he built the mathematics
      institute at Szeged into a serious research centre, and its journal, Acta
      Scientiarum Mathematicarum, into a serious journal.

      The measure theorem dates from 1933, the last year of his life, as he died of cancer
      at forty-seven. Von Neumann, who had been sceptical that such a measure existed in
      general, used it almost immediately to solve Hilbert's fifth problem for compact
      groups, and Weil built the general theory soon after, so the result outlived its
      author before the year was out.
