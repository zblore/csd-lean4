  - slug: quantum-fourier-transform
    reviewed: 2026-08-29
    hook: >
      The quantum Fourier transform runs Fourier's transform as a single reversible motion
      of a quantum register: it is the lens that turns hidden periods and phases into
      outcomes a measurement can land on.
    layman: >
      Start with the classical tool. A Fourier transform takes a signal and re-expresses it
      as a mixture of regular oscillations, reporting which frequencies are present and how
      strongly. The discrete version does the same for a finite list of numbers and is the
      workhorse of signal processing: feed it a list that repeats with some period, and its
      output piles up at the frequencies of that period.

      Now the quantum problem. A quantum register holds an amplitude for each of its
      possible readings: a number whose squared size gives the probability of that reading,
      and whose angle, called its phase, is invisible to any single measurement. Quantum
      interference only helps if the structure you care about, a repeating period or a
      hidden phase, can be steered onto readings a measurement actually produces. You need
      a lens that focuses spread-out regularity into sharp peaks.

      The quantum Fourier transform is that lens. It is the same discrete transform,
      executed as one physical evolution of the register rather than as arithmetic on a
      list of numbers. Feed it a state whose amplitudes repeat with some period and the
      output concentrates on the frequencies of that period, where a measurement finds
      them. Shor's algorithm is the famous customer: load a sequence from modular
      arithmetic, apply the transform, and the period that encodes the factors stands out
      like a struck bell.
    in_csd: >
      The transform is a library primitive in the corpus, kept deliberately free of CSD
      content so that an outside project can import it. It is stated for a register with
      any number of levels, not only powers of two, so it is directly the discrete Fourier
      transform, and the qubit case is an instance. Its unitarity, the property of being a
      reversible, length-preserving change of the register, which is what any physical
      evolution must be, is proved from the orthogonality of the roots of unity: a
      geometric series, nothing deeper.

      The algorithm witnesses that need it, Shor's algorithm and phase estimation, consume
      it. The standing disclaimer for the algorithm layer applies: these results rest on
      the programme's unitary-evolution pillar and do not support it or the foundations;
      they mark the scope of what the library can express.
    mathematical: >
      A Cat-1 (CSD-free) library primitive: F j k = (1/sqrt N) omega^{jk} with
      omega = exp(2 pi i / N) a primitive N-th root of unity. Unitarity F^H F = 1 is the
      orthogonality sum over k of zeta^k = N [zeta = 1], closed by the geometric series
      (qft_unitary).

      Matrix level only: the corpus states the transform as an N x N unitary and proves its
      algebra; no gate-level circuit decomposition is claimed.
    person: >
      Joseph Fourier (1768-1830) was an orphan from Auxerre who taught at the Ecole
      Polytechnique, governed Lower Egypt under Napoleon, and administered the Isere
      department from Grenoble, where, between prefectural duties, he wrote the analytical
      theory of heat. His claim that arbitrary functions decompose into sines scandalised
      Lagrange and became the spine of applied mathematics anyway.

      The quantum version arrived with Shor's 1994 paper and its predecessors: the insight
      that the transform's butterfly structure makes it exponentially cheap as a quantum
      circuit, which is exactly what period-finding needed.
    term: quantum Fourier transform
    eponyms: [Fourier]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/QuantumInfo/Fourier.lean
      theorem: qft_unitary
    related: [shor-algorithm, phase-estimation, simon-algorithm, hadamard-test, amplitude-estimation]
    external:
      - text: "Overview"
        url: https://en.wikipedia.org/wiki/Quantum_Fourier_transform

  - slug: phase-estimation
    reviewed: 2026-08-29
    hook: >
      Phase estimation, the workhorse subroutine of quantum computing, carries a guarantee:
      read the dial at the nearest tick and you are right at least four divided by pi
      squared of the time, a little over forty percent, however fine the dial.
    layman: >
      A quantum computation's answer often arrives as a phase. Every amplitude in a quantum
      state is a number with a size and an angle; the angle is its phase, and no direct
      look at the state reveals it, because probabilities depend only on sizes. The task is
      to read an angle you cannot see, using a register with finitely many dial positions.

      Phase estimation is the reading procedure. Apply the operation whose phase you want
      repeatedly, with the number of repetitions controlled by the position of the
      register, so that the unknown angle winds a different number of times into each
      position. Then run the quantum Fourier transform backwards. The interference between
      the windings makes the amplitude concentrate at the dial position closest to the true
      angle. If the angle sits exactly on a tick, you read it with certainty.

      Usually the angle sits between ticks, and the textbook promise is that the nearest
      tick still comes up with probability at least four divided by pi squared, a little
      over forty percent, whatever the size of the register. That constant comes from the
      Dirichlet kernel, the standard formula for how a sum of evenly spaced oscillations
      concentrates. A fixed floor is what makes the subroutine composable: whatever
      consumes the reading can budget for a guaranteed rate of success.
    in_csd: >
      Both halves of the textbook result are theorems in the corpus, in the CSD-free
      library tree where an outside project can import them: the exact case, in which an
      angle that sits on a tick is read with certainty by inverting the Fourier transform,
      and the fixed floor of four divided by pi squared for an arbitrary angle.

      The result was first proved inside the corpus's development of Shor's algorithm and
      later extracted into a module of its own, once it was noticed that its statements
      never mention orders or modular arithmetic. The module is generic in the register
      size, and Shor's order-finding consumes it. The standing disclaimer for the algorithm
      layer applies: these results rest on the programme's unitary-evolution pillar and do
      not support it or the foundations.
    mathematical: >
      On the T-level counting register, the phase state (1/sqrt T) sum over x of
      e^{2 pi i phi x} |x> read by the inverse QFT at index c has amplitude the Dirichlet
      sum (1/T) sum over x of e^{2 pi i (phi - c/T) x}; the geometric series closes it and
      the norm reduces to T^{-2} sin^2(pi delta T) / sin^2(pi delta) with
      delta = phi - c/T. On resonance the probability is one (phase_estimation_exact, an
      inverse-QFT inversion).

      For |delta| <= 1/(2T), Jordan's inequality bounds the numerator below and
      |sin t| <= |t| the denominator above, giving probability at least 4/pi^2 at the
      closest index (phase_estimation_lower_bound; Nielsen and Chuang section 5.2). The
      module lives in the Cat-1 tree, extracted in 2026 from the Shor development, and
      Shor's order-finding consumes it at phase s/r. Single-phase statement only: a
      consumer racing several eigenvalue branches must control its own cross-terms.
    term: phase estimation
    status: proved-in-corpus
    lean:
