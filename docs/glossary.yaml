  - slug: hong-ou-mandel
    hook: >
      When two identical photons meet at a beam splitter they always leave together, never
      one through each exit. Their indistinguishability shows up as a hole in the data.
    layman: >
      A beam splitter is a half-silvered mirror: light that hits it is either transmitted
      straight through or reflected, and for a single photon, a single particle of light,
      the choice is random with equal odds. Now send two photons at the splitter from
      opposite sides so that they arrive at the same instant, with a detector waiting at
      each exit. Simple counting suggests that half the time the photons should leave
      through different exits, one detector clicking on each side, an event called a
      coincidence.

      The experiment says never. If the photons are truly identical, the two histories that
      lead to a coincidence, both transmitted and both reflected, cancel each other. In
      quantum mechanics each possible history carries a number called an amplitude, and when
      different histories end in the same outcome their amplitudes are added before the
      probability is worked out. For the coincidence outcome the two amplitudes are equal
      and opposite, so their sum is zero. Both photons always leave through the same exit,
      and coincidence counts drop to nothing.

      The signature is the Hong-Ou-Mandel dip. Scan the time offset between the photons'
      arrivals and watch the coincidences vanish as the two become simultaneous. The depth
      of the dip measures how identical the photons are; its width measures their coherence
      time, the stretch of time over which each photon's wave keeps step with itself. What
      began as a demonstration is now a workshop tool, the standard ruler for
      indistinguishability in photonics.
    in_csd: >
      The Hong-Ou-Mandel effect is one of the programme's empirical twins, the flagship
      experiments that CSD's machine-checked corpus reproduces as pass-or-fail tests, and it
      was chosen because it probes a different organ from the Bell family of experiments.
      There is no separation here and no question of locality at all, only two alternatives
      cancelling. The question it puts to any account of quantum mechanics is pure: what, in
      your description of the world, is the difference between both photons transmitted and
      both reflected, such that the two can annihilate?

      For a theory with an underlying substrate the question has bite, because naively the
      two configurations differ only by a relabelling that nothing could observe.
      Reproducing the dip is therefore a real constraint on how CSD's regions and volumes
      handle the exchange of identical particles, which is exactly why the case is carried.
    mathematical: >
      For two indistinguishable bosons at the input ports of a balanced beam splitter, the
      both-transmitted and both-reflected amplitudes cancel; the output is a superposition
      of both-photons-left and both-photons-right, and the coincidence rate is zero.

      Partial distinguishability revives coincidences in proportion, which makes the
      visibility of the dip a quantitative measure of photon identity.
    person: >
      Chung Ki Hong and Zheyu (Jeff) Ou were graduate students of Leonard Mandel at the
      University of Rochester when the three demonstrated the effect in 1987, in a paper
      whose stated headline was metrological: measuring sub-picosecond time intervals by
      counting coincidences, decades before femtosecond lasers made such numbers routine.

      Mandel (1927-2001), born in Berlin and brought to Britain as a refugee in 1938, took
      his degrees at Birkbeck College London and moved to Rochester in 1964, where he
      effectively founded experimental quantum optics; half the field's senior figures
      passed through his group. Ou went on to a professorship at IUPUI in Indianapolis.
    term: Hong-Ou-Mandel effect
    eponyms: [Hong]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Hong%E2%80%93Ou%E2%80%93Mandel_effect
    related: [mach-zehnder, elitzur-vaidman, bell-not-join, typicality-volume, ramsey-interferometry]

  - slug: jacobi-identity
    hook: >
      The Jacobi identity is the law that turns the mismatch between doing things in
      different orders into a structure of its own. It is why classical and quantum dynamics
      read as two dialects of one language.
    layman: >
      Many operations depend on the order in which they are done. Turn a book a quarter turn
      about a vertical axis and then about a horizontal one, and it ends up in a different
      position from the one it reaches when the two turns are done the other way round. Take
      two operations, do them in one order and then in the other, and call the difference
      their bracket. The bracket measures how badly the two fail to commute, that is, to
      give the same result in either order. The question is whether this bracket is merely a
      number you compute case by case, or whether it obeys laws of its own. If it had none,
      every calculation involving it would be bespoke drudgery.

      It obeys exactly one deep law. Take three ingredients, form the bracket of the first
      with the bracket of the other two, then cycle the roles so that each ingredient takes
      the outer position in turn, and add the three results: everything cancels. That is the
      Jacobi identity. It is what promotes the bracket from an arithmetical accident to an
      algebraic structure, the multiplication of what mathematicians call a Lie algebra, the
      algebra of continuous symmetries such as rotations and time evolution.

      The payoff for physics is that two very different brackets both satisfy it. In quantum
      mechanics the bracket is the commutator, the difference between applying two operators
      in one order and in the other. In classical mechanics it is the Poisson bracket, the
      rule that says how one quantity, such as position, changes along the motion generated
      by another, such as energy. Same law, two theories. That shared grammar is why quantum
      and classical dynamics translate into each other as smoothly as they do.
    in_csd: >
      The identity sits underneath the programme's central translation. CSD's ontic side,
      its description of what actually exists, is a deterministic flow with Hamiltonian
      structure, the same kind of structure that governs classical mechanics. Its epistemic
      side, its description of what can be known, is operator dynamics with commutators, the
      familiar quantum formalism. The two levels correspond rather than merely resembling
      each other, because both brackets obey the same law. Without it, the two levels would
      be connected only by analogy and hand-waving.

      This is background structure rather than a theorem of the corpus, and the formal work
      around it has a definite edge. The state space is established as a symplectic manifold,
      the geometric setting in which Hamiltonian flows are usually studied: its area-like
      structure is closed and non-degenerate, the space is Kahler, and Hamiltonian vector
      fields with their flows are constructed on it. The bracket of two functions on that
      manifold, and the Jacobi identity for it, are not yet stated at the manifold level; the
      bracket is formal in canonical coordinates, where its vanishing for functions with
      disjoint supports is proved and used. That remaining step is recorded as a gap.
    mathematical: >
      For a Lie bracket, the cyclic sum of nested brackets vanishes. Equivalently,
      bracketing with a fixed element is a derivation, which is the form the identity takes
      in actual calculations.

      The matrix commutator and the Poisson bracket both satisfy it, making each a Lie
      algebra multiplication and licensing the classical-quantum dictionary.

      Corpus status: the symplectic structure of CP^(N-1) is formal (fsForm_isSymplectic, the
      atlas-sense IsKahler, hamiltonianVectorField with integral curves,
      Mathlib/Geometry/Manifold/); the canonical bracket in a Darboux chart and its
      disjoint-support vanishing are formal (SigmaLayer/ChartBracket.lean, poissonBracket,
      poissonBracket_eq_zero_of_disjoint). A manifold-level bracket of functions and its Jacobi
      identity are not stated; that is the recorded gap.
    person: >
      Carl Gustav Jacob Jacobi (1804-1851) was born in Potsdam to a Jewish banking family
      and converted to Christianity to make an academic career possible, the standard toll
      of the era. He taught at Konigsberg for eighteen years, building it into a
      mathematical centre, before illness moved him to Berlin.

      His work covered elliptic functions, in a legendary race with Abel, determinants,
      and mechanics: the Hamilton-Jacobi equation still carries his half of the name. He
      also left the era's best statement of pure-science defiance, answering Fourier's
      complaint that he wasted his talent on number theory: the sole end of science is the
      honour of the human spirit.
    term: Jacobi identity
    eponyms: [Jacobi]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Jacobi_identity
    related: [poisson-bracket, kahler-form, liouville-measure, moment-map, schrodinger-from-records]

  - slug: kronecker-product
    hook: >
      Two quantum systems become one by multiplying their descriptions rather than adding
      them, which is why quantum resources multiply where classical ones merely add.
    layman: >
      Two quantum systems sit side by side. What describes the pair? Classically you would
      simply list both descriptions, one after the other, and the size of the joint
      description would be the sum of the two sizes. Quantum mechanics demands more. Every
      state of the first system can be paired with every state of the second, and every
      superposition of such pairings, every way of combining them with weights, is also a
      state of the pair. So the number of independent directions the pair can point in, its
      dimension, is the product of the two individual dimensions, not their sum.

      The Kronecker product is this fact written out in matrix form. It is a recipe that
      takes a square grid of numbers describing one system and a square grid describing the
      other, and multiplies them into a much larger grid describing both, with one row and
      one column for every pairing of a row from the first with a row from the second. It is
      mechanical to compute and explosive in its consequences.

      That multiplication instead of addition is the origin of quantum computing's power and
      of the difficulty of simulating quantum systems alike: thirty qubits, thirty two-level
      systems, need about a billion dimensions to describe. The exponential lives here.
    in_csd: >
      Throughout CSD's machine-checked corpus the Kronecker product is how composition, the
      joining of systems into a larger one, is realised. In one important place it is also
      how composition is earned rather than assumed. The results on composite systems do not
      start from the tensor-product structure of quantum mechanics; they derive it. Starting
      from two collections of operations, one for each part, such that operations on
      different parts can be done in either order and the two collections together generate
      every operation on the whole, the corpus proves that the whole must have the structure
      of a tensor product, with dimension equal to the product of the parts' dimensions, and
      it proves this for arbitrary ways of embedding the parts in the whole. The programme's
      necessity audit, its internal review of its results, rates that among the strongest in
      the development.

      Elsewhere it is infrastructure. The partial trace that discards an environment, the
      reduced states that describe one part of a larger system, and the marginals of thermal
      states are all Kronecker bookkeeping, consumed daily.
    mathematical: >
      The Kronecker product is the matrix form of the operator tensor product, with the
      mixed-product identity, (A tensor B)(C tensor D) = (AC) tensor (BD), doing the
      functorial work.

      It is consumed by the partial-trace machinery, and it is earned rather than assumed in
      the composite reconstruction, where commuting generating subalgebras force tensor
      structure and multiplicative dimension.
    person: >
      Leopold Kronecker (1823-1891) was born in Liegnitz, Silesia, and was privately tutored
      by Kummer, the start of a lifelong alliance. He then did something almost no
      mathematician has done: he stopped at his doctorate, spent a decade running the
      family's banking and estate business, grew rich, and returned to mathematics at thirty
      with no need of a salary. He lectured at Berlin for twenty years before accepting a
      chair at all.

      He is remembered for his constructivist conviction, summed up in his remark that God
      made the integers and all else is the work of man, and for prosecuting that conviction
      against Cantor's infinities with a persistence that shaded into persecution and
      darkened Cantor's life. The product bearing his name is, ironically, the least
      controversial thing attached to it.
    term: Kronecker product
    eponyms: [Kronecker]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Kronecker_product
    related: [partial-trace, hilbert-space, bell-not-join, field-arena, stinespring-dilation]

  - slug: leggett-garg
    hook: >
      Bell's argument can be rotated from space into time, and what it then tests is not
      action at a distance but whether the world has a definite history.
    layman: >
      Bell inequalities need two separated particles, so a sceptic can file the whole
      conflict with common sense under strange facts about distance. Leggett and Garg asked
      the question with a single particle and no distance at all. Does a system have
      definite properties in between the moments when you look at it? And can you look
      without disturbing it?

      Grant those two assumptions, a definite history and gentle measurement, and the
      correlations between measurements made at different times, the degree to which one
      result predicts the next, obey a strict bound. Quantum mechanics breaks the bound.
      Experiments agree with quantum mechanics.

      So one of the two assumptions has to go. Either properties are not definite between
      measurements, or measurement is never really gentle. The inequality cannot tell you
      which, and every account of quantum mechanics has to choose.
    in_csd: >
      This test aims closer to CSD's heart than Bell does, which is exactly why the
      programme's machine-checked corpus carries it. A theory built on an underlying
      substrate practically advertises definite properties between measurements; that is
      what having a substrate means. An inequality that targets precisely this assumption
      probes the programme where it is most exposed.

      CSD's escape is through the second assumption, and the escape is principled rather
      than convenient. Measurements in CSD are physical interactions that produce records,
      and interactions are not gentle. The underlying state is definite at every moment, and
      the act of reading it participates in the dynamics. A definite history with invasive
      measurement violates nothing in the argument, and that is exactly the combination CSD
      is built from.
    mathematical: >
      The inequality bounds combinations of two-time correlation functions; it follows from
      macrorealism plus non-invasive measurability, and quantum mechanics violates it.

      Both hypotheses are load-bearing: an account with definite properties but invasive
      measurements is untouched. That is the compartment this programme occupies, stated
      rather than implied.
    person: >
      Anthony Leggett, born in London in 1938, read Greats, the Oxford classics course,
      before switching to physics, a route that no longer exists. He took his doctorate
      under Dirk ter Haar, spent twenty years at Sussex, and moved to the University of
      Illinois at Urbana-Champaign in 1983. His 2003 Nobel Prize was for superfluid
      helium-3.

      The inequality, with his student Anupam Garg in 1985, was not foundations tourism.
      Leggett has argued seriously for decades that quantum mechanics might actually fail at
      macroscopic scales, and the inequality was built as the instrument to catch it
      failing. The experiments keep siding with quantum mechanics, which Leggett, to his
      credit, keeps reporting.
    term: Leggett-Garg inequality
    eponyms: [Leggett]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Leggett%E2%80%93Garg_inequality
    related: [bell-chsh, contextuality, kochen-specker, single-trajectory, hidden-variables]

  - slug: loewner-order
    hook: >
      There is a workable meaning of bigger for operators, and it brings a strange
      discovery, that taking square roots respects it while taking squares can break it.
    layman: >
      Quantum information theory runs on inequalities. This entropy is at most that one;
      this channel loses at least this much information. But the objects being compared are
      operators, matrices acting on states, rather than plain numbers, and it is not obvious
      what it means to say that one matrix is at most another.

      The Loewner order answers as follows. A matrix is called positive semidefinite if it
      never produces a negative number: whatever state you evaluate it in, the expected
      value is zero or more, which is the same as saying that all its eigenvalues, the
      stretch factors along its special directions, are at least zero. One operator is at
      most another when their difference, the second minus the first, is positive
      semidefinite. Some pairs of operators cannot be compared either way, so this is a
      partial order rather than a complete ranking, and that is fine.

      The genuine surprise is which functions respect the order. Suppose one operator is
      below another, and apply the same function to both, by applying it to each eigenvalue.
      Take square roots and the order is preserved. Take squares and the order can flip.
      Intuition trained on ordinary numbers, where squaring two positive numbers keeps them
      in order, fails at the second example, and half the classic blunders in operator
      inequalities are exactly this failure.
    in_csd: >
      The entropy and channel results in CSD's machine-checked corpus are statements in this
      order. Data processing, the fact that no channel can increase the information a state
      carries; subadditivity, the fact that the entropy of a whole is at most the sum of the
      entropies of its parts; and the contraction of trace distance, the fact that a channel
      cannot make two states easier to tell apart: all of these compare operators. So do the
      operator-convexity results that support them.

      The machinery is imported, not claimed. What the corpus adds is formal verification,
      which for this topic has unusual value. Because intuition about numbers fails silently
      here, this is exactly the terrain where an informal proof can be confidently wrong,
      and where machine-checking pays for itself.
    mathematical: >
      A is at most B iff B minus A is positive semidefinite. Operator monotone functions,
      those respecting the order under the functional calculus, are characterised by
      Loewner's theorem: precisely the functions that continue analytically to map the upper
      half-plane to itself. Square root and logarithm qualify; the square does not.

      The corpus consumes the order throughout its entropy and channel chains.
    person: >
      Charles Loewner (1893-1968), born Karel Lowner near Prague, studied under Georg Pick
      at the German university there. His 1923 attack on the Bieberbach conjecture
      introduced an evolution equation that waited eighty years to become spectacularly
      famous, as the Loewner in Schramm-Loewner evolution, now central to two-dimensional
      statistical physics.

      The operator-monotone characterisation dates from 1934. Five years later the Nazi
      occupation forced him out of Prague, and he restarted in America almost from zero:
      Louisville, Syracuse, and finally Stanford from 1951, where he taught to the end. Two
      results, each half a century ahead of its audience, from a man who had to rebuild his
      life in the middle.
    term: Loewner order
    eponyms: [Loewner]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Loewner_order
    related: [hermitian-operator, klein-inequality, lindblad-equation, choi-theorem, von-neumann-entropy]

  - slug: mach-zehnder
    hook: >
      Split a single particle down two paths and recombine them, and where it lands depends
      on both paths, including the one you can prove it never took.
    layman: >
      The Mach-Zehnder interferometer is the cleanest hardware for the central puzzle of
      quantum mechanics. A beam splitter, a half-silvered mirror, sends light down two
      separate paths; ordinary mirrors bring the paths back together at a second beam
      splitter; two detectors wait at the two exits. Which detector fires depends on the
      difference between the two path lengths. The light travelling each path arrives as a
      wave, and the two waves either reinforce or cancel at each exit according to how far
      out of step the two paths have put them. This is interference, and so far it is
      classical optics.

      Now dim the source until only one particle of light, one photon, is in flight at a
      time. The interference stays. A single photon's arrival statistics depend on both
      paths at once. Block either path and the interference dies instantly, replaced by a
      fifty-fifty split between the detectors.

      Every hard question about quantum mechanics can be staged in this box. What happened
      in between the splitters? Was there a path? When was the outcome decided? That is why
      the instrument appears in every foundations argument since 1892.
    in_csd: >
      This is the standard arena for the interference experiments among the programme's
      empirical twins, the flagship experiments that CSD's machine-checked corpus reproduces
      as pass-or-fail tests: the bomb tester and the quantum eraser both live inside it. Its
      value is diagnostic. It forces any account of quantum mechanics to say something
      definite about the alternative that was not measured, which is precisely where
      interpretations stop agreeing.

      The eraser variant is the sharpest instrument in the set. Recording which path the
      particle took destroys the interference, and discarding that record afterwards
      restores it. Any story in which the particle simply took one definite path has real
      explaining to do about the restoration. CSD's account runs through the structure of
      regions in its state space rather than through stories about paths, and reproducing
      both twins is treated as a pass-or-fail constraint, not decoration.
    mathematical: >
      Two balanced beam splitters and two paths, with output intensities set by the relative
      phase between the arms.

      Unlike the Michelson layout, the paths are spatially separated and traversed once,
      which is what makes arm-specific interventions (blockers, detectors, erasers) cleanly
      statable, and hence what makes it the canonical which-path laboratory.
    person: >
      Ludwig Zehnder (1854-1949), a Swiss physicist with a doctorate under Rontgen at
      Wurzburg, published the design in 1891; Ludwig Mach (1868-1951) refined it
      independently in 1892. Neither had quantum mechanics in mind: the instrument was built
      for measuring refractive indices.

      The younger Mach was the son of Ernst Mach, whose positivism, the doctrine that only
      what is observable is real, shaped Einstein and the Vienna Circle. There is a neat
      irony in the son's instrument becoming, a century later, the standard stage for
      arguments about whether unobserved paths are real. The father would have had opinions.
    term: Mach-Zehnder interferometer
    eponyms: [Mach]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Mach%E2%80%93Zehnder_interferometer
    related: [elitzur-vaidman, hong-ou-mandel, ramsey-interferometry, malus-law, collapse]

  - slug: malus-law
    hook: >
      Malus's law is a cosine-squared rule discovered in 1808 with a crystal and a sunset,
      and it turns out to be the oldest data point for the Born rule.
    layman: >
      Light can be polarised, meaning that its wave oscillates in one fixed direction across
      its line of travel, and a polariser is a filter that passes only light oscillating
      along its own axis. Pass polarised light through a second polariser tilted at some
      angle to the first. How much gets through? Malus measured it in 1808. The transmitted
      fraction is the square of the cosine of the angle between the two axes: aligned,
      everything passes; crossed at right angles, nothing; at forty-five degrees, exactly
      half.

      A century later quantum mechanics asked what happens when a single photon, one
      particle of light, meets that tilted polariser. A photon cannot be split, so it either
      passes or it does not, and the answer is the same cosine squared, now as the
      probability of passing. The Born rule is the general law of quantum mechanics that
      turns a state into probabilities for outcomes, and here it already was: Malus had
      measured it before anyone knew there was such a rule, before the photon, before
      probability entered physics at all.

      That makes Malus's law the oldest quantitative fact that any theory of quantum
      probability must reproduce, and the simplest test any such theory can face.
    in_csd: >
      CSD's machine-checked corpus derives this law rather than assuming it. Among the
      states of a single photon's polarisation, those that lead to the photon passing form a
      region, and that region occupies exactly the cosine-squared fraction of the whole
      state space when the space is measured with the programme's forced measure, the one
      even-handed notion of volume it admits. It is the smallest complete instance of the
      entire programme: the one case where the full argument, regions and volumes and all,
      can be followed by hand on the back of an envelope.

      That is also its danger, flagged wherever the corpus uses it. Polarisation is a
      two-level system, and the two-level case is deceptively special. Its state space is a
      sphere, which makes the geometry so tractable that it is easy to mistake the special
      case for the general one. Smallest instance, best pedagogy, worst extrapolation.
    mathematical: >
      The transmitted fraction equals the cosine squared of the angle between the polariser
      settings, which is identically the Born weight for the corresponding spin measurement.

      In the corpus it is a volume ratio: the Fubini-Study measure of the pass region over
      the total, computed exactly on CP^1.
    person: >
      Etienne-Louis Malus (1775-1812) was a soldier-scientist of the Napoleonic era: a
      member of the Ecole Polytechnique's first cohort, then an engineer on the Egyptian
      campaign, where he survived plague at Jaffa and never fully recovered his health.

      The discovery is the stuff of legend, and for once the legend is documented. In 1808,
      in his rooms on the Rue d'Enfer, he idly examined the sunset reflecting off the
      windows of the Luxembourg Palace through a calcite crystal, and noticed the doubled
      image dimming and brightening as he rotated the crystal. Reflected light was
      polarised, and nobody had known. He named polarisation, won the Academy prize for
      double refraction, and was dead at thirty-six.
    term: Malus's law
    eponyms: [Malus]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Malus%27s_law
    related: [born-weight, stern-gerlach, mach-zehnder, bloch-sphere, born-volume-ratio]

  - slug: mermin-inequality
    hook: >
      Add more particles and the conflict between quantum mechanics and common sense grows
      exponentially. It does not average out; it compounds.
    layman: >
      A natural guess is that quantum strangeness is a small-systems phenomenon, and that as
      you add particles it washes out into classical behaviour: averages of averages, and
      the strangeness dilutes.

      Mermin's inequalities say the opposite happens. Start from the Bell experiment, in
      which two separated particles are measured and their results compared, and add
      parties, three particles, four, ten. For any number of parties there is a bound that
      every common-sense account must respect, meaning any account in which each particle
      carries its own definite answers and nothing influences anything at a distance.
      Quantum mechanics predicts correlations that exceed the bound, and the gap between
      what it delivers and what the bound allows does not shrink as parties are added. It
      grows exponentially with the number of particles, doubling roughly every two parties
      added.

      So the conflict with local realism, the combination of definite local properties and
      no action at a distance, is not a fragile corner case of tiny systems. It is a
      structural feature that becomes more pronounced with size, which is the reverse of
      what the wash-out intuition predicted.
    in_csd: >
      CSD's machine-checked corpus carries the multi-party inequalities so that its results
      on contextuality, the dependence of measurement outcomes on what else is measured
      alongside them, are not hostage to the smallest case, and the exponential growth is
      the actual point of doing so. A substrate mechanism that happened to reproduce the
      two-party violation by some special trick would be exposed here: whatever produces the
      correlations has to keep producing them, and more strongly, as parties are added.

      Together with the GHZ argument, which reaches the same conflict through a single
      outright contradiction rather than through statistics, this establishes the conflict
      at every size and in both logical shapes, statistical and deterministic. That is the
      standard a substrate account must meet, and the corpus states the standard before
      claiming to meet it.
    mathematical: >
      A family of multipartite Bell inequalities whose classical bound is exceeded by
      quantum mechanics by a factor growing exponentially in the number of parties: 2 to the
      power (n-1)/2 for n parties.

      The corpus proves the quantum value and the classical bound separately, which keeps
      the exponential gap a theorem rather than a plot.
    person: >
      David Mermin, born in 1935, took his degrees at Harvard and spent his career at
      Cornell, much of it directing the Laboratory of Atomic and Solid State Physics. With
      Ashcroft he wrote the solid-state textbook that trained a generation.

      He is that rare thing, a physicist whose prose is part of his scientific reputation.
      The phrase shut up and calculate is his, coined in 1989 as a description of an
      attitude he was criticising, then promptly attributed to Feynman and quoted with
      approval, a fate he has written about with resignation. The multi-party inequalities
      date from 1990, in a paper short enough to read over coffee, which turned the GHZ
      conference argument into something an experiment could score.
