    related: [tsirelson-bound, contextuality, singlet-contextual-model, hidden-variables, does-csd-violate-bell]

  - slug: ghz-state
    reviewed: 2026-09-14
    image:
      file: img/ghz-state.jpg
      alt: "Portrait photograph of Anton Zeilinger"
      caption: "Anton Zeilinger, the Z of GHZ."
      credit: "CEU / Daniel Vegel; Central European University from Budapest, Hungary, CC BY 2.0, via Wikimedia Commons"
      licence: "CC BY 2.0"
      source: https://commons.wikimedia.org/wiki/File:Anton_Zeilinger,_2019_(49085194786)_(cropped).jpg
      article: https://en.wikipedia.org/wiki/Anton_Zeilinger
    hook: >
      Three particles can contradict local realism with certainty in a single run, with no
      statistics, no inequality and no margin of error.
    layman: >
      Bell's argument has one feature a determined sceptic can pick at, which is that it's
      statistical. No single run of a Bell experiment is impossible on the common-sense
      picture, in which every measurement has an answer fixed in advance, as the runs are
      only collectively improbable. You need thousands of runs and error bars, and someone
      can always mutter about statistics.

      Greenberger, Horne and Zeilinger found a way to remove the error bars. With three
      particles instead of two, prepared together in what's now called a GHZ state,
      there's a set of measurements for which the common-sense picture predicts one
      definite answer and quantum mechanics predicts the opposite definite answer, so the
      two predictions aren't different averages but opposite certainties.

      One run settles the matter, in principle, and the conflict stops being about
      probability and becomes arithmetic. Each measurement gives plus one or minus one,
      and if you multiply out the answers the common-sense picture demands the product
      must be plus one, while quantum mechanics says minus one. Something has to give, and
      experiment says it's the answer sheet.
    in_csd: >
      The corpus carries the three-party obstruction alongside the two-party one for a
      specific defensive reason, which is that the two have different logical shapes and
      an account built on an underlying substrate has to survive both. You could imagine a
      mechanism that reproduces the statistical Bell violations through some averaging
      trick but fails on a deterministic contradiction, and carrying the GHZ result closes
      that escape.

      The proof quantifies over arbitrary spaces of hidden states rather than examining
      one model, which is what makes it a constraint on the whole class of accounts in
      which the hidden description splits into a separate part for each particle,
      including naive rewrites of this programme, and that's the point.
    mathematical: >
      No product partition of a shared hidden-state space reproduces the GHZ correlations,
      proved over an arbitrary measurable state space.

      The contradiction is algebraic. The four predicted outcome-sign products can't be
      consistently assigned, as multiplying the local predictions forces plus one where
      the quantum state forces minus one. No inequality is involved and no bound is
      approached, so the two predictions simply differ, which is why a single ideal run
      distinguishes them.
    person: >
      Daniel Greenberger of City College New York, Michael Horne (1943-2019) of Stonehill
      College, and Anton Zeilinger of Vienna and Innsbruck introduced the argument in
      1989. Horne, as Shimony's graduate student at Boston University, had already co-
      authored the CHSH inequality.

      The publication story is odd. The result appeared in the proceedings of a conference
      at Erice rather than in a journal, and it spread mostly by word of mouth until
      Mermin wrote it up and made it famous. Zeilinger shared the 2022 Nobel Prize for
      entanglement experiments, and Horne had died three years earlier.
    term: GHZ state
    eponyms: [GHZ]
    status: proved-in-corpus
    lean:
      module: CsdLean4/LF6/GHZContextuality.lean
      theorem: no_product_partition_realises_ghz
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-claims
      text: The current-claims page lists the Bell-violating correlations this state sharpens
    related: [bell-chsh, mermin-inequality, contextuality, hidden-variables, no-signalling]

  - slug: tsirelson-bound
    reviewed: 2026-09-14
    image:
      file: img/tsirelson-bound.jpg
      alt: "Portrait photograph of Boris Tsirelson"
      caption: "Boris Tsirelson."
      credit: "Renate Schmid, CC BY-SA 2.0 de, via Wikimedia Commons"
      licence: "CC BY-SA 2.0 de"
      source: https://commons.wikimedia.org/wiki/File:Tsirelson_boris_(cropped).jpg
      article: https://en.wikipedia.org/wiki/Boris_Tsirelson
    hook: >
      Quantum mechanics breaks the classical limit on correlations and then stops well
      short of what logic alone would allow, and why it stops exactly there is a genuinely
      open question.
    layman: >
      Quantum mechanics isn't as strange as it could be. In the standard Bell test, the
      results of two separated measurements are combined into a single correlation score,
      and any theory in which measurements have answers fixed in advance keeps that score
      at 2 or below. Quantum mechanics reaches about 2.83, the famous violation, but sheer
      logic permits a score of 4, and theories that reach 4 exist on paper, cause no
      paradoxes, and allow no faster-than-light messages.

      So relativity isn't what stops quantum mechanics at 2.83. Something else does, and
      nobody fully knows what. The ceiling is called the Tsirelson bound, and explaining
      why nature's ceiling sits exactly there rather than at the logical maximum has
      become a research programme in its own right.

      The honest position is that we can prove where the quantum ceiling is, and we can't
      yet say, from first principles anyone agrees on, why that's the ceiling the world
      chose.
    in_csd: >
      A reconstruction has to get the ceiling right and not just the violation.
      Reproducing the Bell violation with the wrong maximum would mean having built a
      different theory that agrees with quantum mechanics only qualitatively, which would
      be interesting but wouldn't be quantum mechanics. So the corpus proves the bound
      over the whole family of two-qubit systems, a qubit being the simplest quantum
      system, which means every state of a pair of qubits and every choice of measurement
      directions and not just the singlet at the textbook angles.

      Saturation is proved separately, so there really are settings at which the singlet
      reaches 2.83 exactly. Ceiling and attainment are two theorems rather than one
      observation, and keeping them apart is what lets each be checked on its own.
    mathematical: >
      For every unit two-qubit state and all detector settings, the CHSH combination of
      Pauli correlations satisfies absolute value at most 2 root 2. The route is algebraic
      but not operator-algebraic, as the load-bearing lemma bounds the expression
      Re<alpha,beta> - Re<alpha,beta'> + Re<alpha',beta> + Re<alpha',beta'> for any four
      unit vectors in a complex inner product space, by the parallelogram law and Cauchy-
      Schwarz, and the quantum bound follows by the standard Tsirelson substitution alpha
      = (sigma.a tensor I)psi, beta = (I tensor sigma.b)psi.

      Be precise about the form, because it's easy to overstate. The operator-form
      Loewner-order statement, the inequality about products of anticommuting involutions
      with no state mentioned, isn't what the corpus has. It was the original target and
      is blocked upstream on a missing ordered-module instance for matrices, as the module
      records. The vector form is general in its own right and yields the same expectation
      bound, and saturation by the singlet is exhibited explicitly and separately.
    person: >
      Boris Tsirelson (1950-2020) was born in Leningrad and trained there under Ibragimov,
      mostly in probability, on Brownian motion, exotic noises and what he called black
      noise. The quantum bound was almost a side project.

      It appeared in 1980 in Letters in Mathematical Physics, written from inside the
      Soviet Union, and it sat largely unread in the West for years because the field that
      would need it didn't yet exist. He emigrated to Israel in 1991 and spent the rest of
      his career at Tel Aviv University. In later life he became one of the most careful
      mathematics editors on Wikipedia, which he treated as seriously as journal work.
    term: Tsirelson bound
    eponyms: [Tsirelson]
    status: proved-in-corpus
    lean:
      module: CsdLean4/SigmaLayer/BellGenerality.lean
      theorem: qm_chsh_le_tsirelson
    site_link:
      url: https://www.constraintsurfacedynamics.com/current-claims
      text: The current-claims page lists the correlation results this bound caps
    related: [bell-chsh, cglmp-inequality, mermin-inequality, no-signalling, does-csd-violate-bell]

  - slug: landauer-principle
    reviewed: 2026-09-14
    image:
      file: img/landauer-principle.jpg
      alt: "Portrait photograph of Rolf Landauer"
      caption: "Rolf Landauer."
      credit: "Copyrighted free use, via Wikimedia Commons"
      licence: "Copyrighted free use"
      source: https://commons.wikimedia.org/wiki/File:Rolf_Landauer.jpg
      article: https://en.wikipedia.org/wiki/Rolf_Landauer
    hook: >
      Forgetting costs heat at a rate set by temperature alone, and that's the point at
      which information stops being an abstraction and acquires a physical price.
    layman: >
      The story starts with a demon. Maxwell imagined a tiny being that sorts fast
      molecules from slow ones, apparently creating a temperature difference for nothing
      and so breaking the second law of thermodynamics, the law that says the disorder of
      an isolated system never decreases. For a century the demon dodged every exorcism,
      as each proposed fix turned out to have a loophole.

      Landauer found the real answer, and it's about memory. The demon must record what it
      learns, its memory is finite, and so eventually it must erase, and erasing is the
      step that can't be free. Resetting a memory to a blank state compresses many
      possible configurations into one, and that compression must be paid for in heat
      released to the surroundings.

      The price is universal. It depends on the temperature and on nothing else, not the
      technology and not the ingenuity of the engineering. Forgetting one bit of
      information costs, at minimum, a tiny but fixed quantity of heat, and with that
      payment the demon's books balance exactly.
    in_csd: >
      Thermodynamics isn't bolted onto this programme, as it grows from the same soil as
      the Born rule. The motion of the substrate preserves volume, so at the finest grain
      nothing is ever lost and entropy, the measure of missing information, is conserved.
      Irreversibility appears only when a record is coarse-grained, which means many
      detailed configurations are lumped together under one description. This is
      Boltzmann's picture, with reversible microscopic dynamics and irreversibility living
      in the description rather than in the dynamics.

      Given that setup, an erasure bound isn't an import from another field. It's what the
      record layer, the part of CSD that describes how outcomes are recorded, owes and
      pays. The corpus derives temperature and free energy first, from a variational
      principle, a rule that singles out a state by making some quantity as small or as
      large as it can be, and then proves the Landauer bound in those earned terms. It's
      the tightest link the development has between information and physical cost.

      The bound is also stated on the constraint surface. Take a preparation of a system
      together with a bath, in product form, whose bath component has a Gibbs state as its
      density operator, and let a volume-preserving flow lifting a unitary act on the
      pair. The entropy the system loses is then bounded by the heat the bath receives,
      with the same constant as the matrix-level theorem. Nothing about the flow is
      posited beyond its lifting the joint unitary, so the thermodynamic cost of erasure
      is read off the substrate's own dynamics.
    mathematical: >
      The entropy removed from a system is bounded by beta times the heat delivered to the
      bath. The proof runs in three steps, as unitary evolution on an initially product
      state conserves total entropy, subadditivity bounds the system's entropy drop by the
      bath's entropy rise, and the bath's Clausius inequality converts entropy rise into
      heat.

      The statement is in the Reeb-Wolf form, which forces the assumptions into the open.
      The bath starts in a Gibbs state, everything is finite-dimensional, the initial
      system state is positive-definite, and both final marginals are full-rank. The last
      two aren't decoration, as they're what the subadditivity step consumes, and that
      step is proved only at positive-definite marginal scope. Naming them is the point,
      because several informal derivations of the principle are known to smuggle
      assumptions at exactly the step this version makes visible.

      landauer_flow (Thermo/SigmaSecondLaw.lean) is landauer_bound applied to the
      barycentres of a product preparation flowed by a lift of the joint unitary, with the
      bath preparation's barycentre equal to the Gibbs state, and the full-rank hypotheses
      of the matrix theorem are inherited and not removed.
    person: >
      Rolf Landauer (1927-1999) was born in Stuttgart, and his family fled to New York in
      1938 after his father's death. He took his degrees at Harvard and joined IBM in
      1952, spending his whole career at the Watson Research Center in Yorktown Heights,
      which was corporate research at its mid-century best, where a physicist could spend
      decades on the question of why computing costs energy.

      The principle appeared in 1961 in the IBM Journal of Research and Development, a
      house journal, under the resolutely unglamorous title of a paper about heat
      generation. His slogan, that information is physical, was a deliberate provocation.
      His colleague Charles Bennett drew the astonishing corollary a decade later, that
      computation itself can be free and only forgetting costs. Experimental confirmation
      came in 2012, thirteen years after Landauer died.
    term: Landauer's principle
    eponyms: [Landauer]
    status: proved-in-corpus
