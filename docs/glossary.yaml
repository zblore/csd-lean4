  - slug: carving
    hook: >
      Carving is the programme's own word for the move it refuses to count as a
      derivation, which is cutting a region to have exactly the size you wanted to
      explain.
    layman: >
      Stated as bluntly as a critic would, the problem with volume explanations of
      probability is this. If you're allowed to draw the regions yourself, you can make
      any probability come out of any measure, so if you draw a region covering thirty
      percent of the space and announce that the outcome has a thirty percent probability,
      you've explained nothing, as the explanation was smuggled in with the scissors.

      CSD calls this move carving, by name, in its own documentation, because early layers
      of the formalisation genuinely did it, and the honest label is what kept the debt
      visible. A carved region realises the Born value, the probability quantum mechanics
      assigns, and it doesn't derive it.

      The interesting history is the repayment. For the corpus's central results the
      carving was eliminated, so the sizes come out of the geometry, forced by symmetry
      and by the moment map, a function that reads the outcome weights directly off the
      quantum state, with no hand on the scissors.
    in_csd: >
      Carving is the boundary marker between two kinds of result the programme keeps
      separate. A realisation is a fibre partition cut by construction so its volumes
      match a target, which is proved, useful, and honestly labelled as putting the value
      in. A derivation is the Born weight shown equal to a volume the geometry fixes
      independently, through the moment-map identity and the Duistermaat-Heckman law,
      which fixes how the state space's volume is distributed over the possible outcome
      weights, so nobody chose the sizes.

      The corpus's documentation flags every result with the side of the line it sits on,
      and the volume route to the Born rule runs entirely on the derived side. The word
      survives as an audit tool, so when a new result lands on a specific number the first
      question asked is whether anything was carved.
    mathematical: >
      The carved tier is fibre arcs of prescribed length realising prescribed weights,
      with genuine disjointness and correct totals but the target built in.

      The derived tier is the Born weight as a moment-map coordinate, forced by torus
      generation (CellLawForced.lean, torusGenerated_eq_momentMap) rather than by
      invariance, the joint pushforward of the Fubini-Study measure under the moment map
      equal to the uniform simplex law, and the resulting volume-ratio theorems at every
      N, unconditional.
    term: Carving
    status: definition
    source: curated
    site_link:
      url: https://www.constraintsurfacedynamics.com/primer-4
      text: The fourth primer page is the plain-terms account of outcomes being carved out
    related: [outcome-region, measurement-context, pointer-basis, fibre, record-layer]

  - slug: first-passage-race
    hook: >
      When a measurement has several possible outcomes, the one that happens is the one
      whose clock fires first, and the law those clocks obey isn't a modelling choice, as
      it's the only law that makes the race come out right, and that's proved in both
      directions.
    layman: >
      Suppose a measurement outcome is decided by something physical rather than declared
      by a rule. That something then has to be specified in detail, and every detail a
      theory specifies is a detail a critic can call arbitrary, so the first-passage race
      is CSD's way of settling an outcome physically while leaving as little as possible
      to choice.

      The picture is a race. Each possible outcome carries its own clock, and the clocks
      run at speeds set by the quantum state, so an outcome the state favours has a fast
      clock and an outcome it disfavours a slow one, and the outcome that happens is the
      one whose clock fires first. Set up this way, the race reproduces the quantum
      probabilities exactly, but it seems to buy that result by choosing how the clocks
      behave. The clocks have exponential waiting times, which means the chance of a clock
      firing in the next instant never depends on how long it has already been running,
      much as a radioactive atom is no more likely to decay for having survived a long
      time, so you can ask why that law and not some other.

      The answer is that no other law works. If the rule that the first clock to fire wins
      is to reproduce the right proportions for every possible number of outcomes, the
      waiting times have to be exponential, so it isn't a natural choice or a convenient
      one but the only one. The argument runs both ways, as the exponential law makes the
      race work, and any law that makes the race work is exponential.
    in_csd: >
      The race is the record layer's order-free way of deciding an outcome. An earlier
      construction cut an interval into consecutive pieces stacked in a fixed order, which
      quietly privileged whichever outcome came first in the list, and in the race no
      outcome is privileged, as each simply has a clock. The clock rates are read off the
      moment map, the map that extracts the Born weights directly from the geometry of the
      state space, so the squared amplitudes that set the speeds are geometry rather than
      an extra input, and the clock law itself is a theorem in the corpus rather than a
      citation to the probability literature.

      Two qualifications travel with the result and should never be dropped. First, the
      characterisation quantifies over every number of outcomes, as at any one fixed
      number of outcomes the race constrains only finitely many summary statistics of the
      waiting-time law and determines nothing on its own. What's forced is the exponential
      law given that a single clock law serves every case, and that's a commitment the
      programme already makes, as the behaviour of the clocks doesn't depend on which
      measurement is being performed.

      Second, the result removes a posit and doesn't supply a mechanism. No dynamics is
      shown to carve the cells of the race, and the earlier attempt to derive them from a
      mixing flow was retired as mis-specified rather than merely unfinished.
    mathematical: >
      Take independent, identically distributed clock readings xi_j drawn from a common
      probability law on the reals, and let clock j fire at time xi_j / b_j for a rate
      vector b with positive entries. The law has the race property when, for every number
      of clocks and every such rate vector, the probability that clock i fires first is
      b_i / sum_j b_j. The theorem hasRaceProperty_iff_exists_expMeasure
      (CsdLean4/Mathlib/Probability/IidClockRace.lean) states that a probability law has
      the race property if and only if it's an exponential law with some positive
      parameter.

      The forward direction instantiates the race at k clocks for every k, which turns the
      race condition into a family of moment identities for the unknown law, and
      atomlessness and support in the positive reals are derived from the race property
      along the way rather than assumed. The quantification over the number of clocks is
      load-bearing, as at a fixed number of clocks only finitely many moments are
      constrained, so what's characterised is the law that serves every number of clocks.
    reviewed: 2026-09-14
    term: First-passage race
    status: proved-in-corpus
    source: curated
    lean:
      module: CsdLean4/Mathlib/Probability/IidClockRace.lean
