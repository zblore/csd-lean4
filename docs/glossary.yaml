  - slug: fisher-information
    image:
      file: img/fisher-information.jpg
      alt: "Portrait photograph of Ronald Fisher"
      caption: "Ronald Fisher as a young man."
      credit: "public domain, via Wikimedia Commons"
      licence: "Public domain"
      source: https://commons.wikimedia.org/wiki/File:Youngronaldfisher2.JPG
      article: https://en.wikipedia.org/wiki/Ronald_Fisher
    hook: >
      There's a floor under every error bar, classical or quantum, and Fisher information
      is what sets it.
    layman: >
      Suppose you're estimating something, a frequency, a field strength or a phase, from
      noisy data. Better analysis shrinks your error bar up to a point, so you can ask
      whether there's a floor, a best possible precision that no cleverness in processing
      can beat.

      There is, and Fisher information is its name. It measures how sharply the
      distribution of your data responds when the underlying parameter shifts, so
      responsive data can pin the parameter down tightly and sluggish data can't. Turn the
      information upside down by taking its reciprocal and you have a hard lower bound on
      the spread of any unbiased estimate, meaning any estimate that's right on average.

      The quantum version adds one more optimisation. Instead of considering only the ways
      of processing the data from a fixed measurement, it ranges over all possible
      measurements, so it yields the ultimate floor physics allows for a given probe
      state.
    in_csd: >
      Fisher information lives in the corpus's metrology strand, which the documentation
      classifies carefully as an adjacent arm and not a step in the reconstruction. It
      consumes the formalised machinery of states, the Born rule and dynamics to state
      precision bounds and the protocols that meet them, and it contributes nothing to
      deriving quantum mechanics and doesn't pretend to.

      The reason to carry it at all is that a formalisation claiming practical reach
      should be able to state the standard quantum limit, the improved Heisenberg scaling
      that entanglement buys, and the gap between them, and the corpus can.

      The strand does touch the geometry at one point. The corpus proves that the natural
      distance on the space of quantum states agrees with the statistician's distance on
      the outcome probabilities along every direction a fixed measurement can see, which
      is the Fisher-Rao metric entry's result, and that agreement is what a Physlib
      collaboration on Fisher information asked the corpus for.
    mathematical: >
      In the classical setting, Fisher information is the variance of the score of a
      parametrised family, and the Cramer-Rao inequality bounds any unbiased estimator's
      variance below by its inverse.

      In the quantum setting, maximising over measurements gives the quantum Fisher
      information and the Braunstein-Caves bound, the precision floor for a given
      parametrised family of states before any choice of apparatus.

      For the coordinate readout of a pure state the corpus proves the bound itself and its
      equality case: along the projective direction of change (the component of the change
      orthogonal to the state, so that moving along the state itself counts for nothing) the
      classical Fisher information of the readout is at most the quantum Fisher information
      (fisherInfo_bornDeriv_horizontalLift_le), with equality exactly when that direction
      changes the moduli of the coordinates and not their phases
      (fisherInfo_bornDeriv_horizontalLift_eq_iff).
    person: >
      Ronald Fisher (1890-1962) was born in London, read mathematics at Cambridge, and did
      his transformative work not at a university but at Rothamsted Experimental Station
      from 1919, where crop trials posed the problems that produced experimental design,
      analysis of variance and maximum likelihood. Chairs followed, the Galton Chair at
      University College London and then Cambridge.

      The record has a dark seam that the name of his London chair advertises. Fisher was
      a lifelong, institutionally active eugenicist, and his statistics were in
      significant part built in service of that programme. Late in life he took tobacco-
      industry consulting money while publicly disputing the link between smoking and
      cancer. Both facts belong in any honest biography, next to the fact that modern
      statistics is unimaginable without him.
    term: Fisher information
    eponyms: [Fisher]
    status: standard-mathematics
    external:
      - text: "Overview and history"
        url: https://en.wikipedia.org/wiki/Fisher_information
    site_link:
      url: https://www.constraintsurfacedynamics.com/papers
      text: Paper D's geometric framework is where this quantity becomes the state space's metric
    related: [ramsey-interferometry, phase-estimation, born-weight, amplitude-estimation, robertson-uncertainty, fisher-rao-metric]

  - slug: fisher-rao-metric
    reviewed: 2026-09-29
    hook: >
      The natural way to measure distance between quantum states agrees with the
      statistician's way to measure distance between the probability distributions they
      produce, exactly and with no constant left to fix.
    layman: >
      Two probability distributions can be close together or far apart, and statisticians
      have a standard way to say how far, which asks how easily a sample could tell them
      apart. If moving from one distribution to the other barely changes what you'd
      observe they're close, and if it changes the observations a lot they're far. Fisher
      information is the local version of that idea, the rate at which observations respond
      to a small change, and the Fisher-Rao metric turns it into a geometry, a way of
      measuring lengths and angles on the space of distributions.

      Quantum states have a geometry of their own. The space of states of a finite quantum
      system carries a distance, the Fubini-Study metric, which is the only one that treats
      every state the same way and respects the symmetries of the theory. A measurement
      turns a state into a probability distribution over its outcomes, so you can ask
      whether the two geometries agree.

      They do, on the directions the measurement can see. Moving a state so that only the
      sizes of its components change, and not their phases, moves its outcome distribution,
      and the quantum distance moved equals the statistical distance moved. Moving the
      phases is invisible to the measurement, so those directions have quantum length and
      no statistical length. The gap between the two is the information a fixed measurement
      leaves on the table, which is why the best measurement of a parameter reaches the
      quantum limit exactly when the state moves in a modulus-only direction.
    in_csd: >
      The corpus builds the state space of a finite quantum system as a Kahler manifold,
      with the Fubini-Study form, metric and volume proved on it rather than assumed, and
      the Born weights appear on that manifold as the moment map of the torus that rotates
      the phases of the coordinates. This result reads the moment map as a map between
      geometries and finds that it carries the Fubini-Study inner product of two
      modulus-only directions to the Fisher-Rao inner product of their images, with constant
      one in the corpus's normalisation, and that it sends no such direction to zero, so it's
      an isometric embedding of the modulus-only directions into the simplex's tangent space.

      The value for the programme is that the metric side of its geometry is checked
      against a structure statisticians already own, and the value outside it is direct.
      The result is written so that the quantum information library Physlib can take it as
      it stands, and it was built for that library's Fisher information work, with the
      vector-level statement placed beside Physlib's own Fisher-Rao file and the manifold
      statement following from it in an affine chart.
    mathematical: >
      For a unit vector psi with no vanishing coordinate the Born weights p_i = |psi_i|^2
      form a point of the open simplex, and a direction u moves them by dp_i = 2 Re(conj(psi_i)
      u_i). Along a torus-horizontal direction, one for which every conj(psi_i) u_i is
      real, the Fisher-Rao inner product of the displacements of u and any v equals four
      times the real inner product of u and v (fisherRaoInner_bornDeriv); that is the
      Fubini-Study inner product once u and v are also tangent to the unit sphere, and the
      projective statement builds the tangency in by projecting the direction off psi first
      (horizontalLift, fisherRaoInner_bornDeriv_normalize). Along that projected direction
      the coordinate readout's Fisher information is at most fsInnerHom psi u u, which for
      unit psi is the quantum Fisher information 4(|u|^2 - |<psi, u>|^2)
      (fsInnerHom_self_of_norm_eq_one), with equality exactly when the projected direction is
      torus-horizontal (fisherInfo_bornDeriv_horizontalLift_le, _eq_iff), which is the
      Braunstein-Caves bound for that measurement.

      On the manifold the same statement reads fsMetric x u v = fisherRaoInner
      (toOpenSimplex x) (momentDeriv x u) (momentDeriv x v) on the regular stratum for u in
      the horizontal space, the Fubini-Study orthogonal complement of the torus orbit
      (fsMetric_eq_fisherRaoInner), and the differential is injective on that space at every
      point of the regular stratum (momentDeriv_injOn_horizontalSpace). The constant is one
      because the corpus normalises the Fubini-Study metric so that the qubit's state space
      is the unit sphere, where the metric is itself the quantum Fisher information (four
      times the Bengtsson-Zyczkowski metric), and the identification of the corpus's metric
      with that formula on lifts is its own theorem (fsMetric_eq_fsInnerHom). The map called
      the moment map here is the Born-weight map; the Hamiltonian of the torus action for the
      corpus's form is twice its pairing with the angles, so the moment map in the Hamiltonian
      sense is twice this map, and the constant one is for the weights. Every constant
      declared in the closure of the result depends on the foundational triple of axioms
      only.
    person: >
      Calyampudi Radhakrishna Rao (1920-2023) was born in Hadagali in what's now Karnataka,
      trained at Andhra University and Calcutta, and joined the Indian Statistical
      Institute under Mahalanobis in the early 1940s. His 1945 paper in the Bulletin of the
      Calcutta Mathematical Society, written when he was twenty-five, contains both the
      Cramer-Rao bound and the observation that Fisher information defines a Riemannian
      metric on a family of distributions, which is the metric that carries his name with
      Fisher's. He led the Institute's research and training for decades, moved to the
      University of Pittsburgh and then Pennsylvania State University, and received the
      National Medal of Science in 2002.

      Ronald Fisher's part of the name is his information measure of 1922, and his own
      entry tells his story.
    term: Fisher-Rao metric
    eponyms: [Fisher, Rao]
    status: proved-in-corpus
    lean:
      module: CsdLean4/Mathlib/Geometry/Manifold/Instances/ProjectiveSpaceFisherRao.lean
      theorem: fsMetric_eq_fisherRaoInner
    external:
      - text: "Wikipedia: Fisher information metric"
        url: https://en.wikipedia.org/wiki/Fisher_information_metric
      - text: "Braunstein and Caves, Statistical distance and the geometry of quantum states, PRL 1994"
        url: https://doi.org/10.1103/PhysRevLett.72.3439
      - text: "Rao, Information and the accuracy attainable in the estimation of statistical parameters, 1945"
        url: https://doi.org/10.1007/978-1-4612-0919-5_16
    site_link:
