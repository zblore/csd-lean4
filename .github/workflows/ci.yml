name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Both targets build with warnings-as-errors (validation-hardening WS-A,
      # 2026-08-12). The corpus is warning-clean at baseline; a landing that
      # introduces a warning now fails CI instead of accumulating silently.
      # Mutation-tested 2026-08-12: a planted unused-variable warning fails
      # `lake build --wfail CsdLeanTests` (exit 1) and passes without --wfail.
      - name: Build CsdLean4 (library, warnings fatal)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "--wfail CsdLean4"
          use-mathlib-cache: true

      - name: Build CsdLeanTests (regression suite + examples, warnings fatal)
        run: lake build --wfail CsdLeanTests

      - name: Static validity controls
        run: |
          bash scripts/check-module-coverage.sh
          bash scripts/check-validation-ledger.sh
          bash scripts/check-semantic-mutations.sh
          bash scripts/check-connectivity.sh
          bash scripts/check-sector-linkage.sh
          bash scripts/check-axiom-imports.sh
          bash scripts/check-claims.sh
          bash scripts/check-claim-provenance.sh
          bash scripts/check-citation-use.sh
          bash scripts/check-doc-promises.sh
          bash scripts/check-residues.sh
          bash scripts/check-axiom-sweep.sh
          bash scripts/check-import-negative.sh
          bash scripts/check-import-hygiene.sh
          bash scripts/check-guards.sh

      - name: Advisory expert-review reports
        run: |
          bash scripts/check-vacuity.sh
          bash scripts/check-contradictions.sh
          bash scripts/check-review-surface.sh
          bash scripts/check-std-lint.sh
