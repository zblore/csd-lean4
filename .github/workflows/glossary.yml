# Builds and publishes the CSD glossary to GitHub Pages.
#
# Deliberately separate from ci.yml and deliberately Lean-free: this job needs
# only Python and PyYAML, so it runs in seconds. The Lean build is minutes and a
# doc-gen4 job would be longer still; tying the glossary to either would mean the
# published prose lags the source it is generated from.
#
# The generated site is NOT committed. It is built here on every push and handed
# straight to Pages. Committing generated HTML is what lets a site and its source
# disagree, which is the failure this whole layer exists to prevent.
#
# check-glossary.sh runs BEFORE the generator and fails the job on any hard
# finding: a dead theorem anchor, a schema violation, or a one-way link between a
# Lean header and the glossary. Nothing reaches the public URL that does not
# currently resolve against the Lean tree in the same commit.
name: Glossary

on:
  push:
    branches: [main]
    paths:
      - 'docs/glossary.yaml'
      - 'scripts/check-glossary.sh'
      - 'scripts/gen-glossary.sh'
      - 'scripts/lib/gen_glossary.py'
      - 'CsdLean4/**'          # header links and theorem anchors live here
      - '.github/workflows/glossary.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Do not cancel one in flight: a half-published
# glossary is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check glossary anchors
        run: bash scripts/check-glossary.sh

      - name: Generate site
        run: bash scripts/gen-glossary.sh

      # GLOSSARY.md is regenerated by the generator. If it differs from what was
      # committed, the committed index is stale -- fail loudly rather than publish
      # a site that disagrees with the repo's own index layer.
      - name: Verify committed index is current
        run: |
          if ! git diff --quiet -- GLOSSARY.md; then
            echo "GLOSSARY.md is out of date. Run: bash scripts/gen-glossary.sh"
            git diff -- GLOSSARY.md
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
