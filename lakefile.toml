name = "csd-lean4"
defaultTargets = ["CsdLean4"]

# Kill accidental implicit binders (CONVENTIONS.md §8.4, BACKLOG hardening row).
# With autoImplicit ON, an unresolved identifier in a signature is silently
# auto-bound as a new implicit variable instead of erroring — so a typo or a
# missing namespace qualifier becomes a silent generalisation. Landed 2026-07-31
# after `CPN N` (needing `LF4.CPN N`) was auto-bound rather than reported, which
# surfaced as a cascade of unrelated elaboration errors.
# Package-level so it applies to BOTH lean_lib targets, tests included.
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

# Pin Mathlib to a specific commit for reproducible builds.
# Bump in lockstep with `lean-toolchain` (currently v4.33.0).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

# Library target: LF1–LF5 + Empirical + Mathlib upstream-tracking.
# Consumers `import CsdLean4` or `import CsdLean4.Basic` get the full
# development. `CsdLean4.Basic` is listed as an explicit root because it is
# not imported by the root module (it imports the root, not vice versa) —
# without this it would sit outside the build graph and CI would never
# check it (which is how its import list silently rotted pre-2026-06-11).
# The Tests/ subtree is excluded from this target.
[[lean_lib]]
name = "CsdLean4"
roots = ["CsdLean4", "CsdLean4.Basic"]

# Test target: AxiomAudit regression suite (`#guard_msgs` pins on
# `#print axioms` for every headline theorem), Examples worked
# computations, and the Witnesses concrete-witness suite (explicit
# nontrivial inhabitants of the assumption packages, driven through the
# headline chains — specs/validation-hardening-plan.md). Build with
# `lake build CsdLeanTests`. CI exercises both targets (see
# `.github/workflows/ci.yml`); drift detection requires this target to
# be built, not just the library.
[[lean_lib]]
name = "CsdLeanTests"
roots = [
  "CsdLean4.Tests.AxiomAudit",
  "CsdLean4.Tests.Examples",
  "CsdLean4.Tests.Witnesses",
]
